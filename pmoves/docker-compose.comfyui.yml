# ComfyUI render engine — SELF-HOST config (PMOVES.AI runs its own fleet GPUs).
#
# Runtime is a deliberate, node-impedance-matched choice — pipeline consumers
# target ${COMFYUI_URL:-http://comfyui:8188}, so ComfyUI can run EITHER as this
# containerized service OR as a host app, without changing the pipeline:
#
#   * 5090 (32GB, image/video workhorse): run THIS service —
#       make -C pmoves comfyui-up        (profile: creator)
#   * 4090 workstation: skip this service, run ComfyUI via Pinokio/desktop and
#     set COMFYUI_URL=http://host.docker.internal:8188 (host-gateway wired below).
#
# De-RunPod: builds from upstream source (services/comfyui/Dockerfile) instead
# of the vendor `runpod/comfyui` image. GPU image — validate the build on-node.
# See pmoves/docs/handoffs/creator-comfyui-selfhost-config-2026-06-24.md.
services:
  comfyui:
    # Default: locally-built self-host image. Override COMFYUI_IMAGE to pin a
    # pre-built GHCR tag, or comment out `build:` to use a vetted external image.
    image: ${COMFYUI_IMAGE:-ghcr.io/powerfulmoves/pmoves-comfyui:pmoves-latest}
    build:
      context: ./services/comfyui
      dockerfile: Dockerfile
      args:
        COMFYUI_REF: ${COMFYUI_REF:-v0.3.40}
    restart: unless-stopped
    # ComfyUI pulls custom-node deps from the internet on first run; the
    # host-gateway also lets sibling services reach a host/Pinokio ComfyUI.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
    ports:
      - "${COMFYUI_HOST_PORT:-8188}:8188"
    volumes:
      # Persist heavy/stateful surfaces as SUBPATHS only — never mount over
      # /opt/ComfyUI (that would hide the baked source). Outputs are also
      # shipped to MinIO by comfy-watcher.
      - comfyui-models:/opt/ComfyUI/models
      - comfyui-output:/opt/ComfyUI/output
      - comfyui-input:/opt/ComfyUI/input
      - comfyui-custom-nodes:/opt/ComfyUI/custom_nodes
      - comfyui-user:/opt/ComfyUI/user
    profiles: ["creator"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [compute, utility]
              count: ${GPU_COUNT:-all}
    networks: [api_tier, data_tier, external_tier]

networks:
  api_tier:
    external: true
    name: pmoves_api
  data_tier:
    external: true
    name: pmoves_data
  external_tier:
    external: true
    name: pmoves_external

volumes:
  comfyui-models: {}
  comfyui-output: {}
  comfyui-input: {}
  comfyui-custom-nodes: {}
  comfyui-user: {}
