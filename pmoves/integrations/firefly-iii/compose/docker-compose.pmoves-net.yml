services:
  # Overlay compose extension point for PMOVES-Wealth integration.
  # Keep service wiring in root compose files; use this file for integration-local deltas.
  firefly-wealth-overlay:
    image: alpine:3.20
    command: ["/bin/sh", "-lc", "echo firefly overlay placeholder"]
    profiles: ["pmoves-integration-placeholder"]
    networks:
      - pmoves_app

networks:
  pmoves_app:
    external: true
