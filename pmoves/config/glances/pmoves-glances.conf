# PMOVES Glances configuration -- used by `make -C pmoves glances-fetch` (-C).
# Runbook: pmoves/docs/operations/GLANCES_RUNBOOK.md
#
# Purpose: keep host addresses and cloud metadata out of every PMOVES-driven
# Glances run. Glances honours `disable=True` in any plugin section
# (glances/main.py _disable_plugins_from_config, 4.5.7; upstream config docs:
# https://glances.readthedocs.io/en/develop/config.html).
#
# Everything not set here falls back to Glances' built-in defaults.
# ASCII only (Glances reads config with the platform default encoding).

[global]
# Release is pinned (glances>=4.5.7,<4.6); no PyPI version check from fleet nodes.
check_update=false

[ip]
# The ip plugin reports local and (via a public web API) public addresses.
disable=True

[cloud]
# Probes cloud-provider metadata endpoints; never useful on fleet nodes.
disable=True

[connections]
# TCP connection states -- not needed for a sitrep.
disable=True
