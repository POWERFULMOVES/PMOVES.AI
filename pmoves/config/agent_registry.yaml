      checkpoint_frequency: per_wave
      recovery_strategy: cipher_resumable
      cipher_categories:
        - agent_plan
        - agent_checkpoint
        - agent_completion
    topology:
      # The node this identity IS. `kilocode_glm` sets the precedent for an agent
