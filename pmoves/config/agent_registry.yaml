# ── MCP Server Registry ─────────────────────────────────────────────────────
# Root-level MCP servers that can be bound into room manifests as skills.
# Endpoints are resolved at runtime via env.shared; status reflects compose
# integration readiness. `action_namespace` matches room.manifest app entries.
mcp_servers:
  pmoves_cipher_mcp:
    name: "pmoves-cipher-mcp"
    submodule: "pmoves-cipher-mcp"
    class: utility
    transport: "sse"
    endpoint: "${PMOVES_CIPHER_MCP_ENDPOINT:-http://pmoves-cipher-mcp:8080/sse}"
    action_namespace: "mcp.v1.cipher"
    capabilities: ["cipher", "chit", "announce", "health"]
    rooms: ["z890-infra.room.fabric"]
    # grounding_source: a discovering agent fetches startup grounding here
    # (Cipher Memory = agent_plan/checkpoint/completion + CHIT trail). See §4a
    # of docs/superpowers/specs/2026-06-26-voice-agents-design.md and
    # pmoves/docs/voice/S1C_DISCOVERY_NAMING_MAP.md.
    grounding_source: true
    status: "planned"

  pmoves_e2b_mcp:
    name: "pmoves-e2b-mcp-server"
    submodule: "pmoves-e2b-mcp-server"
    class: utility
    transport: "sse"
    # endpoint intentionally absent: status is `planned`, and no compose service
    # serves this. The shipped server (see pmoves_e2b_mcp_server) is stdio-only -
    # its Dockerfile has no EXPOSE and its entrypoint speaks stdio. Publishing
    # http://pmoves-e2b-mcp:8080/sse here made the registry assert an address
    # nothing answers on, while the sibling entry said `port: null`. Restore an
    # endpoint here only when something actually listens.
    endpoint: null
    action_namespace: "mcp.v1.e2b"
    capabilities: ["sandbox", "execution", "artifacts"]
    rooms: ["4090-field.room.control", "hermes-agent.room.control"]
    status: "planned"

  pmoves_hirag_mcp:
    name: "pmoves-hirag-mcp"
    submodule: "pmoves-hirag-mcp"
    class: utility
    transport: "stdio"
    # No endpoint: a stdio bridge is launched by the client, not dialled.
    # See .claude/mcp.json for the command, and the submodule README.
    action_namespace: "mcp.v1.hirag"
    capabilities: ["retrieve", "graph", "search", "notebook"]
    rooms: ["4090-field.room.control", "hermes-agent.room.control"]
    # grounding_source: a discovering agent fetches startup grounding here
    # (Hi-RAG hybrid vector+graph+full-text retrieval). See §4a of
    # docs/superpowers/specs/2026-06-26-voice-agents-design.md and
    # pmoves/docs/voice/S1C_DISCOVERY_NAMING_MAP.md.
    grounding_source: true
    # Active: pmoves-hirag-mcp is wired into .claude/mcp.json (stdio, followups-v1
    # commit 6). The container is built by the PMOVES-HiRAG + pmoves-hirag-mcp
    # submodules and published on PMOVES.AI-Edition-Hardened; see the
    # `services.pmoves_hirag_mcp` field in pmoves/contracts/schemas/pmoves-bootstrap/
    # v1.schema.json for the typed service block that the bootstrap CGP profile
    # uses to reference it.
    status: "active"

  pmoves_nats_mcp:
    name: "pmoves-nats-mcp"
    # FIRST-PARTY, in-repo — not a submodule. Verified: regular blobs in the
    # index (100644), no entry in .gitmodules. It was declared as `submodule:`
    # which made `git submodule update --init` look like a prerequisite when
    # there is nothing to init.
    path: "pmoves-nats-mcp"
    class: utility
    # stdio, NOT sse. server.py uses mcp.server.stdio.stdio_server() and the
    # Dockerfile says so outright: "The MCP is stdio (client-spawned); this image
    # is for CI / reproducible runs and a future HTTP/SSE transport."
    # The previous `transport: sse` + `endpoint: http://pmoves-nats-mcp:8080/sse`
    # described a server that does not exist: nothing listens on 8080, and no
    # compose file defines that host. Removed rather than left pointing at air.
    transport: "stdio"
    # No endpoint: a stdio bridge is launched by the client, not dialled.
    # See .claude/mcp.json for the command.
    action_namespace: "mcp.v1.nats"
    capabilities: ["publish", "subscribe", "jetstream", "health"]
    rooms: ["z890-infra.room.fabric", "hermes-agent.room.control"]
    # Code exists and is wired into .claude/mcp.json for direct client use.
    # Not deployed as a service, and cannot be until an HTTP/SSE transport is
    # added — the Dockerfile calls that "future".
    status: "active-stdio-only"

  pmoves_tailscale_mcp:
    name: "pmoves-tailscale-mcp"
    # FIRST-PARTY, in-repo — not a submodule (same defect as pmoves_nats_mcp).
    path: "pmoves-tailscale-mcp"
    class: utility
    # stdio, NOT sse — tailscale_mcp/server.py uses stdio_server(). The old
    # endpoint pointed at a host no compose file defines.
    # NOTE: .claude/mcp.json currently wires the npm package `tailscale-mcp`,
    # not this first-party module, so the two are not yet the same thing.
    transport: "stdio"
    action_namespace: "mcp.v1.tailscale"
    capabilities: ["network", "devices", "authkeys", "tailnet"]
    rooms: ["z890-infra.room.fabric"]
    status: "active-stdio-only"

  # Voice discovery shim (S1c, §4a "two planes, one join key"). Makes the voice
  # capability reachable through the same agent_registry → room plane as every
  # other capability. flute-gateway is the backing provider; the `resolves` join
  # bridges this discovery plane to the voice_profiles TRUTH plane (v5_16) by the
  # voice `name` slug. Truth + routing (engine_specific, RLS, media) stays in
  # pmoves_core.voice_profiles — this shim is intentionally thin.
  pmoves_voice_mcp:
    name: "pmoves-voice-mcp"
    submodule: null
    class: utility
    transport: "sse"
    endpoint: "${PMOVES_VOICE_MCP_ENDPOINT:-http://flute-gateway:8055/sse}"
    action_namespace: "mcp.v1.voice"
    capabilities: ["voice", "tts", "voice-select", "clone"]
    rooms: ["5090-voice.room.studio"]
    # resolves: NET-NEW join from this discovery entry to the voice truth plane.
    # A runtime resolves an agent-selected voice slug against the registry table.
    resolves:
      registry: supabase
      table: pmoves_core.voice_profiles
      by: name
    status: "planned"

  # PMOVES-MiniMax-MCP — text/image/video/TTS/voice-clone over MCP. Submodule
  # (POWERFULMOVES/PMOVES-MiniMax-MCP, f4d6a61b on main) folds the upstream
  # MiniMax model surface into one stdio server; `uvx minimax-mcp` is the
  # entry point declared in the submodule's pyproject.toml. stdio (not SSE)
  # matches the upstream server's design. The harness v0 follow-ups
  # (pmoves/configs/submodule_skill_registry.json:770) register the skill
  # surface [mcp/connect, mcp/list-tools, mcp/invoke]; this entry is the
  # discovery-plane twin that lets rooms and rooms-tools find it by name.
  pmoves_minimax_mcp:
    name: "PMOVES-MiniMax-MCP"
    submodule: "PMOVES-MiniMax-MCP"
    class: utility
    transport: "stdio"
    command: "uvx"
    args: ["minimax-mcp"]
    env:
      MINIMAX_API_KEY: "${MINIMAX_API_KEY}"
      MINIMAX_API_HOST: "${MINIMAX_API_HOST:-https://api.minimax.io}"
      MINIMAX_API_RESOURCE_MODE: "${MINIMAX_API_RESOURCE_MODE:-url}"
    action_namespace: "mcp.v1.minimax"
    capabilities: ["text", "image", "video", "tts", "voice-clone", "video-gen"]
    rooms: ["z890-infra.room.fabric", "hermes-agent.room.control", "darkxsides.room"]
    # grounding_source: a discovering agent fetches startup grounding here
    # (MiniMax model surface: text/image/video/TTS/voice-clone via the
    # PMOVES-MiniMax-MCP server). See §4a of
    # docs/superpowers/specs/2026-06-26-voice-agents-design.md and
    # pmoves/docs/voice/S1C_DISCOVERY_NAMING_MAP.md.
    grounding_source: true
    status: "active"

# ── A2A Server Registry ─────────────────────────────────────────────────────
a2a_servers:
  agent_zero_a2a:
    name: "Agent Zero A2A"
    agent_id: "agent_zero"
    endpoint: "${A2A_AGENT_ZERO_ENDPOINT:-http://agent-zero:8080}"
    discovery_path: "/.well-known/agent-card.json"
    tasks_path: "/a2a/v1/tasks"
    auth: "supabase_jwt"
    enabled_by_default: false
    status: "active"
