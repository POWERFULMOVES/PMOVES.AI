      node_affinity:
        - laptop-4090
      team: orchestration
      ci_runner: ai-lab
      compose_profile: null
    description: >-
      Claude Code CLI identity on the laptop-4090 node. Operates the PMOVES stack
      from the terminal -- review, merge, secrets funnel, service bring-up -- and
      drives Agent Zero and Archon rather than being driven by them. Launched via
      `claude-pmoves`, which supplies the MCP roster (incl. Cipher) and a role
      agent; this entry supplies the node identity that pairing was missing.
  claude_b850:
    name: "B850 Claude"
    class: standard
    # Mirrors claude_4090, which mirrors `crush`: the surface a human drives is a
    # UI; what it drives is an agent. Same harness family, same shape.
    primary_type: ui
    secondary_type: agent
    # No listening socket. A CLI session, not a service.
    port: null
    health: null
    layers:
      - L0
      - L2
      - L4
    evolution_stage: stage_1
    # `b850-claude` was ALREADY in external_contributors before this change -- the
    # attribution half has existed all along, only the operational half was
    # missing. Same split #2739 found for 4090: that list is the SIGNING roster and
    # is referenced outside this repo, so the name stays there and this points at
    # it rather than moving it.
    signature: b850-claude
    # Deliberately empty. This session publishes nothing to NATS today, and
    # declaring subjects it does not publish is the defect #2734 exists to fix.
    nats:
      publishes: []
      subscribes: []
    topology:
      # `pmoves-b850` is the spelling the registry already uses for this machine
      # (hermes_agent claims it the same way). node-vocabulary.yaml canonicalises
      # it to `knuckles`, so either resolves -- this matches the existing rows.
      node_affinity: [pmoves-b850]
      team: orchestration
