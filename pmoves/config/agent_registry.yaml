# PMOVES Agent Registry — Single Source of Truth
# Last updated: 2026-07-02
#
# This file encodes every agent's class, type(s), tier, layers,
# NATS subjects, health endpoint, CHIT toggles, and evolution stage.
#
# Query with: python -m pmoves.tools.agent_taxonomy_helper list
# Docs: pmoves/docs/AGENTS/PMOVES_AGENT_CLASS_TAXONOMY.md

taxonomy_version: "1.5.0"

# External contributors — AI agents and humans who contribute via git
# Links to visual identity in agent_signatures.yaml
external_contributors:
  - hermes-agent
  - claude-opus
  - kilocode
  - codex
  - agent-zero-codex
  - hermes
  - coder_claw
  - gemini
  - cline
  - powerfulmoves
  - crush
  - z890-claude
  - 5090-claude
  - 4090-claude
  - b850-claude
  - botz-architect
  - botz-builder
  - botz-auditor

# Resilience attribute definitions
# See: pmoves/docs/AGENTS/AGENT_RESILIENCE_PATTERNS.md
resilience_classes:
  small:
    token_budget: 25000
    description: "Single-file fixes, health checks"
  medium:
    token_budget: 50000
    description: "Multi-file changes within one repo"
  large:
    token_budget: 100000
    description: "Cross-repo orchestration, complex refactors"

# Class definitions
classes:
  legendary:
    prefix: "POWERFULMOVES"
    description: "Organization/brand umbrella, doctrine"
  standard:
    prefix: "PMOVES-"
    description: "Core production agents and services"
  specialized:
    prefix: "Pmoves-"
    description: "Domain-specific agents with focused capabilities"
  utility:
    prefix: "pmoves-"
    description: "Infrastructure components, helpers, tools"

# Type definitions (from 7 canonical service tiers)
types:
  data:   { tier: 1, element: "Earth",    color: "#8B4513" }
  api:    { tier: 2, element: "Water",    color: "#4169E1" }
  llm:    { tier: 3, element: "Fire",     color: "#DC143C" }
  worker: { tier: 4, element: "Electric", color: "#FFD700" }
  media:  { tier: 5, element: "Wind",     color: "#00CED1" }
  agent:  { tier: 6, element: "Psychic",  color: "#9370DB" }
  ui:     { tier: 7, element: "Light",    color: "#F5F5F5" }

# Role classes — ORCHESTRATION roles (P0 Agent Role Consolidation,
# ARCHON_ENHANCEMENT_ROADMAP §2). Orthogonal to `types` (service tiers) and
# `classes` (naming prefixes): role_class says what an agent does in a
# multi-agent workflow, not where it runs or what it's named.
#
# NAMING COLLISION GUARD: the `worker` ROLE below is unrelated to the
# `worker` TYPE (tier 4) above. Never conflate them; the type system is
# untouched by this addition.
#
# The trio maps onto the AGNOTE4482 Three-Body enforcement surface
# (.claude/agents/{delivery,control,memory}-agent.md disallowedTools):
# planner and reviewer are the pre-work and post-work faces of the Control
# Body; worker is the Delivery Body; the Memory Body is orthogonal
# (cross-cutting CHIT/Cipher custody, not a workflow role).
role_classes:
  planner:
    three_body: control
    phase: pre-work
    description: "Decomposes intent into scoped work: specs, plans, lane claims. Read-heavy; produces no production edits."
  worker:
    three_body: delivery
    phase: execution
    description: "Implements the plan: code, fixes, docs, deploys. The only role_class that writes production changes."
  reviewer:
    three_body: control
    phase: post-work
    description: "Verifies and gates: review, evaluation gates, merge sequencing, Village Rule signoff. Never edits what it reviews."

# Optional per-agent key: `role_class: planner|worker|reviewer` on any
# entry below or in .claude/agents/*.md frontmatter. Absence = unclassified
# (legacy), never an error.

