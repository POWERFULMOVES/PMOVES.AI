# PMOVES Agent Registry — Single Source of Truth
# Last updated: 2026-02-17
#
# This file encodes every agent's class, type(s), tier, layers,
# NATS subjects, health endpoint, CHIT toggles, and evolution stage.
#
# Query with: python -m pmoves.tools.agent_taxonomy_helper list
# Docs: pmoves/docs/AGENTS/PMOVES_AGENT_CLASS_TAXONOMY.md

taxonomy_version: "1.4.0"

# External contributors — AI agents and humans who contribute via git
# Links to visual identity in agent_signatures.yaml
external_contributors:
  - claude-opus
  - kilocode
  - codex
  - gemini
  - cline
  - powerfulmoves
  - crush

# Resilience attribute definitions
# See: pmoves/docs/AGENTS/AGENT_RESILIENCE_PATTERNS.md
resilience_classes:
  small:
    token_budget: 25000
    description: "Single-file fixes, health checks"
  medium:
    token_budget: 50000
    description: "Multi-file changes within one repo"
  large:
    token_budget: 100000
    description: "Cross-repo orchestration, complex refactors"

# Class definitions
classes:
  legendary:
    prefix: "POWERFULMOVES"
    description: "Organization/brand umbrella, doctrine"
  standard:
    prefix: "PMOVES-"
    description: "Core production agents and services"
  specialized:
    prefix: "Pmoves-"
    description: "Domain-specific agents with focused capabilities"
  utility:
    prefix: "pmoves-"
    description: "Infrastructure components, helpers, tools"

# Type definitions (from 7 canonical service tiers)
types:
  data:   { tier: 1, element: "Earth",    color: "#8B4513" }
  api:    { tier: 2, element: "Water",    color: "#4169E1" }
  llm:    { tier: 3, element: "Fire",     color: "#DC143C" }
  worker: { tier: 4, element: "Electric", color: "#FFD700" }
  media:  { tier: 5, element: "Wind",     color: "#00CED1" }
  agent:  { tier: 6, element: "Psychic",  color: "#9370DB" }
  ui:     { tier: 7, element: "Light",    color: "#F5F5F5" }

# Agent entries
agents:
  agent_zero:
    name: "Agent Zero"
    class: standard
    primary_type: agent
    secondary_type: api
    port: 8080
    health: "/healthz"
    layers: [L0, L1, L2, L2.5, L3, L4, L5]
    evolution_stage: mega
    signature: "claude-opus"      # Primary architect — see agent_signatures.yaml
    nats:
      publishes: ["agent.tool.executed.v1"]
      subscribes: ["mesh.node.announce.v1"]
    chit_toggles:
      delta_sensitive: true
      kappa_sensitive: true
      hz_sensitive: true
      swarm_participant: true
      attribution_gated: true
    resilience:
      context_budget: large
      checkpoint_frequency: per_wave
      recovery_strategy: cipher_resumable
      cipher_categories: [agent_plan, agent_checkpoint, agent_completion]
    submodule: "PMOVES-Agent-Zero"
    description: "Primary L1 orchestrator with embedded agent runtime and MCP API"

