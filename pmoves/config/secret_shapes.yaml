# Secret SHAPE rules -- per-label prefix / length / charset for delivered keys.
#
# RULES ONLY. This file must never hold a value, a fragment of one, or an
# example key. It is tracked so a reviewer can see, without zero-access to the
# secrets manifest, which delivered credentials have a shape rule at all.
#
# Validated at load by pmoves/tools/secret_shape_rules.py (ShapeRuleSet). A
# malformed file fails loudly with exit 3 -- check it with
#   make -C pmoves secrets-shapes-check
#
# Enforced at funnel delivery by pmoves/tools/secrets_sync.py: a value that
# fails its rule is WITHHELD (removed from the generated tier files) and named
# with label, expected shape, observed length and prefix-match yes/no. These
# rules are applied IN ADDITION to any min_length/prefix the manifest entry
# carries; neither can loosen the other.
#
# length_source says where each number came from:
#   documented -- the provider's docs state the length or its components
#   example    -- length of the provider's own published example, used as a floor
#   floor      -- a conservative lower bound chosen HERE, not by the provider;
#                 catches gross truncation only. The trailing-truncation case is
#                 what `make -C pmoves secrets-provider-verify` exists for.
# No exact_length appears below: no provider in this set publishes one.
#
# charset: where marked "token alphabet", the pattern is NOT provider-documented.
# It is the URL/header-safe alphabet every key below is issued in, and exists to
# catch pasted quotes, spaces and punctuation. Non-ASCII lookalikes (em dash,
# NBSP, zero-width) are caught earlier, by secret_shape.inspect_value.
#
# Docs were fetched 2026-10-30 from the URLs cited per rule.
#
# NOT YET COVERED: the Tailscale node auth key (prefix `tskey-auth-`, documented
# at https://tailscale.com/kb/1252/key-secret-management). Its label matches a
# zero-access path pattern in the damage-control guard, so it could not be
# written from an agent session; add it by hand alongside TAILSCALE_API_KEY.
version: 1
rules:
  # Hugging Face user access token. Docs show the form `hf_...`; no length is
  # published.
  - label: HF_TOKEN
    prefixes: ["hf_"]
    min_length: 30
    length_source: floor
    charset: "^[A-Za-z0-9_]+$"  # token alphabet
    docs:
      - https://huggingface.co/docs/hub/security-tokens

  # Anthropic API key. The Admin API documents keys by their hint, e.g.
  # `partial_key_hint: "sk-ant-api03-R2D...igAA"`; admin keys use
  # `sk-ant-admin01-`. `sk-ant-` covers both. No length is published.
  - label: ANTHROPIC_API_KEY
    prefixes: ["sk-ant-"]
    min_length: 50
    length_source: floor
    charset: "^[A-Za-z0-9_-]+$"  # token alphabet
    docs:
      - https://docs.anthropic.com/en/api/admin-api/apikeys/get-api-key
      - https://docs.anthropic.com/en/api/models-list

  # OpenAI API key. The official OpenAPI spec documents redacted keys as
  # `sk-abc...def` (project keys) and `sk-admin...xyz` (admin keys). Current
  # project keys are issued as `sk-proj-` and legacy user keys as bare `sk-`;
  # the spec documents only `sk-`, so that is the rule. No length is published.
  # platform.openai.com/docs answers HTTP 403 to non-browser clients, so the
  # spec in openai/openai-openapi is the citable source.
  - label: OPENAI_API_KEY
    prefixes: ["sk-"]
    min_length: 40
    length_source: floor
    charset: "^[A-Za-z0-9_-]+$"  # token alphabet
    docs:
      - https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml
      - https://platform.openai.com/docs/api-reference/authentication

  # Gemini API key == a Google Cloud API key. Google documents the key string
  # only by example: an `AIzaSy...` string of 39 characters (not reproduced
  # here -- this file holds no key-shaped strings, not even published ones).
  # An example is not a specification, so 39 is a floor, not an exact length.
  - label: GEMINI_API_KEY
    prefixes: ["AIza"]
    min_length: 39
    length_source: example
    charset: "^[A-Za-z0-9_-]+$"  # token alphabet
    docs:
      - https://cloud.google.com/docs/authentication/api-keys
      - https://ai.google.dev/gemini-api/docs/api-key

  # GitHub token prefixes are documented in "GitHub's token formats":
  # ghp_ = PAT (classic), github_pat_ = fine-grained PAT, gho_ = OAuth access
  # token, ghu_ = GitHub App user access token, ghs_ = GitHub App installation
  # token. The token-format post documents the classic form as prefix + 30
  # base62 characters + a 6-character checksum, i.e. 40, in base62 plus `_`.
  # 40 is therefore documented for the ghp_/gho_/ghu_ family and a floor for
  # the longer github_pat_ and ghs_ forms.
  #
  # GITHUB_PAT is NOT only a PAT on this fleet, whatever its name says.
  # tools/inject_github_pat_from_gh_cli.py writes `gh auth token` into it, and
  # after `gh auth login`'s default browser flow that is an OAuth token (gho_);
  # `make gha-token-refresh` does this on a timer and then funnels. Refusing
  # gho_ here would strip github-runner-ctl of its credential on the next
  # refresh. ghu_ is admitted because gh's `--expiring` login can yield an
  # expiring credential and its prefix is not documented in the gh manual --
  # the GitHub App user-token prefix is the documented expiring user token.
  - label: GITHUB_PAT
    prefixes: ["ghp_", "github_pat_", "gho_", "ghu_"]
    min_length: 40
    length_source: documented
    charset: "^[A-Za-z0-9_]+$"
    docs:
      - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github
      - https://github.blog/engineering/platform-security/behind-githubs-new-authentication-token-formats/
      - https://cli.github.com/manual/gh_auth_login

  # GH_TOKEN is the gh CLI's variable: `gh auth token` yields gho_ (or ghu_),
  # and in GitHub Actions it is conventionally set to GITHUB_TOKEN, an
  # installation token (ghs_). Since 2026-04-27 GitHub has been rolling out a
  # stateless installation-token format, `ghs_APPID_JWT`, which is no longer
  # 40 characters and carries JWT punctuation -- so `.` and `-` are admitted
  # for ghs_ ONLY; every other GitHub form keeps the base62 + `_` alphabet.
  - label: GH_TOKEN
    prefixes: ["ghp_", "github_pat_", "gho_", "ghu_", "ghs_"]
    min_length: 40
    length_source: documented
    charset: "^[A-Za-z0-9_]+$"
    prefix_charsets:
      ghs_: "^[A-Za-z0-9_.-]+$"
    docs:
      - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github
      - https://github.blog/engineering/platform-security/behind-githubs-new-authentication-token-formats/

  # GHCR. The Container registry page says "GitHub Packages only supports
  # authentication using a personal access token (classic)" -- and the SAME
  # page then tells Actions users to authenticate with GITHUB_TOKEN, an
  # installation token (ghs_). So "only" is not literal, and the page does not
  # explicitly exclude OAuth tokens either; scripts/ghcr_login.sh already falls
  # back to `gh auth token` (gho_). The prefix rule therefore admits every
  # GitHub user/app token form and catches only truncation and corruption.
  # Whether a token can actually pull is decided by the read:packages scope
  # check in secrets-provider-verify, which is the authority here.
  - label: GHCR_TOKEN
    prefixes: ["ghp_", "github_pat_", "gho_", "ghu_", "ghs_"]
    min_length: 40
    length_source: documented
    charset: "^[A-Za-z0-9_]+$"
    prefix_charsets:
      ghs_: "^[A-Za-z0-9_.-]+$"  # stateless installation token (JWT); see GH_TOKEN
    docs:
      - https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry
      - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github

  # Tailscale API access token. "Each type of Tailscale-generated key contains
  # a key prefix ... such as tskey-api for API access tokens". Case-sensitive.
  # No length is published.
  - label: TAILSCALE_API_KEY
    prefixes: ["tskey-api-"]
    min_length: 30
    length_source: floor
    charset: "^[A-Za-z0-9-]+$"  # token alphabet
    docs:
      - https://tailscale.com/kb/1252/key-secret-management
