# AI Graphiti — Agent Signature Registry
# Visual identity companion to agent_registry.yaml
# Last updated: 2026-02-17
#
# Each external contributor (AI agent or human) gets a unique glyph,
# color palette, voice descriptor, and resonance domains.
# Used by: trail entries, NATS graphiti events, CGP v2 attribution.
#
# Rules:
#   - Glyphs must be a single Unicode character, unique per contributor
#   - Colors must be distinguishable in both light and dark themes
#   - Colors must meet WCAG AA contrast ratio against #FFFFFF and #1a1a2e
#   - Voice guides how the contributor writes doc sections
#   - co_author must match the exact git Co-Authored-By string

