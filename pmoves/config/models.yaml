# =============================================================================
# PMOVES.AI Local Model Catalog
# =============================================================================
# Master catalog of local models with Hugging Face mappings, hardware
# requirements, and recommended use cases for BoTZ framework.
#
# Model Tiers:
#   - small: 3B-8B parameters, runs on CPU/edge devices
#   - medium: 7B-14B parameters, requires single GPU
#   - large: 30B-70B parameters, requires multi-GPU (tensor parallelism)
#   - xlarge: 70B+ parameters, requires multi-GPU cluster
#
# Backends:
#   - ollama: GGUF quantized models via Ollama
#   - vllm: Full precision models via vLLM
#   - llama_cpp: GGUF via llama.cpp directly
#   - transformers: Hugging Face Transformers
#
# Uses:
#   - orchestrator: Complex reasoning and task planning
#   - coding: Code generation and analysis
#   - utility: Fast simple tasks
#   - vl_sentinel: Vision-language processing
#   - embeddings: Text embedding generation
#   - hirag_rerank: RAG reranking
#   - research: Deep research tasks
# =============================================================================

models:
  # ===========================================================================
  # Small Models (3B-8B) - CPU/Edge
  # ===========================================================================
  small:
    # Phi-3 Mini: Fast, efficient, 128K context
    - name: phi3-mini
      hf_id: microsoft/Phi-3-mini-128k-instruct
      variants: [q4_0, q4_k_m, q5_0, q8_0, f16]
      backends: [ollama, vllm]
      context: 128000
      uses: [utility, edge]
      params: 3.8B
      vram_min: 8GB
      ollama_name: phi3:3.8b-mini-128k-instruct
      vllm_name: microsoft/Phi-3-mini-128k-instruct
      hf_url: https://huggingface.co/microsoft/Phi-3-mini-128k-instruct

    # Gemma 2 2B: Google's efficient small model
    - name: gemma-2-2b
      hf_id: google/gemma-2-2b-it
      variants: [q4_0, f16]
      backends: [ollama, vllm]
      context: 8192
      uses: [utility]
      params: 2B
      vram_min: 4GB
