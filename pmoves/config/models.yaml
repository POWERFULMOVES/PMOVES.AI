# =============================================================================
# Quantization Variants
# =============================================================================
# GGUF quantization types for memory-efficient inference
#
# q4_0:    4-bit, 3.5 GB for 7B (fastest, lowest quality)
# q4_k_m:  4-bit K-quant, medium, 4.0 GB for 7B (recommended balance)
# q5_0:    5-bit, 4.3 GB for 7B (better quality)
# q5_k_m:  5-bit K-quant, medium, 4.5 GB for 7B
# q8_0:    8-bit, 7.0 GB for 7B (near-fp16 quality)
# f16:     16-bit float, 14 GB for 7B (full precision)
# =============================================================================

quantization:
  q4_0:
    bits: 4
    size_gb_per_7b: 3.5
    description: "Fastest 4-bit, lowest quality"
    recommended_for: [edge, cpu]

  q4_k_m:
    bits: 4
    size_gb_per_7b: 4.0
    description: "K-quant medium, recommended balance"
    recommended_for: [edge, cpu, gpu]

  q5_0:
    bits: 5
    size_gb_per_7b: 4.3
    description: "5-bit, better quality"
    recommended_for: [gpu]

  q5_k_m:
    bits: 5
    size_gb_per_7b: 4.5
    description: "K-quant medium, better quality"
    recommended_for: [gpu]

  q8_0:
    bits: 8
    size_gb_per_7b: 7.0
    description: "Near-fp16 quality"
    recommended_for: [gpu]

  f16:
    bits: 16
    size_gb_per_7b: 14.0
    description: "Full precision"
    recommended_for: [gpu, vllm]

# =============================================================================
# Hardware Profiles
# =============================================================================
# Recommended models based on available hardware
# =============================================================================

hardware_profiles:
  cpu_only:
    description: "CPU-only inference (slow but functional)"
    recommended_models:
      - phi3-mini:q4_0
      - gemma-2-2b:q4_0
      - qwen2.5-3b:q4_0
    max_params: 3B
    uses: [utility]

  edge:
    description: "Edge devices (Jetson, Raspberry Pi with accelerator)"
    recommended_models:
      - phi3-mini:q4_0
      - gemma-2-2b:q4_0
    max_params: 3B
    max_vram: 8GB
    uses: [utility, edge]

  gamer_gpu:
    description: "Single consumer GPU (RTX 3060-4090, 12-24GB VRAM)"
    recommended_models:
      - qwen2.5-7b:q4_k_m
      - qwen2.5-14b:q4_k_m
      - llama3.1-8b:q4_k_m
      - qwen2.5-coder-7b:q4_k_m
    max_params: 14B
    max_vram: 24GB
    uses: [orchestrator, coding, utility]

  ai_workstation:
    description: "AI workstation (RTX 5090, A6000, 32-48GB VRAM)"
    recommended_models:
      - qwen2.5-14b:q8_0
      - qwen2.5-32b:q4_0
      - qwen3-8b:q8_0
    max_params: 32B
    max_vram: 48GB
    uses: [orchestrator, coding, research]

  multi_gpu:
    description: "Multi-GPU server (2-4x A100/H100)"
    recommended_models:
      - qwen2.5-32b:q8_0
      - qwen2.5-72b:q4_0
      - mixtral-8x22b:q4_0
    max_params: 141B
    min_gpus: 2
    uses: [research, coordinator]
