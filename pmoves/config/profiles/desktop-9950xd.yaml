id: desktop-9950xd
name: "Desktop – AMD 9950XD / RTX 5090"
description: >
  High-end workstation with Ryzen 9 9950XD, RTX 5090, 192GB RAM. Preferred for full
  PMOVES stack, GPU inference (vLLM), and heavy media pipelines.
# Deployment audience (pmoves/config/deployment_classes.yaml); unset means
# unset — loaders must not guess a class for a node they cannot place.
deployment_class: private-mesh

hardware:
  cpu:
    vendor: AMD
    model: Ryzen 9 9950XD
    cores: 16
    threads: 32
  gpu:
    type: nvidia
    models: ["RTX 5090"]
    memory_gb: 32
  ram_gb: 192
  tags: [desktop, cuda, high-end]
compose_overrides:
  - docker-compose.gpu.yml
  - docker-compose.external.yml
model_bundles:
  - ollama-high
  - vllm-large
  - reranker-qwen-large
mcp:
  - docker
  - compose
  - host
  - telemetry

# Docker MCP Toolkit gateway profile for THIS node. Read by
# pmoves/tools/node_gateway_profile.py, which mcp-toolkit-connect.sh and
# mcp_config_generator.py use instead of the old literal `pmoves_5090_web`.
# Registered with `make -C pmoves mcp-toolkit-bootstrap`.
docker_mcp:
  gateway_profile: pmoves_5090_web
messaging:
  telegram: true
  discord: true
  whatsapp: true
  webrtc: true
notes:
  - Ensure NVIDIA Container Toolkit is installed.
  - Preferred local model set: Mixtral 8x7B (vLLM), Whisper-large-v3, Qwen reranker.
