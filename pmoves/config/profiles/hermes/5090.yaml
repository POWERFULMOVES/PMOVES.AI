# HERMES Agent Profile: 5090
# Hardware: RTX 5090 32GB, primary GPU workhorse
# Node: pmoves-5090
# Last updated: 2026-06-04

model:
  default: "ollama/hermes3:8b"
  provider: "ollama"
  base_url: "http://localhost:11434"
  fallback:
    provider: "openrouter"
    model: "nousresearch/hermes-3"
    base_url: "https://openrouter.ai/api/v1"
  auxiliary:
    vision:
      provider: "openrouter"
      model: "anthropic/claude-sonnet-4"

agent:
  max_turns: 90
  tool_use_enforcement: strict

terminal:
  backend: local
  shell: bash
  timeout: 300

toolsets:
  enabled:
    - web
    - terminal
    - file
    - browser
    - image_gen
    - vision
    - messaging
    - cronjob
    - delegation
    - skills
    - memory
    - rl
    - moa
    - video

tts:
  provider: elevenlabs
  voice: "Bella"
  fallback: edge

stt:
  enabled: true
  provider: local
  local:
    model: small

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: sqlite

delegation:
  model: "ollama/hermes3:8b"
  provider: ollama
  max_concurrent_children: 3
  max_iterations: 50

gateway:
  port: 7700
  health_endpoint: /api/health
  platforms:
    - discord
    - telegram
    - slack

nats:
  url: "nats://pmoves-nats:4222"
  subjects:
    publish:
      - hermes.gateway.launched.v1
      - hermes.gateway.health.v1
      - hermes.mcp.toolcall.v1
      - hermes.skill.curated.v1
      - hermes.cron.executed.v1
      - hermes.delegate.completed.v1
    subscribe:
      - p7.nats.launch
      - p7.nats.session
      - mesh.node.announce.v1

compression:
  enabled: true
  threshold: 0.55
  target_ratio: 0.25

display:
  skin: default
  tool_progress: true
  show_reasoning: true
  show_cost: true

security:
  redact_secrets: true
  approvals:
    mode: smart
