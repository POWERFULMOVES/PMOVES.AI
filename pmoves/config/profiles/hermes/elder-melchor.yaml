# ============================================================
# HERMES Agent Profile: Elder-Melchor / Ageless Beauty Practice
# ============================================================
# OWNER: Nurse Practitioner -- Ageless Beauty Medical Practice
# Processor: Intel Core i7-9750H @ 2.60GHz (6C/12T, laptop)
# RAM: 32.0 GB (31.7 GB usable)
# GPU: NVIDIA GeForce GTX 1650 4GB (lightweight inference only)
# Storage: 954 GB total, ~64% used
# OS: Windows 10 64-bit
# Network: Wi-Fi + Tailscale mesh
# Node type: Practice workstation -- cloud-first, HIPAA-aware
# Practice: Ageless Beauty (agelessbeauty.pmoves.ai)
# Profile Version: 2.0 (aligned with Hermes v0.18.2 schema)
# ============================================================

# === MODEL: Cloud-First (Z.AI primary, never touches local GPU) ===
model:
  default: zai-coding
  provider: zai

# === FALLBACK PROVIDERS: PMOVES cloud-first cascade ===
fallback_providers:
  - provider: kimi-coding
    model: kimi-k2.7-code
  - provider: minimax-oauth
    model: minimax-text-01
  - provider: openrouter
    model: nousresearch/hermes-3
  - provider: ollama-cloud
    model: hermes3:8b

# === CREDENTIAL POOL STRATEGIES ===
credential_pool_strategies:
  zai: fill_first
  kimi-coding: fill_first
  openrouter: round_robin
  alibaba: fill_first

# === AGENT SETTINGS ===
agent:
  max_turns: 50
  tool_use_enforcement: strict

# === TOOLSETS ===
toolsets:
  - web
  - terminal
  - file
  - browser
  - messaging
  - cronjob
  - skills
  - memory
  - vision
  - todo
  - delegation
  - session_search
  - clarify

# === TERMINAL ===
terminal:
  backend: local
  cwd: .
  timeout: 180
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env:
    - ZAI_API_KEY
    - KIMI_API_KEY
    - OPENROUTER_API_KEY

# === TTS / STT ===
tts:
  provider: edge
  edge:
    voice: en-US-AriaNeural

stt:
  enabled: true
  provider: local
  local:
    model: base

# === MEMORY ===
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: ""

# === DELEGATION ===
delegation:
  model: zai-coding
  provider: zai
  max_iterations: 30

# === COMPRESSION ===
compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20
  protect_last_n: 20

# === DISPLAY ===
display:
  skin: default
  show_reasoning: false
  show_cost: true
  personality: kawaii
  inline_diffs: true

# === SECURITY (HIPAA-aware) ===
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true

# === PRIVACY (HIPAA-aware — PII redaction for patient data) ===
privacy:
  redact_pii: true

# === APPROVALS ===
approvals:
  mode: smart
  timeout: 60

# === VOICE ===
voice:
  record_key: ctrl+b
  max_recording_seconds: 120
  auto_tts: false
  silence_threshold: 200
  silence_duration: 3.0

# === CHECKPOINTS ===
checkpoints:
  enabled: true
  max_snapshots: 50

# === FILE READ ===
file_read_max_chars: 100000

# === CRON ===
cron:
  wrap_response: true

# === DISCORD ===
discord:
  require_mention: true
  auto_thread: true
  reactions: true

# === BROWSER ===
browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: false

# === SMART MODEL ROUTING ===
smart_model_routing:
  enabled: false
  max_simple_chars: 160
  max_simple_words: 28
  cheap_model: {}

# === AUXILIARY ===
auxiliary:
  vision:
    provider: auto
    timeout: 30
    download_timeout: 30
  web_extract:
    provider: auto
    timeout: 30
  compression:
    provider: auto
    timeout: 120
  session_search:
    provider: auto
    timeout: 30
  skills_hub:
    provider: auto
    timeout: 30
  mcp:
    provider: auto
    timeout: 30
  approval:
    provider: auto
    timeout: 30
  flush_memories:
    provider: auto
    timeout: 30

# === HUMAN DELAY ===
human_delay:
  mode: "off"
  min_ms: 800
  max_ms: 2500

# === SKILLS ===
skills:
  external_dirs: []

# === SESSION RESET ===
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4

# === WEB ===
web:
  backend: firecrawl

# === TIMEZONE ===
timezone: America/New_York

# === PLATFORM TOOLSETS ===
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web

# === MCP SERVERS (auto-generated by PMOVES bootstrap) ===
mcp_servers:
  pmoves-jcodemunch:
    type: stdio
    command: uvx
    args:
      - jcodemunch-mcp
      - serve
      - --transport
      - stdio
    description: Token-efficient code exploration via tree-sitter AST (95%+ savings over grep loops)
    enabled: true
  pmoves-cipher-local:
    type: sse
    url: http://localhost:8105/mcp/sse
    headers:
      Authorization: Bearer ${CIPHER_API_TOKEN}
    enabled: true
  pmoves-cipher-fleet:
    type: sse
    url: http://${TS_Z890}:8105/mcp/sse
    headers:
      Authorization: Bearer ${CIPHER_API_TOKEN}
    enabled: false
  agent-zero:
    type: http
    url: http://${TS_Z890}:8080/mcp
    enabled: true
  docker_mcp_gateway:
    type: sse
    url: http://localhost:8090/sse
    auth_token: ${MCP_GATEWAY_AUTH_TOKEN}
    tools: "*"
    enabled: true
