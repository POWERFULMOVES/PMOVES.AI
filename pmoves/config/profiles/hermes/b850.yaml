# HERMES Agent Profile: B850 / RDNA4 (PMOVES-Knuckles)
# Hardware: Dual AMD R9700 64GB VRAM total, ROCm 7.1
# Node: pmoves-b850 (alias rdna4)
# Role: Linux container host + ROCm dual-GPU inference (worker tier)
# Last updated: 2026-07-03 (cloud-hybrid rev 4 — TZ-first, registry lanes)
#
# NO local model IDs live in this file. Local worker models are selected via
# the dynamic model plane (model-registry :8110 / Supabase, CHIT-signed
# candidates) and reached through TensorZero lane functions. See
# docs/superpowers/specs/2026-07-02-hermes-agent-zero-provider-standup-design.md

model:
  default: "tensorzero::function_name::pmoves_orchestrator_coding"
  provider: tensorzero

providers:
  tensorzero:
    name: tensorzero
    base_url: "http://127.0.0.1:3030/openai/v1"
    api_key: "none"
    api_mode: chat_completions
    default_model: "tensorzero::function_name::pmoves_orchestrator_coding"
    context_length: 128000
    models:
      - "tensorzero::function_name::pmoves_orchestrator_coding"
      - "tensorzero::function_name::pmoves_orchestrator_chat"
      - "tensorzero::function_name::pmoves_worker_glm"
      - "tensorzero::function_name::pmoves_worker_qwen"
      - "tensorzero::function_name::pmoves_worker_hermes"
      - "tensorzero::function_name::pmoves_worker_kimi"

agent:
  max_turns: 50
  tool_use_enforcement: strict

terminal:
  backend: local
  shell: bash
  timeout: 300

toolsets:
  enabled:
    - web
    - terminal
    - file
    - messaging
    - cronjob
    - code_execution
    - skills
    - memory

tts:
  provider: edge

stt:
  enabled: true
  provider: local
  local:
    model: base

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: sqlite

delegation:
  model: "tensorzero::function_name::pmoves_worker_hermes"
  provider: tensorzero
  max_concurrent_children: 2
  max_iterations: 50

gateway:
  port: 7700
  health_endpoint: /api/health
  platforms:
    - discord
    - telegram

nats:
  url: "${NATS_URL}"   # authenticated form via secrets funnel — never hardcoded
  subjects:
    publish:
      - hermes.gateway.launched.v1
      - hermes.gateway.health.v1
      - hermes.mcp.toolcall.v1
      - hermes.skill.curated.v1
      - hermes.cron.executed.v1
      - hermes.delegate.completed.v1
    subscribe:
      - p7.nats.launch
      - p7.nats.session
      - mesh.node.announce.v1

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20

display:
  skin: default
  tool_progress: true
  show_reasoning: true
  show_cost: false

security:
  redact_secrets: true
  approvals:
    mode: smart

# ROCm-specific environment (serving backends, not model picks)
rocm:
  version: "7.1"
  visible_devices: "0,1"
  backends:
    - ollama            # host-native; requires OLLAMA_HOST override for container reach
    - llama-cpp-rocm    # gfx1201 fork, :8090 (8080 is Agent Zero's)
    - vllm              # via vllm-orchestrator dynamic TZ registration

# === MCP SERVERS (auto-generated by PMOVES bootstrap) ===
mcp_servers:
  pmoves-cipher-local:
    type: sse
    url: http://localhost:8105/mcp/sse
    headers:
      Authorization: Bearer ${CIPHER_API_TOKEN}
    enabled: true
  pmoves-cipher-fleet:
    type: sse
    url: http://${TS_Z890}:8105/mcp/sse
    headers:
      Authorization: Bearer ${CIPHER_API_TOKEN}
    enabled: false
  agent-zero:
    type: http
    url: http://${TS_Z890}:8080/mcp
    enabled: true
  docker_mcp_gateway:
    type: sse
    url: http://localhost:8090/sse
    auth_token: ${MCP_GATEWAY_AUTH_TOKEN}
    tools: "*"
    enabled: true
