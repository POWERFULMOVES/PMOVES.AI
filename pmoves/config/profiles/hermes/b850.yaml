# HERMES Agent Profile: B850 / RDNA4 (PMOVES-Knuckles)
# Hardware: Dual AMD R9700 64GB VRAM total, ROCm 7.1
# Node: pmoves-b850 (alias rdna4)
# Role: Linux container host + ROCm dual-GPU inference
# Last updated: 2026-06-04

model:
  default: "ollama/hermes3:8b"
  provider: "ollama"
  base_url: "http://localhost:11434"
  fallback:
    provider: "openrouter"
    model: "nousresearch/hermes-3"

agent:
  max_turns: 50
  tool_use_enforcement: strict

terminal:
  backend: local
  shell: bash
  timeout: 300

toolsets:
  enabled:
    - web
    - terminal
    - file
    - messaging
    - cronjob
    - code_execution
    - skills
    - memory

tts:
  provider: edge

stt:
  enabled: true
  provider: local
  local:
    model: base

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: sqlite

delegation:
  model: "ollama/hermes3:8b"
  provider: ollama
  max_concurrent_children: 2
  max_iterations: 50

gateway:
  port: 7700
  health_endpoint: /api/health
  platforms:
    - discord
    - telegram

nats:
  url: "nats://pmoves-nats:4222"
  subjects:
    publish:
      - hermes.gateway.launched.v1
      - hermes.gateway.health.v1
      - hermes.mcp.toolcall.v1
      - hermes.skill.curated.v1
      - hermes.cron.executed.v1
      - hermes.delegate.completed.v1
    subscribe:
      - p7.nats.launch
      - p7.nats.session
      - mesh.node.announce.v1

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20

display:
  skin: default
  tool_progress: true
  show_reasoning: true
  show_cost: false

security:
  redact_secrets: true
  approvals:
    mode: smart

# ROCm-specific environment
rocm:
  version: "7.1"
  visible_devices: "0,1"
  backend: ollama-rocm
  gguf_row_split: true

local_models:
  ollama:
    - hermes3:8b
  huggingface:
    - repo: "google/gemma-embedding-exp-03-07"
      name: gemma4-embed
      local_dir: "~/.cache/huggingface/gemma4-embed"
      backend: sentence-transformers
    - repo: "unsloth/Hermes-3-Llama-3.1-8B"
      name: unsloth-hermes-8b-gguf
      local_dir: "~/.cache/huggingface/unsloth-hermes-8b"
      backend: llama-cpp-rocm
