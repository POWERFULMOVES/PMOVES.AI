[global]
# Glances configuration for Z890 (Elder-Melchor) node
# CPU: 6C/12T | RAM: 32GB | GPU: GTX 1650 4GB | OS: Windows 10
refresh=2
curse_theme=black
debug=False
export_json=True
export_csv=True

[network]
# Show all interfaces including virtual (WSL, Tailscale, VPNs)
# Primary: Wi-Fi (192.168.1.121), Tailscale (100.82.62.45)
show_all_interfaces=True
hide=Loopback Pseudo-Interface 1

# Display Wi-Fi, Tailscale, WSL, and VPN interfaces
# Local Area Connection* (13,14) are virtual Wi-Fi adapters -- hidden
# Bluetooth Network Connection -- hidden unless active

[fs]
# Show all disk partitions
show_all_partitions=True
hide=/mnt/*

[gpu]
# NVIDIA GPU monitoring via nvidia-smi
# GTX 1650 4GB -- monitor temp, utilization, memory
enabled=True

[processlist]
# CPU percent sort
cpu_percent=True

[alert]
# CPU alert threshold (12 logical cores)
cpu_careful=50
cpu_warning=70
cpu_critical=90

# RAM alert threshold (32GB total)
mem_careful=50
mem_warning=70
mem_critical=90

# GPU alert threshold (4GB VRAM)
gpu_mem_careful=50
gpu_mem_warning=75
gpu_mem_critical=90

[outputs]
# Export to PMOVES telemetry directory
export_json_file=C:/Users/elder/agent-zero/PMOVES-Elder-Melchor/PMOVES.AI/pmoves/telemetry/glances-z890.json
export_csv_file=C:/Users/elder/agent-zero/PMOVES-Elder-Melchor/PMOVES.AI/pmoves/telemetry/glances-z890.csv
