# HERMES Agent Profile: Spark (DGX-Spark GB10)
# Hardware: GB10 Grace-Blackwell 128GB unified memory
# Node: pmoves-spark
# Role: PRIMARY inference node for 70B+ models and NeMo Omni
# Last updated: 2026-06-04

model:
  default: "ollama/hermes3:70b"
  provider: "ollama"
  base_url: "http://localhost:11434"
  fallback:
    provider: "openrouter"
    model: "nousresearch/hermes-3"
  auxiliary:
    vision:
      provider: "openrouter"
      model: "anthropic/claude-sonnet-4"
    compression:
      provider: "openrouter"
      model: "google/gemini-1.5-flash"

agent:
  max_turns: 90
  tool_use_enforcement: strict

terminal:
  backend: local
  shell: bash
  timeout: 600

toolsets:
  enabled:
    - web
    - terminal
    - file
    - browser
    - image_gen
    - vision
    - messaging
    - cronjob
    - delegation
    - skills
    - memory
    - rl
    - moa
    - video

tts:
  provider: elevenlabs
  voice: "Bella"
  fallback: edge

stt:
  enabled: true
  provider: local
  local:
    model: large-v3

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: sqlite

delegation:
  model: "ollama/hermes3:70b"
  provider: ollama
  max_concurrent_children: 3
  max_iterations: 50

gateway:
  port: 7700
  health_endpoint: /api/health
  platforms:
    - discord
    - telegram
    - slack

nats:
  url: "nats://pmoves-nats:4222"
  subjects:
    publish:
      - hermes.gateway.launched.v1
      - hermes.gateway.health.v1
      - hermes.mcp.toolcall.v1
      - hermes.skill.curated.v1
      - hermes.cron.executed.v1
      - hermes.delegate.completed.v1
      - hermes.inference.large.completed.v1
    subscribe:
      - p7.nats.launch
      - p7.nats.session
      - mesh.node.announce.v1
      - inference.request.70b.v1

compression:
  enabled: true
  threshold: 0.60
  target_ratio: 0.30

display:
  skin: default
  tool_progress: true
  show_reasoning: true
  show_cost: true

security:
  redact_secrets: true
  approvals:
    mode: smart

# Spark-specific model catalog (local Ollama + HuggingFace)
local_models:
  ollama:
    - hermes3:8b
    - hermes3:70b
  vllm_tensorrt:
    - repo: "nvidia/Nemotron-3-Ultra"
      name: nemotron3-ultra
      backend: vllm  # or TensorRT-LLM for max throughput
      quantization: none
      context_length: 128000
      vram_required: "~80GB"
      notes: "550B MoE / 55B active. PRIMARY for agent harnesses. 300+ tok/sec. Best open model on Pinchbench."
      agent_harness_optimized: true
      training_recipes_available: true
  huggingface:
    - repo: "nvidia/NVLM-D-72B"
      name: nemo-omni-vl
      local_dir: "~/.cache/huggingface/nemo-omni-vl"
      backend: nemo
      min_version: "2.1"
    - repo: "google/gemma-embedding-exp-03-07"
      name: gemma4-embed
      local_dir: "~/.cache/huggingface/gemma4-embed"
      backend: sentence-transformers
    - repo: "unsloth/Hermes-3-Llama-3.1-70B"
      name: unsloth-hermes-70b-gguf
      local_dir: "~/.cache/huggingface/unsloth-hermes-70b"
      backend: llama-cpp
