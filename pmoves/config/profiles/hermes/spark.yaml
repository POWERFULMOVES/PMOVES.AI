# HERMES Agent Profile: Spark (DGX-Spark GB10)
# Hardware: GB10 Grace-Blackwell 128GB unified memory
# Node: pmoves-spark
# Role: PRIMARY inference node for 70B+ models and NeMo Omni
# Last updated: 2026-07-03 (cloud-hybrid rev 4 — TZ-first, registry lanes; NO pinned local model IDs — dynamic model plane selects 70B-class workers per hf-mem fit on 128GB unified)

model:
  default: "tensorzero::function_name::pmoves_orchestrator_coding"
  provider: tensorzero

providers:
  tensorzero:
    name: tensorzero
    base_url: "http://127.0.0.1:3030/openai/v1"   # or fleet TZ via Tailscale
    api_key: "none"
    api_mode: chat_completions
    default_model: "tensorzero::function_name::pmoves_orchestrator_coding"
    context_length: 128000
    models:
      - "tensorzero::function_name::pmoves_orchestrator_coding"
      - "tensorzero::function_name::pmoves_orchestrator_chat"
      - "tensorzero::function_name::pmoves_worker_glm"
      - "tensorzero::function_name::pmoves_worker_qwen"
      - "tensorzero::function_name::pmoves_worker_hermes"
      - "tensorzero::function_name::pmoves_worker_kimi"

agent:
  max_turns: 90
  tool_use_enforcement: strict

terminal:
  backend: local
  shell: bash
  timeout: 600

toolsets:
  enabled:
    - web
    - terminal
    - file
    - browser
    - image_gen
    - vision
    - messaging
    - cronjob
    - delegation
    - skills
    - memory
    - rl
    - moa
    - video

tts:
  provider: elevenlabs
  voice: "Bella"
  fallback: edge

stt:
  enabled: true
  provider: local
  local:
    model: large-v3

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: sqlite

delegation:
  model: "tensorzero::function_name::pmoves_worker_hermes"
  provider: tensorzero
  max_concurrent_children: 4
  max_iterations: 50

gateway:
  port: 7700
  health_endpoint: /api/health
  platforms:
    - discord
    - telegram
    - slack

nats:
  url: "${NATS_URL}"   # authenticated form via secrets funnel
  subjects:
    publish:
      - hermes.gateway.launched.v1
      - hermes.gateway.health.v1
      - hermes.mcp.toolcall.v1
      - hermes.skill.curated.v1
      - hermes.cron.executed.v1
      - hermes.delegate.completed.v1
      - hermes.inference.large.completed.v1
    subscribe:
      - p7.nats.launch
      - p7.nats.session
      - mesh.node.announce.v1
      - inference.request.70b.v1

compression:
  enabled: true
  threshold: 0.60
  target_ratio: 0.30

display:
  skin: default
  tool_progress: true
  show_reasoning: true
  show_cost: true

security:
  redact_secrets: true
  approvals:
    mode: smart

# Spark-specific model catalog (local Ollama + HuggingFace)
# Local model inventory is DYNAMIC: candidates are registered via
# model-registry :8110 (CHIT-signed, hf-mem sized for 128GB unified memory)
# and promoted to registry_worker_* lanes. No pinned IDs here.
local_models: dynamic-model-plane
