# HERMES Agent Profile: KVM4-1 (Headless VPS)
# Hardware: No GPU
# Node: kvm4-1
# Role: Headless gateway + NATS leaf
# Last updated: 2026-06-04

model:
  default: "openrouter/nousresearch/hermes-3"
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"

agent:
  max_turns: 50
  tool_use_enforcement: strict

terminal:
  backend: local
  shell: bash
  timeout: 180

toolsets:
  enabled:
    - web
    - terminal
    - file
    - messaging
    - cronjob
    - skills
    - memory

tts:
  enabled: false

stt:
  enabled: false

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: sqlite

delegation:
  model: "openrouter/nousresearch/hermes-3"
  provider: openrouter
  max_concurrent_children: 2
  max_iterations: 30

gateway:
  port: 7700
  health_endpoint: /api/health
  platforms:
    - discord
    - telegram

nats:
  url: "nats://pmoves-nats:4222"
  leaf_node: true
  subjects:
    publish:
      - hermes.gateway.launched.v1
      - hermes.gateway.health.v1
      - hermes.mcp.toolcall.v1
      - hermes.skill.curated.v1
      - hermes.cron.executed.v1
      - hermes.delegate.completed.v1
    subscribe:
      - p7.nats.launch
      - p7.nats.session

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20

display:
  skin: default
  tool_progress: false
  show_reasoning: false
  show_cost: false

security:
  redact_secrets: true
  approvals:
    mode: smart
