# HERMES Agent Profile: Z890
# Node: z890 (distinct from Elder-Melchor)
# Hardware: RTX 3090 Ti 24GB, Windows 11 Pro, high-core desktop/workstation
# Role: Windows infra host -- Hermes CLI + gateway staging + Ollama local inference
# Status: Planned hardware (Z890 CLAUDE working PRs opened from SPARK node)
# Last updated: 2026-06-04

model:
  default: "ollama/hermes3:8b"
  provider: "ollama"
  base_url: "http://localhost:11434"
  fallback:
    provider: "openrouter"
    model: "nousresearch/hermes-3"
    base_url: "https://openrouter.ai/api/v1"

agent:
  max_turns: 50
  tool_use_enforcement: strict

terminal:
  backend: local
  shell: bash
  timeout: 180
  windows_quirks:
    newline_binding: ctrl_enter
    path_separator: forward_slash
    env_allowlist: [SYSTEMROOT, WINDIR, COMSPEC]

toolsets:
  enabled:
    - web
    - terminal
    - file
    - browser
    - image_gen
    - vision
    - messaging
    - cronjob
    - delegation
    - skills
    - memory

tts:
  provider: edge
  voice: en-US-AriaNeural

stt:
  enabled: true
  provider: local
  local:
    model: base

memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: sqlite

delegation:
  model: "ollama/hermes3:8b"
  provider: ollama
  max_concurrent_children: 2
  max_iterations: 50

gateway:
  port: 7700
  health_endpoint: /api/health
  platforms:
    - discord
    - telegram

nats:
  url: "nats://pmoves-nats:4222"
  subjects:
    publish:
      - hermes.gateway.launched.v1
      - hermes.gateway.health.v1
      - hermes.mcp.toolcall.v1
      - hermes.skill.curated.v1
      - hermes.cron.executed.v1
      - hermes.delegate.completed.v1
    subscribe:
      - p7.nats.launch
      - p7.nats.session
      - mesh.node.announce.v1

compression:
  enabled: true
  threshold: 0.50
  target_ratio: 0.20

display:
  skin: default
  tool_progress: true
  show_reasoning: true
  show_cost: false

security:
  redact_secrets: true
  approvals:
    mode: smart

# === MCP SERVERS (auto-generated by PMOVES bootstrap) ===
mcp_servers:
  pmoves-cipher-local:
    type: sse
    url: http://localhost:8105/mcp/sse
    headers:
      Authorization: Bearer ${CIPHER_API_TOKEN}
    enabled: true
  pmoves-cipher-fleet:
    type: sse
    url: http://${TS_Z890}:8105/mcp/sse
    headers:
      Authorization: Bearer ${CIPHER_API_TOKEN}
    enabled: false
  agent-zero:
    type: http
    url: http://${TS_Z890}:8080/mcp
    enabled: true
  docker_mcp_gateway:
    type: sse
    url: http://localhost:8090/sse
    auth_token: ${MCP_GATEWAY_AUTH_TOKEN}
    tools: "*"
    enabled: true
