# Alias for desktop-9950xd profile.
#
# Model management yamls (pmoves/models/*.yaml) use HOST_CLASS=workstation_5090
# as a semantic label. The hardware profile config uses the descriptor-based ID
# desktop-9950xd. This alias bridges the two naming conventions so that
# `make model-apply HOST=workstation_5090` resolves correctly.
#
# Canonical profile: pmoves/config/profiles/desktop-9950xd.yaml

id: workstation_5090
alias_of: desktop-9950xd
name: "Desktop – AMD 9950XD / RTX 5090 (alias)"
description: >
  Alias for desktop-9950xd. High-end workstation with Ryzen 9 9950XD, RTX 5090,
  192GB RAM. Preferred for full PMOVES stack, GPU inference (vLLM), and heavy
  media pipelines.
hardware:
  cpu:
    vendor: AMD
    model: Ryzen 9 9950XD
    cores: 16
    threads: 32
  gpu:
    type: nvidia
    models: ["RTX 5090"]
    memory_gb: 32
  ram_gb: 192
  tags: [desktop, cuda, high-end]
compose_overrides:
  - docker-compose.gpu.yml
  - docker-compose.external.yml
model_bundles:
  - ollama-high
  - vllm-large
  - reranker-qwen-large
mcp:
  - docker
  - compose
  - host
  - telemetry
messaging:
  telegram: true
  discord: true
  whatsapp: true
  webrtc: true
notes:
  - Alias of desktop-9950xd. Both IDs resolve to the same hardware profile.
  - Ensure NVIDIA Container Toolkit is installed.
  - Preferred local model set: Mixtral 8x7B (vLLM), Whisper-large-v3, Qwen reranker.
