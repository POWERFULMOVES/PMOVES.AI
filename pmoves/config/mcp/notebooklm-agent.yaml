id: notebooklm-agent
name: NotebookLM MCP Agent
description: Integrates NotebookLM and Google Services via Universal OAuth to provide source-grounded research, document querying, and Notebook management.
required_commands:
  - docker
environment:
  - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
  - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
  - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
setup_instructions:
  - Ensure Google Universal OAuth credentials are set in env.shared (GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REFRESH_TOKEN).
  - Start via the canonical make pipeline (base+agents compose, COMPOSE_ENV_FILES injected) - run "make -C pmoves secrets-funnel" then "make -C pmoves up-notebooklm". The container is named pmoves-notebooklm-agent-1.
transport: stdio
command: docker
args:
  - exec
  - -i
  - pmoves-notebooklm-agent-1
  - node
  - dist/index.js
tools:
  - notebooklm_list_notebooks
  - notebooklm_query
