    - gemma-2:2b
    - qwen2.5:3b

  medium:
    - qwen2.5:7b
    - qwen2.5:14b
    - llama3.1:8b
    - gemma-2:9b
    - qwen2.5-coder:7b
    - deepseek-coder:6.7b
    - qwen3:8b

  large:
    - qwen2.5:32b
    - qwen2.5:72b

  specialized:
    - qwen2-vl:7b
    - qwen3-vl:8b
    - qwen3-embedding:4b
    - qwen3-embedding:8b
    - nomic-embed-text
    - embeddinggemma:300m
    - qwen3-reranker:4b
