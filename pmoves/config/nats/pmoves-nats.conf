# PMOVES NATS hub — accounts (memory resolver) + leafnode listener
# ============================================================================
# Spec:    pmoves/docs/specs/nats-accounts-leaf-topology-v0-spec-2026-08-07.md
# Runbook: pmoves/docs/operations/NATS_LEAF_TOPOLOGY_ROLLOUT_RUNBOOK.md  (Phase 2)
#
# THIS FILE IS A TEMPLATE. The ${...} placeholders are rendered by the
# secrets-funnel (spec §8). The four account JWTs and the operator JWT are
# PUBLIC, non-secret values — they are safe in a rendered config and in logs.
# The operator SEED (PMOVES.nk) and every user `.creds` are secrets and are
# file-mounted, never inlined here.
#
# VERIFIED 2026-08-15 on z890 against nats:2.11.8-alpine in a throwaway lab
# (production `pmoves-nats-1` untouched). Evidence in the AGNOTE trail:
#   * hub logs "Listening for leafnode connections on 0.0.0.0:7422"
#   * a leaf presenting EDGE/edge-nano-1.creds attached and hub /leafz reported
#     account=<EDGE pubkey> — i.e. the creds BIND the hub-side account
#   * the same leaf pointed at 4222 was refused: "attempted to connect to wrong
#     port" (this is exactly why elder-melchor-leaf.conf never worked)
#   * account isolation held: a CORE subscriber on `test.>` received 0 messages
#     from an EDGE publisher on `test.isolation` (positive control: 1)
#
# ── IMPLEMENTATION FINDING (not in the spec's §3 snippet) ───────────────────
# `operator:` is REQUIRED. Without it the server cannot validate the preloaded
# account JWTs against their issuer and dies at boot with:
#     nats-server: error resolving system account: account validation failed
# The spec §3 example lists only resolver/resolver_preload/system_account; that
# is incomplete. Keep this directive.
# ============================================================================

# NOTE: nats-server env expansion supports `$VAR` / `${VAR}` but NOT the
# shell-style `${VAR:-default}` — that form fails to load with
# "variable reference ... can not be found" (verified with `nats-server -t`).
# Every placeholder here must therefore be RENDERED by the funnel, or exported
# into the container env; none of them can carry an inline default.
server_name: ${NATS_SERVER_NAME}

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/js
}

# Operator JWT (PUBLIC) — the trust anchor the account JWTs are validated against.
operator: ${NATS_OPERATOR_JWT}

# Memory resolver: the doc-recommended choice for a small, rarely-changing set of
# accounts (our four fixed trust zones). User creds stay nsc-rotatable; only these
# four account JWTs are preloaded (edit + reload to change an account, which is rare).
resolver: MEMORY
resolver_preload: {
  ${NATS_SYS_ACCOUNT_PUBKEY}:   ${NATS_SYS_ACCOUNT_JWT}
  ${NATS_CORE_ACCOUNT_PUBKEY}:  ${NATS_CORE_ACCOUNT_JWT}
  ${NATS_EDGE_ACCOUNT_PUBKEY}:  ${NATS_EDGE_ACCOUNT_JWT}
  ${NATS_CLOUD_ACCOUNT_PUBKEY}: ${NATS_CLOUD_ACCOUNT_JWT}
}

# SYS is the system account — monitoring/system events require SYS creds.
system_account: ${NATS_SYS_ACCOUNT_PUBKEY}

# The leafnode listener. Edge/cloud nodes attach HERE (7422), never at the client
# port (4222). This port must also be PUBLISHED by compose for cross-node leaves.
leafnodes {
  listen: 0.0.0.0:7422
}
