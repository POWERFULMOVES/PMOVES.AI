# NATS Leaf Node Configuration — Elder-Melchor → Z890 Fleet Sync
# 
# This config allows Elder-Melchor's local NATS to connect to Z890's NATS
# via Tailscale, enabling fleet-wide event propagation (cipher.memory.stored.v1, etc.)
#
# Usage:
#   docker run -d --name pmoves-nats --network pmoves-net \
#     -p 4222:4222 -p 8222:8222 \
#     -v pmoves/config/nats/elder-melchor-leaf.conf:/etc/nats/leaf.conf \
#     nats:2.11.8-alpine -js -m 8222 --config /etc/nats/leaf.conf --user nats --pass pmoves
#
# Prerequisites:
#   - Tailscale running on both Elder-Melchor and Z890
#   - Z890 NATS reachable at ${TS_Z890}:4222
#   - Set TS_Z890 env var: export TS_Z890=$(tailscale ip z890)

leafnodes {
  # Connect to Z890 as a leaf node
  # Local subjects stay local; only explicitly exported/imported subjects cross the link
  remotes = [
    {
      url: "nats://nats:pmoves@${TS_Z890}:4222"
      # Only sync cipher memory events and agent announcements
      # Do NOT sync all subjects — keep local traffic local
      no_advertise: true
    }
  ]
}

# JetStream enabled for local persistence
jetstream {
  store_dir: /data/nats
  max_memory: 512MB
}

# Authorization — local credentials
authorization {
  user: nats
  password: pmoves
  timeout: 5
}

# Monitoring
http_port: 8222
server_name: "Elder-Melchor-NATS"
server_tags: ["node:elder-melchor", "role:hermes-gateway"]