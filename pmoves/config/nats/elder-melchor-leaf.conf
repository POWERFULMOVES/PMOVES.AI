# NATS Leaf Node Configuration — Elder-Melchor → Z890 Fleet Sync
# 
# This config allows Elder-Melchor's local NATS to connect to Z890's NATS
# via Tailscale, enabling fleet-wide event propagation (cipher.memory.stored.v1, etc.)
#
# Usage:
#   docker run -d --name pmoves-nats --network pmoves-net \
#     -p 4222:4222 -p 8222:8222 \
#     -v pmoves/config/nats/elder-melchor-leaf.conf:/etc/nats/leaf.conf:ro \
#     -v /etc/pmoves/nats/core-service.creds:/etc/nats/creds/core-service.creds:ro \
#     nats:2.11.8-alpine -c /etc/nats/leaf.conf
#   (the retired `--user nats --pass pmoves` flags are gone: auth is the mounted
#    creds; jetstream + monitoring are declared in this file, not as CLI flags)
#
# Prerequisites:
#   - Tailscale running on both Elder-Melchor and Z890
#   - Z890 hub running pmoves-nats.conf with leafnodes{listen:7422} PUBLISHED
#     (Phase 2 — see NATS_LEAF_TOPOLOGY_ROLLOUT_RUNBOOK.md)
#   - core-service.creds file-mounted at /etc/nats/creds/ (secret, mode 0600)

leafnodes {
  # Connect to Z890 as a leaf node
  # Local subjects stay local; only explicitly exported/imported subjects cross the link
  #
  # FIXED 2026-08-15: `no_advertise` was inside the remote entry below, where
  # nats-server rejects it ("unknown field") — it is a leafnodes BLOCK-level
  # field. Verified with `nats-server -t`.
  no_advertise: true

  remotes = [
    {
      # FIXED 2026-08-15 (was: "nats://nats:pmoves@${TS_Z890}:4222").
      #
      # Two bugs in that one line, both measured against nats:2.11.8-alpine:
      #  1. PORT — 4222 is the CLIENT port. A leaf remote pointed at it is
      #     refused with "attempted to connect to wrong port", so this leaf has
      #     NEVER attached (matches the 2026-08-08 git forensic: no coherent
      #     leaf has ever run in PMOVES production).
      #  2. AUTH — inline `nats:pmoves` is the retired plaintext credential. The
      #     account model binds the leaf via nsc-minted user creds; the hub-side
      #     account is implied by those creds (verified via hub /leafz).
      #
      # Hostname, never a literal Tailscale IP (committed files carry no IPs).
      # The WHOLE URL comes from one env var — nats-server has no
      # `${VAR:-default}` form AND does not expand `$VAR` inside a quoted
      # string (both verified by execution; the latter fails at runtime with
      # `lookup for host "$VAR": no such host`). Set, e.g.:
      #     PMOVES_NATS_LEAF_URL=nats://pmoves-z890:7422
      urls: [ $PMOVES_NATS_LEAF_URL ]
      credentials: "/etc/nats/creds/core-service.creds"
    }
  ]
}

# JetStream enabled for local persistence
jetstream {
  store_dir: /data/nats
  # FIXED 2026-08-15: was `max_memory`, which nats-server 2.11 rejects with
  # "unknown field" — this file could never load even before the port/auth bugs
  # below were fixed. The correct field is `max_mem` (verified: nats-server -t).
  max_mem: 512MB
}

# Authorization — local credentials
authorization {
  user: nats
  password: pmoves
  timeout: 5
}

# Monitoring
http_port: 8222
server_name: "Elder-Melchor-NATS"
server_tags: ["node:elder-melchor", "role:hermes-gateway"]