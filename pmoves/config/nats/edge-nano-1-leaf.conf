# PMOVES EDGE leaf — nano-1 (Jetson Orin) → z890 hub
# ============================================================================
# Spec:    pmoves/docs/specs/nats-accounts-leaf-topology-v0-spec-2026-08-07.md §4
# Runbook: pmoves/docs/operations/NATS_LEAF_TOPOLOGY_ROLLOUT_RUNBOOK.md (Phase 4)
#
# Runs ON the jetson. Attaches to the hub's LEAFNODE port (7422) using the
# nsc-minted EDGE user creds. Local subjects stay local; only the §5
# export/import matrix crosses the link.
#
# VERIFIED 2026-08-15: this exact remote shape attached to a hub built from
# pmoves-nats.conf, and hub /leafz reported account=<EDGE pubkey>.
#
# ── RESOLVES the spec §4 "open detail to confirm at implementation" ─────────
# Question was: is the leaf's account pinned by an `account:` field on the
# remote, or implied by the creds?
# ANSWER (measured, both sides observed):
#   * HUB side  — the account is IMPLIED BY THE CREDS. The user JWT inside
#     edge-nano-1.creds carries its issuer account, so the hub binds the leaf to
#     EDGE. No `account:` field is needed on the remote for this.
#   * LEAF side — the LOCAL account is a SEPARATE thing and defaults to the
#     global account: the leaf logs
#         "Leafnode connection created for account: $G"
#     `$G` is correct/expected for a leaf that defines no local accounts. Only
#     if you define local accounts on the jetson would you add `account:` to the
#     remote to pin WHICH LOCAL account the link binds to.
# So: creds → hub-side account; `account:` → leaf-side local account (optional).
#
# PREREQUISITES
#   1. Hub (z890) running pmoves-nats.conf with leafnodes{listen:7422} AND
#      compose publishing 7422 (Phase 2 — operator-authorized Known Road).
#   2. edge-nano-1.creds present on the jetson at the path below, mode 0600,
#      owned by the container user. It is a SECRET (contains a user seed) —
#      file-mounted, never baked into an image and never committed.
#   3. Reachability: use the MagicDNS hostname, never a literal Tailscale IP.
#
# USAGE (on the jetson)
#   docker run -d --name pmoves-nats-leaf --restart unless-stopped \
#     -p 4222:4222 -p 8222:8222 \
#     -v /etc/pmoves/nats/edge-nano-1.creds:/etc/nats/creds/edge-nano-1.creds:ro \
#     -v /etc/pmoves/nats/edge-nano-1-leaf.conf:/etc/nats/leaf.conf:ro \
#     -v pmoves-nats-leaf-data:/data \
#     nats:2.11.8-alpine -c /etc/nats/leaf.conf
#
# VERIFY
#   on jetson: docker logs pmoves-nats-leaf | grep -i leafnode
#   on z890:   curl -s http://127.0.0.1:9223/leafz   # expect leafnodes >= 1 and
#                                                    # account = <EDGE pubkey>
# ============================================================================

server_name: pmoves-edge-nano-1

listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/js
  # 8GB Orin — keep the edge store modest; the hub is the durable tier.
  # NOTE: the field is `max_mem`, NOT `max_memory`. nats-server 2.11 rejects
  # `max_memory` outright ("unknown field"), so a config carrying it never
  # loads — verified with `nats-server -t`.
  max_mem: 256MB
  max_file: 2GB
}

leafnodes {
  # Keep edge-local chatter local; only exported/imported subjects cross.
  # NOTE: `no_advertise` is a leafnodes BLOCK-level field. Placing it inside a
  # `remotes[]` entry is rejected ("unknown field") and the config never loads —
  # verified with `nats-server -t`. The pre-existing elder-melchor-leaf.conf had
  # it in the remote, which is one more reason that file could never boot.
  no_advertise: true

  remotes: [
    {
      # LEAFNODE port 7422 — NOT the client port 4222. A remote pointed at 4222
      # is refused with "attempted to connect to wrong port" (measured), which is
      # the root cause of every previous non-working PMOVES "leaf".
      # The WHOLE URL comes from one env var. Two nats-server expansion rules
      # make this the only form that works (both verified by execution):
      #  1. No shell-style defaults: `${VAR:-x}` fails to load outright with
      #     "variable reference ... can not be found".
      #  2. No expansion INSIDE a quoted string: "nats://$VAR:7422" is taken
      #     literally and the leaf dies with
      #     `lookup for host "$PMOVES_NATS_HUB_HOST": no such host`.
      # So the variable must stand alone and carry the full URL, e.g.
      #     PMOVES_NATS_LEAF_URL=nats://pmoves-z890:7422
      # MagicDNS hostname, never a literal Tailscale IP.
      urls: [ $PMOVES_NATS_LEAF_URL ]

      # Account binding rides this credential (see the finding above).
      credentials: "/etc/nats/creds/edge-nano-1.creds"
    }
  ]
}
