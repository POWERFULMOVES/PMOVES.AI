# 5×5 Signing Identity Cards
#
# One card per active signer. Each card has two halves:
#
#   ml — Machine-loadable (what the verifier checks):
#        SSH fingerprint, OpenSSH allowed_signers entry, GPG key id,
#        GitHub App installation id, CI runner label.
#
#   h  — Human-readable (what both sides recognize at a glance):
#        agent_id, glyph, color, voice, role.
#
# When both halves agree across {agent emit, operator confirm,
# CI verify, trail record}, the channel is 5×5.
#
# Pairs with:
#   schema:     pmoves/contracts/schemas/identity/signing-card.v1.schema.json (pending land)
#   explainer:  pmoves/docs/operations/SIGNING_IDENTITY_CARDS.md
#   trail tie:  signature.v2.schema.json `signing_card_id` (pending field)
#   audit:      pmoves/scripts/audit_naming_drift.py (Phase 4 — verifies cards parse +
#               every emitting agent_id has an active card here).
#
# H half is sourced from pmoves/config/agent_signatures.yaml — keep these in sync.
# ML half is operator-provided when SSH/GPG/App keys land. Until then, cards are
# `active: true` with `ml.primary_method` set but key fields null. Audit reports
# them as "h-only / pending-ml" (advisory, not fatal — see plan Owner-Decision D).

