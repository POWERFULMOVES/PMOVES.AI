# PMOVES MCP Gateway catalog — one endpoint for every agent.
#
# Format is docker/mcp-gateway's: `registry:` maps a server name to its entry.
# See PMOVES-mcp-gateway/docs/server-entry-spec.md and
# PMOVES-mcp-gateway/examples/remote_mcp/.
#
# `type: remote` federates an MCP server that ALREADY RUNS — no image, no pod,
# no Kubernetes. That capability is why the Docker gateway was chosen over the
# Microsoft McpGateway fork for the compose fleet; see
# pmoves/docs/architecture/MCP_GATEWAY_WIRING_RESEARCH.md §5.
#
# ONLY VERIFIED ENDPOINTS ARE REGISTERED. Every entry below was probed on B850
# before being added; an entry that has never answered is a dead wire dressed up
# as configuration, which is the exact defect this whole effort came from
# (github-issue-triage has pointed at a nonexistent /mcp/github/* on the wrong
# port for months).
registry:

  # 23 tools: hirag_*, nats_*, tensorzero_*, supabase_*, cast_*.
  # Verified 2026-08-21: POST /mcp -> 200, tools/list returns all 23.
  #
  # NOTE ON NETWORKS: this container lives on `pmoves_pmoves_app` (the BoTZ
  # compose project's own network) while the rest of the fleet is on the
  # external `pmoves_app`. Only 2 containers are on that network, so the fleet's
  # actual MCP server is unreachable by name from every other PMOVES service.
  # The gateway attaches to BOTH networks; that is what federates them.
  # Verified from a container joined to both: 200 by container name AND by
  # compose service alias.
  botz-mcp-bridge:
    remote:
      url: "http://pmoves-botz-mcp-bridge:8100/mcp"
      transport_type: http

  # Persistent memory. Verified 2026-08-21: GET /mcp/sse -> 200.
  # The path is a property of the server, not of one container — confirmed by
  # two independent probes of different builds (see .claude/mcp.json).
  # /api/mcp/sse and /sse both 404.
  cipher:
    remote:
      url: "http://cipher-api:8105/mcp/sse"
      transport_type: sse

# NOT REGISTERED, and why — kept here so the gaps are visible rather than
# quietly absent:
#
#   agent-zero        http://agent-zero:8080/mcp — the container is NOT RUNNING
#                     on B850. Registering an endpoint that has never answered
#                     would put a dead wire in the gateway's own catalog.
#   pmoves-hirag-mcp  stdio bridge, ships no Dockerfile and no HTTP server, so
#                     it is neither `remote` nor (yet) `server`. Needs an image
#                     first — see the research doc's inventory table.
#   MiniMax, jcodemunch, e2b
#                     `type: server` candidates (jcodemunch and e2b ship
#                     Dockerfiles). They need catalog entries with an image
#                     reference, which is a separate change from standing the
#                     gateway up.
