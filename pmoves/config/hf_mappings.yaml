# =============================================================================
# Quantization Variants
# =============================================================================
# GGUF quantization types and their characteristics
# =============================================================================

quantization_variants:
  q4_0:
    bits: 4
    size_multiplier: 0.25
    quality: "Lowest"
    speed: "Fastest"
    vram_per_7b_gb: 3.5
    recommended_for: [cpu, edge]

  q4_k_m:
    bits: 4
    size_multiplier: 0.28
    quality: "Good"
    speed: "Fast"
    vram_per_7b_gb: 4.0
    recommended_for: [gpu, balanced]
    notes: "Recommended default for most use cases"

  q5_0:
    bits: 5
    size_multiplier: 0.30
    quality: "Better"
    speed: "Medium"
    vram_per_7b_gb: 4.3
    recommended_for: [gpu]

  q5_k_m:
    bits: 5
    size_multiplier: 0.32
    quality: "Better"
    speed: "Medium"
    vram_per_7b_gb: 4.5
    recommended_for: [gpu]

  q6_k:
    bits: 6
    size_multiplier: 0.38
    quality: "High"
    speed: "Slower"
    vram_per_7b_gb: 5.4
    recommended_for: [gpu, high_quality]

  q8_0:
    bits: 8
    size_multiplier: 0.50
    quality: "Near-fp16"
    speed: "Medium"
    vram_per_7b_gb: 7.0
    recommended_for: [gpu, vllm]

  f16:
    bits: 16
    size_multiplier: 1.0
    quality: "Full precision"
    speed: "Varies"
    vram_per_7b_gb: 14.0
    recommended_for: [vllm, tensorrt]

# =============================================================================
# Alternative Quantization Formats
# =============================================================================

alt_quantization:
  awq:
    description: "Activation-aware Weight Quantization"
    bits: 4
    supported_backends: [vllm]
    compatible_hardware: [NVIDIA, AMD]
    notes: "Faster dequantization, good for vLLM"

  gptq:
    description: "GPT Quantization"
    bits: 4
    supported_backends: [vllm, transformers]
    compatible_hardware: [NVIDIA]
    notes: "Older format, AWQ generally preferred"

  gguf:
    description: "GGUF (GPT-Generated Unified Format)"
    bits: [4, 5, 6, 8]
    supported_backends: [ollama, llama_cpp]
    compatible_hardware: [CPU, GPU, Apple Silicon]
    notes: "Most versatile, runs on almost any hardware"

  fp8:
    description: "8-bit Floating Point"
    bits: 8
    supported_backends: [vllm, tensorrt]
    compatible_hardware: [NVIDIA Ada, Hopper]
    notes: "Requires Ada+ GPU (RTX 4090, L40, H100)"

# =============================================================================
# Download Priority Queue
# =============================================================================
# Recommended download order for different hardware profiles
# =============================================================================

download_priority:
  # Start here for any setup
  starter:
    1. qwen2.5-3b:q4_k_m
    2. phi3-mini:q4_k_m
    3. gemma-embedding-300m:f16

  # Single GPU (12-16GB)
  single_gpu:
    1. qwen2.5-7b:q4_k_m
    2. qwen2.5-coder-7b:q4_k_m
    3. qwen2-vl-7b:q4_k_m
    4. qwen3-embedding-8b:f16

  # High-end single GPU (24GB+)
  highend_single_gpu:
    1. qwen2.5-14b:q4_k_m
    2. qwen2.5-coder-7b:q8_0
    3. qwen3-vl-8b:q4_k_m
    4. qwen3-reranker-4b:f16

  # Multi-GPU
  multi_gpu:
    1. qwen2.5-32b:q4_0
    2. qwen2.5-72b:q4_0
    3. mixtral-8x22b:q4_0
