# =============================================================================
# Function Demand Profiles
# =============================================================================
# Defines what each TensorZero function needs from a model.
# Used ONLY by the discovery algorithm for unknown models (not in provider_catalog).
# Known models use deterministic `serves` declarations in provider_catalog.yaml.
#
# Each function declares weighted demands across 6 strength dimensions.
# Weights must sum to 1.0. min_fit is the threshold for eligibility.
#
# Fit score = SUM(demand_weight[dim] × model_strength[dim])
# If fit >= min_fit, the model is suggested for that function.
# Operator approval required before assignment.
# =============================================================================

function_demands:

  # ---------------------------------------------------------------------------
  # Core Orchestration
  # ---------------------------------------------------------------------------

  agent_zero:
    description: "Primary L1 orchestrator — needs broad reasoning, code awareness, and multilingual support"
    weights:
      reasoning: 0.30
      coding: 0.20
      multilingual: 0.15
      creativity: 0.10
      context_handling: 0.15
      speed: 0.10
    min_fit: 0.65

