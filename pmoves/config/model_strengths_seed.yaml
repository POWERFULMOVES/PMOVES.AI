# Load into pmoves_core.model_strengths via migration or n8n workflow.
#
# Strength dimensions (0.0–1.0):
#   reasoning       — complex multi-hop logic, planning, architecture
#   speed           — tokens/sec, time to first token
#   coding          — code generation, analysis, debugging
#   multilingual    — non-English language quality
#   creativity      — open-ended generation, brainstorming
#   context_handling — effective use of long context windows
#
# Notes field: tongue-in-cheek personality — the name IS the function.
# =============================================================================

