  - entry: {timestamp: "2026-08-25T01:20:00Z", kind: RELEASE}
    recorded_as: "B850-CLAUDE (Claude Opus 5)"
    actual: b850-claude
    kind_of_correction: key_drift
    reason: >-
      Not a misattribution -- the right identity under a fourth spelling. The
      lane stayed open for a week because claim-collision-pre.py (#2734)
      compares author strings, and two spellings of one identity do not
      collide.
    asserted_on: "2026-08-25"
    evidence: "AGNOTE4482PHI.t1.md, B850-CLAUDE preflight"

# The forward edge. "Identity A became identity B" -- what the register has
# never been able to say, and the reason correction #1-6 were implemented as a
# rewrite instead of an edge.
successions:
  - from: z890-claude
    to: 5090-claude
    asserted_on: "2026-07-20"
    evidence: >-
      8 register entries authored as `Z890→5090-CLAUDE (opus 4.7 1M)`. The
      arrow is in the ledger's own data; this record only gives it a field to
      live in.
    confidence: attested-by-usage
    note: >-
      `confidence` is NOT decoration. This edge is inferred from a naming
      convention someone invented under pressure, not from a signed handover
      event. It is strong evidence and it is still not proof, and a lineage
      system that cannot say which of those it has is the thing being fixed.
