# Controlled vocabulary and lineage for AGENT IDENTITIES in the claim register.
#
# WHY THIS FILE EXISTS
# --------------------
# `AGNOTE4482PHI.t1.md` carries 331 CLAIM/RELEASE entries written by roughly a
# dozen identities under **49 distinct author strings** (measured 2026-08-25).
# The register has no vocabulary, so one identity accumulates spellings, and
# three separate things the ledger cannot express have each been worked around
# by editing history in place:
#
#   1. ATTRIBUTION CORRECTION -- "this entry's recorded author was wrong".
#      Worked around by rewriting the author in the line and appending a prose
#      `[CORRECTION ...]` note. The original author string is destroyed; only
#      `git show d85b46961^` recovers it. 6 entries, 2026-05-16, #1504.
#
#   2. KEY DRIFT -- one identity, many spellings. B850 alone appears as
#      `(Knuckles)` x16, `(Knuckles, opus 4.7 1M)` x7, `(Opus 5)` x2,
#      `(Claude Opus 5)` x1. Cosmetic until `claim-collision-pre.py` was wired
#      (#2734), at which point two spellings of one identity stopped colliding
#      with each other. 1 annotated entry, 2026-08-25.
#
#   3. SUCCESSION -- "identity A became identity B". There is no edge for this
#      at all, so it was encoded as an ARROW INSIDE THE AUTHOR FIELD:
#      `Z890->5090-CLAUDE (opus 4.7 1M)`, 8 entries. That string is the single
#      best evidence that the missing edge is real: someone needed it badly
#      enough to invent syntax for it in a free-text field.
#
# All three are recorded here as DATA, append-only, with the original preserved.
# Nothing in this file rewrites the register.
#
# THE PARENTHETICAL IS THREE FIELDS IN A TRENCH COAT. 26 distinct parentheticals
# carry a model (`opus 4.7 1M`, `Fable 5`, `Sonnet 4.6`, `glm-5.2`), a lane or
# alter (`field`, `pr-trim`, `voice-binding lane`), or a node (`Z890`, `SPARK`,
# `Knuckles`). That is the (identity, harness, model, role) join the preflight
# reports as missing -- it has existed for months as unparsed free text.
#
# ADDING AN IDENTITY: add a `canonical` entry with every spelling in use as an
# alias. The gate (`pmoves/tests/test_identity_lineage.py`) fails on any author
# string in the register that does not resolve, so a 50th spelling cannot enter
# silently.

version: 1

identities:
  - canonical: 5090-claude
    aliases: ["5090-CLAUDE"]
    node: "5090"
    note: Primary workhorse lane. 51 entries across 8 spellings.

  - canonical: z890-claude
    aliases: ["Z890-CLAUDE"]
    node: z890
    note: >-
      44 entries. Six of them were later reattributed to b850-claude as
      MIS-SIGNED, not as succession -- see `corrections` below. The distinction
      matters: those entries were never z890's work.

  - canonical: b850-claude
    aliases: ["B850-CLAUDE"]
    node: knuckles
    note: >-
      34 entries. `NODE_PROFILES/B850-CLAUDE.md:10` declares the canonical
      register form `B850-CLAUDE (Knuckles)`; four spellings are in use.

  - canonical: 4090-claude
    # `4090-CLAUDE-OPUS-5`: the identity signing with its model appended.
    # Identity 4090-claude, model claude-opus-5 -- both recovered by
    # wearing(), so neither is erased. See the doctrine note below.
    aliases: ["4090-CLAUDE", "4090-claude", "4090-CLAUDE-OPUS-5"]
    node: "4090"
    note: >-
      32 entries across NINE spellings, the widest drift of any identity --
      including `4090-CLAUDE (field)`, `4090-claude (field, voice-binding
      lane)` and `4090-CLAUDE (pr-trim, opus-5)`. `agent_signatures.yaml:216`
      declares `4090-field` as a formal ALTER, so some of that drift is a real
      distinction the register had no field for.

  - canonical: mavis
    aliases: ["Mavis", "Mavis-verifier"]
    node: "5090"
    note: >-
      43 entries. The parenthetical carries an orchestrator UUID
      (`mvs_09c9b116...`, `mvs_5d5493b1...`) -- a session id, not an identity.
      `Mavis-verifier` is listed as an alias rather than a separate identity
      because it appears once and names a role; promote it if that changes.

  - canonical: codex-gpt5
    aliases: ["CODEX-GPT5"]
    note: 30 entries, no drift. The cleanest lane in the register.

  - canonical: claude-opus
    # `CLAUDE-OPUS-5` is a declared ALTER of claude-opus in
    # agent_signatures.yaml, so the model lineage has its own place and
    # does not need to borrow the identity slot.
    aliases: ["CLAUDE-OPUS", "CLAUDE-OPUS-5"]
    note: >-
      32 entries. This is the MODEL-LINEAGE signature
      (`agent_signatures.yaml:45`: "Runs wherever it is launched; the node is a
      location, not an identity"), which is why `CLAUDE-OPUS (Z890)` and
      `CLAUDE-OPUS (Z890-mirror-on-5090)` name a node in the parenthetical
      instead of in the identity.

  - canonical: spark-kimi
    aliases: ["SPARK-KIMI", "KIMI-SPARK"]
    node: spark
    note: 32 entries under two orderings of the same two words.

  - canonical: crush
    aliases: ["CRUSH", "CRUSH-GLM52"]
    note: >-
      13 entries. The `-GLM52` suffix is a MODEL, not a different identity --
      the same lane appears as `CRUSH (z890, glm-5.2)` and `CRUSH-GLM52
      (Z890)`. Merged here; split them if crush-on-GLM is ever meant to be a
      distinct signer.

  - canonical: kilocode-glm
    aliases: ["KILOCODE-GLM"]

  - canonical: pmoves-minimax
    aliases: ["PMOVES-MINIMAX"]

  - canonical: missing-link-hermes
    aliases: ["MISSING-LINK-HERMES"]

  - canonical: cowork-claude
    aliases: ["COWORK-CLAUDE"]
    note: One entry. Kept rather than folded -- a single-use name may be a typo
      or a real one-off lane, and guessing which would be inventing history.

  # --- declared, but NOT resolvable to one identity -------------------------
  # Recorded so the gate can tell "unknown spelling" from "known to be
  # ambiguous". These need an operator decision, not a resolver.
  # RESOLVED 2026-08-25 by operator doctrine, and neither of the two folds we
  # were choosing between was right.
  #
  #   "The signature is not the model, as models hold many; the identity a
  #    model puts on will align with the model and be tuned with the harness."
  #
  # So `CLAUDE-OPUS-5` is not an identity competing with `4090-claude` -- it is
  # a MODEL name appearing in the identity slot, which happens when the wearer
  # signs before an identity has been put on. Folding either way was the wrong
  # question: the string carries an identity AND a model, and the fix is to
  # PARSE it, not to pick one. See `wearing()` in identity_lineage.py.
  #
  # `agent_signatures.yaml` already agrees: claude-opus-5 is declared an ALTER
  # of claude-opus, so the model lineage has its own place and does not need to
  # borrow the identity slot.

  - canonical: z890-to-5090-succession
    kind: unresolved
    aliases: ["Z890→5090-CLAUDE", "Z890->5090-CLAUDE"]
    note: >-
      8 entries. An ARROW inside the author field, because the register has no
      succession edge. Left unresolved on purpose: it is the evidence, and
      collapsing it to either endpoint destroys the only record that a handover
      happened. See `successions` below for the structured form.

# Entry-level attribution repairs. APPEND-ONLY. `recorded_as` preserves what
# the register originally said, which the in-place rewrite destroyed.
corrections:
  - entry: {timestamp: "2026-03-19T22:00:00Z", kind: CLAIM}
    recorded_as: "Z890-CLAUDE"
    actual: b850-claude
    reason: node operated as pmoves-b850-ai-top but mis-signed as Z890-CLAUDE
    asserted_on: "2026-05-16"
    evidence: "d85b46961 (#1504)"
  - entry: {timestamp: "2026-03-19T22:00:00Z", kind: RELEASE}
    recorded_as: "Z890-CLAUDE"
    actual: b850-claude
    reason: node operated as pmoves-b850-ai-top but mis-signed as Z890-CLAUDE
    asserted_on: "2026-05-16"
    evidence: "d85b46961 (#1504)"
  - entry: {timestamp: "2026-03-21T14:00:00Z", kind: CLAIM}
    recorded_as: "Z890-CLAUDE"
    actual: b850-claude
    reason: node operated as pmoves-b850-ai-top but mis-signed as Z890-CLAUDE
    asserted_on: "2026-05-16"
    evidence: "d85b46961 (#1504)"
  - entry: {timestamp: "2026-03-21T17:33:45Z", kind: RELEASE}
    recorded_as: "Z890-CLAUDE"
    actual: b850-claude
    reason: node operated as pmoves-b850-ai-top but mis-signed as Z890-CLAUDE
    asserted_on: "2026-05-16"
    evidence: "d85b46961 (#1504)"
  - entry: {timestamp: "2026-03-27T04:00:00Z", kind: CLAIM}
    recorded_as: "Z890-CLAUDE"
    actual: b850-claude
    reason: node operated as pmoves-b850-ai-top but mis-signed as Z890-CLAUDE
    asserted_on: "2026-05-16"
    evidence: "d85b46961 (#1504)"
  - entry: {timestamp: "2026-03-27T05:00:00Z", kind: RELEASE}
    recorded_as: "Z890-CLAUDE"
    actual: b850-claude
    reason: node operated as pmoves-b850-ai-top but mis-signed as Z890-CLAUDE
    asserted_on: "2026-05-16"
    evidence: "d85b46961 (#1504)"
  - entry: {timestamp: "2026-08-25T01:20:00Z", kind: RELEASE}
    recorded_as: "B850-CLAUDE (Claude Opus 5)"
    actual: b850-claude
    kind_of_correction: key_drift
    reason: >-
      Not a misattribution -- the right identity under a fourth spelling. The
      lane stayed open for a week because claim-collision-pre.py (#2734)
      compares author strings, and two spellings of one identity do not
      collide.
    asserted_on: "2026-08-25"
    evidence: "AGNOTE4482PHI.t1.md, B850-CLAUDE preflight"

  # A MEASUREMENT correction, not an authorship one. The 144/15 figure first
  # recorded on this entry reproduced under no grammar; Codex caught it on
  # #2811 and the replacement figures reproduce exactly. There is no author to
  # recover here -- the entry was signed correctly -- so this record carries
  # `corrects: measurement` and no `actual`.
  - entry:
      timestamp: '2026-08-28T16:47:00Z'
      kind: CLAIM
    corrects: measurement
    reason: >-
      the 144/15 figure reproduced under no grammar and was wrong; the
      replacement figures reproduce exactly
    asserted_on: '2026-08-29'
    evidence: 'Codex P2 review on #2811'
  # A FACTUAL correction, not an authorship one. The entry originally claimed
  # branch_cleanup.py already computed divergence; Codex showed it does not --
  # the complete audit path calls only `git branch --merged` and `git log -1`,
  # and BranchInfo carries no divergence field. The entry was signed correctly,
  # so there is no author to recover and no `actual` to name.
  - entry:
      timestamp: '2026-08-28T17:44:00Z'
      kind: CLAIM
    corrects: fact
    reason: >-
      the entry claimed branch_cleanup.py already computed divergence; its
      audit path calls only `git branch --merged` and `git log -1`, and
      BranchInfo has no divergence field
    asserted_on: '2026-08-29'
    evidence: 'Codex P2 review on #2812'
# The forward edge. "Identity A became identity B" -- what the register has
# never been able to say, and the reason correction #1-6 were implemented as a
# rewrite instead of an edge.
successions:
  - from: z890-claude
    to: 5090-claude
    asserted_on: "2026-07-20"
    evidence: >-
      8 register entries authored as `Z890→5090-CLAUDE (opus 4.7 1M)`. The
      arrow is in the ledger's own data; this record only gives it a field to
      live in.
    confidence: attested-by-usage
    note: >-
      `confidence` is NOT decoration. This edge is inferred from a naming
      convention someone invented under pressure, not from a signed handover
      event. It is strong evidence and it is still not proof, and a lineage
      system that cannot say which of those it has is the thing being fixed.

# ---------------------------------------------------------------------------
# THE PARENTHETICAL, PARSED.
#
# Doctrine (operator, 2026-08-25): an identity is WORN, not owned. "The
# signature is not the model, as models hold many; the identity a model puts on
# will align with the model and be tuned by the harness." So a register author
# string is not one field with noise attached -- it is a wearing event, and the
# parenthetical carries the rest of it.
#
# Measured across 331 entries: 26 distinct parentheticals, comma-separated,
# whose tokens fall into five kinds. This is the (identity, harness, model,
# role) join the pre-restart preflight reports as missing. It has been in the
# ledger for months, unparsed.
#
# Tokens that match nothing are REPORTED, never guessed at -- a wearing event
# with an unrecognised token is a finding, not a default.
# ---------------------------------------------------------------------------

models:
  - canonical: claude-opus-4.7
    aliases: ["opus 4.7 1M", "opus 4.7"]
  - canonical: claude-opus-4.8
    aliases: ["opus 4.8 1M", "opus 4.8", "Opus 4.8", "Claude Opus 4.8"]
  - canonical: claude-opus-5
    aliases: ["Opus 5", "Claude Opus 5", "opus-5", "opus"]
    note: >-
      `opus` bare is folded here rather than left ambiguous: its 2 entries
      postdate the 4.8 -> 5 change. Low confidence, and it is 2 of 331.
  - canonical: claude-fable-5
    aliases: ["Fable 5", "Claude Fable 5"]
  - canonical: claude-sonnet-4.6
    aliases: ["Sonnet 4.6"]
  - canonical: glm-5.2
    aliases: ["glm-5.2", "GLM via qwen3-coder"]
    note: >-
      `GLM via qwen3-coder` names a ROUTE, not a model -- the harness reaching
      GLM through a qwen3-coder endpoint. Folded to the model actually
      answering; the route belongs in the harness field once one exists.
  - canonical: minimax-m3
    aliases: ["MiniMax-M3", "minimax"]

# Lanes and alters. `field` is a declared ALTER of 4090-claude
# (agent_signatures.yaml:216), not a free-text note.
lanes:
  - canonical: field
    aliases: ["field"]
    alter_of: 4090-claude
  - canonical: voice-binding
    aliases: ["voice-binding lane"]
  - canonical: pr-trim
    aliases: ["pr-trim"]
  - canonical: orchestrator
    aliases: ["orchestrator"]
  - canonical: verifier
    aliases: ["verifier"]
  - canonical: infra
    aliases: ["infra"]

# Plan/context-window tokens. Not a model and not a lane -- they qualify the
# model's provisioning, which is a harness property.
provisioning:
  - canonical: max-plan
    aliases: ["MAX"]
  - canonical: context-1m
    aliases: ["1M"]

# Ephemeral session identifiers. Recorded as a KIND so they stop being mistaken
# for identity: `Mavis (orchestrator, mvs_09c9b116...)` is one identity in one
# session, not a distinct agent.
session_id_patterns:
  - "^mvs_[0-9a-f]{32}$"

# Alter lineage. `alters:` in agent_signatures.yaml is a flat list with no
# origin and no ordering, so it cannot express how an alter came to be -- which
# is the same gap as succession, one level in.
alter_lineage:
  - identity: 4090-claude
    alter: field
    became: original-specialization
    origin: unknown
    note: >-
      Operator, 2026-08-25: "field where unknown became alt became original
      Specialization." The alter was not designed and assigned -- it emerged
      from unnamed work, was recognised as an alter, and then became the
      identity's primary specialization. `agent_signatures.yaml:216` records
      the destination ("Polymorphic shape-shifter... Discovered alters by
      mining jewels from PR reviews") and none of the path.
    confidence: operator-asserted

# The HARNESS the identity was worn through. Surfaced by parsing: `SPARK-KIMI
# (Crush, GLM via qwen3-coder)` x17 put a harness in the parenthetical, which
# is the last of the four join fields the preflight says is missing. The suit
# work in #2747 keys `fit` on exactly these names.
harnesses:
  - canonical: crush
    aliases: ["Crush"]
    note: >-
      Ambiguous with the IDENTITY `crush` by name, and deliberately kept
      separate: `SPARK-KIMI (Crush, ...)` is spark-kimi wearing its identity
      THROUGH the crush harness, not the crush identity signing. One is who,
      the other is what they typed into.
  - canonical: claude-code
    aliases: ["claude-code"]
  - canonical: kilocode
    aliases: ["kilocode"]

# An identity worn on hardware that is not its home node. The clearest example
# of the doctrine anywhere in the ledger: `CLAUDE-OPUS (Z890-mirror-on-5090)`
# x4 -- the z890 identity, executing on the 5090. Neither "the node is the
# identity" nor "the node is irrelevant" describes this; the identity is worn,
# and where it was worn is a separate fact worth keeping.
node_relations:
  - token: Z890-mirror-on-5090
    node: "5090"
    mirrored_from: z890
