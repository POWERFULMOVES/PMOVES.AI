# Persona living-doc — public static serve (unprivileged nginx, :8080).
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.persona.yml.
# Document root is the rendered bundle from `make persona-render`.
server {
    listen       8080;
    server_name  persona.pmoves.ai;
    root         /usr/share/nginx/html;
    index        index.html;

    # Public living-doc — conservative security headers. No CSP restricting the
    # PreTeXt MathJax CDN (the built pretext/ pages load it at runtime).
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # SPA-ish fallback for the a2ui shell; real files (pretext/, walkthrough.mp4)
    # are served directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the rendered/immutable assets.
    location ~* \.(mp4|webm|woff2|css|js|svg|png|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Lightweight liveness for `make persona-health` / Traefik.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
