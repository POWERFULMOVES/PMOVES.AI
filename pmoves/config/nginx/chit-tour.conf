# CHIT Visual Tour — public static serve (unprivileged nginx, :8080).
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.chit-tour.yml.
# Document root is website/chit-tour/ (with data.generated.js from
# `make chit-tour-data`).
server {
    listen       8080;
    server_name  chit.pmoves.ai;
    root         /usr/share/nginx/html;
    index        index.html;

    # All tour assets are LOCAL (fonts, D3, Three, data.js) — no CDN — so the CSP
    # can be strict. style-src allows 'unsafe-inline' only for D3/Three runtime
    # positioning; scripts stay 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options   "nosniff"                         always;
    add_header X-Frame-Options          "SAMEORIGIN"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the immutable assets (fonts, vendor, styles, data).
    location ~* \.(woff2|css|js|svg|png|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Lightweight liveness for `make chit-tour-health` / Traefik.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
