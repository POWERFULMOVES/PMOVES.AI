## Docker MCP Toolkit ↔ PMOVES funnel secret map
#
# Lets `make docker-mcp-secrets-hydrate` re-push funnel-managed values into the
# Docker MCP Toolkit secret store (`docker mcp secret set`) WITHOUT manual re-entry
# — the recovery road after a Docker Desktop VMM/backend migration wipes or wedges
# the MCP secret resolver (observed 2026-08-17: ResolverService/GetSecrets timeout,
# fresh mcp-toolkit.db, stuck .mcp-toolkit-migration.lock).
#
# The hydrate tool discovers each ENABLED server's required secrets dynamically from
# Docker's own catalog (~/.docker/mcp/catalogs/docker-mcp.yaml keyed by
# ~/.docker/mcp/registry.yaml), so this file only needs entries where the Docker
# secret's `name` does NOT already resolve to an identically-named env.shared key.
#
# Key   = Docker MCP secret `name` (the dotted, namespaced id used by `docker mcp secret set`).
# Value = the env.shared key holding the value, for secrets the funnel MANAGES
#         (i.e. keys defined in pmoves/chit/secrets_manifest.yaml). A non-null value
#         is only ever PUSHED when that env.shared key holds a real value; an
#         absent/placeholder value is reported as a funnel gap (populate the GH
#         secret), never pushed. Set an entry to `null` to declare it
#         operator-provided / NOT funnel-managed — the tool then reports it as a
#         manual gap and never pushes it.
#
# Classification below is by the secrets manifest (the funnel's source of truth),
# NOT by whether a value happens to sit in env.shared today.
version: 1
map:
  # Funnel-managed (key IS in secrets_manifest.yaml → value flows from env.shared):
  hostinger-mcp-server.api_token: HOSTINGER_API_KEY   # Docker injects as APITOKEN; manifest key HOSTINGER_API_KEY
  dockerhub.pat_token: DOCKERHUB_PAT                  # Docker injects as HUB_PAT_TOKEN; manifest key DOCKERHUB_PAT (github_secret)

  # Operator-provided (NOT in secrets_manifest.yaml) → null so the tool names them
  # as manual gaps and never auto-pushes them, even if a value is present in
  # env.shared. To make one funnel-fed: add its key to the secrets manifest + GH
  # secrets, then set the value here to that env.shared key.
  discord.token: null                                # bot token — distinct from the managed DISCORD_WEBHOOK_URL
  postman.postman-api-key: null
