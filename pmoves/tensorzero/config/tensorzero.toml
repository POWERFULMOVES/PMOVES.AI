# --- GLM-4 Model Family (Zhipu AI) ------------------------------------------
#
# Two endpoint classes — use them accordingly:
#   CODING: https://api.z.ai/api/coding/paas/v4  (Z.ai Coding Plan — code gen only)
#   GENERAL: https://open.bigmodel.cn/api/paas/v4 (BigModel.cn — all capabilities)
#
# The Coding endpoint is restricted to coding scenarios. General endpoint
# supports reasoning, multilingual, long-context, and all other use cases.
# chat_zai_glm (above, line ~237) uses the Coding endpoint for glm-4-flash.
#
# Three tiers: Flash (speed via Z.ai Coding), Plus (quality), Long (128k context)
# HiRAG already uses glm-4-plus + embedding-3 (2048d) — see hi_Search_glm.py
# TensorZero variant weights let you A/B test across tiers via ClickHouse metrics

# GLM-4 Plus: quality tier for complex reasoning (direct BigModel.cn — general endpoint)
[models.glm_4_plus]
routing = ["bigmodel_direct"]

[models.glm_4_plus.providers.bigmodel_direct]
type = "openai"
api_base = "https://open.bigmodel.cn/api/paas/v4"
model_name = "glm-4-plus"
api_key_location = "env::GLM_API_KEY"

# GLM-4 Long: 128k context for large document analysis (direct BigModel.cn — general endpoint)
[models.glm_4_long]
routing = ["bigmodel_long"]

[models.glm_4_long.providers.bigmodel_long]
type = "openai"
api_base = "https://open.bigmodel.cn/api/paas/v4"
model_name = "glm-4-long"
api_key_location = "env::GLM_API_KEY"

