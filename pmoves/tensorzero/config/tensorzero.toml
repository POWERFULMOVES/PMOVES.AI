# BoTZ coding models now use Qwen 3.5 (qwen3-coder/functiongemma don't exist in Ollama)

[models.coding_llama3_cloud]
routing = ["cloudflare_workers"]
[models.coding_llama3_cloud.providers.cloudflare_workers]
type = "openai"
api_base = "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
model_name = "@cf/meta/llama-3.1-8b-instruct"
api_key_location = "env::CLOUDFLARE_API_TOKEN"

# BoTZ orchestrator models now use Qwen 3.5 + LFM2 (gemma3/nemotron-3-nano/qwen3-next don't exist)

[models.vl_sentinel_qwen3vl_local]
routing = ["ollama_local"]
[models.vl_sentinel_qwen3vl_local.providers.ollama_local]
type = "openai"
api_base = "http://pmoves-ollama:11434/v1"
model_name = "qwen3-vl:8b"
api_key_location = "none"




# --- New BoTZ Tools ---

[tools.web_search]
description = "Search the web for information."
parameters = "tools/web_search.json"

# --- New BoTZ Functions ---

# Function: Coding
[functions.coding]
type = "chat"
[functions.coding.variants.primary_local]
type = "chat_completion"
model = "qwen35_9b"
weight = 1.0
[functions.coding.variants.lightweight_local]
type = "chat_completion"
model = "qwen35_4b"
weight = 0.0
[functions.coding.variants.fallback_cloud]
type = "chat_completion"
model = "coding_llama3_cloud"
weight = 0.0

[functions.coding.variants.fallback_alibaba_qwen]
type = "chat_completion"
model = "chat_alibaba_qwen"
weight = 0.0

# Function: Orchestrator
[functions.orchestrator]
type = "chat"
tools = ["web_search"]

[functions.orchestrator.experimentation]
type = "static_weights"
candidate_variants = { primary_cloud = 1.0 }
fallback_variants = ["local_fallback"]

[functions.orchestrator.variants.primary_cloud]
type = "chat_completion"
model = "chat_openai_platform"

[functions.orchestrator.variants.local_fallback]
type = "chat_completion"
model = "qwen35_9b"

# Function: Vision Sentinel
[functions.vl_sentinel]
type = "chat"

[functions.vl_sentinel.variants.primary_local]
type = "chat_completion"
model = "vl_sentinel_qwen3vl_local"
weight = 1.0


