<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>&lt;pm-space-agent-card&gt; — demo</title>
  <style>
    :root {
      --pm-accent: #7C3AED;
      --pm-accent-soft: #A78BFA;
      --pm-accent-strong: #5B21B6;
      --pm-bg: #0b0b10;
      --pm-bg-elevated: #13131a;
      --pm-fg: #FFFFFF;
      --pm-fg-muted: #9ca3af;
      --pm-border: rgba(255, 255, 255, 0.08);
      --pm-radius: 12px;
      --pm-radius-sm: 6px;
      --pm-font-display: 'Orbitron', system-ui;
      --pm-font-body: system-ui, -apple-system, sans-serif;
      --pm-spacing-unit: 8px;
      --pm-motion-fast: 120ms cubic-bezier(0.2, 0, 0, 1);
      --pm-motion-slow: 400ms cubic-bezier(0.2, 0, 0, 1);
    }
    body {
      margin: 0;
      padding: 32px;
      background: var(--pm-bg);
      color: var(--pm-fg);
      font-family: var(--pm-font-body);
      min-height: 100vh;
    }
    h1 {
      font-family: var(--pm-font-display);
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--pm-fg-muted);
      margin: 0 0 16px;
    }
    .stack {
      display: grid;
      gap: 12px;
      max-width: 480px;
    }
    .controls {
      margin-top: 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .controls button {
      background: var(--pm-bg-elevated);
      color: var(--pm-fg);
      border: 1px solid var(--pm-border);
      border-radius: var(--pm-radius-sm);
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
      transition: background var(--pm-motion-fast);
    }
    .controls button:hover {
      background: var(--pm-accent);
    }
    .controls button:focus-visible {
      outline: 2px solid var(--pm-accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <h1>&lt;pm-space-agent-card&gt; — v0.1 demo</h1>

  <div class="stack" id="stack">
    <pm-space-agent-card
      agent-name="CLAUDE-OPUS"
      agent-role="analytical"
      glyph="◆"
      presence="live"
    ></pm-space-agent-card>

    <pm-space-agent-card
      agent-name="DARKXSIDE"
      agent-role="operator"
      glyph="✦"
      presence="rehearsal"
    ></pm-space-agent-card>

    <pm-space-agent-card
      agent-name="B850-CLAUDE"
      agent-role="orchestrator"
      glyph="◆"
      presence="offline"
    ></pm-space-agent-card>

    <pm-space-agent-card
      agent-name="4090-CLAUDE"
      agent-role="field"
      glyph="◆"
      presence="live"
      avatar="https://avatars.githubusercontent.com/u/1?v=4"
    ></pm-space-agent-card>
  </div>

  <div class="controls">
    <button data-presence="live">Set Opus → live</button>
    <button data-presence="rehearsal">Set Opus → rehearsal</button>
    <button data-presence="offline">Set Opus → offline</button>
  </div>

  <script type="module">
    import './pm-space-agent-card.js';

    // Wire up the demo controls: cycle presence on the first card
    const opus = document.querySelector('pm-space-agent-card');
    document.querySelectorAll('.controls button').forEach((btn) => {
      btn.addEventListener('click', () => {
        opus.presence = btn.dataset.presence;
      });
    });
  </script>
</body>
</html>
