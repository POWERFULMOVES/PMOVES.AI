# YAML anchors for tier-based env file loading
x-env-tier-worker: &env-tier-worker
  env_file:
    - path: env.shared.generated
      required: false
    - path: env.shared
      required: false
    - path: env.tier-worker
      required: false
    - path: .env.generated
      required: false

services:
  open-notebook-surrealdb:
    # Managed replacement for the previously hand-run, IN-MEMORY surrealdb
    # container (data survived only as long as that container lived).
    # rocksdb on a named volume = durable; same -ext alias the app expects.
    image: ${OPEN_NOTEBOOK_SURREAL_IMAGE:-surrealdb/surrealdb:v2}
    container_name: pmoves-open-notebook-surrealdb
    restart: unless-stopped
    # Upstream's own compose does this too: the surreal image's non-root user
    # cannot create RocksDB dirs on a fresh named volume.
    user: root
    command:
      - start
      - --log
      - info
      - --user
      - ${OPEN_NOTEBOOK_SURREAL_USER:-${SURREAL_USER:?Set OPEN_NOTEBOOK_SURREAL_USER or SURREAL_USER}}
      - --pass
      - ${OPEN_NOTEBOOK_SURREAL_PASS:-${SURREAL_PASS:?Set OPEN_NOTEBOOK_SURREAL_PASS or SURREAL_PASS}}
      - rocksdb:/mydata/surreal.db
    volumes:
      # Same host path as docker-compose.external.yml's -ext stanza — the two
      # files describe alternative topologies of the SAME database; sharing
      # storage keeps them interchangeable (same container_name enforces
      # only-one-running).
      - ./data/open-notebook/surreal_data:/mydata
    networks:
      pmoves_app:
        aliases:
          - open-notebook-surrealdb-ext

  open-notebook:
    image: ${OPEN_NOTEBOOK_IMAGE:-ghcr.io/powerfulmoves/pmoves-open-notebook:pmoves-latest}
    # Default points at the PMOVES.AI-Edition-v1.13 fork image built from
    # the PMOVES-Open-Notebook submodule (TensorZero provider mode, fail-closed
    # auth, USER directive, /healthz + /metrics, Fernet credential encryption,
    # Phase C hardening: NATS auth, no root SurrealDB defaults).
    # Override OPEN_NOTEBOOK_IMAGE only to pin a specific SHA tag or test an
    # upstream build. The `cataclysm-open-notebook` network alias below is
    # retained per the migration-safe topology policy
    # (pmoves/docs/ARC/network_fabric.md, tools/topology_chit_gate.py).
    container_name: pmoves-open-notebook
    restart: unless-stopped
    # The documented `make up-open-notebook` target starts only this service;
    # depends_on pulls the managed database up with it on clean hosts.
    depends_on:
      - open-notebook-surrealdb
    <<: *env-tier-worker
    environment:
      # UI talks to API on localhost inside container.
      API_URL: http://localhost:5055
      HOSTNAME: 0.0.0.0
      OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD:-${OPEN_NOTEBOOK_API_TOKEN:?Set OPEN_NOTEBOOK_PASSWORD or OPEN_NOTEBOOK_API_TOKEN}}
      OPEN_NOTEBOOK_API_TOKEN: ${OPEN_NOTEBOOK_API_TOKEN:-${OPEN_NOTEBOOK_PASSWORD:?Set OPEN_NOTEBOOK_API_TOKEN or OPEN_NOTEBOOK_PASSWORD}}
      # Enable the SSO Remote-User path (fork RemoteUserAuthMiddleware). Safe
      # to default on: fail-closed — also requires SSO_FORWARD_AUTH_SECRET +
      # the Traefik-injected X-Forward-Auth-Secret header; direct :8503 hits
      # still fall back to the password check.
      TRUST_REMOTE_USER_HEADER: ${TRUST_REMOTE_USER_HEADER:-true}
      NOTEBOOK_PROVIDER_MODE: ${NOTEBOOK_PROVIDER_MODE:-tensorzero}
      TENSORZERO_BASE_URL: ${TENSORZERO_BASE_URL:-http://tensorzero-gateway:3000/v1}
      TENSORZERO_API_KEY: ${TENSORZERO_API_KEY:-pmoves-internal}
      MODEL_REGISTRY_URL: ${MODEL_REGISTRY_URL:-http://model-registry:8110}
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY:-pmoves-default-change-me}
      # Ensure notebook can reach SurrealDB over pmoves_app.
      SURREAL_URL: ws://${OPEN_NOTEBOOK_SURREAL_ADDRESS:-open-notebook-surrealdb-ext}:${OPEN_NOTEBOOK_SURREAL_PORT:-8000}/rpc
      SURREAL_ADDRESS: ${OPEN_NOTEBOOK_SURREAL_ADDRESS:-open-notebook-surrealdb-ext}
      SURREAL_PORT: ${OPEN_NOTEBOOK_SURREAL_PORT:-8000}
      SURREAL_USER: ${OPEN_NOTEBOOK_SURREAL_USER:-${SURREAL_USER:?Set OPEN_NOTEBOOK_SURREAL_USER or SURREAL_USER}}
      SURREAL_PASS: ${OPEN_NOTEBOOK_SURREAL_PASS:-${SURREAL_PASS:?Set OPEN_NOTEBOOK_SURREAL_PASS or SURREAL_PASS}}
      SURREAL_NAMESPACE: ${OPEN_NOTEBOOK_SURREAL_NAMESPACE:-open-notebook}
      SURREAL_DATABASE: ${OPEN_NOTEBOOK_SURREAL_DATABASE:-open-notebook}
    ports:
      - "${OPEN_NOTEBOOK_UI_PORT:-8503}:8502"
      - "${OPEN_NOTEBOOK_API_PORT:-5055}:5055"
    volumes:
      - ./data/open-notebook/notebook_data:/app/data
    networks:
      cataclysm:
        aliases:
          - pmoves-open-notebook
          - cataclysm-open-notebook
      pmoves:
        aliases:
          - pmoves-open-notebook
          - open-notebook
          - cataclysm-open-notebook
      pmoves_api:
        aliases:
          - pmoves-open-notebook
          - open-notebook
      pmoves_app:
        aliases:
          - pmoves-open-notebook
          - open-notebook
          - cataclysm-open-notebook
networks:
  cataclysm:
    external: true
    name: cataclysm-net
  pmoves:
    external: true
    name: pmoves-net
  # Open Notebook uses TensorZero + Ollama for embeddings/LLM routing. Those services live on the tiered
  # Compose networks (pmoves_api / pmoves_app), not the shared pmoves-net bridge.
  pmoves_api:
    external: true
    name: pmoves_api
  pmoves_app:
    external: true
    name: pmoves_app
