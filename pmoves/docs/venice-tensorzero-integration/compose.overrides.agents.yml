version: "3.9"
services:
  agent-zero:
    # image: <your existing agent-zero image>
    env_file:
      - .env
      - .env.agent-zero.override
    environment:
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:-http://tensorzero:3000}
    depends_on: [tensorzero]

  hi-rag-gateway-v2:
    # image: <your existing hi-rag gateway image>
    env_file:
      - .env
      - .env.hirag.override

