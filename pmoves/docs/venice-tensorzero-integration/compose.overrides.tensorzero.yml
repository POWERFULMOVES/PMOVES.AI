# Example overlay. Kept in step with the live definition in
# pmoves/docker-compose.yml (service `tensorzero-gateway`) so copying from this
# doc cannot teach a posture the fleet does not use.
#
# Port publishing follows the fleet idiom: <bind>:<host>:<container>, where BOTH
# the bind address and the host port are variables.
#   - bind defaults to 127.0.0.1, so a service is loopback-only until an operator
#     opts into mesh exposure via env.mesh-bind.local. tools/port_audit.py flags
#     any 0.0.0.0 binding not on that allowlist.
#   - the host port defaults to something OTHER than the container port. The
#     gateway listens on 3000 internally and publishes on 3030. Publishing
#     3000:3000, as this file used to, puts a container port straight onto the
#     host where it collides with anything else expecting 3000 -- and the
#     README two files over already documents 3030 as the host port.
services:
  tensorzero-gateway:
    # Pinned, and matching the live image name. This file previously said
    # `tensorzero/tensorzero:latest`, which is both the wrong repository and
    # unpinned -- a rebuild would silently move versions.
    image: tensorzero/gateway:2026.1.8
    # The gateway image does NOT pick up the mounted config on its own -- it must
    # be told. The live service passes the same flag (pmoves/docker-compose.yml,
    # service tensorzero-gateway). Without it the container either exits looking
    # for a default config or starts with none of the Venice routes below, which
    # is the worse outcome: it comes up healthy and simply cannot route.
    command:
      - --config-file
      - /app/config/tensorzero.toml
    restart: unless-stopped
    env_file: [.env, .env.tensorzero]
    volumes:
      - ./tensorzero.toml:/app/config/tensorzero.toml:ro
    ports:
      - ${TENSORZERO_BIND:-127.0.0.1}:${TENSORZERO_PORT:-3030}:3000
    depends_on: [clickhouse]

  clickhouse:
    image: clickhouse/clickhouse-server:24
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=${TENSORZERO_CLICKHOUSE_DB:-tensorzero}
      - CLICKHOUSE_USER=${TENSORZERO_CLICKHOUSE_USER:-tz}
      - CLICKHOUSE_PASSWORD=${TENSORZERO_CLICKHOUSE_PASSWORD:-changeme}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - ${CLICKHOUSE_BIND:-127.0.0.1}:${CLICKHOUSE_PORT:-8123}:8123

volumes:
  clickhouse-data:
