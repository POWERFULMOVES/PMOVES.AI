schema_version: "1.0.0"
slug: customokio
title: "CustomOkio Scaffold"
description: "PMOVES-side scaffold for new Pinokio launchers (gepeto output). No runtime cost; lives in the registry so creator-studio smoke can reference it as the launchers-author target."
owner: pinokio
version_seen: "0.1.0"
runtime:
  launcher_script: pinokio.js
  autostart: false
  gpu_required: false
  min_vram_mb: 0
  gpu_arch: []
  gpu_reservation_mb: 0
  gpu_reservation_mode: concurrent
  dependencies: []
  requires_hf_login: false
endpoints:
  primary:
    port: 0  # dynamic, resolved via pinokio_bridge /v1/apps/{slug}/status
    protocol: http
    health: null
  alt: []
pinokio_skill_ref: null
network_exposure:
  l1_venv:
    reachable: true
  l2_container_same_host:
    reachable: true
    address: null
  l3_mesh:
    reachable: true
    address: null
    headscale_acl_ports: []
    tags_required: []
  l4_public:
    reachable: false
    tunnel: null
    dns_record: null
    public_url: null
notes:
  - "node tailscale_host=pmoves-z890; runtime facts from slice-1 review-iter-2 cycle-2 record"
  - "mesh_exposure (slice 4) reconciles L3 ACL ports + L4 tunnel + L4 DNS from this entry"
