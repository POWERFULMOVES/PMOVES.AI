    port: 8188
    protocol: http
    health: "/system_stats"
  alt: []
pinokio_skill_ref: null
network_exposure:
  l1_venv:
    reachable: true
  l2_container_same_host:
    reachable: true
    address: "http://host.docker.internal:8188"
  l3_mesh:
    reachable: true
    address: "http://comfyui-desktop.powerfulmoves-1.ts.pmoves.net:8188"
    headscale_acl_ports: [8188]
    tags_required: []
  l4_public:
    reachable: true
    tunnel: pmoves-edge
    dns_record: comfyui-desktop.pmoves.ai
    public_url: https://comfyui-desktop.pmoves.ai
notes:
  - "node tailscale_host=powerfulmoves-1; runtime facts from slice-1 review-iter-2 cycle-2 record"
