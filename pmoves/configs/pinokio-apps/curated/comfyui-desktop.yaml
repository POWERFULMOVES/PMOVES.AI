schema_version: "1.0.0"
slug: comfyui-desktop
title: "ComfyUI Desktop"
description: "Node-based Stable Diffusion / SDXL / Flux workflow runner (Gradio). The primary creator-collab rendering surface for image and video work."
owner: pinokio
version_seen: "0.3.41"
runtime:
  launcher_script: start.js
  autostart: true
  gpu_required: true
  min_vram_mb: 16384
  gpu_arch: [sm_120, sm_110]
  gpu_reservation_mb: 16384
  gpu_reservation_mode: concurrent
  dependencies: []
  requires_hf_login: true
endpoints:
