# Mavis Collection — Example Manifest
# Populated example matching manifest.schema.yaml v1.0.
# This is the FILE shape that gets installed at ~/.mavis/collection/manifest.yaml
# at first boot of the Mavis SDK when G.2+G.3+G.4 land. For G.1, the manifest
# is validated against the schema but the example lives here in repo for review.

spec: pmoves.bootstrap/v1

meta:
  schema_version: 1.0
  created: 2026-10-05
  last_updated: 2026-10-05
  operator: DARKXSIDE
  home: ~/.mavis/collection/
  notes: |
    Initial Mavis / HyPeRAGInT collection manifest. Token Plan auth resolves
    from ~/.mmx/config.json (single source of truth — mmx is the canonical
    CLI). Personas are local to the operator's voice and not synced to PMOVES
    git. Datasets, mindmap, skills, plugins, chit are pointer-only — the
    canonical data lives in pmoves git.

identity:
  agent: HyPeRAGInT
  form_ref: pmoves/configs/agents/forms/hyperagint.yaml
  cross_agent_inheritance:
    - claude-code
    - kilo-code
    - codex
    - hermes
    - glm-coder
    - kimi-coder
    - gpt

super_nodes:
  auth:
    - provider: minimax
      format: sk-cp
      source: ~/.mmx/config.json
      probe: 3-step-gate
      notes: |
        Token Plan keys (sk-cp-...) and pay-as-you-go keys (sk-api-...) are
        not interchangeable per `mmx agent setup --help`. mmx auth status
        returns sk-c... on Token Plan; pay-as-you-go keys pass auth but
        every chat call returns insufficient-balance (1008). The 3-step
        probe gate (auth → quota → chat) catches the format mismatch.

    # Future slots — operator will populate as credentials land
    # - provider: huggingface
    #   format: hf_
    #   source: ~/.huggingface/token
    #   probe: online-status-only
    # - provider: ollama-cloud
    #   format: ollama-cloud
    #   source: ~/.mavis/collection/auth/ollama_cloud.json  # when wired
    #   probe: online-status-only

  models:
    - provider: minimax
      models:
        - MiniMax-M3
        - MiniMax-M2.7
        - MiniMax-M2.7-highspeed
        - image-01
        - speech-2.8-hd
        - asr-1.0
      routing_policy: cost-first
      local_fallback:
        - qwen3-coder:latest      # Ollama local 18GB, code/JSON review
        - qwen3-vl:8b              # Ollama local 6.1GB, quick vision
        - qwen3-vl:235b-cloud     # Ollama Cloud, deep vision (when Pro wired)
        - embeddinggemma           # Ollama local, text embeddings
        - functiongemma            # Ollama local, function calling

  datasets:
    - ref: pmoves/config/datasets.yaml#pmoves-chit-text
      hf_id: DARKXSIDE/pmoves-chit-text
    - ref: pmoves/config/datasets.yaml#pmoves-chit-multimodal
      hf_id: DARKXSIDE/pmoves-chit-multimodal
    - ref: pmoves/config/datasets.yaml#pmoves-agent-traces
      hf_id: DARKXSIDE/pmoves-agent-traces

  personas:
    - ref: personas/fl00.yaml
      name: FlOO$
    - ref: personas/darkxside.yaml
      name: DARKXSIDE
    - ref: personas/mavis-orchestrator.yaml
      name: Mavis Orchestrator

  mindmap:
    - constellation_id: pmoves-core
      endpoint: pmoves/services/gateway/gateway/api/mindmap.py
    - constellation_id: hyperagintz-moniker
      endpoint: pmoves/services/gateway/gateway/api/mindmap.py

  skills:
    - ref: skills/Pmoves-Minimax-skills.yaml
      catalog: POWERFULMOVES/Pmoves-Minimax-skills

  plugins:
    - ref: plugins/Pmoves-MiniMax-Code-Plugins.yaml
      catalog: POWERFULMOVES/Pmoves-MiniMax-Code-Plugins

  chit:
    - spec: pmoves/docs/PMOVESCHIT/CGP_v1.0_SPECIFICATION.md
      role: spec
    - design: pmoves/docs/architecture/HYPERAGINTZ_MONIKER_DESIGN.md
      role: design
    - design: pmoves/docs/architecture/MAVIS_COLLECTION_DESIGN.md
      role: design