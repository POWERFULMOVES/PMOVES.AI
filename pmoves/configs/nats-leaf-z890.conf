# ═══════════════════════════════════════════════════════════════════════════════
# PMOVES.AI — Z890 NATS Leaf Node Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# Local NATS instance for z890 Docker containers.  Bridges the Docker bridge
# network to the upstream NATS hub on 5090 via the leafnodes protocol.
#
# Architecture:
#   5090 (hub)  <──leafnodes──>  z890 (leaf)  <──client──>  containers
#   :7422                        :4222                       nats-leaf:4222
#
# Prerequisites:
#   1. 5090 NATS hub — add to config:  leafnodes { port: 7422 }
#   2. z890 host     — port proxy (Admin PowerShell):
#        netsh interface portproxy add v4tov4 ^
#          listenport=7422 listenaddress=0.0.0.0 ^
#          connectport=7422 connectaddress=192.168.1.65
#      OR via Tailscale:
#        netsh interface portproxy add v4tov4 ^
#          listenport=7422 listenaddress=0.0.0.0 ^
#          connectport=7422 connectaddress=100.73.74.3
#
# The leaf retries upstream indefinitely — works standalone until hub is ready.
# ═══════════════════════════════════════════════════════════════════════════════

server_name: z890-leaf
port: 4222
http_port: 8222

# ── JetStream (local cache — survives upstream disconnects) ─────────────────
jetstream {
  store_dir: /data/jetstream
  max_mem: 256MB
  max_file: 1GB
}

# ── Authorization (matches upstream credentials) ────────────────────────────
authorization {
  user: nats
  password: pmoves
}

# ── Upstream Leaf Connection ────────────────────────────────────────────────
# Connects to 5090 hub via host.docker.internal (Docker → Windows host)
# then via netsh portproxy (Windows host → 5090 LAN IP).
# NATS reconnects automatically on failure — no manual intervention needed.
#
# NOTE: Leafnode auth is separate from client auth. The hub's leafnodes
# block has authorization configured, so credentials are required here.
leafnodes {
  remotes [{
    url: "nats://nats:pmoves@host.docker.internal:7422"
  }]
}
