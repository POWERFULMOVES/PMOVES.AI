# TAC Tree: Pinokio 7 Integration
# Tracks P7 upgrade, SKILL.md discovery, Agent Interpreter integration,
# cross-machine routing via Tailscale, and PMOVES service exposure.
#
# Key files:
#   D:\pinokio\                                       (Pinokio install root)
#   D:\pinokio\api\Ultimate-TTS-Studio.git\           (TTS app — P7 discovery target)
#   pbnj/pinokio/api/pmoves-services/                 (Docker Compose launcher)
#   PMOVES-Pinokio-Ultimate-TTS-Studio/               (TTS launcher submodule)
#   pmoves/configs/tac_trees/voice-agents.tac.yaml    (voice pipeline TAC)
#   pmoves/config/agent_registry.yaml                 (agent identities)

name: "Pinokio 7 Integration"
version: "1.0.0"
description: "Track Pinokio 7 upgrade, Agent Interpreter readiness, SKILL.md exposure, and cross-machine agent routing across the PMOVES fleet"

root:
  id: pinokio-p7
  task: "Pinokio 7 integration review"
  context: "D:\\pinokio\\ + pbnj/pinokio/ + PMOVES-Pinokio-Ultimate-TTS-Studio/"
  agent_hint: 5090-claude
  children:

    # =========================================================================
    # Phase 1: P7 Upgrade Status
    # =========================================================================
    - id: p7.upgrade
      task: "Pinokio 7 upgrade status per machine"
      context: "Desktop Electron app — manual upgrade via auto-updater"
      agent_hint: 5090-claude
      children:
        - id: p7.upgrade.5090
          task: "5090 (POWERFULMOVES) upgraded to v7.0.0"
          action:
            type: manual
            expect: "Pinokio UI shows 'Agents' tab, version >= 7.0.0"
          context: "D:\\pinokio\\ — primary GPU node, 16 apps installed"
          agent_hint: 5090-claude
          status: pending

        - id: p7.upgrade.z890
          task: "Z890 upgraded to v7.0.0"
          action:
            type: manual
            expect: "Pinokio UI shows 'Agents' tab on Z890"
          agent_hint: z890-claude
          status: pending

        - id: p7.upgrade.4090
          task: "4090 Laptop upgraded to v7.0.0"
          action:
            type: manual
            expect: "Pinokio UI shows 'Agents' tab on 4090 laptop"
          agent_hint: 4090-claude
          status: pending

    # =========================================================================
    # Phase 2: Agent Interpreter — SKILL.md Discovery
    # =========================================================================
    - id: p7.interpreter
      task: "P7 Agent Interpreter discovers PMOVES services"
      context: "P7 'pinokio' skill auto-discovers installed apps via SKILL.md"
      agent_hint: 5090-claude
      children:
        - id: p7.interpreter.tts
          task: "Ultimate-TTS-Studio discoverable via Agent Interpreter"
          action:
            type: manual
            expect: "Claude Code 'speak hello' routes through Pinokio to TTS at :7861"
          context: "D:\\pinokio\\api\\Ultimate-TTS-Studio.git\\ — Gradio API at /gradio_api"
          agent_hint: 5090-claude
          status: pending

        - id: p7.interpreter.services
          task: "PMOVES Services launcher discoverable"
          action:
            type: grep
            target: "pbnj/pinokio/api/pmoves-services/pinokio.js"
            pattern: "PMOVES Services"
            expect: "pmoves-services app visible in Pinokio with start/stop controls"
          context: "pbnj/pinokio/api/pmoves-services/ — Docker Compose profile launcher"
          agent_hint: 5090-claude
          status: pending

        - id: p7.interpreter.wan
          task: "WanGP video generation discoverable"
          action:
            type: manual
            expect: "Agent can request 'generate a video' and route to WanGP"
          context: "D:\\pinokio\\api\\wan.git\\ — video generation app"
          agent_hint: 5090-claude
          status: pending

    # =========================================================================
    # Phase 3: App Assistant (Sidebar Chat)
    # =========================================================================
    - id: p7.assistant
      task: "P7 App Assistant sidebar functional"
      context: "P7 'Ask AI' sidebar for in-app chat without leaving the app"
      agent_hint: 5090-claude
      children:
        - id: p7.assistant.tts
          task: "Ask AI works for Ultimate-TTS-Studio"
          action:
            type: manual
            expect: "Sidebar slides in when clicking 'Ask AI', can ask TTS questions"
          agent_hint: 5090-claude
          status: pending

    # =========================================================================
    # Phase 4: Agent Launcher (Session Tracking)
    # =========================================================================
    - id: p7.launcher
      task: "P7 Agent Launcher tracks Claude/Gemini sessions"
      context: "P7 'Agents' tab indexes past sessions by AI agent"
      agent_hint: 5090-claude
      children:
        - id: p7.launcher.tab
          task: "'Agents' tab visible in Pinokio UI"
          action:
            type: manual
            expect: "Agents tab shows past Claude Code, Gemini, Codex sessions"
          agent_hint: 5090-claude
          status: pending

        - id: p7.launcher.resume
          task: "Session resumption works"
          action:
            type: manual
            expect: "Click a past session → picks up where last conversation left off"
          agent_hint: 5090-claude
          status: pending

    # =========================================================================
    # Phase 5: Cross-Machine Routing (Tailscale Mesh)
    # =========================================================================
    - id: p7.mesh
      task: "Cross-machine P7 agent routing via Tailscale"
      context: "Tailscale mesh connects 5090, Z890, 4090 laptop — P7 agents should discover remote apps"
      agent_hint: 4090-claude
      children:
        - id: p7.mesh.tailscale
          task: "All 3 dev machines on Tailscale mesh"
          action:
            type: shell
            command: "tailscale status"
            expect: "pmoves-powerfulmoves, pmoves-z890, pmoves-laptop all online"
          agent_hint: 5090-claude
          status: done

        - id: p7.mesh.remote-tts
          task: "4090 laptop agent can reach 5090 TTS via Tailscale"
          action:
            type: manual
            expect: "From 4090: 'speak hello' routes via Tailscale to 5090 Ultimate-TTS-Studio"
          context: "Requires P7 on both machines + Tailscale mesh + TTS running on 5090"
          agent_hint: 4090-claude
          status: pending
          depends_on: [p7.upgrade.5090, p7.upgrade.4090, p7.interpreter.tts]

        - id: p7.mesh.mobile
          task: "Mobile agent (Discord/Openclaw) reaches 5090 via mesh"
          action:
            type: manual
            expect: "Discord message from phone triggers TTS on 5090 via P7"
          context: "Openclaw/Hermes Agent pattern from P7 announcement"
          agent_hint: 4090-claude
          status: pending

    # =========================================================================
    # Phase 6: PMOVES Service SKILL.md Registration
    # =========================================================================
    - id: p7.skillmd
      task: "PMOVES services registered with P7 via SKILL.md"
      context: "Each service with an API needs SKILL.md for P7 discovery"
      agent_hint: z890-claude
      children:
        - id: p7.skillmd.format
          task: "SKILL.md format spec understood"
          action:
            type: manual
            expect: "P7 SKILL.md format documented (after upgrade, check P7 source)"
          agent_hint: 5090-claude
          status: pending

        - id: p7.skillmd.tts
          task: "Ultimate-TTS-Studio SKILL.md created"
          action:
            type: manual
            expect: "SKILL.md in TTS app folder describes Gradio API endpoints"
          context: "D:\\pinokio\\api\\Ultimate-TTS-Studio.git\\"
          agent_hint: 5090-claude
          status: pending
          depends_on: [p7.skillmd.format]

        - id: p7.skillmd.services
          task: "PMOVES Services launcher SKILL.md created"
          action:
            type: manual
            expect: "SKILL.md in pmoves-services describes Docker profile start/stop"
          context: "pbnj/pinokio/api/pmoves-services/"
          agent_hint: z890-claude
          status: pending
          depends_on: [p7.skillmd.format]

    # =========================================================================
    # Phase 7: NATS Integration (Future)
    # =========================================================================
    - id: p7.nats
      task: "P7 events published to NATS (future)"
      context: "Agent sessions, app launches, cross-machine routing events"
      agent_hint: z890-claude
      children:
        - id: p7.nats.session
          task: "Agent session events on pinokio.agent.session.v1"
          action:
            type: manual
            expect: "P7 agent sessions emit NATS events for observability"
          status: future

        - id: p7.nats.launch
          task: "App launch events on pinokio.app.launched.v1"
          action:
            type: manual
            expect: "P7 app launches emit NATS events"
          status: future
