#   pmoves/configs/tac_trees/tokenism-chit.tac.yaml       (CHIT prior art)
#   pmoves/configs/tac_trees/cataclysm-studios.tac.yaml   (business model TAC)
#   pmoves/configs/tac_trees/observability.tac.yaml       (Prometheus/Grafana TAC)
#
# Convention:
#   action.type: file_exists | file_or | pytest | script | nats_subject |
#                gh_issue | pr_state | supabase_migration | nats_messages_seen | manual
#   status: pending | in_progress | done | blocked
#   agent_hint guides which agent should claim the node

