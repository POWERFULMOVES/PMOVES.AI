# Archon/Agent-Zero polarity formalization, P7 privacy primitives,
# CHIT phrase lexicon, parallel tokenization (stub + hybrid),
# PR critical-path, room-aware safe start/stop, Tracks reprocessing on 4090,
# and v1.1 deferrals (Longbow, viz, retrace lifeline).
#
# Authoritative plan: C:/Users/DARKXSIDE/.claude/plans/we-need-work-and-partitioned-hearth.md
# Plight & Plan: pmoves/docs/launch/PLIGHT_AND_PLAN.md
# PR backlog: pmoves/docs/launch/PR_BACKLOG_CLASSIFICATION.md
# Validation: scripts/validate_launch_layout.py
#
# Key cross-references:
#   pmoves/docs/architecture/PMOVES_MOF_ARCHITECTURE.md   (canonical MOF spec, PR #1378)
#   pmoves/docs/architecture/PMOVES_GRAND_CONVERGENCE.md  (5-layer unification, PR #1379)
