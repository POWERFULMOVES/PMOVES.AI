# TAC Tree: n8n Workflow Review
# Audits all 22+ workflows, categorizes by domain, checks env alignment

name: "n8n Workflow Review"
version: "1.0.0"
description: "Categorize, verify, and identify gaps in n8n workflow inventory"

root:
  id: n8n
  task: "n8n workflow review"
  context: "PMOVES-n8n/workflows/ + pmoves/integrations/*/n8n/flows/"
  agent_hint: codex
  children:
    - id: n8n.categorize
      task: "Categorize all workflows by domain"
      context: "PMOVES-n8n/workflows/"
      agent_hint: codex
      children:
        - id: n8n.categorize.health
          task: "Health domain workflows identified"
          action:
            type: grep
            target: "PMOVES-n8n/workflows/"
            pattern: "health|wger|workout|exercise"
            expect: "Health-related workflows tagged"
          context: "Expected: health_wger_sync, health_weekly_to_cgp, etc."
          agent_hint: codex

        - id: n8n.categorize.finance
          task: "Finance domain workflows identified"
          action:
            type: grep
            target: "PMOVES-n8n/workflows/"
            pattern: "finance|firefly|transaction|budget"
            expect: "Finance-related workflows tagged"
          context: "Expected: finance_firefly_sync, finance_monthly_to_cgp, etc."
          agent_hint: codex

        - id: n8n.categorize.media
          task: "Media domain workflows identified"
          action:
            type: grep
            target: "PMOVES-n8n/workflows/"
            pattern: "media|youtube|jellyfin|video|audio"
            expect: "Media-related workflows tagged"
          context: "YouTube ingestion, Jellyfin metadata, etc."
          agent_hint: codex

        - id: n8n.categorize.ops
          task: "Ops/infra domain workflows identified"
          action:
            type: grep
            target: "PMOVES-n8n/workflows/"
            pattern: "monitor|alert|status|discord|notification"
            expect: "Ops-related workflows tagged"
          context: "Status reporters, Discord notifications, etc."
          agent_hint: codex

    - id: n8n.env
      task: "Env var references match compose"
      context: "Check $env.* references in workflow JSONs"
      agent_hint: codex
      children:
        - id: n8n.env.wger
          task: "Wger env vars align (WGER_BASE_URL, WGER_API_TOKEN)"
          action:
            type: grep
            target: "PMOVES-n8n/workflows/"
            pattern: "WGER_BASE_URL|WGER_API_TOKEN"
            expect: "Env vars match compose definitions"
          context: "docker-compose.wger.yml passes these to n8n service"
          agent_hint: codex

        - id: n8n.env.firefly
          task: "Firefly env vars align (FIREFLY_BASE_URL, FIREFLY_ACCESS_TOKEN)"
          action:
            type: grep
            target: "PMOVES-n8n/workflows/"
            pattern: "FIREFLY_BASE_URL|FIREFLY_ACCESS_TOKEN"
            expect: "Env vars match compose definitions"
          context: "docker-compose.firefly.yml passes these to n8n service"
          agent_hint: codex

        - id: n8n.env.nats
          task: "NATS env vars align"
          action:
            type: grep
            target: "PMOVES-n8n/workflows/"
            pattern: "NATS_URL|nats://"
            expect: "NATS URLs use authenticated format"
          context: "Must use nats://nats:pmoves@nats:4222"
          agent_hint: codex

    - id: n8n.runner
      task: "Runner configuration verified"
      context: "n8n task runner container setup"
      agent_hint: codex
      children:
        - id: n8n.runner.auth
          task: "N8N_RUNNERS_AUTH_TOKEN is set and non-placeholder"
          action:
            type: grep
            target: "pmoves/tools/brand_defaults.py"
            pattern: "N8N_RUNNERS_AUTH_TOKEN"
            expect: "Auto-generated by brand_defaults.py"
          context: "Shared secret between n8n and runners container"
          agent_hint: codex

    - id: n8n.floos
      task: "FlOOS hook wiring"
      context: "pmoves/configs/skill-pairings.yaml"
      agent_hint: codex
      children:
        - id: n8n.floos.health-sync
          task: "health-sync pairing exists"
          action:
            type: grep
            target: "pmoves/configs/skill-pairings.yaml"
            pattern: "health-sync"
            expect: "health-sync pairing defined"
          context: "n8n-health-sync → health-weekly-cgp chain"
          agent_hint: codex

        - id: n8n.floos.finance-sync
          task: "finance-sync pairing exists"
          action:
            type: grep
            target: "pmoves/configs/skill-pairings.yaml"
            pattern: "finance-sync"
            expect: "finance-sync pairing defined"
          context: "n8n-finance-sync → finance-monthly-cgp chain"
          agent_hint: codex

    - id: n8n.cross-domain
      task: "Cross-domain workflow opportunities"
      context: "New workflows connecting health/finance with other domains"
      agent_hint: codex
      children:
        - id: n8n.cross-domain.health-research
          task: "health_to_research.json exists"
          action:
            type: file_exists
            target: "pmoves/integrations/health-wger/n8n/flows/health_to_research.json"
            expect: "Health→DeepResearch workflow present"
          context: "Trigger research on health anomaly detection"
          agent_hint: codex

        - id: n8n.cross-domain.crosswalk
          task: "finance_health_crosswalk.json exists"
          action:
            type: file_exists
            target: "pmoves/integrations/firefly-iii/n8n/flows/finance_health_crosswalk.json"
            expect: "Finance×Health correlation workflow present"
          context: "Correlate supplement purchases with workout performance"
          agent_hint: codex

        - id: n8n.cross-domain.voice-checkin
          task: "voice_health_checkin.json exists"
          action:
            type: file_exists
            target: "pmoves/integrations/health-wger/n8n/flows/voice_health_checkin.json"
            expect: "Voice-prompted health check-in workflow present"
          context: "Daily check-in via Flute-Gateway → Wger API"
          agent_hint: codex

        - id: n8n.cross-domain.status-reporter
          task: "integration_status_reporter.json exists"
          action:
            type: file_exists
            target: "pmoves/integrations/health-wger/n8n/flows/integration_status_reporter.json"
            expect: "Integration health dashboard workflow present"
          context: "Periodic all-services status → Discord"
          agent_hint: codex
