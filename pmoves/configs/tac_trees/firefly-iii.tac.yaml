# TAC Tree: Firefly III (Wealth) Integration Review
# Audits documentation, credential generation, and n8n alignment

name: "Firefly III Integration Review"
version: "1.0.0"
description: "Review and fix Firefly III wealth integration documentation, credentials, and n8n workflow alignment"

root:
  id: firefly-iii
  task: "Firefly III integration review"
  context: "PMOVES-Wealth/ submodule + pmoves/integrations/firefly-iii/"
  agent_hint: codex
  children:
    - id: firefly-iii.docs
      task: "Documentation completeness"
      context: "PMOVES-Wealth/PMOVES.AI_INTEGRATION.md"
      agent_hint: codex
      children:
        - id: firefly-iii.docs.port
          task: "Fix incorrect port 8096 → 8075"
          action:
            type: grep
            target: "PMOVES-Wealth/PMOVES.AI_INTEGRATION.md"
            pattern: "8096"
            invert: true
            expect: "Port references use 8075, not 8096"
          context: "Port 8096 is Cipher Memory, Firefly uses FIREFLY_PORT=8075"
          agent_hint: codex

        - id: firefly-iii.docs.mobile
          task: "Document REST API mobile surface (Waterfly III)"
          action:
            type: grep
            target: "PMOVES-Wealth/PMOVES.AI_INTEGRATION.md"
            pattern: "[Ww]aterfly|[Mm]obile|REST API"
            expect: "Waterfly III mobile app section exists"
          context: "Waterfly III is an unofficial Firefly III mobile app using REST API"
          agent_hint: codex

    - id: firefly-iii.creds
      task: "Credential auto-generation"
      context: "pmoves/tools/brand_defaults.py"
      agent_hint: codex
      children:
        - id: firefly-iii.creds.appkey
          task: "FIREFLY_APP_KEY auto-generated by brand_defaults.py"
          action:
            type: grep
            target: "pmoves/tools/brand_defaults.py"
            pattern: "FIREFLY_APP_KEY"
            expect: "brand_defaults.py generates FIREFLY_APP_KEY"
          context: "Laravel format: base64: + 32 bytes base64-encoded"
          agent_hint: codex

    - id: firefly-iii.overlay
      task: "Overlay compliance checks"
      context: "pmoves/integrations/firefly-iii/"
      agent_hint: codex
      children:
        - id: firefly-iii.overlay.bootstrap
          task: "Auth bootstrap script is functional (not no-op)"
          action:
            type: grep
            target: "pmoves/integrations/firefly-iii/auth/bootstrap.sh"
            pattern: "no-op"
            invert: true
            expect: "Bootstrap script validates FIREFLY_APP_KEY (not a no-op placeholder)"
          context: "Replace placeholder with APP_KEY validation + access token check"
          agent_hint: codex

        - id: firefly-iii.overlay.flows
          task: "n8n flows directory populated with workflow JSONs"
          action:
            type: file_exists
            target: "pmoves/integrations/firefly-iii/n8n/flows/finance_firefly_sync.json"
            expect: "Sync workflow file exists"
          context: "Should contain sync, CGP, webhook, and Supabase workflows"
          agent_hint: codex

        - id: firefly-iii.overlay.subjects
          task: "NATS subjects include transaction sync events"
          action:
            type: grep
            target: "pmoves/integrations/firefly-iii/events/subjects.yaml"
            pattern: "finance\\.transactions\\.synced|finance\\.monthly\\.summary"
            expect: "Transaction sync and monthly summary subjects present"
          context: "Required for finance-sync FlOOS pipeline"
          agent_hint: codex

    - id: firefly-iii.n8n
      task: "n8n workflow env alignment"
      context: "n8n workflows referencing Firefly env vars"
      agent_hint: codex
      children:
        - id: firefly-iii.n8n.env
          task: "Verify finance_firefly_sync.json env refs"
          action:
            type: grep
            target: "pmoves/integrations/firefly-iii/n8n/flows/"
            pattern: "FIREFLY_BASE_URL|FIREFLY_ACCESS_TOKEN"
            expect: "Workflows reference correct env var names"
          context: "Compose passes these via env_file; n8n reads via $env.VAR"
          agent_hint: codex
