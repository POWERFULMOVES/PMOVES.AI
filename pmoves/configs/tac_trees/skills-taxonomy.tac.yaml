# ===========================================================================
# Dependency Chains (from skill-pairings.yaml)
# ===========================================================================
dependency_chains:

  - id: chain.model-benchmark-viz
    name: "Model Benchmark Visualization"
    nats_subject: "skills.pipeline.model-benchmark-viz.v1"
    ultrathink: true
    steps:
      - step: 1
        skill: "huggingface-skills/model-trainer"
        agent: agent-zero
        output: model_id
        nats_hook: "skills.step.model-trainer.done.v1"
      - step: 2
        skill: "hf-benchmark"
        agent: agent-zero
        output: benchmark_results
        nats_hook: "skills.step.hf-benchmark.done.v1"
      - step: 3
        skill: "a2ui-chart"
        agent: archon
        output: a2ui_spec
        nats_hook: "skills.step.a2ui-chart.done.v1"
      - step: 4
        skill: "remotion-render"
        agent: creator
        output: video_url
        nats_hook: "skills.pipeline.model-benchmark-viz.done.v1"

  - id: chain.ingest-chit-index
    name: "CHIT-Enhanced Ingestion"
    nats_subject: "skills.pipeline.ingest-chit-index.v1"
    steps:
      - step: 1
        skill: "extract-worker"
        agent: extract-worker
        output: content_chunks
        nats_hook: "skills.step.extract-worker.done.v1"
      - step: 2
        skill: "chit-encode"
        agent: tokenism
        output: cgp_packets
        nats_hook: "geometry.packet.encoded.v1"
      - step: 3
        skill: "hirag-index"
        agent: hirag
        output: index_result
        nats_hook: "skills.pipeline.ingest-chit-index.done.v1"

  - id: chain.research-summarize-render
    name: "Research to Visual"
    nats_subject: "skills.pipeline.research-render.v1"
    ultrathink: true
    steps:
      - step: 1
        skill: "deepresearch"
        agent: deepresearch
        output: research_results
        nats_hook: "research.deepresearch.result.v1"
      - step: 2
        skill: "a2ui-chart"
        agent: archon
        output: a2ui_spec
        nats_hook: "skills.step.a2ui-chart.done.v1"
      - step: 3
        skill: "remotion-render"
        agent: creator
        output: video_url
        nats_hook: "skills.pipeline.research-render.done.v1"

  - id: chain.chit-3d-viz
    name: "CHIT 3D Visualization"
    nats_subject: "skills.pipeline.chit-3d-viz.v1"
    steps:
      - step: 1
        skill: "chit-encode"
        agent: tokenism
        output: cgp_packets
        nats_hook: "geometry.packet.encoded.v1"
      - step: 2
        skill: "threejs-render"
        agent: hyperdimensions
        output: render_url
        nats_hook: "skills.pipeline.chit-3d-viz.done.v1"

  - id: chain.voice-synthesis
    name: "Text to Prosodic Voice"
    nats_subject: "skills.pipeline.voice-synthesis.v1"
    steps:
      - step: 1
        skill: "text-generate"
        agent: agent-zero
        output: text_content
        nats_hook: "skills.step.text-generate.done.v1"
      - step: 2
        skill: "prosodic-analyze"
        agent: flute-gateway
        output: prosodic_markers
        nats_hook: "skills.step.prosodic-analyze.done.v1"
      - step: 3
        skill: "tts-synthesize"
        agent: ultimate-tts
        output: audio_url
        nats_hook: "skills.pipeline.voice-synthesis.done.v1"

  - id: chain.agent-card-gen
    name: "Agent Card Art Generation"
    nats_subject: "skills.pipeline.agent-card-gen.v1"
    steps:
      - step: 1
        skill: "theme-lookup"
        agent: archon
        output: character_spec
        nats_hook: "skills.step.theme-lookup.done.v1"
      - step: 2
        skill: "comfyui-generate"
        agent: creator
        output: image_url
        nats_hook: "skills.step.comfyui-generate.done.v1"
      - step: 3
        skill: "a2ui-card"
        agent: archon
        output: agent_card
        nats_hook: "skills.pipeline.agent-card-gen.done.v1"

  - id: chain.pr-monitor-graphiti-chit
    name: "PR Monitor Graphiti CHIT Flow"
    nats_subject: "skills.pipeline.pr-monitor-graphiti-chit.v1"
    steps:
      - step: 1
        skill: "pr-monitor"
        command: "/pr-monitor"
        agent: codex
        output: pr_monitor_report
        nats_hook: "ops.pr.monitor.completed.v1"
        make_target: "make -C pmoves pr-monitor"
      - step: 2
        skill: "pr-hedge-trim"
        command: "/pr-trim"
        agent: claude-opus
        output: trim_report
        nats_hook: "ops.pr.trim.completed.v1"
        make_target: "make -C pmoves pr-trim PR=<N>"
      - step: 3
        skill: "pr-learnings-encode"
        command: "/chit:review-sweep"
        agent: tokenism
        output: pr_learnings_packet
        nats_hook: "ops.pr.learnings.encoded.v1"
        make_target: "make -C pmoves pr-monitor-chit-packet"
      - step: 4
        skill: "graphiti-trail-sync"
        command: "/chit:sign-trail"
        agent: archon
        output: graphiti_handoff
        nats_hook: "agent.graphiti.signed.v1"
        make_target: "make -C pmoves sign-trail"

  - id: chain.health-sync
    name: "Health Data Sync"
    nats_subject: "skills.pipeline.health-sync.v1"
    steps:
      - step: 1
        skill: "n8n-health-sync"
        agent: n8n
        output: sync_result
        nats_hook: "health.workouts.synced.v1"
      - step: 2
        skill: "health-weekly-cgp"
        agent: tokenism
        output: cgp_summary
        nats_hook: "health.weekly.summary.v1"

  - id: chain.finance-sync
    name: "Finance Data Sync"
    nats_subject: "skills.pipeline.finance-sync.v1"
    steps:
      - step: 1
        skill: "n8n-finance-sync"
        agent: n8n
        output: sync_result
        nats_hook: "finance.transactions.synced.v1"
      - step: 2
        skill: "finance-monthly-cgp"
        agent: tokenism
        output: cgp_summary
        nats_hook: "finance.monthly.summary.v1"

