# TAC Tree: Skills Taxonomy
# Complete catalog of all PMOVES.AI Claude Code CLI skills grouped by domain.
# Every skill listed in .claude/commands/ is assigned to exactly one domain.
# Cross-references: skill-pairings.yaml dependency chains, NATS subjects, agents.

name: TAC_SKILLS_TAXONOMY
version: "1.0.0"
description: >
  Comprehensive taxonomy of all PMOVES.AI skills (slash commands) organized by
  domain. Maps each skill to its NATS subjects, skill pairing membership, and
  responsible agent. Audit rule: every skill under .claude/commands/ appears in
  exactly one domain.

# ---------------------------------------------------------------------------
# Metadata
# ---------------------------------------------------------------------------
