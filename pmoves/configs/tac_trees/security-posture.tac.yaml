# TAC Tree: Security Posture
# Audits P1/P2 remediation, hardening anchors, JWT auth, NATS credentials, Docker hardening

name: "Security Posture"
version: "1.0.0"
description: "Verify security hardening across the PMOVES.AI stack: P1/P2 status, compose anchors, JWT auth, NATS credentials, Docker best practices"

root:
  id: security-posture
  task: "Security posture review"
  context: "pmoves/docker-compose.yml + pmoves/config/security/ + pmoves/docs/security/"
  agent_hint: codex
  children:

    # =========================================================================
    # Phase 1: Docker Compose Hardening Anchors
    # =========================================================================
    - id: sec.hardening
      task: "Docker Compose hardening anchors"
      context: "pmoves/docker-compose.yml YAML anchors"
      agent_hint: codex
      children:
        - id: sec.hardening.cap-drop
          task: "cap_drop: ALL applied to services"
          action:
            type: grep
            target: "pmoves/docker-compose.yml"
            pattern: "cap_drop.*ALL"
            expect: "Hardening anchor drops all capabilities"
          context: "Base hardening: cap_drop ALL, add back specific caps"
          agent_hint: codex

        - id: sec.hardening.no-new-privileges
          task: "no-new-privileges set in security_opt"
          action:
            type: grep
            target: "pmoves/docker-compose.yml"
            pattern: "no-new-privileges"
            expect: "security_opt includes no-new-privileges"
          context: "Prevents privilege escalation inside containers"
          agent_hint: codex

        - id: sec.hardening.read-only
          task: "Stateless services use read_only: true"
          action:
            type: grep
            target: "pmoves/docker-compose.yml"
            pattern: "read_only.*true"
            expect: "Multiple services have read-only root filesystem"
          context: "Stateless services use -ro hardening variant with tmpfs mounts"
          agent_hint: codex

        - id: sec.hardening.non-root
          task: "Critical services run as non-root"
          action:
            type: grep
            target: "pmoves/docker-compose.yml"
            pattern: "user:.*[0-9]"
            expect: "Services specify non-root user"
          context: "P1 from Phase C audit: Agent Zero, TensorZero needed non-root"
          agent_hint: codex

    # =========================================================================
    # Phase 2: JWT & Authentication
    # =========================================================================
    - id: sec.auth
      task: "Authentication and JWT configuration"
      context: "JWT_SECRET, ANON_KEY, SERVICE_ROLE_KEY"
      agent_hint: codex
      children:
        - id: sec.auth.jwt-secret
          task: "JWT_SECRET is not a placeholder"
          action:
            type: grep
            target: "pmoves/tools/brand_defaults.py"
            pattern: "JWT_SECRET"
            expect: "JWT_SECRET handled by generate-keys.sh, not brand_defaults"
          context: "Generated by scripts/supabase/generate-keys.sh"
          agent_hint: codex

        - id: sec.auth.presign-secret
          task: "PRESIGN_SHARED_SECRET strengthened from default"
          action:
            type: grep
            target: "pmoves/tools/brand_defaults.py"
            pattern: "PRESIGN_SHARED_SECRET"
            expect: "Default is change_me — detected as placeholder"
          context: "Presign service requires shared secret for URL signing"
          agent_hint: codex

        - id: sec.auth.render-webhook-secret
          task: "RENDER_WEBHOOK_SHARED_SECRET strengthened"
          action:
            type: grep
            target: "pmoves/tools/brand_defaults.py"
            pattern: "RENDER_WEBHOOK_SHARED_SECRET"
            expect: "Default is change_me — detected as placeholder"
          context: "ComfyUI render webhook authentication"
          agent_hint: codex

    # =========================================================================
    # Phase 3: NATS Credentials
    # =========================================================================
    - id: sec.nats
      task: "NATS authentication"
      context: "All services must use authenticated NATS URL"
      agent_hint: codex
      children:
        - id: sec.nats.auth-url
          task: "NATS_URL uses authenticated format"
          action:
            type: grep
            target: "pmoves/docker-compose.yml"
            pattern: "nats://nats:pmoves@"
            expect: "Authenticated NATS URL with user:password"
          context: "Must NOT use bare nats://nats:4222"
          agent_hint: codex

        - id: sec.nats.no-bare-url
          task: "No unauthenticated NATS URLs in compose"
          action:
            type: grep
            target: "pmoves/docker-compose.yml"
            pattern: "nats://nats:4222[^/]"
            invert: true
            expect: "No bare NATS URLs without credentials"
          context: "P1 finding from Phase C audit across 8 submodules"
          agent_hint: codex

        - id: sec.nats.healthcheck
          task: "NATS healthcheck on monitoring port"
          action:
            type: grep
            target: "pmoves/docker-compose.yml"
            pattern: "nats.*8222"
            expect: "NATS healthcheck uses port 8222 /varz"
          context: "10+ services depend on NATS service_healthy"
          agent_hint: codex

    # =========================================================================
    # Phase 4: Credential Management
    # =========================================================================
    - id: sec.creds
      task: "Credential management"
      context: "pmoves/tools/brand_defaults.py + env files"
      agent_hint: codex
      children:
        - id: sec.creds.env-gitignored
          task: "env.shared is in .gitignore"
          action:
            type: grep
            target: "pmoves/.gitignore"
            pattern: "env\\.shared"
            expect: "env.shared excluded from version control"
          context: "Contains real secrets, must never be committed"
          agent_hint: codex

        - id: sec.creds.placeholder-detection
          task: "Placeholder values detected and replaced"
          action:
            type: grep
            target: "pmoves/tools/brand_defaults.py"
            pattern: "PLACEHOLDER_VALUES"
            expect: "Set of known placeholder strings defined"
          context: "changeme, change_me, root, etc. auto-replaced"
          agent_hint: codex

        - id: sec.creds.neo4j-strengthened
          task: "Neo4j password auto-generated"
          action:
            type: grep
            target: "pmoves/tools/brand_defaults.py"
            pattern: "NEO4J_PASSWORD.*pm_"
            expect: "Neo4j password generated with pm_ prefix + 16 random bytes"
          context: "P1 finding: default neo4j password was production risk"
          agent_hint: codex

        - id: sec.creds.meili-strengthened
          task: "Meilisearch key strengthened if too short"
          action:
            type: grep
            target: "pmoves/tools/brand_defaults.py"
            pattern: "MEILI_MASTER_KEY.*16"
            expect: "Key regenerated if < 16 chars"
          context: "Default 'master_key' is only 10 chars"
          agent_hint: codex

    # =========================================================================
    # Phase 5: Known P1/P2 Issue Status
    # =========================================================================
    - id: sec.issues
      task: "Known security issue remediation status"
      context: "pmoves/docs/security/ + Phase C audit findings"
      agent_hint: codex
      children:
        - id: sec.issues.tracker
          task: "P2 submodule tracker exists"
          action:
            type: file_exists
            target: "pmoves/docs/security/P2_SUBMODULE_TRACKER.md"
            expect: "Tracker for open/fixed P2 issues"
          context: "Living document maintained after security work"
          agent_hint: codex

        - id: sec.issues.audit-dashboard
          task: "Production audit dashboard exists"
          action:
            type: file_exists
            target: "pmoves/docs/PRODUCTION_AUDIT_DASHBOARD.md"
            expect: "Dashboard with commit SHA and date"
          context: "Living document: refresh after audit/security work"
          agent_hint: codex

        - id: sec.issues.hardening-tracker
          task: "Hardening tracker exists"
          action:
            type: file_exists
            target: "pmoves/docs/hardening/PMOVES-hardening-tracker.md"
            expect: "Docker hardening tracker with per-service status"
          context: "Tracks cap_drop, read_only, non-root per service"
          agent_hint: codex

    # =========================================================================
    # Phase 6: Damage Control Hooks
    # =========================================================================
    - id: sec.hooks
      task: "Damage control hooks"
      context: ".claude/hooks/ — prevent accidental secret exposure and destructive ops"
      agent_hint: codex
      children:
        - id: sec.hooks.env-protection
          task: "Hooks block direct .env file edits"
          action:
            type: file_exists
            target: ".claude/hooks"
            expect: "Hooks directory with damage control scripts"
          context: "Template files use ask pattern, real env files are blocked"
          agent_hint: codex

        - id: sec.hooks.docker-known-roads
          task: "Docker commands redirect to Make targets"
          action:
            type: grep
            target: "pmoves/mk/infra.mk"
            pattern: "volume-reset"
            expect: "Known road targets exist for dangerous operations"
          context: "docker volume rm → make volume-reset SERVICE=..."
          agent_hint: codex
