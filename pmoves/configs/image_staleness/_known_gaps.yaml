# pmoves/configs/image_staleness/_known_gaps.yaml
#
# Images in pmoves/images.yaml whose DECLARED build input does not exist at
# their submodule's PINNED commit -- so the fleet cannot rebuild them today.
#
# WHY A BASELINE AND NOT A FIX
# -----------------------------
# The build matrix names a Dockerfile path for every image. Where that path
# does not exist in the submodule the main repo pins, the image cannot be
# rebuilt. Where NO Dockerfile exists anywhere in the repository, no path
# correction can fix it: an image has to be written.
#
# So the gap is RECORDED rather than silently accepted. The ratchet keeps
# reporting these entries as KNOWN-GAP on every run, a NEW gap fails the
# gate immediately, and a gap that gets FIXED fails the gate too until it is
# dropped from this file -- the same contract as
# `pmoves/configs/command_anchors/_known_gaps.yaml`.
#
# Every reason below was MEASURED against the submodule's pinned commit (the
# gitlink SHA recorded in the main repo, which is what CI materialises),
# not against the submodule's default branch.
#
# WHAT WAS CLOSED, AND HOW EACH PATH WAS CHOSEN
# ---------------------------------------------
# Eight entries were closed by choosing the path that the REPO ITSELF builds,
# not by guessing from a file listing:
#
#   pmoves-archon  -> `Dockerfile` (repo root). PMOVES.AI's own compose
#                     builds this image four times with
#                     `context: ../PMOVES-Archon` + `dockerfile: Dockerfile`.
#   pmoves-yt      -> `pmoves_yt_service/Dockerfile`. PMOVES.AI's compose
#                     builds it with `context: ../PMOVES.YT` +
#                     `dockerfile: pmoves_yt_service/Dockerfile`.
#   pmoves-dox     -> `backend/Dockerfile` (build context `backend`). The
#                     fork's OWN `.github/workflows/docker-publish.yml`
#                     builds `ghcr.io/powerfulmoves/pmoves-dox-backend` with
#                     `context: ./backend` + `file: ./backend/Dockerfile`.
#   pmoves-botz    -> `features/gateway/python-gateway/Dockerfile` (build
#                     context `features/gateway/python-gateway`). The fork's
#                     own root `docker-compose.yml` builds the service named
#                     `pmoves-botz-gateway` from exactly that context.
#   pmoves-jellyfin-ai-media-stack -> SPLIT into three entries
#                     (`-api-gateway`, `-dashboard`, `-audio-processor`).
#                     PMOVES.AI's own `pmoves/docker-compose.jellyfin-ai.yml`
#                     already builds the stack as three services, each with
#                     its own build context; one matrix entry cannot
#                     represent a three-service stack. The old single entry
#                     is GONE, so it is not a gap any more.
#
# The remaining three were closed by AUTHORING a Dockerfile in the fork, at
# the fork's OWN default branch, and bumping the gitlink to the commit that
# carries it. Each image was then BUILT and RUN before the gap was closed --
# a Dockerfile that exists is not one that can be built, and one that builds
# is not one that starts:
#
#   pmoves-hirag       -> `Dockerfile` (repo root), authored in
#                         PMOVES-HiRAG at `8e5283a7eed86ccda6cf08418405c10e6ca13815`
#                         (parent `d8484b2d255b6af39fad1b5185e26ee678d7079b`).
#                         The image BUILDS and the container RUNS as the
#                         non-root `pmoves` user. It is a LIBRARY, not a
#                         server: there is no HTTP entrypoint anywhere in the
#                         repo, and the 8086 gateway is built in-tree by
#                         PMOVES.AI at `pmoves/services/hi-rag-gateway-v2/`,
#                         so the image's entrypoint is a shell.
#                         KNOWN DEFECT, NOT FIXED HERE (upstream's, not the
#                         Dockerfile's): `from hirag import HiRAG` raises
#                         `ImportError: cannot import name 'gpt_4o_complete'
#                         from 'hirag._llm'`. The fork's `_llm.py` is
#                         byte-identical (SHA256) to upstream's, and upstream
#                         HEAD has the same mismatch, so the fix is an edit to
#                         `hirag/*.py` in the fork, not a Dockerfile change.
#   pmoves-deep-serch  -> `Dockerfile` (repo root), authored in
#                         PMOVES-Deep-Serch at `74edbe934ca14e8cb4fd2b59da3893aaab0261de`
#                         (parent `e2af6b6866e19eb300b954127f76adcddc7d1ae4`).
#                         The image BUILDS and the container RUNS: Streamlit
#                         serves on 8098 and `/_stcore/health` returns `ok`.
#   pmoves-remote-view -> `Dockerfile` (repo root), authored in
#                         PMOVES-Remote-View at `93e26f309de387b7ab1773921f64f1dcaa6f1008`
#                         (parent `0e350c19cd9e38e1c8f77d28bcc57f8754770fa5`).
#                         The fork's own `docker/Dockerfile` cannot be built
#                         from a plain checkout -- its CI builds the Rust
#                         binaries as artifacts and downloads them into
#                         `docker/rootfs/usr/bin` first. The new Dockerfile
#                         builds them FROM SOURCE instead, so a plain
#                         `docker build .` produces a working image. The
#                         image BUILDS and the container RUNS: `/usr/bin/hbbs`
#                         and `/usr/bin/hbbr` are present and `hbbs --version`
#                         reports `hbbs 1.1.14`.
#
# There are NO known gaps left. The list is kept (empty) because the ratchet
# fails on a gap that is FIXED but still listed -- that is the half of the
# contract that stops this file from becoming a graveyard.
known_gaps: {}

