# Keys deliberately held EMPTY in env.shared — the clear-key tombstone.
#
# Why this file has to exist
# --------------------------
# `secrets-funnel` runs `secrets-local-hydrate` as its second step, and
# `hydrate()` overlays a value from local.env whenever the env.shared value is a
# *placeholder*. The empty string is the first entry in PLACEHOLDER_VALUES
# (pmoves/services/showtime-api/updater.py), so a key that was deliberately
# cleared is indistinguishable from one that was never set — and the stale
# local.env value gets written straight back on the next funnel run.
#
# That silently reverses `bootstrap_env.py --clear KEY`. Without this list the
# clear appears to succeed and the old credential is restored moments later,
# which is worse than the operation failing outright.
#
# Empty is a real configured state, not an absence: upstream Supabase ships
# SUPABASE_SECRET_KEY and SUPABASE_PUBLISHABLE_KEY empty on purpose and its Kong
# entrypoint strips blank key entries, so a POPULATED one is what breaks the
# deployment (#2593 / #2595 — a duplicate key crash-looped Kong 3,924 times).
#
# Semantics
# ---------
# A key listed here is skipped by `secrets_local_hydrate.hydrate()`, so local.env
# can never re-populate it. `--force` does NOT override this: forcing exists to
# push a rotated GH Secret over a stale local value, which is a different intent
# from "this key is supposed to be empty".
#
# `bootstrap_env.py --clear KEY` appends here automatically. Rotating a real
# value into the key with `--rotate` removes the entry, because the key is no
# longer deliberately empty.
#
# This file holds key NAMES only — never values. It is safe to commit.

cleared_keys: []
