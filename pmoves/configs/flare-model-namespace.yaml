# PMOVES.Flare — Model Namespace Configuration
# Naming convention: pmoves/<model-family>/<variant>
# Used across all nodes for consistent model identification

namespace: "pmoves"
separator: "/"

mappings:
  # --- Coding Plans ---
  glm-coding:
    flare_name: "pmoves/glm-5.1"
    provider: "zai"
    model_id: "glm-5.1"
    api_endpoint: "https://api.z.ai/api/coding/paas/v4"
    lane: "coding_plan"
    nodes: [5090, z890]
    fallback: "glm-4.7"

  claude-coding:
    flare_name: "pmoves/claude-sonnet-4"
    provider: "anthropic"
    model_id: "claude-sonnet-4-20250514"
    claude_code_mapping:
      sonnet: "glm-5.1"
      opus: "glm-5.1"
      haiku: "glm-4.5-air"
    lane: "coding_plan"
    nodes: [z890, 5090]

  codex-coding:
    flare_name: "pmoves/codex-v1"
    provider: "openai"
    model_id: "codex-mini-latest"
    lane: "coding_plan"
    nodes: [z890, 5090]

  # --- Local GPU ---
  qwen-coder:
    flare_name: "pmoves/qwen-3-coder-32b"
    provider: "ollama"
    model_id: "qwen3-coder:32b"
    lane: "local"
    nodes: [5090]
    vllm_compatible: true

  qwen-vl:
    flare_name: "pmoves/qwen-3-vl-8b"
    provider: "ollama"
    model_id: "qwen3-vl:8b"
    lane: "local"
    nodes: [5090]
    vllm_compatible: true

  # --- Inference ---
  gemma-embed:
    flare_name: "pmoves/gemma-3-embed"
    provider: "ollama"
    model_id: "gemma3:embed"
    lane: "local"
    nodes: [z890, 5090]
    purpose: "embeddings"

  # --- NVIDIA NIM ---
  nemotron-super:
    flare_name: "pmoves/nemotron-super-49b"
    provider: "nvidia_nim"
    model_id: "nvidia/llama-3_3-nemotron-super-49b-v1"
    lane: "local"
    nodes: [5090]
    vllm_compatible: false

  # --- Coding ---
  qwen-coder-next:
    flare_name: "pmoves/qwen-3-coder-next-80b"
    provider: "ollama"
    model_id: "qwen3-coder-next:80b"
    lane: "local"
    nodes: [5090, 4090]
    vllm_compatible: true

  # --- Edge Multimodal ---
  gemma-3n-e4b:
    flare_name: "pmoves/gemma-3n-e4b"
    provider: "ollama"
    model_id: "gemma3n:e4b"
    lane: "local"
    nodes: [5090, 4090]

  gemma-3n-e2b:
    flare_name: "pmoves/gemma-3n-e2b"
    provider: "ollama"
    model_id: "gemma3n:e2b"
    lane: "edge"
    nodes: [jetson]

  # --- Gemma 4 Family (Google, Apache 2.0, released 2026-04-02) ---
  # TODO: extend nodes enum with [rdna4, dgx-spark] once PR 2/3 land.
  # Using existing [5090, 4090, z890, jetson] for now.
  gemma-4-e2b:
    flare_name: "pmoves/gemma-4-e2b"
    provider: "ollama"
    model_id: "gemma4:e2b"
    lane: "local"
    nodes: [5090, 4090, z890]

  gemma-4-e4b:
    flare_name: "pmoves/gemma-4-e4b"
    provider: "ollama"
    model_id: "gemma4:e4b"
    lane: "local"
    nodes: [5090, 4090, z890]

  gemma-4-26b-a4b:
    flare_name: "pmoves/gemma-4-26b-a4b"
    provider: "ollama"
    # Ollama publishes the A4B MoE variant as the default ":26b" tag.
    # Verified via registry.ollama.ai manifest API (":26b-a4b" returns 404).
    model_id: "gemma4:26b"
    lane: "local"
    # 15000MB quantized footprint > 4090 laptop available VRAM (16384-2048=14336MB) → OOM.
    # Restricted to 5090 (24GB) until a higher-VRAM 4090 desktop variant is onboarded.
    nodes: [5090]

  gemma-4-31b:
    flare_name: "pmoves/gemma-4-31b"
    provider: "ollama"
    model_id: "gemma4:31b"
    lane: "local"
    nodes: [5090]
