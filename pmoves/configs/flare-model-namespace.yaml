# PMOVES.Flare — Model Namespace Configuration
# Naming convention: pmoves/<model-family>/<variant>
# Used across all nodes for consistent model identification

namespace: "pmoves"
separator: "/"

mappings:
  # --- Coding Plans ---
  glm-coding:
    flare_name: "pmoves/glm-5.1"
    provider: "zai"
    model_id: "glm-5.1"
    api_endpoint: "https://api.z.ai/api/coding/paas/v4"
    lane: "coding_plan"
    nodes: [5090, z890]
    fallback: "glm-4.7"

  claude-coding:
    flare_name: "pmoves/claude-sonnet-4"
    provider: "anthropic"
    model_id: "claude-sonnet-4-20250514"
    claude_code_mapping:
      sonnet: "glm-5.1"
      opus: "glm-5.1"
      haiku: "glm-4.5-air"
    lane: "coding_plan"
    nodes: [z890, 5090]

  codex-coding:
    flare_name: "pmoves/codex-v1"
    provider: "openai"
    model_id: "codex-mini-latest"
    lane: "coding_plan"
    nodes: [z890, 5090]

  # --- Anthropic Provider (Meta-Agent Phase 1) ---
  claude-sonnet-4:
    flare_name: "pmoves/claude-sonnet-4"
    provider: "anthropic"
    model_id: "claude-sonnet-4-5"
    lane: "cloud"
    nodes: [z890, 5090]
    tensorzero_variant: "claude-sonnet-4"

  claude-opus-4:
    flare_name: "pmoves/claude-opus-4"
    provider: "anthropic"
    model_id: "claude-opus-4-5"
    lane: "cloud"
    nodes: [z890, 5090]
    tensorzero_variant: "claude-opus-4"

  claude-haiku-4:
    flare_name: "pmoves/claude-haiku-4"
    provider: "anthropic"
    model_id: "claude-haiku-4-5"
    lane: "cloud"
    nodes: [z890, 5090]
    tensorzero_variant: "claude-haiku-4"

  # --- Z.AI Provider (Meta-Agent Runtime) ---
  glm-5-1:
    flare_name: "pmoves/glm-5.1"
    provider: "zai"
    model_id: "glm-5.1"
    lane: "cloud"
    nodes: [z890, 5090]
    tensorzero_variant: "glm-5.1"
    runtime_model: true

  glm-4-plus:
    flare_name: "pmoves/glm-4-plus"
    provider: "zai"
    model_id: "glm-4-plus"
    lane: "cloud"
    nodes: [z890, 5090]
    tensorzero_variant: "glm-4-plus"

  glm-4-air:
    flare_name: "pmoves/glm-4-air"
    provider: "zai"
    model_id: "glm-4-air"
    lane: "cloud"
    nodes: [z890, 5090]
    tensorzero_variant: "glm-4-air"

  glm-4-flash:
    flare_name: "pmoves/glm-4-flash"
    provider: "zai"
    model_id: "glm-4-flash"
    lane: "cloud"
    nodes: [z890, 5090]
    tensorzero_variant: "glm-4-flash"

  # --- Local GPU ---
  qwen-coder:
    flare_name: "pmoves/qwen-3-coder-32b"
    provider: "ollama"
    model_id: "qwen3-coder:32b"
    lane: "local"
    nodes: [5090, dgx-spark]
    vllm_compatible: true

  qwen-vl:
    flare_name: "pmoves/qwen-3-vl-8b"
    provider: "ollama"
    model_id: "qwen3-vl:8b"
    lane: "local"
    nodes: [5090]
    vllm_compatible: true

  # --- Inference ---
  gemma-embed:
    flare_name: "pmoves/gemma-3-embed"
    provider: "ollama"
    model_id: "gemma3:embed"
    lane: "local"
    nodes: [z890, 5090]
    purpose: "embeddings"

  # --- NVIDIA NIM ---
  nemotron-super:
    flare_name: "pmoves/nemotron-super-49b"
    provider: "nvidia_nim"
    model_id: "nvidia/llama-3_3-nemotron-super-49b-v1"
    lane: "local"
    nodes: [5090]
    vllm_compatible: false

  # --- Coding ---
  qwen-coder-next:
    flare_name: "pmoves/qwen-3-coder-next-80b"
    provider: "ollama"
    model_id: "qwen3-coder-next:80b"
    lane: "local"
    nodes: [5090, 4090]
    vllm_compatible: true

  # --- Edge Multimodal ---
  gemma-3n-e4b:
    flare_name: "pmoves/gemma-3n-e4b"
    provider: "ollama"
    model_id: "gemma3n:e4b"
    lane: "local"
    nodes: [5090, 4090]

  gemma-3n-e2b:
    flare_name: "pmoves/gemma-3n-e2b"
    provider: "ollama"
    model_id: "gemma3n:e2b"
    lane: "edge"
    nodes: [jetson]

  # --- Gemma 4 Family (Google, Apache 2.0, released 2026-04-02) ---
  # Nodes enum extended 2026-04-17: added dgx-spark (GB10 Grace-Blackwell, 128GB unified mem).
  gemma-4-e2b:
    flare_name: "pmoves/gemma-4-e2b"
    provider: "ollama"
    model_id: "gemma4:e2b"
    lane: "local"
    nodes: [5090, 4090, z890, dgx-spark]

  gemma-4-e4b:
    flare_name: "pmoves/gemma-4-e4b"
    provider: "ollama"
    model_id: "gemma4:e4b"
    lane: "local"
    nodes: [5090, 4090, z890, dgx-spark]

  gemma-4-26b-a4b:
    flare_name: "pmoves/gemma-4-26b-a4b"
    provider: "ollama"
    # Ollama publishes the A4B MoE variant as the default ":26b" tag.
    # Verified via registry.ollama.ai manifest API (":26b-a4b" returns 404).
    model_id: "gemma4:26b"
    lane: "local"
    # 15000MB quantized footprint > 4090 laptop available VRAM (16384-2048=14336MB) → OOM.
    # Restricted to 5090 (24GB) until a higher-VRAM 4090 desktop variant is onboarded.
    nodes: [5090]

  gemma-4-31b:
    flare_name: "pmoves/gemma-4-31b"
    provider: "ollama"
    model_id: "gemma4:31b"
    lane: "local"
    nodes: [5090, dgx-spark]

  # --- Phase C: DGX Spark (GB10) + dual R9700 (RDNA4) operator aliases ---
  # All entries target staging endpoints; TensorZero variant weights are 0.0
  # pending 48h soak + load test (see PR description).
  spark-gemma4:
    flare_name: "pmoves/spark-gemma4"
    provider: "ollama_spark"
    model_id: "gemma4:31b"
    tensorzero_variant: "ollama_spark_gemma4_31b_fp16"
    lane: "local"
    nodes: [dgx-spark]

  spark-nemotron3:
    flare_name: "pmoves/spark-nemotron3"
    provider: "ollama_spark"
    # HF: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 (verified 2026-04-19)
    # Spark-only; NOT viable on RDNA4 gfx1201 (no FP8/FP4 kernels).
    model_id: "nemotron-3-super-120b-nvfp4"
    tensorzero_variant: "ollama_spark_nemotron3_super_120b_nvfp4"
    lane: "local"
    nodes: [dgx-spark]

  rdna4-gemma4:
    flare_name: "pmoves/rdna4-gemma4"
    provider: "llamacpp_rocm"
    model_id: "gemma-4-31b-it-Q4_K_M.gguf"
    tensorzero_variant: "llamacpp_rdna4_gemma4_31b_q4km"
    lane: "local"
    nodes: [rdna4]

  rdna4-gemma4-dual:
    flare_name: "pmoves/rdna4-gemma4-dual"
    provider: "llamacpp_rocm"
    # Dual-R9700 row-split (--tensor-split 0.5,0.5 --split-mode row)
    model_id: "gemma-4-26B-A4B-it-Q4_K_M.gguf"
    tensorzero_variant: "llamacpp_rdna4_gemma4_26b_dual"
    lane: "local"
    nodes: [rdna4]

  # --- Phase D: NeMo Hermes V4, Gemma4 Embed, NeMo Omni (2026-05-18) ---
  # NousResearch Hermes 3 (NeMo-compatible) + Unsloth GGUF variants for local inference.
  # Gemma4 text-embedding for Geometry Bus / CHIT vector ops.
  # NeMo Omni VL — multimodal text+vision, Spark-only until quantized variants land.
  hermes-v4-8b:
    flare_name: "pmoves/hermes-v4-8b"
    provider: "ollama"
    model_id: "hermes3:8b"
    hf_id: "NousResearch/Hermes-3-Llama-3.1-8B"
    unsloth_id: "unsloth/Hermes-3-Llama-3.1-8B"
    tensorzero_variant: "ollama_hermes_v4_8b"
    lane: "local"
    # HERMES assist in demo room; Agent Zero subordinate model for reasoning chains
    nodes: [dgx-spark, 5090, 4090, rdna4]
    use_case: [reasoning, instruction, agent-zero-subordinate, demo-room]

  hermes-v4-70b:
    flare_name: "pmoves/hermes-v4-70b"
    provider: "ollama"
    model_id: "hermes3:70b"
    hf_id: "NousResearch/Hermes-3-Llama-3.1-70B"
    unsloth_id: "unsloth/Hermes-3-Llama-3.1-70B"
    tensorzero_variant: "ollama_spark_hermes_v4_70b"
    lane: "local"
    nodes: [dgx-spark]
    use_case: [reasoning, instruction, deep-agent]

  gemma4-embed-text:
    flare_name: "pmoves/gemma4-embed-text"
    provider: "huggingface"
    # Sentence-transformers compatible on-device model (300M, ~1.2GB)
    # API equivalent: gemini-embedding-exp-03-07 / GA: gemini-embedding-001
    hf_id: "google/embeddinggemma-300m"
    lane: "local"
    nodes: [z890, dgx-spark, rdna4]
    use_case: [geometry-bus, chit-vector, hirag-embed]

  nemo-omni-vl:
    flare_name: "pmoves/nemo-omni-vl"
    provider: "nemo"
    # NVIDIA NeMo Omni Vision-Language (text + vision); requires NeMo >= 2.1, CUDA 12.4+
    hf_id: "nvidia/NVLM-D-72B"
    lane: "local"
    nodes: [dgx-spark]
    use_case: [vision, multimodal-reasoning, document-analysis]
