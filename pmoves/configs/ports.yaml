# pmoves/configs/ports.yaml -- the CANONICAL host-port registry.
#
# One entry per service that publishes (or could publish) a host port.
# This file is the single source of truth;
# pmoves/tools/port_registry_ratchet.py checks every compose file against
# it and FAILS the build on drift.
#
# A service holds a LIST OF SLOTS, because a compose service can publish
# several ports. MEASURED: 128 slot conflicts across 146 service names --
# agent-zero publishes an api port and a ui port; archon publishes three;
# nats publishes a client port and a monitoring port.
#
# A SLOT is keyed by its port VARIABLE, because that is the stable name
# the fleet already uses. Fields:
#   host_port       the HOST port. null means DYNAMIC -- Docker assigns a
#                 free host port at run time and no fixed host port is
#                 published at all.
#   container_port  the port the service listens on INSIDE the container.
#                 Two services may share a container port; they may NOT
#                 share a host port.
#   bind_var       the env var naming the bind address, if any.
#   port_var       the env var naming the host port. Compose reads
#                 ${<port_var>:-<host_port>}, so the value here is the
#                 DEFAULT and the operator can override it.
#   compose_files  the compose files that publish this slot.
#   sources        which registries knew about the service.
#
# GENERATED ONCE by a bootstrap over the measured compose population,
# then reviewed and COMMITTED. Do not regenerate wholesale: the ratchet
# exists so this file and the compose files cannot drift apart.
services:
  a0-elder-melchor:
    slots:
      A0_ELDER_PORT:
        bind_var: A0_ELDER_BIND
        compose_files:
        - docker-compose.a0-elder-melchor.yml
        container_port: 8080
        host_port: 8180
        port_var: A0_ELDER_PORT
