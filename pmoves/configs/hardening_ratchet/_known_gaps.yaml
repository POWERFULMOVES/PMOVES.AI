# Baselined container-hardening gaps — hardening_ratchet.py
#
# Each entry is a tracked Dockerfile that runs as root: either it declares
# no USER at all, or its last USER directive is root. They are recorded so
# `hardening-validation` can be enforced today without turning main red in
# a single step. They are NOT approved, and none of them is 'expected'.
#
# The list may shrink and must never silently grow. Removing an entry is
# the goal; adding one should require saying why in the PR. A Dockerfile
# that is fixed but still listed here fails the gate as a STALE entry, so
# the count only goes down.
#
# Regenerate: python pmoves/tools/hardening_ratchet.py --write-baseline
known_gaps:
  - "NO_USER|.github/runners/Dockerfile"
  - "NO_USER|pmoves-nats-mcp/Dockerfile"
  - "NO_USER|pmoves/compose/n8n/Dockerfile"
  - "NO_USER|pmoves/docker/pmoves-4090-web/Dockerfile"
  - "NO_USER|pmoves/docs/PMOVES.AI PLANS/Enhanced Media Stack with Advanced AudioVideo Analysis/Dockerfile"
  - "NO_USER|pmoves/docs/PMOVES.AI PLANS/cipher_pmoves_bundle/Dockerfile.cipher"
  - "NO_USER|pmoves/services/voice-sampler/Dockerfile"
  - "NO_USER|pmoves/services/watch-folder-router/Dockerfile"
  - "ROOT_USER|pmoves/images/jellyfin/Dockerfile"
  # nginx ALREADY drops privileges for the processes that matter, and this
  # entry records a deliberate decision not to change that.
  #
  # Verified against the image rather than assumed:
  #     nginx:1.25-alpine  nginx.conf line 2 -> `user  nginx;`
  #                        PID 1             -> root
  #                        Config.User       -> "" (image declares none)
  #
  # So the master runs as root to bind :80 and spawns WORKERS as the
  # unprivileged `nginx` user. Every process that parses untrusted request data
  # is already non-root; the root process only holds the listening socket and
  # manages workers. That is nginx's documented design, not an oversight.
  #
  # NO_USER is therefore factually true here and misleading as a risk signal.
  # "Fixing" it means moving the listen port (80 -> 8080, breaking the
  # `3001:80` compose mapping) or swapping to nginxinc/nginx-unprivileged --
  # real deployment churn to relocate a master process that already delegates
  # all request handling. Recorded instead, with the reason, so the decision
  # can be re-made rather than rediscovered.
  #
  # Its two siblings in the same stack WERE fixed and are deliberately not
  # here: api-gateway runs as `node`, audio-processor as a created `appuser`.
  # Neither binds a privileged port and neither drops privileges internally --
  # that is the whole difference.
  - "NO_USER|CATACLYSM_STUDIOS_INC/L4-PLATFORM/provisions/docker-stacks/jellyfin-ai/dashboard/Dockerfile"
