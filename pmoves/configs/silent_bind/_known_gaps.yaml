# Recorded silent-bind gaps -- pmoves/tools/silent_bind_ratchet.py
#
# A service that publishes a host port while joined only to internal:true
# networks CANNOT activate that port: Docker stores the binding and never
# activates it (moby/moby#36174; house DOCKER_NETWORK_HARDENING.md Rule 5).
#
# Each entry is a (file, service) pair MEASURED by the ratchet. They are
# recorded so the gate can be ENFORCED today without turning it red in a
# single step. They are NOT approved, and none of them is 'expected'.
#
# The list may shrink and must never silently grow. A service that is fixed
# but still listed here fails the gate as a STALE entry, so the count only
# goes down.
#
# SCOPE OF THE MEASUREMENT
# -----------------------
# 63 compose files in the house scope; 73 (file, service) pairs across 39
# services. A service that appears in BOTH pmoves/docker-compose.yml and its
# generated split overlay is TWO entries, because the overlays are GENERATED
# (scripts/split_compose.py) -- fixing the source and regenerating retires
# both at once.
#
# WHY THEY ARE STILL HERE
# -----------------------
# PMOVES's own history on this class is the precedent: commits 6baaaa1 and
# fec0a97 fixed the AUDITORS that report silent binds, and de27bdb fixed the
# smoke suite that was passing them as expected -- the compose remediation
# was a separate decision. This file records the gaps that decision will
# retire; the reason on each entry states what it is waiting on.
#
# Regenerate: python pmoves/tools/silent_bind_ratchet.py --write-baseline --yes
known_gaps:
- file: docker-compose.agents.yml
  service: a2ui-nats-bridge
  reason: 'Measured 2026-11-22: publishes ${A2UI_BIND:-0.0.0.0}:${A2UI_NATS_BRIDGE_PORT:-9224}:9224
    and joins only internal:true networks (pmoves_app, pmoves_bus), so Docker stores
    the binding and never activates it -- the host port refuses connections (moby/moby#36174;
