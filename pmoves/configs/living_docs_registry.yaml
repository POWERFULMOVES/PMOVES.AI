# PMOVES.AI Living Documents Registry
# ============================================================================
# Files tracked for freshness by `pmoves/tools/docs_reconcile.py`.
# Each entry: path (relative to repo root), freshness_days (max age before
# stale), severity (P1/P2/INFO), and an optional description.
#
# Stale findings:
#   severity: P1  → CI fails (`--check` exits 1)
#   severity: P2  → CI warns but does not fail
#   severity: INFO → reported but never gates
#
# Add new entries here. The reconciler picks them up on the next `--check`.
# ============================================================================

tracked:
