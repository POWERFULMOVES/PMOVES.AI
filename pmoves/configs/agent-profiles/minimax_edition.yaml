# MiniMax Edition Agent Profile
# PMOVES.AI KiloCode MiniMax Edition
#
# Runs on 5090 (primary), SPARK (GB10 unified-memory), or 4090 laptop
# (portable) nodes for MiniMax M2.7/M2.1 inference via Token Plan.
# Complements GLM coding plan with long-context capabilities.
# On SPARK, Mavis shares the node with SPARK-KIMI (Crush/GLM) — the
# harness wire (pmoves.agent.task.v1 subscriber) is what actually makes
# SPARK a dispatch target; affinity alone is a scheduling hint.

name: minimax_edition
role: minimax-kilocode-claw
description: "MiniMax Edition KiloCode claw for MiniMax-M3 inference (m2.7/m2.1 fallback) with long context, character persona synthesis, and multimodal capabilities"

node_affinity:
  - 5090  # Primary - GPU node for character persona generation
  - spark  # GB10 Grace-Blackwell 128GB unified - long-context overflow + edge dispatch
  - laptop-4090  # Portable - for mobile/field work
  - z890  # Fallback - when 5090 unavailable

model:
  provider: minimax
  model: MiniMax-M3  # verifier default ID (Pmoves-MiniMax-Provider-Verifier m3_format_check); M3 since June 2026
  endpoint: https://api.minimax.io/v1  # Token-Plan surface (OpenAI-compatible /v1/chat/completions; chatcompletion_v2 is deprecated)
  fallback_model: minimax-m2.7  # previous primary — 1M-token long-context fallback
  token_plan_api_key_env: MINIMAX_TOKEN_PLAN_API_KEY

capabilities:
  - long_context_research
  - hyperdimensional_reasoning
  - character_persona_synthesis
  - multimodal_generation  # text, speech, video, music, image
  - architecture_visualization
  - agent_trails_navigation
  - writing_vibes
  - prosodic_flow
  - coding_overflow

nats:
  url: nats://nats:pmoves@nats:4222
  subscribe:
    - voice.agent.response.v1
    - tokenism.prosodic.bpm.v1
    - geometry.cgp.v1
    - minimax.character.request.v1
  publish:
    - minimax.character.response.v1
    - minimax.voice.prosodic.v1
    - minimax.agent.trail.v1

# FlOO$ Character Persona System
flOO$:
  enabled: true
  default_persona: dr-bean  # Methodical genius, quietly absurd
  personas:
    - dr-bean:  # Deep analysis, CHIT review
        archetype: methodical_genius
        voice_register: measured_precise
        temperature: 0.3
        speaking_rate: normal
    - mr-clean:  # Deployment, security, hardening
        archetype: precise_powerful
        voice_register: direct_confident
        temperature: 0.1
        speaking_rate: fast
    - powerpuff-girls:  # Multi-agent coordination, celebration
        archetype: specialized_powers
        voice_register: high_energy
        temperature: 0.6
        speaking_rate: varied

exec_permissions:
  - python3
  - curl
  - git
  - make
  - nats
  - docker  # For containerized tasks

health:
  endpoint: http://localhost:3030/api/status
  heartbeat_subject: minimax.agent.status.v1
  heartbeat_interval_seconds: 30

agent_zero:
  subordinate: true
  profile: minimax_edition
  inherit_context: true
  report_to: agent_zero
  model_binding: MiniMax-M3

# TensorZero integration
tensorzero:
  enabled: true
  variants:
    - name: minimax_m3_primary
      model: MiniMax-M3
      weight: 0.7
    - name: minimax_m27_longcontext
      model: minimax-m2.7
      weight: 0.2
    - name: minimax_m21_efficient
      model: minimax-m2.1
      weight: 0.1

# Token Plan quota management
token_plan:
  quota_monitor: true
  fallback_on_quota_exhausted: true
  fallback_provider: glm
  fallback_model: glm-4.7
