# ============================================================
# GLM-4-Air Model Suit
# Role: Lightweight, cost-efficient inference
# Best for: High-volume tasks, edge deployment, documentation
# Provider: Zhipu AI (Z.AI)
# Version: 1.0.0
# ============================================================

model_suit:
  name: glm-4-air
  provider: zhipu_ai
  base_url: "https://api.z.ai/v1"
  api_key_env: ZAI_API_KEY
  
  architecture:
    type: dense
    total_params: "9B"
    active_params: "9B"
    attention: standard
    
  context:
    max_window: 128000
    effective_window: 32000
    working_window: 16000
    
  defaults:
    temperature: 0.7
    top_p: 0.95
    max_tokens: 4096
    frequency_penalty: 0.0
    presence_penalty: 0.0
    
  advanced:
    tool_call_parser: glm4
    enable_thinking: false
    mtp_steps: 1
    
  harness_mappings:
    voice_synthesis:
      temperature: 0.7
      top_p: 0.95
      frequency_penalty: 0.3
      presence_penalty: 0.1
      max_tokens: 256
      system_prompt: conversational_narrator
      
    documentation:
      temperature: 0.6
      top_p: 0.95
      frequency_penalty: 0.15
      presence_penalty: 0.1
      max_tokens: 4096
      system_prompt: conversational_writer
      
    lightweight_coding:
      temperature: 0.6
      top_p: 0.93
      frequency_penalty: 0.2
      presence_penalty: 0.1
      max_tokens: 2048
      system_prompt: directive_engineer
      
    monitoring:
      temperature: 0.2
      top_p: 0.85
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: 1024
      system_prompt: directive_infrastructure
      
    quick_chat:
      temperature: 0.8
      top_p: 0.98
      frequency_penalty: 0.2
      presence_penalty: 0.1
      max_tokens: 1024
      system_prompt: conversational_assistant

  cgp_state_vector:
    delta: 0.4
    Hz: 0.1
    kappa: 1.5
    A: 0.4
    F: 0.05
    
  fallback_to: glm-4-flash
  priority: 10
