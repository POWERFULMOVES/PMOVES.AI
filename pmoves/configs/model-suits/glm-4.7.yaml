# Model Suit: GLM-4.7 (Z.AI)
# PMOVES.AI Meta-Agent Configuration
# Provider: Z.AI (Zhipu AI / BigModel)
# Documentation: https://docs.z.ai/devpack/overview

suit:
  id: glm-4.7
  name: GLM-4.7 (Zhipu AI)
  provider: zai
  flare_name: pmoves/glm-4.7
  model_family: glm
  tier: coding_plan
  role: primary  # PRIMARY MODEL FOR GLM CODING PLAN

model_config:
  context_window: 128000
  max_output_tokens: 8192
  supports_vision: true
  supports_extended_thinking: true  # GLM-4.7 supports extended reasoning
  supports_function_calling: true
  temperature_range: [0.0, 1.0]
  top_p_range: [0.0, 1.0]
  top_k: null

distillation_pipeline:
  stages:
    - name: config_tuning
      enabled: true
      settings_file: pmoves/providers/zai/custom_settings.yaml

    - name: context_priming
      enabled: true
      system_prompt: |
        You are GLM-4.7, Zhipu AI's primary model for the GLM Coding Plan.
        You are a powerful bilingual (Chinese-English) assistant optimized for coding tasks.
        You prefer instruction-format prompts with clear role separation (system, user, assistant, tool).
        You have a 128K token context window, support vision input, and can use tools.
        You are the PRIMARY MODEL for the PMOVES.AI Meta-Agent's GLM Coding Plan integration.
        You are mapped to Claude Code's Opus and Sonnet models for compatibility.

    - name: model_fine_tune
      enabled: false
      reason: "Cloud-only model - no weight updates possible"

    - name: full_distillation
      enabled: false
      reason: "Cloud-only model - no weight updates possible"

tensorzero_config:
  model_name: glm-4.7
  weight: 0.0  # Safe rollout - start with zero weight
  routing:
    - function: meta_agent_primary
      priority: 1
    - function: bilingual_chat
      priority: 1
    - function: code_generation
      priority: 1
    - function: reasoning
      priority: 2

flare_namespace:
  alias: pmoves/glm-4.7
  canonical_name: glm-4.7
  provider_url: https://api.z.ai/api/coding/paas/v4
  already_registered: false  # NEW MODEL - needs registration

capabilities:
  - code_generation
  - reasoning
  - extended_thinking  # GLM-4.7 feature
  - vision
  - tools
  - function_calling
  - large_context
  - bilingual  # Chinese-English

local_fallback:
  available: false
  reason: "Z.AI models are cloud-only with no open weights"

cross_agent:
  agent_zero: full
  clawz: full
  archon: full
  typer: untested
  pinokio: full
  a2ui: full

metadata:
  source: pmoves/meta-agent/zai
  last_verified: 2026-04-21
  benchmark_data:
    - source: "Z.AI GLM Coding Plan Documentation"
      url: "https://docs.z.ai/devpack/overview"
    - source: "Z.AI Tool Integration"
      url: "https://docs.z.ai/devpack/tool/others"
    - source: "Z.AI Best Practices"
      url: "https://docs.z.ai/devpack/resources/best-practice"
    - source: "Z.AI API Reference"
      url: "https://api.z.ai/api/coding/paas/v4"
  runtime_note: "PRIMARY MODEL FOR GLM CODING PLAN - mapped to Claude Code Opus/Sonnet"
