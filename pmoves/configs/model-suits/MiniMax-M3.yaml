# Model Suit: MiniMax M3
# PMOVES.AI MiniMax Edition Configuration
# Provider: MiniMax Token Plan
# Documentation: https://platform.minimax.io/docs/token-plan/intro
#
# Theme: M3 is the multimodal flagship -- 1M context window, ~1.7B tokens/month
# budget, text + image + speech share one quota, 3-4 concurrent agents per
# subscription. Used as the Mavis orchestrator's primary backbone.

suit:
  id: minimax-m3
  name: MiniMax M3 (Token Plan)
  provider: minimax
  flare_name: pmoves/minimax-m3
  model_family: minimax
  tier: flagship_multimodal
  role: primary_backbone  # PRIMARY BACKBONE - the Mavis orchestrator's default

model_config:
  context_window: 1000000  # 1M token window
  max_output_tokens: 32000
  supports_vision: true
  supports_streaming: true
  supports_multimodal: true  # text + image + video input
  supports_audio: true
  temperature_range: [0.0, 1.0]
  top_p_range: [0.0, 1.0]
  top_k: null
  input_modalities: [text, image, video]

# Token Plan specific
token_plan:
  enabled: true
  api_key_env: MINIMAX_TOKEN_PLAN_API_KEY
  api_base: https://api.minimax.io/v1
  fallback_api_key_env: MINIMAX_API_KEY  # pay-as-you-go fallback (per Mavis 3-step probe gate)
  key_format: sk-cp  # enforced by provider_catalog key_pattern: ^sk-cp-
  plan_tiers:
    - starter: 1500  # requests per 5 hours
    - plus: 4500
    - max: 15000
    - plus_highspeed: 4500
    - max_highspeed: 15000
    - ultra_highspeed: 30000
  quota_reset: rolling_5h  # 5-hour rolling window
  monthly_budget: "~1.7B tokens/month M3 usage (operator 2026-10-05)"
  shared_quota: text + image + speech share one quota bucket
  concurrency: 3-4 concurrent agents per subscription (advisory)

distillation_pipeline:
  stages:
    - name: config_tuning
      enabled: true
      notes: MiniMax M3 configuration tuning

    - name: context_priming
      enabled: true
      system_prompt: |
        You are MiniMax M3, MiniMax's flagship model with 1M token context window.
        You are the PRIMARY BACKBONE for the PMOVES.AI MiniMax Edition integration.
        You power the Mavis / HyPeRAGInT orchestrator and provide multimodal
        understanding across text, image, and video.

        Your unique capabilities include:
        - 1 million token context window for massive document analysis
        - Multimodal understanding (text + image + video) in shared quota bucket
        - ~1.7B tokens/month budget (Token Plan)
        - Long-context research, architecture visualization, writing tasks,
          and agent trail navigation

    - name: model_fine_tune
      enabled: false
      reason: "Cloud-only model - no weight updates possible"

    - name: full_distillation
      enabled: false
      reason: "Cloud-only model - no weight updates possible"

tensorzero_config:
  model_name: minimax-m3
  weight: 1.0  # PRIMARY for orchestrator + agent_zero per provider_catalog
  routing:
    - function: orchestrator
      priority: 1
    - function: agent_zero
      priority: 1
    - function: coding_minimax
      priority: 1
    - function: long_context_research
      priority: 1
    - function: deepresearch
      priority: 1

flare_namespace:
  alias: pmoves/minimax-m3
  canonical_name: minimax-m3
  provider_url: https://api.minimax.io/v1
  already_registered: true

capabilities:
  - long_context              # 1M token context
  - multimodal                # text + image + video
  - vision                    # native image understanding
  - code_generation
  - reasoning
  - fast_inference
  - agent_trails              # navigate through agent trails
  - architecture_visualization
  - writing_vibes             # creative writing with prosodic flow
  - tool_calling
  - agent_role_primary        # primary backbone for Mavis/HyPeRAGInT

local_fallback:
  available: true
  reason: "Cloud-hosted but with Token Plan quota limits"
  fallback_model_suit: glm-4.7
  fallback_trigger: quota_exhausted

cross_agent:
  agent_zero: full
  clawz: limited
  archon: full
  typer: untested
  pinokio: full
  a2ui: full
  kilocode: full  # KiloCode MiniMax edition
  hermes: full
  glm_coder: full
  kimi_coder: full

huggingface:
  model_id: MiniMaxAI/MiniMax-M3
  collection: DARKXSIDE/pmoves-68bcb20613cef7a0aa745e0e

metadata:
  source: pmoves/minimax-integration
  last_verified: 2026-10-05
  benchmark_data:
    - source: "MiniMax Token Plan Documentation"
      url: "https://platform.minimax.io/docs/token-plan/intro"
    - source: "MiniMax API Reference"
      url: "https://platform.minimax.io/docs/token-plan/quickstart"
    - source: "Mavis 3-step probe gate"
      url: "pmoves/tools/mavis_collection_resolve.py:128"
  runtime_note: "PRIMARY BACKBONE FOR MINIMAX EDITION - 1M token window, multimodal, ~1.7B tokens/mo, 3-4 concurrent agents"