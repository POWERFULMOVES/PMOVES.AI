# Model Suit: MiniMax M3
# PMOVES.AI MiniMax Edition Configuration
# Provider: MiniMax Token Plan
# Documentation: https://platform.minimax.io/docs/token-plan/intro
#
# Current primary (since June 2026). Model ID is case-sensitive: MiniMax-M3
# exactly (the verifier's m3_format_check default). OpenAI-compatible surface
# https://api.minimax.io/v1/chat/completions; chatcompletion_v2 and the
# api.minimax.chat host are retired. Identity string: MiniMax-M3-taoxi.
# Conformance reference: Pmoves-MiniMax-Provider-Verifier (June 2026 table).

suit:
  id: MiniMax-M3
  name: MiniMax M3 (Token Plan)
  provider: minimax
  flare_name: pmoves/minimax-m3
  model_family: minimax
  tier: flagship
  role: primary  # PRIMARY MODEL — supersedes minimax-m2.7 in that role

model_config:
  context_window: 1000000
  max_output_tokens: 32000
  supports_vision: true
  supports_streaming: true
  supports_multimodal: true  # text, image, video, audio; m3_format_check suites
  supports_thinking: true    # reasoning_content; budget tokens accordingly
  temperature_range: [0.0, 1.0]
  top_p_range: [0.0, 1.0]
  top_k: null

# Token Plan specific
token_plan:
  enabled: true
  api_key_env: MINIMAX_TOKEN_PLAN_API_KEY
  api_base: https://api.minimax.io/v1  # corrected host; chatcompletion_v2 retired
  fallback_api_key_env: MINIMAX_API_KEY  # Pay-as-you-go fallback
  plan_tiers:
    - starter: 1500
    - plus: 4500
    - max: 15000
    - ultra_highspeed: 30000
  quota_reset: rolling_5h

routing_note: |
  Long-context overflow falls to minimax-m2.7 (1M window), efficiency to
  minimax-m2.1. Auth failures on the token-plan key are an operator-custody
  item (verify/rotate on the MiniMax platform), not a routing bug.
