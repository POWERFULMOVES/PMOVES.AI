# PMOVES.AI Skill Pairing & Handoff Schema
# Thread 4.3: Defines how skills chain together
# FlOO$ (Linked Skills with Hooks & Dependencies) — dependency resolution layer

# Each pairing defines a pipeline of skills that work together
# Respects Agent Zero MCP handoff protocol
# FlOO$ fields: depends (services, skills, health), hooks (on_complete, on_error)

pairings:
  # HF Model → Benchmark → Visualize
  model-benchmark-viz:
    name: "Model Benchmark Visualization"
    description: "Train/evaluate model, benchmark it, render animated comparison"
    chain:
      - skill: huggingface-skills/model-trainer
        output: model_id
        agent: agent-zero
        depends:
          services: ["nats:4222"]
          health: "http://localhost:8080/healthz"
        hooks:
          on_complete: "skills.step.model-trainer.done.v1"
          on_error: "skills.error.v1"
      - skill: hf-benchmark
        input: model_id
        output: benchmark_results
        agent: agent-zero
        depends:
          services: ["nats:4222"]
          skills: ["huggingface-skills/model-trainer"]
        hooks:
          on_complete: "skills.step.hf-benchmark.done.v1"
          on_error: "skills.error.v1"
      - skill: a2ui-chart
        input: benchmark_results
        output: a2ui_spec
        agent: archon
        depends:
          services: ["nats:4222"]
          skills: ["hf-benchmark"]
          health: "http://localhost:8091/healthz"
        hooks:
          on_complete: "skills.step.a2ui-chart.done.v1"
          on_error: "skills.error.v1"
      - skill: remotion-render
        input: a2ui_spec
        output: video_url
        agent: creator
        depends:
          services: ["nats:4222"]
          skills: ["a2ui-chart"]
        hooks:
          on_complete: "skills.pipeline.model-benchmark-viz.done.v1"
          on_error: "skills.error.v1"
    ultrathink: true
    nats_subject: "skills.pipeline.model-benchmark-viz.v1"

  # Content Ingest → CHIT Encode → Index
  ingest-chit-index:
    name: "CHIT-Enhanced Ingestion"
    description: "Ingest content, apply CHIT encoding, index to knowledge stores"
    chain:
      - skill: extract-worker
        output: content_chunks
        agent: extract-worker
        depends:
          services: ["nats:4222"]
          health: "http://localhost:8083/healthz"
        hooks:
          on_complete: "skills.step.extract-worker.done.v1"
          on_error: "skills.error.v1"
      - skill: chit-encode
        input: content_chunks
        output: cgp_packets
        agent: tokenism
        depends:
          services: ["nats:4222", "tensorzero:3030"]
          skills: ["extract-worker"]
        hooks:
          on_complete: "geometry.packet.encoded.v1"
          on_error: "skills.error.v1"
      - skill: hirag-index
        input: cgp_packets
        output: index_result
        agent: hirag
        depends:
          services: ["nats:4222", "qdrant:6333", "neo4j:7687", "meilisearch:7700"]
          skills: ["chit-encode"]
          health: "http://localhost:8086/healthz"
        hooks:
          on_complete: "skills.pipeline.ingest-chit-index.done.v1"
          on_error: "skills.error.v1"
    nats_subject: "skills.pipeline.ingest-chit-index.v1"

  # Research → Summarize → Render
  research-summarize-render:
    name: "Research to Visual"
    description: "Deep research, summarize findings, render as animated presentation"
    chain:
      - skill: deepresearch
        output: research_results
        agent: deepresearch
        depends:
          services: ["nats:4222"]
          health: "http://localhost:8098/healthz"
        hooks:
          on_complete: "research.deepresearch.result.v1"
          on_error: "skills.error.v1"
      - skill: a2ui-chart
        input: research_results
        output: a2ui_spec
        agent: archon
        depends:
          services: ["nats:4222"]
          skills: ["deepresearch"]
          health: "http://localhost:8091/healthz"
        hooks:
          on_complete: "skills.step.a2ui-chart.done.v1"
          on_error: "skills.error.v1"
      - skill: remotion-render
        input: a2ui_spec
        output: video_url
        agent: creator
        depends:
          services: ["nats:4222"]
          skills: ["a2ui-chart"]
        hooks:
          on_complete: "skills.pipeline.research-render.done.v1"
          on_error: "skills.error.v1"
    ultrathink: true
    nats_subject: "skills.pipeline.research-render.v1"

  # 3D Visualization of CHIT Geometry
  chit-3d-viz:
    name: "CHIT 3D Visualization"
    description: "Render CHIT constellation geometry in 3D via Three.js"
    chain:
      - skill: chit-encode
        output: cgp_packets
        agent: tokenism
        depends:
          services: ["nats:4222", "tensorzero:3030"]
        hooks:
          on_complete: "geometry.packet.encoded.v1"
          on_error: "skills.error.v1"
      - skill: threejs-render
        input: cgp_packets
        output: render_url
        agent: hyperdimensions
        depends:
          services: ["nats:4222"]
          skills: ["chit-encode"]
        hooks:
          on_complete: "skills.pipeline.chit-3d-viz.done.v1"
          on_error: "skills.error.v1"
    nats_subject: "skills.pipeline.chit-3d-viz.v1"

  # Voice Synthesis Pipeline
  voice-synthesis:
    name: "Text to Prosodic Voice"
    description: "Generate text, apply prosodic analysis, synthesize speech"
    chain:
      - skill: text-generate
        output: text_content
        agent: agent-zero
        depends:
          services: ["nats:4222", "tensorzero:3030"]
          health: "http://localhost:8080/healthz"
        hooks:
          on_complete: "skills.step.text-generate.done.v1"
          on_error: "skills.error.v1"
      - skill: prosodic-analyze
        input: text_content
        output: prosodic_markers
        agent: flute-gateway
        depends:
          services: ["nats:4222"]
          skills: ["text-generate"]
          health: "http://localhost:8055/healthz"
        hooks:
          on_complete: "skills.step.prosodic-analyze.done.v1"
          on_error: "skills.error.v1"
      - skill: tts-synthesize
        input: prosodic_markers
        output: audio_url
        agent: ultimate-tts
        depends:
          services: ["nats:4222"]
          skills: ["prosodic-analyze"]
          health: "http://localhost:7861/gradio_api/info"
        hooks:
          on_complete: "skills.pipeline.voice-synthesis.done.v1"
          on_error: "skills.error.v1"
    nats_subject: "skills.pipeline.voice-synthesis.v1"

  # Agent Card Generation
  agent-card-gen:
    name: "Agent Card Art Generation"
    description: "Generate themed character art for agent cards"
    chain:
      - skill: theme-lookup
        output: character_spec
        agent: archon
        depends:
          services: ["nats:4222"]
          health: "http://localhost:8091/healthz"
        hooks:
          on_complete: "skills.step.theme-lookup.done.v1"
          on_error: "skills.error.v1"
      - skill: comfyui-generate
        input: character_spec
        output: image_url
        agent: creator
        depends:
          services: ["nats:4222"]
          skills: ["theme-lookup"]
        hooks:
          on_complete: "skills.step.comfyui-generate.done.v1"
          on_error: "skills.error.v1"
      - skill: a2ui-card
        input: [character_spec, image_url]
        output: agent_card
        agent: archon
        depends:
          services: ["nats:4222"]
          skills: ["comfyui-generate"]
          health: "http://localhost:8091/healthz"
        hooks:
          on_complete: "skills.pipeline.agent-card-gen.done.v1"
          on_error: "skills.error.v1"
    nats_subject: "skills.pipeline.agent-card-gen.v1"

  # PR Review Monitor -> CHIT Learnings -> Graphiti Trail
  pr-monitor-graphiti-chit:
    name: "PR Monitor Graphiti CHIT Flow"
    description: "Capture merge blockers, encode learnings, and carry Graphiti-ready handoff context"
    chain:
      - skill: pr-monitor
        output: pr_monitor_report
        agent: codex
        depends:
          services: ["nats:4222"]
        hooks:
          on_complete: "ops.pr.monitor.completed.v1"
          on_error: "ops.pr.monitor.failed.v1"
      - skill: pr-hedge-trim
        input: pr_monitor_report
        output: trim_report
        agent: claude-opus
        depends:
          services: ["nats:4222"]
          skills: ["pr-monitor"]
        hooks:
          on_complete: "ops.pr.trim.completed.v1"
          on_error: "ops.pr.monitor.failed.v1"
      - skill: pr-learnings-encode
        input: [pr_monitor_report, trim_report]
        output: pr_learnings_packet
        agent: tokenism
        depends:
          services: ["nats:4222"]
          skills: ["pr-hedge-trim"]
        hooks:
          on_complete: "ops.pr.learnings.encoded.v1"
          on_error: "ops.pr.monitor.failed.v1"
      - skill: graphiti-trail-sync
        input: pr_learnings_packet
        output: graphiti_handoff
        agent: archon
        depends:
          services: ["nats:4222"]
          skills: ["pr-learnings-encode"]
          health: "http://localhost:8091/healthz"
        hooks:
          on_complete: "agent.graphiti.signed.v1"
          on_error: "ops.pr.monitor.failed.v1"
    nats_subject: "skills.pipeline.pr-monitor-graphiti-chit.v1"

  # Health Data Sync Pipeline
  health-sync:
    name: "Health Data Sync"
    description: "Sync Wger health data via n8n, generate weekly CGP summary"
    chain:
      - skill: n8n-health-sync
        output: sync_result
        agent: n8n
        depends:
          services: ["nats:4222", "n8n:5678"]
          health: "http://localhost:8000/api/v2/version"
        hooks:
          on_complete: "health.workouts.synced.v1"
          on_error: "skills.error.v1"
      - skill: health-weekly-cgp
        input: sync_result
        output: cgp_summary
        agent: tokenism
        depends:
          services: ["nats:4222", "tensorzero:3030"]
          skills: ["n8n-health-sync"]
        hooks:
          on_complete: "health.weekly.summary.v1"
          on_error: "skills.error.v1"
    nats_subject: "skills.pipeline.health-sync.v1"

  # Finance Data Sync Pipeline
  finance-sync:
    name: "Finance Data Sync"
    description: "Sync Firefly III transactions via n8n, generate monthly CGP summary"
    chain:
      - skill: n8n-finance-sync
        output: sync_result
        agent: n8n
        depends:
          services: ["nats:4222", "n8n:5678"]
          health: "http://localhost:8075/api/v1/about"
        hooks:
          on_complete: "finance.transactions.synced.v1"
          on_error: "skills.error.v1"
      - skill: finance-monthly-cgp
        input: sync_result
        output: cgp_summary
        agent: tokenism
        depends:
          services: ["nats:4222", "tensorzero:3030"]
          skills: ["n8n-finance-sync"]
        hooks:
          on_complete: "finance.monthly.summary.v1"
          on_error: "skills.error.v1"
    nats_subject: "skills.pipeline.finance-sync.v1"

# Handoff protocol configuration
handoff:
  # How agents pass work between each other
  protocol: "mcp"
  # Agent Zero MCP endpoint for orchestration
  mcp_endpoint: "http://localhost:8080/mcp/command"
  # NATS for async handoffs
  nats_url: "nats://nats:pmoves@nats:4222"
  # Timeout for each skill step (seconds)
  step_timeout: 300
  # Retry policy
  retry:
    max_attempts: 3
    backoff_ms: 1000
    backoff_multiplier: 2

# Skill registry references
skill_sources:
  huggingface-skills: "PMOVES-BoTZ/features/skills/repos/huggingface-skills/"
  threejs-render: "pmoves/skills/threejs-render/"
  remotion-render: "pmoves/skills/remotion-render/"
  chit-encode: ".claude/commands/chit/encode.md"
  a2ui-chart: "pmoves/services/a2ui-renderer/"
  extract-worker: "pmoves/services/extract-worker/"
  pr-monitor: "pmoves/tools/pr_monitor.py"
  pr-hedge-trim: "pmoves/tools/pr_hedge_trim.py"
  pr-learnings-encode: "pmoves/tools/chit_encode_hook.py"
  graphiti-trail-sync: "docs/AGENT_TRAIL.md"
  n8n-health-sync: "pmoves/integrations/health-wger/n8n/flows/"
  n8n-finance-sync: "pmoves/integrations/firefly-iii/n8n/flows/"
  health-weekly-cgp: "pmoves/integrations/health-wger/n8n/flows/health_weekly_to_cgp.json"
  finance-monthly-cgp: "pmoves/integrations/firefly-iii/n8n/flows/finance_monthly_to_cgp.json"

# FlOO$ configuration
floos:
  # Version of the FlOO$ resolver schema
  version: "1.0.0"
  # Default NATS error subject for all pipelines
  default_error_subject: "skills.error.v1"
  # Health check timeout (seconds)
  health_timeout: 5
  # Whether to validate all service deps before starting a pipeline
  pre_validate: true
