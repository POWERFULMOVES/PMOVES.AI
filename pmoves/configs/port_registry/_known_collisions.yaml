# pmoves/configs/port_registry/_known_collisions.yaml
#
# Host ports that TWO OR MORE services publish on purpose.
#
# WHY A BASELINE AND NOT A FIX
# -----------------------------
# `docker compose` cannot publish the same host port twice, so a port with
# two claimants is a real conflict UNLESS the two are alternatives that are
# never up at the same time. This file records WHY each such pair may share
# the port.
#
# The gate fails on:
#   * a NEW collision -- one not listed here;
#   * a STALE entry -- the port is no longer shared, or the SET OF CLAIMANTS
#     changed (so the reason on file was written about different services);
#   * an UNREVIEWED entry -- no reason, or the placeholder "REVIEW THIS".
#
# The `services` and `files` of every entry are COPIED FROM THE MEASUREMENT,
# so they cannot drift from what the gate sees. Only the `reason` is written
# by hand, and it must say WHY these two may share the port.
#
# Every reason below was checked against the Makefile's own compose
# invocations: a pair is safe when their `profiles:` sets are disjoint, or
# when no recipe ever composes the two files they live in.
#
# A collision that is NOT an alternative was FIXED rather than baselined:
# host 8200 (gpu-orchestrator vs nvidia-nim, both under the `gpu` profile)
# was a genuine bind failure and nvidia-nim moved to 8206.
known_collisions:
  '11434':
    files:
    - docker-compose.jetson-edge.override.yml
    - docker-compose.spark-sidecar.yml
    reason: 'ollama-edge (docker-compose.jetson-edge.override.yml) and pmoves-ollama (the default stack,
      the Spark sidecar and the z890 stacks). MEASURED: no Makefile recipe composes the jetson-edge overlay
      with the default stack.'
    services:
    - ollama-edge
    - pmoves-ollama
  '11435':
    files:
    - docker-compose.jellyfin-ai.yml
    - docker-compose.media.yml
    - docker-compose.yml
    - docker-compose.z890.yml
    reason: 'jellyfin-qwen-audio (profiles: [jellyfin-audio-local]) and pmoves-ollama. MEASURED: the jellyfin-audio
      service is declared only in docker-compose.jellyfin-ai.yml and the laptop-4090 overlay, and no Makefile
      recipe composes either with the default stack.'
    services:
    - jellyfin-qwen-audio
    - pmoves-ollama
  '21115':
    files:
    - docker-compose.remote.yml
    - docker-compose.rustdesk.yml
    reason: 'hbbs (docker-compose.rustdesk.yml) and rustdesk-hbbs (docker-compose.remote.yml, profiles:
      [remote]). MEASURED: two alternative RustDesk deployables -- the standalone ''$(PROJECT)-rustdesk''
      compose project and the remote-profile stack -- never composed together.'
    services:
    - hbbs
    - rustdesk-hbbs
  '21116':
    files:
    - docker-compose.remote.yml
    - docker-compose.rustdesk.yml
    reason: 'Same pair as host 21115 -- hbbs (docker-compose.rustdesk.yml) and rustdesk-hbbs (docker-compose.remote.yml,
      profiles: [remote]) are alternative RustDesk deployables.'
    services:
    - hbbs
    - rustdesk-hbbs
  '21117':
    files:
    - docker-compose.remote.yml
    - docker-compose.rustdesk.yml
    reason: 'hbbr (docker-compose.rustdesk.yml) and rustdesk-hbbr (docker-compose.remote.yml, profiles:
      [remote]). MEASURED: alternative RustDesk deployables, never composed together.'
    services:
    - hbbr
    - rustdesk-hbbr
  '21118':
    files:
    - docker-compose.remote.yml
    - docker-compose.rustdesk.yml
    reason: 'hbbs (docker-compose.rustdesk.yml) and rustdesk-hbbs (docker-compose.remote.yml, profiles:
      [remote]). MEASURED: alternative RustDesk deployables, never composed together.'
    services:
    - hbbs
