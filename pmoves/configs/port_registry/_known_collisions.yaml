  '3000':
    files:
    - docker-compose.ui.yml
    - docker-compose.voice.yml
    - docker-compose.yml
    reason: 'invidious (profiles: [invidious]) and vibevoice (profiles: [media, voice]). MEASURED: the
      profiles are disjoint, and vibevoice belongs to the voice stack (core + media + voice) while invidious
      belongs to the default stack.'
    services:
