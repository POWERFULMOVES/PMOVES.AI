    - docker-compose.yml
    reason: 'supabase-kong (profiles: [supabase-local]) and wger (profiles: [health, wger]). MEASURED:
      the profile sets are disjoint, so they are never up together.'
    services:
    - supabase-kong
    - wger
  '8087':
    files:
    - docker-compose.activepieces.yml
    - docker-compose.agents.yml
    - docker-compose.gpu-image.yml
    - docker-compose.yml
    reason: 'activepieces-app (profiles: [automation]) and hi-rag-gateway-v2-gpu. MEASURED: the ActivePieces
      app is started either by ''make activepieces-up'' (which names the services explicitly, so hi-rag-gateway-v2-gpu
      does not come up) or by ''make up-activepieces'', which is a SEPARATE compose project (''pmoves-activepieces'',
      using activepieces/docker-compose.yml). The Hi-RAG v2 GPU gateway is published by the gpu profile.
      No house recipe brings both up; only a raw ''docker compose --profile gpu --profile automation up
      -d'' would collide.'
    services:
    - activepieces-app
    - hi-rag-gateway-v2-gpu
  '8092':
