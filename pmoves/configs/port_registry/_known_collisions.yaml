    - vibevoice
  '4222':
    files:
    - docker-compose.core.yml
    - docker-compose.jetson-edge.override.yml
    - docker-compose.yml
    - docker-compose.z890.yml
    reason: 'The NATS family. nats is the legacy single server and declares NO profiles key, so it is
      always-on in the default stack. nats-hub is the spec section 9 Phase 2 accounts/leaf hub (profiles:
      [nats-hub]); docker-compose.yml documents it as ''profile-gated OFF so default bring-up is unchanged
      until the funnel renders the trust material'' and ''the fork entrypoint fails fast without it'',
      and it carries its own JetStream volume (pmoves-nats-hub-js) so the two never share state. nats-leaf
      belongs to the jetson-edge and z890 stacks only. MEASURED: the hub cannot start today, so the two
      are never up together.'
    services:
    - nats
    - nats-hub
    - nats-leaf
  '443':
    files:
    - docker-compose.traefik.yml
    - docker-compose.vps.override.yml
    reason: Same pair as host 80 -- nginx (docker-compose.vps.override.yml) and traefik (docker-compose.traefik.yml)
      are alternative ingress deployments and are never up together.
    services:
    - nginx
    - traefik
  '80':
    files:
    - docker-compose.traefik.yml
    - docker-compose.vps.override.yml
    reason: 'nginx (docker-compose.vps.override.yml) and traefik (docker-compose.traefik.yml) are alternative
      ingress deployments: the VPS override fronts the stack with nginx, the edge overlay fronts it with
      traefik. MEASURED: no Makefile recipe composes both files, so the two are never up together.'
    services:
    - nginx
    - traefik
