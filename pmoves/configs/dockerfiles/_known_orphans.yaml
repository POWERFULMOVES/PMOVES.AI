# Baseline for `pmoves/tools/validate_dockerfile_paths.py` — operator-
# acknowledged orphan Dockerfiles. The ratchet only fails on
# orphans that are NOT in this file, so the count only goes DOWN
# over time. To remove an entry, either:
#   1. Wire the Dockerfile into a compose `build:` stanza (the right
#      answer when the service is actually being built locally), or
#   2. Delete the Dockerfile (the right answer when the service has
#      been retired).
#
# Initial seed: 2026-08-05, validate-dockerfile-paths ratchet PR.
# Each entry has a one-line reason; replace "needs-review" with a
# specific reason when you next touch that file.

# 4-line stub Dockerfile, never wired up. The n8n service in
# compose is built from the sibling `PMOVES-n8n` submodule, not
# from this stub. Retiring would be a one-line delete.
pmoves/compose/n8n/Dockerfile: 4-line stub Dockerfile referencing n8nio/n8n:2.1.0; the n8n compose service builds from the sibling PMOVES-n8n submodule, this file is unused. Safe to delete.

# Base image used as `FROM <path>/cuda-base` in other Dockerfiles
# (cuda-base appears in several multi-stage builds across the
# services/ tree). It's not a build target itself, just a layer
# source. Wiring it into a compose `build:` stanza would be wrong;
# the right answer is to keep it as a base.
pmoves/docker/cuda-base/Dockerfile: base image; pulled in as `FROM` by other multi-stage Dockerfiles. Not a build target itself.

# Service with Dockerfile but no compose wiring. May be a future
# candidate, retired lane, or side-channel CI service. Operator
# should decide (wire / delete) on next touch.
pmoves/docker/e2b-mcp-server/Dockerfile: service with Dockerfile but no compose wiring; needs-review (wire or retire)

# Same as e2b-mcp-server — service with Dockerfile but no compose
