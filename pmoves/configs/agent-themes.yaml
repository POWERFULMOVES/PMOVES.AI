        traits: [legendary, overpowered, tactical-genius, mentor]
        color_palette: ["#FFD700", "#800080", "#000000"]
        icon: excalibur
      calculator:
        name: Calculator (Arithmetician)
        class: Calculator
        traits: [math-based, analytical, precise, powerful-late-game]
        color_palette: ["#FFFFFF", "#00CED1", "#4B0082"]
        icon: abacus
      mime:
        name: Mime
        class: Mime
        traits: [copycat, adaptive, unpredictable, versatile]
        color_palette: ["#FF69B4", "#9370DB", "#FFFFFF"]
        icon: mask

