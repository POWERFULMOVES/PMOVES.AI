# PMOVES.AI Agent Theme Registry
# Thread 5.1: Creative branding for agent cards
# Mix-and-match: agents can draw from multiple theme packs

theme_packs:
  transformers-1986:
    name: "Transformers: The Movie (1986)"
    description: "Classic Transformers G1 movie characters and voice actors"
    characters:
      optimus-prime:
        name: Optimus Prime
        faction: Autobot
        voice_actor: Peter Cullen
        traits: [leader, selfless, tactical, inspiring]
        color_palette: ["#FF0000", "#0000FF", "#C0C0C0"]
        icon: truck
      megatron:
        name: Megatron
        faction: Decepticon
        voice_actor: Frank Welker
        traits: [ruthless, strategic, powerful, commanding]
        color_palette: ["#808080", "#6B0000", "#000000"]
        icon: cannon
      starscream:
        name: Starscream
        faction: Decepticon
        voice_actor: Chris Latta
        traits: [ambitious, cunning, fast, unreliable]
        color_palette: ["#FF4500", "#1E90FF", "#FFD700"]
        icon: jet
      soundwave:
        name: Soundwave
        faction: Decepticon
        voice_actor: Frank Welker
        traits: [loyal, surveillance, data-collection, monotone]
        color_palette: ["#00008B", "#FFD700", "#C0C0C0"]
        icon: cassette
      hot-rod:
        name: Hot Rod / Rodimus Prime
        faction: Autobot
        voice_actor: Judd Nelson
        traits: [young, impulsive, destined, brave]
        color_palette: ["#FF4500", "#FFD700", "#8B0000"]
        icon: flame
      ultra-magnus:
