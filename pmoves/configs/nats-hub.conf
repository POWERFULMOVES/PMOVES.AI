# ═══════════════════════════════════════════════════════════════════════════════
# PMOVES.AI — NATS Hub Configuration (5090 / Main PC)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Hub node that accepts leaf node connections from Z890, 4090, and future nodes.
# Leaf nodes connect on port 7422, client connections on 4222.
#
# See also: configs/nats-leaf-z890.conf (Z890 leaf node config)

# Client connections
port: 4222

# Monitoring
http_port: 8222

# Authentication (matches existing --user/--pass CLI flags)
authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
}

# JetStream (persistent streams for event-driven architecture)
jetstream {
  store_dir: /data/jetstream
  max_mem: 256MB
  max_file: 2GB
}

# Leafnode listener — Z890/4090 nodes connect here
leafnodes {
  port: 7422
  authorization {
    user: $NATS_USER
    password: $NATS_PASSWORD
  }
}
