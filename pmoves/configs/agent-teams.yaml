version: 1.0.0
teams:
  orchestration:
    name: Orchestration
    description: Core agent coordination, MCP routing, task delegation
    node_affinity:
    - kvm4-1
    - z890
    - powerfulmoves
    ci_runner: ai-lab
    compose_profiles:
    - agents
    - tier-agent
    agents:
    - claude_4090
    - claude_b850
    - crush_glm52
    - claude_5090       # Claude Code CLI identity on the 5090 (primary workhorse)
    - claude_z890       # Claude Code CLI identity on the Z890 (infra coordinator)
    - agent_zero
    - archon
    - supaserch
    - botz_gateway
    - gateway_agent
    - p7_room_orchestrator
    - consciousness_service
    - botz_architect
    - botz_builder
    - botz_auditor
    - space_agent
    - a0_plugins
    - hermes_agent
    - mavis
    - missinglinc_validator
    # The session role every node's launcher starts in; orchestration is the
    # team its CLI identities (claude_b850, claude_4090, ...) already sit in.
    - node_steward
  implementation:
    name: Implementation
    description: Blueprint-first coding and delivery agents
    node_affinity:
    - 5090
    - powerfulmoves
    - z890
    ci_runner: ai-lab
    compose_profiles:
    - agents
    agents:
    - kilocode_glm
  research:
    name: Research & Knowledge
    description: RAG, search, embedding, document processing
    node_affinity:
    - kvm4-1
    - kvm4-2
    - z890
    ci_runner: vps
    compose_profiles:
    - workers
    agents:
    - hirag_v2
    - hf_agent
    - hf_research_agent
    - hf_mcp_server
    - deep_research
    - extract_worker
    - langextract
    - pdf_ingest
    - notebook_sync
    - dox
    - open_notebook
    - cipher_memory
    - notebooklm_agent
    - autoresearch
  media:
    name: Media & Voice
    description: Audio/video processing, TTS, transcription, content creation
    node_affinity:
    - powerfulmoves
    - z890
    ci_runner: ai-lab
    compose_profiles:
    - gpu
    - yt
    agents:
    - pmoves_yt
    - ffmpeg_whisper
    - media_video
    - media_audio
    - ultimate_tts
    - flute_gateway
    - channel_monitor
    - jellyfin_bridge
    - jellyfin_ai
    - creator
    - transcribe_and_fetch
    - cast_tts_gateway
    - remotion_renderer
    - podcast_producer
    - youtube_publisher
    - cipher_beats_analyst
    - darkxside_persona
  data:
    name: Data & Storage
    description: Databases, message bus, object storage, monitoring
    node_affinity:
    - kvm4-2
    - z890
    ci_runner: vps
    compose_profiles:
    - monitoring
    - supabase-local
    agents:
    - nats
    - supabase
    - qdrant
    - neo4j
    - meilisearch
    - minio
    - prometheus
    - grafana
    - loki
  ui:
    name: User Interfaces
    description: Frontend surfaces, visualization, remote access
    node_affinity:
    - z890
    - powerfulmoves
    ci_runner: ubuntu-latest
    compose_profiles: []
    agents:
    - mai_ui
    - crush
    - a2ui
    - hyperdimensions
    - invidious
    - rustdesk
  automation:
    name: Automation & Notifications
    description: Workflow automation, notifications, webhook handling
    node_affinity:
    - kvm4-1
    - z890
    ci_runner: vps
    compose_profiles:
    - workers
    agents:
    - n8n
    - publisher_discord
    - render_webhook
    - presign
    - clawz
    - pmoves_ci_bot
    - pr_hedge_trim
  evolution:
    name: Evolution & CHIT
    description: Evolutionary optimization, CHIT encoding, swarm attribution
    node_affinity:
    - powerfulmoves
    - z890
    ci_runner: ai-lab
    compose_profiles:
    - gpu
    agents:
    - evoswarm_controller
    - swarm_attribution
    - tensorzero
    - llama_lab
    - nemotron_claw
  infra:
    name: Infrastructure & Networking
    description: VPN, fleet management, node coordination, edge GPU agents
    node_affinity:
    - kvm4-1
    - kvm2
    - jetson
    ci_runner: vps
    compose_profiles: []
    agents:
    - mesh_agent
    - container_agent
    - headscale
    - vps_fleet_manager
    - nemoclaw
  sandbox:
    name: Sandbox & Execution
    description: Isolated code execution environments (E2B)
    node_affinity:
    - cloud
    ci_runner: ubuntu-latest
    compose_profiles: []
    agents:
    - e2b_danger_room
    - e2b_desktop
    - e2b_spells
    - danger_infra
    - surf
    - agentgym
    - agentgym_rl
    - pmoves_e2b_mcp_server
  external:
    name: External Contributors
    description: AI agents and humans who contribute via git (no node affinity)
    node_affinity: []
    ci_runner: null
    compose_profiles: []
    agents: []
  life:
    name: Life Integration
    description: Health, wealth, and personal data integrations
    node_affinity:
    - z890
    ci_runner: ubuntu-latest
    compose_profiles: []
    agents:
    - wealth
    - health
  observability:
    name: Observability & Monitoring
    description: Metrics, logs, traces, dashboards, and alerting for MOF surface area
    node_affinity:
    - kvm4-1
    - z890
    ci_runner: ai-lab
    compose_profiles:
    - monitoring
    agents:
    - metrics_specialist
    - dashboard_specialist
    - logs_specialist
    - tracing_specialist
    - llm_observability
  fordham_community:
    name: Fordham Hill Community
    description: 'Community mesh cost-pooling + co-op self-governance pilot: onboarding,
      pooled-dues ledger, resident materials/dashboard, accessible voice. Agents runtime-minted
      by Archon for room fordham.room.community. DRAFT - REQUIRES LEGAL REVIEW.'
    node_affinity:
    - kvm4-1
    - kvm4-2
    - kvm2
    - z890
    - powerfulmoves
    ci_runner: vps
    compose_profiles:
    - agents
    - tier-agent
    agents:
    - fordham_steward
    - fordham_onboarding
    - fordham_transaction
    - fordham_creator
    - fordham_voice
