# Baselined Python test failures - pytest_ratchet.py
#
# Each entry is a test that FAILS, a module that cannot be imported, or a chunk
# for which pytest produced no report at all. They are recorded so the
# `python-tests` merge gate can be enforced today without turning main red in a
# single step. They are NOT approved, and none of them is 'expected'.
#
# Recorded from this PR's CI run (ubuntu-latest, Python 3.12,
# .github/requirements-tests.txt): 264 test files, 27 chunks, 207 findings
# (115 FAIL, 92 ERROR). Recorded in CI rather than on a developer machine so it
# reflects the environment the gate runs in, not one laptop's missing packages.
#
# The list may shrink and must never silently grow. Removing an entry is the
# goal; adding one should require saying why in the PR. A fixed test that is
# still listed here fails the gate as a STALE entry, so the count only goes down.
#
# 2026-08-16 — 182 -> 125. Adding `python-multipart` to
# .github/requirements-tests.txt fixed 57 entries at once. flute-gateway/main.py
# declares a fastapi Form() endpoint, and FastAPI raises at route-definition time
# without that package, so importing the module failed and its entire test suite
# was recorded here as broken. 57 of the 182 entries — nearly a third of this
# whole file — were one missing dependency, not 57 broken tests.
#
# Pruned by hand from the CI log rather than with `--write-baseline`, because
# that flag cannot be used off CI: discovery walks git worktrees under `.claude/`
# and populated submodules, and CI's checkout has neither (a developer machine
# reported 398 groups against CI's 29). The gate's own message recommends the
# command anyway; running it locally would corrupt this file.
#
# Three entries deserve a note:
#
#   ERROR|tests.test_issue_triage|<collection-error>
#     pmoves/tests/test_issue_triage.py:6 reads
#       from pmoves.services.github-issue-triage.labeling_rules import ...
#     A hyphen cannot appear in a Python import path, so this module can never
#     import. Baselined deliberately rather than fixed: repairing it is triage
#     work with its own decisions (rename the directory, or load via importlib),
#     and it does not belong in the PR that makes the gate capable of failing.
#
#   ERROR|... |<pytest-harness>  (3 entries)
#     A chunk that produced no JUnit report: a conftest that cannot be imported
#     (deepresearch, graph-linker) or one that exceeds the per-chunk timeout
#     (pmoves/tests [1]). Recorded so a hang or an unimportable conftest is a
#     visible, ratchetable finding instead of silence.
#
#
# ── The `pmoves/tests [1]` blind spot, and what was behind it ───────────────
# A chunk that exceeds the group timeout is killed before pytest writes its JUnit
# report, so EVERY result in it was lost -- passes and failures alike, not just
# the hang. `pmoves/tests [1]` timed out on every run on record, and the baseline
# recorded the silence without being able to record what the silence contained.
#
# pytest_ratchet now re-runs a timed-out chunk one file at a time, so only the
# file that actually hangs stays unmeasured. In CI that narrowed the unmeasured
# set from 20 files to exactly one:
#
#   ERROR|pmoves/tests/integration/test_voice_relay_e2e.py|<pytest-harness>
#
# and surfaced 127 findings that had never once been reported, taking this file
# from 124 entries to 250. The bulk of them:
#
#     54  tests.hardening.test_docker_hardening.TestResourceLimits
#     10  tests.integration.test_pr483_critical_path
#      7  tests.hardening.test_docker_hardening.TestNonRootUser
#      7  tests.fresh_start.test_env_layout.TestTierFilesExist
#     ~24 tests.integration.test_gateway_agent_integration.*
#
# Every one is a real failing test that was already failing. None is a new break,
# and none is a judgement that the failure is acceptable -- baselined is not
# approved, it means MEASURED. What changed is that these files can now only get
# better, where until now they were unobserved.
#
# One entry that used to live here is gone: `ERROR|pmoves/tests|<pytest-harness>`.
# It keyed on a positional chunk label, which named no file and shifted whenever
# any test was added earlier in the group. Harness findings now key on the file.
#
# Two files hang locally but not in CI (test_a2ui_bridge_integration.py,
# test_tokenism_simulator.py) -- they reach for services that exist on a dev node
# and not on a runner. Only test_voice_relay_e2e.py hangs in both.
#
# Regenerate: make -C pmoves python-tests-baseline
