    # quoting the first two.
    #
    # The 90s allowance buys a per-file budget of 60 + 90 = 150s, which is
    # 2.0x the worst measured file (73.08s) and 2.2x the faster one (68.87s).
    # It lives in the `pmoves` group, whose chunk budget is therefore raised
    # from 120s to 210s.
    #
    # The allowance was 60s when the harness carried the 9-mutation set
    # (M1..M9), which gave 120s -- 1.9x the then-worst 62.44s. Adding M10,
    # M11 and M12 moved the measurement past it, and a budget that no longer
    # covers the file would
    # report a healthy-but-slow file as BROKEN, which is the inversion this
    # whole mechanism exists to prevent.
    #
    # THE MEASUREMENT IS NOT IN THE REPOSITORY
    # ----------------------------------------
    # Every number above was produced by running the harness over the file
    # and timing the call. Those timings are properties of a machine, so
    # they are recorded here as the BASIS for a budget rather than as a
    # test that could fail on a slower runner.
