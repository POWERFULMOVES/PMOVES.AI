# JetStream stream definitions for mesh.gpu.* NATS subjects
# Referenced by: DGX Spark TAC tree (pmoves/configs/tac_trees/dgx-spark.tac.yaml)
# Deploy via: nats stream add --config pmoves/nats/mesh_gpu_streams.yaml

streams:
  - name: mesh_gpu_inference
    subjects: ["mesh.gpu.inference.>"]
    retention: limits
    max_msgs: 10000
    max_age: 24h
    max_bytes: 256MB
    replicas: 1
    consumers:
      - name: gpu-inference-worker
        durable_name: gpu-inference-worker
        ack_policy: explicit
        max_deliver: 3
        filter_subject: "mesh.gpu.inference.request"

  - name: mesh_gpu_health
    subjects: ["mesh.gpu.health.>"]
    retention: interest
    max_msgs: 1000
    max_age: 1h

  - name: mesh_gpu_models
    subjects: ["mesh.gpu.models.>"]
    retention: limits
    max_msgs: 5000
    max_age: 72h

  - name: mesh_gpu_training
    subjects: ["mesh.gpu.training.>"]
    retention: limits
    max_msgs: 5000
    max_age: 48h

  - name: mesh_gpu_metrics
    subjects: ["mesh.gpu.metrics.>"]
    retention: limits
    max_msgs: 50000
    max_age: 6h
