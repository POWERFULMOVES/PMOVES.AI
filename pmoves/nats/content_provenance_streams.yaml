# JetStream stream definitions for provenance-first content shaping on the z890 lane.
# Referenced by: PMOVES_SPARK_PROVENANCE_PARITY.md
#
# NOTE (2026-06-29): This file is now reference-only / superseded.
# The live topology uses a single catch-all stream created by
# `pmoves/scripts/nats/init_streams.sh`:
#   CONTENT_PROVENANCE  -> subjects content.>
# That stream carries content.raw.v1, content.lexicon.shaped.v1,
# content.provenance.attested.v1, content.hirag.accepted.v1, and
# content.hirag.rejected.v1. The consumer layout below documents the
# intended durable-consumer design; services attach to the catch-all
# stream directly. Do not deploy from this file.

streams:
  - name: content_provenance
    subjects:
      [
        "content.raw.v1",
        "content.lexicon.shaped.v1",
        "content.provenance.attested.v1",
        "content.hirag.accepted.v1",
        "content.hirag.rejected.v1"
      ]
    retention: limits
    max_msgs: 50000
    max_age: 168h
    max_bytes: 536870912
    replicas: 1
    consumers:
      - name: content-lexicon-shaper
        durable_name: content-lexicon-shaper
        ack_policy: explicit
        max_deliver: 5
        filter_subject: "content.raw.v1"

      - name: content-provenance-attester
        durable_name: content-provenance-attester
        ack_policy: explicit
        max_deliver: 5
        filter_subject: "content.lexicon.shaped.v1"

      - name: content-hirag-gate
        durable_name: content-hirag-gate
        ack_policy: explicit
        max_deliver: 5
        filter_subject: "content.provenance.attested.v1"
