# Phase 9Q.2: YouTube cookie refresh services overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.yt-cookies.yml --profile yt-cookies up -d
#
# Prerequisites:
#   1. Supabase migration 20260417000000 applied
#   2. Operator ran `make yt-cookies-auth` (stored refresh token)
#
# Services:
#   yt-cookie-refresher — weekly Playwright harvest, encrypts + stores in Supabase
#   yt-cookie-writer    — NATS subscriber, decrypts + writes to shared volume
#
# The shared volume `yt-cookies-vol` is mounted by both the writer (rw) and
# pmoves-yt (ro via override below). pmoves-yt's yt-dlp reads the cookiefile
# per-request — no container restart needed when cookies update.

volumes:
  yt-cookies-vol:

services:
  yt-cookie-refresher:
    build:
      context: ./services/yt-cookie-refresher
    restart: unless-stopped
    environment:
      - PORT=8115
      - NATS_URL=${NATS_URL}
      - SUPABASE_URL=${SUPABASE_URL:-http://supabase-kong:8000}
      - SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - VAULT_ENC_KEY=${VAULT_ENC_KEY:-}
      - CHANNEL_MONITOR_GOOGLE_CLIENT_ID=${CHANNEL_MONITOR_GOOGLE_CLIENT_ID}
      - CHANNEL_MONITOR_GOOGLE_CLIENT_SECRET=${CHANNEL_MONITOR_GOOGLE_CLIENT_SECRET}
      - YT_COOKIE_REFRESH_CRON=${YT_COOKIE_REFRESH_CRON:-0 0 * * 0}
      - LOG_LEVEL=${YT_COOKIE_REFRESHER_LOG_LEVEL:-INFO}
      # Clear Windows SSL env leak (same fix as github-runner-ctl)
      - SSL_CERT_FILE=
      - SSL_CERT_DIR=
      - REQUESTS_CA_BUNDLE=
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "${YT_COOKIE_REFRESHER_BIND:-127.0.0.1}:8115:8115"
    profiles: ["yt-cookies"]
    networks: [pmoves_api, pmoves_bus]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8115/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  yt-cookie-writer:
    build:
      context: ./services/yt-cookie-writer
    # main.py now touches /tmp/healthy after NATS subscription is active,
    # matching the Dockerfile healthcheck. This override keeps it consistent.
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/healthy').exists()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    environment:
      - NATS_URL=${NATS_URL}
      - SUPABASE_URL=${SUPABASE_URL:-http://supabase-kong:8000}
      - SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - VAULT_ENC_KEY=${VAULT_ENC_KEY:-}
      - YT_COOKIE_OUTPUT_PATH=/cookies/yt-cookies.txt
      - YT_PO_TOKEN_OUTPUT_PATH=/cookies/yt-po-token.txt
      - LOG_LEVEL=${YT_COOKIE_WRITER_LOG_LEVEL:-INFO}
      - SSL_CERT_FILE=
      - SSL_CERT_DIR=
      - REQUESTS_CA_BUNDLE=
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - yt-cookies-vol:/cookies
    profiles: ["yt-cookies"]
    networks: [pmoves_bus, pmoves_api]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Override pmoves-yt to mount the shared cookie volume (read-only).
  # Path alignment: yt-cookie-writer outputs /cookies/yt-cookies.txt inside its
  # own container; the same volume mounted here exposes that file at
  # /app/config/cookies/yt-cookies.txt. YT_COOKIES is overridden to point at
  # this location so the base compose default
  # (/app/config/cookies/darkxside.youtube.cookies.txt — placeholder filename)
  # does not silently shadow the writer's output.
  pmoves-yt:
    environment:
      - YT_COOKIES=/app/config/cookies/yt-cookies.txt
      - YT_PO_TOKEN_FILE=/app/config/cookies/yt-po-token.txt
    volumes:
      - yt-cookies-vol:/app/config/cookies:ro
    # Load the harvested PO token from the cookie-writer volume before
    # starting uvicorn. yt.py reads YT_PO_TOKEN_VALUE at module-import
    # time, so it must be in the environment at launch. If the file does
    # not exist yet (no refresh completed), bgutil-pot-provider remains
    # the active PO token backend.
    command: >-
      sh -c '
        if [ -f /app/config/cookies/yt-po-token.txt ] && [ -s /app/config/cookies/yt-po-token.txt ]; then
          export YT_PO_TOKEN_VALUE="$$(cat /app/config/cookies/yt-po-token.txt)";
          echo "Loaded harvested PO token from cookie-writer volume";
        else
          echo "No harvested PO token — bgutil-pot-provider remains active";
        fi;
        exec uvicorn pmoves_yt_service.yt:app --host 0.0.0.0 --port 8077;
      '
