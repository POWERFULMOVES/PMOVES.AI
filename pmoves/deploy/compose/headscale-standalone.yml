# =============================================================================
# Headscale Standalone — Hostinger Docker API Variant
# =============================================================================
# Self-contained compose file for deployment via Hostinger vps-create-new-project-v1.
# Derived from pmoves/docker-compose.remote.yml headscale service.
#
# Hostinger API constraints satisfied:
#   - No external networks (removed pmoves_api, pmoves_monitoring)
#   - No profiles section
#   - No env_file references (all vars via environment: with ${VAR} syntax)
#   - No ${VAR:-default} defaults (Hostinger API may not support them)
#   - Relative volume paths resolve to /docker/{project-name}/ on VPS
#
# Config files (config.yaml, acl.yaml) must be uploaded separately via SSH
# to /docker/headscale/config/ before or after compose deployment.
# =============================================================================

services:
  headscale:
    image: ghcr.io/juanfont/headscale:latest
    container_name: pmoves-headscale
    restart: unless-stopped
    command: serve
    environment:
      - HEADSCALE_SERVER_URL=${HEADSCALE_SERVER_URL}
      - HEADSCALE_LISTEN_ADDR=0.0.0.0:8096
      - HEADSCALE_METRICS_LISTEN_ADDR=0.0.0.0:9090
      - DOCKED_MODE=${DOCKED_MODE}
      - PARENT_SYSTEM=${PARENT_SYSTEM}
      - PARENT_VERSION=${PARENT_VERSION}
    ports:
      - "8096:8096"
      - "9091:9090"
    volumes:
      - ./config:/etc/headscale:ro
      - headscale-data:/var/lib/headscale
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8096/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  headscale-data:
    driver: local
