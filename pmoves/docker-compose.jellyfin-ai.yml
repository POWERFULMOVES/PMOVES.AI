# ── Hardening envelopes ────────────────────────────────────────────────
# Applied per PMOVES container-hardening standard (docs/security/SECURITY_RUNBOOK.md
# §3, and the shape used by docker-compose.hardened.yml). Two variants because the
# image families genuinely differ:
#
#   *-vendor   images whose entrypoint starts as root and drops privileges itself
#              (linuxserver s6, neo4j, redis, ollama). They need the capabilities
#              that permission-fixing and setuid/setgid dropping actually use.
#              `no-new-privileges` is still safe here: it blocks execve GAINING
#              privileges via a setuid binary; DROPPING privileges is unaffected.
#
#   *-built    the three images this repo builds. Since #2695 they ship a non-root
#              USER of their own (65532/65532/101), so no capabilities are needed
#              and `user:` can be pinned without guessing.
#
# read_only is deliberately NOT set on either. It requires enumerating every path
# each service writes and providing a tmpfs or volume for each; guessing produces a
# container that starts and then fails on first write, which is worse than an
# unhardened one that works. That is its own change, per service.
x-jf-hardened-vendor: &jf-hardened-vendor
  cap_drop: ["ALL"]
  cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
  security_opt: ["no-new-privileges:true"]

x-jf-hardened-built: &jf-hardened-built
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]

x-jellyfin-env: &jellyfin-env
  PUID: ${JELLYFIN_PUID:-1000}
  PGID: ${JELLYFIN_PGID:-1000}
  TZ: ${TZ:-UTC}
  JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHED_URL:-http://localhost:8096}
  JELLYFIN_HWACCEL_MODE: ${JELLYFIN_HWACCEL_MODE:-software}
  JELLYFIN_HWACCEL: ${JELLYFIN_HWACCEL_MODE:-software}
  JELLYFIN_ENABLE_HDR: ${JELLYFIN_ENABLE_HDR:-1}
  JELLYFIN_HDR_TONE_MAP: ${JELLYFIN_HDR_TONE_MAP:-auto}
  JELLYFIN_PREFER_AV1: ${JELLYFIN_PREFER_AV1:-1}
  JELLYFIN_DRM_RENDER_NODE: ${JELLYFIN_DRM_RENDER_NODE:-/dev/dri/renderD128}
  NVIDIA_VISIBLE_DEVICES: ${JELLYFIN_NVIDIA_VISIBLE_DEVICES:-}
  NVIDIA_DRIVER_CAPABILITIES: ${JELLYFIN_NVIDIA_DRIVER_CAPABILITIES:-}

x-jellyfin-base: &jellyfin-base
  image: lscr.io/linuxserver/jellyfin:10.11.11
  environment:
    <<: *jellyfin-env
  volumes:
    - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/config:/config
    - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/cache:/cache
    - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/media:/media
    - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/output:/output
    - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/config/www:/config/www:ro
    - ${PMOVES_JELLYFIN_AI_ROOT:-../Pmoves-Jellyfin-AI-Media-Stack/Cataclysm_Provisioning_Bundle/provisioning_bundle/docker-stacks/jellyfin-ai}/install_plugins.sh:/tmp/install_plugins.sh:ro
  ports:
    - "${JELLYFIN_HTTP_PORT:-9096}:8096"
  networks:
    pmoves:
      aliases:
        - jellyfin
  restart: unless-stopped

services:
  jellyfin:
    # Single merge SEQUENCE, not two `<<` keys. Two of them is a duplicate
    # mapping key, which YAML rejects outright -- docker compose refused to parse
    # this whole file ("mapping key \"<<\" already defined"). The anchors share no
    # keys (hardening supplies cap_drop/cap_add/security_opt, base supplies
    # image/environment/volumes/ports/networks/restart), so the order carries no
    # precedence meaning; it reads hardening-first to match the envelope's intent.
    <<: [*jf-hardened-vendor, *jellyfin-base]
    container_name: ${JELLYFIN_CONTAINER_NAME:-pmoves-jellyfin-ai}
    profiles: ["default", "jellyfin-ai"]
    image: lscr.io/linuxserver/jellyfin:10.11.11
    environment:
      - PUID=${JELLYFIN_PUID:-1000}
      - PGID=${JELLYFIN_PGID:-1000}
      - TZ=${TZ:-UTC}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL:-http://localhost:8096}
    volumes:
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/config:/config
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/cache:/cache
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/media:/media
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/output:/output
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/config/www:/config/www:ro
      - ${JUICEFS_HOST_MOUNT:-/home/pmoves-knuckles/pmoves-fs}:/media/pmoves:rshared
      - ${PMOVES_JELLYFIN_AI_ROOT:-../Pmoves-Jellyfin-AI-Media-Stack/Cataclysm_Provisioning_Bundle/provisioning_bundle/docker-stacks/jellyfin-ai}/install_plugins.sh:/tmp/install_plugins.sh:ro
    # Uncomment to auto-install plugins on startup (may slow first boot):
    # entrypoint: >
    #   bash -c "apt-get update && apt-get install -y wget unzip && cp /tmp/install_plugins.sh /usr/local/bin/install_plugins.sh && chmod +x /usr/local/bin/install_plugins.sh && /usr/local/bin/install_plugins.sh && /init"
    ports:
      - "${JELLYFIN_HTTP_PORT:-9096}:8096"
    networks:
      pmoves:
        aliases:
          - jellyfin-ai
      pmoves_app:
        aliases:
          - jellyfin
    restart: unless-stopped

  jellyfin-vaapi:
    # Merge SEQUENCE, not two `<<` keys -- see the note on the `jellyfin` service.
    <<: [*jf-hardened-vendor, *jellyfin-base]
    container_name: ${JELLYFIN_CONTAINER_NAME:-pmoves-jellyfin-ai}
    profiles: ["jellyfin-ai-vaapi"]
    devices:
      # Whole /dev/dri by default, which is what Jellyfin's own hwaccel docs
      # recommend. The previous pair passed renderD128 plus a HARDCODED card0 --
      # wrong on any host whose DRM node is not card0 (SPARK has card1 as well),
      # where the container then sees a render node with no matching card and
      # falls back to software transcoding silently.
      #
      # JELLYFIN_VAAPI_DEVICE is unchanged as a knob -- it is documented in
      # env.jellyfin-ai.example and EXTERNAL_INTEGRATIONS_BRINGUP.md -- only its
      # DEFAULT moved from the single render node to the whole tree. An operator
      # who set it explicitly keeps exactly the narrowing they chose.
      - ${JELLYFIN_VAAPI_DEVICE:-/dev/dri}:${JELLYFIN_VAAPI_DEVICE:-/dev/dri}
    group_add:
      # 44 = video. The render group GID is DISTRO-dependent and must match the
      # host's owner of the render node, because device nodes pass through with
      # host ownership: Debian uses 109, Ubuntu 110. Only 109 was listed, so on an
      # Ubuntu host the container had no access to the render node it was handed.
      # Both are listed because the fleet is mixed; a numeric GID matching no host
      # group is inert, so carrying the spare costs nothing.
      - "44"
      - "109"
      - "110"
    environment:
      <<: *jellyfin-env
      JELLYFIN_HWACCEL_MODE: vaapi
      JELLYFIN_HWACCEL: vaapi

  jellyfin-nvenc:
    # Merge SEQUENCE, not two `<<` keys -- see the note on the `jellyfin` service.
    <<: [*jf-hardened-vendor, *jellyfin-base]
    container_name: ${JELLYFIN_CONTAINER_NAME:-pmoves-jellyfin-ai}
    profiles: ["jellyfin-ai-nvenc"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    environment:
      <<: *jellyfin-env
      JELLYFIN_HWACCEL_MODE: nvenc
      JELLYFIN_HWACCEL: nvenc
      NVIDIA_VISIBLE_DEVICES: ${JELLYFIN_NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${JELLYFIN_NVIDIA_DRIVER_CAPABILITIES:-compute,video,utility}

  jellyfin-neo4j:
    <<: *jf-hardened-vendor
    image: neo4j:5.26.22
    container_name: pmoves-jellyfin-neo4j
    profiles: ["default", "jellyfin-ai"]
    environment:
      - NEO4J_AUTH=neo4j/${JELLYFIN_NEO4J_PASSWORD:-mediapassword123}
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/neo4j/data:/data
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/neo4j/logs:/logs
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/neo4j/import:/var/lib/neo4j/import
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/neo4j/plugins:/plugins
    networks:
      pmoves_data:
        aliases:
          - jellyfin-neo4j
    restart: unless-stopped

  jellyfin-qwen-audio:
    <<: *jf-hardened-vendor
    # OPT-IN fallback for nodes WITHOUT a native Ollama. The default path is
    # the MODEL SEAT on jellyfin-audio-processor (AUDIO_MODEL_URL/_ID below):
    # media-analysis models are a swappable seat served by native Ollama or
    # HF-pulled GGUFs (ollama pull hf.co/...), curated by the HF agent — not
    # a dedicated per-model container. Enable with profile jellyfin-audio-local.
    image: ${PMOVES_OLLAMA_IMAGE:-ollama/ollama:0.31.2@sha256:509fdf54e23bd50d87af646cb51c0a7a203d6a83cc4d6695b3b08c5be1c62c0a}
    container_name: ${JELLYFIN_QWEN_CONTAINER_NAME:-pmoves-jellyfin-qwen}
    profiles: ["jellyfin-audio-local"]
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/root/.ollama/models
    volumes:
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/qwen/models:/root/.ollama/models
    ports:
      # 11435 host-side: never collide with native Ollama on 11434.
      - "${JELLYFIN_QWEN_PORT:-11435}:11434"
    networks:
      pmoves:
        aliases:
          - jellyfin-qwen-audio
      pmoves_app:
        aliases:
          - jellyfin-qwen-audio
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  jellyfin-audio-processor:
    <<: *jf-hardened-built
    user: "65532:65532"
    build:
      context: ${PMOVES_JELLYFIN_AI_ROOT:-../Pmoves-Jellyfin-AI-Media-Stack/Cataclysm_Provisioning_Bundle/provisioning_bundle/docker-stacks/jellyfin-ai}/audio-processor
      dockerfile: Dockerfile
    container_name: ${JELLYFIN_AUDIO_PROCESSOR_CONTAINER_NAME:-pmoves-jellyfin-audio-processor}
    profiles: ["default", "jellyfin-ai"]
    env_file:
      - ./env.jellyfin-ai
    environment:
      - JELLYFIN_URL=${JELLYFIN_URL:-http://${JELLYFIN_SERVICE_HOST:-jellyfin}:8096}
      # MODEL SEAT: swappable multi-modal media-analysis model. Defaults to
      # native host Ollama; point AUDIO_MODEL_URL at any OpenAI/Ollama-style
      # endpoint (jellyfin-qwen-audio:11434 with the jellyfin-audio-local
      # profile, an HF TGI endpoint, ...). AUDIO_MODEL_ID names the occupant;
      # the HF agent keeps the seat current. Legacy var name feeds the
      # audio-processor code unchanged.
      - QWEN_AUDIO_URL=${AUDIO_MODEL_URL:-${QWEN_AUDIO_URL:-http://host.docker.internal:11434}}
      - AUDIO_MODEL_ID=${AUDIO_MODEL_ID:-qwen3-vl:8b}
      - NEO4J_URI=${JELLYFIN_NEO4J_URI:-bolt://jellyfin-neo4j:7687}
      - NEO4J_USER=${JELLYFIN_NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${JELLYFIN_NEO4J_PASSWORD:-mediapassword123}
      - JELLYFIN_HWACCEL_MODE=${JELLYFIN_HWACCEL_MODE:-software}
      - JELLYFIN_ENABLE_HDR=${JELLYFIN_ENABLE_HDR:-1}
      - JELLYFIN_PREFER_AV1=${JELLYFIN_PREFER_AV1:-1}
    volumes:
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/media:/app/media
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/output:/app/output
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/logs:/app/logs
    networks:
      pmoves_app:
        aliases:
          - jellyfin-audio-processor
      pmoves_data:
        aliases:
          - jellyfin-audio-processor
    extra_hosts:
      # host-gateway keeps the native-Ollama default working on Linux nodes
      # (Docker Desktop resolves host.docker.internal natively).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      # NOTE: no depends_on for the model seat — the occupant may live on the
      # host (native Ollama) or a profile-gated container; the processor
      # retries its endpoint instead of pinning a container dependency.
      - ${JELLYFIN_STACK_SERVICE:-jellyfin}
      - jellyfin-neo4j

  jellyfin-redis:
    <<: *jf-hardened-vendor
    image: redis:7-alpine
    container_name: ${JELLYFIN_REDIS_CONTAINER_NAME:-pmoves-jellyfin-redis}
    profiles: ["default", "jellyfin-ai"]
    command: redis-server --appendonly yes
    volumes:
      - ./${JELLYFIN_AI_BASE:-jellyfin-ai}/redis:/data
    networks:
      pmoves_app:
        aliases:
          - jellyfin-redis
    restart: unless-stopped

  jellyfin-api-gateway:
    <<: *jf-hardened-built
    user: "65532:65532"
    build:
      context: ${PMOVES_JELLYFIN_AI_ROOT:-../Pmoves-Jellyfin-AI-Media-Stack/Cataclysm_Provisioning_Bundle/provisioning_bundle/docker-stacks/jellyfin-ai}/api-gateway
      dockerfile: Dockerfile
    container_name: ${JELLYFIN_API_CONTAINER_NAME:-pmoves-jellyfin-api}
    profiles: ["default", "jellyfin-ai"]
    env_file:
      - ./env.jellyfin-ai
    environment:
      - PORT=3000
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - JELLYFIN_URL=${JELLYFIN_URL:-http://${JELLYFIN_SERVICE_HOST:-jellyfin}:8096}
      - NEO4J_URI=${JELLYFIN_NEO4J_URI:-bolt://jellyfin-neo4j:7687}
      - NEO4J_USER=${JELLYFIN_NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${JELLYFIN_NEO4J_PASSWORD:-mediapassword123}
      - REDIS_URL=${JELLYFIN_REDIS_URL:-redis://jellyfin-redis:6379}
      - JELLYFIN_HWACCEL_MODE=${JELLYFIN_HWACCEL_MODE:-software}
      - JELLYFIN_ENABLE_HDR=${JELLYFIN_ENABLE_HDR:-1}
      - JELLYFIN_PREFER_AV1=${JELLYFIN_PREFER_AV1:-1}
    ports:
      - "${JELLYFIN_API_PORT:-8300}:3000"
    networks:
      pmoves:
        aliases:
          - jellyfin-api
      pmoves_api:
        aliases:
          - jellyfin-api
      pmoves_app:
        aliases:
          - jellyfin-api
      pmoves_data:
        aliases:
          - jellyfin-api
    restart: unless-stopped
    depends_on:
      - ${JELLYFIN_STACK_SERVICE:-jellyfin}
      - jellyfin-neo4j
      - jellyfin-redis

  jellyfin-dashboard:
    <<: *jf-hardened-built
    user: "101:101"
    build:
      context: ${PMOVES_JELLYFIN_AI_ROOT:-../Pmoves-Jellyfin-AI-Media-Stack/Cataclysm_Provisioning_Bundle/provisioning_bundle/docker-stacks/jellyfin-ai}/dashboard
      dockerfile: Dockerfile
    container_name: ${JELLYFIN_DASHBOARD_CONTAINER_NAME:-pmoves-jellyfin-dashboard}
    profiles: ["default", "jellyfin-ai"]
    environment:
      - REACT_APP_API_URL=${JELLYFIN_DASHBOARD_API_URL:-http://localhost:${JELLYFIN_API_PORT:-8300}}
      - REACT_APP_JELLYFIN_URL=${JELLYFIN_PUBLIC_BASE_URL:-http://localhost:8096}
      - REACT_APP_ENABLE_HDR=${JELLYFIN_ENABLE_HDR:-1}
      - REACT_APP_PREFER_AV1=${JELLYFIN_PREFER_AV1:-1}
    ports:
      - "${JELLYFIN_DASHBOARD_PORT:-8400}:8080"   # nginx-unprivileged listens on 8080, not 80
    networks:
      pmoves:
        aliases:
          - jellyfin-dashboard
      pmoves_app:
        aliases:
          - jellyfin-dashboard
    restart: unless-stopped
    depends_on:
      - jellyfin-api-gateway

networks:
  pmoves:
    external: true
    name: pmoves-net
  pmoves_api:
    external: true
    name: pmoves_api
  pmoves_app:
    external: true
    name: pmoves_app
  pmoves_data:
    external: true
    name: pmoves_data
