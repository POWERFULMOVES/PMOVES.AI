<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PMOVES.AI Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="../icons/icon48.png" alt="PMOVES.AI" width="32" height="32">
      <div>
        <h1>PMOVES.AI Settings</h1>
        <p class="subtitle">Chrome Extension Configuration</p>
      </div>
    </header>

    <!-- Service Endpoints -->
    <section>
      <h2>Service Endpoints</h2>
      <p class="section-desc">Configure URLs for each PMOVES.AI service.</p>
      <div class="field-grid" id="endpoints-grid">
        <div class="field" data-service="tensorzero">
          <label>TensorZero (LLM Gateway)</label>
          <div class="input-row">
            <input type="url" id="url-tensorzero" placeholder="http://localhost:3030">
            <button class="test-btn" data-service="tensorzero">Test</button>
          </div>
        </div>
        <div class="field" data-service="gpuOrchestrator">
          <label>GPU Orchestrator</label>
          <div class="input-row">
            <input type="url" id="url-gpuOrchestrator" placeholder="http://localhost:8200">
            <button class="test-btn" data-service="gpuOrchestrator">Test</button>
          </div>
        </div>
        <div class="field" data-service="hirag">
          <label>Hi-RAG v2 (Knowledge Search)</label>
          <div class="input-row">
            <input type="url" id="url-hirag" placeholder="http://localhost:8086">
            <button class="test-btn" data-service="hirag">Test</button>
          </div>
        </div>
        <div class="field" data-service="pmovesYt">
          <label>PMOVES.YT (Video Ingestion)</label>
          <div class="input-row">
            <input type="url" id="url-pmovesYt" placeholder="http://localhost:8077">
            <button class="test-btn" data-service="pmovesYt">Test</button>
          </div>
        </div>
        <div class="field" data-service="agentZero">
          <label>Agent Zero (MCP Orchestrator)</label>
          <div class="input-row">
            <input type="url" id="url-agentZero" placeholder="http://localhost:8080">
            <button class="test-btn" data-service="agentZero">Test</button>
          </div>
        </div>
        <div class="field" data-service="fluteGateway">
          <label>Flute Gateway (Voice/TTS)</label>
          <div class="input-row">
            <input type="url" id="url-fluteGateway" placeholder="http://localhost:8055">
            <button class="test-btn" data-service="fluteGateway">Test</button>
          </div>
        </div>
        <div class="field" data-service="prometheus">
          <label>Prometheus (Metrics/Mesh)</label>
          <div class="input-row">
            <input type="url" id="url-prometheus" placeholder="http://localhost:9090">
            <button class="test-btn" data-service="prometheus">Test</button>
          </div>
        </div>
        <div class="field" data-service="gateway">
          <label>Gateway (CHIT / Geometry Bus)</label>
          <div class="input-row">
            <input type="url" id="url-gateway" placeholder="http://localhost:8085">
            <button class="test-btn" data-service="gateway">Test</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Authentication -->
    <section>
      <h2>Authentication</h2>
      <p class="section-desc">Tokens for services that require authentication.</p>
      <div class="field">
        <label>Agent Zero Bearer Token</label>
        <input type="password" id="auth-agentZeroToken" placeholder="MCP_CLIENT_SECRET">
      </div>
      <div class="field">
        <label>Flute Gateway API Key</label>
        <input type="password" id="auth-fluteApiKey" placeholder="FLUTE_API_KEY (leave blank if not required)">
      </div>
    </section>

    <!-- Feature Toggles -->
    <section>
      <h2>Features</h2>
      <div class="toggle-grid">
        <label class="toggle-item">
          <input type="checkbox" id="feat-autoProcess">
          <span>Auto-process videos on page load</span>
        </label>
        <label class="toggle-item">
          <input type="checkbox" id="feat-showFloatingButton" checked>
          <span>Show floating action button on YouTube</span>
        </label>
        <label class="toggle-item">
          <input type="checkbox" id="feat-showThumbnailButtons" checked>
          <span>Show process buttons on video thumbnails</span>
        </label>
        <label class="toggle-item">
          <input type="checkbox" id="feat-showNotifications" checked>
          <span>Show desktop notifications</span>
        </label>
      </div>
      <div class="field" style="margin-top:12px;">
        <label>Health poll interval (seconds)</label>
        <input type="number" id="feat-healthPollInterval" min="10" max="300" value="30" style="width:80px;">
      </div>
    </section>

    <!-- Diagnostics -->
    <section>
      <h2>Diagnostics</h2>
      <button id="test-all-btn" class="primary-btn">Test All Services</button>
      <table id="diagnostics-table" class="diagnostics-table" style="display:none;">
        <thead><tr><th>Service</th><th>Status</th><th>Latency</th><th>Details</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Agent Zero Details -->
    <section>
      <h2>Agent Zero Details</h2>
      <div class="diag-buttons">
        <button id="diag-agent-health" class="secondary-btn">Agent Zero Health</button>
        <button id="diag-mcp-commands" class="secondary-btn">MCP Commands</button>
      </div>
      <pre id="diag-agent-result" class="diag-result" style="display:none;"></pre>
    </section>

    <!-- CHIT Geometry -->
    <section>
      <h2>CHIT Geometry</h2>
      <div class="diag-buttons">
        <button id="diag-recent-shapes" class="secondary-btn">Recent Shapes</button>
        <button id="diag-recent-events" class="secondary-btn">Recent Events</button>
      </div>
      <div id="diag-chit-shapes" style="display:none;"></div>
      <pre id="diag-chit-result" class="diag-result" style="display:none;"></pre>
    </section>

    <!-- Actions -->
    <div class="actions">
      <button id="save-btn" class="primary-btn">Save Settings</button>
      <button id="reset-btn" class="secondary-btn">Reset to Defaults</button>
      <span id="save-status" class="save-status"></span>
    </div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>
