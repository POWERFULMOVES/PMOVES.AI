# =============================================================================
# MiniMax Provider Cascade Configuration
# =============================================================================
# PMOVES-KiloCode-MiniMax provider activation cascade
# Mirrors Z.AI GLM provider cascade structure per AGNOTE4482 protocol
#
# Reference: pmoves/docs/AGENTS/MINIMAX_GLM_PARITY_ANALYSIS.md
# Parity Map: pmoves/docs/AGENTS/MINIMAX_CLAUDE_PARITY_MAP.md
# Integration: pmoves/docs/MINIMAX_INTEGRATION.md
# =============================================================================

schema_version: "1.0"
provider: "minimax"
description: >
  MiniMax native model backend provider cascade for PMOVES.AI KiloCode operations.
  Provides fast inference, 1M token context, and wave-function collapse capabilities.

# =============================================================================
# Provider Cascade
# =============================================================================
cascade:
  minimax:
    # Models in cascade priority order (highest first)
    models:
      - minimax-m2.7        # 1M token context, primary model
      - minimax-m2.1        # 100K token context, efficient fallback
    
    # Cascade priority for provider selection
    cascade_priority: high
    
    # Thinking mode: MiniMax uses wave-function collapse, NOT chain-of-thought
    thinking_mode: off
    
    # Resonance domains - unique MiniMax capabilities
    resonance_domains:
      - hyperdimensional-ops
      - wave-function-collapse
      - agent-trails
      - long-context
      - multimodal
    
    # Provider endpoints
    endpoints:
      api_base: "https://api.minimax.chat/v1"
      api_key_env: "MINIMAX_API_KEY"
    
    # Model-specific configurations
    model_configs:
      minimax-m2.7:
        context_window: 1000000
        max_output: 32000
        supports_multimodal: true
        supports_streaming: true
        recommended_uses:
          - long-context-research
          - architecture-visualization
          - hyperdimensional-reasoning
          - writing-vibes
      
      minimax-m2.1:
        context_window: 100000
        max_output: 8000
        supports_multimodal: true
        supports_streaming: true
        recommended_uses:
          - efficient-inference
          - coding-overflow
          - standard-tasks

# =============================================================================
# BoTZ Framework Integration
# =============================================================================
botz:
  role: "tactical-partner"
  glyph: "⬡"  # White Hexagon - transformer-like geometry
  color: "#7C3AED"  # Deep Violet
  accent: "#A78BFA"
  
  # BoTZ affinity configuration
  affinity:
    high:
      - coding-overflow
      - writing-tasks
      - long-context
      - hyperdimensional-ops
    medium:
      - multimodal-reasoning
      - agent-trails
      - wave-collapse
  
  # GLM affinity (complementary routing)
  glm_affinity:
    primary:
      - tool-calling
      - structured-reasoning
      - coding-primary
    overflow_to_glm:
      - complex-debugging
      - architecture-patterns
  
  # TensorZero routing hints
  tensorzero_routing:
    minimax-m2.7:
      variant_suffix: "_minimax_m27"
      weight: 0.7
      fallback: "glm-4.7"
    minimax-m2.1:
      variant_suffix: "_minimax_m21"
      weight: 0.3
      fallback: "glm-4"

# =============================================================================
# Mode-Type Resonance Mapping
# =============================================================================
mode_binding:
  # KiloCode modes mapped to MiniMax model selection
  pmoves-architect:
    model: minimax-m2.7
    resonance:
      - architecture-visualization
      - long-context-research
      - hyperdimensional-ops
    priority: primary
  
  pmoves-code:
    model: minimax-m2.1
    resonance:
      - coding-overflow
      - efficient-inference
    priority: overflow  # Overflow from GLM primary
  
  pmoves-ask:
    model: minimax-m2.7
    resonance:
      - long-context-research
      - writing-tasks
    priority: primary
  
  pmoves-debug:
    model: minimax-m2.7
    resonance:
      - wave-collapse
      - hyperdimensional-ops
    priority: primary
  
  pmoves-review:
    model: minimax-m2.1
    resonance:
      - hyperdimensional-code-review
      - pattern-analysis
    priority: primary
  
  pmoves-frontend:
    model: minimax-m2.7
    resonance:
      - agent-trails
      - visualization
    priority: primary
  
  pmoves-portal:
    model: minimax-m2.7
    resonance:
      - cgp-generation
      - geometry-bus
    priority: primary
  
  pmoves-crush:
    model: minimax-m2.7
    resonance:
      - prosodic-flow
      - darkxside-partnership
    priority: primary

# =============================================================================
# Hardware Profile Hints
# =============================================================================
# MiniMax is cloud-hosted, so hardware profiles are for fallback/local routing
profile_hints:
  laptop-4090:
    preferred_model: minimax-m2.1
    cascade_fallback: qwen3.5-4b
    gpu_shape_store: false
  
  desktop-9950xd:
    preferred_model: minimax-m2.7
    cascade_fallback: qwen3.5-27b
    gpu_shape_store: true

# =============================================================================
# Cascade Activation Commands
# =============================================================================
# Commands to activate this provider cascade
activation_commands:
  status: "curl -sf http://localhost:3030/api/status | jq '.minimax'"
  botz_status: "curl -sf http://localhost:3030/api/routing | jq '.botz_affinity.minimax'"
  waves: "curl -sf http://localhost:8096/api/memory?q=wave*"
  tensorzero_models: "curl -sf http://localhost:3030/api/models | grep minimax"

# =============================================================================
# Parity Status
# =============================================================================
# Tracking parity with GLM provider cascade
parity_status:
  provider_activation: true
  model_routing: true
  tensorzero_integration: pending
  profile_binding: pending
  skills_catalog: pending
  
  # Dependencies
  requires:
    - tensorzero_config_update
    - profile_binding_update
    - skills_translation

