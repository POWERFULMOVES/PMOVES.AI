# =============================================================================
# KiloCode Provider Cascade Configuration
# =============================================================================
# KiloCode GLM provider activation cascade for PMOVES.AI
# Primary model: GLM-5.2 via Z.AI coding plan
# KiloCode plan-routed: kilo-auto/balanced via api.kilocode.ai
#
# Reference: pmoves/docs/AGENTS/AGNOTE4482.md (KiloCode claw config PR #1151)
# Parity Model: pmoves/docs/AGENTS/KRISS_KROSS_ACK.md
# Agent Profile: pmoves/configs/agent-profiles/kilocode_glm.yaml
# =============================================================================

schema_version: "1.1"
provider: "kilocode"
description: >
  KiloCode GLM provider cascade for PMOVES.AI operations on the 5090 GPU node.
  Uses GLM-5.2 via Z.AI coding plan as primary model with GLM-5-Turbo fallback for
  agentic workflows. KiloCode plan-routed lane (kilo-auto/balanced) available as
  secondary via api.kilocode.ai. Falls back to local Ollama models when cloud
  is unavailable.

# =============================================================================
# Z.AI Coding Plan Integration
# =============================================================================
coding_plan:
  enabled: true
  api_key_env: Z_AI_API_KEY
  api_base: https://api.z.ai/api/coding/paas/v4
  documentation: https://docs.z.ai/devpack/using5.1

  # KiloCode plan (separate subscription)
  kilocode_plan:
    enabled: true
    api_key_env: KILOCODE_API_KEY
    api_base: https://api.kilocode.ai/api/openrouter
    model: kilo-auto/balanced

  # Fallback strategy
  fallback:
    on_quota_exhausted: switch_to_glm_turbo
    on_key_missing: use_local_ollama
    fallback_provider: glm
    fallback_model: glm-5-turbo
  nats_subjects:
    status: kilocode.agent.status.v1

# =============================================================================
# Provider Cascade
# =============================================================================
cascade:
  zai_glm:
    # Models in cascade priority order (highest first)
    models:
      - glm-5.2          # Latest GLM, primary coding model
      - glm-5-turbo      # Agentic workflows, tool calling
      - glm-5.1          # Deep reasoning, large context
      - glm-4-air        # Fast inference, lightweight tasks

    # Cascade priority for provider selection
    cascade_priority: high

    # Thinking mode: GLM supports both thinking and non-thinking
    thinking_mode: adaptive

    # Resonance domains - KiloCode capabilities
    resonance_domains:
      - feature-impl
      - mcp-integration
      - vs-code
      - agent-framework
      - blueprint-first

    # Provider endpoints
    endpoints:
      coding_plan: https://api.z.ai/api/coding/paas/v4
      ollama_cloud: https://ollama.com/v1

    # Vision support
    vision:
      enabled: true
      model: glm-5v-turbo
      mcp_server: zai-vision

  kilocode_plan:
    # KiloCode's own plan-routed lane
    models:
      - kilo-auto/balanced   # Provider picks model

    cascade_priority: medium
    thinking_mode: adaptive

    endpoints:
      kilocode: https://api.kilocode.ai/api/openrouter

# =============================================================================
# BoTZ Framework Integration (legacy/archived — ClaWZ is active)
# =============================================================================
botz:
  role: "VS Code-native agent — blueprint-first implementation"
  glyph: "\u25B2"  # ▲ Triangle
  color: "#059669"
  accent: "#34D399"

  # Affinity matrix — complementary routing
  affinity:
    glm:
      weight: 1.0
      description: "Primary model backend — GLM-5.2 via coding plan"
    minimax:
      weight: 0.7
      description: "Long-context overflow, character persona synthesis"
    ollama:
      weight: 0.5
      description: "Local models for offline/island operation"

  # TensorZero routing hints
  tensorzero:
    primary_function: coding_glm
    orchestrator_function: pmoves_orchestrator_coding
    coding_function: coding_kilocode

# =============================================================================
# Mode Binding — maps KiloCode modes to models
# =============================================================================
mode_binding:
  pmoves-glm:
    primary: glm-5.2
    fallback: glm-5-turbo
    small: glm-4-air
    resonance:
      - blueprint-first
      - vs-code-native
    priority: high

  pmoves-code:
    primary: glm-5.2
    fallback: glm-5-turbo
    resonance:
      - feature-impl
      - service-development
    priority: high

  pmoves-architect:
    primary: glm-5.2
    fallback: glm-5.1
    resonance:
      - architecture
      - multi-agent-orchestration
    priority: high

  pmoves-cocreate:
    primary: glm-5.2
    fallback: minimax-m2.7
    resonance:
      - cocreation
      - creative-direction
    priority: medium

# =============================================================================
# Profile Hints — hardware to model preferences
# =============================================================================
profile_hints:
  desktop-9950xd:  # 5090 node
    preferred: glm-5.2
    fallback: glm-5-turbo
    gpu_accelerated: true

  laptop-4090:
    preferred: glm-5.2
    fallback: glm-5-turbo
    gpu_accelerated: true

  z890:
    preferred: glm-5.2
    fallback: glm-5-turbo
    gpu_accelerated: false

# =============================================================================
# Activation Commands
# =============================================================================
activation_commands:
  check_coding_plan: |
    curl -s https://api.z.ai/api/coding/paas/v4/models \
      -H "Authorization: Bearer $Z_AI_API_KEY" | head -20
  check_kilocode_plan: |
    curl -s https://api.kilocode.ai/api/openrouter/models \
      -H "Authorization: Bearer $KILOCODE_API_KEY" | head -20
  check_tensorzero: |
    curl -s http://localhost:3030/health

# =============================================================================
# Parity Status
# =============================================================================
parity_status:
  agent_signature: complete
  tensorzero_model: complete  # chat_kilocode registered
  provider_catalog: complete  # kilocode provider defined
  model_suit: complete  # glm-5.2.yaml + glm-5-turbo.yaml
  agent_profile: complete  # kilocode_glm.yaml
  provider_cascade: complete  # this file
  mcp_servers: complete  # cipher, tailscale, huggingface, docker + zai suite
  kilo_json: complete  # models, permissions, mcp all configured
  kilocode_modes: complete  # 11 modes in .kilocodemodes
  operator_home: pending  # KILOCODE_OPERATOR_HOME.md TODO
  kriss_kross_signature: pending  # ACK TODO

# =============================================================================
# Model Suits Referenced
# =============================================================================
model_suits:
  - pmoves/configs/model-suits/glm-5.2.yaml
  - pmoves/configs/model-suits/glm-5-turbo.yaml
  - pmoves/configs/model-suits/glm-5.1.yaml

# =============================================================================
# Agent Profile Referenced
# =============================================================================
agent_profile: pmoves/configs/agent-profiles/kilocode_glm.yaml
