    - SUPASERCH_PORT=${SUPASERCH_PORT:-8099}
    - HIRAG_URL=${HIRAG_URL:-http://hi-rag-gateway-v2:8086}
    - SUPA_REST_URL=${SUPA_REST_URL:-http://supabase-kong:8000/rest/v1}
