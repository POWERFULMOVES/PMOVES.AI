# PMOVES.AI production compose project
name: pmoves

services:
  # =============================================================================
  # SUPABASE SELF-HOSTED STACK (currency reviewed 2026-06-21)
  # =============================================================================
  # Unified 13-service self-hosted stack (profile: supabase-local)
  # Standard naming: JWT_SECRET, ANON_KEY, SERVICE_ROLE_KEY (SUPABASE_* aliases for compat)
  # JWT: HS256 symmetric
  #
  # Currency notes (verified against supabase.com/changelog.md, 2026-06-21):
  # - On Postgres 17 (supabase/postgres:17.6.1.108) — the 2026-05-18 self-hosted
  #   PG15->17 migration is already done.
  # - CONFIG ALIGNMENT (Supabase discussion #47093, 2026-06-18): the self-hosted
  #   reference compose now defaults API_EXTERNAL_URL to INCLUDE /auth/v1
  #   (e.g. https://host -> https://host/auth/v1), WITH matching Kong OAuth
  #   callback (${API_EXTERNAL_URL}/callback) and SAML (/auth/v1/sso/saml/*)
  #   routes + GOTRUE_JWT_ISSUER. This is a compose/route alignment applied as a
  #   SET, not a gotrue-image-version gate. This stack still uses the older
  #   consistent scheme (API_EXTERNAL_URL = base + Kong routes that add /auth/v1),
  #   so it is internally consistent and needs no change in isolation. BUT when
  #   adopting Supabase's updated self-hosted compose defaults OR enabling custom
  #   OAuth/SAML, move the WHOLE set together (API_EXTERNAL_URL + Kong routes +
  #   issuer) and re-test auth — applying any one piece alone breaks auth.
  # - OPTIONAL hardening: asymmetric JWT signing keys (ES256/RS256) over the
  #   current HS256 symmetric secret — larger migration (touches every
  #   JWT-validating service); tracked separately.
  # =============================================================================

  supabase-db:
    <<: *tier-supabase-hardened
    image: supabase/postgres:17.6.1.108
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - POSTGRES_USER=${SUPABASE_DB_USER:?Set SUPABASE_DB_USER in env.tier-supabase}
    - POSTGRES_PASSWORD=${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in env.tier-supabase}
    - POSTGRES_DB=${SUPABASE_DB_NAME:-postgres}
    - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    # PMOVES extensions
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_data,pmoves_api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
    - ${SUPABASE_DB_BIND:-127.0.0.1}:${SUPABASE_DB_PORT:-54322}:5432
    volumes:
    - supabase-db-data:/var/lib/postgresql/data
    - ./supabase/initdb:/docker-entrypoint-initdb.d/pmoves-init:ro
    networks:
    - pmoves_data
    - pmoves_api  # Services on pmoves_api need DB access

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
  supabase-gotrue:
    <<: *tier-supabase-hardened
    image: supabase/gotrue:v2.191.0
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - GOTRUE_SITE_URL=${SUPABASE_SITE_URL}
    # Older consistent scheme: base URL here + Kong routes that add /auth/v1.
    # The 2026-06-18 self-hosted alignment (API_EXTERNAL_URL incl. /auth/v1 +
    # matching Kong OAuth/SAML routes + issuer) is applied as a SET, not piecemeal
    # and not gated on the gotrue tag — see the stack header note before changing.
    - API_EXTERNAL_URL=${SUPABASE_PUBLIC_URL}
    - GOTRUE_API_HOST=0.0.0.0
    - GOTRUE_API_PORT=9999
    # Database connection
    - GOTRUE_DB_DRIVER=postgres
    - GOTRUE_DB_DATABASE_URL=postgres://${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}}@supabase-db:5432/${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}?sslmode=disable
    # JWT configuration — standard names with legacy fallbacks
    - GOTRUE_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET}}
    - GOTRUE_JWT_ALGORITHM=${SUPABASE_JWT_ALGORITHM:-HS256}
    - GOTRUE_JWT_EXP=${JWT_EXPIRY:-${SUPABASE_JWT_EXP:-3600} }
    # 2025 key naming (service_role_key from PMOVES-supabase standard)
    - GOTRUE_JWT_ADMIN_SECRET=${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY or SUPABASE_SERVICE_ROLE_KEY}}
    - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
    # Logging
    - GOTRUE_LOG_LEVEL=info
    - GOTRUE_LOG_LEVEL_STACK=info
    # URI Allow list (for VPS deployment)
    - GOTRUE_URI_ALLOW_LIST=${SUPABASE_URI_ALLOW_LIST}
    # Optional Google OAuth (self-hosted Supabase auth)
    - GOTRUE_EXTERNAL_GOOGLE_ENABLED=${SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED:-false}
    - GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID=${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID:-}
    - GOTRUE_EXTERNAL_GOOGLE_SECRET=${SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET:-}
    - GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI=${SUPABASE_AUTH_EXTERNAL_GOOGLE_REDIRECT_URI:-}
    - GOTRUE_EXTERNAL_GOOGLE_SKIP_NONCE_CHECK=${SUPABASE_AUTH_EXTERNAL_GOOGLE_SKIP_NONCE_CHECK:-false}
    # PMOVES context
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # DNS configuration - Docker embedded DNS (default)
    - PMOVES_NETWORKS=pmoves_api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 120s
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
    - ${SUPABASE_AUTH_BIND:-127.0.0.1}:${SUPABASE_GOTRUE_PORT:-9999}:9999
    networks:
    - pmoves_api

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  supabase-postgrest:
    <<: *tier-supabase-hardened-ro
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    # Database connection (from env.tier-supabase)
    - PGRST_DB_URI=postgres://${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}}@supabase-db:5432/${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    # JWT secret (must match gotrue) - standard variable name
    - PGRST_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}
    - PGRST_JWT_ALGORITHM=${SUPABASE_JWT_ALGORITHM:-HS256}
    - PGRST_JWT_SECRET_IS_BASE64=false
    # PostgREST v14+ settings
    - PGRST_DB_USE_LEGACY_GUCS=false
    - PGRST_APP_SETTINGS_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}
    - PGRST_APP_SETTINGS_JWT_EXP=${JWT_EXPIRY:-${SUPABASE_JWT_EXP:-3600}}
    # Extra search_path so pmoves_core and pmoves_kb objects are addressable
    # without fully-qualified names. Must match env.tier-supabase.example.
    - PGRST_DB_EXTRA_SEARCH_PATH=${PGRST_DB_EXTRA_SEARCH_PATH:-pmoves_core,pmoves_kb,public}
    # API configuration
    - PGRST_DB_SCHEMAS=${SUPABASE_SCHEMA:-public,pmoves_core}
    - PGRST_ANON_ROLE=${SUPABASE_ANON_ROLE:-anon}
    - PGRST_DB_MAX_ROWS=${SUPABASE_MAX_ROWS:-1000}
    - PGRST_DB_POOL=${SUPABASE_DB_POOL:-15}
    - PGRST_DB_POOL_TIMEOUT=${SUPABASE_POOL_TIMEOUT:-5}
    # PMOVES context
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # Note: No healthcheck - postgrest/postgrest image is distroless without shell tools
    - PMOVES_NETWORKS=pmoves_api,pmoves_public
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
    - ${SUPABASE_REST_BIND:-127.0.0.1}:${SUPABASE_POSTGREST_PORT:-3000}:3000
    networks:
    - pmoves_api
    - pmoves_public

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  supabase-kong:
    <<: *tier-supabase-hardened
    image: kong/kong:3.9.1
    profiles:
    - supabase-local
    environment:
    # Database configuration (Kong uses Postgres for config storage)
    - KONG_DATABASE=postgres
    - KONG_PG_HOST=supabase-db
    - KONG_PG_DATABASE=${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    - KONG_PG_USER=${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}
    - KONG_PG_PASSWORD=${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}
    # Kong configuration
    - KONG_PROXY_ACCESS_LOG=/dev/stdout
    - KONG_ADMIN_ACCESS_LOG=/dev/stdout
    - KONG_PROXY_ERROR_LOG=/dev/stderr
    - KONG_ADMIN_ERROR_LOG=/dev/stderr
    - KONG_PROXY_LISTEN=0.0.0.0:8000
    - KONG_ADMIN_LISTEN=0.0.0.0:8001  # container-internal; host restriction via Docker port mapping line below
    # JWT plugin (already in bundled — no need to list separately)
    - KONG_PLUGINS=bundled
    - KONG_NGINX_PROXY_PROXY_BUFFERS=8 16k
    # Pin to single worker. Kong reads host /proc/cpuinfo for worker count,
    # not the cpus cgroup limit, so on a 24-core host it would spawn 24
    # workers × ~80MB each (full plugin load) = ~2GB before accepting any
    # traffic. `1` matches the 0.5 CPU budget + keeps memory bounded.
    - KONG_NGINX_WORKER_PROCESSES=1
    # PMOVES context
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # Wait for Postgres using a pure shell redirect (kong:3.7.1 does not ship `nc`).
    - PMOVES_NETWORKS=pmoves_api,pmoves_public
    entrypoint: ["/bin/bash", "-c", "for i in $$(seq 1 30); do if >/dev/tcp/supabase-db/5432 2>/dev/null; then echo 'Database reachable'; break; fi; echo \"DB not ready ($$i/30)...\"; sleep 2; done; kong migrations bootstrap --yes 2>/dev/null || kong migrations up --yes 2>/dev/null || true; exec /entrypoint.sh kong docker-start"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
    # Default host bind tightened to 127.0.0.1 for safer standalone/sidecar
    # operation. Override with KONG_PROXY_BIND / KONG_ADMIN_BIND in env.shared
    # if you need LAN access or are on Docker Desktop versions <29.5 where
    # explicit loopback binds were silently dropped on multi-port services.
    - ${KONG_PROXY_BIND:-127.0.0.1}:${SUPABASE_KONG_PROXY_PORT:-8000}:8000
    - ${KONG_ADMIN_BIND:-127.0.0.1}:${SUPABASE_KONG_ADMIN_PORT:-8001}:8001
    networks:
    - pmoves_api
    - pmoves_public

    deploy:
      resources:
        limits:
          cpus: '0.5'
          # 512M fits a single-worker Kong with bundled plugins + DB cache
          # warmup + modest request headroom. Previously set to 256M which
          # OOM'd on startup; briefly raised to 1024M to confirm the root
          # cause was worker-count-driven memory multiplication, not leak.
          memory: 512M
  supabase-realtime:
    <<: *tier-supabase-hardened
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    # Database connection
    - DB_HOST=supabase-db
    - DB_PORT=5432
    - DB_NAME=${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    - DB_USER=${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}
    - DB_PASSWORD=${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}
    - DB_SSL=false
    - DB_AFTER_CONNECT_QUERY=SET search_path TO _realtime
    - DB_ENC_KEY=${SUPABASE_REALTIME_ENC_KEY:-supabaserealtime}
    # App configuration
    - APP_NAME=realtime
    - PORT=4000
    - RLIMIT_NOFILE=10000
    - SEED_SELF_HOST=true
    - RUN_JANITOR=true
    - DISABLE_HEALTHCHECK_LOGGING=true
    - ERL_AFLAGS=-proto_dist inet_tcp
    - DNS_NODES=''
    # JWT secret (must match gotrue) - standard variable name
    - API_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}
    - SECRET_KEY_BASE=${SECRET_KEY_BASE:-${SUPABASE_REALTIME_SECRET:-${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}}}
    - METRICS_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}
    # PMOVES context
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # Healthcheck: Simple HTTP check (Realtime serves HTML on /)
    # Note: Official Supabase uses /api/tenants/{tenant}/health with Bearer token, but that endpoint returns 500 until DB migrations complete
    - PMOVES_NETWORKS=pmoves_api
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:4000/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
    - ${SUPABASE_REALTIME_BIND:-127.0.0.1}:${SUPABASE_REALTIME_PORT:-4010}:4000
    networks:
