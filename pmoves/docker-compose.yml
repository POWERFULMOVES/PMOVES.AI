    - POSTGRES_BACKEND_URL=postgresql://${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}}@supabase-db:5432/_supabase
    - POSTGRES_BACKEND_SCHEMA=_analytics
    - LOGFLARE_FEATURE_FLAG_OVERRIDE=multibackend=true
    - PMOVES_NETWORKS=pmoves_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:4000/health -o /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
    - pmoves_data

  # ---------------------------------------------------------------------------
  # Supabase Vector — log collection pipeline (ships to Analytics)
  # ---------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
  supabase-vector:
    <<: *tier-supabase-hardened
    image: timberio/vector:0.28.1-alpine
    command: ["--config", "/etc/vector/vector.yml"]
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - LOGFLARE_PUBLIC_ACCESS_TOKEN=${LOGFLARE_PUBLIC_ACCESS_TOKEN:-}
    # Pass-through (no `=`) so these resolve to ABSENT from the host, overriding
    # the empty-string values the supabase env files set. vector 0.28.1 fails to
    # build its logflare proxy connector from an empty-string HTTP_PROXY ("Failed
    # to build Proxy connector: empty string") and crash-loops; an ABSENT var is
    # fine. (An `=` here would re-set the empty string and reintroduce the crash.)
    - HTTP_PROXY
    - HTTPS_PROXY
    - NO_PROXY
    - PMOVES_NETWORKS=pmoves_data
    volumes:
    - supabase-vector-data:/var/lib/vector
    - ../PMOVES-supabase/docker/volumes/logs/vector.yml:/etc/vector/vector.yml:ro
    # SECURITY: Docker socket required for Vector docker_logs source
    # (PMOVES-supabase/docker/volumes/logs/vector.yml). Read-only mount.
    - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "vector validate /etc/vector/vector.yml || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      supabase-analytics:
        condition: service_healthy
    networks:
    - pmoves_data

  # ---------------------------------------------------------------------------
  # Supavisor — connection pooler (PgBouncer replacement)
  # ---------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  supabase-pooler:
    <<: *tier-supabase-hardened
    image: supabase/supavisor:2.9.5
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - PORT=4000
    - POSTGRES_PORT=5432
    - POSTGRES_DB=${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}
    - DATABASE_URL=ecto://${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}}@supabase-db:5432/_supabase
    - CLUSTER_POSTGRES=true
    - SECRET_KEY_BASE=${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in env.tier-supabase}
    - METRICS_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}
    - VAULT_ENC_KEY=${VAULT_ENC_KEY:?Set VAULT_ENC_KEY in env.tier-supabase}
    - API_JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in env.tier-supabase}
    - REGION=local
    - ERL_AFLAGS=-proto_dist inet_tcp
    - POOLER_TENANT_ID=${POOLER_TENANT_ID:-default-tenant}
    - POOLER_DEFAULT_POOL_SIZE=${POOLER_DEFAULT_POOL_SIZE:-20}
    - POOLER_MAX_CLIENT_CONN=${POOLER_MAX_CLIENT_CONN:-100}
    - POOLER_POOL_MODE=transaction
    - DB_POOL_SIZE=${POOLER_DB_POOL_SIZE:-5}
    - PMOVES_NETWORKS=pmoves_data
    command: ["/bin/sh", "-c", "/app/bin/migrate && if [ -f /etc/pooler/pooler.exs ]; then /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\"; else echo 'WARN: /etc/pooler/pooler.exs not found, skipping tenant seeding'; fi && /app/bin/server"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://127.0.0.1:4000/api/health -o /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
    - ${SUPABASE_POOLER_BIND:-127.0.0.1}:${SUPABASE_POOLER_PORT:-54329}:5432
    - ${SUPABASE_POOLER_BIND:-127.0.0.1}:${SUPABASE_POOLER_TRANSACTION_PORT:-6543}:6543
    networks:
    - pmoves_data

  # =============================================================================
  # END SUPABASE STACK
  # =============================================================================

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  qdrant:
    image: qdrant/qdrant:v1.16.0
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    - CHOWN
    - SETGID
    security_opt:
    - no-new-privileges:true
    ports:
    - ${QDRANT_BIND:-0.0.0.0}:${QDRANT_PORT:-6333}:6333
    networks:
    - pmoves_data
    - pmoves_api
    - pmoves_bus
    environment:
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - QDRANT__SERVICE__API_KEY=${QDRANT__API_KEY:?Set QDRANT__API_KEY in env.tier-data}
    - PMOVES_NETWORKS=pmoves_data,pmoves_api,pmoves_bus
    volumes:
    - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc \"exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
