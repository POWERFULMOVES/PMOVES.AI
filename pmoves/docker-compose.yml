    - CLICKHOUSE_USER=tensorzero
    - CLICKHOUSE_PASSWORD=tensorzero
    - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_data
    ports:
    - ${CLICKHOUSE_BIND:-0.0.0.0}:${TENSORZERO_CLICKHOUSE_PORT:-8123}:8123
    volumes:
    - tensorzero-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider --tries=1 --timeout=5 http://$${CLICKHOUSE_USER:-default}:$${CLICKHOUSE_PASSWORD:-}@127.0.0.1:8123/ping
      start_period: 90s
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
    - pmoves_data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
  tensorzero-gateway:
    <<: *tier-llm-hardened
    # Pinned 2025-02-04: Latest stable from TensorZero
    image: tensorzero/gateway:2026.1.8
    restart: unless-stopped
    command:
    - --config-file
    - /app/config/tensorzero.toml
    environment:
    - TENSORZERO_CLICKHOUSE_URL=${TENSORZERO_CLICKHOUSE_GATEWAY_URL:-${TENSORZERO_CLICKHOUSE_URL:-http://tensorzero:tensorzero@tensorzero-clickhouse:8123/default}}
    # Keep gateway bootable in local-first mode when cloud provider keys are absent.
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-local-disabled}
    - GLM_API_KEY=${GLM_API_KEY:-local-disabled}
    - OPENAI_API_KEY=${OPENAI_API_KEY:-local-disabled}
    - GROQ_API_KEY=${GROQ_API_KEY:-local-disabled}
    - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-local-disabled}
    # Kimi Code SUBSCRIPTION key (canonical manifest/tier name, 2026-07-24).
    # Read by models.chat_kimi_for_coding on api.kimi.com/coding/v1 — the
    # subscription platform is ISOLATED from pay-per-token api.moonshot.ai,
    # so this key must NOT be funneled into the legacy Moonshot location
    # (it 401s there; verified live).
    - KIMI_CODING_API=${KIMI_CODING_API:-local-disabled}
    - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-local-disabled}
    - VENICE_API_KEY=${VENICE_API_KEY:-local-disabled}
    - Z_AI_API_KEY=${Z_AI_API_KEY:-local-disabled}
    - ALIBABA_PRO_CODING_PLAN=${ALIBABA_PRO_CODING_PLAN:-local-disabled}
    - OLLAMA_API_KEY=${OLLAMA_API_KEY:-local-disabled}
    - KILOCODE_API_KEY=${KILOCODE_API_KEY:-local-disabled}
    - HF_TOKEN=${HF_TOKEN:-local-disabled}
    - MINIMAX_API_KEY=${MINIMAX_API_KEY:-local-disabled}
    - TOGETHER_AI_API_KEY=${TOGETHER_AI_API_KEY:-local-disabled}
    - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-local-disabled}
    - GEMINI_API_KEY=${GEMINI_API_KEY:-local-disabled}
    - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://pmoves-otel-collector:4317}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_api,pmoves_bus,pmoves_data,pmoves_monitoring,pmoves_external
    volumes:
    - ./tensorzero/config:/app/config:ro
    depends_on:
      tensorzero-clickhouse:
        condition: service_healthy
    ports:
    - ${TENSORZERO_BIND:-127.0.0.1}:${TENSORZERO_PORT:-3030}:3000
    networks:
    - pmoves_api
    - pmoves_bus
    - pmoves_data
    - pmoves_monitoring
    - pmoves_external
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || curl -fsS http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  tensorzero-ui:
    <<: *tier-llm-hardened
    # Pinned 2025-02-04: Latest stable from TensorZero (matches gateway version)
    image: tensorzero/ui:2026.1.8
    restart: unless-stopped
    environment:
    - TENSORZERO_GATEWAY_URL=${TENSORZERO_GATEWAY_URL:-http://tensorzero-gateway:3000}
    - TENSORZERO_CLICKHOUSE_URL=${TENSORZERO_CLICKHOUSE_GATEWAY_URL:-${TENSORZERO_CLICKHOUSE_URL:-http://tensorzero:tensorzero@tensorzero-clickhouse:8123/default}}
    - TENSORZERO_POSTGRES_URL=${TENSORZERO_POSTGRES_URL:-postgresql://postgres:${SERVICE_PASSWORD_POSTGRES:-postgres}@supabase-db:5432/postgres}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    - PMOVES_NETWORKS=pmoves_app,pmoves_data,pmoves_external
    volumes:
    - ./tensorzero/config:/app/config:ro
    depends_on:
      tensorzero-clickhouse:
        condition: service_healthy
      tensorzero-gateway:
        condition: service_started
    ports:
    - ${TENSORZERO_UI_BIND:-0.0.0.0}:${TENSORZERO_UI_PORT:-4000}:4000
    profiles:
    - tensorzero
    networks:
    - pmoves_app
    - pmoves_data
    - pmoves_external
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ >/dev/null 2>&1 || curl -fsS http://localhost:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  gpu-orchestrator:
    env_file:
    - env.shared
    - env.tier-llm
    - env.tier-api
    build:
      context: ./services/gpu-orchestrator
      dockerfile: Dockerfile
    image: ${GPU_ORCHESTRATOR_IMAGE:-ghcr.io/powerfulmoves/pmoves-gpu-orchestrator:latest@sha256:cbfbcbfa779ad83b720c1fa1527e0258d192f5d01c6d26d62aa247d501f8693a}
    restart: unless-stopped
    environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - GPU_MODELS_CONFIG=/config/gpu-models.yaml
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://pmoves-ollama:11434}
    - VLLM_BASE_URL=${VLLM_BASE_URL:-http://pmoves-vllm:8000}
    - TTS_BASE_URL=${TTS_BASE_URL:-http://ultimate-tts-studio:7861}
    - GPU_ORCHESTRATOR_MAX_MODELS=${GPU_ORCHESTRATOR_MAX_MODELS:-3}
    - GPU_ORCHESTRATOR_VRAM_THRESHOLD=${GPU_ORCHESTRATOR_VRAM_THRESHOLD:-0.9}
    - NATS_URL=${NATS_URL}
    - MODEL_REGISTRY_URL=${MODEL_REGISTRY_URL:-http://model-registry:8110}
    - PMOVES_NETWORKS=pmoves_api,pmoves_bus,pmoves_monitoring
    volumes:
      # SECURITY: Docker socket required for spawning GPU model containers.
      # Mounted read-only with hardened security context (no-new-privileges, cap_drop).
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./config/gpu-models.yaml:/config/gpu-models.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
        limits:
          cpus: '4.0'
          memory: 8G
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    profiles:
    - gpu
    networks:
    - pmoves_api
    - pmoves_bus
    - pmoves_monitoring
    ports:
    - ${GPU_ORCHESTRATOR_BIND:-127.0.0.1}:${GPU_ORCHESTRATOR_HOST_PORT:-8200}:8200
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      nats:
        condition: service_healthy
        required: false
      model-registry:
        condition: service_healthy
        required: false

  # NVIDIA NIM - Llama-3.3-Nemotron-Super-49B inference server (~30GB VRAM)
  # Default host port is 8200 (NOT 8000) to avoid colliding with supabase-kong,
  # which binds 8000 by default. Override via NIM_HOST_PORT.
  nvidia-nim:
    <<: *tier-llm-hardened
    image: nvcr.io/nim/nvidia/llama-3_3-nemotron-super-49b-v1:1.8.3
    restart: unless-stopped
    environment:
      # Keep base compose validation non-fatal when the nim profile is unused.
      # Operators launching NIM should still set NGC_API_KEY explicitly.
    - NGC_API_KEY=${NGC_API_KEY:-}
    - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    - PMOVES_NETWORKS=pmoves_api,pmoves_bus,pmoves_monitoring
    ports:
    - "${NIM_BIND:-127.0.0.1}:${NIM_HOST_PORT:-8200}:8000"
    profiles: ["gpu", "nim"]
    networks:
    - pmoves_api
      # pmoves_bus: publish mesh.gpu.model.loaded.v1 / .unloaded.v1 for model-registry sync
    - pmoves_bus
    - pmoves_monitoring
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  evo-controller:
    <<: *tier-agent-hardened-ro
    build:
      context: .
      dockerfile: services/evo-controller/Dockerfile
    image: ${EVO_CONTROLLER_IMAGE:-ghcr.io/powerfulmoves/pmoves-evo-controller:latest}
    restart: unless-stopped
    environment:
    # NATS_URL from env.tier-agent has credentials: nats://nats:***@nats:4222
    - PORT=8113
    - SUPA_REST_URL=${SUPA_REST_INTERNAL_URL:-${SUPA_REST_URL:-http://supabase-kong:8000/rest/v1}}
    - EVOSWARM_POLL_SECONDS=${EVOSWARM_POLL_SECONDS:-300}
    # CHIT fail-closed signing (house pattern, mirrors hi-rag-gateway*)
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - EVOSWARM_SAMPLE_LIMIT=${EVOSWARM_SAMPLE_LIMIT:-25}
    - EVOSWARM_NAMESPACE=${EVOSWARM_NAMESPACE:-}
    - NATS_URL=${NATS_URL}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - PMOVES_NETWORKS=pmoves_app,pmoves_api,pmoves_bus,pmoves_external
    ports: ["${EVO_CONTROLLER_BIND:-127.0.0.1}:8113:8113"]
    profiles: ["orchestration"]
    # Docker Desktop does not publish host ports for services attached only to internal networks.
    networks: [pmoves_app, pmoves_api, pmoves_bus, pmoves_external]
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8113/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Ultimate TTS Studio - Multi-engine TTS with 7 engines (Gradio UI)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  ultimate-tts-studio:
    build:
      context: ./docker/ultimate-tts-studio
      dockerfile: Dockerfile
    image: ${ULTIMATE_TTS_IMAGE:-ghcr.io/powerfulmoves/pmoves-ultimate-tts-studio:pmoves-latest}
    restart: unless-stopped
    <<: *tier-media-hardened
    environment:
    - GRADIO_SERVER_NAME=0.0.0.0
    - GRADIO_SERVER_PORT=7861
    - GRADIO_MCP_SERVER=false    # Requires gradio[mcp] extra - enable after image rebuild
      # WSL2/CUDA compatibility settings
    - CUDA_FORCE_PTX_JIT=1
    - CUDA_DEVICE_ORDER=PCI_BUS_ID
    - TORCH_CUDA_ARCH_LIST=5.0;5.2;6.0;6.1;7.0;7.5;8.0;8.6;9.0
    - TORCH_CUDNN_V8_API_ENABLED=1
    - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    - PMOVES_NETWORKS=pmoves_app,pmoves_monitoring,pmoves_external
    ports: ["${TTS_BIND:-127.0.0.1}:7861:7861"]
    profiles: ["gpu", "tts", "voice"]
    networks: [pmoves_app, pmoves_monitoring, pmoves_external]  # HuggingFace TTS model downloads
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
        limits:
          memory: 8G
          cpus: '4.0'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7861/gradio_api/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Flute Gateway - Multimodal voice communication layer (TTS/STT)
  flute-gateway:
    <<: *tier-media-hardened
    build:
      context: .
      dockerfile: services/flute-gateway/Dockerfile
    image: ${FLUTE_GATEWAY_IMAGE:-ghcr.io/powerfulmoves/pmoves-flute-gateway:latest}
    restart: unless-stopped
    environment:
    # NATS_URL from env.shared/env.tier-media has credentials: nats://nats:***@nats:4222
    - PORT=8055
    - NATS_URL=${NATS_URL}
    - SUPABASE_URL=${SUPABASE_INTERNAL_URL:-${SUPABASE_URL:-http://supabase-kong:8000}}
    - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
    # Default TTS = OmniVoice (k2-fsa, Apache-2.0; license-clean creator-pipeline
    # voice). Overridable: DEFAULT_VOICE_PROVIDER=vibevoice restores z890's lane.
    - DEFAULT_VOICE_PROVIDER=${DEFAULT_VOICE_PROVIDER:-omnivoice}
    # OmniVoice server (creator-operator omnivoice.compose.yml, :8002). On a
    # shared host bring OmniVoice up with OMNIVOICE_BIND=0.0.0.0 so this container
    # reaches it via host.docker.internal; set OMNIVOICE_TOKEN once 0.0.0.0-bound.
    - OMNIVOICE_URL=${OMNIVOICE_URL:-http://host.docker.internal:8002}
    - OMNIVOICE_TOKEN=${OMNIVOICE_TOKEN:-}
    - OMNIVOICE_TIMEOUT_SEC=${OMNIVOICE_TIMEOUT_SEC:-300}
    # Realtime duplex voice agent (/v1/voice/agent: mic→Whisper→LLM→VibeVoice).
    # Off by default — requires pipecat-ai installed + VibeVoice (7860) running.
    - PIPECAT_ENABLED=${PIPECAT_ENABLED:-false}
    - ULTIMATE_TTS_URL=${ULTIMATE_TTS_URL:-http://host.docker.internal:7860}
    - ULTIMATE_TTS_TIMEOUT_SEC=${ULTIMATE_TTS_TIMEOUT_SEC:-300}
    # Host-affinity routing (opt-in, #2305): with VOICE_HOST_AFFINITY=1 a cast
    # host-swaps the configured engine URL to the selected fleet node's Tailscale
    # hostname (pmoves-<node>, port/path preserved) via resolve_engine_target().
    # VOICE_FLEET_NODES (comma-sep up-node ids) restricts routing to nodes that
    # are up; unset → optimistic preferred. Fail-open to the configured URL by
    # default (both unset) — zero behaviour change unless explicitly enabled.
    - VOICE_HOST_AFFINITY=${VOICE_HOST_AFFINITY:-}
    - VOICE_FLEET_NODES=${VOICE_FLEET_NODES:-}
    - FLUTE_API_KEY=${FLUTE_API_KEY:-}
    # CHIT voice attribution: publishes CGP events to tokenism.geometry.event.v1
    # NATS subject for every voice synthesis. Enables downstream consumers
    # (tokenism simulator, hi-rag indexing) to correlate audio with prosodic
    # BPM structure. Safe to enable — events are best-effort and non-blocking.
    - CHIT_VOICE_ATTRIBUTION=${CHIT_VOICE_ATTRIBUTION:-true}
    - CHIT_GEOMETRY_SUBJECT=${CHIT_GEOMETRY_SUBJECT:-tokenism.geometry.event.v1}
    - CHIT_NAMESPACE=${CHIT_NAMESPACE:-pmoves.voice}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
      # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    - PMOVES_NETWORKS=pmoves_app,pmoves_api,pmoves_bus,pmoves_external
    ports: ["${FLUTE_BIND:-127.0.0.1}:8055:8055", "${FLUTE_BIND:-127.0.0.1}:8056:8056"]
    profiles: ["orchestration", "media"]
    # Attach a non-internal bridge so published host ports resolve on Docker Desktop.
    networks: [pmoves_app, pmoves_api, pmoves_bus, pmoves_external]
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8055/healthz', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # Tier: agent (Tokenism Simulator - CHIT/geometry bus simulation service)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  tokenism-simulator:
    build:
      context: .
      dockerfile: services/tokenism-simulator/Dockerfile
    image: ${TOKENISM_IMAGE:-ghcr.io/powerfulmoves/pmoves-tokenism-simulator:edge}
    restart: unless-stopped
    <<: *tier-agent-hardened-ro
    environment:
    # NATS_URL from env.shared/env.tier-agent has credentials: nats://nats:***@nats:4222
    - TOKENISM_HOST=${TOKENISM_HOST:-0.0.0.0}
    - TOKENISM_PORT=${TOKENISM_PORT:-8100}
    - FLASK_ENV=${FLASK_ENV:-production}
    # CHIT fail-closed signing (house pattern, mirrors hi-rag-gateway*)
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - SECRET_KEY=${SECRET_KEY:-pmoves-tokenism-secret}
    - NATS_URL=${NATS_URL}
    - NATS_CLIENT_NAME=tokenism-simulator
    - NATS_JETSTREAM=${NATS_JETSTREAM:-true}
    - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
    - TENSORZERO_MODEL=${TENSORZERO_MODEL:-claude-sonnet-4-5}
    - SUPABASE_URL=${SUPABASE_URL:-http://supabase-kong:8000}
    - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    - AGENTZERO_URL=${AGENTZERO_URL:-http://agent-zero:8080}
    - AGENTZERO_MCP_ENABLED=${AGENTZERO_MCP_ENABLED:-true}
    - CHIT_ENABLED=${CHIT_ENABLED:-true}
    - GEOMETRY_BUS_URL=${GEOMETRY_BUS_URL:-${NATS_URL}}
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    - PMOVES_NETWORKS=pmoves_app,pmoves_api,pmoves_bus,pmoves_monitoring
    ports: ["${TOKENISM_BIND:-0.0.0.0}:${TOKENISM_HOST_PORT:-8103}:8100"]
    profiles: ["agents", "orchestration", "botz"]
    depends_on: [nats]
    networks: [pmoves_app, pmoves_api, pmoves_bus, pmoves_monitoring]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PMOVES Tokenism UI - Interactive dashboard for token economy simulation
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  tokenism-ui:
    build:
      context: ./PMOVES-ToKenism-Multi/pmoves-nextjs
      dockerfile: Dockerfile
    image: ${TOKENISM_UI_IMAGE:-ghcr.io/powerfulmoves/pmoves-tokenism-ui:pmoves-latest}
    restart: unless-stopped
    <<: *tier-ui-hardened
    environment:
    - NEXT_PUBLIC_TOKENISM_URL=${TOKENISM_UI_API_URL:-http://tokenism-simulator:8100}
    - NODE_ENV=production
    - PORT=8504
    - PMOVES_NETWORKS=pmoves_app
    ports: ["${TOKENISM_UI_BIND:-0.0.0.0}:${TOKENISM_UI_HOST_PORT:-8504}:8504"]
    profiles: ["agents", "botz"]
    networks: [pmoves_app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8504/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Consciousness Service - CHR Algorithm & CGP Generation (port 8106)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  consciousness-service:
    build:
      context: .
      dockerfile: services/consciousness-service/Dockerfile
    image: ${CONSCIOUSNESS_IMAGE:-ghcr.io/powerfulmoves/pmoves-consciousness:pmoves-latest}
    restart: unless-stopped
    <<: *tier-agent-hardened-ro
    environment:
    - SERVICE_NAME=consciousness-service
    - SERVICE_PORT=${CONSCIOUSNESS_HOST_PORT:-8106}
    - NATS_URL=${NATS_URL}
    - CHIT_PROD_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    # CHIT fail-closed signing (house pattern, mirrors hi-rag-gateway*)
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - SUPABASE_URL=${SUPABASE_URL:-http://supabase-kong:8000}
    - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
    - PYTHONUNBUFFERED=1
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus
    ports: ["${CONSCIOUSNESS_BIND:-0.0.0.0}:${CONSCIOUSNESS_HOST_PORT:-8106}:8106"]
    profiles: ["agents", "botz"]
    networks: [pmoves_app, pmoves_bus]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8106/healthz').raise_for_status()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      nats-init:
        condition: service_healthy

  # Cast TTS Gateway - Chromecast/Google Home TTS routing (port 8060)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  cast-tts-gateway:
    build:
      context: ./services/cast-tts-gateway
      dockerfile: Dockerfile
    image: ${CAST_TTS_IMAGE:-ghcr.io/powerfulmoves/pmoves-cast-tts-gateway:pmoves-latest}
    restart: unless-stopped
    <<: *tier-agent-hardened-ro
    environment:
    - PORT=8060
    - FLUTE_GATEWAY_URL=http://flute-gateway:8055
    - ULTIMATE_TTS_URL=${ULTIMATE_TTS_URL:-http://host.docker.internal:7860}
    - NATS_URL=${NATS_URL}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_REQUIRE_SIGNATURE:-false}
    - CHIT_DECRYPT_ANCHORS=${CHIT_DECRYPT_ANCHORS:-false}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - SUPABASE_URL=http://supabase-kong:8000
    - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    - MAX_CONCURRENT_CASTS=${MAX_CONCURRENT_CASTS:-4}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_api,pmoves_external
    ports: ["${CAST_TTS_BIND:-0.0.0.0}:${CAST_TTS_PORT:-8060}:8060"]
    profiles: ["cast", "media"]
    networks: [pmoves_app, pmoves_bus, pmoves_api, pmoves_external]
    user: "65532:65532"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8060/healthz', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      flute-gateway:
        condition: service_healthy
      nats:
        condition: service_healthy
      supabase-kong:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Voice Relay - NATS bridge: agentzero.task.result.v1 → voice.agent.response.v1
  voice-relay:
    build:
      context: .
      dockerfile: services/voice-relay/Dockerfile
    image: ${VOICE_RELAY_IMAGE:-ghcr.io/powerfulmoves/pmoves-voice-relay:pmoves-latest}
    restart: unless-stopped
    <<: *tier-worker-hardened
    environment:
    - PORT=8121
    - NATS_URL=${NATS_URL}
    - VOICE_RELAY_INPUT_SUBJECT=${VOICE_RELAY_INPUT_SUBJECT:-agentzero.task.result.v1}
    - VOICE_RELAY_OUTPUT_SUBJECT=${VOICE_RELAY_OUTPUT_SUBJECT:-voice.agent.response.v1}
    - PMOVES_NETWORKS=pmoves_bus
    ports: ["${VOICE_RELAY_BIND:-0.0.0.0}:${VOICE_RELAY_PORT:-8121}:8121"]
    profiles: ["cast", "media"]
    networks: [pmoves_bus]
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8121/healthz', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 32M

  # PMOVES Central UI - Main dashboard (port 4482)
  pmoves-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [env.shared.generated, env.shared, env.tier-ui, .env.generated, .env.local]
    environment:
    - NODE_ENV=production
    - HOSTNAME=0.0.0.0
      # Room manifests — the rooms API reads catalog.json + the per-room
      # manifests from this directory. Without it, the Rooms tab on the
      # home page renders "Room manifests are not available yet" and
      # /api/rooms returns 500. PMOVES_ROOM_CONFIG_DIR overrides the
      # default (cwd/../config/rooms) to a path inside the container
      # where the rooms data is mounted. The volume below maps the host
      # pmoves/config/rooms to /app/rooms:ro so the standalone Next.js
      # build can read the room data.
    - PMOVES_ROOM_CONFIG_DIR=/app/rooms
      # Supabase
    - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:8000}
    - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-${ANON_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}}
    - NEXT_PUBLIC_SUPABASE_REST_URL=${NEXT_PUBLIC_SUPABASE_REST_URL:-http://localhost:8000/rest/v1}
      # Voice/TTS
    - NEXT_PUBLIC_FLUTE_GATEWAY_URL=${NEXT_PUBLIC_FLUTE_GATEWAY_URL:-http://localhost:8055}
    - NEXT_PUBLIC_FLUTE_WS_URL=${NEXT_PUBLIC_FLUTE_WS_URL:-ws://localhost:8056}
      # Agent Services (client-side needs localhost)
    - NEXT_PUBLIC_AGENT_ZERO_URL=${NEXT_PUBLIC_AGENT_ZERO_URL:-http://localhost:8080}
    - NEXT_PUBLIC_AGENT_ZERO_UI_URL=${NEXT_PUBLIC_AGENT_ZERO_UI_URL:-http://localhost:8081}
    - NEXT_PUBLIC_ARCHON_URL=${NEXT_PUBLIC_ARCHON_URL:-http://localhost:8091}
    - NEXT_PUBLIC_ARCHON_UI_URL=${NEXT_PUBLIC_ARCHON_UI_URL:-http://localhost:3737}
      # Knowledge & Search
    - NEXT_PUBLIC_HIRAG_URL=${NEXT_PUBLIC_HIRAG_URL:-http://localhost:8086}
    - NEXT_PUBLIC_OPEN_NOTEBOOK_API_URL=${NEXT_PUBLIC_OPEN_NOTEBOOK_API_URL:-http://localhost:5055}
    - NEXT_PUBLIC_TENSORZERO_UI_URL=${NEXT_PUBLIC_TENSORZERO_UI_URL:-http://localhost:4000}
      # Media & Ingestion
    - NEXT_PUBLIC_PRESIGN_URL=${NEXT_PUBLIC_PRESIGN_URL:-http://localhost:8088}
    - NEXT_PUBLIC_PMOVES_YT_BASE_URL=${NEXT_PUBLIC_PMOVES_YT_BASE_URL:-http://localhost:8077}
    - NEXT_PUBLIC_CHANNEL_MONITOR_STATS_URL=${NEXT_PUBLIC_CHANNEL_MONITOR_STATS_URL:-http://localhost:8097/api/monitor/stats}
      # Token Economy Simulation
    - NEXT_PUBLIC_TOKENISM_URL=${NEXT_PUBLIC_TOKENISM_URL:-http://localhost:8103}
      # Monitoring Stack
    - NEXT_PUBLIC_GRAFANA_URL=${NEXT_PUBLIC_GRAFANA_URL:-http://localhost:3002}
    - NEXT_PUBLIC_PROMETHEUS_URL=${NEXT_PUBLIC_PROMETHEUS_URL:-http://localhost:9090}
    - NEXT_PUBLIC_LOKI_URL=${NEXT_PUBLIC_LOKI_URL:-http://localhost:3100}
      # Server-side health checks: rewrite localhost → host.docker.internal
    - HEALTH_CHECK_HOST=host.docker.internal
      # Server-side only (Docker hostnames OK)
    - POSTGREST_URL=${POSTGREST_URL:-http://supabase-kong:8000/rest/v1}
    - PRESIGN_SHARED_SECRET=${PRESIGN_SHARED_SECRET}
    - RENDER_WEBHOOK_URL=${RENDER_WEBHOOK_URL:-http://render-webhook:8085/comfy/webhook}
    - OPEN_NOTEBOOK_API_URL=${OPEN_NOTEBOOK_API_URL:-http://open-notebook:5055}
    - TOKENISM_URL=${TOKENISM_URL:-http://pmoves-tokenism-simulator-1:8100}
    - PMOVES_NETWORKS=pmoves_app,pmoves_api,pmoves_external
    extra_hosts:
    - "host.docker.internal:host-gateway"
    # Room manifests: the standalone Next.js build can't read host
    # files by default; mount pmoves/config/rooms read-only at /app/rooms
    # so the rooms API (/api/rooms) and the home-page Rooms tab work.
    volumes:
    - ./config/rooms:/app/rooms:ro
    ports:
    - "${PMOVES_UI_BIND:-0.0.0.0}:4482:3000"
    # Note: flute-gateway is optional (for voice features). Start with workers profile for full functionality.
    networks: [pmoves_app, pmoves_api, pmoves_external]
    profiles: ["ui"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Session Context Worker - Transforms Claude Code session context to Hi-RAG KB entries
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  session-context-worker:
    <<: *tier-worker-hardened
    image: ${SESSION_CONTEXT_WORKER_IMAGE:-ghcr.io/powerfulmoves/pmoves-session-context-worker:latest}
    build:
      context: .
      dockerfile: services/session-context-worker/Dockerfile
    restart: unless-stopped
    environment:
    - PORT=8100
    - NATS_URL=${NATS_URL}
    - HIRAG_INGEST_URL=${HIRAG_INGEST_URL:-http://hi-rag-gateway-v2:8086/ingest}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus
    ports:
    - ${SESSION_CONTEXT_BIND:-0.0.0.0}:8102:8100
    profiles:
    - workers
    networks:
    - pmoves_app
    - pmoves_bus
    depends_on:
    - hi-rag-gateway-v2
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Wger - Fitness tracker with health metrics and workout logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  wger:
    <<: *tier-api-hardened
    image: ${WGER_IMAGE:-ghcr.io/powerfulmoves/pmoves-health-wger:pmoves-latest}
    restart: unless-stopped
    environment:
      # Database configuration
    - DATABASE_URL=postgres://wger:${WGER_DB_PASSWORD:?set WGER_DB_PASSWORD in env.tier-data}@wger-db:5432/wger
      # Django configuration
    - DJANGO_ALLOWED_HOSTS=*
    - DJANGO_SECRET_KEY=${WGER_SECRET_KEY:?set WGER_SECRET_KEY in env.tier-api}
    - WGER_ENABLE_REGISTRATION=${WGER_ENABLE_REGISTRATION:-true}
      # NATS configuration for event publishing
    - NATS_URL=${NATS_URL}
    - WGER_ENABLE_NATS=${WGER_ENABLE_NATS:-true}
      # Admin credentials
    - WGER_ADMIN_PASSWORD=${WGER_ADMIN_PASSWORD:?set WGER_ADMIN_PASSWORD in env.tier-api}
      # PMOVES integration
    - ENABLE_OBSERVABILITY=${WGER_OBSERVABILITY:-true}
    - WGER_USE_GUNICORN=${WGER_USE_GUNICORN:-True}
      # NOTE: /metrics available on port 8000 via ENABLE_OBSERVABILITY;
      # pmoves_monitoring network added below for Prometheus scrape access
    ports:
    - "${WGER_BIND:-0.0.0.0}:${WGER_PORT:-8000}:8000"
    profiles: ["health", "wger"]


  wger-nats-bridge:
    <<: *tier-api-hardened
    build: ./services/wger-nats-bridge
    restart: unless-stopped
    environment:
    - WGER_API_URL=http://wger:8000
    - NATS_URL=${NATS_URL}
    - CHIT_PASSPHRASE=${CHIT_PASSPHRASE:-}
    - WGER_POLL_INTERVAL=${WGER_POLL_INTERVAL:-60}
    depends_on:
      nats:
        condition: service_healthy
    profiles: ["health", "wger"]
  wger-db:
    <<: *tier-data-hardened
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
    - POSTGRES_DB=wger
    - POSTGRES_USER=wger
    - POSTGRES_PASSWORD=${WGER_DB_PASSWORD:?set WGER_DB_PASSWORD in env.tier-data}
    - PGDATA=/var/lib/postgresql/data/pgdata
    - PMOVES_NETWORKS=pmoves_data
    volumes:
    - wger-db:/var/lib/postgresql/data
    profiles: ["health", "wger"]
    networks:
    - pmoves_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wger -d wger"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Comfy Watcher - ComfyUI output watcher for NATS integration
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
  comfy-watcher:
    build:
      context: .
      dockerfile: services/comfy-watcher/Dockerfile
    restart: unless-stopped
    <<: *tier-worker-hardened
    environment:
      # NATS_URL from env.shared/env.tier-worker has credentials: nats://nats:***@nats:4222
    - MINIO_ENDPOINT=${MINIO_ENDPOINT:-${S3_ENDPOINT:-minio:9000}}
    - MINIO_ACCESS_KEY=${MINIO_USER:?Run make brand-defaults}
    - MINIO_SECRET_KEY=${MINIO_PASSWORD:?Run make brand-defaults}
    - MINIO_BUCKET=${MINIO_BUCKET:-pmoves-comfyui}
    - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-${S3_PUBLIC_BASE_URL:-http://${MINIO_ENDPOINT:-${S3_ENDPOINT:-minio:9000}}}}
    - PRESIGN_EXPIRES_HOURS=${PRESIGN_EXPIRES_HOURS:-24}
    - PMOVES_NETWORKS=pmoves_bus,pmoves_data
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
    - comfy-watcher-output:/data
    - comfy-watcher-state:/state
    profiles: ["orchestration", "workers"]
    networks: [pmoves_bus, pmoves_data]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, sys; sys.exit(0 if os.path.exists('/state') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Gateway Agent - Orchestrates 100+ MCP tools via Agent Zero MCP API
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  gateway-agent:
    build: ./services/gateway-agent
    restart: unless-stopped
    env_file:
    - env.shared
    - .env.generated
    environment:
    - PORT=${GATEWAY_AGENT_PORT:-8111}
    - AGENT_ZERO_URL=${AGENT_ZERO_URL:-http://agent-zero:8080}
    - CIPHER_URL=${CIPHER_URL:-http://cipher-api:8105}
    - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
    - SUPABASE_URL=${SUPABASE_URL:-http://supabase-kong:8000}
    - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    - TOOL_CACHE_TTL=${TOOL_CACHE_TTL:-300}
    - PMOVES_NETWORKS=pmoves_api,pmoves_app,pmoves_bus
    ports:
    - "${GATEWAY_AGENT_BIND:-0.0.0.0}:${GATEWAY_AGENT_PORT:-8111}:${GATEWAY_AGENT_PORT:-8111}"    # Default 8111; 8110 reserved for model-registry
    profiles: ["agents"]
    networks: [pmoves_api, pmoves_app, pmoves_bus]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${GATEWAY_AGENT_PORT:-8111}/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # GitHub Runner Control - Manages self-hosted GitHub runners
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  github-runner-ctl:
    build: ./services/github-runner-ctl
    restart: unless-stopped
    <<: *tier-agent-hardened-rw
    environment:
    - PORT=8104
    - NATS_URL=${NATS_URL}
    - GITHUB_PAT=${GITHUB_PAT:-}
    - GITHUB_PAT_FILE=${GITHUB_PAT_FILE:-/run/secrets/github_pat}
    - GITHUB_REPOSITORIES=${GITHUB_REPOSITORIES:-POWERFULMOVES/PMOVES.AI}
    - REFRESH_INTERVAL_SECONDS=${GITHUB_RUNNER_REFRESH_INTERVAL:-60}
    - LOG_LEVEL=${GITHUB_RUNNER_CTL_LOG_LEVEL:-INFO}
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - PMOVES_NETWORKS=pmoves_api,pmoves_bus,pmoves_monitoring,pmoves_external
    depends_on: [nats]
    ports: ["${GITHUB_RUNNER_CTL_BIND:-0.0.0.0}:8104:8104"]
    volumes:
    - ./services/github-runner-ctl/config:/app/config:ro
    - ./secrets/github_pat:/run/secrets/github_pat:ro
    profiles: ["orchestration", "workers"]
    networks: [pmoves_api, pmoves_bus, pmoves_monitoring, pmoves_external]  # GitHub API for runner mgmt
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8104/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  invidious-db:
    image: postgres:14
    restart: unless-stopped
    environment:
    - POSTGRES_DB=${INVIDIOUS_PG_DB:-invidious}
    - POSTGRES_USER=${INVIDIOUS_PG_USER:-kemal}
    - POSTGRES_PASSWORD=${INVIDIOUS_PG_PASSWORD:-kemal}
    - PMOVES_NETWORKS=pmoves_data,pmoves_app
    volumes:
    - invidious-postgres-data:/var/lib/postgresql/data
    - ./services/invidious/config/sql:/config/sql:ro
    - ./services/invidious/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1
      interval: 20s
      timeout: 5s
      retries: 12
    profiles:
    - invidious
    networks:
    - pmoves_data
    - pmoves_app
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
  invidious-companion:
    # F-07: pinned by digest for reproducible/supply-chain-safe default.
    # Override INVIDIOUS_COMPANION_IMAGE (e.g. ...:latest) to track newer builds.
    image: ${INVIDIOUS_COMPANION_IMAGE:-quay.io/invidious/invidious-companion@sha256:4dbe5c51811cf049ceeb690fe39040896734acce9c0dd7344519d6e2b4345c0b}
    restart: unless-stopped
    env_file:
    - env.shared
    environment:
    - PORT=8282
    - HOST=0.0.0.0
    - SERVER_SECRET_KEY=${INVIDIOUS_COMPANION_KEY:-60eec5b733160c57}
    - CACHE_DIRECTORY=/var/tmp/youtubei.js
    - SERVER_BASE_URL=${INVIDIOUS_COMPANION_PUBLIC_URL:-}
    - YOUTUBE_API_KEY=${INVIDIOUS_COMPANION_YOUTUBE_API_KEY:-}
    - YOUTUBEI_CLIENT=${INVIDIOUS_COMPANION_YOUTUBEI_CLIENT:-IOS}
    - YOUTUBEI_API_BASE=${INVIDIOUS_COMPANION_CA_URL:-https://www.youtube.com}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    volumes:
    - invidious-companion-cache:/var/tmp/youtubei.js
    ports:
    - ${INVIDIOUS_COMPANION_BIND:-127.0.0.1}:${INVIDIOUS_COMPANION_PORT:-8282}:8282
    profiles:
    - invidious
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_external  # YouTube innertube API
    # The invidious-companion image is a compiled Deno binary with NO shell
    # and NO wget/curl — CMD-SHELL based healthchecks fail every time (Phase
    # 9P observed 760+ failing streak despite service working normally).
    # Docker has no way to HTTP-probe without invoking something in the
    # container, so we disable the healthcheck. Liveness is still monitored
    # via Prometheus scraping (service exposes metrics) and the PMOVES.YT
    # fallback flow surfaces actual unhealthy states as 5xx response chains.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  invidious:
    # F-07: pinned by digest for reproducible/supply-chain-safe default.
    # Override INVIDIOUS_IMAGE (e.g. ...:latest) to track newer builds.
    image: ${INVIDIOUS_IMAGE:-quay.io/invidious/invidious@sha256:9d972ea5930c2e170b3c4d49bdd9fa09bf03f077d555f58747342062dffc5876}
    restart: unless-stopped
    env_file:
    - env.shared
    environment:
    - INVIDIOUS_HMAC_KEY=${INVIDIOUS_HMAC_KEY:-c51f3b3a42fbf044a9b1094eadbc79743b0d859999441d3dcfce55f5ad64a9a1}
    - INVIDIOUS_COMPANION_KEY=${INVIDIOUS_COMPANION_KEY:-60eec5b733160c57}
    - "INVIDIOUS_CONFIG=db:\n  dbname: ${INVIDIOUS_PG_DB:-invidious}\n  user: ${INVIDIOUS_PG_USER:-kemal}\n  password: ${INVIDIOUS_PG_PASSWORD:-kemal}\n  host: invidious-db\n  port: 5432\n  check_tables: true\ndomain: ${INVIDIOUS_DOMAIN:-}\nexternal_port: ${INVIDIOUS_EXTERNAL_PORT:-3000}\nhttps_only: ${INVIDIOUS_HTTPS_ONLY:-false}\nhmac_key: \"${INVIDIOUS_HMAC_KEY:-c51f3b3a42fbf044a9b1094eadbc79743b0d859999441d3dcfce55f5ad64a9a1}\"\ninvidious_companion:\n  - private_url: \"http://invidious-companion:8282\"\n    public_url: \"${INVIDIOUS_COMPANION_PUBLIC_URL:-http://localhost:8281}\"\ninvidious_companion_key: \"${INVIDIOUS_COMPANION_KEY:-60eec5b733160c57}\"\nstatistics_enabled: ${INVIDIOUS_STATISTICS_ENABLED:-false}\nuse_innertube_for_captions: ${INVIDIOUS_USE_INNERTUBE_CAPTIONS:-true}\nredirector:\n  use_invidious_redirector: ${INVIDIOUS_USE_REDIRECTOR:-true}\n  redirector_url: \"${INVIDIOUS_REDIRECTOR_URL:-https://redirect.invidious.io}\"\n"
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    ports:
    - ${INVIDIOUS_BIND:-127.0.0.1}:${INVIDIOUS_PORT:-3000}:3000
    depends_on:
      invidious-db:
        condition: service_healthy
      invidious-companion:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3000/api/v1/stats >/dev/null 2>&1 || wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
    - invidious
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_external  # YouTube + Invidious redirect API
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  grayjay-plugin-host:
    build: ./services/grayjay-plugin-host
    restart: unless-stopped
    env_file:
    - env.shared.generated
    - env.shared
    - .env.generated
    - .env.local
    environment:
    - JELLYFIN_PUBLIC_URL=${JELLYFIN_PUBLIC_BASE_URL:-http://localhost:8096}
    - GRAYJAY_PLUGIN_HOST_PUBLIC_URL=${GRAYJAY_PLUGIN_HOST_PUBLIC_URL:-http://localhost:9096}
    - GRAYJAY_PLUGIN_REGISTRY_TITLE=${GRAYJAY_PLUGIN_REGISTRY_TITLE:-PMOVES Plugin Registry}
    - GRAYJAY_JELLYFIN_PLUGIN_NAME=${GRAYJAY_JELLYFIN_PLUGIN_NAME:-PMOVES Jellyfin}
    - GRAYJAY_JELLYFIN_PLUGIN_DESCRIPTION=${GRAYJAY_JELLYFIN_PLUGIN_DESCRIPTION:-Self-hosted Jellyfin connector for PMOVES}
    - GRAYJAY_JELLYFIN_PLUGIN_ID=${GRAYJAY_JELLYFIN_PLUGIN_ID:-pmoves-jellyfin}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus
    ports:
    - ${GRAYJAY_BIND:-127.0.0.1}:${GRAYJAY_PLUGIN_HOST_PORT:-9096}:8080
    profiles:
    - grayjay
    networks:
    - pmoves_app
    - pmoves_bus
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  grayjay-server:
    # F-07: env-overridable so it can be pinned at deploy (previously a hard :latest).
    # TODO: pin default by digest — FUTO registry (registry.gitlab.futo.org) was
    # unreachable from the authoring node, so digest could not be resolved here.
    image: ${GRAYJAY_IMAGE:-registry.gitlab.futo.org/videostreaming/grayjay/grayjay:latest}
    restart: unless-stopped
    env_file:
    - env.shared.generated
    - env.shared
    - .env.generated
    - .env.local
    environment:
    - GRAYJAY_PLUGIN_REGISTRY_URL=${GRAYJAY_PLUGIN_REGISTRY_URL:-http://grayjay-plugin-host:8080/plugins}
    - GRAYJAY_SERVER_BIND=${GRAYJAY_SERVER_BIND:-127.0.0.1}
    - GRAYJAY_SERVER_PORT=${GRAYJAY_SERVER_PORT:-9095}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus
    ports:
    - ${GRAYJAY_BIND:-127.0.0.1}:${GRAYJAY_SERVER_PORT:-9095}:9095
    depends_on:
      grayjay-plugin-host:
        condition: service_started
    profiles:
    - grayjay
    networks:
    - pmoves_app
    - pmoves_bus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9095/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  cloudflared:
    image: cloudflare/cloudflared:2024.8.0
    restart: unless-stopped
    command:
    - /bin/sh
    - -c
    - "if [ -n \"$$CLOUDFLARE_TUNNEL_TOKEN\" ]; then\n  exec cloudflared tunnel --no-autoupdate run;\nelif [ -n \"$$CLOUDFLARE_TUNNEL_NAME\" ]; then\n  exec cloudflared tunnel --no-autoupdate run \"$$CLOUDFLARE_TUNNEL_NAME\";\nelse\n  echo \"Set CLOUDFLARE_TUNNEL_TOKEN or CLOUDFLARE_TUNNEL_NAME before starting cloudflared.\";\n  exit 1;\nfi\n"
    env_file:
    - env.shared.generated
    - env.shared
    - .env.generated
    - .env.local
    environment:
    - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    - CLOUDFLARE_TUNNEL_NAME=${CLOUDFLARE_TUNNEL_NAME:-}
    - PMOVES_NETWORKS=pmoves_app,pmoves_external
    volumes:
    - ${CLOUDFLARE_CREDENTIALS_DIR:-./cloudflared}:/home/nonroot/.cloudflared:rw
    profiles:
    - cloudflare
    networks:
    - pmoves_app
    - pmoves_external  # Cloudflare edge tunnel (mandatory)
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'cloudflared' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  invidious-companion-proxy:
    build: ./services/invidious-companion-proxy
    restart: unless-stopped
    depends_on:
      invidious-companion:
        condition: service_started
    ports:
    - ${INVIDIOUS_PROXY_BIND:-0.0.0.0}:8281:80
    profiles:
    - invidious
    networks:
    - pmoves_app
    - pmoves_bus
    environment:
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ || wget -qO- http://localhost:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  # Llama.cpp throughput benchmarking toolkit (GPU, on-demand)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  llama-throughput-lab:
    build:
      context: ../PMOVES-llama-throughput-lab
      dockerfile: Dockerfile
    image: ${LLAMA_THROUGHPUT_LAB_IMAGE:-ghcr.io/powerfulmoves/pmoves-llama-throughput-lab:latest}
    restart: "no"
    environment:
    - LLAMA_MODEL_PATH=/models/${LLAMA_MODEL:-model.gguf}
    - LLAMA_SERVER_HOST=127.0.0.1
    - LLAMA_RESULTS_DIR=/results
    - NATS_URL=${NATS_URL}
    - CIPHER_MEMORY_URL=${CIPHER_MEMORY_URL:-http://cipher-api:8105}
    - GPU_ORCHESTRATOR_URL=http://gpu-orchestrator:8200
    - METRICS_PORT=8201
    - PMOVES_NETWORKS=pmoves_api,pmoves_bus,pmoves_monitoring
    volumes:
    - ${LLAMA_MODELS_PATH:-./models}:/models:ro
    - llama-results:/results
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
        limits:
          cpus: '4.0'
          memory: 8G
    depends_on:
      nats:
        condition: service_healthy
        required: false
    profiles:
    - benchmarks
    - gpu
    networks:
    - pmoves_api
    - pmoves_bus
    - pmoves_monitoring
    ports:
    - ${LLAMA_LAB_BIND:-0.0.0.0}:8201:8201

  # =============================================================================
  # GitHub Automation Services (Phase 3)
  # =============================================================================
  # Additional GitHub automation services (branch naming, cross-repo sync, PR automation)
  # Profile: github-automation
  # Networks: pmoves_app, pmoves_api, pmoves_bus, pmoves_monitoring
  # Note: github-branch-cleanup and github-issue-triage are defined above
  # =============================================================================

  github-branch-naming:
    build:
      context: ./services/github-branch-naming
      dockerfile: Dockerfile
    image: ${GITHUB_BRANCH_NAMING_IMAGE:-ghcr.io/powerfulmoves/pmoves-github-branch-naming:pmoves-latest}
    restart: unless-stopped
    environment:
    - SERVICE_PORT=8102
    - NATS_URL=${NATS_URL}
    - AGENTZERO_MCP_URL=${AGENTZERO_MCP_URL:-http://agent-zero:8080/mcp/command}
    - DRY_RUN=${GITHUB_AUTOMATION_DRY_RUN:-true}
    - GITHUB_ORG=${GITHUB_ORG:-POWERFULMOVES}
    - PMOVES_NETWORKS=pmoves_app,pmoves_api,pmoves_bus,pmoves_monitoring,pmoves_external
    ports:
    - ${GITHUB_AUTOMATION_BIND:-0.0.0.0}:8112:8102
    profiles:
    - github-automation
    networks:
    - pmoves_app
    - pmoves_api
    - pmoves_bus
    - pmoves_monitoring
    - pmoves_external  # GitHub API
    depends_on:
      nats:
        condition: service_healthy
      agent-zero:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  github-crossrepo-sync:
    build:
      context: ./services/github-crossrepo-sync
      dockerfile: Dockerfile
    image: ${GITHUB_CROSSREPO_SYNC_IMAGE:-ghcr.io/powerfulmoves/pmoves-github-crossrepo-sync:pmoves-latest}
    restart: unless-stopped
    environment:
    - SERVICE_PORT=8103
    - NATS_URL=${NATS_URL}
    - AGENTZERO_MCP_URL=${AGENTZERO_MCP_URL:-http://agent-zero:8080/mcp/command}
    - DRY_RUN=${GITHUB_AUTOMATION_DRY_RUN:-true}
    - GITHUB_ORG=${GITHUB_ORG:-POWERFULMOVES}
    - MAIN_REPO=${MAIN_REPO:-PMOVES.AI}
    - WORKDIR=${WORKDIR:-/tmp/github-crossrepo-sync}
    - PMOVES_NETWORKS=pmoves_app,pmoves_api,pmoves_bus,pmoves_monitoring,pmoves_external
    ports:
    - ${GITHUB_AUTOMATION_BIND:-0.0.0.0}:8113:8103
    profiles:
    - github-automation
    networks:
    - pmoves_app
    - pmoves_api
    - pmoves_bus
    - pmoves_monitoring
    - pmoves_external  # GitHub API + git clone
    depends_on:
      nats:
        condition: service_healthy
      agent-zero:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  github-crossrepo-pr:
    build:
      context: ./services/github-crossrepo-pr
      dockerfile: Dockerfile
    image: ${GITHUB_CROSSREPO_PR_IMAGE:-ghcr.io/powerfulmoves/pmoves-github-crossrepo-pr:pmoves-latest}
    restart: unless-stopped
    environment:
    - SERVICE_PORT=8104
    - NATS_URL=${NATS_URL}
    - AGENTZERO_MCP_URL=${AGENTZERO_MCP_URL:-http://agent-zero:8080/mcp/command}
    - DRY_RUN=${GITHUB_AUTOMATION_DRY_RUN:-true}
    - GITHUB_ORG=${GITHUB_ORG:-POWERFULMOVES}
    - AUTO_MERGE_REPOS=${AUTO_MERGE_REPOS:-}
    - PMOVES_NETWORKS=pmoves_app,pmoves_api,pmoves_bus,pmoves_monitoring,pmoves_external
    ports:
    - ${GITHUB_AUTOMATION_BIND:-0.0.0.0}:8114:8104
    profiles:
    - github-automation
    networks:
    - pmoves_app
    - pmoves_api
    - pmoves_bus
    - pmoves_monitoring
    - pmoves_external  # GitHub API for PR management
    depends_on:
      nats:
        condition: service_healthy
      agent-zero:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
volumes:
  neo4j-data: {}
  archon-data: {}          # Archon /.archon workspaces + SQLite/state (#2217)
  archon-user-home: {}     # Archon /home/appuser (Claude/gh creds, git config)
  archon-pg-data: {}       # Archon dedicated Postgres data (pg_notify realtime)
  cipher-data: {}
  qdrant-data: {}
  meilisearch-data: {}
  minio-data: {}
  juicefs-meta: {}   # JuiceFS metadata engine (Redis) persistence (profile: juicefs)
  juicefs-data: {}   # JuiceFS object-store backend (profile: juicefs)
  # Legacy volume (kept for backward compatibility during migration)
  supabase-data: {}
  # 2025 Supabase integrated volumes
  supabase-db-data: {}
  supabase-db-config: {}
  supabase-storage-data: {}
  supabase-vector-data: {}
  notebook-sync-data: {}
  tensorzero-clickhouse-data: {}
  invidious-postgres-data: {}
  invidious-companion-cache: {}
  pmoves-ollama-models: {}
  hi-rag-gpu-hf-cache: {}  # HuggingFace model cache for Qwen3-Reranker-4B (persists across restarts)
  comfy-watcher-output: {}
  comfy-watcher-state: {}
  llama-results: {}
  # Wger fitness tracker volumes
  wger-db: {}
  wger-static: {}
  wger-media: {}
  wger-prometheus: {}
  pmoves-yt-data: {}
networks:
  pmoves_data:
    name: pmoves_data
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
      - subnet: 172.30.4.0/24
        gateway: 172.30.4.1
  # Non-internal bridge for services that expose host-facing ports.
  # Kong proxy/admin and PostgREST REST port attach here; the services still
  # default to 127.0.0.1 host binds for safer standalone operation.
  pmoves_public:
    name: pmoves_public
    driver: bridge
    internal: false
    ipam:
      driver: default
      config:
      - subnet: 172.30.7.0/24
        gateway: 172.30.7.1
  pmoves_api:
    name: pmoves_api
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
      - subnet: 172.30.1.0/24
        gateway: 172.30.1.1
  pmoves_app:
    name: pmoves_app
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
      - subnet: 172.30.2.0/24
        gateway: 172.30.2.1
  pmoves_bus:
    name: pmoves_bus
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
      - subnet: 172.30.3.0/24
        gateway: 172.30.3.1
  pmoves_monitoring:
    name: pmoves_monitoring
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
      - subnet: 172.30.5.0/24
        gateway: 172.30.5.1
  # NOTE: supabase_net no longer needed - Supabase services now use internal pmoves_data/pmoves_api networks
  # pmoves and cataclysm kept for external service compatibility
  pmoves:
    external: true
    name: pmoves-net
  cataclysm:
    external: true
    name: cataclysm-net
  # External network for services requiring internet access (YouTube API, LLM providers, etc.).
  # Declared external because it is SHARED across stacks (the overlay/NATS stack multi-homes
  # nats here too) — a compose-managed network can't be adopted by a second stack (the other
  # stack sees an unlabeled "foreign" net → "incorrect label" error). Created out-of-band by
  # clean_networks.py (make-target paths) or an inline guard (raw CI deploy paths).
  pmoves_external:
    external: true
    name: pmoves_external
