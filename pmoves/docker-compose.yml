      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8093/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  pmoves-ollama:
    <<: *tier-llm-hardened
    image: ${PMOVES_OLLAMA_IMAGE:-ollama/ollama:0.12.6@sha256:ea37dcbf693248c80796654500fccf1e12f55da20ec7c78c30870a9a227c4cdd}
    restart: unless-stopped
    environment:
    - OLLAMA_HOST=0.0.0.0:11434
    - OLLAMA_MODELS=/root/.ollama/models
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    volumes:
    - pmoves-ollama-models:/root/.ollama/models
    # Prevent transient Docker embedded-DNS failures from blocking model pull.
    dns:
    - ${OLLAMA_DNS_PRIMARY:-1.1.1.1}
    - ${OLLAMA_DNS_SECONDARY:-8.8.8.8}
    networks:
    - pmoves_api
    - pmoves_external
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  tensorzero-clickhouse:
    <<: *tier-llm-hardened
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    environment:
    - CLICKHOUSE_USER=tensorzero
    - CLICKHOUSE_PASSWORD=tensorzero
    - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    ports:
    - ${TENSORZERO_CLICKHOUSE_PORT:-8123}:8123
    volumes:
    - tensorzero-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
      - CMD-SHELL
      - wget --spider --tries 1 http://$${CLICKHOUSE_USER:-default}:$${CLICKHOUSE_PASSWORD:-}@$${HOSTNAME:-localhost}:8123/ping
      start_period: 30s
      interval: 5s
      timeout: 2s
      retries: 5
    networks:
    - pmoves_data
  tensorzero-gateway:
    <<: *tier-llm-hardened
    # Pinned 2025-02-04: Latest stable from TensorZero
    image: tensorzero/gateway:2026.1.8
    restart: unless-stopped
    command:
    - --config-file
    - /app/config/tensorzero.toml
    environment:
    - TENSORZERO_CLICKHOUSE_URL=${TENSORZERO_CLICKHOUSE_GATEWAY_URL:-${TENSORZERO_CLICKHOUSE_URL:-http://tensorzero:tensorzero@tensorzero-clickhouse:8123/default}}
    # Keep gateway bootable in local-first mode when cloud provider keys are absent.
    - OPENAI_API_KEY=${OPENAI_API_KEY:-local-disabled}
    - GROQ_API_KEY=${GROQ_API_KEY:-local-disabled}
    - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-local-disabled}
    - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-local-disabled}
    - VENICE_API_KEY=${VENICE_API_KEY:-local-disabled}
    - Z_AI_API_KEY=${Z_AI_API_KEY:-local-disabled}
    - ALIBABA_PRO_CODING_PLAN=${ALIBABA_PRO_CODING_PLAN:-local-disabled}
    - TOGETHER_AI_API_KEY=${TOGETHER_AI_API_KEY:-local-disabled}
    - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-local-disabled}
    - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://host.docker.internal:4317}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    volumes:
    - ./tensorzero/config:/app/config:ro
    depends_on:
      tensorzero-clickhouse:
        condition: service_healthy
    ports:
    - ${TENSORZERO_PORT:-3030}:3000
    networks:
    - pmoves_api
    - pmoves_bus
    - pmoves_data
    - pmoves_external
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || curl -fsS http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
  tensorzero-ui:
    <<: *tier-llm-hardened
    # Pinned 2025-02-04: Latest stable from TensorZero (matches gateway version)
    image: tensorzero/ui:2026.1.8
    restart: unless-stopped
    environment:
    - TENSORZERO_GATEWAY_URL=${TENSORZERO_GATEWAY_URL:-http://tensorzero-gateway:3000}
    - TENSORZERO_CLICKHOUSE_URL=${TENSORZERO_CLICKHOUSE_GATEWAY_URL:-${TENSORZERO_CLICKHOUSE_URL:-http://tensorzero:tensorzero@tensorzero-clickhouse:8123/default}}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    volumes:
    - ./tensorzero/config:/app/config:ro
    depends_on:
      tensorzero-clickhouse:
        condition: service_healthy
      tensorzero-gateway:
        condition: service_started
    ports:
    - ${TENSORZERO_UI_PORT:-4000}:4000
    profiles:
    - tensorzero
    networks:
    - pmoves_app
    - pmoves_data
    - pmoves_external
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ >/dev/null 2>&1 || curl -fsS http://localhost:4000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  gpu-orchestrator:
    env_file:
    - env.shared
    - env.tier-llm
    - env.tier-api
    build:
      context: ./services/gpu-orchestrator
      dockerfile: Dockerfile
    image: ${GPU_ORCHESTRATOR_IMAGE:-ghcr.io/powerfulmoves/pmoves-gpu-orchestrator:latest@sha256:cbfbcbfa779ad83b720c1fa1527e0258d192f5d01c6d26d62aa247d501f8693a}
    restart: unless-stopped
    environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - GPU_MODELS_CONFIG=/config/gpu-models.yaml
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://pmoves-ollama:11434}
    - VLLM_BASE_URL=${VLLM_BASE_URL:-http://pmoves-vllm:8000}
    - TTS_BASE_URL=${TTS_BASE_URL:-http://ultimate-tts-studio:7861}
    - GPU_ORCHESTRATOR_MAX_MODELS=${GPU_ORCHESTRATOR_MAX_MODELS:-3}
    - GPU_ORCHESTRATOR_VRAM_THRESHOLD=${GPU_ORCHESTRATOR_VRAM_THRESHOLD:-0.9}
    - NATS_URL=${NATS_URL:-nats://nats:pmoves@nats:4222}
    - MODEL_REGISTRY_URL=${MODEL_REGISTRY_URL:-http://model-registry:8110}
    volumes:
      # SECURITY: Docker socket required for spawning GPU model containers.
      # Mounted read-only with hardened security context (no-new-privileges, cap_drop).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/gpu-models.yaml:/config/gpu-models.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles:
    - gpu
    networks:
    - pmoves_api
    - pmoves_bus
    - pmoves_monitoring
    ports:
    - ${GPU_ORCHESTRATOR_HOST_PORT:-8200}:8200
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      nats:
        condition: service_healthy
        required: false
      model-registry:
        condition: service_healthy
        required: false
  evo-controller:
    <<: *tier-agent-hardened-ro
    build:
      context: .
      dockerfile: services/evo-controller/Dockerfile
    image: ${EVO_CONTROLLER_IMAGE:-ghcr.io/powerfulmoves/pmoves-evo-controller:latest}
    restart: unless-stopped
    environment:
    # NATS_URL from env.tier-agent has credentials: nats://nats:pmoves@nats:4222
      - PORT=8113
      - SUPA_REST_URL=${SUPA_REST_INTERNAL_URL:-${SUPA_REST_URL:-http://supabase-kong:8000/rest/v1}}
      - EVOSWARM_POLL_SECONDS=${EVOSWARM_POLL_SECONDS:-300}
      - EVOSWARM_SAMPLE_LIMIT=${EVOSWARM_SAMPLE_LIMIT:-25}
      - EVOSWARM_NAMESPACE=${EVOSWARM_NAMESPACE:-}
      - NATS_URL=${NATS_URL:-nats://nats:pmoves@nats:4222}
      - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
      - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
      - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    ports: ["8113:8113"]
    profiles: ["orchestration"]
    networks: [pmoves_app, pmoves_api, pmoves_bus]
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8113/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Ultimate TTS Studio - Multi-engine TTS with 7 engines (Gradio UI)
  ultimate-tts-studio:
    build:
      context: ./docker/ultimate-tts-studio
      dockerfile: Dockerfile
    image: ${ULTIMATE_TTS_IMAGE:-ghcr.io/powerfulmoves/pmoves-ultimate-tts-studio:pmoves-latest}
    restart: unless-stopped
    <<: *tier-media-hardened
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7861
      - GRADIO_MCP_SERVER=true
      # WSL2/CUDA compatibility settings
      - CUDA_FORCE_PTX_JIT=1
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - TORCH_CUDA_ARCH_LIST=5.0;5.2;6.0;6.1;7.0;7.5;8.0;8.6;9.0
      - TORCH_CUDNN_V8_API_ENABLED=1
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    ports: ["7861:7861"]
    profiles: ["gpu", "tts"]
    networks: [pmoves_app, pmoves_monitoring]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7861/gradio_api/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Flute Gateway - Multimodal voice communication layer (TTS/STT)
  flute-gateway:
    <<: *tier-media-hardened
    build:
      context: .
      dockerfile: services/flute-gateway/Dockerfile
    image: ${FLUTE_GATEWAY_IMAGE:-ghcr.io/powerfulmoves/pmoves-flute-gateway:latest}
    restart: unless-stopped
    environment:
    # NATS_URL from env.shared/env.tier-media has credentials: nats://nats:pmoves@nats:4222
      - PORT=8055
      - NATS_URL=${NATS_URL:-nats://nats:pmoves@nats:4222}
      - SUPABASE_URL=${SUPABASE_INTERNAL_URL:-${SUPABASE_URL:-http://supabase-kong:8000}}
      - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
      - DEFAULT_VOICE_PROVIDER=${DEFAULT_VOICE_PROVIDER:-vibevoice}
      - FLUTE_API_KEY=${FLUTE_API_KEY:-}
      - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
      - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
      - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    ports: ["8055:8055", "8056:8056"]
    profiles: ["orchestration", "media"]
    networks: [pmoves_app, pmoves_api, pmoves_bus]
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8055/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Tier: agent (Tokenism Simulator - CHIT/geometry bus simulation service)
  tokenism-simulator:
    build:
      context: ./services/tokenism-simulator
      dockerfile: Dockerfile
    image: ${TOKENISM_IMAGE:-ghcr.io/powerfulmoves/pmoves-tokenism:pmoves-latest}
    restart: unless-stopped
    <<: *tier-agent-hardened-ro
    environment:
    # NATS_URL from env.shared/env.tier-agent has credentials: nats://nats:pmoves@nats:4222
      - TOKENISM_HOST=${TOKENISM_HOST:-0.0.0.0}
      - TOKENISM_PORT=${TOKENISM_PORT:-8100}
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:-pmoves-tokenism-secret}
      - NATS_URL=${NATS_URL:-nats://nats:pmoves@nats:4222}
      - NATS_CLIENT_NAME=tokenism-simulator
      - NATS_JETSTREAM=${NATS_JETSTREAM:-true}
      - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
      - TENSORZERO_MODEL=${TENSORZERO_MODEL:-claude-sonnet-4-5}
      - SUPABASE_URL=${SUPABASE_URL:-http://supabase-kong:8000}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - AGENTZERO_URL=${AGENTZERO_URL:-http://agent-zero:8080}
      - AGENTZERO_MCP_ENABLED=${AGENTZERO_MCP_ENABLED:-true}
      - CHIT_ENABLED=${CHIT_ENABLED:-true}
      - GEOMETRY_BUS_URL=${GEOMETRY_BUS_URL:-nats://nats:pmoves@nats:4222}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports: ["${TOKENISM_HOST_PORT:-8103}:8100"]
    profiles: ["agents", "orchestration", "botz"]
    depends_on: [nats]
    networks: [pmoves_app, pmoves_api, pmoves_bus, pmoves_monitoring]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PMOVES Tokenism UI - Interactive dashboard for token economy simulation
  tokenism-ui:
    build:
      context: ./PMOVES-ToKenism-Multi/pmoves-nextjs
      dockerfile: Dockerfile
    image: ${TOKENISM_UI_IMAGE:-ghcr.io/powerfulmoves/pmoves-tokenism-ui:pmoves-latest}
    restart: unless-stopped
    <<: *tier-ui-hardened
    environment:
      - NEXT_PUBLIC_TOKENISM_URL=${TOKENISM_UI_API_URL:-http://tokenism-simulator:8100}
      - NODE_ENV=production
      - PORT=8504
    ports: ["${TOKENISM_UI_HOST_PORT:-8504}:8504"]
    profiles: ["agents", "botz"]
    networks: [pmoves_app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8504/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PMOVES Central UI - Main dashboard (port 4482)
  pmoves-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [ env.shared.generated, env.shared, env.tier-ui, .env.generated, .env.local ]
    environment:
      - NODE_ENV=production
      # Supabase
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:8000}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-${ANON_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}}
      - NEXT_PUBLIC_SUPABASE_REST_URL=${NEXT_PUBLIC_SUPABASE_REST_URL:-http://localhost:8000/rest/v1}
      # Voice/TTS
      - NEXT_PUBLIC_FLUTE_GATEWAY_URL=${NEXT_PUBLIC_FLUTE_GATEWAY_URL:-http://localhost:8055}
      - NEXT_PUBLIC_FLUTE_WS_URL=${NEXT_PUBLIC_FLUTE_WS_URL:-ws://localhost:8056}
      # Agent Services (client-side needs localhost)
      - NEXT_PUBLIC_AGENT_ZERO_URL=${NEXT_PUBLIC_AGENT_ZERO_URL:-http://localhost:8080}
      - NEXT_PUBLIC_AGENT_ZERO_UI_URL=${NEXT_PUBLIC_AGENT_ZERO_UI_URL:-http://localhost:8081}
      - NEXT_PUBLIC_ARCHON_URL=${NEXT_PUBLIC_ARCHON_URL:-http://localhost:8091}
      - NEXT_PUBLIC_ARCHON_UI_URL=${NEXT_PUBLIC_ARCHON_UI_URL:-http://localhost:3737}
      # Knowledge & Search
      - NEXT_PUBLIC_HIRAG_URL=${NEXT_PUBLIC_HIRAG_URL:-http://localhost:8086}
      - NEXT_PUBLIC_OPEN_NOTEBOOK_API_URL=${NEXT_PUBLIC_OPEN_NOTEBOOK_API_URL:-http://localhost:5055}
      - NEXT_PUBLIC_TENSORZERO_UI_URL=${NEXT_PUBLIC_TENSORZERO_UI_URL:-http://localhost:4000}
      # Media & Ingestion
      - NEXT_PUBLIC_PRESIGN_URL=${NEXT_PUBLIC_PRESIGN_URL:-http://localhost:8088}
      - NEXT_PUBLIC_PMOVES_YT_BASE_URL=${NEXT_PUBLIC_PMOVES_YT_BASE_URL:-http://localhost:8077}
      - NEXT_PUBLIC_CHANNEL_MONITOR_STATS_URL=${NEXT_PUBLIC_CHANNEL_MONITOR_STATS_URL:-http://localhost:8097/api/monitor/stats}
      # Token Economy Simulation
      - NEXT_PUBLIC_TOKENISM_URL=${NEXT_PUBLIC_TOKENISM_URL:-http://localhost:8103}
      # Monitoring Stack
      - NEXT_PUBLIC_GRAFANA_URL=${NEXT_PUBLIC_GRAFANA_URL:-http://localhost:3002}
      - NEXT_PUBLIC_PROMETHEUS_URL=${NEXT_PUBLIC_PROMETHEUS_URL:-http://localhost:9090}
      - NEXT_PUBLIC_LOKI_URL=${NEXT_PUBLIC_LOKI_URL:-http://localhost:3100}
      # Server-side health checks: rewrite localhost → host.docker.internal
      - HEALTH_CHECK_HOST=host.docker.internal
      # Server-side only (Docker hostnames OK)
      - POSTGREST_URL=${POSTGREST_URL:-http://supabase-kong:8000/rest/v1}
      - PRESIGN_SHARED_SECRET=${PRESIGN_SHARED_SECRET}
      - RENDER_WEBHOOK_URL=${RENDER_WEBHOOK_URL:-http://render-webhook:8085/comfy/webhook}
      - OPEN_NOTEBOOK_API_URL=${OPEN_NOTEBOOK_API_URL:-http://open-notebook:5055}
      - TOKENISM_URL=${TOKENISM_URL:-http://pmoves-tokenism-simulator-1:8100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4482:3000"
