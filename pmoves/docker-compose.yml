  minio:
    <<: *tier-data-hardened
    # Pin = the LAST community RELEASE tag MinIO published to Docker Hub
    # (RELEASE.2025-09-07T16-13-09Z, 2025-09-07). The prior pin
    # RELEASE.2025-12-20T04-58-37Z was a phantom — a December date AFTER MinIO
    # stopped publishing minio/minio community images, so it 404s on the registry
    # ("not found") and broke every data-tier bring-up. Verified 2026-06-22:
    # 2025-09-07 is the newest tag on hub.docker.com/r/minio/minio.
    # ⚠️ MinIO Community Edition is EOL/archived (Feb 2026); this tag is the
    # ceiling. Migration to SeaweedFS/Garage/Enterprise is the durable fix.
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    # Only data-tier service without a restart policy — every Docker Desktop
    # restart left MinIO dead (Exited 255) until manually started, which is
    # how it sat down for 9 days and silently blocked the YT pipeline.
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
    - MINIO_ROOT_USER=${MINIO_USER:?Run make brand-defaults}
    - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:?Run make brand-defaults}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_data,pmoves_bus,pmoves_external
    ports:
    - ${MINIO_BIND:-0.0.0.0}:${MINIO_PORT:-9000}:9000
    - ${MINIO_CONSOLE_BIND:-0.0.0.0}:${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
    # MINIO_DATA_DIR lets the object store live off C: (which fills up) — set it to
    # a host path (e.g. D:/pmoves-storage/minio, fast NVMe) for the content studio;
    # defaults to the named volume for portability. Media/bulk goes to I: separately.
    - ${MINIO_DATA_DIR:-minio-data}:/data
    networks:
    - pmoves_data
    - pmoves_bus
    # pmoves_external gives MinIO host connectivity so its ports: mapping actually
    # publishes (internal-only nets silently drop it) — required for multi-node
    # JuiceFS: remote nodes reach the object store via MINIO_BIND (z890 tailnet IP).
    - pmoves_external
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ── JuiceFS object store (PoC) — durable replacement for EOL MinIO ───────────
  # See docs/architecture/JUICEFS_OBJECT_STORE_MIGRATION.md. PROFILE-GATED ("juicefs")
  # so it is purely additive — it does NOT start with the default data tier and does
  # not touch existing MinIO consumers yet (consumer repoint = Phase 2).
  # ⚠️ DRAFT / not yet live-verified (deploy-env drift blocks a live run on Z890 —
  # see handoff z890-deploy-spine-mcp-env-2026-06-22.md). Validate on first run:
  #   (a) `juicefs` CLI entrypoint in juicedata/mount:ce-v1.3.0,
  #   (b) `juicefs format`/`gateway` flag syntax + cache dir,
  #   (c) --multi-buckets exposes assets/outputs/pmoves-comfyui,
  #   (d) the gateway's S3 creds (MINIO_ROOT_USER/PASSWORD env) match consumers.
  juicefs-redis:  # metadata engine
    <<: *tier-data-hardened
    image: redis:7.4.1-alpine
    profiles: ["juicefs"]
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
    - juicefs-meta:/data
    networks:
    - pmoves_data
    - pmoves_external
    # Multi-node JuiceFS: expose the metadata engine on the TAILNET only
    # (JUICEFS_META_BIND = z890 tailnet IP, set inline; defaults to loopback so
    # a plain up doesn't accidentally expose redis on all interfaces).
    ports:
    - ${JUICEFS_META_BIND:-127.0.0.1}:6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

    environment:
    - PMOVES_NETWORKS=pmoves_data,pmoves_external
  juicefs-format:  # one-time FS format (idempotent); gateway waits on this
    <<: *tier-data-hardened
    image: juicedata/mount:ce-v1.3.0
    profiles: ["juicefs"]
    restart: "no"
    depends_on:
      juicefs-redis:
        condition: service_healthy
    entrypoint: ["sh", "-lc"]
    command:
    # No `|| true`: juicefs format is idempotent (re-run on a formatted FS exits 0),
    # so a non-zero exit here is a REAL error and must fail the service_completed_successfully
    # gate rather than releasing the gateway against an unformatted volume.
    # Network-backed multi-node: blocks live in MinIO (reachable by every node
    # over the tailnet), not z890-local files. JUICEFS_S3_ENDPOINT = the tailnet-
    # reachable MinIO endpoint (z890 tailnet IP:9000) so the URL recorded in
    # metadata resolves from remote nodes too; falls back to internal minio:9000
    # for single-node. Creds embed into metadata at format time.
    - "juicefs format --storage minio --bucket http://${JUICEFS_S3_ENDPOINT:-minio:9000}/${JUICEFS_BUCKET:-juicefs} --access-key ${JUICEFS_S3_USER:-${MINIO_USER}} --secret-key ${JUICEFS_S3_PASSWORD:-${MINIO_PASSWORD}} ${JUICEFS_META_URL:-redis://juicefs-redis:6379/1} ${JUICEFS_NAME:-pmoves}"
    volumes:
    - juicefs-data:/data
    networks:
    - pmoves_data
    - pmoves_external

    environment:
    - PMOVES_NETWORKS=pmoves_data,pmoves_external
  juicefs-gateway:  # S3-compatible drop-in for minio:9000 (--multi-buckets required on CE)
    <<: *tier-data-hardened
    image: juicedata/mount:ce-v1.3.0
    profiles: ["juicefs"]
    restart: unless-stopped
    depends_on:
      juicefs-redis:
        condition: service_healthy
      juicefs-format:
        condition: service_completed_successfully
    environment:
    # juicefs gateway uses the MinIO gateway code: these are the S3 access/secret keys.
    - MINIO_ROOT_USER=${JUICEFS_S3_USER:-${MINIO_USER:?Run make brand-defaults}}
    - MINIO_ROOT_PASSWORD=${JUICEFS_S3_PASSWORD:-${MINIO_PASSWORD:?Run make brand-defaults}}
    - PMOVES_NETWORKS=pmoves_data
    entrypoint: ["sh", "-lc"]
    command:
    - "juicefs gateway --multi-buckets --keep-etag ${JUICEFS_META_URL:-redis://juicefs-redis:6379/1} 0.0.0.0:9000"
    volumes:
    - juicefs-data:/data
    networks:
    - pmoves_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  juicefs-smoke:  # one-off S3 round-trip + multi-bucket test (profile juicefs-smoke; never auto-starts)
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: ["juicefs-smoke"]
    depends_on:
      juicefs-gateway:
        condition: service_healthy
    environment:
    # Same credential chain as juicefs-gateway (no baked-in secret) so smoke auth always matches.
    - MC_HOST_jfs=http://${JUICEFS_S3_USER:-${MINIO_USER:?Run make brand-defaults}}:${JUICEFS_S3_PASSWORD:-${MINIO_PASSWORD:?Run make brand-defaults}}@juicefs-gateway:9000
    - PMOVES_NETWORKS=pmoves_data
    entrypoint: ["sh", "-lc"]
    command:
    - "set -e; mc mb -p jfs/assets jfs/outputs; printf 'hello-juicefs-2026' | mc pipe jfs/assets/smoke.txt; echo '--- GET ---'; mc cat jfs/assets/smoke.txt; echo; echo '--- multi-bucket list (assets+outputs => --multi-buckets works) ---'; mc ls jfs/"
