  # ---------------------------------------------------------------------------
  # Supabase Edge Runtime — Deno edge functions
  # ---------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  supabase-edge-functions:
    <<: *tier-supabase-hardened
    image: supabase/edge-runtime:v1.74.0
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in env.tier-supabase}
    - SUPABASE_URL=http://supabase-kong:8000
    - SUPABASE_ANON_KEY=${ANON_KEY:?Set ANON_KEY in env.tier-supabase}
    - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY in env.tier-supabase}
    - SUPABASE_DB_URL=postgresql://${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}:${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}@supabase-db:5432/${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    - VERIFY_JWT=${FUNCTIONS_VERIFY_JWT:-true}
    - PMOVES_NETWORKS=pmoves_api,pmoves_public
    command: ["start", "--main-service", "/home/deno/functions/main"]
    volumes:
    - ../PMOVES-supabase/docker/volumes/functions:/home/deno/functions:ro
    healthcheck:
      # The edge-runtime image ships NO curl/wget, and /health answers 401 under
      # VERIFY_JWT=true — an HTTP-status probe can never pass here. bash IS in the
      # image, so prove liveness with a /dev/tcp connect to the serving port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      supabase-analytics:
        condition: service_healthy
    networks:
    - pmoves_api  # supabase-db and analytics reachable via kong on pmoves_api
    # pmoves_public is required, not optional: pmoves_api is internal:true,
    # so edge-runtime cannot reach external Deno imports unless it also joins
    # the egress-capable bridge. DNS pins alone do not create an egress route.
    - pmoves_public
    # Pin upstream resolvers for Deno cold-boot imports. The edge-runtime
    # image fetches https://deno.land/std@...` at worker-bootstrap time;
    # Docker's embedded DNS (127.0.0.11) intermittently fails to forward
    # external queries on Docker Desktop Windows, leaving the worker stuck
    # in `failed to lookup address information: Temporary failure in name
    # resolution`. Explicit resolvers avoid the flap.
    dns:
    - 1.1.1.1
    - 8.8.8.8

  # ---------------------------------------------------------------------------
  # Supabase Analytics (Logflare) — log analytics backend
  # ---------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  supabase-analytics:
    <<: *tier-supabase-hardened
