    <<: *tier-llm-hardened
    # 0.31.2: minimum runtime for the qwen3.5 MoE family (Gated DeltaNet hybrid
    # layout) — 0.18.0 refuses the manifest with 412 "requires a newer version".
    image: ${PMOVES_OLLAMA_IMAGE:-ollama/ollama:0.31.2@sha256:509fdf54e23bd50d87af646cb51c0a7a203d6a83cc4d6695b3b08c5be1c62c0a}
    restart: unless-stopped
    environment:
    - OLLAMA_HOST=0.0.0.0:11434
    - OLLAMA_MODELS=/root/.ollama/models
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_api,pmoves_external
    volumes:
    - pmoves-ollama-models:/root/.ollama/models
    # Prevent transient Docker embedded-DNS failures from blocking model pull.
    dns:
    - ${OLLAMA_DNS_PRIMARY:-1.1.1.1}
    - ${OLLAMA_DNS_SECONDARY:-8.8.8.8}
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
        limits:
          cpus: '4.0'
          memory: 8G
    ports:
    - ${OLLAMA_BIND:-0.0.0.0}:${OLLAMA_HOST_PORT:-11435}:11434
    networks:
    - pmoves_api
    - pmoves_external
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
