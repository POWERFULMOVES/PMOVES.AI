    - MEILI_URL=${MEILI_URL:-http://meilisearch:7700}
    - GRAPH_BOOST=${GRAPH_BOOST:-0.15}
    - ENTITY_CACHE_TTL=${ENTITY_CACHE_TTL:-60}
    - ENTITY_CACHE_MAX=${ENTITY_CACHE_MAX:-1000}
    - NEO4J_DICT_REFRESH_SEC=${NEO4J_DICT_REFRESH_SEC:-60}
    - NEO4J_DICT_LIMIT=${NEO4J_DICT_LIMIT:-50000}
    - CHIT_DECODE_TEXT=${CHIT_DECODE_TEXT:-true}
    - CHIT_DECODE_IMAGE=${CHIT_DECODE_IMAGE:-true}
    - CHIT_DECODE_AUDIO=${CHIT_DECODE_AUDIO:-true}
    - CHIT_PERSIST_DB=${CHIT_PERSIST_DB:-false}
    - PGHOST=${PGHOST:-postgres}
    - PGPORT=${PGPORT:-5432}
    - PGUSER=${POSTGRES_USER:-pmoves}
    - PGPASSWORD=${POSTGRES_PASSWORD:-pmoves}
    - PGDATABASE=${POSTGRES_DB:-pmoves}
    - SUPA_REST_URL=${SUPA_REST_URL:-http://supabase-kong:8000/rest/v1}
    - SUPABASE_REALTIME_URL=${SUPABASE_REALTIME_URL:-ws://supabase-realtime:4000}
    - OLLAMA_URL=${OLLAMA_URL:-http://pmoves-ollama:11434}
    - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-embeddinggemma:300m}
    - TENSORZERO_BASE_URL=${TENSORZERO_BASE_URL:-http://tensorzero-gateway:3000}
    - TENSORZERO_API_KEY=${TENSORZERO_API_KEY:-}
    - TENSORZERO_EMBED_MODEL=${TENSORZERO_EMBED_MODEL:-tensorzero::embedding_model_name::gemma_embed_local}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            count: ${GPU_COUNT:-all}
    ports:
    - ${HIRAG_V2_GPU_HOST_PORT:-8087}:8086
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
      neo4j:
        condition: service_healthy
        required: false
    networks:
    - pmoves_api
    - pmoves_data
    - pmoves_bus
    - pmoves_external  # Required for hub fallback and host-gateway Supabase routes
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/hirag/admin/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
  # ── NATS Message Bus — JetStream-enabled event broker ──────────────────
  # Auth: nats://nats:pmoves@nats:4222 | Monitoring: :8222/varz
  # See: pmoves/docs/NATS_CONFIGURATION.md
  nats:
    <<: *tier-data-hardened
    # Pinned 2025-02-04: Latest stable 2.11.x alpine version
    image: nats:2.11.8-alpine
    command:
    - -js
    - -m
    - '8222'
    - --user
    - ${NATS_USER:-nats}
    - --pass
    - ${NATS_PASSWORD:-pmoves}
    restart: unless-stopped
    ports:
    - ${NATS_PORT:-4222}:4222
    - ${NATS_MONITORING_PORT:-9223}:8222
    networks:
    - pmoves_bus
    environment:
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:8222/varz || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  nats-init:
    image: natsio/nats-box:0.14.5
    entrypoint: ["/bin/sh", "/scripts/init_streams.sh"]
    environment:
    - NATS_URL=${NATS_URL:-nats://nats:pmoves@nats:4222}
    volumes:
    - ./scripts/nats:/scripts:ro
    networks:
    - pmoves_bus
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"
    cap_drop: ["ALL"]
    read_only: true
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=16m,noexec,nosuid
  agent-zero:
    <<: *tier-agent-hardened
    build:
      context: .
      dockerfile: ./services/agent-zero/Dockerfile
    restart: unless-stopped
    environment:
    - PORT=8080
    # NATS_URL from env.tier-agent has credentials: nats://nats:pmoves@nats:4222
    - AGENT_ZERO_API_BASE=${AGENT_ZERO_API_BASE:-http://127.0.0.1:80}
    - AGENT_ZERO_HEALTH_PATH=${AGENT_ZERO_HEALTH_PATH:-/healthz}
    - AGENT_ZERO_HEALTH_PATH_FALLBACK=${AGENT_ZERO_HEALTH_PATH_FALLBACK:-/health}
    - AGENT_ZERO_CAPTURE_OUTPUT=${AGENT_ZERO_CAPTURE_OUTPUT:-true}
    - AGENT_ZERO_EXTRA_ARGS=${AGENT_ZERO_EXTRA_ARGS:---port=80 --host=0.0.0.0}
    - PYTHONPATH=${AGENT_ZERO_PYTHONPATH:-/app:/app/services}
    - AGENTZERO_JETSTREAM=${AGENTZERO_JETSTREAM:-true}
    - AGENTZERO_JS_UNAVAILABLE_THRESHOLD=${AGENTZERO_JS_UNAVAILABLE_THRESHOLD:-1}
    - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # LLM routing: use TensorZero gateway as OpenAI-compatible provider
    # Agent Zero's get_default_value() reads A0_SET_* from env (dotenv priority)
    - A0_SET_chat_model_provider=openai
    - A0_SET_chat_model_name=agent_zero
    - A0_SET_chat_model_api_base=http://tensorzero-gateway:3000/openai/v1
    - A0_SET_util_model_provider=openai
    - A0_SET_util_model_name=langextract
    - A0_SET_util_model_api_base=http://tensorzero-gateway:3000/openai/v1
    - A0_SET_embed_model_provider=openai
    - A0_SET_embed_model_name=gemma_embed_local
    - A0_SET_embed_model_api_base=http://tensorzero-gateway:3000/openai/v1
    - A0_SET_browser_model_provider=openai
    - A0_SET_browser_model_name=agent_zero
    - A0_SET_browser_model_api_base=http://tensorzero-gateway:3000/openai/v1
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      tensorzero-gateway:
        condition: service_healthy
    ports:
    - ${AGENT_ZERO_PORT:-8080}:8080
    - ${AGENT_ZERO_PORT:-8081}:80
    volumes:
    - ${AGENT_ZERO_MEMORY_DIR:-./data/agent-zero/memory}:/a0/memory
    - ${AGENT_ZERO_KNOWLEDGE_DIR:-./data/agent-zero/knowledge}:/a0/knowledge
    - ${AGENT_ZERO_INSTRUMENTS_DIR:-./data/agent-zero/instruments}:/a0/instruments
    - ${AGENT_ZERO_LOG_DIR:-./data/agent-zero/logs}:/a0/logs
    - ${AGENT_ZERO_RUNTIME_DIR:-./data/agent-zero/runtime}:/a0/runtime
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:80/ >/dev/null || curl -fsS http://localhost:8080/healthz >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_external  # Required for LLM provider APIs
  archon:
    <<: *tier-agent-hardened
    build:
      context: .
      dockerfile: ./services/archon/Dockerfile
      args:
      - ARCHON_GIT_REMOTE=${ARCHON_GIT_REMOTE:-https://github.com/POWERFULMOVES/PMOVES-Archon.git}
      - ARCHON_GIT_REF=${ARCHON_GIT_REF:-main}
    restart: unless-stopped
    environment:
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY from env.tier-agent
      # NATS_URL from env.tier-agent has credentials: nats://nats:pmoves@nats:4222
      - PORT=8091
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ARCHON_ENV=${ARCHON_ENV:-production}
      - ARCHON_SERVER_PORT=${ARCHON_SERVER_PORT:-8091}
      - ARCHON_SERVER_URL=${ARCHON_SERVER_URL:-http://localhost:8091}
      - ARCHON_MCP_PORT=${ARCHON_MCP_PORT:-8051}
      - ARCHON_AGENTS_PORT=${ARCHON_AGENTS_PORT:-8052}
      - ARCHON_VENDOR_FORCE_PLACEHOLDER=${ARCHON_VENDOR_FORCE_PLACEHOLDER:-0}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ARCHON_ENV=${ARCHON_ENV:-production}
      # Compose-first Archon Supabase wiring. CLI mode can override via
      # ARCHON_SUPABASE_* / SUPABASE_* env values.
      - ARCHON_SUPABASE_BASE_URL=${ARCHON_SUPABASE_BASE_URL:-${ARCHON_SUPABASE_REST_URL:-${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}}}
      - SUPABASE_URL=${ARCHON_SUPABASE_URL:-${SUPABASE_INTERNAL_URL:-http://supabase-kong:8000}}
      - SUPABASE_REST_URL=${ARCHON_SUPABASE_REST_URL:-${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:-}}}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:-}}}}
      - NATS_URL=${NATS_URL:-nats://nats:pmoves@nats:4222}
      - SUPA_REST_URL=${ARCHON_SUPABASE_REST_URL:-${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}}
      # TensorZero routing — _sync_openai_compat_env() in services/archon/main.py
      # reads TENSORZERO_BASE_URL and populates OPENAI_COMPATIBLE_BASE_URL* vars
      - TENSORZERO_BASE_URL=${TENSORZERO_BASE_URL:-http://tensorzero-gateway:3000}
      - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
      # GitHub App credentials — archon MCP cross-repo cloning (planned)
      - GH_APP_ID=${GH_APP_ID:-}
      - GH_APP_SEC=${GH_APP_SEC:-}
      - GH_APP_INSTALLATION_ID=${GH_APP_INSTALLATION_ID:-}
    depends_on:
      nats:
        condition: service_healthy
      tensorzero-gateway:
        condition: service_healthy
    command:
    - python
    - -c
    - import uvicorn; from services.archon.main import app; uvicorn.run(app, host='0.0.0.0',
      port=8091, log_level='info')
    ports:
    - ${ARCHON_PORT:-8091}:8091
    - ${ARCHON_PORT:-8051}:8051
    - ${ARCHON_PORT:-8052}:8052
    networks:
      pmoves_app:
        aliases:
        - archon-server
      pmoves_api:
      pmoves_bus:
      pmoves_external:
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8091/healthz').getcode()==200
        else sys.exit(1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Tier: agent (Cipher Memory - knowledge-graph memory for Claude Code / agents)
  cipher-api:
    <<: *tier-agent-hardened
    build:
      context: ../Pmoves-cipher
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - CIPHER_API_PREFIX=
      - NODE_ENV=production
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j}
      - NATS_URL=${NATS_URL:-nats://nats:pmoves@nats:4222}
      - DOCKED_MODE=${DOCKED_MODE:-true}
      - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
      - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
      - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    command: ["node", "dist/src/app/index.cjs", "--mode", "api", "--port", "3000", "--host", "0.0.0.0", "--agent", "/app/memAgent/cipher.yml", "--mcp-transport-type", "sse"]
    ports:
      - "${CIPHER_PORT:-8096}:3000"
    depends_on:
      neo4j:
        condition: service_healthy
      nats:
        condition: service_healthy
    profiles: ["agents"]
    networks: [pmoves_app, pmoves_data, pmoves_bus]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mesh-agent:
    <<: *tier-agent-hardened-ro
    build: ./services/mesh-agent
    restart: unless-stopped
    environment:
    # NATS_URL from env.shared/env.tier-agent has credentials: nats://nats:pmoves@nats:4222
      - HIRAG_URL=${HIRAG_URL:-http://hi-rag-gateway-v2-gpu:8086}
      - ANNOUNCE_SEC=${ANNOUNCE_SEC:-15}
    depends_on: [nats]
    profiles: ["agents"]
    networks: [pmoves_app, pmoves_bus]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Tier: agent (BoTZ Gateway - Bot management with Geometry BUS integration)
  botz-gateway:
    <<: *tier-agent-hardened-ro
    build: ./services/botz-gateway
    restart: unless-stopped
    environment:
      - NATS_URL=${NATS_URL:-nats://nats:pmoves@nats:4222}
      - SUPABASE_URL=${SUPABASE_URL:-http://supabase-kong:8000}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_KEY}
      - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
      - BOTZ_HEARTBEAT_INTERVAL=${BOTZ_HEARTBEAT_INTERVAL:-30}
      - BOTZ_STALE_THRESHOLD=${BOTZ_STALE_THRESHOLD:-5}
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    ports: ["8054:8054"]
    profiles: ["agents", "botz"]
    networks: [pmoves_app, pmoves_bus, pmoves_api, pmoves_monitoring]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8054/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Tier: agent (A2UI NATS bridge - geometry bus integration)
  a2ui-nats-bridge:
    <<: *tier-agent-hardened-ro
    build: ./services/a2ui-nats-bridge
    image: ${A2UI_BRIDGE_IMAGE:-ghcr.io/powerfulmoves/pmoves-a2ui-nats-bridge:pmoves-latest}
    container_name: pmoves-a2ui-nats-bridge
    hostname: a2ui-nats-bridge
    restart: unless-stopped
    environment:
    - NATS_URL=${NATS_URL:-nats://nats:pmoves@nats:4222}
    # NATS_URL from env.shared/env.tier-agent has credentials: nats://nats:pmoves@nats:4222
    - A2UI_RENDER_SUBJECT=${A2UI_RENDER_SUBJECT:-a2ui.render.v1}
    - GEOMETRY_WILDCARD=${GEOMETRY_WILDCARD:-geometry.>}
    - PORT=9224
    ports:
    - 9224:9224
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    profiles:
    - agents
    networks:
    - pmoves_app
    - pmoves_bus
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9224/healthz',
        timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  deepresearch:
    <<: *tier-agent-hardened-rw
    build:
      context: ./services
      dockerfile: deepresearch/Dockerfile
    image: ${DEEPRESEARCH_IMAGE:-}
    restart: unless-stopped
    environment:
    - NATS_URL=${NATS_URL:-nats://nats:pmoves@nats:4222}
    # NATS_URL from env.tier-agent has credentials: nats://nats:pmoves@nats:4222
    - DEEPRESEARCH_MODE=${DEEPRESEARCH_MODE:-tensorzero}
    - DEEPRESEARCH_TIMEOUT=${DEEPRESEARCH_TIMEOUT:-600}
    - DEEPRESEARCH_TENSORZERO_BASE_URL=${DEEPRESEARCH_TENSORZERO_BASE_URL:-http://tensorzero-gateway:3000}
    - DEEPRESEARCH_API_BASE=${DEEPRESEARCH_API_BASE:-http://deepresearch-local:8080}
    - DEEPRESEARCH_PLANNING_ENDPOINT=${DEEPRESEARCH_PLANNING_ENDPOINT:-/api/research}
    - DEEPRESEARCH_OPENROUTER_MODEL=${DEEPRESEARCH_OPENROUTER_MODEL:-tongyi-deepresearch}
    - DEEPRESEARCH_OPENROUTER_API_BASE=${DEEPRESEARCH_OPENROUTER_API_BASE:-https://openrouter.ai/api}
    - DEEPRESEARCH_NOTEBOOK_EMBED=${DEEPRESEARCH_NOTEBOOK_EMBED:-true}
    - DEEPRESEARCH_NOTEBOOK_ASYNC=${DEEPRESEARCH_NOTEBOOK_ASYNC:-true}
    - OPEN_NOTEBOOK_API_URL=${DEEPRESEARCH_NOTEBOOK_API_URL:-http://open-notebook:5055}
    - DEEPRESEARCH_HEALTH_PORT=${DEEPRESEARCH_HEALTH_PORT:-8098}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
