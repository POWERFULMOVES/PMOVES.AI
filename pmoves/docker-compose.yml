        condition: service_completed_successfully
    ports: ["${BOTZ_BIND:-0.0.0.0}:${BOTZ_PORT:-8054}:8054"]
    profiles: ["agents", "botz"]
    networks: [pmoves_app, pmoves_bus, pmoves_api, pmoves_monitoring, pmoves_external]  # GitHub API
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8054/healthz', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Tier: agent (GitHub Branch Cleanup - automated stale branch removal)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
