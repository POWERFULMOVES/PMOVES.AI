# PMOVES.AI production compose project
name: pmoves

services:
  # =============================================================================
  # SUPABASE SELF-HOSTED STACK (2025 Best Practices)
  # =============================================================================
  # Unified 13-service self-hosted stack (profile: supabase-local)
  # Standard naming: JWT_SECRET, ANON_KEY, SERVICE_ROLE_KEY (SUPABASE_* aliases for compat)
  # JWT: HS256 symmetric
  # =============================================================================

  supabase-db:
    <<: *tier-supabase-hardened
    image: supabase/postgres:17.6.1.079
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - POSTGRES_USER=${SUPABASE_DB_USER:?Set SUPABASE_DB_USER in env.tier-supabase}
    - POSTGRES_PASSWORD=${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in env.tier-supabase}
    - POSTGRES_DB=${SUPABASE_DB_NAME:-postgres}
    - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    # PMOVES extensions
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
    - ${SUPABASE_DB_PORT:-54322}:5432
    volumes:
    - supabase-db-data:/var/lib/postgresql/data
    networks:
    - pmoves_data

  supabase-gotrue:
    <<: *tier-supabase-hardened
    image: supabase/gotrue:v2.186.0
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - GOTRUE_SITE_URL=${SUPABASE_SITE_URL}
    - API_EXTERNAL_URL=${SUPABASE_PUBLIC_URL}
    - GOTRUE_API_HOST=0.0.0.0
    - GOTRUE_API_PORT=9999
    # Database connection
    - GOTRUE_DB_DRIVER=postgres
    - GOTRUE_DB_DATABASE_URL=postgres://${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}}@supabase-db:5432/${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}?sslmode=disable
    # JWT configuration — standard names with legacy fallbacks
    - GOTRUE_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET}}
    - GOTRUE_JWT_ALGORITHM=${SUPABASE_JWT_ALGORITHM:-HS256}
    - GOTRUE_JWT_EXP=${JWT_EXPIRY:-${SUPABASE_JWT_EXP:-3600} }
    # 2025 key naming (service_role_key from PMOVES-supabase standard)
    - GOTRUE_JWT_ADMIN_SECRET=${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY or SUPABASE_SERVICE_ROLE_KEY}}
    - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
    # Logging
    - GOTRUE_LOG_LEVEL=info
    - GOTRUE_LOG_LEVEL_STACK=info
    # URI Allow list (for VPS deployment)
    - GOTRUE_URI_ALLOW_LIST=${SUPABASE_URI_ALLOW_LIST}
    # Optional Google OAuth (self-hosted Supabase auth)
    - GOTRUE_EXTERNAL_GOOGLE_ENABLED=${SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED:-false}
    - GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID=${SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID:-}
    - GOTRUE_EXTERNAL_GOOGLE_SECRET=${SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET:-}
    - GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI=${SUPABASE_AUTH_EXTERNAL_GOOGLE_REDIRECT_URI:-}
    - GOTRUE_EXTERNAL_GOOGLE_SKIP_NONCE_CHECK=${SUPABASE_AUTH_EXTERNAL_GOOGLE_SKIP_NONCE_CHECK:-false}
    # PMOVES context
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
    - ${SUPABASE_GOTRUE_PORT:-9999}:9999
    networks:
    - pmoves_api
    - pmoves_data

  supabase-postgrest:
    <<: *tier-supabase-hardened-ro
    image: postgrest/postgrest:v14.3
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    # Database connection (from env.tier-supabase)
    - PGRST_DB_URI=postgres://${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}}@supabase-db:5432/${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    # JWT secret (must match gotrue) - standard variable name
    - PGRST_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}
    - PGRST_JWT_ALGORITHM=${SUPABASE_JWT_ALGORITHM:-HS256}
    - PGRST_JWT_SECRET_IS_BASE64=false
    # PostgREST v14+ settings
    - PGRST_DB_USE_LEGACY_GUCS=false
    - PGRST_APP_SETTINGS_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}
    - PGRST_APP_SETTINGS_JWT_EXP=${JWT_EXPIRY:-${SUPABASE_JWT_EXP:-3600}}
    # API configuration
    - PGRST_DB_SCHEMAS=${SUPABASE_SCHEMA:-public,pmoves_core}
    - PGRST_ANON_ROLE=${SUPABASE_ANON_ROLE:-anon}
    - PGRST_DB_MAX_ROWS=${SUPABASE_MAX_ROWS:-1000}
    - PGRST_DB_POOL=${SUPABASE_DB_POOL:-15}
    - PGRST_DB_POOL_TIMEOUT=${SUPABASE_POOL_TIMEOUT:-5}
    # PMOVES context
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # Note: No healthcheck - postgrest/postgrest image is distroless without shell tools
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
    - ${SUPABASE_POSTGREST_PORT:-3000}:3000
    networks:
    - pmoves_api
    - pmoves_data

  supabase-kong:
    <<: *tier-supabase-hardened
    image: kong:3.7.1
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    # Database configuration (Kong uses Postgres for config storage)
    - KONG_DATABASE=postgres
    - KONG_PG_HOST=supabase-db
    - KONG_PG_DATABASE=${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    - KONG_PG_USER=${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}
    - KONG_PG_PASSWORD=${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}
    # Kong configuration
    - KONG_PROXY_ACCESS_LOG=/dev/stdout
    - KONG_ADMIN_ACCESS_LOG=/dev/stdout
    - KONG_PROXY_ERROR_LOG=/dev/stderr
    - KONG_ADMIN_ERROR_LOG=/dev/stderr
    - KONG_PROXY_LISTEN=0.0.0.0:8000
    - KONG_ADMIN_LISTEN=0.0.0.0:8001
    # JWT plugin
    - KONG_PLUGINS=bundled,jwt
    - KONG_NGINX_PROXY_PROXY_BUFFERS=8 16k
    # PMOVES context
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    entrypoint: ["/bin/sh", "-c", "kong migrations bootstrap --yes 2>/dev/null || true; exec /docker-entrypoint.sh kong docker-start"]
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
    - ${SUPABASE_KONG_PROXY_PORT:-8000}:8000
    - ${SUPABASE_KONG_ADMIN_PORT:-8001}:8001
    networks:
    - pmoves_api
    - pmoves_data

  supabase-realtime:
    <<: *tier-supabase-hardened
    image: supabase/realtime:v2.72.0
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    # Database connection
    - DB_HOST=supabase-db
    - DB_PORT=5432
    - DB_NAME=${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    - DB_USER=${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}
    - DB_PASSWORD=${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}
    - DB_SSL=false
    - DB_AFTER_CONNECT_QUERY=SET search_path TO _realtime
    - DB_ENC_KEY=${SUPABASE_REALTIME_SECRET:-supabaserealtime}
    # App configuration
    - APP_NAME=realtime
    - PORT=4000
    - RLIMIT_NOFILE=10000
    - SEED_SELF_HOST=true
    - RUN_JANITOR=true
    - DISABLE_HEALTHCHECK_LOGGING=true
    - ERL_AFLAGS=-proto_dist inet_tcp
    - DNS_NODES=''
    # JWT secret (must match gotrue) - standard variable name
    - API_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}
    - SECRET_KEY_BASE=${SECRET_KEY_BASE:-${SUPABASE_REALTIME_SECRET:-${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}}}
    # PMOVES context
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # Healthcheck: Simple HTTP check (Realtime serves HTML on /)
    # Note: Official Supabase uses /api/tenants/{tenant}/health with Bearer token, but that endpoint returns 500 until DB migrations complete
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:4000/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
    - ${SUPABASE_REALTIME_PORT:-4000}:4000
    networks:
    - pmoves_api
    - pmoves_data

  supabase-storage:
    <<: *tier-supabase-hardened
    image: supabase/storage-api:v1.37.1
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    # Standard key names with legacy fallbacks
    - ANON_KEY=${ANON_KEY:-${SUPABASE_ANON_KEY:-}}
    - SERVICE_KEY=${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
    # JWT secret - standard variable name
    - PGRST_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}
    - PGRST_JWT_ALGORITHM=${SUPABASE_JWT_ALGORITHM:-HS256}
    # PostgREST connection
    - POSTGREST_URL=http://supabase-postgrest:3000
    # Database connection (use env variables, not hardcoded credentials)
    - DATABASE_URL=postgres://${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}:${POSTGRES_PASSWORD_URLENCODED:-${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}}@supabase-db:5432/${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    # Storage configuration
    - FILE_SIZE_LIMIT=52428800
    - STORAGE_BACKEND=file
    - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
    - REQUEST_ALLOW_X_FORWARDED_PATH=true
    # Image transformation via imgproxy
    - ENABLE_IMAGE_TRANSFORMATION=true
    - IMGPROXY_URL=http://supabase-imgproxy:5001
    # Tenant mode (single tenant for self-hosted)
    - TENANT_ID=stub
    - REGION=${SUPABASE_STORAGE_REGION:-stub}
    - GLOBAL_S3_BUCKET=${SUPABASE_S3_BUCKET:-stub}
    # PMOVES context
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # Healthcheck: Use 127.0.0.1 explicitly (localhost resolves to ::1 on IPv6, causing connection refused)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-postgrest:
        condition: service_started  # distroless image — no shell for healthcheck
      supabase-imgproxy:
        condition: service_healthy
    volumes:
    - supabase-storage-data:/var/lib/storage
    ports:
    - ${SUPABASE_STORAGE_PORT:-5000}:5000
    networks:
    - pmoves_api
    - pmoves_data

  supabase-studio:
    <<: *tier-supabase-hardened
    # Pinned 2025-02-04: Latest stable from Supabase
    image: supabase/studio:2026.02.04-sha-fba1944
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    # Postgres Meta connection (Studio uses pg-meta, not PostgREST directly)
    - STUDIO_PG_META_URL=http://supabase-meta:8080
    # Auth / Kong gateway
    - SUPABASE_URL=http://supabase-kong:8000
    - SUPABASE_PUBLIC_URL=${API_EXTERNAL_URL:-${SUPABASE_PUBLIC_URL:-}}
    - SUPABASE_ANON_KEY=${ANON_KEY:-${SUPABASE_ANON_KEY:-}}
    - SUPABASE_SERVICE_KEY=${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
    - AUTH_JWT_SECRET=${JWT_SECRET:-${SUPABASE_JWT_SECRET:-}}
    - PG_META_CRYPTO_KEY=${PG_META_CRYPTO_KEY:-}
    # Analytics (Logflare) integration
    - LOGFLARE_PUBLIC_ACCESS_TOKEN=${LOGFLARE_PUBLIC_ACCESS_TOKEN:-}
    - LOGFLARE_PRIVATE_ACCESS_TOKEN=${LOGFLARE_PRIVATE_ACCESS_TOKEN:-}
    - LOGFLARE_URL=http://supabase-analytics:4000
    - NEXT_PUBLIC_ENABLE_LOGS=true
    - NEXT_ANALYTICS_BACKEND_PROVIDER=postgres
    # PMOVES context
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # Healthcheck: External check (Next.js 16 binds to container hostname, not localhost)
    # Note: Official Supabase uses node -e fetch but their image has different network config
    # We rely on container being started successfully (logs show "Ready in Xms")
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      supabase-meta:
        condition: service_healthy
      supabase-gotrue:
        condition: service_healthy
      supabase-analytics:
        condition: service_healthy
    ports:
    - ${SUPABASE_STUDIO_PORT:-54323}:3000
    networks:
    - pmoves_api
    - pmoves_data  # reach supabase-meta, supabase-analytics

  # ---------------------------------------------------------------------------
  # Supabase imgproxy — image transformation for Storage
  # ---------------------------------------------------------------------------
  supabase-imgproxy:
    <<: *tier-supabase-hardened-ro
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - IMGPROXY_BIND=:5001
    - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/
    - IMGPROXY_USE_ETAG=true
    - IMGPROXY_ENABLE_WEBP_DETECTION=${IMGPROXY_ENABLE_WEBP_DETECTION:-true}
    - IMGPROXY_MAX_SRC_RESOLUTION=16.8
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
    - supabase-storage-data:/var/lib/storage:ro
    networks:
    - pmoves_data

  # ---------------------------------------------------------------------------
  # Supabase postgres-meta — database metadata API for Studio
  # ---------------------------------------------------------------------------
  supabase-meta:
    <<: *tier-supabase-hardened-ro
    image: supabase/postgres-meta:v0.95.2
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - PG_META_PORT=8080
    - PG_META_DB_HOST=supabase-db
    - PG_META_DB_PORT=5432
    - PG_META_DB_NAME=${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    - PG_META_DB_USER=${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}
    - PG_META_DB_PASSWORD=${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}
    - CRYPTO_KEY=${PG_META_CRYPTO_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
    - pmoves_data

  # ---------------------------------------------------------------------------
  # Supabase Edge Runtime — Deno edge functions
  # ---------------------------------------------------------------------------
  supabase-edge-functions:
    <<: *tier-supabase-hardened
    image: supabase/edge-runtime:v1.70.0
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in env.tier-supabase}
    - SUPABASE_URL=http://supabase-kong:8000
    - SUPABASE_ANON_KEY=${ANON_KEY:?Set ANON_KEY in env.tier-supabase}
    - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY in env.tier-supabase}
    - SUPABASE_DB_URL=postgresql://${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}:${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}@supabase-db:5432/${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    - VERIFY_JWT=${FUNCTIONS_VERIFY_JWT:-true}
    command: ["start", "--main-service", "/home/deno/functions/main"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      supabase-analytics:
        condition: service_healthy
    networks:
    - pmoves_api
    - pmoves_data  # reach supabase-db, supabase-analytics

  # ---------------------------------------------------------------------------
  # Supabase Analytics (Logflare) — log analytics backend
  # ---------------------------------------------------------------------------
  supabase-analytics:
    <<: *tier-supabase-hardened
    image: supabase/logflare:1.30.3
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - LOGFLARE_NODE_HOST=127.0.0.1
    - DB_USERNAME=${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}
    - DB_DATABASE=_supabase
    - DB_HOSTNAME=supabase-db
    - DB_PORT=5432
    - DB_PASSWORD=${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}
    - DB_SCHEMA=_analytics
    - LOGFLARE_PUBLIC_ACCESS_TOKEN=${LOGFLARE_PUBLIC_ACCESS_TOKEN:-}
    - LOGFLARE_PRIVATE_ACCESS_TOKEN=${LOGFLARE_PRIVATE_ACCESS_TOKEN:-}
    - LOGFLARE_SINGLE_TENANT=true
    - LOGFLARE_SUPABASE_MODE=true
    - POSTGRES_BACKEND_URL=postgresql://${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}:${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}@supabase-db:5432/_supabase
    - POSTGRES_BACKEND_SCHEMA=_analytics
    - LOGFLARE_FEATURE_FLAG_OVERRIDE=multibackend=true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
    - pmoves_data

  # ---------------------------------------------------------------------------
  # Supabase Vector — log collection pipeline (ships to Analytics)
  # ---------------------------------------------------------------------------
  supabase-vector:
    <<: *tier-supabase-hardened
    image: timberio/vector:0.28.1-alpine
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - LOGFLARE_PUBLIC_ACCESS_TOKEN=${LOGFLARE_PUBLIC_ACCESS_TOKEN:-}
    volumes:
    - supabase-vector-data:/var/lib/vector
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      supabase-analytics:
        condition: service_healthy
    networks:
    - pmoves_data

  # ---------------------------------------------------------------------------
  # Supavisor — connection pooler (PgBouncer replacement)
  # ---------------------------------------------------------------------------
  supabase-pooler:
    <<: *tier-supabase-hardened
    image: supabase/supavisor:2.7.4
    restart: unless-stopped
    profiles:
    - supabase-local
    environment:
    - PORT=4000
    - POSTGRES_PORT=5432
    - POSTGRES_DB=${POSTGRES_DB:-${SUPABASE_DB_NAME:-postgres}}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}
    - DATABASE_URL=ecto://${POSTGRES_USER:-${SUPABASE_DB_USER:-postgres}}:${POSTGRES_PASSWORD:-${SUPABASE_DB_PASSWORD:-postgres}}@supabase-db:5432/_supabase
    - CLUSTER_POSTGRES=true
    - SECRET_KEY_BASE=${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in env.tier-supabase}
    - VAULT_ENC_KEY=${VAULT_ENC_KEY:?Set VAULT_ENC_KEY in env.tier-supabase}
    - API_JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in env.tier-supabase}
    - METRICS_JWT_SECRET=${JWT_SECRET}
    - REGION=local
    - ERL_AFLAGS=-proto_dist inet_tcp
    - POOLER_TENANT_ID=${POOLER_TENANT_ID:-default-tenant}
    - POOLER_DEFAULT_POOL_SIZE=${POOLER_DEFAULT_POOL_SIZE:-20}
    - POOLER_MAX_CLIENT_CONN=${POOLER_MAX_CLIENT_CONN:-100}
    - POOLER_POOL_MODE=transaction
    - DB_POOL_SIZE=${POOLER_DB_POOL_SIZE:-5}
    command: ["/bin/sh", "-c", "/app/bin/migrate && if [ -f /etc/pooler/pooler.exs ]; then /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\"; else echo 'WARN: /etc/pooler/pooler.exs not found, skipping tenant seeding'; fi && /app/bin/server"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
    - ${SUPABASE_POOLER_PORT:-54329}:5432
    - ${SUPABASE_POOLER_TRANSACTION_PORT:-6543}:6543
    networks:
    - pmoves_data

  # =============================================================================
  # END SUPABASE STACK
  # =============================================================================

  qdrant:
    image: qdrant/qdrant:v1.10.0
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
    security_opt:
      - no-new-privileges:true
    ports:
    - ${QDRANT_PORT:-6333}:6333
    networks:
    - pmoves_data
    environment:
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    volumes:
    - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -lc \"exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  meilisearch:
    <<: *tier-data-hardened
    image: getmeili/meilisearch:v1.8
    restart: unless-stopped
    environment:
    - MEILI_ENV=production
    - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in env.shared or env.tier-data}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    ports:
    - ${MEILISEARCH_PORT:-7700}:7700
    networks:
    - pmoves_data
    volumes:
    - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  neo4j:
    image: neo4j:5.22
    env_file:
      - env.tier-data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
    - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/${NEO4J_PASSWORD:-pm_kDhuaogcUc1oOOVeGMNCkQ}}
    - NEO4J_dbms_security_allow__csv__import__from__file__urls=true
    - NEO4J_server_config_strict__validation_enabled=false
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    ports:
    - ${NEO4J_HTTP_PORT:-7474}:7474
    - ${NEO4J_BOLT_PORT:-7687}:7687
    volumes:
    - neo4j-data:/data
    - ./neo4j/cypher:/cypher:ro
    networks:
    - pmoves_data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  minio:
    <<: *tier-data-hardened
    # Pinned 2025-02-04: Latest RELEASE tag (MinIO stopped publishing to Docker Hub Oct 2025)
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
    - MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
    - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-minioadmin}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    ports:
    - ${MINIO_PORT:-9000}:9000
    - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
    - minio-data:/data
    networks:
    - pmoves_data
    - pmoves_bus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
  hi-rag-gateway:
    <<: *tier-api-hardened
    build:
      context: .
      dockerfile: services/hi-rag-gateway/Dockerfile
    restart: unless-stopped
    environment:
    - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
    - QDRANT_COLLECTION=${QDRANT_COLLECTION:-pmoves_chunks}
    - SENTENCE_MODEL=${SENTENCE_MODEL:-all-MiniLM-L6-v2}
    - HIRAG_HTTP_PORT=${HIRAG_HTTP_PORT:-8086}
    - GRAPH_BOOST=${GRAPH_BOOST:-0.15}
    - ENTITY_CACHE_TTL=${ENTITY_CACHE_TTL:-3600}
    - ENTITY_CACHE_MAX=${ENTITY_CACHE_MAX:-10000}
    - USE_MEILI=${USE_MEILI:-true}
    - MEILI_URL=${MEILI_URL:-http://meilisearch:7700}
    - NEO4J_URL=${NEO4J_URL:-bolt://neo4j:7687}
    - NEO4J_USER=${NEO4J_USER:-neo4j}
    - NEO4J_PASSWORD=${NEO4J_PASSWORD:-pm_kDhuaogcUc1oOOVeGMNCkQ}
    - NEO4J_DICT_REFRESH_SEC=${NEO4J_DICT_REFRESH_SEC:-300}
    - NEO4J_DICT_LIMIT=${NEO4J_DICT_LIMIT:-1000}
    - TAILSCALE_ONLY=${TAILSCALE_ONLY:-false}
    - TAILSCALE_ADMIN_ONLY=${TAILSCALE_ADMIN_ONLY:-false}
    - TAILSCALE_CIDRS=${TAILSCALE_CIDRS:-}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    ports:
    - ${HIRAG_V1_HOST_PORT:-8089}:8086
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
      neo4j:
        condition: service_healthy
        required: false
    networks:
    - pmoves_api
    - pmoves_data
    - pmoves_bus
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/hirag/admin/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  retrieval-eval:
    <<: *tier-worker-hardened
    build: ./services/retrieval-eval
    restart: unless-stopped
    environment:
    - HIRAG_URL=${HIRAG_URL:-http://hi-rag-gateway-v2:8086}
    - EVAL_HTTP_PORT=${EVAL_HTTP_PORT:-8090}
    depends_on:
    - hi-rag-gateway-v2
    ports:
    - ${RETRIEVAL_EVAL_PORT:-8090}:8090
    volumes:
    - ./services/retrieval-eval:/app:rw
    - ./datasets:/app/data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    profiles:
    - workers
    networks:
    - pmoves_app
    - pmoves_api
    - pmoves_bus
    extra_hosts:
    - host.docker.internal:host-gateway
  presign:
    <<: *tier-api-hardened
    build: ./services/presign
    restart: unless-stopped
    environment:
    - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
    - MINIO_SECURE=false
    - AWS_DEFAULT_REGION=us-east-1
    - ALLOWED_BUCKETS=${ALLOWED_BUCKETS:-assets,outputs}
    ports:
    - ${PRESIGN_PORT:-8088}:8080
    profiles:
    - data
    - orchestration
    networks:
    - pmoves_api
    - pmoves_bus
    - pmoves_external
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  render-webhook:
    <<: *tier-api-hardened
    build: ./services/render-webhook
    restart: unless-stopped
    environment:
    - SUPA_REST_URL=${RENDER_WEBHOOK_SUPA_REST_URL:-${SUPA_REST_INTERNAL_URL:-${SUPA_REST_URL:-http://supabase-kong:8000/rest/v1}}}
    - SUPABASE_SERVICE_ROLE_KEY=${RENDER_WEBHOOK_SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY:-}}}
    - SUPABASE_ANON_KEY=${RENDER_WEBHOOK_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-${ANON_KEY:-}}}
    - DEFAULT_NAMESPACE=${INDEXER_NAMESPACE:-pmoves}
    - RENDER_AUTO_APPROVE=${RENDER_AUTO_APPROVE:-false}
    ports:
    - ${RENDER_WEBHOOK_PORT:-8085}:8085
    profiles:
    - orchestration
    - workers
    networks:
    - pmoves_api
    - pmoves_external
    - pmoves_bus
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  model-registry:
    <<: *tier-api-hardened
    build:
