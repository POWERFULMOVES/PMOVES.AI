  # ── NATS Message Bus — JetStream-enabled event broker ──────────────────
  # Auth: nats://nats:***@nats:4222 | Monitoring: :8222/varz
  # See: pmoves/docs/NATS_CONFIGURATION.md
  nats:
    <<: *tier-data-hardened
    # Pinned 2025-02-04: Latest stable 2.11.x alpine version
    image: nats:2.11.8-alpine
    command:
    - -js
    - -m
    - '8222'
    - --user
    # Default to the canonical nats:pmoves creds when the runtime env doesn't
    # supply NATS_USER/NATS_PASSWORD. Without a default, a blank env var starts
    # the server with empty creds while every client (tier envs + init script)
    # authenticates as nats:pmoves -> "Authorization Violation" for the whole
    # bus. These are the documented weak defaults (env.shared.example, tier
    # envs); a real NATS_PASSWORD still overrides. Keep in sync with clients.
    - ${NATS_USER:-nats}
    - --pass
    - ${NATS_PASSWORD:-pmoves}
    restart: unless-stopped
    ports:
    # NATS is the mesh-wide event bus — credential-guarded (nats:***@),
    # so 0.0.0.0 default is intentional to allow Tailscale mesh peers to connect.
    - ${NATS_BIND:-0.0.0.0}:${NATS_PORT:-4222}:4222
    # Monitoring (8222) is NOT credential-guarded — it answered HTTP 200
    # unauthenticated on the LAN IP, exposing /varz, /connz (connected clients)
    # and /subsz (subject subscriptions). It shared NATS_BIND with 4222, so it
    # inherited a 0.0.0.0 default that is only justified for the GATED data port.
    # Loopback by default; set NATS_MONITORING_BIND explicitly (ideally to the
    # tailnet IP, not 0.0.0.0) if a node genuinely needs remote NATS monitoring.
    - ${NATS_MONITORING_BIND:-127.0.0.1}:${NATS_MONITORING_PORT:-9223}:8222
    networks:
    # pmoves_bus is internal:true (isolated in-stack mesh bus). A container on an
    # internal-only network gets NO published-port DNAT rules from Docker, so the
    # ports above are recorded but never plumbed — Tailscale mesh peers can't reach
    # 4222/9223 cross-node. Multi-home nats onto the non-internal pmoves_external so
    # its published ports actually bind, while keeping pmoves_bus for in-stack comms.
    - pmoves_bus
    - pmoves_external
    environment:
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_bus,pmoves_external
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:8222/varz || exit 1
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  nats-init:
    image: natsio/nats-box:0.14.5
    entrypoint: ["/bin/sh", "/scripts/init_streams.sh"]
    environment:
    # Pin the internal bus URL explicitly. This one-shot has no env_file, so
    # ${NATS_URL} would inherit compose's default env — which can carry a stale
    # localhost value (e.g. a host-exported NATS_URL) and make the init
    # unreachable (a container's localhost is itself, not the nats service).
    # nats-init always runs on pmoves_bus where NATS is reachable as nats:4222,
    # so hardcode it (matches the script default and env.shared.example).
    - NATS_URL=nats://nats:pmoves@nats:4222
    - PMOVES_NETWORKS=pmoves_bus
    volumes:
    - ./scripts/nats:/scripts:ro
    networks:
    - pmoves_bus
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"
    cap_drop: ["ALL"]
    read_only: true
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=16m,noexec,nosuid
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  agent-zero:
    <<: *tier-agent-hardened
    build:
      context: .
      dockerfile: ./services/agent-zero/Dockerfile
    restart: unless-stopped
    environment:
    - PORT=8080
    # NATS_URL from env.tier-agent has credentials: nats://nats:***@nats:4222
    - AGENT_ZERO_API_BASE=${AGENT_ZERO_API_BASE:-http://127.0.0.1:80}
    - AGENT_ZERO_HEALTH_PATH=${AGENT_ZERO_HEALTH_PATH:-/healthz}
    - AGENT_ZERO_HEALTH_PATH_FALLBACK=${AGENT_ZERO_HEALTH_PATH_FALLBACK:-/health}
    - AGENT_ZERO_CAPTURE_OUTPUT=${AGENT_ZERO_CAPTURE_OUTPUT:-false}
    # --dockerized=true is REQUIRED on A0 2.5: runtime.is_development() is
    # simply "not --dockerized", and a development-mode inner routes file
    # browsing + prompt extensions through RFC calls that die with
    # "No RFC password" inside the container.
    - AGENT_ZERO_EXTRA_ARGS=${AGENT_ZERO_EXTRA_ARGS:---port=80 --host=0.0.0.0 --dockerized=true}
    - PYTHONPATH=${AGENT_ZERO_PYTHONPATH:-/app:/app/services}
    - AGENTZERO_JETSTREAM=${AGENTZERO_JETSTREAM:-true}
    - AGENTZERO_JS_UNAVAILABLE_THRESHOLD=${AGENTZERO_JS_UNAVAILABLE_THRESHOLD:-1}
    - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # A2A protocol — Agent-to-Agent interoperability (AGNOTE4482 Item 2)
    - A2A_DISCOVERY_PUBLIC=${A2A_DISCOVERY_PUBLIC:-false}
    - A2A_TASKS_PUBLIC=${A2A_TASKS_PUBLIC:-false}
    # Inbound-MCP credential. Fleet-canonical AGENT_ZERO_MCP_TOKEN (Prod env
    # secret via secrets-funnel, issue #2056) pins the token A0 would otherwise
    # derive per-instance; empty default preserves the derive-on-unset behavior.
    - MCP_SERVER_TOKEN=${AGENT_ZERO_MCP_TOKEN:-}
    # PMOVES.Notes plugin (baked into the image at usr/plugins/pmoves_notes).
    # Defaults match the plugin's own fallbacks; set explicitly so a token can be
    # supplied and the plugin can be toggled off without rebuilding.
    - OPEN_NOTEBOOK_API_URL=${OPEN_NOTEBOOK_API_URL:-http://open-notebook:5055}
    - OPEN_NOTEBOOK_API_TOKEN=${OPEN_NOTEBOOK_API_TOKEN:-}
    - PMOVES_NOTES_ENABLED=${PMOVES_NOTES_ENABLED:-true}
    # Orchestrator MCP toolkit — Agent Zero is the primary orchestrator and acts
    # as an MCP *client* to the PMOVES service mesh. A0 reads A0_SET_mcp_servers
    # (standard {"mcpServers":{...}} schema) via get_default_value(). Servers:
    #   docker          — full container control over the mounted socket (mcp/docker)
    #   pmoves-supabase — self-hosted PostgREST data plane (pre-installed in image)
    #   cipher          — Consciousness/CHIT persistent memory over SSE
    # BoTZ-gateway (persona/forms) and Hi-RAG are added by their owning lanes once
    # their MCP endpoints land; set BOTZ_MCP_URL / HIRAG_MCP_URL to extend.
    - SUPABASE_REST_URL=${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}
    - SUPABASE_SERVICE_KEY=${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
    - CIPHER_MCP_URL=${CIPHER_MCP_URL:-http://cipher-api:8105/mcp/sse}
    - 'A0_SET_mcp_servers={"mcpServers":{"docker":{"command":"docker","args":["run","--rm","-i","--mount","type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock","mcp/docker"]},"pmoves-supabase":{"command":"mcp-server-postgrest","args":["--apiUrl","${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}","--apiKey","${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}","--schema","public,storage"]},"cipher":{"type":"sse","url":"${CIPHER_MCP_URL:-http://cipher-api:8105/mcp/sse}"}}}'
    # LLM routing: use TensorZero gateway as OpenAI-compatible provider
    # Agent Zero's get_default_value() reads A0_SET_* from env (dotenv priority)
    # Dummy key silences LiteLLM "Missing API Key" warning — TensorZero handles auth
    - OPENAI_API_KEY=${OPENAI_API_KEY:-tensorzero-routed}
    # Same placeholder for the A0 2.5 preset plugin: get_api_key() resolves
    # TENSORZERO_API_KEY for provider "tensorzero"; without it the UI banners
    # "Missing API Key for model presets" even though the gateway needs none.
    - TENSORZERO_API_KEY=${TENSORZERO_API_KEY:-tensorzero-routed}
    - A0_SET_chat_model_provider=openai
    # Chat/util/browser wrappers ADD openai/ prefix internally — do NOT double it
    - A0_SET_chat_model_name=tensorzero::function_name::${AGENT_ZERO_TZ_FUNCTION:-agent_zero}
    - A0_SET_chat_model_api_base=http://tensorzero-gateway:3000/openai/v1
    - A0_SET_util_model_provider=openai
    - A0_SET_util_model_name=tensorzero::function_name::${AGENT_ZERO_TZ_FUNCTION:-agent_zero}
    - A0_SET_util_model_api_base=http://tensorzero-gateway:3000/openai/v1
    - A0_SET_embed_model_provider=openai
    # Embed wrapper does NOT add openai/ prefix — must include it here
    - A0_SET_embed_model_name=openai/tensorzero::embedding_model_name::gemma_embed_local
    - A0_SET_embed_model_api_base=http://tensorzero-gateway:3000/openai/v1
    - A0_SET_browser_model_provider=openai
    - A0_SET_browser_model_name=tensorzero::function_name::${AGENT_ZERO_TZ_FUNCTION:-agent_zero}
    - A0_SET_browser_model_api_base=http://tensorzero-gateway:3000/openai/v1
    - A0_SET_a2a_server_enabled=true
    # Expose Agent Zero's MCP SSE server so external clients (Crush, Archon,
    # other nodes) can connect via standard MCP transport at /t-{token}/sse.
    - A0_SET_mcp_server_enabled=true
    # A0_SET_mcp_server_token: soft default (CANONICAL_NAMES.md §5). The previous
    # ${MCP_SERVER_TOKEN:?...} hard-require made *every* compose invocation on the
    # shared file fail interpolation on nodes without the var — blocking bring-up
    # of unrelated services (hit on Knuckles 2026-07-06). Use ${...:-} not :? —
    # the pinned token is STILL bridged to Agent Zero's setting (Codex #1977:
    # AZ reads A0_SET_* not the plain env var; and interpolation resolves from
    # the PROJECT env / env.shared, never from sibling `environment:` entries).
    # Fleet-canonical AGENT_ZERO_MCP_TOKEN (issue #2056) wins, legacy
    # MCP_SERVER_TOKEN project-env is the fallback; both unset → empty, no
    # hard-fail, Agent Zero auto-generates at startup.
    - A0_SET_mcp_server_token=${AGENT_ZERO_MCP_TOKEN:-${MCP_SERVER_TOKEN:-}}
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external,pmoves_api
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      tensorzero-gateway:
        condition: service_healthy
    ports:
    - ${AGENT_ZERO_BIND:-127.0.0.1}:${AGENT_ZERO_PORT:-8080}:8080
    - ${AGENT_ZERO_BIND:-127.0.0.1}:${AGENT_ZERO_UI_PORT:-8081}:80
    volumes:
    - ${AGENT_ZERO_MEMORY_DIR:-./data/agent-zero/memory}:/a0/memory
    - ${AGENT_ZERO_KNOWLEDGE_DIR:-./data/agent-zero/knowledge}:/a0/knowledge
    - ${AGENT_ZERO_INSTRUMENTS_DIR:-./data/agent-zero/instruments}:/a0/instruments
    - ${AGENT_ZERO_LOG_DIR:-./data/agent-zero/logs}:/a0/logs
    - ${AGENT_ZERO_RUNTIME_DIR:-./data/agent-zero/runtime}:/a0/runtime
    # A0 2.5 user-config tree (same pattern as the sidecars' ./usr mount).
    # Carries usr/plugins/_model_config/presets.yaml — WITHOUT it the
    # _model_config plugin bootstrap downloads the stock agent0ai/a0-presets
    # collection and the instance chats via openrouter/gpt-5.6-terra instead
    # of TensorZero (observed on first 2.5 boot). Seed from
    # pmoves/config/agent-zero/model-presets-docked.yaml. Mount the WHOLE
    # usr tree, not a nested subdir: a nested bind makes Docker pre-create
    # /a0/usr path components as root before init-a0.sh populates /a0,
    # breaking the runtime user's write to /a0/usr/.env (PermissionError).
    - ${AGENT_ZERO_USR_DIR:-./data/agent-zero/usr}:/a0/usr
    # Forms layer — persona/cognition profiles consumed by mcp_server.load_form().
    # Read-only: forms are introspective metadata; runtime never rewrites them.
    - ./configs/agents/forms:/app/configs/agents/forms:ro
    # Operator-state mount — env.shared into DARKXSIDE-AZ-5090.
    # DARKXSIDE is the witness + co-creator identity layer; POWERFULMOVES (this
    # org / brand / repo) emerges from it. rw is the correct default for
    # operator-state surfaces — DARKXSIDE-AZ is the operator on this node, not
    # a peripheral service requesting elevation. Constraints (if any) are
    # operator self-discipline, not architecture.
    # Override: set ENV_SHARED_MODE=ro in env.shared to harden on nodes where
    # write access is not needed (e.g., read-only observer deployments).
    - ./env.shared:/secrets/env.shared:${ENV_SHARED_MODE:-rw}
    # Docker socket for the orchestrator's docker MCP (mcp/docker via
    # A0_SET_mcp_servers). This grants Agent Zero full container control — an
    # intentional posture for the primary orchestrator. Note: :ro on the socket
    # is cosmetic (the Docker API is bidirectional regardless of file mode).
    - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ >/dev/null || curl -fsS http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Grant the runtime user (uid/gid 65532) access to the mounted Docker socket
    # (root:docker 0660 on Linux hosts) so the docker MCP (mcp/docker) can reach
    # the daemon without weakening socket perms. DOCKER_GID must match the gid
    # that owns the socket *as seen inside the container* — verify per node with
    #   docker exec <ctr> ls -ln /var/run/docker.sock
    # Linux: the host docker group (commonly 999/998), hence the default.
    # Docker Desktop (Windows/macOS): the proxied socket appears as root:root
    # 0660, i.e. gid 0 — 999 grants nothing and the docker MCP fails with
    # "permission denied ... /var/run/docker.sock". Set DOCKER_GID=0 on those
    # nodes. (An earlier comment here claimed Desktop "ignores" group_add; that
    # is wrong — the gid is enforced, it is simply 0 rather than the docker group.)
    group_add:
    - "${DOCKER_GID:-999}"
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_external  # Required for LLM provider APIs
    - pmoves_api  # Reach supabase-kong (PostgREST) for the pmoves-supabase MCP
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  # Archon 0.6.0 — TypeScript/Bun remote-coding-agent, built from the PMOVES-Archon
  # submodule (0.6.0 rewrote the old Python service to TS; the vendored Python
  # wrapper under services/archon/ is dead — see #2217). Serves HTTP + UI + MCP on
  # a single port (3090, /api/health). Backed by a dedicated Postgres (pg_notify
  # realtime); Archon auto-inits its schema on first boot.
  archon-postgres:
    image: ${ARCHON_POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: pmoves-archon-postgres
    hostname: archon-postgres
    restart: unless-stopped
    environment:
    - POSTGRES_DB=${ARCHON_DB_NAME:-remote_coding_agent}
    - POSTGRES_USER=${ARCHON_DB_USER:-archon}
    - POSTGRES_PASSWORD=${ARCHON_DB_PASSWORD:-archon}
    - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    - PMOVES_NETWORKS=pmoves_app
    volumes:
    - archon-pg-data:/var/lib/postgresql/data
    networks:
    - pmoves_app
    profiles:
    - agents
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  archon:
    <<: *tier-agent-hardened
    build:
      context: ../PMOVES-Archon
      dockerfile: Dockerfile
    image: ${ARCHON_IMAGE:-ghcr.io/powerfulmoves/pmoves-archon:pmoves-latest}
    # No container_name: keep the compose-default `${PROJECT}-archon-1` name that
    # `wait-agents` and the REST policy probe (Makefile) inspect by that exact name.
    hostname: archon
    restart: unless-stopped
    environment:
    - PORT=3090
    - HOST=0.0.0.0
    - NODE_ENV=production
    - ARCHON_DOCKER=true
    # Postgres backend (pg_notify realtime). Archon auto-inits its schema on boot.
    - DATABASE_URL=${ARCHON_DATABASE_URL:-postgresql://${ARCHON_DB_USER:-archon}:${ARCHON_DB_PASSWORD:-archon}@archon-postgres:5432/${ARCHON_DB_NAME:-remote_coding_agent}}
    - BETTER_AUTH_SECRET=${ARCHON_BETTER_AUTH_SECRET:-${BETTER_AUTH_SECRET:-}}
    - NATS_URL=${ARCHON_BUS_NATS_URL:-nats://nats:pmoves@nats:4222}
    # Claude auth — the TS server exits(1) at boot if none of these is present.
    - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
    - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
    - CLAUDE_USE_GLOBAL_AUTH=${CLAUDE_USE_GLOBAL_AUTH:-false}
    # gh auth — non-fatal warning if absent.
    - GH_TOKEN=${GH_TOKEN:-}
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    depends_on:
      archon-postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
    - ${ARCHON_BIND:-127.0.0.1}:${ARCHON_PORT:-3090}:3090
    # UI compat: keep the historical 3737 host port pointing at the unified server
    # (NEXT_PUBLIC_ARCHON_UI_URL default is http://localhost:3737).
    - ${ARCHON_BIND:-127.0.0.1}:${ARCHON_UI_PORT:-3737}:3090
    - ${ARCHON_BIND:-127.0.0.1}:${ARCHON_API_PORT:-8091}:3090
    volumes:
    - archon-data:/.archon
    # archon-user-home replaced with tmpfs on Windows nodes — named volume
    # breaks entrypoint find+chown (permission denied). tmpfs supports POSIX
    # ownership correctly. archon-data persists workspaces/worktrees.
    - type: tmpfs
      target: /home/appuser
    networks:
      pmoves_app:
        aliases:
        - archon-server
      pmoves_bus:
      # Archon needs egress to reach the Claude API + GitHub with the configured
      # credentials; pmoves_app/pmoves_bus are internal-only.
      pmoves_external:
    profiles:
    - agents
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3090/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot runs bun install + Postgres schema init — allow generous slack.
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  # Tier: agent (Cipher Memory - knowledge-graph memory for Claude Code / agents)
  hf-mcp-server:
    # HF MCP Server — Model Context Protocol tools for HuggingFace Hub.
    # Provides hf.model.search/info/download/list/convert_gguf and publishes
    # hf.model.downloaded.v1. Models download to /models; inference services
    # can mount the same host path or import converted GGUF artifacts.
    <<: *tier-agent-hardened-rw
    build:
      context: ./services/hf-mcp-server
      dockerfile: Dockerfile
    image: ${HF_MCP_SERVER_IMAGE:-ghcr.io/powerfulmoves/pmoves-hf-mcp-server:pmoves-latest}
    container_name: pmoves-hf-mcp-server
    hostname: hf-mcp-server
    restart: unless-stopped
    environment:
    - PORT=8096
    - NATS_URL=${NATS_URL}
    - HF_HOME=/models
    - HF_HUB_CACHE=/models/hub
    - HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-1}
    - HF_TOKEN=${HF_TOKEN:-}
    - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN:-}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    ports:
    - ${HF_MCP_SERVER_BIND:-127.0.0.1}:${HF_MCP_SERVER_PORT:-8203}:8096
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    profiles: ["agents", "research"]
    networks: [pmoves_app, pmoves_bus, pmoves_external]  # HuggingFace API
    volumes:
    - ${HF_MODELS_HOST_PATH:-./data/models}:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Tier: agent (NotebookLM Agent - Google NotebookLM integration)
  cipher-api:
    <<: *tier-agent-hardened
    build:
      context: ../Pmoves-cipher
      dockerfile: Dockerfile.pmoves
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - NATS_URL=${NATS_URL}
    - CIPHER_API_TOKEN=${CIPHER_API_TOKEN:-}
    - PMOVES_STORAGE_DIR=/data/cipher
    - PMOVES_PORT=8105
    - PMOVES_HOST=0.0.0.0
    - OLLAMA_URL=http://host.docker.internal:11434
    - OLLAMA_BASE_URL=http://host.docker.internal:11434
    - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-qwen3-embedding:4b}
    - TENSORZERO_URL=http://tensorzero-gateway:3000
    - QDRANT_URL=http://qdrant:6333
    - QDRANT_API_KEY=${QDRANT__API_KEY:-}
    - QDRANT_COLLECTION=pmoves_cipher_memory
    - EMBEDDING_MODEL=tensorzero::embedding_model_name::qwen3_embedding_4b_local
    - EMBEDDING_DIM=2560
    - PMOVES_NETWORKS=pmoves_app,pmoves_data,pmoves_bus,pmoves_external,pmoves_api
    ports:
    - "${CIPHER_BIND:-127.0.0.1}:${CIPHER_PORT:-8105}:8105"
    depends_on:
      nats:
        condition: service_healthy
      qdrant:
        condition: service_started
    profiles: ["agents", "cipher"]
    extra_hosts:
    - "host.docker.internal:host-gateway"
    networks: [pmoves_app, pmoves_data, pmoves_bus, pmoves_external, pmoves_api]
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://127.0.0.1:8105/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
    - cipher-data:/data/cipher

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  p7:
    # PMOVES P7 — room-aware stage manager (open-room lane, 2026-07-20).
    # Mediates room lifecycle (rehearsal → live → review → archive), with CHIT
    # activation gating on rehearsal→live, atomic catalog writeback, and signed
    # NATS control-plane events. See:
    #   pmoves/docs/specs/p7-service-spec-2026-07-20.md
    #   pmoves/docs/ROOMS_ON_A_STAGE.md
    #   pmoves/services/p7-room-orchestrator/README.md
    build:
      context: .
      dockerfile: services/p7-room-orchestrator/Dockerfile
    container_name: pmoves-p7
    restart: unless-stopped
    environment:
    - P7_HOST=0.0.0.0
    - P7_HTTP_PORT=8120
      # Broker requires auth (documented default creds convention) — without
      # them P7 boots in log-only fallback (nats_connected:false, no signed
      # lifecycle events on the control plane).
    - P7_NATS_URL=${P7_NATS_URL:-nats://nats:pmoves@nats:4222}
    - P7_PMOVES_ROOT=/etc/pmoves
    - P7_ROOM_CATALOG_PATH=/etc/pmoves/rooms/catalog.json
    - P7_ROOMS_DIR=/etc/pmoves/rooms
    - P7_ROOM_MANIFEST_SCHEMA=/etc/pmoves/schemas/room/room.manifest.v1.schema.json
    - P7_SIGNING_CARDS_PATH=/etc/pmoves/config/signing_identity_cards.yaml
    - P7_AGENT_REGISTRY_PATH=/etc/pmoves/config/agent_registry.yaml
    - P7_SERVICE_CARD_ID=${P7_SERVICE_CARD_ID:-}
    - P7_SIGNING_KEY=${P7_SIGNING_KEY:-}
    - P7_SIGNING_KEY_FILE=${P7_SIGNING_KEY_FILE:-}
    - P7_CHIT_REQUIRE_SIGNATURE=${P7_CHIT_REQUIRE_SIGNATURE:-true}
    - P7_ALLOW_UNSIGNED_LOCAL=${P7_ALLOW_UNSIGNED_LOCAL:-true}
    - P7_LOG_LEVEL=INFO
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    volumes:
      # Catalog + per-room manifests: read-write so transitions can writeback current_stage
    - ./config/rooms:/etc/pmoves/rooms:rw
      # Schema + signing cards + agent registry: read-only (operator edits via git)
    - ./contracts/schemas:/etc/pmoves/schemas:ro
    - ./config/signing_identity_cards.yaml:/etc/pmoves/config/signing_identity_cards.yaml:ro
    - ./config/agent_registry.yaml:/etc/pmoves/config/agent_registry.yaml:ro
    - ./env.shared:/etc/pmoves/env.shared:ro
    ports:
    - "${P7_BIND:-127.0.0.1}:${P7_PORT:-8120}:8120"
    depends_on:
      nats:
        condition: service_healthy
    networks: [pmoves_app, pmoves_bus, pmoves_external]
    profiles: ["agents", "p7"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8120/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  mesh-agent:
    <<: *tier-agent-hardened-ro
    build: ./services/mesh-agent
    restart: unless-stopped
    environment:
    # NATS_URL from env.shared/env.tier-agent has credentials: nats://nats:***@nats:4222
    - HIRAG_URL=${HIRAG_URL:-http://hi-rag-gateway-v2-gpu:8086}
    - ANNOUNCE_SEC=${ANNOUNCE_SEC:-15}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus
    depends_on: [nats]
    profiles: ["agents"]
