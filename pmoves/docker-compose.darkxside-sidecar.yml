##############################################################################
# PMOVES.AI — DARKXSIDE Sidecar Compose (Promoted)
##############################################################################
# Operator persona instance — heavier generate weight, artifacts on approve.
# Runs on the 5090 host using Ollama via host.docker.internal (host access).
# NO GPU passthrough — Ollama runs on the host, not in-container.
#
# Key difference from SPARK sidecar:
#   - DARKXSIDE: Ollama on HOST → agent reaches it via host.docker.internal:11434
#   - SPARK:    Ollama IN-CONTAINER → agent reaches it via compose network
#
# Usage:
#   docker compose -f docker-compose.darkxside-sidecar.yml up -d
#   docker compose -f docker-compose.darkxside-sidecar.yml down
#
# Prerequisites:
#   - Ollama running on host at port 11434
#   - pmoves-agent-zero:latest image built
#   - External networks created (pmoves-net, pmoves_app, pmoves_bus, pmoves_external)
##############################################################################
services:
  agent-zero-darkxside:
    image: pmoves-agent-zero:latest
    container_name: pmoves-agent-zero-darkxside
    hostname: agent-zero-darkxside
    restart: unless-stopped
    env_file:
    - ./env.darkxside-sidecar
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    - CHOWN
    - SETGID
    - SETUID
    security_opt:
    - no-new-privileges:true
    environment:
    # Supervisor listens on this port (inner AZ runs on :5000 internally)
    - PORT=8080
    - AGENT_FORM=DARKXSIDE
    - TOPOLOGY_MODE=standalone
    - DOCKED_MODE=false
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # LLM: Z.AI GLM-5-turbo (coding) as primary — cloud, not local
    - A0_SET_chat_model_provider=openai
    - A0_SET_chat_model_name=glm-5-turbo
    - A0_SET_chat_model_api_base=https://api.zai.chat/v1
    - A0_SET_util_model_provider=openai
    - A0_SET_util_model_name=glm-5-turbo
    - A0_SET_util_model_api_base=https://api.zai.chat/v1
    # Browser + Embed: Ollama on HOST via host.docker.internal
    - A0_SET_browser_model_provider=openai
    - A0_SET_browser_model_name=${DARKXSIDE_BROWSER_MODEL:-qwen3.5-35b-a3b}
    - A0_SET_browser_model_api_base=http://host.docker.internal:11434/v1
    - A0_SET_embed_model_provider=openai
    - A0_SET_embed_model_name=${DARKXSIDE_EMBED_MODEL:-qwen3-embedding:4b}
    - A0_SET_embed_model_api_base=http://host.docker.internal:11434/v1
    # A2A enabled
    - A0_SET_a2a_server_enabled=true
    - A0_SET_mcp_server_token=
    # CHIT dev mode (standalone)
    - CHIT_REQUIRE_SIGNATURE=false
    - CHIT_DECRYPT_ANCHORS=false
    - CHIT_PASSPHRASE=${CHIT_PASSPHRASE:-dev-local-sidecar-override}
    # JetStream disabled in standalone
    - AGENTZERO_JETSTREAM=false
    - AGENTZERO_JS_UNAVAILABLE_THRESHOLD=999
    # Host env leak guard
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    volumes:
    # Persistent data volumes (same pattern as docked agent-zero)
    - ${DARKXSIDE_MEMORY_DIR:-./data/darkxside/memory}:/a0/memory
    - ${DARKXSIDE_KNOWLEDGE_DIR:-./data/darkxside/knowledge}:/a0/knowledge
    - ${DARKXSIDE_INSTRUMENTS_DIR:-./data/darkxside/instruments}:/a0/instruments
    - ${DARKXSIDE_LOG_DIR:-./data/darkxside/logs}:/a0/logs
    - ${DARKXSIDE_RUNTIME_DIR:-./data/darkxside/runtime}:/a0/runtime
    # User config, plugins, forms, skills
    - ${DARKXSIDE_USR_DIR:-./usr}:/a0/usr
    ports:
    - ${DARKXSIDE_BIND:-127.0.0.1}:${DARKXSIDE_PORT:-8092}:8080
    networks:
    - pmoves-net
    - pmoves_app
    - pmoves_bus
    - pmoves_external
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

networks:
  pmoves-net:
    external: true
  pmoves_app:
    external: true
  pmoves_bus:
    external: true
  pmoves_external:
    external: true