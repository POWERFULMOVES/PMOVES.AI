##############################################################################
# PMOVES.AI — DARKXSIDE Sidecar Compose (Promoted)
##############################################################################
# Operator persona instance — heavier generate weight, artifacts on approve.
# Runs on the 5090 host using Ollama via host.docker.internal (host access).
# NO GPU passthrough — Ollama runs on the host, not in-container.
#
# Key difference from SPARK sidecar:
#   - DARKXSIDE: Ollama on HOST → agent reaches it via host.docker.internal:11434
#   - SPARK:    Ollama IN-CONTAINER → agent reaches it via compose network
#
# Usage:
#   docker compose -f docker-compose.darkxside-sidecar.yml up -d
#   docker compose -f docker-compose.darkxside-sidecar.yml down
#
# Prerequisites:
#   - Ollama running on host at port 11434
#   - pmoves-agent-zero:latest image built
#   - External networks created (pmoves-net, pmoves_app, pmoves_bus, pmoves_external)
##############################################################################
services:
  # One-shot: hand the bind-mounted A0 user tree to the runtime uid (65532)
  # before Agent Zero starts. Docker never changes a bind mount's ownership, so
  # host-seeded files (uid 1000) left A0 failing every plugin install and
  # settings save with EACCES behind a green healthcheck. Ownership only, never
  # chmod: _oauth credentials stay 0600 and plugin code gains no write bit.
  # Invariants and failure modes: scripts/a0_usr_init.sh.
  agent-zero-darkxside-usr-init:
    image: ${A0_USR_INIT_IMAGE:-busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e}
    entrypoint: ["/bin/sh", "/scripts/a0_usr_init.sh"]
    user: "0:0"
    network_mode: none
    volumes:
    # Long form with create_host_path: false (Compose spec, services.volumes long
    # syntax): a missing source fails at create. The short form makes Docker
    # create it as an empty root-owned dir and A0 would boot with no usr state.
    - type: bind
      source: ${DARKXSIDE_USR_DIR:-./usr}
      target: /a0/usr
      bind:
        create_host_path: false
    - ./scripts/a0_usr_init.sh:/scripts/a0_usr_init.sh:ro
    restart: "no"
    read_only: true
    # CHOWN to hand entries to 65532; DAC_READ_SEARCH so root can traverse
    # dirs A0 created 0700. No FOWNER, so it cannot chmod what it does not own.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_READ_SEARCH"]
    security_opt:
    - no-new-privileges:true

  agent-zero-darkxside:
    image: pmoves-agent-zero:latest
    container_name: pmoves-agent-zero-darkxside
    hostname: agent-zero-darkxside
    restart: unless-stopped
    env_file:
    - ./env.darkxside-sidecar
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    - CHOWN
    - SETGID
    - SETUID
    security_opt:
    - no-new-privileges:true
    environment:
    # Supervisor listens on this port (inner AZ runs on :5000 internally)
    - PORT=8080
    # The 2026-03 pmoves-agent-zero image defaults its readiness probe to
    # 127.0.0.1:80 while the inner AZ here serves on :5000 — without this
    # override the supervisor can NEVER see the inner come up, times out at
    # 180s, and PID 1 exits: measured 368 restarts before diagnosis.
    - AGENT_ZERO_API_BASE=http://127.0.0.1:5000
    # --dockerized=true is REQUIRED on A0 2.5 (dev-mode inner RFC-calls fail
    # in-container with "No RFC password") — see docker-compose.yml agent-zero.
    - AGENT_ZERO_EXTRA_ARGS=--dockerized=true
    - AGENT_FORM=DARKXSIDE
    - TOPOLOGY_MODE=standalone
    - DOCKED_MODE=false
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # LLM: Z.AI GLM-5-turbo (coding) as primary — cloud, not local.
    # A0 2.5 REPLACED the flat A0_SET_<role>_model_* settings with the
    # _model_config preset plugin: the old vars are silently ignored (they
    # target keys removed from the Settings schema). Model selection now
    # lives in /a0/usr/plugins/_model_config/presets.yaml — seeded from
    # pmoves/config/agent-zero/model-presets-darkxside.yaml via the ./usr
    # mount below. Only the provider API key remains env-driven:
    # models.get_api_key() resolves ZAI_CODING_API_KEY for the zai_coding
    # provider (fork registry, api.z.ai coding endpoint).
    - ZAI_CODING_API_KEY=${Z_AI_API_KEY:-}
    # A2A enabled
    - A0_SET_a2a_server_enabled=true
    - A0_SET_mcp_server_token=
    # CHIT dev mode (standalone)
    - CHIT_REQUIRE_SIGNATURE=false
    - CHIT_DECRYPT_ANCHORS=false
    - CHIT_PASSPHRASE=${CHIT_PASSPHRASE:-dev-local-sidecar-override}
    # JetStream disabled in standalone
    - AGENTZERO_JETSTREAM=false
    - AGENTZERO_JS_UNAVAILABLE_THRESHOLD=999
    # Host env leak guard
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    depends_on:
      agent-zero-darkxside-usr-init:
        condition: service_completed_successfully
    volumes:
    # Persistent data volumes (same pattern as docked agent-zero)
    - ${DARKXSIDE_MEMORY_DIR:-./data/darkxside/memory}:/a0/memory
    - ${DARKXSIDE_KNOWLEDGE_DIR:-./data/darkxside/knowledge}:/a0/knowledge
    - ${DARKXSIDE_INSTRUMENTS_DIR:-./data/darkxside/instruments}:/a0/instruments
    - ${DARKXSIDE_LOG_DIR:-./data/darkxside/logs}:/a0/logs
    - ${DARKXSIDE_RUNTIME_DIR:-./data/darkxside/runtime}:/a0/runtime
    # User config, plugins, forms, skills
    # Long form with create_host_path: false (Compose spec, services.volumes long
    # syntax): a missing source fails at create. The short form makes Docker
    # create it as an empty root-owned dir and A0 would boot with no usr state.
    - type: bind
      source: ${DARKXSIDE_USR_DIR:-./usr}
      target: /a0/usr
      bind:
        create_host_path: false
    ports:
    - ${DARKXSIDE_BIND:-127.0.0.1}:${DARKXSIDE_PORT:-8092}:8080
    networks:
    - pmoves-net
    - pmoves_app
    - pmoves_bus
    - pmoves_external
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          # 2G silently OOM-kills the inner A0 python while the supervisor
          # exits 0 - same failure class fixed on the main agent-zero service
          # (see AGENT_ZERO_MEMORY_LIMIT there); keep parity with that default.
          cpus: ${DARKXSIDE_A0_CPU_LIMIT:-4.0}
          memory: ${DARKXSIDE_A0_MEMORY_LIMIT:-8G}

networks:
  pmoves-net:
    external: true
  pmoves_app:
    external: true
  pmoves_bus:
    external: true
  pmoves_external:
    external: true