# GitHub Runner Configuration
# Defines runners to monitor and their capabilities

runners:
  ai-lab:
    location: local
    labels:
      - self-hosted
      - ai-lab
      - gpu
      - Linux
      - X64
    # Normalize all capabilities to strings for consistent Pydantic validation
    capabilities:
      gpu: "true"
      ram: "64GB"
      storage: "200GB"
    workloads:
      - research
      - gpu-build
      - llm-training
    health_url: http://ai-lab.local:8080/healthz
    repositories:
      - POWERFULMOVES/PMOVES.AI

  vps:
    location: remote
    labels:
      - self-hosted
      - vps
      - Linux
      - X64
    capabilities:
      cpu: "8"
      ram: "16GB"
      storage: "50GB"
      docker: "true"
    workloads:
      - docker-build
      - integration-test
      - security-scan
    health_url: http://vps.local:8080/healthz  # TODO: Update with actual URL
    repositories:
      - POWERFULMOVES/PMOVES.AI
      - POWERFULMOVES/PMOVES-DoX

  ai-lab-4090-docker:
    location: local
    labels:
      - self-hosted
      - ai-lab
      - Linux
      - X64
    capabilities:
      ram: "16GB"
      docker: "true"
      runner_count: "2"
    workloads:
      - branch-trail-emit
      - ci-light
      - pr-triage
    health_url: http://localhost:2019/healthz  # no dedicated health endpoint; use docker ps
    repositories:
      - POWERFULMOVES/PMOVES.AI
    notes: >
      Two Docker-based Linux runners on the 4090 Windows laptop (Docker Desktop / WSL2 backend).
      Container names: pmoves-4090-runner-1, pmoves-4090-runner-2.
      Name prefix: pmoves-4090 (random suffix per start via RANDOM_RUNNER_SUFFIX=true).
      Start/stop: make -C pmoves gha-runner-4090-up / gha-runner-4090-down.
      Compose: pmoves/docker/runner/docker-compose.4090.yml.

  cloudstartup:
    location: cloud
    labels:
      - self-hosted
      - cloudstartup
      - staging
      - Linux
      - X64
    capabilities:
      cpu: "4"
      ram: "8GB"
      ephemeral: "true"
    workloads:
      - unit-test
      - overflow
      - staging
    health_url: http://cloudstartup.local:8080/healthz  # TODO: Update with actual URL
    repositories:
      - POWERFULMOVES/PMOVES.AI
