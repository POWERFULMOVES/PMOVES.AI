version: "3.9"

services:
  firefly-db:
    image: mariadb:10.11
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: firefly
      MYSQL_USER: firefly
      MYSQL_PASSWORD: ${FIREFLY_DB_PASSWORD:-fireflypass}
    volumes:
      - firefly-db:/var/lib/mysql
    networks: [pmoves]
    profiles: ["firefly"]

  firefly:
    image: ${FIREFLY_IMAGE:-ghcr.io/powerfulmoves/pmoves-wealth:pmoves-latest}
    depends_on: [firefly-db]
    environment:
      APP_KEY: ${FIREFLY_APP_KEY:-base64:CHANGE_ME}
      TZ: ${TZ:-UTC}
      DB_CONNECTION: mysql
      DB_HOST: firefly-db
      DB_PORT: 3306
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:-fireflypass}
      TRUSTED_PROXIES: "*"
    ports:
      # Keep in sync with the LIVE deploy unit (pmoves/docker-compose.external.yml,
      # brought up via `make -C pmoves up-external`): host ${FIREFLY_PORT:-8075},
      # container 8080. Spec G3 (tokenism-wealth demo wiring) reconciled this
      # duplicate — do not reintroduce a hardcoded 8080 host port or a new var.
      - "${FIREFLY_PORT:-8075}:8080"
    networks: [pmoves]
    profiles: ["firefly"]

volumes:
  firefly-db:
