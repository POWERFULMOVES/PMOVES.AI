##############################################################################
# PMOVES.AI - Docker Compose Overlay: Media Services
##############################################################################
# Services: media tier
# Always combine with base: docker compose -f docker-compose.base.yml -f docker-compose.media.yml up -d
#
# Generated from docker-compose.yml by scripts/split_compose.py
##############################################################################
services:
  media-video:
    <<: &tier-media-hardened
      env_file:
      - env.shared
      - env.tier-media
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID

    build: ./services/media-video
    restart: unless-stopped
    environment:
    - MINIO_ENDPOINT=${MINIO_ENDPOINT:-${S3_ENDPOINT:-minio:9000}}
    - MINIO_SECURE=${MINIO_SECURE:-false}
    - MINIO_ACCESS_KEY=${MINIO_USER:?Run make brand-defaults}
    - MINIO_SECRET_KEY=${MINIO_PASSWORD:?Run make brand-defaults}
    - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    - YOLO_MODEL=${YOLO_MODEL:-yolov8n.pt}
    - YOLO_CONFIDENCE=${YOLO_CONFIDENCE:-0.25}
    - FRAME_SAMPLE_RATE=${FRAME_SAMPLE_RATE:-5}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            count: ${GPU_COUNT:-all}
        limits:
          cpus: '4.0'
          memory: 8G
    ports:
    - ${MEDIA_VIDEO_BIND:-127.0.0.1}:${MEDIA_VIDEO_PORT:-8079}:8079
    profiles:
    - workers
    - orchestration
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_external  # Ultralytics YOLO model downloads at runtime
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8079/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  media-audio:
    <<: *tier-media-hardened
    build:
      context: ..
      dockerfile: pmoves/services/media-audio/Dockerfile
    restart: unless-stopped
    environment:
    - MINIO_ENDPOINT=${MINIO_ENDPOINT:-${S3_ENDPOINT:-minio:9000}}
    - MINIO_SECURE=${MINIO_SECURE:-false}
    - MINIO_ACCESS_KEY=${MINIO_USER:?Run make brand-defaults}
    - MINIO_SECRET_KEY=${MINIO_PASSWORD:?Run make brand-defaults}
    - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    - EMOTION_MODEL=${EMOTION_MODEL:-superb/hubert-large-superb-er}
    # env.shared blanks SSL_CERT_FILE/SSL_CERT_DIR/*_CA_BUNDLE to stop Windows
    # host cert paths leaking in — but for Python/OpenSSL an EMPTY value means
    # "trust nothing" and HF model downloads fail TLS verify. Re-point at the
    # container's own CA store (same anti-leak intent, working trust chain).
    - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    - SSL_CERT_DIR=/etc/ssl/certs
    - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
    - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            count: ${GPU_COUNT:-all}
        limits:
          cpus: '4.0'
          memory: 8G
    ports:
    - ${MEDIA_AUDIO_BIND:-127.0.0.1}:${MEDIA_AUDIO_PORT:-8082}:8082
    profiles:
    - workers
    - orchestration
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_external  # HuggingFace model downloads at runtime
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  ffmpeg-whisper:
    <<: *tier-media-hardened
    build:
      context: ..
      dockerfile: pmoves/services/ffmpeg-whisper/Dockerfile
    restart: unless-stopped
    environment:
    - MINIO_ENDPOINT=${MINIO_ENDPOINT:-${S3_ENDPOINT:-minio:9000}}
    - MINIO_SECURE=${MINIO_SECURE:-false}
    - MINIO_ACCESS_KEY=${MINIO_USER:?Run make brand-defaults}
    - MINIO_SECRET_KEY=${MINIO_PASSWORD:?Run make brand-defaults}
    - USE_CUDA=${USE_CUDA:-true}
    - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    - FFW_PROVIDER=${FFW_PROVIDER:-faster-whisper}
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    - WHISPER_MODEL=${WHISPER_MODEL:-small}
    - WHISPER_LANGUAGE=${WHISPER_LANGUAGE:-en}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_data,pmoves_external
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            capabilities:
            - compute
            - utility
            count: ${GPU_COUNT:-all}
        limits:
          cpus: '4.0'
          memory: 8G
    ports:
    - ${FFMPEG_WHISPER_BIND:-127.0.0.1}:${FFMPEG_WHISPER_PORT:-8078}:8078
    profiles:
    - workers
    - orchestration
    - agents
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_data  # Required for Supabase segment storage
    - pmoves_external  # Required for HuggingFace model downloads (faster-whisper)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8078/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  transcribe-backend:
    <<: &tier-worker-hardened
      env_file:
      - env.shared
      - env.tier-worker
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID

    build:
      context: ../PMOVES-transcribe-and-fetch
      dockerfile: backend/Dockerfile
    image: ${TRANSCRIBE_BACKEND_IMAGE:-ghcr.io/powerfulmoves/pmoves-transcribe-backend:latest}
    restart: unless-stopped
    environment:
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    - SUPABASE_URL=${SUPA_REST_INTERNAL_URL:-${SUPA_REST_URL:-http://supabase-kong:8000/rest/v1}}
    - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    - NATS_URL=${NATS_URL}
    - MINIO_ENDPOINT=${MINIO_ENDPOINT:-${S3_ENDPOINT:-minio:9000}}
    - MINIO_SECURE=${MINIO_SECURE:-false}
    # LLM keys live in env.tier-llm; this worker-tier service consumes them
    # via compose interpolation (COMPOSE_ENV_FILES spans all tiers). The
    # backend hard-requires both at import (psearch clients).
    - OPENAI_API_KEY
    - GROQ_API_KEY
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_api,pmoves_data,pmoves_external
    depends_on:
      nats:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy
    ports:
    - ${TRANSCRIBE_BIND:-0.0.0.0}:${TRANSCRIBE_HOST_PORT:-8074}:8000
    profiles:
    - workers
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_api
    - pmoves_data  # MinIO access (minio:9000)
    - pmoves_external  # host port publish (tier nets are internal:true)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  transcribe-frontend:
    <<: *tier-worker-hardened
    build:
      context: ../PMOVES-transcribe-and-fetch
      dockerfile: Dockerfile
    image: ${TRANSCRIBE_FRONTEND_IMAGE:-pmoves-transcribe-frontend:local}
    restart: unless-stopped
    environment:
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    # Browser-facing base = backend host port; server-side calls stay in-network
    - NEXT_PUBLIC_API_BASE=${TRANSCRIBE_PUBLIC_API_BASE:-http://localhost:8074}
    # Next standalone binds to HOSTNAME; docker injects the container id there
    - HOSTNAME=0.0.0.0
    - INTERNAL_BACKEND_URL=http://transcribe-backend:8000
    - PMOVES_NETWORKS=pmoves_app,pmoves_external
    depends_on:
      transcribe-backend:
        condition: service_healthy
    ports:
    - ${TRANSCRIBE_FRONTEND_BIND:-0.0.0.0}:${TRANSCRIBE_FRONTEND_HOST_PORT:-448}:448
    profiles:
    - workers
    networks:
    - pmoves_app
    - pmoves_external  # host port publish (tier nets are internal:true)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:448/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  jellyfin-bridge:
    <<: &tier-agent-hardened-ro
      env_file:
      - env.shared
      - env.tier-agent
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      read_only: true
      tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /var/tmp:noexec,nosuid,size=64m

    build: ./services/jellyfin-bridge
    restart: unless-stopped
    environment:
    - JELLYFIN_URL=${JELLYFIN_INTERNAL_URL:-http://cataclysm-jellyfin:8096}
    - SUPA_REST_URL=${SUPA_REST_INTERNAL_URL:-${SUPA_REST_URL:-http://supabase-kong:8000/rest/v1}}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    ports:
    - ${JELLYFIN_BRIDGE_BIND:-0.0.0.0}:8093:8093
    profiles:
    - orchestration
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_external  # Required for host reachability + external media metadata lookups
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8093/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  ultimate-tts-studio:
    build:
      context: ./docker/ultimate-tts-studio
      dockerfile: Dockerfile
    image: ${ULTIMATE_TTS_IMAGE:-ghcr.io/powerfulmoves/pmoves-ultimate-tts-studio:pmoves-latest}
    restart: unless-stopped
    <<: *tier-media-hardened
    environment:
    - GRADIO_SERVER_NAME=0.0.0.0
    - GRADIO_SERVER_PORT=7861
    - GRADIO_MCP_SERVER=false    # Requires gradio[mcp] extra - enable after image rebuild
      # WSL2/CUDA compatibility settings
    - CUDA_FORCE_PTX_JIT=1
    - CUDA_DEVICE_ORDER=PCI_BUS_ID
    - TORCH_CUDA_ARCH_LIST=5.0;5.2;6.0;6.1;7.0;7.5;8.0;8.6;9.0
    - TORCH_CUDNN_V8_API_ENABLED=1
    - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    - PMOVES_NETWORKS=pmoves_app,pmoves_monitoring,pmoves_external
    ports: ["${TTS_BIND:-127.0.0.1}:7861:7861"]
    profiles: ["gpu", "tts", "voice"]
    networks: [pmoves_app, pmoves_monitoring, pmoves_external]  # HuggingFace TTS model downloads
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
        limits:
          memory: 8G
          cpus: '4.0'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7861/gradio_api/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Flute Gateway - Multimodal voice communication layer (TTS/STT)
  flute-gateway:
    <<: *tier-media-hardened
    build:
      context: .
      dockerfile: services/flute-gateway/Dockerfile
    image: ${FLUTE_GATEWAY_IMAGE:-ghcr.io/powerfulmoves/pmoves-flute-gateway:latest}
    restart: unless-stopped
    environment:
    # NATS_URL from env.shared/env.tier-media has credentials: nats://nats:***@nats:4222
    - PORT=8055
    - NATS_URL=${NATS_URL}
    - SUPABASE_URL=${SUPABASE_INTERNAL_URL:-${SUPABASE_URL:-http://supabase-kong:8000}}
    - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
    # Default TTS = OmniVoice (k2-fsa, Apache-2.0; license-clean creator-pipeline
    # voice). Overridable: DEFAULT_VOICE_PROVIDER=vibevoice restores z890's lane.
    - DEFAULT_VOICE_PROVIDER=${DEFAULT_VOICE_PROVIDER:-omnivoice}
    # OmniVoice server (creator-operator omnivoice.compose.yml, :8002). On a
    # shared host bring OmniVoice up with OMNIVOICE_BIND=0.0.0.0 so this container
    # reaches it via host.docker.internal; set OMNIVOICE_TOKEN once 0.0.0.0-bound.
    - OMNIVOICE_URL=${OMNIVOICE_URL:-http://host.docker.internal:8002}
    - OMNIVOICE_TOKEN=${OMNIVOICE_TOKEN:-}
    - OMNIVOICE_TIMEOUT_SEC=${OMNIVOICE_TIMEOUT_SEC:-300}
    # Realtime duplex voice agent (/v1/voice/agent: mic→Whisper→LLM→VibeVoice).
    # Off by default — requires pipecat-ai installed + VibeVoice (7860) running.
    - PIPECAT_ENABLED=${PIPECAT_ENABLED:-false}
    - ULTIMATE_TTS_URL=${ULTIMATE_TTS_URL:-http://host.docker.internal:7860}
    - ULTIMATE_TTS_TIMEOUT_SEC=${ULTIMATE_TTS_TIMEOUT_SEC:-300}
    # Host-affinity routing (opt-in, #2305): with VOICE_HOST_AFFINITY=1 a cast
    # host-swaps the configured engine URL to the selected fleet node's Tailscale
    # hostname (pmoves-<node>, port/path preserved) via resolve_engine_target().
    # VOICE_FLEET_NODES (comma-sep up-node ids) restricts routing to nodes that
    # are up; unset → optimistic preferred. Fail-open to the configured URL by
    # default (both unset) — zero behaviour change unless explicitly enabled.
    - VOICE_HOST_AFFINITY=${VOICE_HOST_AFFINITY:-}
    - VOICE_FLEET_NODES=${VOICE_FLEET_NODES:-}
    - FLUTE_API_KEY=${FLUTE_API_KEY:-}
    # CHIT voice attribution: publishes CGP events to tokenism.geometry.event.v1
    # NATS subject for every voice synthesis. Enables downstream consumers
    # (tokenism simulator, hi-rag indexing) to correlate audio with prosodic
    # BPM structure. Safe to enable — events are best-effort and non-blocking.
    - CHIT_VOICE_ATTRIBUTION=${CHIT_VOICE_ATTRIBUTION:-true}
    - CHIT_GEOMETRY_SUBJECT=${CHIT_GEOMETRY_SUBJECT:-tokenism.geometry.event.v1}
    - CHIT_NAMESPACE=${CHIT_NAMESPACE:-pmoves.voice}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
      # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    - PMOVES_NETWORKS=pmoves_app,pmoves_api,pmoves_bus,pmoves_external
    ports: ["${FLUTE_BIND:-127.0.0.1}:8055:8055", "${FLUTE_BIND:-127.0.0.1}:8056:8056"]
    profiles: ["orchestration", "media"]
    # Attach a non-internal bridge so published host ports resolve on Docker Desktop.
    networks: [pmoves_app, pmoves_api, pmoves_bus, pmoves_external]
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8055/healthz', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # Tier: agent (Tokenism Simulator - CHIT/geometry bus simulation service)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  cast-tts-gateway:
    build:
      context: ./services/cast-tts-gateway
      dockerfile: Dockerfile
    image: ${CAST_TTS_IMAGE:-ghcr.io/powerfulmoves/pmoves-cast-tts-gateway:pmoves-latest}
    restart: unless-stopped
    <<: *tier-agent-hardened-ro
    environment:
    - PORT=8060
    - FLUTE_GATEWAY_URL=http://flute-gateway:8055
    - ULTIMATE_TTS_URL=${ULTIMATE_TTS_URL:-http://host.docker.internal:7860}
    - NATS_URL=${NATS_URL}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_REQUIRE_SIGNATURE:-false}
    - CHIT_DECRYPT_ANCHORS=${CHIT_DECRYPT_ANCHORS:-false}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - SUPABASE_URL=http://supabase-kong:8000
    - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    - MAX_CONCURRENT_CASTS=${MAX_CONCURRENT_CASTS:-4}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_api,pmoves_external
    ports: ["${CAST_TTS_BIND:-0.0.0.0}:${CAST_TTS_PORT:-8060}:8060"]
    profiles: ["cast", "media"]
    networks: [pmoves_app, pmoves_bus, pmoves_api, pmoves_external]
    user: "65532:65532"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8060/healthz', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      flute-gateway:
        condition: service_healthy
      nats:
        condition: service_healthy
      supabase-kong:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Voice Relay - NATS bridge: agentzero.task.result.v1 → voice.agent.response.v1
  voice-relay:
    build:
      context: .
      dockerfile: services/voice-relay/Dockerfile
    image: ${VOICE_RELAY_IMAGE:-ghcr.io/powerfulmoves/pmoves-voice-relay:pmoves-latest}
    restart: unless-stopped
    <<: *tier-worker-hardened
    environment:
    - PORT=8121
    - NATS_URL=${NATS_URL}
    - VOICE_RELAY_INPUT_SUBJECT=${VOICE_RELAY_INPUT_SUBJECT:-agentzero.task.result.v1}
    - VOICE_RELAY_OUTPUT_SUBJECT=${VOICE_RELAY_OUTPUT_SUBJECT:-voice.agent.response.v1}
    - PMOVES_NETWORKS=pmoves_bus
    ports: ["${VOICE_RELAY_BIND:-0.0.0.0}:${VOICE_RELAY_PORT:-8121}:8121"]
    profiles: ["cast", "media"]
    networks: [pmoves_bus]
    read_only: true
    tmpfs:
    - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8121/healthz', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 32M

  # PMOVES Central UI - Main dashboard (port 4482)
  bgutil-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.2.2
    restart: unless-stopped
    # Image entrypoint is already `node build/main.js`; repeating the script
    # here fed it as a positional arg ("too many arguments" crash-loop).
    command: ["--port", "${BGUTIL_PORT:-4417}"]
    environment:
    - PORT=${BGUTIL_PORT:-4417}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    depends_on:
    - minio
    profiles:
    - orchestration
    - yt
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_external  # Required for YouTube processing
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  pmoves-ollama:
    <<: &tier-llm-hardened
      env_file:
      - env.shared
      - env.tier-llm
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID

    # 0.31.2: minimum runtime for the qwen3.5 MoE family (Gated DeltaNet hybrid
    # layout) — 0.18.0 refuses the manifest with 412 "requires a newer version".
    image: ${PMOVES_OLLAMA_IMAGE:-ollama/ollama:0.31.2@sha256:509fdf54e23bd50d87af646cb51c0a7a203d6a83cc4d6695b3b08c5be1c62c0a}
    restart: unless-stopped
    environment:
    - OLLAMA_HOST=0.0.0.0:11434
    - OLLAMA_MODELS=/root/.ollama/models
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_api,pmoves_external
    volumes:
    - pmoves-ollama-models:/root/.ollama/models
    # Prevent transient Docker embedded-DNS failures from blocking model pull.
    dns:
    - ${OLLAMA_DNS_PRIMARY:-1.1.1.1}
    - ${OLLAMA_DNS_SECONDARY:-8.8.8.8}
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
        limits:
          cpus: '4.0'
          memory: 8G
    ports:
    - ${OLLAMA_BIND:-0.0.0.0}:${OLLAMA_HOST_PORT:-11435}:11434
    networks:
    - pmoves_api
    - pmoves_external
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  nvidia-nim:
    <<: *tier-llm-hardened
    image: nvcr.io/nim/nvidia/llama-3_3-nemotron-super-49b-v1:1.8.3
    restart: unless-stopped
    environment:
      # Keep base compose validation non-fatal when the nim profile is unused.
      # Operators launching NIM should still set NGC_API_KEY explicitly.
    - NGC_API_KEY=${NGC_API_KEY:-}
    - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    - PMOVES_NETWORKS=pmoves_api,pmoves_bus,pmoves_monitoring
    ports:
    - "${NIM_BIND:-127.0.0.1}:${NIM_HOST_PORT:-8200}:8000"
    profiles: ["gpu", "nim"]
    networks:
    - pmoves_api
      # pmoves_bus: publish mesh.gpu.model.loaded.v1 / .unloaded.v1 for model-registry sync
    - pmoves_bus
    - pmoves_monitoring
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  gpu-orchestrator:
    env_file:
    - env.shared
    - env.tier-llm
    - env.tier-api
    build:
      context: ./services/gpu-orchestrator
      dockerfile: Dockerfile
    image: ${GPU_ORCHESTRATOR_IMAGE:-ghcr.io/powerfulmoves/pmoves-gpu-orchestrator:latest@sha256:cbfbcbfa779ad83b720c1fa1527e0258d192f5d01c6d26d62aa247d501f8693a}
    restart: unless-stopped
    environment:
    - NVIDIA_VISIBLE_DEVICES=all
    - GPU_MODELS_CONFIG=/config/gpu-models.yaml
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://pmoves-ollama:11434}
    - VLLM_BASE_URL=${VLLM_BASE_URL:-http://pmoves-vllm:8000}
    - TTS_BASE_URL=${TTS_BASE_URL:-http://ultimate-tts-studio:7861}
    - GPU_ORCHESTRATOR_MAX_MODELS=${GPU_ORCHESTRATOR_MAX_MODELS:-3}
    - GPU_ORCHESTRATOR_VRAM_THRESHOLD=${GPU_ORCHESTRATOR_VRAM_THRESHOLD:-0.9}
    - NATS_URL=${NATS_URL}
    - MODEL_REGISTRY_URL=${MODEL_REGISTRY_URL:-http://model-registry:8110}
    - PMOVES_NETWORKS=pmoves_api,pmoves_bus,pmoves_monitoring
    volumes:
      # SECURITY: Docker socket required for spawning GPU model containers.
      # Mounted read-only with hardened security context (no-new-privileges, cap_drop).
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./config/gpu-models.yaml:/config/gpu-models.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
        limits:
          cpus: '4.0'
          memory: 8G
    cap_drop:
    - ALL
    profiles:
    - gpu
    networks:
    - pmoves_api
    - pmoves_bus
    - pmoves_monitoring
    ports:
    - ${GPU_ORCHESTRATOR_BIND:-127.0.0.1}:${GPU_ORCHESTRATOR_HOST_PORT:-8200}:8200
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      nats:
        condition: service_healthy
        required: false
      model-registry:
        condition: service_healthy
        required: false

  # NVIDIA NIM - Llama-3.3-Nemotron-Super-49B inference server (~30GB VRAM)
  # Default host port is 8200 (NOT 8000) to avoid colliding with supabase-kong,
  # which binds 8000 by default. Override via NIM_HOST_PORT.
  llama-throughput-lab:
    build:
      context: ../PMOVES-llama-throughput-lab
      dockerfile: Dockerfile
    image: ${LLAMA_THROUGHPUT_LAB_IMAGE:-ghcr.io/powerfulmoves/pmoves-llama-throughput-lab:latest}
    restart: "no"
    environment:
    - LLAMA_MODEL_PATH=/models/${LLAMA_MODEL:-model.gguf}
    - LLAMA_SERVER_HOST=127.0.0.1
    - LLAMA_RESULTS_DIR=/results
    - NATS_URL=${NATS_URL}
    - CIPHER_MEMORY_URL=${CIPHER_MEMORY_URL:-http://cipher-api:8105}
    - GPU_ORCHESTRATOR_URL=http://gpu-orchestrator:8200
    - METRICS_PORT=8201
    - PMOVES_NETWORKS=pmoves_api,pmoves_bus,pmoves_monitoring
    volumes:
    - ${LLAMA_MODELS_PATH:-./models}:/models:ro
    - llama-results:/results
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
        limits:
          cpus: '4.0'
          memory: 8G
    depends_on:
      nats:
        condition: service_healthy
        required: false
    profiles:
    - benchmarks
    - gpu
    networks:
    - pmoves_api
    - pmoves_bus
    - pmoves_monitoring
    ports:
    - ${LLAMA_LAB_BIND:-0.0.0.0}:8201:8201

  # =============================================================================
  # GitHub Automation Services (Phase 3)
  # =============================================================================
  # Additional GitHub automation services (branch naming, cross-repo sync, PR automation)
  # Profile: github-automation
  # Networks: pmoves_app, pmoves_api, pmoves_bus, pmoves_monitoring
  # Note: github-branch-cleanup and github-issue-triage are defined above
  # =============================================================================

  comfy-watcher:
    build:
      context: .
      dockerfile: services/comfy-watcher/Dockerfile
    restart: unless-stopped
    <<: *tier-worker-hardened
    environment:
      # NATS_URL from env.shared/env.tier-worker has credentials: nats://nats:***@nats:4222
    - MINIO_ENDPOINT=${MINIO_ENDPOINT:-${S3_ENDPOINT:-minio:9000}}
    - MINIO_ACCESS_KEY=${MINIO_USER:?Run make brand-defaults}
    - MINIO_SECRET_KEY=${MINIO_PASSWORD:?Run make brand-defaults}
    - MINIO_BUCKET=${MINIO_BUCKET:-pmoves-comfyui}
    - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-${S3_PUBLIC_BASE_URL:-http://${MINIO_ENDPOINT:-${S3_ENDPOINT:-minio:9000}}}}
    - PRESIGN_EXPIRES_HOURS=${PRESIGN_EXPIRES_HOURS:-24}
    - PMOVES_NETWORKS=pmoves_bus,pmoves_data
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
    - comfy-watcher-output:/data
    - comfy-watcher-state:/state
    profiles: ["orchestration", "workers"]
    networks: [pmoves_bus, pmoves_data]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, sys; sys.exit(0 if os.path.exists('/state') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Gateway Agent - Orchestrates 100+ MCP tools via Agent Zero MCP API
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
