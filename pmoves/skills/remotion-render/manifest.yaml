# Remotion Rendering Skill
# Thread 4.2: Calls A2UI renderer service to produce animated content

name: remotion-render
version: "1.0.0"
description: "Render A2UI animation specs into MP4/GIF/WebM via the Remotion renderer service"
author: PMOVES.AI

# Skill configuration
ultrathink: true
category: visualization
tier: agent

# Input schema
input:
  type: object
  required: [a2ui_spec]
  properties:
    a2ui_spec:
      type: object
      description: "A2UI animation JSON spec (see a2ui-animation-schema.json). Text and heading elements may opt into text_layout.engine=pretext with maxWidth, lineHeight, letterSpacing, wordBreak, whiteSpace, maxLines, shrinkWrap, and debugBoxes for caption-safe or living-doc renders."
    format:
      type: string
      enum: [mp4, gif, webm]
      default: mp4
    quality:
      type: string
      enum: [draft, standard, high]
      default: standard

# Output schema
output:
  type: object
  properties:
    url:
      type: string
      description: "URL to rendered video (MinIO presigned)"
    format:
      type: string
    duration_ms:
      type: integer
    scenes:
      type: integer
    layout_summary:
      type: object
      description: "Inventory of text layout usage, including how many text elements requested Pretext-driven wrapping."

# Service endpoint
service:
  url: "http://localhost:8105/render"
  method: POST
  timeout_ms: 120000
  alternates:
    - "http://localhost:8105/render/provenance"

# Headless one-shot render (no running service required).
# Use when the a2ui-renderer service is not up (cold node, CI, local check):
# runs the Remotion bundler + renderer directly from the package.
headless_render:
  cwd: pmoves/services/a2ui-renderer
  setup: "npm install   # first run also downloads a headless Chromium shell (~108MB, cached)"
  commands:
    still: "npm run render:provenance:still   # PNG thumbnail"
    video: "npm run render:provenance:file    # MP4"
    custom: "npx tsx scripts/render-provenance-artifact.mjs [--frame N | --frame-fraction 0..1] [input.json] [output.{png,jpg,mp4,webm,gif}]"
  notes:
    - "Output kind is chosen by extension: .png/.jpg/.jpeg = still, .mp4/.webm/.gif = full animation."
    - "Stills default to a mid-timeline frame (--frame-fraction 0.5). Do NOT thumbnail at frame 0: every element reveals from opacity 0 over the first ~70 frames, so frame 0 is a blank intro."
    - "Override the still frame with --frame <N> (absolute, wins) or --frame-fraction <0..1>. The script clamps to the composition length and reports the chosen frame in its JSON result."

# Dependencies
dependencies:
  services:
    - a2ui-renderer  # Port 8105
    - minio          # Asset storage
    - presign        # URL generation
  nats_subjects:
    - skills.pipeline.research-render.v1
    - skills.pipeline.model-benchmark-viz.v1
  notes:
    - "The PMOVES lane currently consumes the @chenglou/pretext package surface while tracking POWERFULMOVES/Pmoves-pretext as the living-docs alignment fork."
    - "Use /render/provenance for direct living-doc artifacts when the caller already has weighted terms, sections, and provenance refs."

# Agent binding
agent: creator
theme: megaman/dr-wily
