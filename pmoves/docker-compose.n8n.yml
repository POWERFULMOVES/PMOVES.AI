# YAML anchors for tier-based env file loading
x-env-tier-worker: &env-tier-worker
  env_file:
    - path: env.tier-worker
      required: false

services:
  n8n:
    build:
      context: ../PMOVES-n8n
      dockerfile: compose/n8n/Dockerfile
    image: pmoves/n8n:2.1.0-runtime
    container_name: pmoves-n8n
    restart: unless-stopped
    <<: *env-tier-worker
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=localhost
      - N8N_SECURE_COOKIE=false
      - N8N_DEFAULT_TIMEZONE=${TZ:-America/New_York}
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=${TZ:-America/New_York}
      - TZ=${TZ:-America/New_York}
      - N8N_RUNNERS_ENABLED=${N8N_RUNNERS_ENABLED:-true}
      # Default to internal mode so n8n doesn't crash-loop when external runner
      # auth token is unset. Set N8N_RUNNERS_MODE=external for split-runner deployments.
      - N8N_RUNNERS_MODE=${N8N_RUNNERS_MODE:-internal}
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-}
      - N8N_RUNNERS_PAYLOAD_MODE=filesystem
      - N8N_PUBLIC_API_ENABLED=true
      # Public API auth (n8n >= 1.0)
      - N8N_API_AUTH_ACTIVE=true
      # External integrations for sync flows
      - WGER_BASE_URL=${WGER_BASE_URL:-http://cataclysm-wger:8000}
      - FIREFLY_BASE_URL=${FIREFLY_BASE_URL:-http://cataclysm-firefly:8080}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_NATIVE_PYTHON_RUNNER=true
      # Supabase REST — use tier-based URL from env.tier-api
      - SUPABASE_REST_URL=${SUPABASE_REST_URL:-http://postgrest:3000}
      - SUPA_REST_URL=${SUPA_REST_URL:-${SUPABASE_REST_URL:-http://postgrest:3000/rest/v1}}
      # Agent Zero in same compose project (service name)
      - AGENT_ZERO_BASE_URL=${AGENT_ZERO_BASE_URL:-http://agent-zero:8080}
      # Discord webhook for echo publisher
      - DISCORD_WEBHOOK_USERNAME=${DISCORD_WEBHOOK_USERNAME:-PMOVES Publisher}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      # Voice agent model routing (cascades: VOICE_AGENT_MODEL → OPENAI_MODEL → TensorZero → gpt-4o-mini)
      - VOICE_AGENT_MODEL=${VOICE_AGENT_MODEL:-}
      - TENSORZERO_BASE_URL=${TENSORZERO_BASE_URL:-http://tensorzero-gateway:3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Flute Gateway for Whisper STT + TTS
      - FLUTE_GATEWAY_URL=${FLUTE_GATEWAY_URL:-http://flute-gateway:8055}
      # Hi-RAG v2 for knowledge retrieval
      - HIRAG_URL=${HIRAG_URL:-http://hi-rag-gateway-v2-cpu:8086}
      - N8N_LOG_LEVEL=debug
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    ports: ["5678:5678"]
    networks: [cataclysm]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n-data:/home/node/.n8n
      - ../PMOVES-n8n/workflows:/flows:ro
  n8n-runners:
    image: n8nio/runners:2.1.0
    container_name: pmoves-n8n-runners
    restart: unless-stopped
    <<: *env-tier-worker
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=300
    depends_on:
      - n8n
    networks: [cataclysm]
    volumes:
      - n8n-data:/home/node/.n8n
volumes:
  n8n-data: {}
