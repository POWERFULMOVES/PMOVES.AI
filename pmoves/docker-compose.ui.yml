##############################################################################
# PMOVES.AI - Docker Compose Overlay: UI Services
##############################################################################
# Services: ui tier
# Always combine with base: docker compose -f docker-compose.base.yml -f docker-compose.ui.yml up -d
#
# Generated from docker-compose.yml by scripts/split_compose.py
##############################################################################
services:
  pmoves-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [env.shared.generated, env.shared, env.tier-ui, .env.generated, .env.local]
    environment:
    - NODE_ENV=production
    - HOSTNAME=0.0.0.0
      # Room manifests — the rooms API reads catalog.json + the per-room
      # manifests from this directory. Without it, the Rooms tab on the
      # home page renders "Room manifests are not available yet" and
      # /api/rooms returns 500. PMOVES_ROOM_CONFIG_DIR overrides the
      # default (cwd/../config/rooms) to a path inside the container
      # where the rooms data is mounted. The volume below maps the host
      # pmoves/config/rooms to /app/rooms:ro so the standalone Next.js
      # build can read the room data.
    - PMOVES_ROOM_CONFIG_DIR=/app/rooms
      # Supabase
    - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:8000}
    - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-${ANON_KEY:-${SUPABASE_PUBLISHABLE_KEY:-}}}
    - NEXT_PUBLIC_SUPABASE_REST_URL=${NEXT_PUBLIC_SUPABASE_REST_URL:-http://localhost:8000/rest/v1}
      # Voice/TTS
    - NEXT_PUBLIC_FLUTE_GATEWAY_URL=${NEXT_PUBLIC_FLUTE_GATEWAY_URL:-http://localhost:8055}
    - NEXT_PUBLIC_FLUTE_WS_URL=${NEXT_PUBLIC_FLUTE_WS_URL:-ws://localhost:8056}
      # Agent Services (client-side needs localhost)
    - NEXT_PUBLIC_AGENT_ZERO_URL=${NEXT_PUBLIC_AGENT_ZERO_URL:-http://localhost:8080}
    - NEXT_PUBLIC_AGENT_ZERO_UI_URL=${NEXT_PUBLIC_AGENT_ZERO_UI_URL:-http://localhost:8081}
    - NEXT_PUBLIC_ARCHON_URL=${NEXT_PUBLIC_ARCHON_URL:-http://localhost:8091}
    - NEXT_PUBLIC_ARCHON_UI_URL=${NEXT_PUBLIC_ARCHON_UI_URL:-http://localhost:3737}
      # Knowledge & Search
    - NEXT_PUBLIC_HIRAG_URL=${NEXT_PUBLIC_HIRAG_URL:-http://localhost:8086}
    - NEXT_PUBLIC_OPEN_NOTEBOOK_API_URL=${NEXT_PUBLIC_OPEN_NOTEBOOK_API_URL:-http://localhost:5055}
    - NEXT_PUBLIC_TENSORZERO_UI_URL=${NEXT_PUBLIC_TENSORZERO_UI_URL:-http://localhost:4000}
      # Media & Ingestion
    - NEXT_PUBLIC_PRESIGN_URL=${NEXT_PUBLIC_PRESIGN_URL:-http://localhost:8088}
    - NEXT_PUBLIC_PMOVES_YT_BASE_URL=${NEXT_PUBLIC_PMOVES_YT_BASE_URL:-http://localhost:8077}
    - NEXT_PUBLIC_CHANNEL_MONITOR_STATS_URL=${NEXT_PUBLIC_CHANNEL_MONITOR_STATS_URL:-http://localhost:8097/api/monitor/stats}
      # Token Economy Simulation
    - NEXT_PUBLIC_TOKENISM_URL=${NEXT_PUBLIC_TOKENISM_URL:-http://localhost:8103}
      # Monitoring Stack
    - NEXT_PUBLIC_GRAFANA_URL=${NEXT_PUBLIC_GRAFANA_URL:-http://localhost:3002}
    - NEXT_PUBLIC_PROMETHEUS_URL=${NEXT_PUBLIC_PROMETHEUS_URL:-http://localhost:9090}
    - NEXT_PUBLIC_LOKI_URL=${NEXT_PUBLIC_LOKI_URL:-http://localhost:3100}
      # Server-side health checks: rewrite localhost → host.docker.internal
    - HEALTH_CHECK_HOST=host.docker.internal
      # Server-side only (Docker hostnames OK)
    - POSTGREST_URL=${POSTGREST_URL:-http://supabase-kong:8000/rest/v1}
    - PRESIGN_SHARED_SECRET=${PRESIGN_SHARED_SECRET}
    - RENDER_WEBHOOK_URL=${RENDER_WEBHOOK_URL:-http://render-webhook:8085/comfy/webhook}
    - OPEN_NOTEBOOK_API_URL=${OPEN_NOTEBOOK_API_URL:-http://open-notebook:5055}
    - TOKENISM_URL=${TOKENISM_URL:-http://pmoves-tokenism-simulator-1:8100}
    - PMOVES_NETWORKS=pmoves_app,pmoves_api,pmoves_external
    extra_hosts:
    - "host.docker.internal:host-gateway"
    # Room manifests: the standalone Next.js build can't read host
    # files by default; mount pmoves/config/rooms read-only at /app/rooms
    # so the rooms API (/api/rooms) and the home-page Rooms tab work.
    volumes:
    - ./config/rooms:/app/rooms:ro
    ports:
    - "${PMOVES_UI_BIND:-0.0.0.0}:4482:3000"
    # Note: flute-gateway is optional (for voice features). Start with workers profile for full functionality.
    networks: [pmoves_app, pmoves_api, pmoves_external]
    profiles: ["ui"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Session Context Worker - Transforms Claude Code session context to Hi-RAG KB entries
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  tokenism-ui:
    build:
      context: ./PMOVES-ToKenism-Multi/pmoves-nextjs
      dockerfile: Dockerfile
    image: ${TOKENISM_UI_IMAGE:-ghcr.io/powerfulmoves/pmoves-tokenism-ui:pmoves-latest}
    restart: unless-stopped
    <<:
      env_file:
      - env.shared
      - env.tier-ui
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      read_only: true
      tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /var/tmp:noexec,nosuid,size=64m

    environment:
    - NEXT_PUBLIC_TOKENISM_URL=${TOKENISM_UI_API_URL:-http://tokenism-simulator:8100}
    - NODE_ENV=production
    - PORT=8504
    - PMOVES_NETWORKS=pmoves_app
    ports: ["${TOKENISM_UI_BIND:-0.0.0.0}:${TOKENISM_UI_HOST_PORT:-8504}:8504"]
    profiles: ["agents", "botz"]
    networks: [pmoves_app]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8504/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Consciousness Service - CHR Algorithm & CGP Generation (port 8106)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  tokenism-simulator:
    build:
      context: .
      dockerfile: services/tokenism-simulator/Dockerfile
    image: ${TOKENISM_IMAGE:-ghcr.io/powerfulmoves/pmoves-tokenism-simulator:edge}
    restart: unless-stopped
    <<:
      env_file:
      - env.shared
      - env.tier-agent
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      read_only: true
      tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /var/tmp:noexec,nosuid,size=64m

    environment:
    # NATS_URL from env.shared/env.tier-agent has credentials: nats://nats:***@nats:4222
    - TOKENISM_HOST=${TOKENISM_HOST:-0.0.0.0}
    - TOKENISM_PORT=${TOKENISM_PORT:-8100}
    - FLASK_ENV=${FLASK_ENV:-production}
    # CHIT fail-closed signing (house pattern, mirrors hi-rag-gateway*)
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - SECRET_KEY=${SECRET_KEY:-pmoves-tokenism-secret}
    - NATS_URL=${NATS_URL}
    - NATS_CLIENT_NAME=tokenism-simulator
    - NATS_JETSTREAM=${NATS_JETSTREAM:-true}
    - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
    - TENSORZERO_MODEL=${TENSORZERO_MODEL:-claude-sonnet-4-5}
    - SUPABASE_URL=${SUPABASE_URL:-http://supabase-kong:8000}
    - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    - AGENTZERO_URL=${AGENTZERO_URL:-http://agent-zero:8080}
    - AGENTZERO_MCP_ENABLED=${AGENTZERO_MCP_ENABLED:-true}
    - CHIT_ENABLED=${CHIT_ENABLED:-true}
    - GEOMETRY_BUS_URL=${GEOMETRY_BUS_URL:-${NATS_URL}}
    - LOG_LEVEL=${LOG_LEVEL:-INFO}
    - PMOVES_NETWORKS=pmoves_app,pmoves_api,pmoves_bus,pmoves_monitoring
    ports: ["${TOKENISM_BIND:-0.0.0.0}:${TOKENISM_HOST_PORT:-8103}:8100"]
    profiles: ["agents", "orchestration", "botz"]
    depends_on: [nats]
    networks: [pmoves_app, pmoves_api, pmoves_bus, pmoves_monitoring]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PMOVES Tokenism UI - Interactive dashboard for token economy simulation
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  invidious:
    # F-07: pinned by digest for reproducible/supply-chain-safe default.
    # Override INVIDIOUS_IMAGE (e.g. ...:latest) to track newer builds.
    image: ${INVIDIOUS_IMAGE:-quay.io/invidious/invidious@sha256:9d972ea5930c2e170b3c4d49bdd9fa09bf03f077d555f58747342062dffc5876}
    restart: unless-stopped
    env_file:
    - env.shared
    environment:
    - INVIDIOUS_HMAC_KEY=${INVIDIOUS_HMAC_KEY:-c51f3b3a42fbf044a9b1094eadbc79743b0d859999441d3dcfce55f5ad64a9a1}
    - INVIDIOUS_COMPANION_KEY=${INVIDIOUS_COMPANION_KEY:-60eec5b733160c57}
    - "INVIDIOUS_CONFIG=db:\n  dbname: ${INVIDIOUS_PG_DB:-invidious}\n  user: ${INVIDIOUS_PG_USER:-kemal}\n  password: ${INVIDIOUS_PG_PASSWORD:-kemal}\n  host: invidious-db\n  port: 5432\n  check_tables:
      true\ndomain: ${INVIDIOUS_DOMAIN:-}\nexternal_port: ${INVIDIOUS_EXTERNAL_PORT:-3000}\nhttps_only: ${INVIDIOUS_HTTPS_ONLY:-false}\nhmac_key: \"${INVIDIOUS_HMAC_KEY:-c51f3b3a42fbf044a9b1094eadbc79743b0d859999441d3dcfce55f5ad64a9a1}\"\
      \ninvidious_companion:\n  - private_url: \"http://invidious-companion:8282\"\n    public_url: \"${INVIDIOUS_COMPANION_PUBLIC_URL:-http://localhost:8281}\"\ninvidious_companion_key: \"${INVIDIOUS_COMPANION_KEY:-60eec5b733160c57}\"\
      \nstatistics_enabled: ${INVIDIOUS_STATISTICS_ENABLED:-false}\nuse_innertube_for_captions: ${INVIDIOUS_USE_INNERTUBE_CAPTIONS:-true}\nredirector:\n  use_invidious_redirector: ${INVIDIOUS_USE_REDIRECTOR:-true}\n\
      \  redirector_url: \"${INVIDIOUS_REDIRECTOR_URL:-https://redirect.invidious.io}\"\n"
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    ports:
    - ${INVIDIOUS_BIND:-127.0.0.1}:${INVIDIOUS_PORT:-3000}:3000
    depends_on:
      invidious-db:
        condition: service_healthy
      invidious-companion:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3000/api/v1/stats >/dev/null 2>&1 || wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
    - invidious
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_external  # YouTube + Invidious redirect API
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  invidious-companion:
    # F-07: pinned by digest for reproducible/supply-chain-safe default.
    # Override INVIDIOUS_COMPANION_IMAGE (e.g. ...:latest) to track newer builds.
    image: ${INVIDIOUS_COMPANION_IMAGE:-quay.io/invidious/invidious-companion@sha256:4dbe5c51811cf049ceeb690fe39040896734acce9c0dd7344519d6e2b4345c0b}
    restart: unless-stopped
    env_file:
    - env.shared
    environment:
    - PORT=8282
    - HOST=0.0.0.0
    - SERVER_SECRET_KEY=${INVIDIOUS_COMPANION_KEY:-60eec5b733160c57}
    - CACHE_DIRECTORY=/var/tmp/youtubei.js
    - SERVER_BASE_URL=${INVIDIOUS_COMPANION_PUBLIC_URL:-}
    - YOUTUBE_API_KEY=${INVIDIOUS_COMPANION_YOUTUBE_API_KEY:-}
    - YOUTUBEI_CLIENT=${INVIDIOUS_COMPANION_YOUTUBEI_CLIENT:-IOS}
    - YOUTUBEI_API_BASE=${INVIDIOUS_COMPANION_CA_URL:-https://www.youtube.com}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    volumes:
    - invidious-companion-cache:/var/tmp/youtubei.js
    ports:
    - ${INVIDIOUS_COMPANION_BIND:-127.0.0.1}:${INVIDIOUS_COMPANION_PORT:-8282}:8282
    profiles:
    - invidious
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_external  # YouTube innertube API
    # The invidious-companion image is a compiled Deno binary with NO shell
    # and NO wget/curl — CMD-SHELL based healthchecks fail every time (Phase
    # 9P observed 760+ failing streak despite service working normally).
    # Docker has no way to HTTP-probe without invoking something in the
    # container, so we disable the healthcheck. Liveness is still monitored
    # via Prometheus scraping (service exposes metrics) and the PMOVES.YT
    # fallback flow surfaces actual unhealthy states as 5xx response chains.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  invidious-companion-proxy:
    build: ./services/invidious-companion-proxy
    restart: unless-stopped
    depends_on:
      invidious-companion:
        condition: service_started
    ports:
    - ${INVIDIOUS_PROXY_BIND:-0.0.0.0}:8281:80
    profiles:
    - invidious
    networks:
    - pmoves_app
    - pmoves_bus
    environment:
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ || wget -qO- http://localhost:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  # Llama.cpp throughput benchmarking toolkit (GPU, on-demand)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  grayjay-plugin-host:
    build: ./services/grayjay-plugin-host
    restart: unless-stopped
    env_file:
    - env.shared.generated
    - env.shared
    - .env.generated
    - .env.local
    environment:
    - JELLYFIN_PUBLIC_URL=${JELLYFIN_PUBLIC_BASE_URL:-http://localhost:8096}
    - GRAYJAY_PLUGIN_HOST_PUBLIC_URL=${GRAYJAY_PLUGIN_HOST_PUBLIC_URL:-http://localhost:9096}
    - GRAYJAY_PLUGIN_REGISTRY_TITLE=${GRAYJAY_PLUGIN_REGISTRY_TITLE:-PMOVES Plugin Registry}
    - GRAYJAY_JELLYFIN_PLUGIN_NAME=${GRAYJAY_JELLYFIN_PLUGIN_NAME:-PMOVES Jellyfin}
    - GRAYJAY_JELLYFIN_PLUGIN_DESCRIPTION=${GRAYJAY_JELLYFIN_PLUGIN_DESCRIPTION:-Self-hosted Jellyfin connector for PMOVES}
    - GRAYJAY_JELLYFIN_PLUGIN_ID=${GRAYJAY_JELLYFIN_PLUGIN_ID:-pmoves-jellyfin}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus
    ports:
    - ${GRAYJAY_BIND:-127.0.0.1}:${GRAYJAY_PLUGIN_HOST_PORT:-9096}:8080
    profiles:
    - grayjay
    networks:
    - pmoves_app
    - pmoves_bus
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  grayjay-server:
    # F-07: env-overridable so it can be pinned at deploy (previously a hard :latest).
    # TODO: pin default by digest — FUTO registry (registry.gitlab.futo.org) was
    # unreachable from the authoring node, so digest could not be resolved here.
    image: ${GRAYJAY_IMAGE:-registry.gitlab.futo.org/videostreaming/grayjay/grayjay:latest}
    restart: unless-stopped
    env_file:
    - env.shared.generated
    - env.shared
    - .env.generated
    - .env.local
    environment:
    - GRAYJAY_PLUGIN_REGISTRY_URL=${GRAYJAY_PLUGIN_REGISTRY_URL:-http://grayjay-plugin-host:8080/plugins}
    - GRAYJAY_SERVER_BIND=${GRAYJAY_SERVER_BIND:-127.0.0.1}
    - GRAYJAY_SERVER_PORT=${GRAYJAY_SERVER_PORT:-9095}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus
    ports:
    - ${GRAYJAY_BIND:-127.0.0.1}:${GRAYJAY_SERVER_PORT:-9095}:9095
    depends_on:
      grayjay-plugin-host:
        condition: service_started
    profiles:
    - grayjay
    networks:
    - pmoves_app
    - pmoves_bus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9095/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
