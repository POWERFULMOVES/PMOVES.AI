# Nginx Reverse Proxy Configuration for PMOVES VPS
# Place at: /etc/nginx/sites-available/pmoves
# Enable with: ln -s /etc/nginx/sites-available/pmoves /etc/nginx/sites-enabled/

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;

# Upstream servers
upstream botz_gateway {
    server 127.0.0.1:2091;
    keepalive 32;
}

upstream dox_backend {
    server kvm4-2.internal:8484;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.pmoves.io dox.pmoves.io;
    return 301 https://$host$request_uri;
}

# BoTZ MCP Gateway (api.pmoves.io)
server {
    listen 443 ssl http2;
    server_name api.pmoves.io;

    ssl_certificate /etc/letsencrypt/live/api.pmoves.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pmoves.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # MCP JSON-RPC endpoint
    location /mcp {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://botz_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Tool call endpoint
    location /call {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://botz_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Tools listing
    location /tools {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://botz_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check (public, no rate limit)
    location /health {
        proxy_pass http://botz_gateway;
    }

    # A2A manifest
    location /.well-known/agent.json {
        proxy_pass http://botz_gateway;
    }
}

# DoX Document Intelligence (dox.pmoves.io)
server {
    listen 443 ssl http2;
    server_name dox.pmoves.io;

    ssl_certificate /etc/letsencrypt/live/dox.pmoves.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dox.pmoves.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client body size for file uploads
    client_max_body_size 100M;

    # Upload endpoint (stricter rate limit)
    location /upload {
        limit_req zone=upload burst=3 nodelay;
        proxy_pass http://dox_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;  # Long timeout for PDF processing
    }

    # API endpoints
    location / {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://dox_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health check (public, no rate limit)
    location /healthz {
        proxy_pass http://dox_backend;
    }
}

