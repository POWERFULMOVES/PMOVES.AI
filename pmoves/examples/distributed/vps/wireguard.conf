# WireGuard Client Configuration (Home Network)
# Place at: /etc/wireguard/wg0.conf

[Interface]
# Generate with: wg genkey | tee privatekey | wg pubkey > publickey
PrivateKey = <home-private-key>
Address = 10.0.0.2/24
DNS = 1.1.1.1

# Optional: Only route VPS traffic through tunnel
# PostUp = ip route add kvm4-1.internal via 10.0.0.1
# PostUp = ip route add kvm4-2.internal via 10.0.0.1

[Peer]
# KVM2 Exit Node public key
PublicKey = <vps-public-key>
Endpoint = exit.pmoves.io:51820
AllowedIPs = 10.0.0.0/24, kvm4-1.internal/32, kvm4-2.internal/32
PersistentKeepalive = 25

# ==============================================================================
# WireGuard Server Configuration (KVM2 Exit Node)
# Place at: /etc/wireguard/wg0.conf on KVM2
# ==============================================================================
#
# [Interface]
# PrivateKey = <vps-private-key>
# Address = 10.0.0.1/24
# ListenPort = 51820
# PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
# PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
#
# [Peer]
# # Home network
# PublicKey = <home-public-key>
# AllowedIPs = 192.168.1.0/24, 10.0.0.2/32
#
# [Peer]
# # Tokenism workstation
# PublicKey = <tokenism-public-key>
# AllowedIPs = 10.0.0.3/32
