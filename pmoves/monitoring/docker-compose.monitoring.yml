# Relative bind paths here resolve against the COMPOSE PROJECT DIRECTORY, not
# against this file's directory. `up-obs` runs:
#
#   docker compose -p monitoring -f $(CURDIR)/monitoring/docker-compose.monitoring.yml #     --project-directory $(CURDIR) up -d
#
# so `--project-directory` is pmoves/, and a bare `./prometheus` resolved to
# pmoves/prometheus -- which does not exist. Docker then CREATES an empty
# directory there, and the container fails at exec/config time with a message
# that points at permissions or a missing config rather than at the real cause.
# Worse, the directory Docker created makes the source "exist", so every retry
# fails identically forever.
#
# Measured 2026-08-21 on a cold start: pmoves/{prometheus,loki,promtail,grafana,
# blackbox} were all 0 files and untracked, while pmoves/monitoring/* held the
# real configs (4, 1, 1, 26, 1 files). Prometheus, Loki, Promtail and Blackbox
# were crash-looping. It was latent -- the running containers predated the drift,
# so it would only ever have surfaced on an unattended restart.
#
# Paths are therefore written relative to the project directory (./monitoring/*).
# If --project-directory is ever dropped from up-obs, these must change back.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [monitoring_tier, pmoves_api, pmoves_app, pmoves_data, pmoves_net]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_HOST_PORT:-3002}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning/dashboards:ro
    networks: [monitoring_tier, pmoves_net]

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["${LOKI_HOST_PORT:-3100}:3100"]
    volumes:
      # Mount the entire config directory to avoid file-vs-dir bind issues on Windows/WSL paths.
      - ./monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    networks: [monitoring_tier, pmoves_net]

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail:/etc/promtail:ro
    networks: [monitoring_tier]

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    ports: ["${BLACKBOX_HOST_PORT:-9115}:9115"]
    volumes:
      - ./monitoring/blackbox:/etc/blackbox_exporter:ro
    networks: [monitoring_tier, pmoves_api, pmoves_app, pmoves_data, pmoves_net]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    pid: host
    network_mode: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    profiles: ["linux-node"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/lib/containerd/io.containerd.snapshotter.v1.overlayfs:/rootfs/var/lib/docker/image/overlayfs:ro
    ports:
      - "${CADVISOR_HOST_PORT:-9180}:8080"
    networks: [monitoring_tier]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles: ["linux"]

  # NATS bus metrics. The bus was the ONE component nothing watched: measured
  # 2026-09-15, Prometheus had 46 active targets and ZERO nats ones.
  #
  # WHY AN EXPORTER AND NOT A DIRECT SCRAPE: nats' monitoring endpoint serves
  # JSON (/varz, /jsz, /leafz), not Prometheus text — prometheus cannot read it.
  #
  # WHY BRIDGED ONTO TWO NETWORKS: prometheus sits on pmoves-net/_api/_app/_data/
  # _monitoring; nats sits on pmoves_bus/pmoves_external. They share NONE, so
  # there was no path to scrape even if the format had matched. This container
  # joins pmoves_bus (to read nats:8222) and monitoring_tier (so prometheus can
  # read it) — the same "run on the network, don't add a host hop" reasoning the
  # amd-gpu exporter comment in prometheus.yml records.
  #
  # MEASURED on first bring-up, so the flags are not aspirational:
  #   gnatsd_varz_connections            18      (matches /varz)
  #   gnatsd_leafz_conn_nodes_total       0      <- mesh signal, currently islanded
  #   gnatsd_varz_jetstream_stats_storage 0      <- durability signal
  #
  # -jsz=all is accepted but emits NO gnatsd_jsz_* series while streams=0 —
  # there is nothing to enumerate. It populates once durable streams exist
  # again (see the /tmp store_dir fix). Until then the durability signal comes
  # from gnatsd_varz_jetstream_stats_{storage,memory}, which read 0 and thereby
  # corroborate that PMOVES-PERSONA is gone. Keep the flag: it costs nothing and
  # is the series you want the moment streams return.
  # -leafz is the mesh signal for fleet geo-bus confirmation.
  # No host port: prometheus reaches it over the network.
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.20.2
    restart: unless-stopped
    command:
      - -port=7777
      - -varz
      - -jsz=all
      - -leafz
      - -connz
      - -subz
      - -routez
      - http://nats:8222
    networks: [monitoring_tier, pmoves_bus]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7777/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  monitoring_tier:
    external: true
    name: pmoves_monitoring
  # The in-stack bus network (internal: true). Joined ONLY by nats-exporter so it
  # can reach nats:8222; nothing here publishes a port onto it.
  pmoves_bus:
    external: true
    name: pmoves_bus
  pmoves_api:
    external: true
    name: pmoves_api
  pmoves_app:
    external: true
    name: pmoves_app
  pmoves_data:
    external: true
    name: pmoves_data
  pmoves_net:
    external: true
    name: pmoves-net

volumes:
  prometheus-data: {}
  grafana-data: {}
  loki-data: {}
