global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules configuration
rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # DISABLED: Requires node_exporter installed on host
  # - job_name: node
  #   static_configs:
  #     - targets: ["host.docker.internal:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # === Direct /metrics scraping ===
  # Services that expose Prometheus metrics endpoint

  - job_name: flute-gateway
    static_configs:
      - targets: ["flute-gateway:8055"]

  - job_name: tensorzero-gateway
    static_configs:
      - targets: ["tensorzero-gateway:3000"]

  - job_name: deepresearch-metrics
    static_configs:
      - targets: ["deepresearch:8098"]

  - job_name: supaserch-metrics
    static_configs:
      - targets: ["supaserch:8099"]

  - job_name: neo4j
    static_configs:
      - targets: ["neo4j:2004"]
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: gpu-orchestrator
    static_configs:
      - targets: ["gpu-orchestrator:8200"]

  # otel-collector liveness: the image is distroless so Docker healthchecks
  # can't run inside it (docker-compose.tracing.yml disables them) — this
  # scrape of the collector's Prometheus exporter is the external liveness
  # probe: up{job="otel-collector"} drops to 0 if the collector dies.
  # Container name (not service name): prometheus lives in the monitoring
  # compose project and reaches the collector over the shared
  # pmoves_monitoring network.
  - job_name: otel-collector
    static_configs:
      - targets: ["pmoves-otel-collector:8889"]

  # === Tier 2 Services (Added 2025-12-24) ===

  - job_name: hi-rag-gateway-v2
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://hi-rag-gateway-v2:8086/hirag/admin/stats"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: extract-worker
    static_configs:
      - targets: ["extract-worker:8083"]

  - job_name: pmoves-yt
    static_configs:
      - targets: ["pmoves-yt:8077"]

  - job_name: agent-zero
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://agent-zero:80/"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: archon
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      # Archon 0.6.0 (TS/Bun rewrite, #2217) serves everything on a single port,
      # 3090, and its health route is /api/health. This probe runs on the compose
      # network, so it must use the CONTAINER port: the 8091 alias in
      # docker-compose.agents.yml maps HOST 8091 -> container 3090 and does not
      # exist inside the network. Probing 8091 here was connection-refused, not a
      # 404, so blackbox reported Archon permanently DOWN.
      - targets: ["http://archon:3090/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # === Tier 3 Services (Added 2025-12-24) ===

  - job_name: jellyfin-bridge
    static_configs:
      - targets: ["jellyfin-bridge:8093"]

  - job_name: pdf-ingest
    static_configs:
      - targets: ["pdf-ingest:8092"]

  - job_name: notebook-sync
    static_configs:
      - targets: ["notebook-sync:8095"]

  - job_name: langextract
    static_configs:
      - targets: ["langextract:8084"]

  - job_name: presign
    static_configs:
      - targets: ["presign:8080"]

  # === Tier 4 Services (Added 2025-12-25) ===

  - job_name: render-webhook
    static_configs:
      - targets: ["render-webhook:8085"]

  - job_name: session-context-worker
    static_configs:
      - targets: ["session-context-worker:8100"]

  # messaging-gateway removed — service no longer exists in docker-compose.yml

  # === GitHub Runner Controller metrics ===
  # Exposes github_runner_* metrics matching the github-runners Grafana dashboard
  - job_name: github-runner-ctl
    static_configs:
      - targets: ["github-runner-ctl:8104"]

  # === External Integration metrics ===

  - job_name: wger
    static_configs:
      - targets: ["wger:8000"]
    metrics_path: /metrics

  # === Voice & TTS Pipeline metrics ===

  - job_name: cast-tts-gateway
    static_configs:
      - targets: ["cast-tts-gateway:8060"]

  - job_name: voice-relay
    static_configs:
      - targets: ["voice-relay:8121"]

  # === Benchmark Lab metrics ===

  - job_name: llama-throughput-lab
    static_configs:
      - targets: ["llama-throughput-lab:8201"]

  # === Blackbox HTTP probes ===
  # Health check probes for services without /metrics

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://agent-zero:80/                          # agent-zero
          - http://hi-rag-gateway-v2:8086/hirag/admin/stats # hi-rag v2 CPU
          - http://host.docker.internal:8087/              # hi-rag v2 GPU
          - http://presign:8080/healthz                    # presign
          - http://archon:3090/api/health                  # archon (0.6.0: single port 3090, /api/health)
          - http://pmoves-firefly:8080/                      # firefly-iii (upstream Laravel, no /healthz)
          - http://host.docker.internal:8097/healthz        # channel monitor
          - http://host.docker.internal:4000                # tensorzero playground
          - http://host.docker.internal:8055/healthz        # flute-gateway
          - http://ultimate-tts-studio:7861/gradio_api/info  # ultimate-tts-studio
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # === Supabase Stack Monitoring (Added 2026-02-04) ===

  # Realtime exposes /metrics endpoint
  - job_name: supabase-realtime
    metrics_path: /probe
    params:
      module: [http_2xx_or_401]
    static_configs:
      - targets: ["http://realtime:4000/api/ping"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Blackbox HTTP probes for Supabase services (health checks)
  # Blackbox exporter is on pmoves_net network, can reach services by name
  # Note: PostgREST returns 401 (auth required) - we use http_2xx_or_401 module
  - job_name: supabase_health
    metrics_path: /probe
    params:
      module: [http_2xx_or_401]
    static_configs:
      - targets:
          - http://auth:9999/health       # GoTrue health (Supabase CLI alias)
          - http://rest:3000/             # PostgREST root (401 = OK; Supabase CLI alias)
          - http://realtime:4000/         # Realtime root (500 = unhealthy; Supabase CLI alias)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
      - source_labels: [__param_target]
        target_label: service
        regex: 'http://supabase-([^:]+):.*'
        replacement: '${1}'

  # PostgreSQL metrics via exporter (if enabled)
  - job_name: supabase-postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
    # Only scrape if exporter is running (optional)

  # DISABLED: channel-monitor doesn't expose /metrics endpoint
  # - job_name: channel_monitor
  #   static_configs:
  #     - targets: ["channel-monitor:8097"]

  # === Tailscale fleet metrics (Added 2026-06-15, ENABLED 2026-08-04) ===
  # Tailscale client metrics (tailscaled_inbound_bytes_total,
  # tailscaled_outbound_bytes_total, tailscaled_*_packets_total, advertised/approved
  # routes, health) are exported per node via node-exporter's textfile collector.
  # Each node runs `tailscale metrics write` on a systemd timer; node-exporter on
  # :9100 surfaces the result; Prometheus scrapes node-exporter over the tailnet.
  # This avoids opening the Tailscale local API (:5252) or needing a Tailscale API key.
  # Setup + unit files: tailscale-textfile-collector.md (this directory).
  #
  # The job name MUST stay "node-exporter" — the Tailscale Network Health dashboard
  # (grafana/dashboards/tailscale-network.json) keys its node-reachability panel off
  # up{job="node-exporter"}. Producers were deployed to the KVMs by #2012; this
  # consumer half was never enabled, so the board rendered empty and read as
  # "exit node offline" even while all three nodes were up.
  #
  # Enable precondition (verified 2026-08-04 on all three KVMs): node_exporter live on
  # :9100, tailscale-metrics.timer + exit-node-observer.timer active, 27 tailscaled_*
  # and 9 pmoves_exit_* series present, reachable from inside this container by
  # tailnet hostname.
  #
  # scrape_interval is 60s, not the 15s global: both writer timers fire once a minute,
  # so faster scraping resamples identical values across the mesh for nothing.
  - job_name: node-exporter
    scrape_interval: 60s
    scrape_timeout: 15s
    static_configs:
      - targets:
          - pmoves-kvm2:9100
          - pmoves-kvm4-1:9100
          - pmoves-kvm4-2:9100
    # pmoves-4090:9100 intentionally omitted — no node_exporter deployed there yet
    # (connection times out). Adding it would pin a permanently-down node on the
    # reachability panel, i.e. manufacture the exact false "offline" this fixes.
    # Re-add once the exporter is installed on that node.
    #     - pmoves-4090:9100
    metric_relabel_configs:
      # Drop the systemd collector's per-unit state matrix: 5 states x ~220 units x 3
      # nodes = ~3300 series, 41% of everything this job ingests, and nothing in
      # monitoring/ queries it. Measured on enable: node-exporter came in at 8115
      # series against a total head of 11527 — one job at 70% of the TSDB, on a
      # Prometheus running the default 15d retention with no explicit cap. This fleet
      # has a documented history of disk-fill incidents (KVM4-1 /tmp balloon, the
      # ClickHouse syslog runaway), so unbounded growth here is not a theoretical cost.
      #
      # The rest of node_exporter is deliberately KEPT, not trimmed to just the
      # dashboard's tailscaled_*/pmoves_exit_* — node_filesystem_*, CPU and memory on
      # the exit nodes are precisely the signals that would have caught both of those
      # incidents before they took a service stack down.
      - source_labels: [__name__]
        regex: node_systemd_unit_state
        action: drop
