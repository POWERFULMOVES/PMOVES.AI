  # The jellyfin-ai stack is THREE services, not one image. The old single
  # entry (`pmoves-jellyfin-ai-media-stack`) pointed at a root `Dockerfile`
  # that does not exist in the repo at any commit. PMOVES.AI's own
  # `pmoves/docker-compose.jellyfin-ai.yml` already builds the three
  # services separately, each with its own build context -- so the matrix
  # now mirrors that shape instead of pretending the stack is one image.
  - name: pmoves-jellyfin-ai-api-gateway
    repo: Pmoves-Jellyfin-AI-Media-Stack
    ref: heads/PMOVES.AI-Edition-Hardened
    context: .
    build_context: Cataclysm_Provisioning_Bundle/provisioning_bundle/docker-stacks/jellyfin-ai/api-gateway
