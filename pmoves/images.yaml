  - name: pmoves-tokenism-ui
    repo: PMOVES-ToKenism-Multi
    ref: heads/PMOVES.AI-Edition-Hardened
    # NO `context:` HERE, AND THAT IS THE POINT.
    #
    # This entry used to declare `context: pmoves-nextjs`, which named a
    # directory that was not the build context under any reading: the build
    # workflow resolves `context` as
    #   ${{ matrix.repo && format('{0}/{1}', github.workspace, matrix.repo) || matrix.context }}
    # so for a repo-backed entry the REPO wins and `matrix.context` is dead.
    # Before the discriminator was fixed, `matrix.context` always won -- and
    # this one resolved against `github.workspace/pmoves-nextjs`, a directory
    # that does not exist in this repo at all.
    #
    # The build that IS wanted is the submodule's `pmoves-nextjs/Dockerfile`.
    # With `build_context: pmoves-nextjs` below, `dockerfile: Dockerfile`
    # resolves to `pmoves-nextjs/Dockerfile` -- `dockerfile:` is relative to
    # the BUILD CONTEXT, not to the repo root, so the plain name already
    # means the submodule's file. MEASURED at the pinned gitlink 04285b813f:
    # the submodule holds BOTH `Dockerfile` and `pmoves-nextjs/Dockerfile`,
    # and the latter is the one this entry wants.
    #
    # The staleness ratchet now FLAGS a repo-backed entry that declares a
    # `context` other than `.`, so this contradiction cannot come back
    # unnoticed.
    #
    # `build_context` is what makes this entry correct. The Next.js UI's
    # Dockerfile does `COPY package*.json ./`, and `package.json` lives in
    # `pmoves-nextjs/`, NOT at the repo root -- so with the repo root as the
    # build context the build failed with "package*.json: not found". The
    # repo root Dockerfile is the PYTHON BACKEND (`COPY requirements.txt .`),
    # so pointing at it would have built the wrong thing entirely.
    build_context: pmoves-nextjs
    dockerfile: Dockerfile
    image: ghcr.io/powerfulmoves/pmoves-tokenism-ui

