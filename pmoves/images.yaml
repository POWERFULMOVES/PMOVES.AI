# Image build matrix for PMOVES stack
# Fields:
# - name: logical service name
# - repo: submodule path in this repo
# - ref: branch/tag to build from (default: submodule commit)
# - context: build context
# - build_context: OPTIONAL build context, RELATIVE TO the repo root (or to
#   the workspace root for in-tree entries). Use it when the Dockerfile's
#   COPY sources are relative to its own subdirectory instead of the repo
#   root -- e.g. `COPY requirements.txt ./` inside `backend/Dockerfile`
#   only resolves when the context IS `backend`. Default: the repo root.
#   `file:` is resolved against the build context, so `dockerfile:` is also
#   relative to it.
# - dockerfile: relative dockerfile path (relative to the build context)
# - image: base image name (ghcr + dockerhub mirror assumed)

images:
  - name: pmoves-agent-zero
    repo: PMOVES-Agent-Zero
    ref: heads/PMOVES.AI-Edition-Hardened
    context: .
    dockerfile: DockerfileLocal
    image: ghcr.io/powerfulmoves/pmoves-agent-zero

