##############################################################################
# PMOVES.AI - Docker Compose Overlay: Applications
##############################################################################
# Services: apps tier
# Always combine with base: docker compose -f docker-compose.base.yml -f docker-compose.apps.yml up -d
#
# Generated from docker-compose.yml by scripts/split_compose.py
##############################################################################
services:
  wger:
    <<: &tier-api-hardened
      env_file:
      - env.shared
      - env.tier-api
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      security_opt:
      - no-new-privileges:true

    image: ${WGER_IMAGE:-ghcr.io/powerfulmoves/pmoves-health-wger:pmoves-latest}
    restart: unless-stopped
    environment:
      # Database configuration
    - DATABASE_URL=postgres://wger:${WGER_DB_PASSWORD:?set WGER_DB_PASSWORD in env.tier-data}@wger-db:5432/wger
      # Django configuration
    - DJANGO_ALLOWED_HOSTS=*
    - DJANGO_SECRET_KEY=${WGER_SECRET_KEY:?set WGER_SECRET_KEY in env.tier-api}
    - WGER_ENABLE_REGISTRATION=${WGER_ENABLE_REGISTRATION:-true}
      # NATS configuration for event publishing
    - NATS_URL=${NATS_URL}
    - WGER_ENABLE_NATS=${WGER_ENABLE_NATS:-true}
      # Admin credentials
    - WGER_ADMIN_PASSWORD=${WGER_ADMIN_PASSWORD:?set WGER_ADMIN_PASSWORD in env.tier-api}
      # PMOVES integration
    - ENABLE_OBSERVABILITY=${WGER_OBSERVABILITY:-true}
    - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      # NOTE: /metrics available on port 8000 via ENABLE_OBSERVABILITY;
      # pmoves_monitoring network added below for Prometheus scrape access
    ports:
    - "${WGER_BIND:-0.0.0.0}:${WGER_PORT:-8000}:8000"
    profiles: ["health", "wger"]
  wger-db:
    <<:
      env_file:
      - env.shared
      - env.tier-data
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      security_opt:
      - no-new-privileges:true

    image: postgres:15-alpine
    restart: unless-stopped
    environment:
    - POSTGRES_DB=wger
    - POSTGRES_USER=wger
    - POSTGRES_PASSWORD=${WGER_DB_PASSWORD:?set WGER_DB_PASSWORD in env.tier-data}
    - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
    - wger-db:/var/lib/postgresql/data
    profiles: ["health", "wger"]
    networks:
    - pmoves_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wger -d wger"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Comfy Watcher - ComfyUI output watcher for NATS integration
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
  wger-nats-bridge:
    <<: *tier-api-hardened
    build: ./services/wger-nats-bridge
    restart: unless-stopped
    environment:
    - WGER_API_URL=http://wger:8000
    - NATS_URL=${NATS_URL}
    - CHIT_PASSPHRASE=${CHIT_PASSPHRASE:-}
    - WGER_POLL_INTERVAL=${WGER_POLL_INTERVAL:-60}
    depends_on:
      nats:
        condition: service_healthy
    profiles: ["health", "wger"]
  botz-gateway:
    <<:
      env_file:
      - env.shared
      - env.tier-agent
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      read_only: true
      security_opt:
      - no-new-privileges:true
      tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /var/tmp:noexec,nosuid,size=64m

    build: ./services/botz-gateway
    restart: unless-stopped
    environment:
    - NATS_URL=${NATS_URL}
    - SUPABASE_URL=${SUPABASE_URL:-http://supabase-kong:8000}
    - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_KEY}
    - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
    - BOTZ_HEARTBEAT_INTERVAL=${BOTZ_HEARTBEAT_INTERVAL:-30}
    - BOTZ_STALE_THRESHOLD=${BOTZ_STALE_THRESHOLD:-5}
    - AGENT_SIGNATURES_PATH=/app/config/agent_signatures.yaml
      # GitHub App credentials — MCP GitHub server token minting
    - GH_APP_ID=${GH_APP_ID:-}
    - GH_APP_SEC=${GH_APP_SEC:-}
    - GH_APP_INSTALLATION_ID=${GH_APP_INSTALLATION_ID:-}
    volumes:
    - ./config/agent_signatures.yaml:/app/config/agent_signatures.yaml:ro
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    ports: ["${BOTZ_BIND:-0.0.0.0}:${BOTZ_PORT:-8054}:8054"]
    profiles: ["agents", "botz"]
    networks: [pmoves_app, pmoves_bus, pmoves_api, pmoves_monitoring, pmoves_external]  # GitHub API
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8054/healthz', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Tier: agent (GitHub Branch Cleanup - automated stale branch removal)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  pmoves-yt:
    <<:
      env_file:
      - env.shared
      - env.tier-media
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID

    image: ${PMOVES_YT_IMAGE:-}
    build:
      context: ../PMOVES.YT
      dockerfile: pmoves_yt_service/Dockerfile
      args:
      - YTDLP_VERSION=${YTDLP_VERSION:-}
    restart: unless-stopped
    environment:
    # NATS_URL from env.tier-media has credentials: nats://nats:***@nats:4222
    - MINIO_ENDPOINT=${MINIO_ENDPOINT:-${S3_ENDPOINT:-minio:9000}}
    - MINIO_SECURE=${MINIO_SECURE:-false}
    - MINIO_ACCESS_KEY=${MINIO_USER:?Run make brand-defaults}
    - MINIO_SECRET_KEY=${MINIO_PASSWORD:?Run make brand-defaults}
    - YT_BUCKET=${YT_BUCKET:-assets}
    - YT_OUTPUT_BUCKET=${YT_OUTPUT_BUCKET:-outputs}
    - INDEXER_NAMESPACE=${INDEXER_NAMESPACE:-pmoves}
    - SUPA_REST_URL=${PMOVES_YT_SUPA_REST_URL:-${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}}
    - NATS_URL=${NATS_URL}
    - YT_NATS_ENABLE=${YT_NATS_ENABLE:-true}
    - HIRAG_URL=${HIRAG_URL:-http://hi-rag-gateway-v2:8086}
    # Multi-client rotation (Phase 9C + 2026-04-21 robustness fix): yt-dlp tries
    # clients in order until one succeeds. 'default' first uses yt-dlp's own
    # adaptive rotation (stays current with YouTube client-availability changes
    # as yt-dlp updates); 'web' + 'mweb' are the auth'd/cookie'd fallbacks;
    # 'tv_embedded' handles age/region gates; 'android_vr' is the edge-case
    # client that saved us on videos where `web_safari`/`web` returned no
    # formats (e.g. @ColeMedin nxHKBq5ZU9U, 6woc6ii-zoE — 2026-04-20 session).
    - YT_PLAYER_CLIENT=${YT_PLAYER_CLIENT:-default,web,mweb,tv_embedded,android_vr}
    - YT_ENABLE_PO_TOKEN=${YT_ENABLE_PO_TOKEN:-true}
    - YT_USER_AGENT=${YT_USER_AGENT:-Mozilla/5.0 (Macintosh; Intel Mac OS X 14_6) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.6 Safari/605.1.15}
    - YT_COOKIES=${YT_COOKIES:-/app/config/cookies/darkxside.youtube.cookies.txt}
    - BGUTIL_HTTP_BASE_URL=${BGUTIL_HTTP_BASE_URL:-http://bgutil-pot-provider:4416}
    - BGUTIL_DISABLE_INNERTUBE=${BGUTIL_DISABLE_INNERTUBE:-1}
    - INVIDIOUS_BASE_URL=${INVIDIOUS_BASE_URL:-http://invidious:3000}
    - INVIDIOUS_COMPANION_URL=${INVIDIOUS_COMPANION_URL:-http://invidious-companion:8282}
    - CHANNEL_MONITOR_STATUS_URL=${CHANNEL_MONITOR_STATUS_URL:-http://channel-monitor:8097/api/monitor/status}
    - YT_TRANSCRIPT_PROVIDER=${YT_TRANSCRIPT_PROVIDER:-faster-whisper}
    - YT_WHISPER_MODEL=${YT_WHISPER_MODEL:-small}
    - YT_TRANSCRIPT_DIARIZE=${YT_TRANSCRIPT_DIARIZE:-false}
    - YT_CHANNEL_CHECK_INTERVAL=${YT_CHANNEL_CHECK_INTERVAL:-3600}
    - OLLAMA_URL=${OLLAMA_URL:-http://pmoves-ollama:11434}
    - YT_SUMMARY_PROVIDER=${YT_SUMMARY_PROVIDER:-ollama}
    - YT_SUMMARY_OLLAMA_MODEL=${YT_SUMMARY_OLLAMA_MODEL:-gemma2:9b-instruct}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    volumes:
    - ./config:/app/config
    - pmoves-yt-data:/data
    depends_on:
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
    - ${PMOVES_YT_BIND:-127.0.0.1}:${PMOVES_YT_PORT:-8077}:8077
    networks:
    - pmoves_app
    - pmoves_api
    - pmoves_bus
    - pmoves_data      # MinIO access (minio:9000)
    - pmoves_external  # Required for YouTube API access
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8077/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
