  p7-room-orchestrator:
    <<: *tier-agent-hardened-ro
    build:
      context: .
      dockerfile: services/p7-room-orchestrator/Dockerfile
    image: ${P7_ROOM_ORCHESTRATOR_IMAGE:-ghcr.io/powerfulmoves/pmoves-p7-room-orchestrator:pmoves-latest}
    container_name: pmoves-p7-room-orchestrator
    hostname: p7-room-orchestrator
    restart: unless-stopped
    environment:
    # Service reads P7_* names (services/p7-room-orchestrator/config.py) and
    # resolves relative paths against P7_PMOVES_ROOT. Root is /app (the image
    # WORKDIR) so defaults like pmoves/config/rooms/catalog.json land on the
    # mounted tree — /app/pmoves would double-prefix to
    # /app/pmoves/pmoves/config/rooms and rooms_loaded stays 0.
    - P7_HTTP_PORT=8122
    - P7_PMOVES_ROOT=/app
      # Same shape as the canonical P7 stanza above, and for the same reason:
      # credentials come from NATS_USER/NATS_PASSWORD, the host stays pinned to
      # nats:4222, and host-session NATS_URL is deliberately kept out of the
      # chain. This is the legacy stanza that previously read ${NATS_URL}
      # directly — the form that made a shell export poison the container.
    - P7_NATS_URL=${P7_NATS_URL:-nats://${NATS_USER:-nats}:${NATS_PASSWORD:-pmoves}@nats:4222}
    - P7_ROOM_MANIFEST_SCHEMA=/app/pmoves/contracts/schemas/room/room.manifest.v1.schema.json
    - SUPABASE_URL=${P7_SUPABASE_URL:-http://supabase-kong:8000}
    - P7_SUPABASE_REST_URL=${P7_SUPABASE_REST_URL:-${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}}
    - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY:-}}
    - SUPABASE_SERVICE_ROLE_KEY_FILE=${SUPABASE_SERVICE_ROLE_KEY_FILE:-}
    - P7_SUPABASE_SCHEMA=${P7_SUPABASE_SCHEMA:-pmoves_core}
    - P7_CONTROL_TOKEN_FILE=${P7_CONTROL_TOKEN_FILE:-}
    - PMOVES_NETWORKS=pmoves_app,pmoves_api,pmoves_bus
    volumes:
    # Room catalog + manifests: rw so stage transitions can write back
    # current_stage (same contract as the `p7` service stanza).
    - ./config/rooms:/app/pmoves/config/rooms:rw
    # Room manifest schema: CatalogLoader.get_manifest() validates against it,
    # and it is not part of the service dir copied into the image.
    - ./contracts/schemas:/app/pmoves/contracts/schemas:ro
    ports:
    - ${P7_ROOM_ORCHESTRATOR_BIND:-127.0.0.1}:${P7_ROOM_ORCHESTRATOR_PORT:-8122}:8122
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      supabase-kong:
        condition: service_healthy
        # kong is profile-gated (supabase-local); without required:false any
        # --profile agents invocation fails project-wide as "depends on
        # undefined service" when the supabase profile isn't active.
        required: false
    profiles: ["agents", "orchestration"]
    networks: [pmoves_app, pmoves_api, pmoves_bus]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8122/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  evo-controller:
    <<: *tier-agent-hardened-ro
    build:
      context: .
