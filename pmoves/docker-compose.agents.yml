  # ── NATS Message Bus — JetStream-enabled event broker ──────────────────
  # Auth: nats://nats:pmoves@nats:4222 | Monitoring: :8222/varz
  # See: pmoves/docs/NATS_CONFIGURATION.md
  mesh-agent:
    <<: &tier-agent-hardened-ro
      env_file:
      - env.shared
      - env.tier-agent
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      read_only: true
      security_opt:
      - no-new-privileges:true
      tmpfs:
      - /tmp:noexec,nosuid,size=64m
      - /var/tmp:noexec,nosuid,size=64m

    build: ./services/mesh-agent
    restart: unless-stopped
    environment:
    # NATS_URL from env.shared/env.tier-agent has credentials: nats://nats:pmoves@nats:4222
    - HIRAG_URL=${HIRAG_URL:-http://hi-rag-gateway-v2-gpu:8086}
    - ANNOUNCE_SEC=${ANNOUNCE_SEC:-15}
    depends_on: [nats]
    profiles: ["agents"]
    networks: [pmoves_app, pmoves_bus]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Tier: agent (BoTZ Gateway - Bot management with Geometry BUS integration)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  cipher-api:
    <<: *tier-agent-hardened
    build:
      context: ../Pmoves-cipher
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
    - CIPHER_API_PREFIX=
    - NODE_ENV=production
    - NEO4J_URI=bolt://neo4j:7687
    - NEO4J_USER=${NEO4J_USER:-neo4j}
    - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j}
    - NATS_URL=${NATS_URL}
    - OLLAMA_BASE_URL=http://pmoves-ollama:11434
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    - CIPHER_API_TOKEN=${CIPHER_API_TOKEN:-}
    command: ["node", "dist/src/app/index.cjs", "--mode", "api", "--port", "3000", "--host", "0.0.0.0", "--agent", "/app/memAgent/cipher.yml", "--mcp-transport-type", "sse"]
    ports:
    # Default to localhost-only — cipher is now on pmoves_external (host-publishable),
    # so a 0.0.0.0 default would expose the API/SSE on all interfaces with an empty
    # CIPHER_API_TOKEN. Operators override CIPHER_BIND for intentional LAN exposure.
    - "${CIPHER_BIND:-127.0.0.1}:${CIPHER_PORT:-8105}:3000"
    depends_on:
      neo4j:
        condition: service_healthy
      nats:
        condition: service_healthy
    profiles: ["agents"]
    # pmoves_external (non-internal) lets the host-side MCP client reach cipher's
    # SSE on 127.0.0.1:8105 — pmoves_app/data/bus are internal:true and cannot
    # publish host ports. CIPHER_BIND defaults to 127.0.0.1 (localhost-only inbound).
    networks: [pmoves_app, pmoves_data, pmoves_bus, pmoves_external]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  a2ui-nats-bridge:
    <<: *tier-agent-hardened-ro
    build: ./services/a2ui-nats-bridge
    image: ${A2UI_BRIDGE_IMAGE:-ghcr.io/powerfulmoves/pmoves-a2ui-nats-bridge:pmoves-latest}
    container_name: pmoves-a2ui-nats-bridge
    hostname: a2ui-nats-bridge
