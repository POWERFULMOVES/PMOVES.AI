  hf-research-agent:
    # HF Research Agent — model evaluation worker. Subscribes to
    # hf.model.discovered.v1, evaluates against benchmark criteria
    # (downloads / likes / tags), publishes hf.model.evaluated.v1.
    # Pass/fail threshold via HF_MIN_SCORE (default 50).
    <<: *tier-agent-hardened-ro
    build: ./services/hf-research-agent
    image: ${HF_RESEARCH_AGENT_IMAGE:-ghcr.io/powerfulmoves/pmoves-hf-research-agent:pmoves-latest}
    container_name: pmoves-hf-research-agent
    hostname: hf-research-agent
    restart: unless-stopped
    environment:
    - NATS_URL=${NATS_URL}
    - HF_RESEARCH_PORT=8202
    - HF_MIN_DOWNLOADS=${HF_MIN_DOWNLOADS:-100}
    - HF_MIN_LIKES=${HF_MIN_LIKES:-10}
    - HF_MIN_SCORE=${HF_MIN_SCORE:-50}
    - HF_PREFERRED_TAGS=${HF_PREFERRED_TAGS:-text-generation,text2text-generation,feature-extraction,code-generation,chat,conversational}
    - HF_AVOID_TAGS=${HF_AVOID_TAGS:-text-to-image,image-generation,image-segmentation,object-detection,automatic-speech-recognition}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus
    ports:
    - ${HF_RESEARCH_BIND:-0.0.0.0}:${HF_RESEARCH_PORT:-8202}:8202
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      hf-agent:
        condition: service_started
    profiles: ["agents", "research"]
    networks: [pmoves_app, pmoves_bus]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8202/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Tier: agent (NotebookLM Agent - Google NotebookLM integration)
  hf-mcp-server:
    # HF MCP Server — Model Context Protocol tools for HuggingFace Hub.
    # Provides hf.model.search/info/download/list/convert_gguf and publishes
    # hf.model.downloaded.v1. Models download to /models; inference services
    # can mount the same host path or import converted GGUF artifacts.
    <<: *tier-agent-hardened-rw
    build:
      context: ./services/hf-mcp-server
      dockerfile: Dockerfile
    image: ${HF_MCP_SERVER_IMAGE:-ghcr.io/powerfulmoves/pmoves-hf-mcp-server:pmoves-latest}
    container_name: pmoves-hf-mcp-server
    hostname: hf-mcp-server
    restart: unless-stopped
    environment:
    - PORT=8096
    - NATS_URL=${NATS_URL}
    - HF_HOME=/models
    - HF_HUB_CACHE=/models/hub
    - HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-1}
    - HF_TOKEN=${HF_TOKEN:-}
    - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN:-}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    ports:
    - ${HF_MCP_SERVER_BIND:-127.0.0.1}:${HF_MCP_SERVER_PORT:-8203}:8096
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    profiles: ["agents", "research"]
    networks: [pmoves_app, pmoves_bus, pmoves_external]  # HuggingFace API
    volumes:
    - ${HF_MODELS_HOST_PATH:-./data/models}:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  notebook-mcp:
    # notebook-mcp — MCP wrapper for Open Notebook (build once, mount by any agent).
    # Exposes save_note/search_notes over MCP (streamable-http) so A0's :8081 client,
    # deepseek-harness (dsh-mcp-client), and Claude/Codex all mount ONE wrapper instead
    # of re-implementing the REST calls. Reuses the exact pmoves_notes REST contract
    # (POST /api/notes, POST /api/search) + the same OPEN_NOTEBOOK_API_TOKEN bearer auth.
    # Tenant seam stays in the mounting harness (dsh ctx.credentials / A0 per-context).
    <<: *tier-agent-hardened-rw
    build:
      context: ./services/notebook-mcp
      dockerfile: Dockerfile
    image: ${NOTEBOOK_MCP_IMAGE:-ghcr.io/powerfulmoves/pmoves-notebook-mcp:pmoves-latest}
    container_name: pmoves-notebook-mcp
    hostname: notebook-mcp
    restart: unless-stopped
    environment:
    - MCP_HOST=0.0.0.0
    - MCP_PORT=8092
    - MCP_TRANSPORT=${NOTEBOOK_MCP_TRANSPORT:-streamable-http}
    # In-network service DNS via a DEDICATED override var — do NOT inherit
    # ${OPEN_NOTEBOOK_API_URL}, which the env pipeline sets to http://localhost:5055
    # for HOST-side tools (inside a container localhost is itself, not Open Notebook).
    # Default = the standalone `open-notebook` alias (verified /api/search -> HTTP 200).
    # On the `make up-external` topology set NOTEBOOK_MCP_API_URL=http://open-notebook-ext:5055
    # (that stack registers open-notebook-ext / pmoves-open-notebook-ext, not open-notebook).
    - OPEN_NOTEBOOK_API_URL=${NOTEBOOK_MCP_API_URL:-http://open-notebook:5055}
    # Token IS required — /api/* returns 401 without it. Sourced from the env pipeline
    # (same OPEN_NOTEBOOK_API_TOKEN the pmoves_notes plugin uses). Per-tenant credential
    # resolution is the mounting harness's job on top of this baseline.
    - OPEN_NOTEBOOK_API_TOKEN=${OPEN_NOTEBOOK_API_TOKEN:-}
    - NATS_URL=${NATS_URL}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus
    ports:
    - ${NOTEBOOK_MCP_BIND:-127.0.0.1}:${NOTEBOOK_MCP_PORT:-8207}:8092
    depends_on:
      nats:
        condition: service_healthy
    profiles: ["agents", "research"]
    networks: [pmoves_app, pmoves_bus]  # open-notebook reachable on pmoves_app
    # python:3.12-slim has no curl; use a stdlib TCP-connect probe on the MCP port.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('127.0.0.1',8092))==0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Tier: agent (NotebookLM Agent - Google NotebookLM integration)
