        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    profiles: ["agents", "research"]
    networks: [pmoves_app, pmoves_bus, pmoves_external]  # HuggingFace API
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8201/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
