    - A2UI_RENDER_SUBJECT=${A2UI_RENDER_SUBJECT:-a2ui.render.v1}
    - GEOMETRY_WILDCARD=${GEOMETRY_WILDCARD:-geometry.>}
    - PORT=9224
    ports:
    - ${A2UI_BIND:-0.0.0.0}:9224:9224
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    profiles:
    - agents
    networks:
    - pmoves_app
    - pmoves_bus
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9224/healthz', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
