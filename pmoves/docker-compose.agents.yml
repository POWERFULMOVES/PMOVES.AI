##############################################################################
# PMOVES.AI - Docker Compose Overlay: Agent Services
##############################################################################
# Services: agents tier
# Always combine with base: docker compose -f docker-compose.base.yml -f docker-compose.agents.yml up -d
#
# Generated from docker-compose.yml by scripts/split_compose.py
##############################################################################
services:
  agent-zero:
    <<: &tier-agent-hardened
      env_file:
      - env.shared
      - env.tier-agent
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      security_opt:
      - no-new-privileges:true

    build:
      context: .
      dockerfile: ./services/agent-zero/Dockerfile
    restart: unless-stopped
    environment:
    - PORT=8080
    # NATS_URL from env.tier-agent has credentials: nats://nats:pmoves@nats:4222
    - AGENT_ZERO_API_BASE=${AGENT_ZERO_API_BASE:-http://127.0.0.1:80}
    - AGENT_ZERO_HEALTH_PATH=${AGENT_ZERO_HEALTH_PATH:-/healthz}
    - AGENT_ZERO_HEALTH_PATH_FALLBACK=${AGENT_ZERO_HEALTH_PATH_FALLBACK:-/health}
    - AGENT_ZERO_CAPTURE_OUTPUT=${AGENT_ZERO_CAPTURE_OUTPUT:-false}
    - AGENT_ZERO_EXTRA_ARGS=${AGENT_ZERO_EXTRA_ARGS:---port=80 --host=0.0.0.0}
    - PYTHONPATH=${AGENT_ZERO_PYTHONPATH:-/app:/app/services}
    - AGENTZERO_JETSTREAM=${AGENTZERO_JETSTREAM:-true}
    - AGENTZERO_JS_UNAVAILABLE_THRESHOLD=${AGENTZERO_JS_UNAVAILABLE_THRESHOLD:-1}
    - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # A2A protocol — Agent-to-Agent interoperability (AGNOTE4482 Item 2)
    - A2A_DISCOVERY_PUBLIC=${A2A_DISCOVERY_PUBLIC:-false}
    - A2A_TASKS_PUBLIC=${A2A_TASKS_PUBLIC:-false}
    # PMOVES.Notes plugin (baked into the image at usr/plugins/pmoves_notes).
    # Defaults match the plugin's own fallbacks; set explicitly so a token can be
    # supplied and the plugin can be toggled off without rebuilding.
    - OPEN_NOTEBOOK_API_URL=${OPEN_NOTEBOOK_API_URL:-http://open-notebook:5055}
    - OPEN_NOTEBOOK_API_TOKEN=${OPEN_NOTEBOOK_API_TOKEN:-}
    - PMOVES_NOTES_ENABLED=${PMOVES_NOTES_ENABLED:-true}
    # Orchestrator MCP toolkit — Agent Zero is the primary orchestrator and acts
    # as an MCP *client* to the PMOVES service mesh. A0 reads A0_SET_mcp_servers
    # (standard {"mcpServers":{...}} schema) via get_default_value(). Servers:
    #   docker          — full container control over the mounted socket (mcp/docker)
    #   pmoves-supabase — self-hosted PostgREST data plane (pre-installed in image)
    #   cipher          — Consciousness/CHIT persistent memory over SSE
    # BoTZ-gateway (persona/forms) and Hi-RAG are added by their owning lanes once
    # their MCP endpoints land; set BOTZ_MCP_URL / HIRAG_MCP_URL to extend.
    - SUPABASE_REST_URL=${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}
    - SUPABASE_SERVICE_KEY=${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
    - CIPHER_MCP_URL=${CIPHER_MCP_URL:-http://cipher-api:3000/mcp/sse}
    - 'A0_SET_mcp_servers={"mcpServers":{"docker":{"command":"docker","args":["run","--rm","-i","--mount","type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock","mcp/docker"]},"pmoves-supabase":{"command":"mcp-server-postgrest","args":["--apiUrl","${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}","--apiKey","${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}","--schema","public,storage"]},"cipher":{"type":"sse","url":"${CIPHER_MCP_URL:-http://cipher-api:3000/mcp/sse}"}}}'
    # LLM routing: use TensorZero gateway as OpenAI-compatible provider
    # Agent Zero's get_default_value() reads A0_SET_* from env (dotenv priority)
    # Dummy key silences LiteLLM "Missing API Key" warning — TensorZero handles auth
    - OPENAI_API_KEY=${OPENAI_API_KEY:-tensorzero-routed}
    - A0_SET_chat_model_provider=openai
    # Chat/util/browser wrappers ADD openai/ prefix internally — do NOT double it
    - A0_SET_chat_model_name=tensorzero::function_name::agent_zero
    - A0_SET_chat_model_api_base=http://tensorzero-gateway:3000/openai/v1
    - A0_SET_util_model_provider=openai
    - A0_SET_util_model_name=tensorzero::function_name::agent_zero
    - A0_SET_util_model_api_base=http://tensorzero-gateway:3000/openai/v1
    - A0_SET_embed_model_provider=openai
    # Embed wrapper does NOT add openai/ prefix — must include it here
    - A0_SET_embed_model_name=openai/tensorzero::embedding_model_name::gemma_embed_local
    - A0_SET_embed_model_api_base=http://tensorzero-gateway:3000/openai/v1
    - A0_SET_browser_model_provider=openai
    - A0_SET_browser_model_name=tensorzero::function_name::agent_zero
    - A0_SET_browser_model_api_base=http://tensorzero-gateway:3000/openai/v1
    - A0_SET_a2a_server_enabled=true
    - A0_SET_mcp_server_token=${MCP_SERVER_TOKEN:?MCP_SERVER_TOKEN must be set when a2a_server_enabled=true}
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      tensorzero-gateway:
        condition: service_healthy
    ports:
    - ${AGENT_ZERO_BIND:-127.0.0.1}:${AGENT_ZERO_PORT:-8080}:8080
    - ${AGENT_ZERO_BIND:-127.0.0.1}:${AGENT_ZERO_UI_PORT:-8081}:80
    volumes:
    - ${AGENT_ZERO_MEMORY_DIR:-./data/agent-zero/memory}:/a0/memory
    - ${AGENT_ZERO_KNOWLEDGE_DIR:-./data/agent-zero/knowledge}:/a0/knowledge
    - ${AGENT_ZERO_INSTRUMENTS_DIR:-./data/agent-zero/instruments}:/a0/instruments
    - ${AGENT_ZERO_LOG_DIR:-./data/agent-zero/logs}:/a0/logs
    - ${AGENT_ZERO_RUNTIME_DIR:-./data/agent-zero/runtime}:/a0/runtime
    # Forms layer — persona/cognition profiles consumed by mcp_server.load_form().
    # Read-only: forms are introspective metadata; runtime never rewrites them.
    - ./configs/agents/forms:/app/configs/agents/forms:ro
    # Operator-state mount — env.shared into DARKXSIDE-AZ-5090.
    # DARKXSIDE is the witness + co-creator identity layer; POWERFULMOVES (this
    # org / brand / repo) emerges from it. rw is the correct default for
    # operator-state surfaces — DARKXSIDE-AZ is the operator on this node, not
    # a peripheral service requesting elevation. Constraints (if any) are
    # operator self-discipline, not architecture.
    # Override: set ENV_SHARED_MODE=ro in env.shared to harden on nodes where
    # write access is not needed (e.g., read-only observer deployments).
    - ./env.shared:/secrets/env.shared:${ENV_SHARED_MODE:-rw}
    # Docker socket for the orchestrator's docker MCP (mcp/docker via
    # A0_SET_mcp_servers). This grants Agent Zero full container control — an
    # intentional posture for the primary orchestrator. Note: :ro on the socket
    # is cosmetic (the Docker API is bidirectional regardless of file mode).
    - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ >/dev/null || curl -fsS http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Grant the runtime user (uid/gid 65532) access to the mounted Docker socket
    # (root:docker 0660 on Linux hosts) so the docker MCP (mcp/docker) can reach
    # the daemon without weakening socket perms. DOCKER_GID must match the host's
    # docker group gid; Docker Desktop (Win/Mac) proxies the socket and ignores it.
    group_add:
    - "${DOCKER_GID:-999}"
    networks:
    - pmoves_app
    - pmoves_bus
    - pmoves_external  # Required for LLM provider APIs
    - pmoves_api  # Reach supabase-kong (PostgREST) for the pmoves-supabase MCP
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  archon:
    <<: *tier-agent-hardened
    build:
      context: .
      dockerfile: ./services/archon/Dockerfile
      args:
      - ARCHON_GIT_REMOTE=${ARCHON_GIT_REMOTE:-https://github.com/POWERFULMOVES/PMOVES-Archon.git}
      - ARCHON_GIT_REF=${ARCHON_GIT_REF:-main}
    restart: unless-stopped
    environment:
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY from env.tier-agent
      # NATS_URL from env.tier-agent has credentials: nats://nats:pmoves@nats:4222
    - PORT=8091
    - ENVIRONMENT=${ENVIRONMENT:-production}
    - ARCHON_ENV=${ARCHON_ENV:-production}
    - ARCHON_SERVER_PORT=${ARCHON_SERVER_PORT:-8091}
    - ARCHON_SERVER_URL=${ARCHON_SERVER_URL:-http://localhost:8091}
    - ARCHON_MCP_PORT=${ARCHON_MCP_PORT:-8051}
    - ARCHON_AGENTS_PORT=${ARCHON_AGENTS_PORT:-8052}
    - ARCHON_VENDOR_FORCE_PLACEHOLDER=${ARCHON_VENDOR_FORCE_PLACEHOLDER:-0}
    - ENVIRONMENT=${ENVIRONMENT:-production}
    - ARCHON_ENV=${ARCHON_ENV:-production}
      # Compose-first Archon Supabase wiring. CLI mode can override via
      # ARCHON_SUPABASE_* / SUPABASE_* env values.
    - ARCHON_SUPABASE_BASE_URL=${ARCHON_SUPABASE_BASE_URL:-${ARCHON_SUPABASE_REST_URL:-${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}}}
    - SUPABASE_URL=${ARCHON_SUPABASE_URL:-${SUPABASE_INTERNAL_URL:-http://supabase-kong:8000}}
    - SUPABASE_REST_URL=${ARCHON_SUPABASE_REST_URL:-${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}}
    - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:-}}}
    - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-${SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:-}}}}
    - NATS_URL=${NATS_URL}
    - SUPA_REST_URL=${ARCHON_SUPABASE_REST_URL:-${SUPABASE_REST_URL:-http://supabase-kong:8000/rest/v1}}
      # TensorZero routing — _sync_openai_compat_env() in services/archon/main.py
      # reads TENSORZERO_BASE_URL and populates OPENAI_COMPATIBLE_BASE_URL* vars
    - TENSORZERO_BASE_URL=${TENSORZERO_BASE_URL:-http://tensorzero-gateway:3000}
    - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
      # GitHub App credentials — archon MCP cross-repo cloning (planned)
    - GH_APP_ID=${GH_APP_ID:-}
    - GH_APP_SEC=${GH_APP_SEC:-}
    - GH_APP_INSTALLATION_ID=${GH_APP_INSTALLATION_ID:-}
      # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    depends_on:
      nats:
        condition: service_healthy
      tensorzero-gateway:
        condition: service_healthy
    command:
    - python
    - -c
    - import uvicorn; from services.archon.main import app; uvicorn.run(app, host='0.0.0.0', port=8091, log_level='info')
    ports:
    - ${ARCHON_BIND:-0.0.0.0}:${ARCHON_PORT:-8091}:8091
    - ${ARCHON_BIND:-0.0.0.0}:${ARCHON_MCP_PORT:-8051}:8051
    - ${ARCHON_BIND:-0.0.0.0}:${ARCHON_WS_PORT:-8052}:8052
    networks:
      pmoves_app:
        aliases:
        - archon-server
      pmoves_api:
      pmoves_bus:
      pmoves_external:
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8091/healthz').getcode()==200 else sys.exit(1)"
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Tier: agent (Cipher Memory - knowledge-graph memory for Claude Code / agents)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  gateway-agent:
    build: ./services/gateway-agent
    restart: unless-stopped
    env_file:
    - env.shared
    - .env.generated
    environment:
    - PORT=${GATEWAY_AGENT_PORT:-8111}
    - AGENT_ZERO_URL=${AGENT_ZERO_URL:-http://agent-zero:8080}
    - CIPHER_URL=${CIPHER_URL:-http://cipher-api:8105}
    - TENSORZERO_URL=${TENSORZERO_URL:-http://tensorzero-gateway:3000}
    - SUPABASE_URL=${SUPABASE_URL:-http://supabase-kong:8000}
    - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    - TOOL_CACHE_TTL=${TOOL_CACHE_TTL:-300}
    ports:
    - "${GATEWAY_AGENT_BIND:-0.0.0.0}:${GATEWAY_AGENT_PORT:-8111}:${GATEWAY_AGENT_PORT:-8111}"    # Default 8111; 8110 reserved for model-registry
    profiles: ["agents"]
    networks: [pmoves_api, pmoves_app, pmoves_bus]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${GATEWAY_AGENT_PORT:-8111}/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # GitHub Runner Control - Manages self-hosted GitHub runners
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  hi-rag-gateway:
    <<: &tier-api-hardened
      env_file:
      - env.shared
      - env.tier-api
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      security_opt:
      - no-new-privileges:true

    build:
      context: .
      dockerfile: services/hi-rag-gateway/Dockerfile
    restart: unless-stopped
    environment:
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
    - QDRANT_COLLECTION=${QDRANT_COLLECTION:-pmoves_chunks_qwen3}
    - QDRANT__API_KEY=${QDRANT__API_KEY:?Set QDRANT__API_KEY in env.tier-data}
    - SENTENCE_MODEL=${SENTENCE_MODEL:-all-MiniLM-L6-v2}
    - HIRAG_HTTP_PORT=${HIRAG_HTTP_PORT:-8086}
    - GRAPH_BOOST=${GRAPH_BOOST:-0.15}
    - ENTITY_CACHE_TTL=${ENTITY_CACHE_TTL:-3600}
    - ENTITY_CACHE_MAX=${ENTITY_CACHE_MAX:-10000}
    - USE_MEILI=${USE_MEILI:-true}
    - MEILI_URL=${MEILI_URL:-http://meilisearch:7700}
    - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in env.tier-data}
    - NEO4J_URL=${NEO4J_URL:-bolt://neo4j:7687}
    - NEO4J_USER=${NEO4J_USER:-neo4j}
    - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in env.tier-data}
    - NEO4J_DICT_REFRESH_SEC=${NEO4J_DICT_REFRESH_SEC:-300}
    - NEO4J_DICT_LIMIT=${NEO4J_DICT_LIMIT:-1000}
    - TAILSCALE_ONLY=${TAILSCALE_ONLY:-false}
    - TAILSCALE_ADMIN_ONLY=${TAILSCALE_ADMIN_ONLY:-false}
    - TAILSCALE_CIDRS=${TAILSCALE_CIDRS:-}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    ports:
    - ${HIRAG_V1_BIND:-127.0.0.1}:${HIRAG_V1_HOST_PORT:-8089}:8086
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
      neo4j:
        condition: service_healthy
        required: false
    networks:
    - pmoves_api
    - pmoves_data
    - pmoves_bus
    - pmoves_external  # HuggingFace model downloads at runtime
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  hi-rag-gateway-v2:
    <<: *tier-api-hardened
    build:
      context: .
      dockerfile: services/hi-rag-gateway-v2/Dockerfile
    restart: unless-stopped
    environment:
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
    - QDRANT_COLLECTION=${QDRANT_COLLECTION:-pmoves_chunks_qwen3}
    - QDRANT_RECREATE_ON_DIM_MISMATCH=${QDRANT_RECREATE_ON_DIM_MISMATCH:-false}
    - QDRANT__API_KEY=${QDRANT__API_KEY:?Set QDRANT__API_KEY in env.tier-data}
    - SENTENCE_MODEL=${SENTENCE_MODEL:-all-MiniLM-L6-v2}
    - INDEXER_NAMESPACE=${INDEXER_NAMESPACE:-pmoves}
    - QUERY_NAMESPACE=${QUERY_NAMESPACE:-*}
    - ALPHA=${ALPHA:-0.7}
    - RERANK_ENABLE=${RERANK_ENABLE:-true}
    - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-base}
    - RERANK_TOPN=${RERANK_TOPN:-50}
    - RERANK_K=${RERANK_K:-10}
    - RERANK_FUSION=${RERANK_FUSION:-mul}
    - USE_MEILI=true
    - MEILI_URL=${MEILI_URL:-http://meilisearch:7700}
    - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in env.tier-data}
    - NEO4J_URL=${NEO4J_URL:-bolt://neo4j:7687}
    - NEO4J_USER=${NEO4J_USER:-neo4j}
    - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in env.tier-data}
    - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-tensorzero}
    - USE_OLLAMA_EMBED=${USE_OLLAMA_EMBED:-false}
    - OLLAMA_URL=${OLLAMA_URL:-http://pmoves-ollama:11434}
    - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-qwen3-embedding:4b}
    - TENSORZERO_BASE_URL=${TENSORZERO_BASE_URL:-http://tensorzero-gateway:3000}
    - TENSORZERO_EMBED_MODEL=${TENSORZERO_EMBED_MODEL:-tensorzero::embedding_model_name::qwen3_embedding_4b_local}
    - GRAPH_BOOST=${GRAPH_BOOST:-0.15}
    - ENTITY_CACHE_TTL=${ENTITY_CACHE_TTL:-60}
    - ENTITY_CACHE_MAX=${ENTITY_CACHE_MAX:-1000}
    - NEO4J_DICT_REFRESH_SEC=${NEO4J_DICT_REFRESH_SEC:-60}
    - NEO4J_DICT_LIMIT=${NEO4J_DICT_LIMIT:-50000}
    - TAILSCALE_ONLY=${TAILSCALE_ONLY:-false}
    - TAILSCALE_CIDRS=${TAILSCALE_CIDRS:-100.64.0.0/10}
    - SUPA_REST_URL=${SUPA_REST_URL:-http://supabase-kong:8000/rest/v1}
    - SUPABASE_REALTIME_URL=${SUPABASE_REALTIME_URL:-ws://supabase-realtime:4000}
    - CHIT_REQUIRE_SIGNATURE=${CHIT_PROD_REQUIRE_SIGNATURE:-true}
    - CHIT_DECRYPT_ANCHORS=${CHIT_PROD_DECRYPT_ANCHORS:-true}
    - CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?set CHIT_PROD_PASSPHRASE in env.shared}
    - DOCKED_MODE=${DOCKED_MODE:-true}
    - TOPOLOGY_MODE=${TOPOLOGY_MODE:-docked}
    - PARENT_SYSTEM=${PARENT_SYSTEM:-PMOVES.AI}
    - PARENT_VERSION=${PARENT_VERSION:-1.0.0-hardened}
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
    - CURL_CA_BUNDLE=
    - NODE_EXTRA_CA_CERTS=
    - HTTP_PROXY=
    - HTTPS_PROXY=
    - NO_PROXY=
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - ${HIRAG_BIND:-127.0.0.1}:${HIRAG_V2_HOST_PORT:-8086}:8086
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
    - pmoves_api
    - pmoves_data
    - pmoves_bus
    - pmoves_external  # Required for reranker API calls
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  hi-rag-gateway-gpu:
    <<: *tier-api-hardened
    build:
      context: .
      dockerfile: services/hi-rag-gateway/Dockerfile
      args:
      - TORCH_CUDA_VERSION=${TORCH_CUDA_VERSION:-cu128}
      - TORCH_SKIP_CUDA=0
    restart: unless-stopped
    environment:
    # Host environment leak guard (see x-host-leak-guard docs above)
    - SSL_CERT_FILE=
    - SSL_CERT_DIR=
    - REQUESTS_CA_BUNDLE=
