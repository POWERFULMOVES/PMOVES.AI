    image: ${EVO_CONTROLLER_IMAGE:-ghcr.io/powerfulmoves/pmoves-evo-controller:latest}
    restart: unless-stopped
    environment:
    # NATS_URL from env.tier-agent has credentials: nats://nats:***@nats:4222
    - PORT=8113
