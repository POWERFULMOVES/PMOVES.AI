    environment:
    - NATS_URL=${NATS_URL}
    - HF_AGENT_PORT=8201
    - HF_TOKEN=${HF_TOKEN:-}
    - HF_TOKEN_FILE=/run/secrets/hf_token
    - HF_POLL_INTERVAL=${HF_POLL_INTERVAL:-300}
    - HF_TASK_FILTER=${HF_TASK_FILTER:-text-generation}
    - HF_TAGS=${HF_TAGS:-}
    - HF_AUTHOR=${HF_AUTHOR:-}
    - HF_LIMIT=${HF_LIMIT:-50}
    - PMOVES_NETWORKS=pmoves_app,pmoves_bus,pmoves_external
    ports:
    - ${HF_AGENT_BIND:-0.0.0.0}:${HF_AGENT_PORT:-8201}:8201
    depends_on:
