##############################################################################
# PMOVES.AI - Docker Compose Overlay: JuiceFS Object Store (S3 gateway PoC)
##############################################################################
# Services: juicefs tier
# Always combine with base: docker compose -f docker-compose.base.yml -f docker-compose.juicefs.yml up -d
#
# Generated from docker-compose.yml by scripts/split_compose.py
##############################################################################
services:
  juicefs-format:  # one-time FS format (idempotent); gateway waits on this
    <<: &tier-data-hardened
      env_file:
      - env.shared
      - env.tier-data
      cap_drop:
      - ALL
      cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      logging:
        driver: json-file
        options:
          max-size: "10m"
          max-file: "3"

    image: juicedata/mount:ce-v1.4.1
    profiles: ["juicefs"]
    restart: "no"
    entrypoint: ["sh", "-lc"]
    command:
    # Retry loop: supabase-db may still be initialising when the juicefs profile starts.
    # juicefs format is idempotent (re-run on a formatted FS exits 0), so a non-zero
    # exit after all retries is a REAL error and must fail service_completed_successfully.
    # Network-backed multi-node: blocks live in MinIO (reachable by every node
    # over the tailnet), not z890-local files. JUICEFS_S3_ENDPOINT = the tailnet-
    # reachable MinIO endpoint (z890 tailnet IP:9000) so the URL recorded in
    # metadata resolves from remote nodes too; falls back to internal minio:9000
    # for single-node. Creds embed into metadata at format time.
    # Credentials reach JuiceFS through META_PASSWORD / ACCESS_KEY / SECRET_KEY
    # (environment below), never argv, so they do not show in `ps` on the host.
    # Single quotes around the DSN protect the '&' from shell interpretation.
    - >-
      n=0; until juicefs format --storage minio
      --bucket http://${JUICEFS_S3_ENDPOINT:-minio:9000}/${JUICEFS_BUCKET:-juicefs}
      '${JUICEFS_META_URL:-postgres://supabase_admin@supabase-db:5432/postgres?search_path=juicefs_meta&sslmode=disable}'
      ${JUICEFS_NAME:-pmoves} 2>/dev/null; do
      n=$$((n+1)); [ $$n -ge 15 ] && { echo 'ERROR: Postgres not reachable after 15 retries'; exit 1; };
      echo "waiting for Postgres ($$n/15)..."; sleep 2; done
    volumes:
    - juicefs-data:/data
    networks:
    - pmoves_data
    - pmoves_external

    environment:
    - PMOVES_NETWORKS=pmoves_data,pmoves_external
    - META_PASSWORD=${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in env.tier-supabase}
    - ACCESS_KEY=${JUICEFS_S3_USER:-${MINIO_USER:?Run make brand-defaults}}
    - SECRET_KEY=${JUICEFS_S3_PASSWORD:-${MINIO_PASSWORD:?Run make brand-defaults}}
  juicefs-gateway:  # S3-compatible drop-in for minio:9000 (--multi-buckets required on CE)
    <<: *tier-data-hardened
    image: juicedata/mount:ce-v1.4.1
    profiles: ["juicefs"]
    restart: unless-stopped
    depends_on:
      juicefs-format:
        condition: service_completed_successfully
    environment:
    # juicefs gateway uses the MinIO gateway code: these are the S3 access/secret keys.
    - MINIO_ROOT_USER=${JUICEFS_S3_USER:-${MINIO_USER:?Run make brand-defaults}}
    - MINIO_ROOT_PASSWORD=${JUICEFS_S3_PASSWORD:-${MINIO_PASSWORD:?Run make brand-defaults}}
    # Metadata password via env, not the DSN: a DSN on the command line is
    # readable by any local user through `ps`.
    - META_PASSWORD=${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in env.tier-supabase}
    - PMOVES_NETWORKS=pmoves_data
    entrypoint: ["sh", "-lc"]
    command:
    # Per-host bounded cache on the /data volume: the gateway must never inherit the
    # JuiceFS 100 GiB default (fills a small disk) nor self-disable caching on a
    # near-full one. Runs the CANONICAL helper, bind-mounted read-only, instead of
    # mirroring its df logic here — the mirror had already drifted into a third copy
    # of the same fixed-column df bug (it read $4/$2, which are the wrong columns the
    # moment a Filesystem name contains a space, silently sizing cache off USED space).
    # Compose renders on the host while this cache lives on the container's /data
    # volume, so the measurement still has to run at container start; the image can
    # run the helper unmodified — juicedata/mount:ce-v1.3.0 ships /bin/bash and
    # /usr/bin/awk. The helper creates its own cache dir, so no mkdir here.
    # Single quotes around the DSN protect the '&' from shell interpretation.
    - |
      set -e
      JFS_CACHE_FLAGS="$$(JFS_CACHE_DIR=/data/jfsCache bash /usr/local/bin/juicefs-cache-bounds.sh)"
      test -n "$$JFS_CACHE_FLAGS" || { echo 'ERROR: empty cache bounds - refusing unbounded gateway'; exit 1; }
      echo "[juicefs-gateway] bounded cache: $$JFS_CACHE_FLAGS"
      exec juicefs gateway --multi-buckets --keep-etag $$JFS_CACHE_FLAGS '${JUICEFS_META_URL:-postgres://supabase_admin@supabase-db:5432/postgres?search_path=juicefs_meta&sslmode=disable}' 0.0.0.0:9000
    volumes:
    - ./scripts/juicefs-cache-bounds.sh:/usr/local/bin/juicefs-cache-bounds.sh:ro
    - juicefs-data:/data
    networks:
    - pmoves_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  juicefs-smoke:  # one-off S3 round-trip + multi-bucket test (profile juicefs-smoke; never auto-starts)
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: ["juicefs-smoke"]
    depends_on:
      juicefs-gateway:
        condition: service_healthy
    environment:
    # Same credential chain as juicefs-gateway (no baked-in secret) so smoke auth always matches.
    - MC_HOST_jfs=http://${JUICEFS_S3_USER:-${MINIO_USER:?Run make brand-defaults}}:${JUICEFS_S3_PASSWORD:-${MINIO_PASSWORD:?Run make brand-defaults}}@juicefs-gateway:9000
    - PMOVES_NETWORKS=pmoves_data
    entrypoint: ["sh", "-lc"]
    command:
    - "set -e; mc mb -p jfs/assets jfs/outputs; printf 'hello-juicefs-2026' | mc pipe jfs/assets/smoke.txt; echo '--- GET ---'; mc cat jfs/assets/smoke.txt; echo; echo '--- multi-bucket list (assets+outputs
      => --multi-buckets works) ---'; mc ls jfs/"
    networks:
    - pmoves_data
    restart: "no"
