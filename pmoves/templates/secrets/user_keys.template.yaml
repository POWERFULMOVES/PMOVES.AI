# ==============================================================================
# NOTES
# ==============================================================================
#
# CHIT Encoding:
# To encode secrets for backup/transfer, run:
#   make secrets-chit-encode < user_keys.yaml > secrets.chit
#
# To decode:
#   make secrets-chit-decode < secrets.chit > user_keys.yaml
#
# Environment Variables:
# For production, use environment variables instead of this file:
#   export OPENAI_API_KEY="sk-..."
#   export ANTHROPIC_API_KEY="sk-ant-..."
#
# GitHub Secrets:
# For GitHub Actions, add secrets to repository settings:
#   PMOVES_OPENAI_API_KEY
#   PMOVES_ANTHROPIC_API_KEY
#   etc.
