# PMOVES.AI User Keys Template
# ================================
#
# INSTRUCTIONS:
# 1. Copy this file to pmoves/user_keys.yaml (DO NOT commit the filled version)
# 2. Fill in your API keys below
# 3. Run: make secrets-import < user_keys.yaml
#
# SECURITY NOTES:
# - NEVER commit filled secrets to git
# - Use environment variables for production deployments
# - Consider using CHIT encoding for backup/transfer

# ==============================================================================
# LLM PROVIDER API KEYS (At least one required)
# ==============================================================================

