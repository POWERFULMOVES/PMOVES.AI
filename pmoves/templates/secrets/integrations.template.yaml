# PMOVES.AI Integration Secrets Template
# =====================================
#
# This template contains secrets for third-party integrations.
# Copy and fill in only the integrations you use.

# ==============================================================================
# MEDIA INTEGRATIONS
# ==============================================================================

# Jellyfin (Media server)
# Get from: Jellyfin Settings > API Keys > New API Key
jellyfin_api_key: "your-jellyfin-api-key"
jellyfin_url: "http://localhost:8096"
jellyfin_user_id: "get-from-jellyfin-api-users"

# YouTube (Video ingestion)
youtube_api_key: "get-from-google-cloud-console"
youtube_channel_id: "your-channel-id"

# Spotify (Music integration)
# Get from: https://developer.spotify.com/dashboard
spotify_client_id: "..."
spotify_client_secret: "..."
spotify_refresh_token: "..."

# ==============================================================================
# HEALTH & FITNESS
# ==============================================================================

# Oura Ring (Sleep tracking)
oura_access_token: "..."
oura_refresh_token: "..."

# Fitbit
fitbit_client_id: "..."
fitbit_client_secret: "..."
fitbit_refresh_token: "..."

# Apple Health (requires local sync)
apple_health_export_path: "/path/to/apple_health_export.xml"

# Google Fit
google_fit_api_key: "..."

# Withings (Health devices)
withings_client_id: "..."
withings_client_secret: "..."
withings_access_token: "..."

