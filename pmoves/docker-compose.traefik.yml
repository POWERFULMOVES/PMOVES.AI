services:
  traefik:
    # v3.6 is a FLOOR, not a preference. Traefik's Docker provider pins Docker API
    # v1.24 until v3.6; Docker Engine 29 sets MinAPIVersion 1.40 and answers v1.24
    # with a 400 whose body is empty — which surfaces as the unhelpful
    # `Error response from daemon: ` with nothing after the colon, once a minute,
    # while EVERY route 404s because no container label is ever read.
    # Measured on Engine 29.6.2: v3.4 → 7 provider errors/10s, v3.5 → 6, v3.6 → 0.
    # DOCKER_API_VERSION=1.44 does NOT help; Traefik ignores it.
    # Do not downgrade below v3.6. See
    # docs/handoffs/traefik-docker-provider-api-version-2026-08-06.md
    image: ${TRAEFIK_IMAGE:-traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d}
    container_name: pmoves-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --certificatesresolvers.cf.acme.dnschallenge=true
      - --certificatesresolvers.cf.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cf.acme.email=${ACME_EMAIL:-ops@pmoves.ai}
      - --certificatesresolvers.cf.acme.storage=/letsencrypt/acme.json
    environment:
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
    ports: ["443:443", "80:80"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-acme:/letsencrypt
    networks: { pmoves_external: {} }
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`auth.pmoves.ai`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls.certresolver=cf
      - traefik.http.routers.auth.service=sso-auth@docker
volumes: { traefik-acme: {} }
networks:
  pmoves_external: { external: true }
