name: Docker Hardening Validation

on:
  push:
    branches: [main, PMOVES.AI-Edition-Hardened-Integrations, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/docker-compose*.yml'
      - 'pmoves/services/**/Dockerfile*'
      - '.github/workflows/hardening-validation.yml'
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened-Integrations, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/docker-compose*.yml'
      - 'pmoves/services/**/Dockerfile*'
      - '.github/workflows/hardening-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep manual reruns intact, but cancel stale push/PR runs on the same ref.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ============================================================================
  # Validate Hardening Patterns
  # ============================================================================
  validate-hardening:
    name: Validate Hardening Patterns
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run hardening validation
        id: hardening-check
        run: |
          echo "Running Docker hardening validation..."
          ./pmoves/scripts/validate-hardening.sh
        continue-on-error: false

      - name: Generate hardening report
        if: always()
        run: |
          echo "# Hardening Validation Report" > hardening-report.md
          echo "" >> hardening-report.md
          echo "## Validated: $(date)" >> hardening-report.md
          echo "" >> hardening-report.md
          echo "## Services Checked" >> hardening-report.md
          echo "" >> hardening-report.md
          ./pmoves/scripts/validate-hardening.sh 2>&1 | tee -a hardening-report.md || true

      - name: Upload hardening report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hardening-report
          path: hardening-report.md
          retention-days: 30

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('hardening-report.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Docker Hardening Validation\n\n${report}`
            });

  # ============================================================================
  # Validate Dockerfile Security
  # ============================================================================
  validate-dockerfiles:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Limit fan-out to reduce self-hosted queue contention.
      max-parallel: 2
      matrix:
        dockerfile:
          - pmoves/services/archon/Dockerfile
          - pmoves/services/agent-zero/Dockerfile
          - pmoves/services/flute-gateway/Dockerfile
          - pmoves/services/hi-rag-gateway/Dockerfile
          - pmoves/services/extract-worker/Dockerfile
          - pmoves/services/tokenism-simulator/Dockerfile
          - pmoves/services/botz-gateway/Dockerfile
          - pmoves/services/gateway-agent/Dockerfile

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check USER directive
        run: |
          echo "Checking ${{ matrix.dockerfile }} for USER directive..."
          if grep -q "^USER " "${{ matrix.dockerfile }}"; then
            user=$(grep "^USER " "${{ matrix.dockerfile }}" | head -1)
            echo "✓ Found: $user"
            # Check if user is not root
            uid=$(echo "$user" | awk '{print $2}')
            if [[ "$uid" != "0" && "$uid" != "root" ]]; then
            echo "✓ Non-root user configured"
            else
            echo "✗ WARNING: Running as root"
            exit 1
            fi
          else
            echo "✗ ERROR: No USER directive found"
            exit 1
          fi

      - name: Check for multi-stage build
        run: |
          echo "Checking ${{ matrix.dockerfile }} for multi-stage build..."
          from_count=$(grep -c "^FROM " "${{ matrix.dockerfile }}" || true)
          if [[ "$from_count" -gt 1 ]]; then
            echo "✓ Multi-stage build detected ($from_count stages)"
          else
            echo "⚠ Single-stage build (consider multi-stage for smaller images)"
          fi

      - name: Check for security best practices
        run: |
          echo "Checking ${{ matrix.dockerfile }} security practices..."

          # Check for --no-cache-dir in pip installs
          if grep -q "pip install.*--no-cache-dir" "${{ matrix.dockerfile }}"; then
            echo "✓ Uses --no-cache-dir for pip"
          fi

          # Check for distroless or alpine base images
          if grep -qE "FROM.*(alpine|distroless)" "${{ matrix.dockerfile }}"; then
            echo "✓ Uses minimal base image"
          fi

          # Check for COPY vs ADD
          if grep -q "^ADD " "${{ matrix.dockerfile }}"; then
            echo "⚠ Uses ADD (consider COPY for better security)"
          fi

  # ============================================================================
  # Docker Security Checks
  # ============================================================================
  docker-bench:
    name: Docker Bench Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # ---- GitHub-hosted Linux runner checks ----
      - name: Check Docker daemon security config
        shell: bash
        run: |
          echo "=== Docker Daemon Security Checks ==="
          echo ""

          # 1. Docker daemon reachable
          if ! docker info > /dev/null 2>&1; then
            echo "✗ Docker daemon not reachable"
            exit 1
          fi
          echo "✓ Docker daemon reachable"

          # 2. Check rootless/user namespace isolation posture
          SECURITY_OPTIONS=$(docker info --format '{{json .SecurityOptions}}' 2>/dev/null || echo '[]')
          if printf '%s' "$SECURITY_OPTIONS" | grep -qi 'name=rootless'; then
            echo "✓ Rootless Docker enabled"
          elif printf '%s' "$SECURITY_OPTIONS" | grep -qi 'name=userns'; then
            echo "✓ User namespace remap enabled"
          else
            echo "ℹ Rootless/userns-remap not detected (runner compatibility decision)"
          fi

          # 3. Image provenance policy lives in CI and deploy refs, not daemon flags
          echo "ℹ Image signing is enforced via cosign in the GHCR publish workflow."
          echo "ℹ Prefer digest-pinned image refs in deployment manifests when practical."

          # 4. Check default runtime
          RUNTIME=$(docker info --format '{{.DefaultRuntime}}' 2>/dev/null || echo "unknown")
          echo "ℹ Default runtime: $RUNTIME"

          # 5. Check live-restore (daemon resilience)
          LIVE_RESTORE=$(docker info --format '{{.LiveRestoreEnabled}}' 2>/dev/null || echo "unknown")
          if [ "$LIVE_RESTORE" = "true" ]; then
            echo "✓ Live restore enabled"
          else
            echo "ℹ Live restore disabled (daemon config — not CI-fixable)"
          fi

          # 6. Check no containers running as privileged
          # Exclude BuildKit builders (always privileged by design) and CI runners
          PRIV_CONTAINERS=$(docker ps -q 2>/dev/null | xargs -r docker inspect --format '{{.Name}} {{.HostConfig.Privileged}}' 2>/dev/null | grep "true" | grep -v "buildx_buildkit_\|github-runner" || true)
          if [ -n "$PRIV_CONTAINERS" ]; then
            echo "⚠ Privileged containers found (review required):"
            echo "$PRIV_CONTAINERS"
          else
            echo "✓ No unexpected privileged containers running"
          fi
          # Always report BuildKit builders separately (informational)
          BUILDKIT_PRIV=$(docker ps -q 2>/dev/null | xargs -r docker inspect --format '{{.Name}} {{.HostConfig.Privileged}}' 2>/dev/null | grep "true" | grep "buildx_buildkit_" || true)
          if [ -n "$BUILDKIT_PRIV" ]; then
            echo "ℹ BuildKit builders (privileged by design): $(echo "$BUILDKIT_PRIV" | wc -l | tr -d ' ')"
          fi

          # 6. Check no containers with pid=host
          PID_HOST=$(docker ps -q 2>/dev/null | xargs -r docker inspect --format '{{.Name}} {{.HostConfig.PidMode}}' 2>/dev/null | grep "host" || true)
          if [ -n "$PID_HOST" ]; then
            echo "⚠ Containers with PID host mode:"
            echo "$PID_HOST"
          else
            echo "✓ No containers using PID host mode"
          fi

          # 7. Check no containers with net=host
          NET_HOST=$(docker ps -q 2>/dev/null | xargs -r docker inspect --format '{{.Name}} {{.HostConfig.NetworkMode}}' 2>/dev/null | grep "host" || true)
          if [ -n "$NET_HOST" ]; then
            echo "⚠ Containers with host network mode:"
            echo "$NET_HOST"
          else
            echo "✓ No containers using host network mode"
          fi

          echo ""
          echo "=== Docker Security Checks Complete ==="

      - name: Validate compose hardening directives
        shell: bash
        run: |
          echo "=== Compose Hardening Directive Checks ==="
          echo ""

          # Check all compose files for security directives
          for f in pmoves/docker-compose.yml pmoves/docker-compose.*.yml; do
            [ -f "$f" ] || continue
            BASENAME=$(basename "$f")

            # Check for cap_drop: ALL pattern
            CAP_DROP_COUNT=$(grep -c "cap_drop:" "$f" 2>/dev/null || echo 0)

            if [ "$CAP_DROP_COUNT" -gt 0 ]; then
              echo "✓ $BASENAME: cap_drop directives found ($CAP_DROP_COUNT)"
            elif echo "$BASENAME" | grep -qE "(agentgym|external|remote|open-notebook|supabase|jellyfin|vps)"; then
              echo "ℹ $BASENAME: override file (inherits from base)"
            else
              echo "⚠ $BASENAME: no cap_drop directives"
            fi

            # Check for security_opt: no-new-privileges
            NO_NEW_PRIV=$(grep -c "no-new-privileges" "$f" 2>/dev/null || echo 0)
            if [ "$NO_NEW_PRIV" -gt 0 ]; then
              echo "✓ $BASENAME: no-new-privileges found ($NO_NEW_PRIV)"
            elif echo "$BASENAME" | grep -qE "(agentgym|external|remote|open-notebook|supabase|jellyfin|vps)"; then
              : # override files inherit
            else
              echo "⚠ $BASENAME: no no-new-privileges directives"
            fi
          done

          echo ""
          echo "=== Compose Hardening Complete ==="

      # ---- Linux-only: Full CIS Docker Bench ----
      # Requires bare-metal or VM runner with Docker socket + /var/lib/docker access.
      # Containerized runners (DinD) lack host PID/net/volume access and will hang.
      - name: Run CIS Docker Bench (Linux bare-metal only)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          echo "=== CIS Docker Community Edition Benchmark ==="

          # Skip on containerized runners — DinD can't bind-mount /var/lib/docker
          if [ -f /.dockerenv ] || grep -qsm1 'docker\|containerd' /proc/1/cgroup 2>/dev/null; then
            echo "ℹ Skipping CIS Docker Bench: running inside a container (DinD unsupported)"
            exit 0
          fi

          # Verify host paths exist before attempting mount
          if [ ! -d /var/lib/docker ]; then
            echo "ℹ Skipping CIS Docker Bench: /var/lib/docker not accessible"
            exit 0
          fi

          # Install docker-bench-security if not available
          if ! command -v docker-bench-security &> /dev/null; then
            docker run --rm -v /usr/local/bin:/target docker-bench-security:latest \
              cp /docker-bench-security /target/ 2>/dev/null || {
              curl -fsSL https://github.com/docker/docker-bench-security/releases/latest/download/docker-bench-security.sh -o /tmp/dbs.sh &&
              chmod +x /tmp/dbs.sh && /tmp/dbs.sh
            }
          fi

          docker run --rm --net host --pid host --cap-add audit_control \
            -v /var/lib/docker:/var/lib/docker:ro \
            -v /usr/lib/systemd:/usr/lib/systemd:ro \
            docker-bench-security:latest \
            check --check "CIS Docker Community Edition Benchmark v2.0.0 - level 1" || true

  # ============================================================================
  # Compose File Validation
  # ============================================================================
  validate-compose:
    name: Validate Compose Files
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Materialize compose env files from templates
        run: |
          set -euo pipefail

          if [ ! -f "pmoves/env.shared" ] && [ -f "pmoves/env.shared.example" ]; then
            cp pmoves/env.shared.example pmoves/env.shared
          fi

          for tier in data supabase api llm worker media agent ui; do
            env_file="pmoves/env.tier-${tier}"
            example_file="${env_file}.example"
            if [ ! -f "${env_file}" ] && [ -f "${example_file}" ]; then
              cp "${example_file}" "${env_file}"
            fi
          done

      - name: Validate compose syntax
        env:
          # Required by ${:?} guards — CI uses dummy values for syntax validation only
          CHIT_PROD_PASSPHRASE: ci-validation-placeholder
          SECRET_KEY_BASE: ci-validation-placeholder
          VAULT_ENC_KEY: ci-validation-placeholder
          LOGFLARE_PUBLIC_ACCESS_TOKEN: ci-validation-placeholder
          LOGFLARE_PRIVATE_ACCESS_TOKEN: ci-validation-placeholder
          MINIO_USER: ci-validation-placeholder
          MINIO_PASSWORD: ci-validation-placeholder
          QDRANT__API_KEY: ci-validation-placeholder
          NEO4J_PASSWORD: ci-validation-placeholder
          MEILI_MASTER_KEY: ci-validation-placeholder
        run: |
          echo "Validating docker-compose files..."

          # Validate main compose file
          # Use --no-consistency because some dependencies are profile-scoped.
          docker compose -f pmoves/docker-compose.yml --env-file pmoves/env.shared config --quiet --no-consistency
          echo "✓ pmoves/docker-compose.yml syntax is valid"

          # Validate hardened compose syntax only (override file is intentionally partial)
          docker compose -f pmoves/docker-compose.hardened.yml config --quiet --no-consistency
          echo "✓ pmoves/docker-compose.hardened.yml syntax is valid"

          # Validate monitoring compose file
          if [ -f "pmoves/monitoring/docker-compose.monitoring.yml" ]; then
            docker compose -f pmoves/monitoring/docker-compose.monitoring.yml config --quiet
            echo "✓ pmoves/monitoring/docker-compose.monitoring.yml is valid"
          fi

      - name: Check for network segmentation
        run: |
          echo "Checking network segmentation..."

          # Check for defined networks
          networks=$(grep -E "^  [a-z_]+:" pmoves/docker-compose.yml | grep -E "network|driver" || echo "0")
          if [[ "$networks" -gt 0 ]]; then
            echo "✓ Custom networks defined"
            # List networks
            grep -A 5 "^networks:" pmoves/docker-compose.yml | grep "  [a-z_]*:" || true
          fi

      - name: Check for secrets management
        run: |
          echo "Checking secrets management..."

          if grep -q "^secrets:" pmoves/docker-compose.hardened.yml; then
            echo "✓ Secrets defined in hardened compose"
            grep -A 10 "^secrets:" pmoves/docker-compose.hardened.yml || true
          else
            echo "⚠ No secrets found in hardened compose"
          fi

  # ============================================================================
  # Summary Job
  # ============================================================================
  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-hardening, validate-dockerfiles, validate-compose]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "# Docker Hardening Validation Summary" > summary.md
          echo "" >> summary.md
          echo "## Job Results" >> summary.md
          echo "" >> summary.md
          echo "- Hardening Patterns: ${{ needs.validate-hardening.result }}" >> summary.md
          echo "- Dockerfiles: ${{ needs.validate-dockerfiles.result }}" >> summary.md
          echo "- Compose Files: ${{ needs.validate-compose.result }}" >> summary.md
          echo "" >> summary.md
          echo "## Next Steps" >> summary.md
          echo "" >> summary.md
          if [[ "${{ needs.validate-hardening.result }}" == "success" ]] && \
             [[ "${{ needs.validate-dockerfiles.result }}" == "success" ]] && \
             [[ "${{ needs.validate-compose.result }}" == "success" ]]; then
            echo "✓ All validations passed!" >> summary.md
          else
            echo "⚠ Some validations failed. Please review the logs above." >> summary.md
          fi

          cat summary.md

      - name: Upload summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-summary
          path: summary.md
          retention-days: 90
