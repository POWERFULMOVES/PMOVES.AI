name: Docker Hardening Validation

on:
  push:
    branches: [main, PMOVES.AI-Edition-Hardened-Integrations, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/docker-compose*.yml'
      - 'pmoves/scripts/split_compose.py'
      - 'pmoves/services/**/Dockerfile*'
      - '.github/workflows/hardening-validation.yml'
      - '.github/workflows/integrations-ghcr.matrix.json'
      - 'pmoves/integrations/archon'
      # Inputs of the secrets-hardening audit job below. Before it was wired in
      # (finding L4) the script ran only when a human typed `make secrets-audit`.
      - 'pmoves/tools/secrets_hardening_audit.py'
      - 'pmoves/chit/**'
      - 'pmoves/configs/hardening_ratchet/**'
      - 'pmoves/tools/compose_hardening_ratchet.py'
      - 'pmoves/scripts/validate-hardening.sh'
      - '.gitignore'
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened-Integrations, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/docker-compose*.yml'
      - 'pmoves/scripts/split_compose.py'
      - 'pmoves/services/**/Dockerfile*'
      - '.github/workflows/hardening-validation.yml'
      - '.github/workflows/integrations-ghcr.matrix.json'
      - 'pmoves/integrations/archon'
      # Inputs of the secrets-hardening audit job below. Before it was wired in
      # (finding L4) the script ran only when a human typed `make secrets-audit`.
      - 'pmoves/tools/secrets_hardening_audit.py'
      - 'pmoves/chit/**'
      - 'pmoves/configs/hardening_ratchet/**'
      - 'pmoves/tools/compose_hardening_ratchet.py'
      - 'pmoves/scripts/validate-hardening.sh'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep manual reruns intact, but cancel stale push/PR runs on the same ref.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ============================================================================
  # Validate Hardening Patterns
  # ============================================================================
  validate-hardening:
    name: Validate Hardening Patterns
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install PyYAML
        run: |
          # The overlay is parsed, not grepped. The tool refuses to fall back to
          # grep if the parser is missing -- it exits 3 (COULD NOT MEASURE), not
          # 0 -- so an absent dependency is a red job rather than a false pass.
          python3 -m pip install --quiet "PyYAML>=6,<7"

      - name: Run hardening validation
        id: hardening-check
        run: |
          echo "Running Docker hardening validation..."
          # Exit 0 = clean, 1 = new/stale findings, 3 = could not measure.
          #
          # This copy is ADVISORY and is kept for the report artifact below.
          # The BLOCKING copy is the `compose-hardening-check` job in
          # merge-gate.yml, which merge-decision aggregates. It is duplicated
          # rather than aggregated because `needs:` cannot reference a job in
          # another workflow file -- so a required check could never depend on
          # this job, and for as long as this was the only copy the script
          # fired on every PR and blocked nothing.
          ./pmoves/scripts/validate-hardening.sh
        continue-on-error: false

      - name: Generate hardening report
        if: always()
        run: |
          echo "# Hardening Validation Report" > hardening-report.md
          echo "" >> hardening-report.md
          echo "## Validated: $(date)" >> hardening-report.md
          echo "" >> hardening-report.md
          echo "## Services Checked" >> hardening-report.md
          echo "" >> hardening-report.md
          ./pmoves/scripts/validate-hardening.sh 2>&1 | tee -a hardening-report.md || true

      - name: Upload hardening report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hardening-report
          path: hardening-report.md
          retention-days: 30

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('hardening-report.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Docker Hardening Validation\n\n${report}`
            });

  # ============================================================================
  # Validate Dockerfile Security
  # ============================================================================
  validate-dockerfiles:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Limit fan-out to reduce self-hosted queue contention.
      max-parallel: 2
      matrix:
        dockerfile:
          - pmoves/services/agent-zero/Dockerfile
          - pmoves/services/flute-gateway/Dockerfile
          - pmoves/services/hi-rag-gateway/Dockerfile
          - pmoves/services/extract-worker/Dockerfile
          - pmoves/services/tokenism-simulator/Dockerfile
          - pmoves/services/botz-gateway/Dockerfile
          - pmoves/services/gateway-agent/Dockerfile

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The `Check USER directive` step was deleted here (finding M1). It ran
      # `grep "^USER " "$f" | head -1`, judging the FIRST directive, while
      # Docker's reference is explicit that USER applies "for the remainder
      # of the current stage" (https://docs.docker.com/reference/dockerfile/#user).
      # pmoves/tools/hardening_ratchet.py takes users[-1] for exactly that
      # reason, judges all 102 tracked Dockerfiles rather than the 7 in this
      # matrix, and is the REQUIRED `hardening-validation` context in
      # merge-gate.yml. Two checks disagreeing about what "the user" means,
      # with the vendor-correct one being the only one that blocks, is worse
      # than one check. Fixing this step would have produced a duplicate.
      #
      # The two steps below print and never assert: this job cannot fail. That
      # is deliberate for now -- their subject is 7 of 102 Dockerfiles and the
      # authority is the ratchet. The `summary` job names each result
      # individually so a reader is not left to infer it from a green tick.
      - name: Check for multi-stage build
        run: |
          echo "Checking ${{ matrix.dockerfile }} for multi-stage build..."
          from_count=$(grep -c "^FROM " "${{ matrix.dockerfile }}" || true)
          if [[ "$from_count" -gt 1 ]]; then
            echo "✓ Multi-stage build detected ($from_count stages)"
          else
            echo "⚠ Single-stage build (consider multi-stage for smaller images)"
          fi

      - name: Check for security best practices
        run: |
          echo "Checking ${{ matrix.dockerfile }} security practices..."

          # Check for --no-cache-dir in pip installs
          if grep -q "pip install.*--no-cache-dir" "${{ matrix.dockerfile }}"; then
            echo "✓ Uses --no-cache-dir for pip"
          fi

          # Check for distroless or alpine base images
          if grep -qE "FROM.*(alpine|distroless)" "${{ matrix.dockerfile }}"; then
            echo "✓ Uses minimal base image"
          fi

          # Check for COPY vs ADD
          if grep -q "^ADD " "${{ matrix.dockerfile }}"; then
            echo "⚠ Uses ADD (consider COPY for better security)"
          fi

  # ============================================================================
  # Compose File Validation
  # ============================================================================
  validate-compose:
    name: Validate Compose Files
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check PMOVES_NETWORKS wiring is in sync with services' networks (drift gate)
        run: |
          # Each service's networks: is mirrored into its own PMOVES_NETWORKS= env so
          # topology.TopologyContext.from_env() sees a non-empty docker_networks (backs
          # on_network()/has_external_egress()). --check fails if a service's networks:
          # changed without re-running the injector. Run BEFORE the split gate since the
          # injector mutates the SOURCE the overlays are generated from. ruamel pinned to
          # match the Makefile COMPOSE_NETWORKS_RUN / COMPOSE_SPLIT_RUN pin.
          python3 -m pip install --quiet "ruamel.yaml==0.19.1"
          python3 pmoves/scripts/inject_pmoves_networks.py --check

      - name: Check split overlays are in sync with source (drift gate)
        run: |
          # The split overlays (docker-compose.{base,core,agents,media,ui,workers,apps}.yml)
          # are generated from docker-compose.yml. Regenerate and fail on any drift so the
          # secondary up-overlay-* path can't silently diverge. ruamel pinned for byte-stable
          # rendering (must match the Makefile COMPOSE_SPLIT_RUN pin).
          python3 -m pip install --quiet "ruamel.yaml==0.19.1"
          python3 pmoves/scripts/split_compose.py >/dev/null
          # Use `git status --porcelain` (not `git diff --exit-code`): diff exits 0 for
          # UNtracked files, so a PR that deletes a generated overlay would regenerate it
          # as untracked and slip past. Porcelain catches modified AND untracked/missing.
          DRIFT="$(git status --porcelain -- \
              pmoves/docker-compose.base.yml pmoves/docker-compose.core.yml \
              pmoves/docker-compose.agents.yml pmoves/docker-compose.media.yml \
              pmoves/docker-compose.ui.yml pmoves/docker-compose.workers.yml \
              pmoves/docker-compose.apps.yml pmoves/docker-compose.juicefs.yml)"
          if [ -n "$DRIFT" ]; then
            echo "$DRIFT"
            echo "::error::Split overlays are out of sync with docker-compose.yml (modified or missing). Run 'make -C pmoves compose-split' and commit the regenerated overlays."
            exit 1
          fi
          echo "Split overlays are in sync with docker-compose.yml."

      - name: Materialize compose env files from templates
        run: |
          set -euo pipefail

          if [ ! -f "pmoves/env.shared" ] && [ -f "pmoves/env.shared.example" ]; then
            cp pmoves/env.shared.example pmoves/env.shared
          fi

          for tier in data supabase api llm worker media agent ui; do
            env_file="pmoves/env.tier-${tier}"
            example_file="${env_file}.example"
            if [ ! -f "${env_file}" ] && [ -f "${example_file}" ]; then
              cp "${example_file}" "${env_file}"
            fi
          done

      - name: Validate compose syntax
        env:
          # Required by ${:?} guards — CI uses dummy values for syntax validation only
          CHIT_PROD_PASSPHRASE: ci-validation-placeholder
          SECRET_KEY_BASE: ci-validation-placeholder
          VAULT_ENC_KEY: ci-validation-placeholder
          LOGFLARE_PUBLIC_ACCESS_TOKEN: ci-validation-placeholder
          LOGFLARE_PRIVATE_ACCESS_TOKEN: ci-validation-placeholder
          MINIO_USER: ci-validation-placeholder
          MINIO_PASSWORD: ci-validation-placeholder
          QDRANT__API_KEY: ci-validation-placeholder
          NEO4J_PASSWORD: ci-validation-placeholder
          MEILI_MASTER_KEY: ci-validation-placeholder
          WGER_DB_PASSWORD: ci-validation-placeholder
          WGER_SECRET_KEY: ci-validation-placeholder
          WGER_ADMIN_PASSWORD: ci-validation-placeholder
          ANON_KEY: ci-validation-placeholder
          JWT_SECRET: ci-validation-placeholder
          SERVICE_ROLE_KEY: ci-validation-placeholder
          SUPABASE_DB_USER: ci-validation-placeholder
          SUPABASE_DB_PASSWORD: ci-validation-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-validation-placeholder
          MCP_SERVER_TOKEN: ci-validation-placeholder
        run: |
          echo "Validating docker-compose files..."

          # Validate main compose file
          # Use --no-consistency because some dependencies are profile-scoped.
          docker compose -f pmoves/docker-compose.yml --env-file pmoves/env.shared config --quiet --no-consistency
          echo "✓ pmoves/docker-compose.yml syntax is valid"

          # Validate hardened compose syntax only (override file is intentionally partial)
          docker compose -f pmoves/docker-compose.hardened.yml config --quiet --no-consistency
          echo "✓ pmoves/docker-compose.hardened.yml syntax is valid"

          # Validate monitoring compose file
          if [ -f "pmoves/monitoring/docker-compose.monitoring.yml" ]; then
            docker compose -f pmoves/monitoring/docker-compose.monitoring.yml config --quiet
            echo "✓ pmoves/monitoring/docker-compose.monitoring.yml is valid"
          fi

      - name: Validate GHCR matrix paths
        run: |
          python3 pmoves/tools/ghcr_local_prepublish.py \
            --matrix-file .github/workflows/integrations-ghcr.matrix.json \
            --repo-root . \
            --paths-only

      - name: Check for network segmentation
        run: |
          echo "Checking network segmentation..."

          # Check for defined networks
          networks=$(grep -E "^  [a-z_]+:" pmoves/docker-compose.yml | grep -E "network|driver" || echo "0")
          if [[ "$networks" -gt 0 ]]; then
            echo "✓ Custom networks defined"
            # List networks
            grep -A 5 "^networks:" pmoves/docker-compose.yml | grep "  [a-z_]*:" || true
          fi

      - name: Check for secrets management
        run: |
          echo "Checking secrets management..."

          if grep -q "^secrets:" pmoves/docker-compose.hardened.yml; then
            echo "✓ Secrets defined in hardened compose"
            grep -A 10 "^secrets:" pmoves/docker-compose.hardened.yml || true
          else
            echo "⚠ No secrets found in hardened compose"
          fi

      # Relocated here when the `docker-bench` job was deleted (finding M4).
      # That job ran `docker info` / `docker ps` against the ephemeral
      # GitHub-hosted runner's daemon -- a host PMOVES does not operate --
      # and could not exit non-zero on any finding. This step was the only
      # one in it whose SUBJECT was this repository, so it moves rather than
      # dies. It is still advisory by design: it counts directive presence
      # per file, and the coverage question it gestures at (28 of 111 base
      # services carry a hardened override; 4 of 111 declare
      # no-new-privileges) is findings H3 and L3, a separate lane. Do not
      # read a clean run of this step as coverage.
      - name: Validate compose hardening directives
        shell: bash
        run: |
          echo "=== Compose Hardening Directive Checks ==="
          echo ""

          # Check all compose files for security directives
          for f in pmoves/docker-compose.yml pmoves/docker-compose.*.yml; do
            [ -f "$f" ] || continue
            BASENAME=$(basename "$f")

            # Check for cap_drop: ALL pattern
            CAP_DROP_COUNT=$(grep -c "cap_drop:" "$f" 2>/dev/null || echo 0)

            if [ "$CAP_DROP_COUNT" -gt 0 ]; then
              echo "✓ $BASENAME: cap_drop directives found ($CAP_DROP_COUNT)"
            elif echo "$BASENAME" | grep -qE "(agentgym|external|remote|open-notebook|supabase|jellyfin|vps)"; then
              echo "ℹ $BASENAME: override file (inherits from base)"
            else
              echo "⚠ $BASENAME: no cap_drop directives"
            fi

            # Check for security_opt: no-new-privileges
            NO_NEW_PRIV=$(grep -c "no-new-privileges" "$f" 2>/dev/null || echo 0)
            if [ "$NO_NEW_PRIV" -gt 0 ]; then
              echo "✓ $BASENAME: no-new-privileges found ($NO_NEW_PRIV)"
            elif echo "$BASENAME" | grep -qE "(agentgym|external|remote|open-notebook|supabase|jellyfin|vps)"; then
              : # override files inherit
            else
              echo "⚠ $BASENAME: no no-new-privileges directives"
            fi
          done

          echo ""
          echo "=== Compose Hardening Complete ==="

  # ============================================================================
  # Secrets Hardening Audit
  # ============================================================================
  # Finding L4: pmoves/tools/secrets_hardening_audit.py is 456 lines, its
  # findings are cited as authoritative by pmoves/mk/codex.mk:360, and the
  # script path appeared in ZERO workflows -- it ran only when someone
  # remembered `make -C pmoves secrets-audit`. It exits 0 on a clean tree
  # (measured on this branch, 2026-09-20: "Secrets hardening audit: PASS",
  # exit 0), so wiring it in does not turn the workflow red on arrival.
  #
  # It is NOT added to merge-gate.yml, where `merge-decision` aggregates every
  # job's result and IS a required context. Putting it there would promote it
  # to blocking in the same change that first made it run, which is the one
  # sequencing this lane must not do.
  secrets-audit:
    name: Secrets Hardening Audit
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run the secrets hardening audit
        run: |
          # Called directly, not through `make`: make collapses every nonzero
          # exit to 2, which would make a findings exit indistinguishable from
          # a could-not-measure one.
          python3 pmoves/tools/secrets_hardening_audit.py

  # ============================================================================
  # Summary Job
  # ============================================================================
  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    # EVERY job in this file must be listed here. `docker-bench` used to be
    # absent, so the only aggregating job in the workflow did not even read it.
    needs: [validate-hardening, validate-dockerfiles, validate-compose, secrets-audit]
    if: always()

    steps:
      - name: Generate Summary
        id: summarise
        env:
          # Through the environment, not interpolated into the script body:
          # https://docs.github.com/en/actions/reference/security/secure-use#use-an-intermediate-environment-variable
          R_HARDENING: ${{ needs.validate-hardening.result }}
          R_DOCKERFILES: ${{ needs.validate-dockerfiles.result }}
          R_COMPOSE: ${{ needs.validate-compose.result }}
          R_SECRETS: ${{ needs.secrets-audit.result }}
        run: |
          set -uo pipefail

          # A `needs.*.result` is one of success / failure / cancelled /
          # skipped. Only `success` is a pass. `skipped` in particular is the
          # bucket that makes a broken instrument look fixed -- it reads as
          # "nothing wrong" while meaning "never measured" -- so it is named
          # explicitly and is NOT forgiven here. No job in this file carries an
          # `if:` or a `needs:`, so a skip means something unexpected happened
          # and silence would be the wrong answer.
          failed=0
          {
            echo "# Docker Hardening Validation Summary"
            echo ""
            echo "## Job Results"
            echo ""
          } > summary.md

          for pair in \
            "Hardening Patterns=${R_HARDENING}" \
            "Dockerfiles=${R_DOCKERFILES}" \
            "Compose Files=${R_COMPOSE}" \
            "Secrets Hardening Audit=${R_SECRETS}"; do
            label="${pair%%=*}"
            result="${pair#*=}"
            echo "- ${label}: ${result}" >> summary.md
            if [ "$result" != "success" ]; then
              failed=$((failed + 1))
              # Named individually. "Some validations failed" told a reader
              # which file to open and nothing else.
              echo "::error::${label} did not succeed (result: ${result})"
            fi
          done

          {
            echo ""
            echo "## Next Steps"
            echo ""
          } >> summary.md
          if [ "$failed" -eq 0 ]; then
            echo "All validations passed." >> summary.md
          else
            echo "${failed} job(s) did not succeed. See the annotations above." >> summary.md
          fi

          cat summary.md
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Upload summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-summary
          path: summary.md
          retention-days: 90

      - name: Carry the outcome
        # The defect this closes: the job wrote "Some validations failed" into
        # an artifact and exited 0 regardless. An aggregator that reports an
        # outcome it does not carry is a green tick over a red run.
        #
        # This does NOT promote anything to blocking. No context from this
        # workflow appears in pmoves/configs/branch_protection/pmoves_standard.json;
        # the required `hardening-validation` context is the merge-gate.yml job
        # of the same name. Promotion is an operator policy decision.
        if: steps.summarise.outputs.failed != '0'
        run: |
          echo "Validation summary reports ${{ steps.summarise.outputs.failed }} job(s) not successful."
          exit 1
