name: GHCR SupaSerch Auth Smoke

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
  GHCR_PAT: ${{ secrets.GHCR_TOKEN || secrets.GH_PAT_PUBLISH || '' }}

jobs:
  supaserch-auth-smoke:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (PAT preferred)
        id: login_ghcr_pat
        if: ${{ env.GHCR_PAT != '' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PAT }}

      - name: Log in to GHCR (workflow token fallback)
        id: login_ghcr_actions
        if: ${{ steps.login_ghcr_pat.outcome != 'success' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Require GHCR authentication
        if: ${{ steps.login_ghcr_pat.outcome != 'success' && steps.login_ghcr_actions.outcome != 'success' }}
        run: |
          echo "::error::Unable to authenticate to GHCR."
          exit 1

      - name: Build and push SupaSerch auth smoke image
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="${REGISTRY}/${OWNER}/pmoves-supaserch"
          TAG="auth-smoke-${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --file pmoves/services/supaserch/Dockerfile \
            --tag "${IMAGE}:${TAG}" \
            --push \
            pmoves/services
          echo "Pushed ${IMAGE}:${TAG}"
