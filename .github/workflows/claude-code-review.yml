name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.tsx'
      - '**.jsx'
      - '**.sh'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'Makefile'
      - 'pmoves/mk/**'
      - '.github/workflows/**'
      # Config + behaviour-defining files are as risky as code (a misconfigured
      # compose/rooms-catalog or a bad agent/skill definition can break prod):
      - '**.yaml'
      - '**.yml'
      - '**.json'
      - 'pmoves/config/**'
      - 'pmoves/configs/**'
      - '.claude/agents/**'
      - '.claude/skills/**'

concurrency:
  group: claude-review-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: |
      github.event.pull_request.draft == false &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    # Least-privilege for a comment-only reviewer: it reads the diff and posts
    # PR review comments — it does not push commits or write attestations.
    # (claude.yml keeps contents:write because @claude can apply fix-ups.)
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@80b31826338489861333dc17217865dfe8085cdc # v1.0.155
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

