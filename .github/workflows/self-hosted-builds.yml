name: Self-Hosted Builds

on:
  # NOTE: push + pull_request triggers disabled until local builds work.
  # Self-hosted runners (ai-lab/5090, kvm4) need to be online and stable
  # AND NATS local must be reachable on the host before automatic
  # build dispatch is safe. Re-enable both blocks when:
  #   - 5090 node has completed submodule sync
  #   - pmoves-nats-1 is exposed to the host (4222/8222 portproxy fixed)
  #   - self-hosted runners pass a clean dispatch run
  # Operators: trigger manually via `gh workflow run self-hosted-builds.yml`.
  # push:
  #   branches: [main, develop]
  #   paths:
  #     - 'services/**'
  #     - 'pmoves/services/**'
  #     # Exclude services already built multi-arch by integrations-ghcr.yml
  #     - '!pmoves/services/agent-zero/**'
  #     - '!pmoves/services/archon/**'
  #     - '!pmoves/services/pmoves-yt/**'
  #     - 'pmoves/docker/**'
  #     - 'Dockerfile*'
  #     - 'docker-compose*.yml'
  #     - '**/docker-compose*.yml'
  #     - '.github/workflows/self-hosted-builds*.yml'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - 'services/**'
  #     - 'pmoves/services/**'
  #     # Exclude services already built multi-arch by integrations-ghcr.yml
  #     - '!pmoves/services/agent-zero/**'
  #     - '!pmoves/services/archon/**'
  #     - '!pmoves/services/pmoves-yt/**'
  #     - 'pmoves/docker/**'
  #     - 'Dockerfile*'
  #     - 'docker-compose*.yml'
  #     - '**/docker-compose*.yml'
  #     - '.github/workflows/self-hosted-builds*.yml'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target (staging/production/none)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
  GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN || github.token }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # GPU Builds - AI Lab Runner
  # ============================================================================
  build-gpu:
    name: GPU Services
    runs-on: [self-hosted, Linux, X64, ai-lab, gpu]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    # TODO: Re-enable when in-tree GPU Dockerfiles are created for ollama and hirag-gateway
    # Currently both ./services/ollama and ./services/hirag-gateway don't exist;
    # hirag-gateway is built via build-images.yml (manual dispatch) from pmoves/images.yaml.
    if: ${{ false }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Verify GPU
        run: |
          nvidia-smi
          docker run --rm --gpus all nvidia/cuda:12.0-base nvidia-smi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          permission-packages: write

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.app_token.outputs.token && 'x-access-token' || env.GHCR_USERNAME }}
          password: ${{ steps.app_token.outputs.token || env.GHCR_PASSWORD }}

      - name: Build Ollama CUDA
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./services/ollama
          file: ./services/ollama/Dockerfile.cuda
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/pmoves-ollama:cuda
            ${{ env.IMAGE_PREFIX }}/pmoves-ollama:cuda-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Hi-RAG GPU
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./services/hirag-gateway
          file: ./services/hirag-gateway/Dockerfile.gpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/pmoves-hirag-gateway:gpu
            ${{ env.IMAGE_PREFIX }}/pmoves-hirag-gateway:gpu-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test GPU inference
        run: |
          # Start Ollama container for testing
          docker run -d --name test-ollama --gpus all \
            ${{ env.IMAGE_PREFIX }}/pmoves-ollama:cuda

          # Wait for startup
          sleep 10

          # Verify GPU is being used
          docker exec test-ollama nvidia-smi

          # Cleanup
          docker rm -f test-ollama

  # ============================================================================
  # CPU Builds - Any VPS Runner
  # ============================================================================
  build-cpu:
    name: CPU Services
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      max-parallel: 2
      matrix:
        service:
          - name: agent-zero
            context: ./pmoves/services/agent-zero
          - name: extract-worker
            context: ./pmoves/services/extract-worker
          - name: publisher-discord
            context: ./pmoves/services/publisher-discord
          - name: pmoves-yt
            context: ./pmoves/services/pmoves-yt
          - name: channel-monitor
            context: ./pmoves/services/channel-monitor
          - name: archon
            context: ./pmoves/services/archon
          - name: ffmpeg-whisper
            context: ./pmoves/services/ffmpeg-whisper
          - name: model-registry
            context: ./pmoves/services/model-registry
          - name: gpu-orchestrator
            context: ./pmoves/services/gpu-orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          permission-packages: write

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.app_token.outputs.token && 'x-access-token' || env.GHCR_USERNAME }}
          password: ${{ steps.app_token.outputs.token || env.GHCR_PASSWORD }}

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/pmoves-${{ matrix.service.name }}:latest
            ${{ env.IMAGE_PREFIX }}/pmoves-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================================================
  # Contract Validation - Fast, any runner
  # ============================================================================
  validate-contracts:
    name: Validate NATS Contracts
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate schemas
        run: |
          cd pmoves/contracts
          for schema in schemas/**/*.schema.json; do
            echo "Validating: $schema"
            ajv compile -s "$schema" --spec=draft2020 --strict=false || exit 1
          done

      - name: Validate samples against schemas
        run: |
          cd pmoves/contracts
          # Validate sample files if they exist
          if [ -d "samples" ]; then
            for sample in samples/**/*.json; do
              if [ -f "$sample" ]; then
                echo "Validating sample: $sample"
              fi
            done
          fi

  # ============================================================================
  # Deploy Staging - cloudstartup Runner
  # ============================================================================
  deploy-staging:
    name: Deploy Staging
    runs-on: [self-hosted, cloudstartup, staging]
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [build-cpu, validate-contracts]
    if: |
      github.ref == 'refs/heads/develop' ||
      github.event.inputs.deploy_target == 'staging'
    environment: staging

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
          disable-sudo: false
          allowed-endpoints: |
            github.com:443
            api.github.com:443
            ghcr.io:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          ./deploy/scripts/deploy-compose.sh staging

      - name: Health check
        run: |
          sleep 30
          curl -sf http://localhost:8080/healthz || exit 1
          echo "Staging deployment healthy"

  # ============================================================================
  # Deploy Production - kvm4 Runner
  # ============================================================================
  deploy-production:
    name: Deploy Production
    runs-on: [self-hosted, kvm4, production]
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [build-cpu, validate-contracts, deploy-staging]
    if: |
      github.ref == 'refs/heads/main' ||
      github.event.inputs.deploy_target == 'production'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Pull latest images
        run: |
          docker pull ${{ env.IMAGE_PREFIX }}/pmoves-agent-zero:${{ github.sha }}

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          ./deploy/scripts/deploy-compose.sh production

      - name: Health check
        run: |
          sleep 60
          curl -sf http://localhost:8080/healthz || exit 1
          # hirag-gateway is built by build-images.yml (manual dispatch), not this workflow.
          # Best-effort check — non-fatal if hirag-gateway is not deployed.
          curl -sf http://localhost:8086/hirag/health || true
          echo "Production deployment healthy"

      - name: Notify Discord
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "PMOVES.AI deployed to production: ${{ github.sha }}"}' \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true

  # ============================================================================
  # Functional Tests - After deployment
  # ============================================================================
  functional-tests:
    name: Functional Tests
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [deploy-staging]
    if: needs.deploy-staging.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run TensorZero tests
        run: |
          TENSORZERO_URL=http://staging:3030 ./pmoves/tests/functional/test_tensorzero_inference.sh

      - name: Run Hi-RAG tests
        run: |
          HIRAG_URL=http://staging:8086 ./pmoves/tests/functional/test_hirag_query.sh || true

      - name: Run NATS pub/sub tests
        run: |
          NATS_URL=nats://staging:4222 ./pmoves/tests/functional/test_nats_pubsub.sh || true
