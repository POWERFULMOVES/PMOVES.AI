name: Image Staleness Ratchet

# Hard gate: every image in pmoves/images.yaml must be rebuildable from the
# tree AND have a build path that does not need a human to click.
#
# The 65-day flute-gateway staleness (2026-10-30) was not a missing image —
# it was a matrix whose only workflow was `workflow_dispatch:`. Nothing
# rebuilt it, so it aged silently. This ratchet fails on that condition:
# if build-images.yml loses its `schedule:`/`push:`/`repository_dispatch:`
# trigger, this check goes red instead of the fleet rotting in silence.
#
# Zero network, stdlib only, read-only against the tree.

on:
  pull_request:
    branches:
      - main
      - PMOVES.AI-Edition-Hardened
      - PMOVES.AI-Edition-Hardened-Integrations
    paths:
      - "pmoves/images.yaml"
      - "pmoves/configs/image_staleness/_known_gaps.yaml"
      - "pmoves/tools/image_staleness_ratchet.py"
      - "pmoves/tools/tests/test_image_staleness_ratchet.py"
      - ".github/workflows/build-images.yml"
      - ".github/workflows/image-staleness-ratchet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image-staleness-ratchet:
    name: image-staleness-ratchet
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SUBMODULES ARE MATERIALISED ON PURPOSE.
          #
          # Without this the checkout leaves every submodule directory empty,
          # and the ratchet -- correctly, because it cannot see into another
          # repository -- reports those images as UNDECIDED rather than
          # VERIFIED. MEASURED with a plain checkout: 19 of the 30 matrix
          # entries were UNDECIDED, so the gate was green while a deleted or
          # misspelled submodule Dockerfile could not possibly have been
          # caught. The build job in build-images.yml uses the same
          # `submodules: recursive`, so this checks out exactly the tree the
          # build will use.
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run ratchet (read-only, no network)
        run: python pmoves/tools/image_staleness_ratchet.py

      - name: Assert nothing is UNDECIDED (the gate must not be vacuous)
        run: |
          # "I could not check" must not be a way for this gate to pass. With
          # the submodules materialised above, every entry is decidable. An
          # UNDECIDED entry here means the ratchet could not resolve a build
          # input -- and a gate that cannot resolve things cannot catch a
          # deleted or misspelled Dockerfile. The ratchet deliberately does
          # NOT fail on UNDECIDED on its own (a tree without submodules is a
          # legitimate local state); in CI, where the tree IS complete, it
          # must not happen at all.
          python - <<'EOF'
          import json, subprocess, sys
          payload = json.loads(subprocess.run(
              [sys.executable, "pmoves/tools/image_staleness_ratchet.py", "--json"],
              capture_output=True, text=True, check=True).stdout)
          undecided = payload["undecided"]
          if undecided:
              for item in undecided:
                  print(f"::error::UNDECIDED {item['image']}: {item['evidence']}")
              sys.exit(1)
          print(f"OK: {payload['total']} image(s) decidable, 0 undecided")
          EOF

      - name: Pytest the ratchet (regression net for the ratchet itself)
        run: |
          # pmoves/conftest.py is shared across the tools/tests suite and
          # imports pytest_asyncio (asyncio_mode=auto in pyproject.toml) AND
          # pyyaml. The ratchet-only test file inherits both requirements
          # even though the ratchet tests are sync + stdlib-only -- there's
          # no way to import from pmoves.tools.* without the conftest import
          # chain resolving, so install everything conftest pulls in.
          python -m pip install --quiet pytest pytest-asyncio pyyaml
          python -m pytest pmoves/tools/tests/test_image_staleness_ratchet.py -v
