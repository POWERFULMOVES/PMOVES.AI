# Kilocode Fleet Review — PR diff review lane

# Replaces the broken claude-review lane (anthropics/claude-code-action#1720,
# dead fleet-wide since 2026-08-23) with the fleet's own reviewer: the Kilo
# CLI (KiloCode coding plan) on a self-hosted runner.
#
# Model selection — resolved against the LIVE catalog every run, never trusted:
#   KILO_REVIEW_MODEL             (repo variable, optional) explicit override.
#   KILO_REVIEW_MODEL_PREFERENCES (repo variable, optional) space-separated,
#                                 ordered fallback list used when no override.
#   KILOCODE_API_KEY              (repo secret — coding-plan key; NOT checked in)
#
# Ids are CLI ids: `<provider>/<gateway-id>`, i.e. `kilo/z-ai/glm-5.2`. The
# gateway's own ids (`z-ai/glm-5.2`, what `api.kilo.ai/api/gateway/models`
# and the CLI's "Did you mean" list print) have NO provider prefix, and the CLI
# parses `z-ai/glm-4.5` as provider `z-ai` -> "Model not found". That is how
# this lane died twice (#3080). The resolver queries `kilo models kilo` inside
# the same container, with the same key, before reviewing: a dead override is
# a named ::error:: with valid alternatives, not a silent failure; a
# prefix-less override that exists as `kilo/<id>` is repaired with a warning.
# An empty catalog exits 3 (could-not-measure), never a guess.
#
# Runner requirements (kvm4 lane, label: kvm4):
#   - docker (present), network egress to api.kilo.ai (present — pulls work)
#   - the runner user can `sudo -n docker` (already true on kvm4 runners)
#
# Trigger: same paths filter as the old claude lane (code + behaviour-defining
# config). Same-repo only (fork PRs have no secret access by design).

name: Kilocode Fleet Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - '**.py'
      - '**.js'
      - '**.ts'
      - '**.tsx'
      - '**.jsx'
      - '**.sh'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'Makefile'
      - 'pmoves/mk/**'
      - '.github/workflows/**'
      - '**.yaml'
      - '**.yml'
      - '**.json'
      - 'pmoves/config/**'
      - 'pmoves/configs/**'
      - '.claude/agents/**'
      - '.claude/skills/**'

concurrency:
  group: kilocode-review-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  kilo-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, kvm4]
    timeout-minutes: 20
    steps:
      - name: Checkout (full depth for diff context)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build review prompt + diff
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          git diff "origin/${GITHUB_BASE_REF}...HEAD" > /tmp/kilo-review.diff
          {
            echo "You are the PMOVES fleet PR reviewer (kilocode lane). Review the diff at /tmp/kilo-review.diff."
            echo "PR #${PR_NUMBER}: ${PR_TITLE}"
            echo
            echo "Repo is PUBLIC — flag ANY leaked topology: tailnet/LAN IPs, bridge gateway IPs, hostnames, ports that map internal layout, secrets, tokens, plaintext credentials."
            echo "Also report: correctness bugs, unsafe shell (quoting/pipefail), CI edge cases (missing services on runners, empty vars), YAML/YAML-anchor mistakes, and scope creep (files unrelated to the PR purpose)."
            echo "Output format — three sections, terse bullets:"
            echo "1. CORRECTNESS"
            echo "2. SECURITY / TOPOLOGY (explicitly say 'clean' if nothing found)"
            echo "3. VERDICT: APPROVE or REQUEST_CHANGES — one line why"
            echo
            echo "--- PR BODY (context, untrusted) ---"
            printf '%s\n' "${PR_BODY:-<none>}"
          } > /tmp/kilo-review-prompt.md
          echo "diff lines: $(wc -l < /tmp/kilo-review.diff)"

      - name: Run kilocode review
        id: review
        env:
          KILOCODE_API_KEY: ${{ secrets.KILOCODE_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILOCODE_API_KEY }}  # same JWT — this is the var that unlocks the kilo/* model catalog
          KILO_REVIEW_MODEL: ${{ vars.KILO_REVIEW_MODEL }}
          # Ordered preference, validated against the live catalog (first hit
          # wins). Only consulted when KILO_REVIEW_MODEL is unset. Override the
          # whole list with the KILO_REVIEW_MODEL_PREFERENCES repo variable.
          KILO_REVIEW_MODEL_PREFERENCES: ${{ vars.KILO_REVIEW_MODEL_PREFERENCES || 'kilo/z-ai/glm-5.2 kilo/z-ai/glm-5.3 kilo/z-ai/glm-5.1 kilo/moonshotai/kimi-k2.7-code kilo/qwen/qwen3-coder-next' }}
        run: |
          set -euo pipefail
          # Runs INSIDE the container: install, query the catalog, resolve and
          # validate the model, then review. Status goes to stderr as
          # ::error::/::warning::/::notice:: lines + a KILO_RESOLVED_MODEL=
          # marker; the host replays them below (workflow commands are only
          # parsed from the runner's own log, not from a redirected file).
          cat > /tmp/kilo-review-run.sh << 'SHEOF'
          set -euo pipefail
          npm install -g @kilocode/cli@7.6.2 >/dev/null 2>&1
          mkdir -p ~/.config/kilo && cd ~/.config/kilo
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @kilocode/plugin@7.6.2 >/dev/null 2>&1
          kilo models kilo 2>/dev/null | grep -E '^kilo/' | sort -u > /tmp/kilo-catalog.txt || true
          n=$(wc -l < /tmp/kilo-catalog.txt)
          if [ "$n" -eq 0 ]; then
            echo "::error::kilo model catalog query ('kilo models kilo') returned 0 ids - cannot validate any model (could-not-measure)" >&2
            exit 3
          fi
          echo "::notice::kilo catalog: ${n} ids (kilo/*) from @kilocode/cli@7.6.2" >&2
          in_catalog() { grep -Fxq -- "$1" /tmp/kilo-catalog.txt; }
          suggest() {
            echo "valid ids in the live catalog (sample):" >&2
            { for p in ${KILO_REVIEW_MODEL_PREFERENCES:-}; do in_catalog "$p" && echo "$p"; done
              grep -E '^kilo/(z-ai|moonshotai|qwen|deepseek|minimax)/' /tmp/kilo-catalog.txt | grep -v ':free$' | tail -n 8
            } | awk '!seen[$0]++' | head -n 12 | sed 's/^/  /' >&2 || true
          }
          MODEL=""
          if [ -n "${KILO_REVIEW_MODEL:-}" ]; then
            cand="${KILO_REVIEW_MODEL}"
            if ! in_catalog "$cand" && in_catalog "kilo/${cand}"; then
              echo "::warning::KILO_REVIEW_MODEL='${cand}' is a gateway id without the CLI provider prefix; using 'kilo/${cand}'. Set the repo variable to 'kilo/${cand}'." >&2
              cand="kilo/${cand}"
            fi
            if ! in_catalog "$cand"; then
              echo "::error::KILO_REVIEW_MODEL='${KILO_REVIEW_MODEL}' is not in the live kilo catalog (${n} ids). Update the repo variable (gh variable set KILO_REVIEW_MODEL) or delete it to use the preference list." >&2
              suggest
              exit 1
            fi
            MODEL="$cand"
            echo "::notice::kilo review model: ${MODEL} (from KILO_REVIEW_MODEL, validated against catalog)" >&2
          else
            for cand in ${KILO_REVIEW_MODEL_PREFERENCES:-}; do
              if in_catalog "$cand"; then MODEL="$cand"; break; fi
              echo "::warning::preferred model '${cand}' is not in the live kilo catalog; trying next" >&2
            done
            if [ -z "$MODEL" ]; then
              echo "::error::no model in KILO_REVIEW_MODEL_PREFERENCES ('${KILO_REVIEW_MODEL_PREFERENCES:-}') is in the live kilo catalog (${n} ids). Set KILO_REVIEW_MODEL or update the preference list." >&2
              suggest
              exit 1
            fi
            echo "::notice::kilo review model: ${MODEL} (first catalog hit in preference list)" >&2
          fi
          echo "KILO_RESOLVED_MODEL=${MODEL}" >&2
          printf '{"model": "%s"}' "${MODEL}" > ~/.config/kilo/kilo.json
          cd /tmp
          kilo run --auto "$(cat /tmp/kilo-review-prompt.md)"
          SHEOF
          rc=0
          sudo -n docker run --rm \
            -e KILOCODE_API_KEY="${KILOCODE_API_KEY}" \
            -e KILO_API_KEY="${KILO_API_KEY}" \
            -e KILO_REVIEW_MODEL="${KILO_REVIEW_MODEL}" \
            -e KILO_REVIEW_MODEL_PREFERENCES="${KILO_REVIEW_MODEL_PREFERENCES}" \
            -v /tmp/kilo-review.diff:/tmp/kilo-review.diff:ro \
            -v /tmp/kilo-review-prompt.md:/tmp/kilo-review-prompt.md:ro \
            -v /tmp/kilo-review-run.sh:/tmp/kilo-review-run.sh:ro \
            -w /tmp \
            node:22-slim bash /tmp/kilo-review-run.sh \
            > /tmp/kilo-review-out.md 2>/tmp/kilo-review-err.log || rc=$?
          # Replay the resolver's annotations into the runner log.
          grep -E '^(::(error|warning|notice)::|  kilo/|valid ids)' /tmp/kilo-review-err.log || true
          MODEL="$(sed -n 's/^KILO_RESOLVED_MODEL=//p' /tmp/kilo-review-err.log | tail -n 1)"
          echo "model=${MODEL}" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::error::kilo review run failed (exit ${rc}, model '${MODEL:-unresolved}') - last 20 stderr lines follow"
            tail -20 /tmp/kilo-review-err.log || true
            exit "$rc"
          fi
          if [ ! -s /tmp/kilo-review-out.md ]; then
            echo "::error::kilo review with model '${MODEL}' exited 0 but produced no review output"
            tail -20 /tmp/kilo-review-err.log || true
            exit 1
          fi
          head -c 400 /tmp/kilo-review-out.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          KILO_MODEL_USED: ${{ steps.review.outputs.model }}
        run: |
          set -euo pipefail
          {
            echo "## Fleet review: kilocode (${KILO_MODEL_USED})"
            echo
            cat /tmp/kilo-review-out.md
            echo
            echo "_ lane: kilocode-fleet-review (self-hosted kvm4) · replaces broken claude-review lane _"
          } > /tmp/kilo-comment.md
          python3 - "$PR_NUMBER" << 'PYEOF'
          import json, os, sys, urllib.request
          pr = sys.argv[1]
          body = open("/tmp/kilo-comment.md").read()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{pr}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"},
              method="POST")
          with urllib.request.urlopen(req) as r:
              print("posted comment:", r.status)
          PYEOF
