# Merge Gate — Required status checks for all PRs targeting main
# Configure branch protection in GitHub Settings > Branches > main:
#   Required status checks: Merge Gate / merge-decision
#
# Note: CodeQL scanning is handled by codeql.yml (CodeQL Advanced) separately.
# This avoids duplicate scans and transient init failures.

name: Merge Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check required validations
        id: gate
        run: |
          PASSED=true
          # List all required check names
          echo "Checking required validations..."
          echo "All checks passed=true" >> $GITHUB_OUTPUT
          echo "passed=true" >> $GITHUB_OUTPUT

  # Ratcheted: runs ALL test_*.py (previously capped at `head -20` of 264 by
  # filesystem order) and can actually fail (previously ended in `|| true`).
  # New failures and fixed-but-still-baselined entries both fail the job.
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        # No `|| fallback` and no `2>/dev/null`: a missing or unresolvable
        # requirements file must fail the job, not silently install four packages.
        run: pip install -r .github/requirements-tests.txt
      - name: Run Python tests (ratchet)
        run: python pmoves/tools/pytest_ratchet.py

  docker-build-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Docker Compose
        run: |
          pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('pmoves/docker-compose.yml'))" 2>/dev/null || echo 'Compose validation skipped'

  # Ratcheted: judges ALL 99 tracked Dockerfiles (previously globbed
  # pmoves/services/*/Dockerfile, which sees 76 of them and misses 10 of the 12
  # that run as root) and can actually fail (previously ended in `|| echo`).
  # It also now judges the *effective* user: pmoves/images/jellyfin/Dockerfile
  # sets a non-root USER and then switches back with a later `USER root`, which
  # a substring search for USER scored as compliant.
  # New findings and fixed-but-still-baselined entries both fail the job.
  hardening-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # No pip install: the ratchet is stdlib-only and discovers via `git
      # ls-files`, so it needs the checkout and nothing else.
      - name: Check container hardening (ratchet)
        run: python pmoves/tools/hardening_ratchet.py

  merge-decision:
    needs: [python-tests, docker-build-validation, hardening-validation, verifier-gate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate gate status
        run: |
          echo "Merge gate evaluation:"
          echo "  python-tests: ${{ needs.python-tests.result }}"
          echo "  docker-build-validation: ${{ needs.docker-build-validation.result }}"
          echo "  hardening-validation: ${{ needs.hardening-validation.result }}"
          echo "  verifier-gate: ${{ needs.verifier-gate.result }}"
          # The verifier-gate workflow has a paths: filter; when a PR
          # doesn't touch the relevant paths, the workflow is
          # 'skipped' and there's no status check to gate on. A
          # 'skipped' result is therefore treated as a pass for the
          # merge-decision (the gate simply didn't apply to this PR).
          if [[ "${{ needs.python-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.docker-build-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.hardening-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.verifier-gate.result }}" == "failure" ]]; then
            echo "::error::Merge gate FAILED — one or more required checks failed"
            exit 1
          fi
          echo "Merge gate PASSED"
