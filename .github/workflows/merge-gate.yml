# Merge Gate — Required status checks for all PRs targeting main
# Configure branch protection in GitHub Settings > Branches > main:
#   Required status checks: merge-decision
#
# There used to be a job here literally named `merge-gate` whose entire body
# was `echo "passed=true"`. It took no input, evaluated nothing, and could not
# report anything but success — while carrying the name that reads, in the
# checks list and in the branch-protection config, as THE gate. It was never in
# merge-decision's `needs`, so nothing depended on it; it only ever supplied a
# green tick next to an authoritative-sounding name. Removed, and the required
# context moved to `merge-decision`, which actually evaluates the other jobs.
#
# Note: CodeQL scanning is handled by codeql.yml (CodeQL Advanced) separately.
# This avoids duplicate scans and transient init failures.

name: Merge Gate

on:
  pull_request:
    # `PMOVES.AI-Edition-Hardened` is here because its branch protection
    # REQUIRES the `hardening-validation` context, and that context is a job in
    # THIS workflow. While the trigger was main-only the job never ran for a
    # hardened PR, so the required check was never reported, so no PR into that
    # branch could ever satisfy its own protection. The branch had not been
    # synced since 2026-03-17 -- not for want of trying, but because every
    # attempt was structurally unmergeable.
    #
    # A required context that no workflow produces is the same defect this
    # file's header already records removing: a name in the protection config
    # that reads as THE gate while nothing stands behind it. There it was a job
    # that could only report success; here it was a job that could not report
    # at all.
    #
    # Every job in this gate is branch-agnostic -- checkout, a pinned toolchain,
    # and a ratchet run -- so widening the trigger changes what is CHECKED, not
    # how anything is checked.
    branches: [main, PMOVES.AI-Edition-Hardened]
    types: [opened, synchronize, reopened]

# HAND-MAINTAINED COUNT (1 of 3). The gate-job count appears literally in three
# places that nothing keeps in step: here, in the no-skip rationale inside
# merge-decision, and in merge-decision's final "all eleven gates" message. Adding
# a job means `needs:`, the `for r in` loop, AND all three of these. Miss the loop
# and the aggregator passes while ignoring a gate.
#
# All eleven jobs are read-only: checkout, install, run a make target or a python
# script, and report. Verified before setting this -- no `gh pr`/`gh api`, no
# github-script, no comment or label writes, and the ghcr/"packages" hits in this
# file are all prose in comments, not registry pulls. So contents:read is the
# whole requirement, matching the sibling workflows.
permissions:
  contents: read

jobs:
  # Ratcheted: runs ALL test_*.py (previously capped at `head -20` of 264 by
  # filesystem order) and can actually fail (previously ended in `|| true`).
  # New failures and fixed-but-still-baselined entries both fail the job.
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The repository default for GITHUB_TOKEN is `write`, so a job that omits
    # this block runs the whole test suite with a token that can push to the
    # repo. These jobs only need to read the checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        # No `|| fallback` and no `2>/dev/null`: a missing or unresolvable
        # requirements file must fail the job, not silently install four packages.
        run: pip install -r .github/requirements-tests.txt
      - name: Run Python tests (ratchet)
        run: python pmoves/tools/pytest_ratchet.py

  # This job could not fail. Its body parsed ONE of 55 tracked compose files,
  # sent the error to /dev/null, and ended in `|| echo 'Compose validation
  # skipped'` - so it exited 0 whatever happened, while sitting in
  # merge-decision's `needs` supplying a guaranteed green vote under a name that
  # reads as though Docker builds were being validated. Same shape as the
  # `merge-gate` job removed from this file for the same reason.
  #
  # It now parses all 55 and fails on any that do not. Note the obvious version
  # of that fix is wrong: two overlays use Compose's own `!reset` / `!override`
  # merge tags, which plain safe_load rejects. The tool registers them.
  docker-build-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate every tracked compose file parses
        run: make -C pmoves compose-yaml-check

      # Lives in THIS job rather than its own because this job already installs
      # uv and is the static-config validator in practice. A separate job would
      # add a new check name, and required_status_checks contexts are branch
      # protection -- a governance change, not a workflow one.
      #
      # ROOM_MANIFEST_CONTRACT.md records this smoke path as DONE and nothing
      # ran it. Two manifests were failing schema validation invisibly.
      - name: Validate every room manifest against the schema and catalog
        run: make -C pmoves room-manifest-check
  # The split overlays (docker-compose.{base,core,agents,media,ui,workers,apps,
  # juicefs}.yml) are GENERATED from docker-compose.yml. A drift gate for them
  # already exists -- the `Validate Compose Files` job in
  # hardening-validation.yml -- and it has no authority:
  #
  #   * That workflow is `paths:`-filtered on pmoves/docker-compose*.yml, so on a
  #     PR that touches no compose file the job does not run AT ALL. Measured: it
  #     is absent from all 23 checks reported on PR #3102.
  #   * main's required contexts are python-tests, hardening-validation, verify
  #     and submodule-gitlink-gate, with enforce_admins false. The drift job is
  #     not among them, so it blocks nothing even when it does run -- PR #3082
  #     merged while it was red.
  #
  # Requiring `Validate Compose Files` directly is NOT the fix: a path-filtered
  # workflow can never safely be a required context, because a skipped workflow
  # leaves its check Pending and the PR waits forever. This file's `on:` block
  # already records that exact defect costing `PMOVES.AI-Edition-Hardened` every
  # merge since 2026-03-17. So the check lives HERE, in a workflow with no path
  # filter, aggregated by merge-decision -- the same reasoning as
  # agent-zero-pin-check below.
  #
  # Unlike the room-manifest smoke path above, this is its own job rather than
  # another step on docker-build-validation. Deliberate: it adds no required
  # context (merge-decision remains the only one), and while the compose source
  # drift on main is unrepaired this failure needs to be legible by NAME in the
  # checks list rather than surfacing as a red `docker-build-validation`.
  compose-split-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Installed via the official script rather than a marketplace action, as the
      # sibling jobs do. The make target renders through
      # `uv run --no-project --with ruamel.yaml==0.19.1`, and that ruamel pin is
      # what keeps the CI render byte-identical to a local one -- an unpinned
      # ruamel would report drift that is only a formatting difference.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The same make target a human runs. It regenerates the overlays in place
      # and fails on `git status --porcelain` output -- porcelain rather than
      # `git diff --exit-code`, because diff exits 0 for untracked files, so a PR
      # that DELETED a generated overlay would regenerate it as untracked and
      # pass a diff-based gate.
      - name: Check split overlays are in sync with the compose source
        # The bare make target fails with a plain-text ERROR line, which reaches
        # the log but leaves the check summary reading only "Process completed
        # with exit code 2" (measured on this job's first run). A blocking gate
        # has to say WHY where the author actually looks -- and above all has to
        # say what NOT to do: `compose-split` would make this green by DELETING
        # the hand-edits that were never ported into the source. The sibling
        # check in hardening-validation.yml annotates for the same reason.
        #
        # set +e because the default shell is `bash -e`, which would abort the
        # step before the annotation is written. The make exit code is preserved.
        run: |
          set +e
          make -C pmoves compose-split-check
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Split overlays are out of sync with pmoves/docker-compose.yml (see the ERROR line and file list above). Do NOT run 'make -C pmoves compose-split' to clear this: the overlays carry hand-edits that were never ported into the source monolith, so regenerating DELETES live config. Port the edits into pmoves/docker-compose.yml first, then regenerate."
            exit "$rc"
          fi

  # Ratcheted: judges ALL 99 tracked Dockerfiles (previously globbed
  # pmoves/services/*/Dockerfile, which sees 76 of them and misses 10 of the 12
  # that run as root) and can actually fail (previously ended in `|| echo`).
  # It also now judges the *effective* user: pmoves/images/jellyfin/Dockerfile
  # sets a non-root USER and then switches back with a later `USER root`, which
  # a substring search for USER scored as compliant.
  # New findings and fixed-but-still-baselined entries both fail the job.
  hardening-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # No pip install: the ratchet is stdlib-only and discovers via `git
      # ls-files`, so it needs the checkout and nothing else.
      - name: Check container hardening (ratchet)
        run: python pmoves/tools/hardening_ratchet.py

  # The COMPOSE-OVERLAY hardening ratchet, promoted here from advisory-only.
  #
  # Read this name against `hardening-validation` directly above, because the
  # two are easy to confuse and that confusion is how the gap survived. THAT job
  # runs pmoves/tools/hardening_ratchet.py and judges the 99 tracked
  # DOCKERFILES. THIS job runs pmoves/tools/compose_hardening_ratchet.py and
  # judges the 28 SERVICES in pmoves/docker-compose.hardened.yml against five
  # runtime properties (user, read_only, cap_drop, no-new-privileges, resource
  # limits). Two ratchets, two subjects, two tools. A third name,
  # `validate-compose`, lives in hardening-validation.yml and is something else
  # again -- so this job is named for what it READS, not for what it sits near.
  #
  # Why it is re-implemented here instead of aggregated: the check already ran,
  # in hardening-validation.yml, on every PR -- and blocked nothing, because
  # `needs:` cannot reference a job in another workflow file, so merge-decision
  # could never depend on it. Before this commit, merge-gate.yml contained zero
  # occurrences of compose_hardening/compose-hardening. An unenforced check that
  # fires on every PR reads, from the checks list, exactly like an enforced one.
  # The advisory copy stays where it is; it also uploads the report artifact.
  #
  # SAFE TO PROMOTE, measured on this exact tree before the promotion landed:
  #   $ ./pmoves/scripts/validate-hardening.sh
  #   28 services x 5 properties = 140 evaluated; 112 passed + 28 findings = 140
  #   Findings: 28 (28 baselined, 0 new)                              exit 0
  # All 28 findings are the single NO_RESOURCE_LIMITS property; user, read_only,
  # cap_drop and no-new-privileges are 28/28 clean. Whether resource limits
  # SHOULD be required on those 28 services is an open policy question and is
  # NOT decided here. Promotion blocks nothing that exists today. It blocks the
  # next regression.
  #
  # No `if:` and no path filter, deliberately. A job that SKIPS satisfies a
  # required check under GitHub's own semantics -- success, skipped and neutral
  # all satisfy it -- so a path-filtered gate is an unenforced gate on every PR
  # that happens not to touch the path. That is the same fail-open shape as an
  # advisory check wearing an enforced name. merge-decision's loop below treats
  # a skip as a failure for the same reason.
  compose-hardening-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # PyYAML is a hard requirement, not a convenience. The tool parses the
      # overlay and deliberately refuses a grep fallback -- a missing import
      # raises CouldNotMeasure and exits 3, so an absent dependency is a red job
      # rather than a false pass. Same pin hardening-validation.yml uses.
      - name: Install PyYAML
        run: python -m pip install --quiet "PyYAML>=6,<7"
      - name: Check compose overlay hardening (ratchet)
        # Exit 0 = clean, 1 = new finding and/or stale baseline entry, 3 = COULD
        # NOT MEASURE. Invoked directly rather than through a make target: make
        # collapses every nonzero exit to 2, which would render 1 and 3 -- a real
        # regression and a check that never ran -- indistinguishable here.
        #
        # set +e because the default shell is `bash -e`, which would abort the
        # step before the annotation is written. The exit code is preserved and
        # re-raised, so the job's result still comes from the tool.
        run: |
          set +e
          ./pmoves/scripts/validate-hardening.sh
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::error::COULD NOT MEASURE the compose hardening ratchet (exit 3). This is NOT a pass -- the check did not run at all. The reason is printed above; fix that rather than treating the job as flaky."
            exit "$rc"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::Compose overlay hardening regressed (exit $rc). Either a service in pmoves/docker-compose.hardened.yml lost a required property (user / read_only / cap_drop: ALL / no-new-privileges / resource limits), or a baselined gap was fixed without being removed from pmoves/configs/hardening_ratchet/_compose_known_gaps.yaml. Restore the property on the service -- do NOT add a new baseline entry to make this green."
            exit "$rc"
          fi

  # A SHA-pinned action that does not exist fails the workflow during SETUP —
  # before runs-on resolves, before any step logs, before any annotation. The
  # run shows `startup_failure`, which reads exactly like a runner hiccup. Two
  # such pins were live and unnoticed: branch-protection-drift/ruleset-sync
  # (0 successful runs, ever) and build-nats-workers (5/5 startup_failure since
  # 2026-07-26). This gate makes the next one a PR failure instead.
  action-pin-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Stdlib-only; resolves pins through the `gh` CLI preinstalled on the
      # runner, authenticated with the workflow token.
      - name: Validate SHA-pinned actions resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pmoves/tools/action_pin_audit.py

  # `# lgtm[<rule>]` is LGTM.com syntax. LGTM.com was folded into GitHub code
  # scanning, which ignores the pragma entirely — so every such marker claims a
  # suppression it does not perform, and the next reader reads an open HIGH
  # alert as triaged. Ten of them were live here on 2026-08-31 while four of the
  # marked lines carried open HIGH alerts (334/335/336/265). Same failure shape
  # as the two gates above: something that reports handled without having acted.
  suppression-marker-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Stdlib-only, discovers via `git ls-files`, so checkout is all it needs.
      # Exits 3 (not 0) if it cannot enumerate the tree — could-not-measure is
      # not a pass.
      - name: Check for lgtm[] suppression markers
        run: python pmoves/tools/lgtm_marker_check.py

  # pmoves/config/agent_registry.yaml is what a human or a tool reads to answer
  # "what is this component and how do I reach it". Two entries claimed a
  # submodule that is not in .gitmodules and an SSE endpoint nothing listens on,
  # while the code was first-party and stdio-only. A drifted registry does not
  # fail loudly; it quietly sends people somewhere that does not exist.
  agent-registry-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Installed via the official script rather than a marketplace action: no
      # other workflow here uses setup-uv, so adding it would mean a new entry in
      # the Actions allowlist and another SHA to keep pinned, for one binary.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The same make target a human runs. A CI-only invocation drifts from the
      # local one, and then only one of them is ever right.
      - name: Check the agent registry describes reality
        run: make -C pmoves agent-registry-check

  # Bring-up order is DERIVED from the compose graph rather than authored, so it
  # cannot drift silently as services are added. Blocking findings are a
  # dependency cycle, a dependency nothing defines, and an unreadable or missing
  # compose input. Healthcheck gaps and weak waits are advisory (exit 3) and only
  # warn.
  #
  # Advisory is exit 3 and deliberately not 2, because 2 is what a FAILED RUNNER
  # returns - argparse uses it, and uv returns it when the script cannot start.
  # A caller that treated 2 as advisory could not tell "the graph has advice"
  # from "the tool never ran", and would accept an empty result as success.
  dep-matrix-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Installed via the official script rather than a marketplace action: no
      # other workflow here uses setup-uv, so adding it would mean a new entry in
      # the Actions allowlist and another SHA to keep pinned, for one binary.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the compose dependency graph
        run: make -C pmoves dep-matrix-check

  # The agent-zero image installs dependencies TWICE into one venv - the fork's
  # requirements first, ours second as a --constraint - so ours wins. Our lock
  # had resolved a package BELOW the version the fork pins for a published
  # advisory, because we declared a package that caps it. The fork's pin was
  # intact in the fork's file the whole time; the image ran something else.
  #
  # This lived in its own path-filtered workflow first. Per GitHub's own
  # guidance, a path-filtered workflow can never safely be a required check: a
  # skipped workflow leaves its checks Pending and blocks the merge, so the
  # advice is to avoid requiring workflows that can be skipped. A check that can
  # never gate anything is the same orphan this commit exists to remove, so it
  # lives here instead - unfiltered, aggregated, and requirable.
  #
  # No submodule checkout needed: the tool falls back to fetching the fork's
  # requirements.txt at the GITLINK sha over https, which keeps the comparison
  # deterministic. Gitlink-vs-branch drift is submodule-freshness.yml's job.
  agent-zero-pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check our lock against the fork's declared pins
        run: make -C pmoves agent-zero-pin-check

  # Six workflows guard their self-hosted jobs against fork PRs, in three
  # mutually incompatible spellings, and not one asserted the invariant. So the
  # seventh case shipped unguarded: submodule-smoke.yml's `smoke-test` runs on
  # `[self-hosted, Linux, X64, ai-lab]` -- physical fleet hardware -- on a
  # `pull_request` trigger, which checks out the PR's OWN code, gated only by a
  # PR label. Labelling a fork's PR would have run untrusted code on a fleet node.
  #
  # A convention protects only the files whoever wrote it remembered. This job is
  # what makes the eighth case a PR failure instead of another silent one.
  #
  # No pytest step: pytest_ratchet.py rglobs every test_*.py in the repo, so the
  # gate's own 29-case suite is already run by `python-tests` above. Running it
  # here too would just be a second copy of the same result.
  fork-guard-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # pyyaml only. The gate PARSES `runs-on` per job rather than grepping:
      # `grep -l self-hosted` over this directory matches 22 files, while parsing
      # finds 30 self-hosted jobs in 14. A grep-based version would be a check
      # that cannot do what its name implies.
      - name: Install pyyaml
        run: python -m pip install --quiet pyyaml
      - name: Assert every fork-reachable self-hosted job has a fork guard
        run: python pmoves/tools/validate_fork_guards.py

  merge-decision:
    # Reads nothing and writes nothing - it only inspects `needs` results.
    permissions: {}
    needs: [python-tests, docker-build-validation, compose-split-drift-check,
            hardening-validation, compose-hardening-check, action-pin-validation,
            agent-registry-check, dep-matrix-check, agent-zero-pin-check,
            suppression-marker-check, fork-guard-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate gate status
        run: |
          echo "Merge gate evaluation:"
          echo "  python-tests: ${{ needs.python-tests.result }}"
          echo "  docker-build-validation: ${{ needs.docker-build-validation.result }}"
          echo "  compose-split-drift-check: ${{ needs.compose-split-drift-check.result }}"
          echo "  hardening-validation: ${{ needs.hardening-validation.result }}"
          echo "  compose-hardening-check: ${{ needs.compose-hardening-check.result }}"
          echo "  action-pin-validation: ${{ needs.action-pin-validation.result }}"
          echo "  agent-registry-check: ${{ needs.agent-registry-check.result }}"
          echo "  dep-matrix-check: ${{ needs.dep-matrix-check.result }}"
          echo "  agent-zero-pin-check: ${{ needs.agent-zero-pin-check.result }}"
          echo "  suppression-marker-check: ${{ needs.suppression-marker-check.result }}"
          echo "  fork-guard-check: ${{ needs.fork-guard-check.result }}"
          # REQUIRE success — do not merely reject "failure".
          #
          # A needs.<job>.result is one of success | failure | cancelled | skipped.
          # Testing only for "failure" let cancelled and skipped through, so a run
          # that never evaluated a gate reported PASSED. That is the same fail-open
          # shape this PR exists to remove, reproduced in the gate meant to close it:
          # an instrument that reports fine without having measured anything.
          #
          # HAND-MAINTAINED COUNT (2 of 3). The other two are the `permissions`
          # comment at the top of this file and the "all eleven gates" message at
          # the end of this step. The authority is the `for r in` loop below, not
          # any of these three numbers.
          #
          # None of the eleven jobs carries an `if:` or a path filter, so they always
          # run — a skip is not a legitimate state here, and if one ever appears it
          # is itself worth failing on rather than passing silently.
          failed=0
          for r in "python-tests:${{ needs.python-tests.result }}" \
                   "docker-build-validation:${{ needs.docker-build-validation.result }}" \
                   "compose-split-drift-check:${{ needs.compose-split-drift-check.result }}" \
                   "hardening-validation:${{ needs.hardening-validation.result }}" \
                   "compose-hardening-check:${{ needs.compose-hardening-check.result }}" \
                   "action-pin-validation:${{ needs.action-pin-validation.result }}" \
                   "agent-registry-check:${{ needs.agent-registry-check.result }}" \
                   "dep-matrix-check:${{ needs.dep-matrix-check.result }}" \
                   "agent-zero-pin-check:${{ needs.agent-zero-pin-check.result }}" \
                   "suppression-marker-check:${{ needs.suppression-marker-check.result }}" \
                   "fork-guard-check:${{ needs.fork-guard-check.result }}"; do
            job="${r%%:*}"; res="${r#*:}"
            if [[ "$res" != "success" ]]; then
              echo "::error::Merge gate FAILED — $job did not succeed (result: ${res:-<empty>})"
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          # HAND-MAINTAINED COUNT (3 of 3). The other two are the `permissions`
          # comment at the top of this file and the no-skip rationale above. This
          # line is cosmetic — the loop above is what decides — but a stale number
          # here is how a reader learns to distrust the other two.
          echo "Merge gate PASSED — all eleven gates reported success"
