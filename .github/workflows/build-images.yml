name: build-images-matrix

on:
  workflow_dispatch:
  # Rebuild the fleet on a cadence instead of on a human's click. Without
  # this trigger the matrix was dispatch-only, so nothing rebuilt the
  # images automatically and they went stale silently (flute-gateway was
  # 65 days stale on 2026-10-30 -- see
  # pmoves/docs/services/PIPECAT_FORK_PROVENANCE_AUDIT_2026-10-30.md,
  # "Gap 3").
  #
  # Cron minute is 23, NOT 0. GitHub queues scheduled workflows at the top
  # of the hour, so a fleet-wide build pinned to :00 lands in the same
  # queue as every other scheduled job in the fleet. 23 keeps this off the
  # hour and off-peak.
  #
  # MEASURED across .github/workflows, by PARSING every workflow file: 74
  # files scanned, 74 parsed, 0 dropped, 18 carry a live `schedule:`. A
  # commented-out `schedule:` is genuinely absent, not "probably absent" --
  # integrations-ghcr.yml's '17 7 * * *' is COMMENTED OUT (lines 97-98), so
  # it never runs and is deliberately NOT cited as a neighbour.
  #
  # The `build` job runs on `[self-hosted, Linux, X64]`, so the question that
  # matters is SELF-HOSTED contention. Measured against all 18:
  #
  #   * EXACTLY 2 schedules fire at clock time 04:00 -- the nearest by clock
  #     time: review-collect.yml ('0 */2 * * *', every even hour) and
  #     branch-protection-ruleset-sync.yml ('0 4 * * 0', Sundays only). BOTH
  #     are HOSTED (ubuntu-24.04), so neither takes a self-hosted runner.
  #   * EXACTLY 2 schedules fire at 03:00, 83 minutes earlier, and BOTH are
  #     SELF-HOSTED: fleet-docker-cleanup.yml ('0 3 * * *', runs-on
  #     [self-hosted, Linux, X64, ...]) and runner-maintenance.yml
  #     ('0 3 * * *', runs-on [self-hosted, ...]).
  #   * The next SELF-HOSTED schedule after the slot is
  #     submodule-update-check.yml at 06:00 -- 97 minutes later, Sundays
  #     only, runs-on [self-hosted, Linux, X64, ai-lab]. The only other
  #     self-hosted schedule in the fleet is
  #     python-images-toolchain-canary.yml at 09:00.
  #
  # 04:23 therefore sits clear of every self-hosted schedule in the fleet.
  #
  # For completeness, EXACTLY 7 schedules fire at clock time 06:00:
  # agent-zero-upstream-check, branch-protection-drift, branch-protection-sync
  # (Mondays only), fork-sync, review-collect, stale-branch-sweep and
  # submodule-update-check (Sundays only) -- only the last is self-hosted.
  # The two other early-morning neighbours are orphan-branch-ratchet at
  # 06:30 and archon-release-track at 06:41, both hosted.
  schedule:
    - cron: '23 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY_GHCR: ghcr.io/powerfulmoves
  REGISTRY_DH: powerfulmoves
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
  GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN || github.token }}

jobs:
  setup-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse image matrix
        id: set-matrix
        run: |
          python3 - <<'EOF'
          import yaml, json, pathlib, os
          data = yaml.safe_load(pathlib.Path("pmoves/images.yaml").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(data['images'])}\n")
          EOF

  build:
    # Named explicitly: with no `name:` this job's context was the bare
    # `build`, which build-nats-workers.yml (push on main) also publishes.
    # Required checks match on name alone, and dispatch-only is not
    # protection -- see self-hosted-builds.yml and #2840.
    #
    # Renamed from `Manual Image Build` (2026-10-31): the workflow now has a
    # `schedule:` trigger, so "Manual" was a lie -- the job runs unattended.
    # MEASURED before renaming: the literal string `Manual Image Build`
    # appeared in exactly ONE place (this file), and main's required status
    # check contexts are merge-decision, python-tests, hardening-validation,
    # verify and submodule-gitlink-gate -- so `Manual Image Build` was never
    # a required context and no branch protection rule referenced it.
    name: Image Build
    needs: setup-matrix
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: ./.github/actions/pmoves-buildx

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          permission-packages: write

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ steps.app_token.outputs.token && 'x-access-token' || env.GHCR_USERNAME }}
          password: ${{ steps.app_token.outputs.token || env.GHCR_PASSWORD }}

      - name: Login DockerHub (optional)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # `repo:` is the DISCRIMINATOR; `context` is the fallback.
          #
          # MEASURED before changing this: the old expression was
          #   context: ${{ matrix.context || format('{0}/{1}', github.workspace, matrix.repo) }}
          # and a NON-EMPTY `context` always won. 18 of the 19 repo-backed
          # entries set `context: .`; the one exception (pmoves-tokenism-ui)
          # sets `context: pmoves-nextjs`. A dot is TRUTHY in a GitHub
          # Actions expression, so `matrix.context` always won and the
          # `github.workspace/matrix.repo` fallback was DEAD CODE: 18 images
          # resolved against the WORKSPACE ROOT and one against
          # `github.workspace/pmoves-nextjs` -- in every case a directory
          # that does not hold that image's Dockerfile. The evidence that this
          # was never working: the last 7 runs of this workflow ALL failed,
          # and 11 of those 19 declare a Dockerfile that IS present at their
          # submodule's pinned commit -- the intent was always to build from
          # the submodule. `file` is left RELATIVE so the action resolves it
          # against the context, exactly as it already does for the in-tree
          # entries (whose resolution is unchanged by this edit).
          #
          # `context` is now DEAD for every repo-backed entry -- the repo
          # wins outright -- so `pmoves-tokenism-ui`'s declared
          # `context: pmoves-nextjs` no longer says anything. The image
          # staleness ratchet flags that entry rather than letting the
          # contradiction sit in the matrix where nobody would look for it.
          context: ${{ matrix.repo && format('{0}/{1}', github.workspace, matrix.repo) || matrix.context }}
          file: ${{ matrix.dockerfile || 'Dockerfile' }}
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ matrix.name }}:edge
            ${{ env.REGISTRY_GHCR }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY_DH }}/${{ matrix.name }}:edge
            ${{ env.REGISTRY_DH }}/${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.name }}
          cache-from: type=registry,ref=${{ env.REGISTRY_GHCR }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_GHCR }}/${{ matrix.name }}:buildcache,mode=max
          provenance: true
          sbom: true
          build-args: |
            IMAGE_REF=${{ matrix.ref }}

      - name: Attest build provenance (SLSA L3)
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
