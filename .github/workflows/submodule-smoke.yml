name: Submodule Update Smoke Test

on:
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  gate-check:
    name: Check if upstream-update PR
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check for upstream-update label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$PR_LABELS" | grep -q '"upstream-update"'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "PR has upstream-update label — running smoke tests"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "PR does not have upstream-update label — skipping"
          fi

  smoke-test:
    name: Submodule Smoke Test
    needs: gate-check
    # FORK GUARD. This workflow triggers on `pull_request` -- not
    # `pull_request_target` -- so the checkout below is the PR's OWN code. The
    # label gate above is an intent filter, not a trust boundary: applying
    # `upstream-update` to a fork's PR is a routine, low-suspicion action, and
    # without this line it would execute untrusted code on `ai-lab`, which the
    # comment below records as physical fleet hardware. Self-hosted runners are
    # non-ephemeral by default, so the exposure would outlive the run.
    #
    # `head.repo.full_name == github.repository` and NOT the sibling spelling
    # `github.event_name != 'pull_request'` used in integrations-ghcr.yml and
    # self-hosted-builds.yml: this workflow's ONLY trigger is `pull_request`, so
    # that spelling would be permanently false and would disable the check
    # rather than guard it -- closing the hole by breaking the instrument.
    #
    # The label gate is deliberately kept. This is defence in depth, not a
    # replacement. Asserted for every self-hosted job by
    # pmoves/tools/validate_fork_guards.py, wired into merge-gate.yml.
    if: >-
      needs.gate-check.outputs.should_run == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # ai-lab spans b850 (X64) and spark (ARM64) — pin the arch.
    runs-on: [self-hosted, Linux, X64, ai-lab]
    timeout-minutes: 45

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MEASURED on PR #3482 (the 13-gitlink promotion lane): with
          # `submodules: recursive` this checkout clones ALL 84 submodules at
          # FULL history. The timeout log shows 30+ concurrent
          # `git-remote-https` / `git-submodule` processes still running, in
          # "Checkout PR branch", when the job's `timeout-minutes: 45` fires
          # -- twice (runs 44639462331 and 44649240426, both 45.6m, both
          # cancelled in that step). The job never reached step 2.
          #
          # The job does not need them. "Identify changed submodules" diffs
          # the SUPERPROJECT tree (`git diff base..head` + `git ls-tree`), and
          # every step after it -- "Verify submodule integrity", "Run strict
          # smoke tests", "Check critical health endpoints" -- reads only the
          # CHANGED submodule paths. Cloning 84 repositories at full history
          # to use 13 of them IS the cost.
          #
          # So: check out the superproject only. `fetch-depth: 0` STAYS --
          # step 2 diffs against the base commit, which a shallow superproject
          # would not contain. The submodule clones are what get bounded, and
          # that happens in the next step, which initialises only the changed
          # paths and shallow.
          submodules: false
          fetch-depth: 0

      - name: Identify changed submodules
        id: changed
        run: |
          set -euo pipefail

          # Compare the PR branch against the base (main)
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          echo "Base: $base_sha"
          echo "Head: $head_sha"

          # The changed GITLINKS are derived from the two TREES, not from
          # `git diff --name-only`.
          #
          # MEASURED on PR #3482: `git diff --name-only base..head` listed only
          # ELEVEN of the THIRTEEN promoted submodules. `.gitmodules` sets
          # `ignore = all` for PMOVES-OpenRoom and PMOVES-registry, and git's
          # diff honours that setting -- so those two promoted pins were never
          # verified by this gate at all. The gate read 11 of its 13 inputs
          # and would have reported success: a FAIL-OPEN gate.
          #
          # `git ls-tree` is the authoritative read. It is unaffected by the
          # `.gitmodules` ignore rules and by any diff-side configuration, and
          # it names the gitlinks directly (mode 160000). The two trees are
          # compared on the PATH, and a path counts as changed when its
          # gitlink SHA differs -- including a path that is new in head. A path
          # that exists only in base is a REMOVED submodule: there is nothing
          # to verify, so it is excluded.
          #
          # LC_ALL=C on both sides so the sort order the join relies on is the
          # same collation the sort produced.
          base_links=$(mktemp)
          head_links=$(mktemp)
          git ls-tree -r "$base_sha" \
            | awk -F'\t' '{ split($1, f, " "); if (f[2] == "commit") print $2 "\t" f[3] }' \
            | LC_ALL=C sort > "$base_links"
          git ls-tree -r "$head_sha" \
            | awk -F'\t' '{ split($1, f, " "); if (f[2] == "commit") print $2 "\t" f[3] }' \
            | LC_ALL=C sort > "$head_links"
          changed_subs=$(LC_ALL=C join -t $'\t' -a1 -a2 -o 0,1.2,2.2 -e '' \
            "$base_links" "$head_links" \
            | awk -F'\t' '$3 != "" && $2 != $3 { print $1 }')
          rm -f "$base_links" "$head_links"

          if [[ -z "$changed_subs" ]]; then
            echo "No submodule gitlink changes detected"
            echo "submodules=" >> "$GITHUB_OUTPUT"
          else
            echo "Changed submodules:"
            echo "$changed_subs"
            # Store as comma-separated for later steps
            csv=$(echo "$changed_subs" | tr '\n' ',' | sed 's/,$//')
            echo "submodules=$csv" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize changed submodules
        if: steps.changed.outputs.submodules != ''
        run: |
          set -euo pipefail

          # Only the CHANGED submodules are initialised, and shallowly.
          #
          # NOT --recursive. Pmoves-cipher carries a NESTED submodule
          # (packages/byterover-packages) whose URL is an SSH path to a
          # THIRD-PARTY repo -- git@github.com:campfirein/byterover-packages.git
          # -- which the runner has no key for, and which this job does not
          # need: the steps below verify the changed submodule's OWN tree and
          # then run the SUPERPROJECT's `make smoke test`. MEASURED locally
          # against a faithful superproject: with --recursive, Pmoves-cipher
          # fails with "Failed to clone 'packages/byterover-packages' a
          # second time, aborting" and the whole init loop dies.
          #
          # Shallow first is safe only when the pinned commit is still the tip
          # of the submodule's branch -- a shallow clone fetches the tip, and
          # `git submodule update` then cannot resolve an older pin. A
          # promotion lane pins arbitrary commits, so a shallow fetch CAN
          # legitimately fail. That one submodule falls back to full history;
          # the others stay shallow. A blanket fallback would pay full
          # history for all of them because of one.
          #
          # The fallback CLEANS the partial module state first. A failed
          # shallow clone leaves .git/modules/<path> half-built, and retrying
          # without removing it fails IDENTICALLY -- MEASURED: the first
          # attempt died with "fatal: Needed a single revision" followed by
          # "fatal: Unable to find current revision in submodule path
          # 'PMOVES-Wealth'", and the retry produced the same two lines.
          IFS=',' read -ra subs <<< "${{ steps.changed.outputs.submodules }}"
          echo "Initializing ${#subs[@]} changed submodule(s), shallow first:"
          for sub in "${subs[@]}"; do
            echo "  $sub"
            if ! git submodule update --init --depth 1 "$sub"; then
              echo "    shallow init failed -- cleaning partial state, retrying with full history"
              git submodule deinit -f "$sub" 2>/dev/null || true
              rm -rf ".git/modules/$sub"
              git submodule update --init --force "$sub"
            fi
          done

      - name: Verify submodule integrity
        if: steps.changed.outputs.submodules != ''
        run: |
          set -euo pipefail

          echo "Verifying submodule checkout integrity..."
          git submodule status

          IFS=',' read -ra subs <<< "${{ steps.changed.outputs.submodules }}"
          for sub in "${subs[@]}"; do
            echo ""
            echo "Checking $sub ..."
            if [[ ! -d "$sub" ]]; then
              echo "  ERROR: submodule directory missing"
              exit 1
            fi
            # Verify the directory is not empty (submodule initialized)
            if [[ -z "$(ls -A "$sub" 2>/dev/null)" ]]; then
              echo "  ERROR: submodule directory is empty (not initialized)"
              exit 1
            fi
            echo "  OK: directory exists and is populated"
          done

      - name: Run strict smoke tests
        id: verify
        working-directory: pmoves
        run: |
          set -euo pipefail

          # The self-hosted ai-lab runner (b850/spark) has system python3 but
          # no pytest; the smoke target shells out to `$(PYTHON) -m pytest`.
          # Install the minimum so `make test` measures the tests, not the
          # runner image. requirements-smoke.txt is the curated subset.
          python3 -m pip install --quiet --disable-pip-version-check \
            -r requirements-smoke.txt

          # NOTE: make verify-all was previously used here, but it prefixes
          # downstream smoke targets with '-' (ignore-errors) and can exit 0
          # even when smokes fail. Use strict smoke targets directly so any
          # failure propagates and fails this job.
          echo "Running strict smoke targets..."
          echo ""

          if make smoke test 2>&1 | tee /tmp/verify-output.txt; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            # Still emit the result but the non-zero exit fails the job
            exit 1
          fi

      - name: Check critical health endpoints
        id: health
        continue-on-error: true
        run: |
          set -euo pipefail

          results=""
          failures=0

          # Map submodule names to their service health endpoints.
          # Ports match pmoves/docker-compose.*.yml (agent-zero:8080, archon:8091,
          # n8n:5678, supabase-kong:8000 — Kong's /kong-status is the stack-level probe).
          declare -A health_map=(
            ["PMOVES-Agent-Zero"]="http://localhost:8080/healthz"
            ["PMOVES-Archon"]="http://localhost:8091/healthz"
            ["PMOVES-n8n"]="http://localhost:5678/healthz"
            ["PMOVES-supabase"]="http://localhost:8000/kong-status"
          )

          IFS=',' read -ra subs <<< "${{ steps.changed.outputs.submodules }}"

          for sub in "${subs[@]}"; do
            endpoint="${health_map[$sub]:-}"
            if [[ -z "$endpoint" ]]; then
              results="${results}- **${sub}**: no health endpoint mapped (skipped)\n"
              continue
            fi

            status_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$endpoint" 2>/dev/null || echo "000")
            if [[ "$status_code" == "200" ]]; then
              results="${results}- **${sub}** (\`${endpoint}\`): ${status_code} OK\n"
            else
              results="${results}- **${sub}** (\`${endpoint}\`): ${status_code} FAIL\n"
              failures=$((failures + 1))
            fi
          done

          echo "health_results<<HEREDOC" >> "$GITHUB_OUTPUT"
          echo -e "$results" >> "$GITHUB_OUTPUT"
          echo "HEREDOC" >> "$GITHUB_OUTPUT"
          echo "health_failures=$failures" >> "$GITHUB_OUTPUT"

      - name: Post results as PR comment
        if: always() && steps.changed.outputs.submodules != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const verifyResult = '${{ steps.verify.outputs.result }}' || 'skipped';
            const healthFailures = parseInt('${{ steps.health.outputs.health_failures }}' || '0');
            const healthResults = `${{ steps.health.outputs.health_results }}` || 'No health checks ran';
            const changedSubs = '${{ steps.changed.outputs.submodules }}'.split(',').filter(Boolean);

            const verifyIcon = verifyResult === 'pass' ? ':white_check_mark:' : ':x:';
            const healthIcon = healthFailures === 0 ? ':white_check_mark:' : ':warning:';
            const overallIcon = (verifyResult === 'pass' && healthFailures === 0) ? ':white_check_mark:' : ':x:';

            const body = [
              `## ${overallIcon} Submodule Update Smoke Test Results`,
              '',
              '### Changed Submodules',
              changedSubs.map(s => `- \`${s}\``).join('\n'),
              '',
              `### ${verifyIcon} Verify-All Result: **${verifyResult.toUpperCase()}**`,
              '',
              `### ${healthIcon} Health Endpoint Checks`,
              healthResults || 'No health checks applicable',
              '',
              '### Verdict',
              (verifyResult === 'pass' && healthFailures === 0)
                ? ':white_check_mark: **PASS** — Safe to merge after manual review of upstream changelog.'
                : ':x: **NEEDS ATTENTION** — Review failures above before merging. Check the [UPSTREAM_UPDATE_RUNBOOK](../blob/main/pmoves/docs/operations/UPSTREAM_UPDATE_RUNBOOK.md) for breaking change guidance.',
              '',
              '---',
              '*Automated by submodule-smoke workflow*',
            ].join('\n');

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Submodule Update Smoke Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
