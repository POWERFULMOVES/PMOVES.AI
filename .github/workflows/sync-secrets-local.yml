name: Sync Secrets to Local Environment

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: 'Output format'
        required: false
        default: 'cgp'
        type: choice
        options:
          - cgp
          - env

permissions:
  contents: read

jobs:
  sync-secrets:
    name: Sync GitHub Secrets to Local
    runs-on: [self-hosted, ai-lab]
    timeout-minutes: 10
    environment: Prod
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Secrets to Local
        shell: python
        env:
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          # LLM provider keys
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
          ALIBABA_PRO_CODING_PLAN: ${{ secrets.ALIBABA_PRO_CODING_PLAN }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          FIREWORKS_AI_API_KEY: ${{ secrets.FIREWORKS_AI_API_KEY }}
          PERPLEXITYAI_API_KEY: ${{ secrets.PERPLEXITYAI_API_KEY }}
          TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_REALTIME_KEY: ${{ secrets.SUPABASE_REALTIME_KEY }}
          SUPABASE_REALTIME_SECRET: ${{ secrets.SUPABASE_REALTIME_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Postgres
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOSTNAME: ${{ secrets.POSTGRES_HOSTNAME }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          SERVICE_PASSWORD_ADMIN: ${{ secrets.SERVICE_PASSWORD_ADMIN }}
          SERVICE_PASSWORD_POSTGRES: ${{ secrets.SERVICE_PASSWORD_POSTGRES }}
          SERVICE_USER_ADMIN: ${{ secrets.SERVICE_USER_ADMIN }}
          # Data stores
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
          SURREAL_ADDRESS: ${{ secrets.SURREAL_ADDRESS }}
          SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}
          SURREAL_NAMESPACE: ${{ secrets.SURREAL_NAMESPACE }}
          SURREAL_PORT: ${{ secrets.SURREAL_PORT }}
          SURREAL_URL: ${{ secrets.SURREAL_URL }}
          # Agent / integration keys
          AGENT_ZERO_EVENTS_TOKEN: ${{ secrets.AGENT_ZERO_EVENTS_TOKEN }}
          CHIT_PASSPHRASE: ${{ secrets.CHIT_PASSPHRASE }}
          VALID_API_KEYS: ${{ secrets.VALID_API_KEYS }}
          NEXT_PUBLIC_BACKEND_API_KEY: ${{ secrets.NEXT_PUBLIC_BACKEND_API_KEY }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_RUNNERS_AUTH_TOKEN: ${{ secrets.N8N_RUNNERS_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_AVATAR_URL: ${{ secrets.DISCORD_AVATAR_URL }}
          OPEN_NOTEBOOK_API_TOKEN: ${{ secrets.OPEN_NOTEBOOK_API_TOKEN }}
          OPEN_NOTEBOOK_API_URL: ${{ secrets.OPEN_NOTEBOOK_API_URL }}
          OPEN_NOTEBOOK_PASSWORD: ${{ secrets.OPEN_NOTEBOOK_PASSWORD }}
          JELLYFIN_API_KEY: ${{ secrets.JELLYFIN_API_KEY }}
          JELLYFIN_URL: ${{ secrets.JELLYFIN_URL }}
          JELLYFIN_PUBLISHED_URL: ${{ secrets.JELLYFIN_PUBLISHED_URL }}
          JELLYFIN_USER_ID: ${{ secrets.JELLYFIN_USER_ID }}
          WGER_API_TOKEN: ${{ secrets.WGER_API_TOKEN }}
          FIREFLY_ACCESS_TOKEN: ${{ secrets.FIREFLY_ACCESS_TOKEN }}
          FIREFLY_APP_KEY: ${{ secrets.FIREFLY_APP_KEY }}
          FIREFLY_PA_TOKEN_NAME: ${{ secrets.FIREFLY_PA_TOKEN_NAME }}
          FIREFLY_PORT: ${{ secrets.FIREFLY_PORT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CLAUDE_SESSION_CHANNEL_ID: ${{ secrets.CLAUDE_SESSION_CHANNEL_ID }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          # CI / registry
          GH_PAT_PUBLISH: ${{ secrets.GH_PAT_PUBLISH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Hostinger VPS
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_KVM4_1_IP: ${{ secrets.HOSTINGER_KVM4_1_IP }}
          HOSTINGER_KVM4_1_USER: ${{ secrets.HOSTINGER_KVM4_1_USER }}
          HOSTINGER_KVM4_2_IP: ${{ secrets.HOSTINGER_KVM4_2_IP }}
          HOSTINGER_KVM4_2_USER: ${{ secrets.HOSTINGER_KVM4_2_USER }}
          HOSTINGER_KVM2_IP: ${{ secrets.HOSTINGER_KVM2_IP }}
          HOSTINGER_KVM2_USER: ${{ secrets.HOSTINGER_KVM2_USER }}
        run: |
          import json, os, sys
          from pathlib import Path
          from datetime import datetime

          # Cross-platform config dir
          if sys.platform == 'win32':
              base_dir = Path(os.environ.get('APPDATA', Path.home() / 'AppData' / 'Roaming')) / 'pmoves'
          else:
              base_dir = Path(os.environ.get('XDG_CONFIG_HOME', str(Path.home() / '.config'))) / 'pmoves'

          chit_dir = base_dir / 'chit'
          secrets_dir = base_dir / 'secrets'
          chit_dir.mkdir(parents=True, exist_ok=True)
          secrets_dir.mkdir(parents=True, exist_ok=True)

          for d in [base_dir, chit_dir, secrets_dir]:
              try:
                  d.chmod(0o700)
              except OSError:
                  pass

          cgp_file = chit_dir / 'env.cgp.json'
          env_file = secrets_dir / 'local.env'

          # Auto-discover: collect all env vars that look like secrets
          # (uppercase, no spaces, not workflow/system vars)
          skip_prefixes = ('GITHUB_', 'RUNNER_', 'CI', 'PATH', 'HOME', 'USER',
                           'APPDATA', 'TEMP', 'TMP', 'OUTPUT_FORMAT',
                           'PYTHONPATH', 'SYSTEMROOT', 'PROGRAMFILES',
                           'COMPUTERNAME', 'OS', 'PROCESSOR', 'NUMBER_OF',
                           'COMMONPROGRAMFILES', 'PSMODULEPATH', 'PUBLIC',
                           'LOCALAPPDATA', 'USERPROFILE', 'WINDIR',
                           'HOMEDRIVE', 'HOMEPATH', 'LOGONSERVER',
                           'USERDOMAIN', 'ALLUSERSPROFILE', 'PROGRAMDATA',
                           'DRIVERDATA', 'COMSPEC', 'XDG_', 'LANG',
                           'SHELL', 'TERM', 'SHLVL', 'PWD', 'OLDPWD',
                           'CONDA_', 'VIRTUAL_ENV', 'ACTIONS_',
                           'DOTNET_', 'AGENT_', 'ImageOS', 'ImageVersion',
                           'ACCEPT_EULA', 'ANDROID_', 'ANT_', 'AZURE_',
                           'BOOTSTRAP_', 'CHROME_', 'CHROMEWEBDRIVER',
                           'GECKOWEBDRIVER', 'GOROOT', 'GRADLE_',
                           'JAVA_', 'LEIN_', 'M2_', 'MAVEN_', 'NVM_',
                           'PIPX_', 'SELENIUM_', 'SGX_', 'STATS_',
                           'SWIFT_', 'vcpkg_')
          template_prefix = '$' + '{{'

          # Known secret names from the env: block (these are the ones we want)
          # Read them from the manifest to stay DRY
          sys.path.insert(0, os.getcwd())
          try:
              import yaml
              with open('pmoves/chit/secrets_manifest.yaml') as f:
                  manifest = yaml.safe_load(f)
              known_keys = set()
              for entry in manifest.get('entries', []):
                  label = entry.get('source', {}).get('label', '')
                  if label:
                      known_keys.add(label)
                  for alias in entry.get('source', {}).get('aliases', []):
                      known_keys.add(alias)
          except Exception as e:
              print(f'Warning: could not read manifest: {e}')
              known_keys = None

          secrets = {}
          for name, value in sorted(os.environ.items()):
              if not value or value.startswith(template_prefix):
                  continue
              if any(name.startswith(p) for p in skip_prefixes):
                  continue
              if known_keys is not None and name not in known_keys:
                  continue
              secrets[name] = value
              print(f'  + {name}')

          if known_keys:
              missing = known_keys - set(secrets.keys())
              for name in sorted(missing):
                  if os.environ.get(name, '') == '':
                      print(f'  - {name} (not in env)')

          output_format = os.environ.get('OUTPUT_FORMAT', 'cgp').strip().lower()

          if output_format == 'env':
              env_file.write_text(
                  ''.join(f'{k}={v}\n' for k, v in sorted(secrets.items())),
                  encoding='utf-8',
              )
              try:
                  env_file.chmod(0o600)
              except OSError:
                  pass
              print(f'\n==> Wrote {len(secrets)} secrets to {env_file}')
          else:
              from pmoves.chit import encode_secret_map

              cgp = encode_secret_map(
                  secrets,
                  namespace='pmoves.secrets',
                  description=f'GitHub Secrets synced at {datetime.now().isoformat()}',
                  include_cleartext=False,
              )
              cgp_file.write_text(json.dumps(cgp, indent=2), encoding='utf-8')
              try:
                  cgp_file.chmod(0o600)
              except OSError:
                  pass
              print(f'\n==> Wrote {len(cgp["points"])} secrets to {cgp_file}')
              print('    Encoding: hex (no cleartext values)')

      - name: Summary
        shell: python
        run: |
          import os, sys
          from pathlib import Path

          if sys.platform == 'win32':
              base = Path(os.environ.get('APPDATA', Path.home() / 'AppData' / 'Roaming')) / 'pmoves'
          else:
              base = Path(os.environ.get('XDG_CONFIG_HOME', str(Path.home() / '.config'))) / 'pmoves'

          print('==> Secrets synced successfully!')
          print(f'    Base: {base}')
          print(f'    CHIT: {base / "chit" / "env.cgp.json"}')
          print(f'    ENV:  {base / "secrets" / "local.env"}')
