name: Sync Secrets to Local Environment

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: 'Output format'
        required: false
        default: 'cgp'
        type: choice
        options:
          - cgp
          - env
      target_os:
        description: 'Target runner OS'
        required: false
        default: 'any'
        type: choice
        options:
          - any
          - Windows
          - Linux

permissions:
  contents: read

jobs:
  resolve-runner:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - id: pick
        run: |
          OS="${{ github.event.inputs.target_os }}"
          if [ "$OS" = "any" ] || [ -z "$OS" ]; then
            echo 'labels=["self-hosted","ai-lab"]' >> "$GITHUB_OUTPUT"
          else
            echo "labels=[\"self-hosted\",\"ai-lab\",\"$OS\"]" >> "$GITHUB_OUTPUT"
          fi

  sync-secrets:
    name: Sync GitHub Secrets to Local
    needs: resolve-runner
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.labels) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Secrets to Local
        env:
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          FIREWORKS_AI_API_KEY: ${{ secrets.FIREWORKS_AI_API_KEY }}
          PERPLEXITYAI_API_KEY: ${{ secrets.PERPLEXITYAI_API_KEY }}
          TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          # Cross-platform Python resolution (python3 on Linux, python on Windows)
          if command -v python3 >/dev/null 2>&1 && [[ "$(python3 --version 2>&1)" == Python* ]]; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "ERROR: No Python interpreter found" >&2; exit 1
          fi
          echo "Using Python: $PY ($($PY --version 2>&1))"

          # Cross-platform config dir (APPDATA on Windows, XDG_CONFIG_HOME on Linux)
          if [[ "$OSTYPE" == msys* ]] || [[ "$OSTYPE" == cygwin* ]] || [[ -n "${APPDATA:-}" ]]; then
            BASE_DIR="${APPDATA}/pmoves"
          else
            BASE_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/pmoves"
          fi
          CHIT_DIR="$BASE_DIR/chit"
          SECRETS_DIR="$BASE_DIR/secrets"
          mkdir -p "$CHIT_DIR" "$SECRETS_DIR"
          chmod 700 "$BASE_DIR" "$CHIT_DIR" "$SECRETS_DIR" || true

          CGP_FILE="$CHIT_DIR/env.cgp.json"
          ENV_FILE="$SECRETS_DIR/local.env"

          echo "==> Syncing GitHub Secrets to local CGP bundle..."
          echo "    Format: ${OUTPUT_FORMAT:-cgp}"
          echo "    CHIT output: $CGP_FILE"
          echo "    ENV output:  $ENV_FILE"
          echo ""

          # Create Python script inline
          $PY << 'PYTHON_SCRIPT'
          import json
          import os
          from pathlib import Path
          from datetime import datetime
          from pmoves.chit import encode_secret_map

          # Get secrets from environment (injected by env: block above)
          secret_names = [
              'ANTHROPIC_API_KEY', 'Z_AI_API_KEY', 'OPENAI_API_KEY',
              'OPENROUTER_API_KEY', 'GROQ_API_KEY', 'GEMINI_API_KEY',
              'GOOGLE_API_KEY', 'MISTRAL_API_KEY', 'DEEPSEEK_API_KEY',
              'XAI_API_KEY', 'ELEVENLABS_API_KEY', 'VOYAGE_API_KEY',
              'COHERE_API_KEY', 'FIREWORKS_AI_API_KEY', 'PERPLEXITYAI_API_KEY',
              'TOGETHER_AI_API_KEY', 'VENICE_API_KEY', 'CLOUDFLARE_API_TOKEN',
              'CLOUDFLARE_ACCOUNT_ID'
          ]

          # Build secrets dict
          secrets = {}
          template_prefix = "$" + "{{"
          for name in secret_names:
              value = os.environ.get(name)
              if value and value != '' and not value.startswith(template_prefix):
                  secrets[name] = value
                  print(f'  + {name}')
              else:
                  print(f'  - {name} (not set)')

          import sys
          output_format = os.environ.get('OUTPUT_FORMAT', 'cgp').strip().lower()

          # Cross-platform config dir
          if sys.platform == 'win32':
              base_dir = Path(os.environ.get('APPDATA', Path.home() / 'AppData' / 'Roaming')) / 'pmoves'
          else:
              base_dir = Path(os.environ.get('XDG_CONFIG_HOME', str(Path.home() / '.config'))) / 'pmoves'

          chit_dir = base_dir / 'chit'
          secrets_dir = base_dir / 'secrets'
          chit_dir.mkdir(parents=True, exist_ok=True)
          secrets_dir.mkdir(parents=True, exist_ok=True)
          cgp_file = chit_dir / 'env.cgp.json'
          env_file = secrets_dir / 'local.env'

          def _safe_chmod(path, mode):
              try:
                  os.chmod(path, mode)
              except OSError:
                  pass  # Windows doesn't support Unix permissions

          if output_format == 'env':
              env_file.write_text(
                  ''.join(f'{k}={v}\n' for k, v in sorted(secrets.items())),
                  encoding='utf-8',
              )
              _safe_chmod(env_file, 0o600)
              print(f'\n==> Wrote {len(secrets)} secrets to {env_file}')
          else:
              # Hex-only encoding avoids cleartext values in the CHIT file.
              cgp = encode_secret_map(
                  secrets,
                  namespace='pmoves.secrets',
                  description=f'GitHub Secrets synced at {datetime.now().isoformat()}',
                  include_cleartext=False,
              )
              cgp_file.write_text(json.dumps(cgp, indent=2), encoding='utf-8')
              _safe_chmod(cgp_file, 0o600)
              print(f'\n==> Wrote {len(cgp["points"])} secrets to {cgp_file}')
              print('    Encoding: hex (no cleartext values)')
              print('    File permissions: 600 (owner-only)')
          PYTHON_SCRIPT

      - name: Summary
        run: |
          echo "==> Secrets synced successfully!"
          echo "    Base: $BASE_DIR"
          echo "    CHIT: $CGP_FILE"
          echo "    ENV:  $ENV_FILE"
          echo ""
          echo "To decode and use:"
          echo "  PMOVES_CGP_FILE=$CGP_FILE $PY -m pmoves.tools.mini_cli secrets decode"
          echo "  source pmoves/scripts/bootstrap_credentials.sh"
