name: Sync Secrets to Local Environment

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: 'Output format'
        required: false
        default: 'cgp'
        type: choice
        options:
          - cgp
          - env

permissions:
  contents: read

jobs:
  sync-secrets:
    name: Sync GitHub Secrets to Local
    runs-on: [self-hosted, ai-lab]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Secrets to Local
        shell: python
        env:
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          FIREWORKS_AI_API_KEY: ${{ secrets.FIREWORKS_AI_API_KEY }}
          PERPLEXITYAI_API_KEY: ${{ secrets.PERPLEXITYAI_API_KEY }}
          TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          import json, os, sys, stat
          from pathlib import Path
          from datetime import datetime

          # Cross-platform config dir
          if sys.platform == 'win32':
              base_dir = Path(os.environ.get('APPDATA', Path.home() / 'AppData' / 'Roaming')) / 'pmoves'
          else:
              base_dir = Path(os.environ.get('XDG_CONFIG_HOME', str(Path.home() / '.config'))) / 'pmoves'

          chit_dir = base_dir / 'chit'
          secrets_dir = base_dir / 'secrets'
          chit_dir.mkdir(parents=True, exist_ok=True)
          secrets_dir.mkdir(parents=True, exist_ok=True)

          # Best-effort permission restriction (works on Linux/Mac, skipped on Windows)
          for d in [base_dir, chit_dir, secrets_dir]:
              try:
                  d.chmod(0o700)
              except OSError:
                  pass

          cgp_file = chit_dir / 'env.cgp.json'
          env_file = secrets_dir / 'local.env'

          # Collect secrets from environment
          secret_names = [
              'ANTHROPIC_API_KEY', 'Z_AI_API_KEY', 'OPENAI_API_KEY',
              'OPENROUTER_API_KEY', 'GROQ_API_KEY', 'GEMINI_API_KEY',
              'GOOGLE_API_KEY', 'MISTRAL_API_KEY', 'DEEPSEEK_API_KEY',
              'XAI_API_KEY', 'ELEVENLABS_API_KEY', 'VOYAGE_API_KEY',
              'COHERE_API_KEY', 'FIREWORKS_AI_API_KEY', 'PERPLEXITYAI_API_KEY',
              'TOGETHER_AI_API_KEY', 'VENICE_API_KEY', 'CLOUDFLARE_API_TOKEN',
              'CLOUDFLARE_ACCOUNT_ID',
          ]

          secrets = {}
          template_prefix = '$' + '{{'
          for name in secret_names:
              value = os.environ.get(name)
              if value and value != '' and not value.startswith(template_prefix):
                  secrets[name] = value
                  print(f'  + {name}')
              else:
                  print(f'  - {name} (not set)')

          output_format = os.environ.get('OUTPUT_FORMAT', 'cgp').strip().lower()

          if output_format == 'env':
              env_file.write_text(
                  ''.join(f'{k}={v}\n' for k, v in sorted(secrets.items())),
                  encoding='utf-8',
              )
              try:
                  env_file.chmod(0o600)
              except OSError:
                  pass
              print(f'\n==> Wrote {len(secrets)} secrets to {env_file}')
          else:
              # Add checkout dir to sys.path so pmoves package is importable
              sys.path.insert(0, os.getcwd())
              from pmoves.chit import encode_secret_map

              cgp = encode_secret_map(
                  secrets,
                  namespace='pmoves.secrets',
                  description=f'GitHub Secrets synced at {datetime.now().isoformat()}',
                  include_cleartext=False,
              )
              cgp_file.write_text(json.dumps(cgp, indent=2), encoding='utf-8')
              try:
                  cgp_file.chmod(0o600)
              except OSError:
                  pass
              print(f'\n==> Wrote {len(cgp["points"])} secrets to {cgp_file}')
              print('    Encoding: hex (no cleartext values)')

      - name: Summary
        shell: python
        run: |
          import os, sys
          from pathlib import Path

          if sys.platform == 'win32':
              base = Path(os.environ.get('APPDATA', Path.home() / 'AppData' / 'Roaming')) / 'pmoves'
          else:
              base = Path(os.environ.get('XDG_CONFIG_HOME', str(Path.home() / '.config'))) / 'pmoves'

          print('==> Secrets synced successfully!')
          print(f'    Base: {base}')
          print(f'    CHIT: {base / "chit" / "env.cgp.json"}')
          print(f'    ENV:  {base / "secrets" / "local.env"}')
