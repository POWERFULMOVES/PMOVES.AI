name: Sync Secrets to Local Environment

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: 'Output format'
        required: false
        default: 'cgp'
        type: choice
        options:
          - cgp
          - env
      targets:
        description: 'Comma-separated ai-lab runner sub-labels (e.g. "spark" or "spark,5090")'
        required: false
        default: 'spark'
        type: string

permissions:
  contents: read

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        env:
          INPUT_TARGETS: "${{ github.event.inputs.targets || 'spark' }}"
        run: |
          set -euo pipefail
          # Parse comma-separated targets into JSON matrix via env var (avoids shell-to-Python injection)
          JSON=$(python3 -c "
          import json, os, re, sys
          raw = os.environ['INPUT_TARGETS'].split(',')
          targets = [t.strip() for t in raw if t.strip()]
          if not targets:
              targets = ['spark']
          bad = [t for t in targets if not re.fullmatch(r'[a-z0-9][a-z0-9-]*', t)]
          if bad:
              print(f'ERROR: invalid target labels (only lowercase alphanumeric + hyphens): {bad}', file=sys.stderr)
              sys.exit(1)
          print(json.dumps({'target': targets}))
          ")
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
          if [ "${{ runner.debug }}" = "1" ]; then
            echo "Resolved matrix: $JSON"
          fi

  # Default targets='spark' since MLF-006 (Pattern B commit, 2026-05-18): Z890 is
  # Windows-native and uses the artifact-upload + per-node pull enrollment path
  # documented in SECRETS_DISTRIBUTION_PATTERNS.md. To re-enable Linux-runner
  # routing for a future node, pass its sub-label via workflow_dispatch inputs.

  sync-secrets:
    name: Sync GitHub Secrets to ${{ matrix.target }}
    needs: resolve-targets
    strategy:
      # Don't kill SPARK if Z890 (or any node) is offline / missing label.
      # Each ai-lab runner is independent; per-node bundle distribution is the design.
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-targets.outputs.matrix) }}
    runs-on: [self-hosted, ai-lab, "${{ matrix.target }}"]
    environment: prod
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync Secrets to Local
        env:
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          # ── LLM Provider Keys ──
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          FIREWORKS_AI_API_KEY: ${{ secrets.FIREWORKS_AI_API_KEY }}
          PERPLEXITYAI_API_KEY: ${{ secrets.PERPLEXITYAI_API_KEY }}
          TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Prod-environment-scoped provider keys (job runs with environment: prod,
          # so secrets.* resolves these). Absent from this map = never delivered.
          ALIBABA_PRO_CODING_PLAN: ${{ secrets.ALIBABA_PRO_CODING_PLAN }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          # Kimi coding plan — canonical name (operator GH prod secret,
          # 2026-07-24); manifest registers it with the legacy Moonshot name
          # as a source alias, so either delivers the tier key.
          KIMI_CODING_API: ${{ secrets.KIMI_CODING_API }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KILOCODE_API_KEY: ${{ secrets.KILOCODE_API_KEY }}
          # ── Supabase ──
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_REALTIME_KEY: ${{ secrets.SUPABASE_REALTIME_KEY }}
          SUPABASE_REALTIME_SECRET: ${{ secrets.SUPABASE_REALTIME_SECRET }}
          # ── Data Stores ──
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
          SURREAL_ADDRESS: ${{ secrets.SURREAL_ADDRESS }}
          SURREAL_DATABASE: ${{ secrets.SURREAL_DATABASE }}
          SURREAL_NAMESPACE: ${{ secrets.SURREAL_NAMESPACE }}
          SURREAL_PORT: ${{ secrets.SURREAL_PORT }}
          SURREAL_URL: ${{ secrets.SURREAL_URL }}
          TENSORZERO_CLICKHOUSE_PASSWORD: ${{ secrets.TENSORZERO_CLICKHOUSE_PASSWORD }}
          TENSORZERO_CLICKHOUSE_URL: ${{ secrets.TENSORZERO_CLICKHOUSE_URL }}
          TENSORZERO_CLICKHOUSE_USER: ${{ secrets.TENSORZERO_CLICKHOUSE_USER }}
          PRESIGN_SHARED_SECRET: ${{ secrets.PRESIGN_SHARED_SECRET }}
          RENDER_WEBHOOK_SHARED_SECRET: ${{ secrets.RENDER_WEBHOOK_SHARED_SECRET }}
          # ── Agent & Integration Keys ──
          AGENT_ZERO_EVENTS_TOKEN: ${{ secrets.AGENT_ZERO_EVENTS_TOKEN }}
          # Fleet-canonical Agent Zero inbound-MCP credential (Prod env, minted
          # 2026-07-11, issue #2056). Containers map it to MCP_SERVER_TOKEN.
          AGENT_ZERO_MCP_TOKEN: ${{ secrets.AGENT_ZERO_MCP_TOKEN }}
          CHIT_PASSPHRASE: ${{ secrets.CHIT_PASSPHRASE }}
          # Same secret, second name — deliberate, not a duplicate. Every compose
          # file interpolates `CHIT_PASSPHRASE=${CHIT_PROD_PASSPHRASE:?...}`: the
          # HOST-side name is CHIT_PROD_PASSPHRASE and only the CONTAINER-side name
          # is CHIT_PASSPHRASE. 26 refs across 5 compose files / 12 services need the
          # host name, and because compose interpolates the WHOLE file before running
          # anything, one unresolved `:?` aborts every `up-*` target on the node —
          # not just the services that use it.
          #
          # No `CHIT_PROD_PASSPHRASE` secret exists (verified 2026-08-17: repo and
          # prod-environment scopes both hold only CHIT_PASSPHRASE), so this maps the
          # one real secret to the name the runtime reads rather than asking the
          # operator to mint a duplicate of the same value. Same precedent as
          # KIMI_CODING_API / MOONSHOT_API_KEY above.
          #
          # Per line 100, absent from this map = never delivered — which is exactly
          # what happened: the funnel reported 0 errors while every container that
          # needs the passphrase was ungated.
          CHIT_PROD_PASSPHRASE: ${{ secrets.CHIT_PASSPHRASE }}
          CHIT_SIGNING_KEY: ${{ secrets.CHIT_SIGNING_KEY }}
          CHIT_ENCRYPTION_KEY: ${{ secrets.CHIT_ENCRYPTION_KEY }}
          OLLAMA_SPARK_BASE_URL: ${{ secrets.OLLAMA_SPARK_BASE_URL }}
          DGX_SPARK_SSH_USER: ${{ secrets.DGX_SPARK_SSH_USER }}
          NATS_SPARK_PASSWORD: ${{ secrets.NATS_SPARK_PASSWORD }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          CHANNEL_MONITOR_STATUS_SECRET: ${{ secrets.CHANNEL_MONITOR_STATUS_SECRET }}
          CLAUDE_SESSION_CHANNEL_ID: ${{ secrets.CLAUDE_SESSION_CHANNEL_ID }}
          # ── Discord ──
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_AVATAR_URL: ${{ secrets.DISCORD_AVATAR_URL }}
          DISCORD_USERNAME: ${{ secrets.DISCORD_USERNAME }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          # ── Jellyfin ──
          JELLYFIN_API_KEY: ${{ secrets.JELLYFIN_API_KEY }}
          JELLYFIN_URL: ${{ secrets.JELLYFIN_URL }}
          JELLYFIN_PUBLISHED_URL: ${{ secrets.JELLYFIN_PUBLISHED_URL }}
          JELLYFIN_USER_ID: ${{ secrets.JELLYFIN_USER_ID }}
          # ── Notebook & Integrations ──
          OPEN_NOTEBOOK_API_TOKEN: ${{ secrets.OPEN_NOTEBOOK_API_TOKEN }}
          OPEN_NOTEBOOK_API_URL: ${{ secrets.OPEN_NOTEBOOK_API_URL }}
          OPEN_NOTEBOOK_PASSWORD: ${{ secrets.OPEN_NOTEBOOK_PASSWORD }}
          WGER_API_TOKEN: ${{ secrets.WGER_API_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          # ── Firefly ──
          FIREFLY_ACCESS_TOKEN: ${{ secrets.FIREFLY_ACCESS_TOKEN }}
          FIREFLY_APP_KEY: ${{ secrets.FIREFLY_APP_KEY }}
          FIREFLY_CMD_LN_TOKEN: ${{ secrets.FIREFLY_CMD_LN_TOKEN }}
          FIREFLY_PA_TOKEN_NAME: ${{ secrets.FIREFLY_PA_TOKEN_NAME }}
          FIREFLY_PORT: ${{ secrets.FIREFLY_PORT }}
          # ── Google Auth ──
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # ── Messaging ──
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # ── Cloudflare ──
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # ── Tailscale ──
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_APIKEY }}
          # ── GitHub App / Registry ──
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_SEC: ${{ secrets.GH_APP_SEC }}
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          # GH_PAT is deliberately retained here — it's a pass-through to downstream
          # machines (sidecar git remote edge case, runbook §3.3). Those long-running
          # containers push with a static token and need a long-lived credential until
          # an App-token-refresh sidecar is deployed per-node. See WORKORDER §"Needs a decision".
          GH_PAT: ${{ secrets.GH_PAT }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          # ── Hostinger VPS ──
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_KVM4_1_IP: ${{ secrets.HOSTINGER_KVM4_1_IP }}
          HOSTINGER_KVM4_1_USER: ${{ secrets.HOSTINGER_KVM4_1_USER }}
          HOSTINGER_KVM4_2_IP: ${{ secrets.HOSTINGER_KVM4_2_IP }}
          HOSTINGER_KVM4_2_USER: ${{ secrets.HOSTINGER_KVM4_2_USER }}
          HOSTINGER_KVM2_IP: ${{ secrets.HOSTINGER_KVM2_IP }}
          HOSTINGER_KVM2_USER: ${{ secrets.HOSTINGER_KVM2_USER }}
          # ── Other PATs ──
          CATACLYSMSTUDIOS_GH_PAT: ${{ secrets.CATACLYSMSTUDIOS_GH_PAT }}
          HUNNINBEAR_GH_PAT: ${{ secrets.HUNNINBEAR_GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          # uv handles cross-platform Python resolution — no stub detection needed
          if command -v uv >/dev/null 2>&1; then
            PY="uv run python"
          elif command -v python >/dev/null 2>&1 && [[ "$(python --version 2>&1)" == Python\ [0-9]* ]]; then
            PY=python
          elif command -v python3 >/dev/null 2>&1 && [[ "$(python3 --version 2>&1)" == Python\ [0-9]* ]]; then
            PY=python3
          else
            echo "ERROR: No working Python interpreter found (install uv: curl -LsSf https://astral.sh/uv/install.sh | sh)" >&2; exit 1
          fi
          echo "Using: $PY ($($PY --version 2>&1))"

          # Project-local secrets path (reproducible across users/runners)
          PROJECT_DIR="${GITHUB_WORKSPACE}/pmoves/secrets"
          mkdir -p "$PROJECT_DIR"
          chmod 700 "$PROJECT_DIR" || true

          # Write to repo-local paths (secrets_local_hydrate.py reads from here)
          CHIT_DIR="${GITHUB_WORKSPACE}/pmoves/data/chit"
          SECRETS_DIR="$PROJECT_DIR"
          mkdir -p "$CHIT_DIR" || true

          CGP_FILE="$CHIT_DIR/env.cgp.json"
          ENV_FILE="$SECRETS_DIR/local.env"

          echo "==> Syncing GitHub Secrets to local CGP bundle..."
          echo "    Format: ${OUTPUT_FORMAT:-cgp}"
          echo "    CHIT output: $CGP_FILE"
          echo "    ENV output:  $ENV_FILE"
          echo ""

          # Create Python script inline
          $PY << 'PYTHON_SCRIPT'
          import json
          import os
          from pathlib import Path
          from datetime import datetime
          from pmoves.chit import encode_secret_map

          # Auto-discover secrets from env: block (skip GH Actions system vars)
          skip_prefixes = (
              'GITHUB_', 'RUNNER_', 'CI', 'PATH', 'HOME', 'USER', 'APPDATA',
              'TEMP', 'TMP', 'OUTPUT_FORMAT', 'PYTHONPATH', 'SYSTEMROOT',
              'PROGRAMFILES', 'COMPUTERNAME', 'OS', 'PROCESSOR', 'NUMBER_OF',
              'COMMONPROGRAMFILES', 'PSMODULEPATH', 'PUBLIC', 'LOCALAPPDATA',
              'USERPROFILE', 'WINDIR', 'HOMEDRIVE', 'HOMEPATH', 'LOGONSERVER',
              'USERDOMAIN', 'ALLUSERSPROFILE', 'PROGRAMDATA', 'DRIVERDATA',
              'COMSPEC', 'XDG_', 'LANG', 'SHELL', 'TERM', 'SHLVL', 'PWD',
              'OLDPWD', 'CONDA_', 'VIRTUAL_ENV', 'ACTIONS_', 'DOTNET_',
              'AGENT_TOOLSDIRECTORY', 'ImageOS', 'ImageVersion',
              'ANDROID_', 'JAVA_', 'MAVEN_', 'GRADLE_', 'GOROOT',
              'PIPX_', 'SELENIUM_', 'SWIFT_', 'vcpkg_', 'NVM_',
              'CHROME_', 'GECKOWEBDRIVER', 'CHROMEWEBDRIVER',
              'ACCEPT_EULA', 'ANT_', 'AZURE_', 'LEIN_', 'M2_',
              'SGX_', 'STATS_', 'BOOTSTRAP_',
          )

          # Build secrets dict from all uppercase env vars not in skip list
          secrets = {}
          template_prefix = "$" + "{{"
          for name in sorted(os.environ):
              if not name.isupper() and '_' not in name:
                  continue
              if any(name.startswith(p) for p in skip_prefixes):
                  continue
              value = os.environ.get(name)
              if value and value != '' and not value.startswith(template_prefix):
                  secrets[name] = value
                  print(f'  + {name}')
              else:
                  print(f'  - {name} (not set)')

          import sys
          output_format = os.environ.get('OUTPUT_FORMAT', 'cgp').strip().lower()

          # Write to repo-local paths (not per-user) so artifacts persist
          # in the runner work directory and can be copied to host.
          workspace = Path(os.environ.get('GITHUB_WORKSPACE', '.'))
          chit_dir = workspace / 'pmoves' / 'data' / 'chit'
          secrets_dir = workspace / 'pmoves' / 'secrets'
          chit_dir.mkdir(parents=True, exist_ok=True)
          secrets_dir.mkdir(parents=True, exist_ok=True)
          cgp_file = chit_dir / 'env.cgp.json'
          env_file = secrets_dir / 'local.env'

          def _safe_chmod(path, mode):
              try:
                  os.chmod(path, mode)
              except OSError:
                  pass  # Windows doesn't support Unix permissions

          # Always write BOTH bundles so every runner receives the hex-encoded CGP
          # (CHIT-decodable, no cleartext) AND local.env (plaintext, consumed by
          # tooling that doesn't decode CHIT). Per SECRETS_DISTRIBUTION_PATTERNS.md
          # each runner needs both — this replaces the deprecated sync-secrets-spark
          # workflow, which guaranteed local.env on SPARK. output_format now only
          # selects which bundle is logged as primary (both are written regardless).
          #
          # CGP bundle (hex-only encoding avoids cleartext values in the CHIT file).
          cgp = encode_secret_map(
              secrets,
              namespace='pmoves.secrets',
              description=f'GitHub Secrets synced at {datetime.now().isoformat()}',
              include_cleartext=False,
          )
          cgp_file.write_text(json.dumps(cgp, indent=2), encoding='utf-8')
          _safe_chmod(cgp_file, 0o600)

          # local.env bundle (plaintext; owner-only perms).
          env_file.write_text(
              ''.join(f'{k}={v}\n' for k, v in sorted(secrets.items())),
              encoding='utf-8',
          )
          _safe_chmod(env_file, 0o600)

          primary = 'env' if output_format == 'env' else 'cgp'
          print(f'\n==> Wrote {len(cgp["points"])} secrets to BOTH bundles (primary: {primary}):')
          print(f'    CGP (hex, no cleartext): {cgp_file}')
          print(f'    ENV (plaintext):         {env_file}')
          print('    File permissions: 600 (owner-only)')
          PYTHON_SCRIPT

      - name: Copy secrets to host config dir (for runner volume mount)
        shell: bash
        run: |
          set -euo pipefail

          # Canonical path from pmoves/scripts/_config_paths.sh — single
          # source-of-truth shared with local_cert_runners.py and secrets_local_hydrate.py.
          source "${GITHUB_WORKSPACE}/pmoves/scripts/_config_paths.sh"
          HOST_CONFIG_DIR="$(pmoves_host_config_dir)"

          mkdir -p "$HOST_CONFIG_DIR/chit" "$HOST_CONFIG_DIR/secrets"
          chmod 700 "$HOST_CONFIG_DIR" "$HOST_CONFIG_DIR/chit" "$HOST_CONFIG_DIR/secrets" || true

          SRC_CHIT="${GITHUB_WORKSPACE}/pmoves/data/chit/env.cgp.json"
          SRC_ENV="${GITHUB_WORKSPACE}/pmoves/secrets/local.env"

          if [[ -f "$SRC_CHIT" ]]; then
            cp "$SRC_CHIT" "$HOST_CONFIG_DIR/chit/env.cgp.json"
            chmod 600 "$HOST_CONFIG_DIR/chit/env.cgp.json" || true
            echo "Copied CGP bundle -> $HOST_CONFIG_DIR/chit/env.cgp.json"
          fi

          if [[ -f "$SRC_ENV" ]]; then
            cp "$SRC_ENV" "$HOST_CONFIG_DIR/secrets/local.env"
            chmod 600 "$HOST_CONFIG_DIR/secrets/local.env" || true
            echo "Copied ENV file -> $HOST_CONFIG_DIR/secrets/local.env"
          fi

          # Containerized runners execute this step as container root over a host
          # bind mount, which would leave the dirs/files root-owned and unreadable
          # by the non-root host user that runs `make secrets-funnel`. Re-own
          # everything to whoever owns the mount point (the host user on Pattern-A
          # nodes; a no-op on native runners where we already are that user).
          HOST_OWNER="$(stat -c '%u:%g' "$HOST_CONFIG_DIR" 2>/dev/null || echo '')"
          if [[ -n "$HOST_OWNER" && "$HOST_OWNER" != "$(id -u):$(id -g)" ]]; then
            chown "$HOST_OWNER" \
              "$HOST_CONFIG_DIR/chit" "$HOST_CONFIG_DIR/secrets" \
              "$HOST_CONFIG_DIR/chit/env.cgp.json" "$HOST_CONFIG_DIR/secrets/local.env" \
              2>/dev/null || true
            echo "Re-owned synced files to mount owner $HOST_OWNER"
          fi

          echo "Host config dir ready: $HOST_CONFIG_DIR"

      # Pattern B: upload encrypted CGP bundle as artifact so non-runner nodes
      # (Z890/4090, ephemeral nodes) can pull without hosting a GH Actions runner.
      # Per SECRETS_DISTRIBUTION_PATTERNS.md — artifact is CHIT hex-encoded, no cleartext.
      - name: Upload CGP bundle artifact (Pattern B support)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chit-bundle-${{ matrix.target }}-${{ github.run_id }}
          path: pmoves/data/chit/env.cgp.json
          retention-days: 1
          if-no-files-found: warn

      - name: Summary
        env:
          TARGET_LABEL: ${{ matrix.target }}
          CGP_FILE: ${{ github.workspace }}/pmoves/data/chit/env.cgp.json
          ENV_FILE: ${{ github.workspace }}/pmoves/secrets/local.env
        shell: bash
        run: |
          set -uo pipefail
          # Read via env var to prevent command-substitution before regex guard.
          _target="${TARGET_LABEL}"
          if [[ ! "$_target" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "::error::Invalid matrix target '$_target' — only [a-zA-Z0-9_-] permitted"
            exit 1
          fi
          echo "==> Secrets synced to ai-lab node: $_target"
          echo "    Runner:  ${RUNNER_NAME:-unknown}"
          echo "    CHIT:    ${CGP_FILE:-(not set)}"
          echo "    ENV:     ${ENV_FILE:-(not set)}"
          echo ""
          echo "Per-node decode (Pattern A runner):"
          echo "  PMOVES_CGP_FILE=$CGP_FILE python3 -m pmoves.tools.mini_cli secrets decode"
          echo "  source pmoves/scripts/bootstrap_credentials.sh"
          if [ -f "$CGP_FILE" ]; then
            echo ""
            echo "Pattern B pull (non-runner nodes, e.g. Z890/4090):"
            echo "  gh run download ${{ github.run_id }} --repo POWERFULMOVES/PMOVES.AI \\"
            echo "    --name chit-bundle-$_target-${{ github.run_id }} \\"
            echo "    --dir \"\$XDG_CONFIG_HOME/pmoves/chit\""
            echo "  make -C pmoves secrets-funnel-sync"
          fi
