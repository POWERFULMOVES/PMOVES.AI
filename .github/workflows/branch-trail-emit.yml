name: Branch Trail Emit (§9.4)

# Closes AGNOTE4482 §9.4 hardening signoff — emits a CHIT-signed lifecycle
# trail entry to NATS subject `branch.<path-segments>.trail.v1` whenever a
# branch is created, linked to a PR, merged, or deleted.
#
# Layer 4 of the §9.4 design — see plan and pmoves/services/common/branch_trail.py
# for Layer 1 (canonical emit primitive). Layers 2 (CLI) and 3 (HTTP gateway)
# are deferred until a non-tailnet emitter needs them.
#
# Runs on a tailnet-attached self-hosted runner so it can publish to the
# private NATS bus. Failures are best-effort — a missing trail entry never
# blocks the branch operation that triggered it.

on:
  create:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, closed]
  delete:

permissions:
  contents: read

concurrency:
  group: branch-trail-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emit:
    # Block fork PRs from running on the tailnet-connected self-hosted runner
    # to prevent untrusted code execution (RCE via pull_request from forks).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    name: emit lifecycle trail
    # Pin to X64: the job uses actions/setup-python + pip, which flakes on the
    # ARM64 self-hosted runner (pmoves-spark-ailab). X64 ai-lab runners
    # (pmoves-z890-*, 4090) provide capacity. Honors this workflow's own
    # "failures never block" contract by not routing onto the flaky host.
    runs-on: [self-hosted, ai-lab, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Ensure uv
        shell: bash
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv --version
            exit 0
          fi
          py="$(command -v python3 || command -v python || true)"
          if [ -z "$py" ]; then
            echo "::error::python3/python is required to bootstrap uv"
            exit 1
          fi
          # Bootstrap into $HOME, NOT RUNNER_TEMP. On the hardened self-hosted
          # runner /tmp (hence RUNNER_TEMP=/tmp/pmoves-runner/_temp) is mounted
          # noexec, so uv's real binary installs successfully but fails to
          # execute with "Permission denied" (exit 126). $HOME is on an exec
          # filesystem. --clear wipes any stale venv from a prior run, since
          # $HOME persists across jobs on a host (non-ephemeral) runner.
          uv_venv="${HOME:-$PWD}/.uv-bootstrap"
          "$py" -m venv --clear "$uv_venv"
          "$uv_venv/bin/python" -m pip install --upgrade pip
          "$uv_venv/bin/python" -m pip install 'uv>=0.5.0'
          "$uv_venv/bin/uv" --version
          echo "$uv_venv/bin" >> "$GITHUB_PATH"

      - name: Emit lifecycle event
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_NAME: ${{ runner.name }}
          NATS_URL: ${{ secrets.NATS_URL_TAILNET }}
          NATS_MAX_RECONNECT_ATTEMPTS: 1
          NATS_RECONNECT_TIME_WAIT: 0.25
          NATS_CONNECT_TIMEOUT: 2
          CHIT_SIGNING_KEY: ${{ secrets.CHIT_SIGNING_KEY }}
          CHIT_PASSPHRASE: ${{ secrets.CHIT_PASSPHRASE }}
          LOG_LEVEL: INFO
        # uv manages its own Python + package cache — no Actions tool-cache
        # installer (.exe) required. Avoids setup-python@v6 reinstall bug on
        # self-hosted Windows runners (python-3.11.9-amd64.exe not found).
        run: uv run --with 'nats-py>=2.6.0' --with 'PyYAML>=6.0' --with 'jsonschema>=4.0' python .github/scripts/branch_trail_ci.py
