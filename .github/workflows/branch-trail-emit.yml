name: Branch Trail Emit (§9.4)

# Closes AGNOTE4482 §9.4 hardening signoff — emits a CHIT-signed lifecycle
# trail entry to NATS subject `branch.<path-segments>.trail.v1` whenever a
# branch is created, linked to a PR, merged, or deleted.
#
# Layer 4 of the §9.4 design — see plan and pmoves/services/common/branch_trail.py
# for Layer 1 (canonical emit primitive). Layers 2 (CLI) and 3 (HTTP gateway)
# are deferred until a non-tailnet emitter needs them.
#
# Runs on a tailnet-attached self-hosted runner so it can publish to the
# private NATS bus. Failures are best-effort — a missing trail entry never
# blocks the branch operation that triggered it.

on:
  create:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, closed]
  delete:

permissions:
  contents: read

concurrency:
  group: branch-trail-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emit:
    # Block fork PRs from running on the tailnet-connected self-hosted runner
    # to prevent untrusted code execution (RCE via pull_request from forks).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    name: emit lifecycle trail
    # Fleet-wide: any online tailnet Linux self-hosted runner may emit the trail.
    # The previous `[self-hosted, ai-lab, X64]` required an intersection no online
    # runner satisfies — the sole `ai-lab` runner (pmoves-spark-ailab) is ARM64,
    # and the X64 runners (kvm4) carry no `ai-lab` label — so every run queued
    # forever and the §9.4 trail never emitted. `Linux` is the widest label the
    # fleet shares; the arch-agnostic "Ensure uv" step below makes any of them
    # (ARM64 or X64) viable, and kvm4-2 is itself the tailnet NATS broker.
    # The fork-PR guard above keeps untrusted code off these trusted runners.
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Ensure uv
        # Best-effort: bootstrap failure must never block the branch op (§9.4).
        continue-on-error: true
        shell: bash
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv --version
            exit 0
          fi
          # Standalone installer — NO python3-venv / ensurepip dependency. The
          # previous `python -m venv` bootstrap failed on kvm4-2 (system python
          # lacks the split python3.12-venv package). This drops a static uv
          # binary into $HOME/.local/bin, arch-aware (ARM64 + X64).
          #
          # Install into $HOME, NOT RUNNER_TEMP. On the hardened self-hosted
          # runner /tmp (RUNNER_TEMP=/tmp/pmoves-runner/_temp) is mounted noexec,
          # so a binary there installs but fails to execute (exit 126). $HOME is
          # on an exec filesystem and persists across jobs on a host runner.
          export HOME="${HOME:-$PWD}"
          bindir="$HOME/.local/bin"
          mkdir -p "$bindir"
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="$bindir" sh
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/uv" --version

      - name: Emit lifecycle event
        # Best-effort: a missing trail never blocks the branch op (§9.4). The
        # script already exits 0 on NATS failure; this also survives a runner
        # where uv couldn't bootstrap at all.
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RUNNER_NAME: ${{ runner.name }}
          NATS_URL: ${{ secrets.NATS_URL_TAILNET }}
          NATS_MAX_RECONNECT_ATTEMPTS: 1
          NATS_RECONNECT_TIME_WAIT: 0.25
          NATS_CONNECT_TIMEOUT: 2
          CHIT_SIGNING_KEY: ${{ secrets.CHIT_SIGNING_KEY }}
          CHIT_PASSPHRASE: ${{ secrets.CHIT_PASSPHRASE }}
          LOG_LEVEL: INFO
        # uv manages its own Python + package cache — no Actions tool-cache
        # installer (.exe) required. Pin uv's cache + temp onto exec-mounted
        # $HOME: the hardened runner mounts /tmp noexec, so uv's ephemeral
        # `--with` env would fail to execute python there (exit 126) on kvm4-2.
        shell: bash
        run: |
          export HOME="${HOME:-$PWD}"
          export UV_CACHE_DIR="$HOME/.cache/uv" TMPDIR="$HOME/.uv-tmp"
          mkdir -p "$UV_CACHE_DIR" "$TMPDIR"
          uv run --with 'nats-py>=2.6.0' --with 'PyYAML>=6.0' --with 'jsonschema>=4.0' python .github/scripts/branch_trail_ci.py
