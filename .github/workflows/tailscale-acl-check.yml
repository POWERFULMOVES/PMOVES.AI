# Tailscale ACL — READ-ONLY checks (server-side validate + live drift)
#
# Companion to deploy-tailscale-acl.yml (which owns `apply`). Nothing in this file
# can change the tailnet: `validate` POSTs the repo policy to the API's validate
# endpoint (which parses it as a hypothetical policy and runs its tests, without
# modifying the tailnet), and `drift` is a single GET of the live policy.
#
# Why our own validate call and not gitops-acl-action `test`: at the pinned
# gitops-pusher commit, `test` compares the live ETag with the local hash and, on a
# match, logs "no updates found, doing nothing" WITHOUT calling /acl/validate. Every
# PR that leaves the policy untouched would be green with zero tests run. The tool
# below POSTs on every run.
#
# Why a separate file: deploy-tailscale-acl.yml's push trigger lists its own path,
# so editing it and merging would fire `apply` and overwrite whatever is live.
#
# PUBLIC REPO: drift is by definition content that is NOT in the public file, so
# every log line and step summary here is STRUCTURAL ONLY (sections, counts, paths;
# live-only key names masked). The tool's --show-values flag is for a local
# terminal and is never passed here.
#
#   pull_request (same repo)  → `validate`   : server-side parse + tests, every run.
#   pull_request (same repo)  → `drift-pr`   : live vs PR head. Strict if the PR
#                                              leaves the policy untouched; report-only
#                                              (preview of what apply would change) if
#                                              the PR edits it; a git error is exit 3.
#   pull_request (fork, or    → `no-secrets-notice`: GitHub withholds secrets, so the
#     Dependabot)                              two jobs above are SKIPPED (shown as
#                                              skipped, never as passed) with a notice.
#   schedule / dispatch on    → `drift`      : main's policy vs live via the Prod
#     main only                                environment. Fails on drift.
#
# Credentials: repo-level TAILSCALE_APIKEY for PR jobs; Prod TAILSCALE_API_KEY
# (falls back to TAILSCALE_APIKEY) + TS_TAILNET for the scheduled job. PR jobs run
# PR-head code with that credential, so a READ-SCOPED OAuth client
# (TS_OAUTH_CLIENT_ID/TS_OAUTH_SECRET) should replace the full-permission API key;
# the tool prefers OAuth whenever both halves are present. With no TS_TAILNET the
# API default "-" (the credential's own tailnet) is used.
#
# Tool exit codes: 0 clean / 1 finding (drift or validation failure) / 3
# could-not-measure. Every job fails on 1 AND 3 but labels them differently, so an
# expired key is never mistaken for "no drift" or "validated".

name: Tailscale ACL (read-only checks)

on:
  pull_request:
    paths:
      - 'pmoves/configs/tailscale-acl-policy.json'
      - 'pmoves/tools/tailscale_acl_drift.py'
      - 'pmoves/tests/test_tailscale_acl_drift.py'
      - 'pmoves/tests/fixtures/tailscale_acl/**'
      - '.github/workflows/tailscale-acl-check.yml'
  schedule:
    - cron: '17 6 * * *'  # daily 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tailscale-acl-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-secrets-notice:
    name: policy checks skipped (no secrets)
    if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain the skip
        run: |
          msg="Fork or Dependabot PR: GitHub withholds secrets, so the Tailscale server-side validate and the live drift check did NOT run. This PR's policy is UNVERIFIED; a maintainer must re-run from a same-repo branch."
          echo "::notice title=Tailscale policy NOT validated::$msg"
          { echo "## Tailscale policy checks skipped"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: validate policy (tailscale server-side)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests for the policy tool
        run: |
          python3 -m pip install --quiet 'pytest>=8'
          python3 -m pytest pmoves/tests/test_tailscale_acl_drift.py -q -p no:cacheprovider --noconftest --rootdir=. -c /dev/null
      - name: POST policy to /acl/validate (every run; read-only)
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_APIKEY: ${{ secrets.TAILSCALE_APIKEY }}
          TS_TAILNET: ${{ secrets.TS_TAILNET }}
        run: |
          set +e
          python3 pmoves/tools/tailscale_acl_drift.py validate
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Policy failed validation::Tailscale rejected the policy or its tests failed (see log).";;
            *) echo "::error title=Could not validate::Credential missing/expired, lacks policy scope, or API/network failure (see log)."; rc=3;;
          esac
          exit "$rc"

  drift-pr:
    name: live drift (PR head vs tailnet)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare PR policy with the live tailnet policy (structural only)
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_APIKEY: ${{ secrets.TAILSCALE_APIKEY }}
          TS_TAILNET: ${{ secrets.TS_TAILNET }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          git diff --quiet "$BASE_SHA" HEAD -- pmoves/configs/tailscale-acl-policy.json
          drc=$?
          set -e
          case "$drc" in
            0) mode="strict" ;;
            1) mode="report-only"
               echo "::notice::This PR edits the policy; drift below is a PREVIEW of what apply would change." ;;
            *) echo "::error title=Could not measure drift::git diff against the PR base failed (rc=$drc); refusing to guess whether the policy was edited."
               exit 3 ;;
          esac
          set +e
          if [ "$mode" = "report-only" ]; then
            python3 pmoves/tools/tailscale_acl_drift.py drift --report-only
          else
            python3 pmoves/tools/tailscale_acl_drift.py drift
          fi
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Tailnet policy drift::The live policy differs from the repo (structural summary above).";;
            *) echo "::error title=Could not measure drift::Credential missing/expired, lacks policy scope, or API/network failure (see log)."; rc=3;;
          esac
          exit "$rc"

  drift:
    name: live drift (main vs tailnet)
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare repo policy with the live tailnet policy (structural only)
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
          TAILSCALE_APIKEY: ${{ secrets.TAILSCALE_APIKEY }}
          TS_TAILNET: ${{ secrets.TS_TAILNET }}
        run: |
          set +e
          python3 pmoves/tools/tailscale_acl_drift.py drift
          rc=$?
          set -e
          case "$rc" in
            0) ;;
            1) echo "::error title=Tailnet policy drift::The live policy differs from main. Operator decides: re-apply the repo, or adopt the live change into the repo. Run the tool locally with --show-values to see values.";;
            *) echo "::error title=Could not measure drift::Credential missing/expired, lacks policy scope, or API/network failure (see log)."; rc=3;;
          esac
          exit "$rc"
