      - name: Rollback to previous version
        env:
          # Required by ${:?} guards in docker-compose.yml — rollback should not be blocked by unrelated services.
          CHIT_PROD_PASSPHRASE: ci-rollback-placeholder
          ANON_KEY: ci-rollback-placeholder
          JWT_SECRET: ci-rollback-placeholder
          LOGFLARE_PUBLIC_ACCESS_TOKEN: ci-rollback-placeholder
          LOGFLARE_PRIVATE_ACCESS_TOKEN: ci-rollback-placeholder
          MCP_SERVER_TOKEN: ci-rollback-placeholder
          MEILI_MASTER_KEY: ci-rollback-placeholder
          MINIO_USER: ci-rollback-placeholder
          MINIO_PASSWORD: ci-rollback-placeholder
          QDRANT__API_KEY: ci-rollback-placeholder
          NEO4J_PASSWORD: ci-rollback-placeholder
          SECRET_KEY_BASE: ci-rollback-placeholder
          SERVICE_ROLE_KEY: ci-rollback-placeholder
          SUPABASE_DB_USER: ci-rollback-placeholder
          SUPABASE_DB_PASSWORD: ci-rollback-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-rollback-placeholder
