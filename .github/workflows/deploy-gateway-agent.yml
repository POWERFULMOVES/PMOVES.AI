        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rollback to previous version
        env:
          # Required by ${:?} guards in docker-compose.yml — rollback should not be blocked by unrelated services.
          CHIT_PROD_PASSPHRASE: ci-rollback-placeholder
          ANON_KEY: ci-rollback-placeholder
          JWT_SECRET: ci-rollback-placeholder
          LOGFLARE_PUBLIC_ACCESS_TOKEN: ci-rollback-placeholder
          LOGFLARE_PRIVATE_ACCESS_TOKEN: ci-rollback-placeholder
          MCP_SERVER_TOKEN: ci-rollback-placeholder
          MEILI_MASTER_KEY: ci-rollback-placeholder
          MINIO_USER: ci-rollback-placeholder
          MINIO_PASSWORD: ci-rollback-placeholder
          QDRANT__API_KEY: ci-rollback-placeholder
          NEO4J_PASSWORD: ci-rollback-placeholder
          SECRET_KEY_BASE: ci-rollback-placeholder
          SERVICE_ROLE_KEY: ci-rollback-placeholder
          SUPABASE_DB_USER: ci-rollback-placeholder
          SUPABASE_DB_PASSWORD: ci-rollback-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-rollback-placeholder
          VAULT_ENC_KEY: ci-rollback-placeholder
          WGER_ADMIN_PASSWORD: ci-rollback-placeholder
          WGER_DB_PASSWORD: ci-rollback-placeholder
          WGER_SECRET_KEY: ci-rollback-placeholder
          NATS_URL: nats://localhost:4222
          PRESIGN_SHARED_SECRET: ci-rollback-placeholder
          SUPABASE_SERVICE_KEY: ci-rollback-placeholder
        shell: bash
        run: |
          cd pmoves
          touch env.shared env.shared.generated .env.generated .env.local \
            env.tier-data env.tier-api env.tier-llm env.tier-worker \
            env.tier-media env.tier-agent env.tier-ui env.tier-supabase
          docker compose stop gateway-agent || true
          docker compose rm -f gateway-agent || true
          echo "✓ Gateway Agent stopped (rolled back)"

  rollback-vps:
    name: Rollback VPS
    runs-on: [self-hosted, kvm4]
    timeout-minutes: 10
    permissions:
      contents: read
    needs: deploy-vps
    if: failure() || cancelled()
    steps:
      - name: Clear stale nested-submodule state (durable fix for #1871)
        shell: bash
        run: |
          # Self-hosted runners reuse their _work dir. A pre-#1871 checkout of
