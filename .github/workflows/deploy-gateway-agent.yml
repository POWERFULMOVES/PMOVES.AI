# PMOVES Gateway Agent Deployment Workflow
# Deploys the Gateway Agent service with GitHub Secrets for MCP tool credentials

name: Deploy Gateway Agent

on:
  push:
    branches:
      - main
      - PMOVES.AI-Edition-Hardened
    paths:
      - 'pmoves/services/gateway-agent/**'
      - 'pmoves/docker-compose.yml'
      - '.github/workflows/deploy-gateway-agent.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/PMOVES.AI-Edition-Hardened' }}

env:
  # GitHub Secrets - Service Credentials
  HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
  TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
  TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_APIKEY }}
  N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
  POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
  E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
  VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clear stale nested-submodule state (durable fix for #1871)
        shell: bash
        run: |
          # Self-hosted runners reuse their _work dir. A pre-#1871 checkout of
          # PMOVES-transcribe-and-fetch (off-branch commit lacking .gitmodules)
          # makes actions/checkout's recursive submodule clean-phase exit 128.
          # Deinit + remove the stale submodule working tree so checkout starts
          # clean. No-op on fresh/ephemeral runners (no prior .git in workspace).
          ws="${GITHUB_WORKSPACE}"
          sub="PMOVES-transcribe-and-fetch"
          if [ -e "$ws/.git" ]; then
            git -C "$ws" submodule deinit -f "$sub" 2>/dev/null || true
          fi
          rm -rf "$ws/$sub" 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false  # Gateway agent doesn't need submodules

      - name: Validate Python syntax
        run: |
          python3 -m py_compile pmoves/services/gateway-agent/app.py
          python3 -m py_compile pmoves/services/gateway-agent/nats_integration.py
          echo "✓ Python syntax valid"

      - name: Validate requirements.txt
        run: |
          pip3 install --dry-run -r pmoves/services/gateway-agent/requirements.txt
          echo "✓ Requirements are installable"

  # ============================================================================
  # AI-Lab Deployment (Local GPU Node)
  # ============================================================================

  build-ai-lab:
    name: Build Gateway Agent (AI-Lab)
    # ai-lab is carried by BOTH b850 (X64) and spark (ARM64); without an arch pin
    # this lands on whichever is free and fails intermittently on the wrong one.
    runs-on: [self-hosted, Linux, X64, ai-lab]
    timeout-minutes: 30
    permissions:
      contents: read
    needs: validate
    steps:
      - name: Clear stale nested-submodule state (durable fix for #1871)
        shell: bash
        run: |
          # Self-hosted runners reuse their _work dir. A pre-#1871 checkout of
          # PMOVES-transcribe-and-fetch (off-branch commit lacking .gitmodules)
          # makes actions/checkout's recursive submodule clean-phase exit 128.
          # Deinit + remove the stale submodule working tree so checkout starts
          # clean. No-op on fresh/ephemeral runners (no prior .git in workspace).
          ws="${GITHUB_WORKSPACE}"
          sub="PMOVES-transcribe-and-fetch"
          if [ -e "$ws/.git" ]; then
            git -C "$ws" submodule deinit -f "$sub" 2>/dev/null || true
          fi
          rm -rf "$ws/$sub" 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false  # Gateway agent doesn't need submodules

      - name: Build Gateway Agent
        env:
          # Required by ${:?} guards in docker-compose.yml — CI uses dummy values for build only
          CHIT_PROD_PASSPHRASE: ci-build-placeholder
          ANON_KEY: ci-build-placeholder
          JWT_SECRET: ci-build-placeholder
          LOGFLARE_PUBLIC_ACCESS_TOKEN: ci-build-placeholder
          LOGFLARE_PRIVATE_ACCESS_TOKEN: ci-build-placeholder
          MCP_SERVER_TOKEN: ci-build-placeholder
          MEILI_MASTER_KEY: ci-build-placeholder
          MINIO_USER: ci-build-placeholder
          MINIO_PASSWORD: ci-build-placeholder
          QDRANT__API_KEY: ci-build-placeholder
          NEO4J_PASSWORD: ci-build-placeholder
          SECRET_KEY_BASE: ci-build-placeholder
          SERVICE_ROLE_KEY: ci-build-placeholder
          SUPABASE_DB_USER: ci-build-placeholder
          SUPABASE_DB_PASSWORD: ci-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
          VAULT_ENC_KEY: ci-build-placeholder
          WGER_ADMIN_PASSWORD: ci-build-placeholder
          WGER_DB_PASSWORD: ci-build-placeholder
          WGER_SECRET_KEY: ci-build-placeholder
          NATS_URL: nats://nats:pmoves@nats:4222
          PRESIGN_SHARED_SECRET: ci-build-placeholder
          SUPABASE_SERVICE_KEY: ci-build-placeholder
        run: |
          cd pmoves
          docker compose build gateway-agent
          echo "✓ Gateway Agent image built"

      - name: Tag image
        run: |
          docker tag pmoves-gateway-agent:latest pmoves-gateway-agent:${{ github.sha }}
          echo "✓ Image tagged"

      - name: Clean up old images
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          # Prune unused gateway-agent images older than 24h to prevent disk bloat
          docker image prune -a -f --filter "label=com.docker.compose.service=gateway-agent" --filter "until=24h" || true
          docker image prune -f || true
          docker container prune -f || true
          df -h

  deploy-ai-lab:
    name: Deploy to AI-Lab
    # ai-lab is carried by BOTH b850 (X64) and spark (ARM64); without an arch pin
    # this lands on whichever is free and fails intermittently on the wrong one.
    runs-on: [self-hosted, Linux, X64, ai-lab]
    timeout-minutes: 15
    permissions:
      contents: read
    needs: build-ai-lab
    steps:
      - name: Clear stale nested-submodule state (durable fix for #1871)
        shell: bash
        run: |
          # Self-hosted runners reuse their _work dir. A pre-#1871 checkout of
          # PMOVES-transcribe-and-fetch (off-branch commit lacking .gitmodules)
          # makes actions/checkout's recursive submodule clean-phase exit 128.
          # Deinit + remove the stale submodule working tree so checkout starts
          # clean. No-op on fresh/ephemeral runners (no prior .git in workspace).
          ws="${GITHUB_WORKSPACE}"
          sub="PMOVES-transcribe-and-fetch"
          if [ -e "$ws/.git" ]; then
            git -C "$ws" submodule deinit -f "$sub" 2>/dev/null || true
          fi
          rm -rf "$ws/$sub" 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy Gateway Agent
        shell: bash
        env:
          # Required by ${:?} guards in docker-compose.yml — CI uses dummy values for deploy only
          CHIT_PROD_PASSPHRASE: ci-deploy-placeholder
          ANON_KEY: ci-deploy-placeholder
          JWT_SECRET: ci-deploy-placeholder
          LOGFLARE_PUBLIC_ACCESS_TOKEN: ci-deploy-placeholder
          LOGFLARE_PRIVATE_ACCESS_TOKEN: ci-deploy-placeholder
          MCP_SERVER_TOKEN: ci-deploy-placeholder
          MEILI_MASTER_KEY: ci-deploy-placeholder
          MINIO_USER: ci-deploy-placeholder
          MINIO_PASSWORD: ci-deploy-placeholder
          QDRANT__API_KEY: ci-deploy-placeholder
          NEO4J_PASSWORD: ci-deploy-placeholder
          SECRET_KEY_BASE: ci-deploy-placeholder
          SERVICE_ROLE_KEY: ci-deploy-placeholder
          SUPABASE_DB_USER: ci-deploy-placeholder
          SUPABASE_DB_PASSWORD: ci-deploy-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-deploy-placeholder
          VAULT_ENC_KEY: ci-deploy-placeholder
          WGER_ADMIN_PASSWORD: ci-deploy-placeholder
          WGER_DB_PASSWORD: ci-deploy-placeholder
          WGER_SECRET_KEY: ci-deploy-placeholder
          GATEWAY_AGENT_PORT: "8111"
          NATS_URL: nats://nats:pmoves@nats:4222
          PRESIGN_SHARED_SECRET: ci-deploy-placeholder
          SUPABASE_SERVICE_KEY: ci-deploy-placeholder
        run: |
          cd pmoves
          touch env.shared env.shared.generated .env.generated .env.local \
            env.tier-data env.tier-api env.tier-llm env.tier-worker \
            env.tier-media env.tier-agent env.tier-ui env.tier-supabase
          docker compose --profile agents up -d --no-build --no-deps gateway-agent
          echo "✓ Gateway Agent deployed"

      - name: Wait for health check
        shell: bash
        run: |
          echo "Waiting for Gateway Agent to be healthy..."
          gateway_agent_cid() {
            docker ps -qf name=gateway-agent | head -1
          }
          for i in {1..30}; do
            if curl -sf http://localhost:8111/healthz > /dev/null; then
              echo "✓ Gateway Agent is healthy"
              exit 0
            fi
            cid="$(gateway_agent_cid)"
            if [ -n "$cid" ]; then
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                echo "✓ Gateway Agent container is healthy"
                exit 0
              fi
              echo "Waiting... ($i/30, container=${status:-unknown})"
            else
              echo "Waiting... ($i/30, container=missing)"
            fi
            sleep 2
          done
          echo "✗ Gateway Agent failed health check"
          # Raw docker (NOT `docker compose`): the compose file carries ${VAR:?}
          # guards for OTHER services (supabase-db, pmoves-yt) that aren't set in
          # this step's env, so a compose parse fails before it can show anything.
          docker ps -a --filter name=gateway-agent --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          cid=$(docker ps -aqf name=gateway-agent | head -1)
          if [ -n "$cid" ]; then docker logs --tail=120 "$cid" 2>&1 || true; else echo "(no gateway-agent container found)"; fi
          exit 1

      - name: Verify tool discovery
        shell: bash
        run: |
          sleep 5  # Give it time to discover tools
          response="$(curl -sf http://localhost:8111/tools 2>/dev/null || true)"
          if [ -z "$response" ]; then
            cid="$(docker ps -qf name=gateway-agent | head -1)"
            if [ -z "$cid" ]; then
              echo "✗ No gateway-agent container found for tool discovery"
              exit 1
            fi
            response="$(docker exec "$cid" python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8111/tools", timeout=5).read().decode())')"
          fi
          tool_count=$(echo "$response" | jq -r '.total // 0')
          echo "✓ Discovered $tool_count MCP tools"

          if [ "$tool_count" -gt 0 ]; then
            echo "Sample tools:"
            echo "$response" | jq -r '.tools[:3] | .[] | "  - \(.name) (\(.category))"'
          fi

  # ============================================================================
  # VPS Deployment (KVM4-1 API Gateway Node)
  # ============================================================================

  deploy-vps:
    name: Deploy to VPS (KVM4-1)
    runs-on: [self-hosted, kvm4]
    timeout-minutes: 15
    permissions:
      contents: read
    needs: validate
    steps:
      - name: Clear stale nested-submodule state (durable fix for #1871)
        shell: bash
        run: |
          # Self-hosted runners reuse their _work dir. A pre-#1871 checkout of
          # PMOVES-transcribe-and-fetch (off-branch commit lacking .gitmodules)
          # makes actions/checkout's recursive submodule clean-phase exit 128.
          # Deinit + remove the stale submodule working tree so checkout starts
          # clean. No-op on fresh/ephemeral runners (no prior .git in workspace).
          ws="${GITHUB_WORKSPACE}"
          sub="PMOVES-transcribe-and-fetch"
          if [ -e "$ws/.git" ]; then
            git -C "$ws" submodule deinit -f "$sub" 2>/dev/null || true
          fi
          rm -rf "$ws/$sub" 2>/dev/null || true
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false  # Gateway agent doesn't need submodules

      - name: Build Gateway Agent (VPS)
        env:
          # Required by ${:?} guards in docker-compose.yml — CI uses dummy values for build only
          CHIT_PROD_PASSPHRASE: ci-build-placeholder
          ANON_KEY: ci-build-placeholder
          JWT_SECRET: ci-build-placeholder
          LOGFLARE_PUBLIC_ACCESS_TOKEN: ci-build-placeholder
          LOGFLARE_PRIVATE_ACCESS_TOKEN: ci-build-placeholder
          MCP_SERVER_TOKEN: ci-build-placeholder
          MEILI_MASTER_KEY: ci-build-placeholder
          MINIO_USER: ci-build-placeholder
          MINIO_PASSWORD: ci-build-placeholder
          QDRANT__API_KEY: ci-build-placeholder
          NEO4J_PASSWORD: ci-build-placeholder
          SECRET_KEY_BASE: ci-build-placeholder
          SERVICE_ROLE_KEY: ci-build-placeholder
          SUPABASE_DB_USER: ci-build-placeholder
          SUPABASE_DB_PASSWORD: ci-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-build-placeholder
          VAULT_ENC_KEY: ci-build-placeholder
          WGER_ADMIN_PASSWORD: ci-build-placeholder
          WGER_DB_PASSWORD: ci-build-placeholder
          WGER_SECRET_KEY: ci-build-placeholder
          NATS_URL: nats://nats:pmoves@nats:4222
          PRESIGN_SHARED_SECRET: ci-build-placeholder
          SUPABASE_SERVICE_KEY: ci-build-placeholder
        run: |
          cd pmoves
          docker compose -f docker-compose.yml -f docker-compose.vps.override.yml build gateway-agent
          echo "✓ Gateway Agent image built (VPS)"

      - name: Deploy Gateway Agent to VPS
        env:
          # Required by ${:?} guards in docker-compose.yml — CI uses dummy values for deploy only
          CHIT_PROD_PASSPHRASE: ci-deploy-placeholder
          ANON_KEY: ci-deploy-placeholder
          JWT_SECRET: ci-deploy-placeholder
          LOGFLARE_PUBLIC_ACCESS_TOKEN: ci-deploy-placeholder
          LOGFLARE_PRIVATE_ACCESS_TOKEN: ci-deploy-placeholder
          MCP_SERVER_TOKEN: ci-deploy-placeholder
          MEILI_MASTER_KEY: ci-deploy-placeholder
          MINIO_USER: ci-deploy-placeholder
          MINIO_PASSWORD: ci-deploy-placeholder
          QDRANT__API_KEY: ci-deploy-placeholder
          NEO4J_PASSWORD: ci-deploy-placeholder
          SECRET_KEY_BASE: ci-deploy-placeholder
          SERVICE_ROLE_KEY: ci-deploy-placeholder
          SUPABASE_DB_USER: ci-deploy-placeholder
          SUPABASE_DB_PASSWORD: ci-deploy-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-deploy-placeholder
          VAULT_ENC_KEY: ci-deploy-placeholder
          WGER_ADMIN_PASSWORD: ci-deploy-placeholder
          WGER_DB_PASSWORD: ci-deploy-placeholder
          WGER_SECRET_KEY: ci-deploy-placeholder
          NATS_URL: nats://nats:pmoves@nats:4222
          PRESIGN_SHARED_SECRET: ci-deploy-placeholder
          SUPABASE_SERVICE_KEY: ci-deploy-placeholder
        run: |
          cd pmoves
          touch env.shared env.shared.generated .env.generated .env.local \
            env.tier-data env.tier-api env.tier-llm env.tier-worker \
            env.tier-media env.tier-agent env.tier-ui env.tier-supabase
          docker compose -f docker-compose.yml -f docker-compose.vps.override.yml up -d --no-build --no-deps gateway-agent
          echo "✓ Gateway Agent deployed to VPS"

      - name: Wait for health check
        run: |
          echo "Waiting for Gateway Agent to be healthy..."
          for i in {1..60}; do
            if curl -sf http://localhost:8111/healthz > /dev/null; then
              echo "✓ Gateway Agent is healthy"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          echo "✗ Gateway Agent failed health check"
          # Raw docker (NOT `docker compose`): the compose file carries ${VAR:?}
          # guards for OTHER services (supabase-db, pmoves-yt) that aren't set in
          # this step's env, so a compose parse fails before it can show anything.
          docker ps -a --filter name=gateway-agent --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          cid=$(docker ps -aqf name=gateway-agent | head -1)
          if [ -n "$cid" ]; then docker logs --tail=120 "$cid" 2>&1 || true; else echo "(no gateway-agent container found)"; fi
          exit 1

      - name: Verify tool discovery
        run: |
          sleep 5  # Give it time to discover tools
          response=$(curl -s http://localhost:8111/tools)
          tool_count=$(echo "$response" | jq -r '.total // 0')
          echo "✓ Discovered $tool_count MCP tools"

          if [ "$tool_count" -gt 0 ]; then
            echo "Sample tools:"
            curl -s http://localhost:8111/tools | jq -r '.tools[:3] | .[] | "  - \(.name) (\(.category))"'
          fi

      - name: Verify secrets loaded
        run: |
          count=$(curl -sf http://localhost:8111/secrets | jq 'length' 2>/dev/null) || {
            echo "✗ Failed to query secrets endpoint"
            exit 1
          }
          if [ "$count" -eq 0 ] 2>/dev/null; then
            echo "✗ Zero secret keys loaded — check GitHub Secrets configuration"
            exit 1
          fi
          echo "✓ $count secret keys loaded"

      - name: Clean up old images
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          docker image prune -a -f --filter "label=com.docker.compose.service=gateway-agent" --filter "until=24h" || true
          docker image prune -f || true
          docker container prune -f || true
          df -h

  # ============================================================================
  # Rollback
  # ============================================================================

  rollback-ai-lab:
    name: Rollback AI-Lab
    # ai-lab is carried by BOTH b850 (X64) and spark (ARM64); without an arch pin
    # this lands on whichever is free and fails intermittently on the wrong one.
    runs-on: [self-hosted, Linux, X64, ai-lab]
    timeout-minutes: 10
    permissions:
      contents: read
    needs: deploy-ai-lab
    if: failure() || cancelled()
    steps:
      - name: Clear stale nested-submodule state (durable fix for #1871)
        shell: bash
        run: |
          # Self-hosted runners reuse their _work dir. A pre-#1871 checkout of
          # PMOVES-transcribe-and-fetch (off-branch commit lacking .gitmodules)
