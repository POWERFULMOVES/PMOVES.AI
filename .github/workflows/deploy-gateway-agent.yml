          WGER_ADMIN_PASSWORD: ci-rollback-placeholder
          WGER_DB_PASSWORD: ci-rollback-placeholder
          WGER_SECRET_KEY: ci-rollback-placeholder
          NATS_URL: nats://localhost:4222
          PRESIGN_SHARED_SECRET: ci-rollback-placeholder
          SUPABASE_SERVICE_KEY: ci-rollback-placeholder
        shell: bash
        run: |
          cd pmoves
          touch env.shared env.shared.generated .env.generated .env.local \
            env.tier-data env.tier-api env.tier-llm env.tier-worker \
            env.tier-media env.tier-agent env.tier-ui env.tier-supabase
          docker compose -f docker-compose.yml -f docker-compose.vps.override.yml stop gateway-agent || true
          docker compose -f docker-compose.yml -f docker-compose.vps.override.yml rm -f gateway-agent || true
          echo "✓ Gateway Agent stopped (rolled back)"
