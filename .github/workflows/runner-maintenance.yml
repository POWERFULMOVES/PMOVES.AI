      - name: Aggressive Docker cleanup
        run: |
          set -euxo pipefail
          echo "Disk before cleanup:"
          df -h
          docker system df || true

          docker image prune -af --filter "until=48h" || true
          docker builder prune -af --filter "until=48h" || true

          for workdir in /opt/actions-runner-kvm2*/_work; do
            [ -d "$workdir" ] || continue
            find "$workdir" -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} \; || true
          done

          for diagdir in /opt/actions-runner-kvm2*/_diag/pages; do
            [ -d "$diagdir" ] || continue
            find "$diagdir" -type f -mtime +1 -delete || true
          done

          echo "Disk after cleanup:"
