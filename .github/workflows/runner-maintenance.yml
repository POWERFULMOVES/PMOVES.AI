# Runner Maintenance — Periodic disk cleanup for self-hosted runners
# =============================================================================
# Self-hosted runners accumulate Docker images, BuildKit cache, and workspace
# artifacts over time. This workflow runs on a schedule to aggressively clean
# up resources before they cause disk-exhaustion failures.
#
# Triggered:
#   - Nightly at 03:00 UTC
#   - Manual dispatch (for emergency cleanup)
#
# Runners targeted:
#   - ai-lab   (GPU builds)
#   - spark    (ARM64 full PMOVES.AI node)
#   - kvm4     (VPS builds)
#   - kvm2     (legacy VPS)

name: Runner Maintenance

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Specific runner label to target (empty = all)'
        required: false
        default: ''

jobs:
  cleanup-ai-lab:
    name: Cleanup AI-Lab Runner
    runs-on: [self-hosted, ai-lab]
    if: ${{ github.event.inputs.runner_label == '' || github.event.inputs.runner_label == 'ai-lab' }}
    timeout-minutes: 15
    steps:
      - name: Aggressive Docker cleanup
        run: |
          set -euxo pipefail
          echo "Disk before cleanup:"
          df -h
          docker system df || true

          # Reclaim images + build cache ONLY. NEVER --volumes: these runners
          # (esp. SPARK full PMOVES.AI node + ai-lab/Z890) co-host LIVE fleet data
          # volumes; volume-pruning destroys fleet data whose service is briefly
          # stopped. Known Road: image/builder prune, never volume prune.
          docker image prune -af --filter "until=48h" || true

          # Prune BuildKit cache older than 48h
          docker builder prune -af --filter "until=48h" || true

          for workdir in /opt/actions-runner*/_work; do
            [ -d "$workdir" ] || continue
            find "$workdir" -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} \; || true
          done

          for diagdir in /opt/actions-runner*/_diag/pages; do
            [ -d "$diagdir" ] || continue
            find "$diagdir" -type f -mtime +1 -delete || true
          done

          echo "Disk after cleanup:"
          df -h
          docker system df || true

  cleanup-spark:
    name: Cleanup SPARK Runner
    runs-on: [self-hosted, spark]
    if: ${{ github.event.inputs.runner_label == '' || github.event.inputs.runner_label == 'spark' }}
    timeout-minutes: 15
    steps:
      - name: Aggressive Docker cleanup
        run: |
          set -euxo pipefail
          echo "Disk before cleanup:"
          df -h
          docker system df || true

          docker image prune -af --filter "until=48h" || true
          docker builder prune -af --filter "until=48h" || true

          for workdir in /opt/actions-runner*/_work; do
            [ -d "$workdir" ] || continue
            find "$workdir" -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} \; || true
          done

          for diagdir in /opt/actions-runner*/_diag/pages; do
            [ -d "$diagdir" ] || continue
            find "$diagdir" -type f -mtime +1 -delete || true
          done

          echo "Disk after cleanup:"
          df -h
          docker system df || true

  cleanup-kvm4:
    name: Cleanup KVM4 Runner
    runs-on: [self-hosted, kvm4]
    if: ${{ github.event.inputs.runner_label == '' || github.event.inputs.runner_label == 'kvm4' }}
    timeout-minutes: 15
    steps:
      - name: Aggressive Docker cleanup
        run: |
          set -euxo pipefail
          echo "Disk before cleanup:"
          df -h
          docker system df || true

          docker image prune -af --filter "until=48h" || true
          docker builder prune -af --filter "until=48h" || true

          for workdir in /opt/actions-runner-kvm4*/_work; do
            [ -d "$workdir" ] || continue
            find "$workdir" -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} \; || true
          done

          for diagdir in /opt/actions-runner-kvm4*/_diag/pages; do
            [ -d "$diagdir" ] || continue
            find "$diagdir" -type f -mtime +1 -delete || true
          done

          echo "Disk after cleanup:"
          df -h
          docker system df || true

  cleanup-kvm2:
    name: Cleanup KVM2 Runner
    runs-on: [self-hosted, kvm2]
    if: ${{ github.event.inputs.runner_label == '' || github.event.inputs.runner_label == 'kvm2' }}
    timeout-minutes: 15
