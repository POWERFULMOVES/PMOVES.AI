name: Test GitHub App Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          permission-contents: read
          permission-metadata: read

      - name: Verify Token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "=== App Token Test ==="
          echo "Token length: ${#GH_TOKEN}"
          REPO=$(gh api repos/POWERFULMOVES/PMOVES.AI --jq '.full_name')
          echo "Repo access: $REPO"
          PRIVATE=$(gh api repos/POWERFULMOVES/PMOVES.AI --jq '.private')
          echo "Private: $PRIVATE"
          echo "=== SUCCESS: App token is working ==="

      - name: Failure Diagnostics
        if: failure()
        run: |
          echo "=== FAILURE: App token verification failed ==="
          echo ""
          echo "Possible causes:"
          echo "1. App installation permissions not approved"
          echo "   → Go to https://github.com/settings/installations"
          echo "   → Click the App, review and approve new permissions"
          echo "2. App not installed on this repository"
          echo "3. permission-* params missing from create-github-app-token step"
          echo ""
          echo "See: deploy/runbooks/github-app-permission-matrix.md"

  # Validates Path D (handoff §4, 2026-06-22): POWERFULMOVES is a personal USER
  # account, and GitHub App installation tokens CANNOT write GHCR packages under a
  # user namespace (only a PAT can) — that is the real cause of the
  # `installation not allowed to ... organization package` 403, regardless of
  # `owner:` scoping. Path D publishes images to an ORG namespace the App CAN
  # write (CATACLYSM-STUDIOS-INC), with repos staying under POWERFULMOVES.
  #
  # This canary isolates the NAMESPACE as the single variable: ONE org-scoped App
  # token pushes to the org namespace (expect SUCCESS) and to the POWERFULMOVES
  # user namespace (expect FAIL). Org=success + user=failure proves Path D works
  # and confirms the user-namespace limitation.
  #
  # PREREQ: the PMOVES.AI App must be installed on TARGET_OWNER with org
  # packages:write. If it is not, the "Mint token" step fails fast — that failure
  # IS the signal to install the App first.
  ghcr-owner-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_OWNER: CATACLYSM-STUDIOS-INC
    steps:
      - name: Compute lowercase GHCR namespaces (Docker repo names must be lowercase)
        run: |
          ORG_LC=$(echo "${TARGET_OWNER}" | tr '[:upper:]' '[:lower:]')
          USER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ORG_PKG=ghcr.io/${ORG_LC}/pmoves-apptoken-canary" >> "$GITHUB_ENV"
          echo "USER_PKG=ghcr.io/${USER_LC}/pmoves-apptoken-canary" >> "$GITHUB_ENV"

      - name: Mint org-scoped token (new org App; fails fast if App/secrets not set)
        id: tok_org
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          # New dedicated org App (owned by + installed on CATACLYSM-STUDIOS-INC,
          # scope = Packages: write). Falls back to the legacy GH_APP_* secrets only
          # if the new ones are unset, so this is harmless before the operator
          # creates the org App.
          client-id: ${{ secrets.GHCR_APP_CLIENT_ID || secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GHCR_APP_SEC || secrets.GH_APP_SEC }}
          owner: ${{ env.TARGET_OWNER }}
          permission-packages: write

      - name: Prepare a tiny throwaway image
        run: |
          docker pull hello-world:latest
          docker tag hello-world:latest "${ORG_PKG}:canary"
          docker tag hello-world:latest "${USER_PKG}:canary"

      - name: POSITIVE — push to ORG namespace with org token (expect SUCCESS)
        id: push_org
        env:
          TOK: ${{ steps.tok_org.outputs.token }}
        run: |
          echo "$TOK" | docker login ghcr.io -u x-access-token --password-stdin
          if docker push "${ORG_PKG}:canary"; then
            echo "✅ org-scoped token CAN write the ORG package (${ORG_PKG}) — Path D works"
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ org push FAILED — App likely not installed on ${TARGET_OWNER} with packages:write"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: NEGATIVE — push to POWERFULMOVES USER namespace with same token (expect 403)
        id: push_user
        continue-on-error: true
        env:
          TOK: ${{ steps.tok_org.outputs.token }}
        run: |
          docker push "${USER_PKG}:canary"

      - name: Assert USER-namespace push was REJECTED (proves namespace is the variable)
        run: |
          docker logout ghcr.io || true
          if [ "${{ steps.push_user.outcome }}" = "success" ]; then
            echo "⚠️ USER-namespace push unexpectedly SUCCEEDED — re-examine the limitation"
            exit 1
          fi
          echo "✅ USER-namespace push was REJECTED as expected (App tokens can't write user packages)"

      - name: Verdict
        if: always()
        run: |
          echo "=== Path D verdict (App-on-org GHCR) ==="
          echo "org-namespace push  : ${{ steps.push_org.outputs.result }} (expect success)"
          echo "user-namespace push : ${{ steps.push_user.outcome }} (expect failure)"
          echo ""
          echo "org=success + user=failure → Path D is valid: publish to ghcr.io/${TARGET_OWNER,,}/*"
          echo "via an owner:${TARGET_OWNER} App token; repos stay under POWERFULMOVES."
          echo ""
          echo "NOTE: leaves a tiny throwaway package ${ORG_PKG} — delete from the org Packages UI after review."
