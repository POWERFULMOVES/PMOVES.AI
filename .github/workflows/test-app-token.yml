name: Test GitHub App Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          permission-contents: read
          permission-metadata: read

      - name: Verify Token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "=== App Token Test ==="
          echo "Token length: ${#GH_TOKEN}"
          REPO=$(gh api repos/POWERFULMOVES/PMOVES.AI --jq '.full_name')
          echo "Repo access: $REPO"
          PRIVATE=$(gh api repos/POWERFULMOVES/PMOVES.AI --jq '.private')
          echo "Private: $PRIVATE"
          echo "=== SUCCESS: App token is working ==="

      - name: Failure Diagnostics
        if: failure()
        run: |
          echo "=== FAILURE: App token verification failed ==="
          echo ""
          echo "Possible causes:"
          echo "1. App installation permissions not approved"
          echo "   → Go to https://github.com/settings/installations"
          echo "   → Click the App, review and approve new permissions"
          echo "2. App not installed on this repository"
          echo "3. permission-* params missing from create-github-app-token step"
          echo ""
          echo "See: deploy/runbooks/github-app-permission-matrix.md"

  # Validates the GHCR org-package push gate (handoff §4, 2026-06-22): the App
  # installation has packages:write, but the inline create-github-app-token mints
  # in our build workflows omit `owner:`, so the token is scoped to ONLY the
  # current repo and CANNOT write org-owned ghcr.io/powerfulmoves/* packages
  # (blob PUT 403). This canary proves the fix: an owner-scoped token CAN push;
  # a no-owner token CANNOT. Positive + negative control, separate package names.
  ghcr-owner-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compute lowercase GHCR namespace (Docker repo names must be lowercase)
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER_PKG=ghcr.io/${OWNER_LC}/pmoves-apptoken-canary-owner" >> "$GITHUB_ENV"
          echo "NOOWNER_PKG=ghcr.io/${OWNER_LC}/pmoves-apptoken-canary-noowner" >> "$GITHUB_ENV"

      - name: Mint token WITH owner (the proposed fix)
        id: tok_owner
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          permission-packages: write

      - name: Mint token WITHOUT owner (current broken behavior — negative control)
        id: tok_noowner
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          permission-contents: read
          permission-packages: write

      - name: Prepare a tiny throwaway image
        run: |
          docker pull hello-world:latest
          docker tag hello-world:latest "${OWNER_PKG}:canary"
          docker tag hello-world:latest "${NOOWNER_PKG}:canary"

      - name: POSITIVE — push with owner-scoped token (expect SUCCESS)
        id: push_owner
        env:
          TOK: ${{ steps.tok_owner.outputs.token }}
        run: |
          echo "$TOK" | docker login ghcr.io -u x-access-token --password-stdin
          if docker push "${OWNER_PKG}:canary"; then
            echo "✅ owner-scoped token CAN write the org package"
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ owner-scoped token FAILED — fix hypothesis (or org packages:write grant) is wrong"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          docker logout ghcr.io

      - name: NEGATIVE — push with no-owner token (expect 403)
        id: push_noowner
        continue-on-error: true
        env:
          TOK: ${{ steps.tok_noowner.outputs.token }}
        run: |
          echo "$TOK" | docker login ghcr.io -u x-access-token --password-stdin
          docker push "${NOOWNER_PKG}:canary"
          docker logout ghcr.io

      - name: Assert negative control was REJECTED (proves owner is the differentiator)
        run: |
          if [ "${{ steps.push_noowner.outcome }}" = "success" ]; then
            echo "⚠️ no-owner token unexpectedly SUCCEEDED — owner is NOT the (only) factor; re-examine"
            exit 1
          fi
          echo "✅ no-owner token was REJECTED as expected"

      - name: Verdict
        if: always()
        run: |
          echo "=== GHCR app-token owner-scope verdict ==="
          echo "owner-scoped push : ${{ steps.push_owner.outputs.result }} (expect success)"
          echo "no-owner push     : ${{ steps.push_noowner.outcome }} (expect failure)"
          echo ""
          echo "If owner=success AND no-owner=failure → adding 'owner: \${{ github.repository_owner }}'"
          echo "to the inline create-github-app-token mints in the GHCR build workflows fixes the 403."
          echo ""
          echo "NOTE: leaves a tiny throwaway package ghcr.io/${{ github.repository_owner }}/pmoves-apptoken-canary-owner"
          echo "      — operator may delete it from the org Packages UI after review."
