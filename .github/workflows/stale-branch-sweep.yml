name: Stale Branch Sweep

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no deletions)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  issues: write

env:
  DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
  ORPHAN_DAYS: 7

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PAT || secrets.GITHUB_TOKEN }}

      - name: Identify orphan branches
        id: orphans
        run: |
          set -euo pipefail
          CUTOFF=$(date -d "${ORPHAN_DAYS} days ago" +%Y-%m-%d)
          ORPHANS=""
          ACTIVE_BRANCHES=""
          UNMERGED_BRANCHES=""

          echo "=== Stale Branch Sweep ==="
          echo "Cutoff date: ${CUTOFF}"
          echo "Dry run: ${DRY_RUN}"
          echo ""

          # Get branches that are not main and not protected
          for branch in $(git branch -r --format='%(refname:short)' \
            | grep -v '^origin/main$' \
            | grep -v '^origin/PMOVES' \
            | sed 's|^origin/||'); do

            # Check if branch has an open PR
            PR_COUNT=$(gh pr list --head "${branch}" --state open --json number --jq 'length' 2>/dev/null || echo "0")
            if [ "${PR_COUNT}" -gt 0 ]; then
              echo "SKIP ${branch}: has ${PR_COUNT} open PR(s)"
              continue
            fi

            # Check last commit date
            LAST_COMMIT=$(git log -1 --format='%ci' "origin/${branch}")
            LAST_COMMIT_DATE=$(date -d "${LAST_COMMIT}" +%Y-%m-%d 2>/dev/null || echo "${LAST_COMMIT}")

            if [[ "${LAST_COMMIT_DATE}" < "${CUTOFF}" ]]; then
              # Check CHIT trail state via NATS subject pattern
              # Branch is considered ACTIVE if recent agent.graphiti.signed.v1 entries
              # exist on branch.<path-segments>.trail.v1 (slash → dot encoding,
              # e.g. feat/foo → branch.feat.foo.trail.v1)
              # In CI context, we check the claim register for CHIT trail references
              CHIT_ACTIVE="false"
              if grep -q "${branch}" pmoves/docs/AGENTS/AGNOTE4482_ROADMAP_W1-W5.md 2>/dev/null; then
                # Branch referenced in claim register — check if it has recent activity
                if git log --since="${CUTOFF}" --oneline "origin/${branch}" | grep -qi "chit\|trail\|graphiti"; then
                  CHIT_ACTIVE="true"
                fi
              fi

              if [ "${CHIT_ACTIVE}" = "true" ]; then
                echo "SKIP ${branch}: CHIT trail activity detected (ACTIVE)"
                ACTIVE_BRANCHES="${ACTIVE_BRANCHES}${branch}\n"
                continue
              fi

              # Merge-status gate. Only branches whose work has ALREADY landed
              # are safe to auto-delete: a stale branch with a merged PR, or one
              # fully reachable from main, is just a leftover pointer. A stale
              # branch with NO merged PR AND unique commits is unmerged WORK —
              # protect it (report-only, never delete). This closes the
              # squash-merge data-loss trap: the old classifier keyed only on
              # age + open-PR + CHIT-trail, so a LIVE-DELETE run would have
              # destroyed unmerged branches alongside merged leftovers
              # ([gone] != merged — PMOVES squash-merges, so a landed branch's
              # original commits are NOT ancestors of main, hence the PR check).
              MERGED_PR=$(gh pr list --head "${branch}" --state merged --json number --jq 'length' 2>/dev/null || echo "0")
              if [ "${MERGED_PR}" -gt 0 ] || git merge-base --is-ancestor "origin/${branch}" origin/main 2>/dev/null; then
                echo "ORPHAN ${branch}: stale, landed (merged PR or in main), no open PR — safe to delete"
                ORPHANS="${ORPHANS}${branch}\n"
              else
                echo "PROTECT ${branch}: stale + no open PR but NOT merged — unmerged work, report-only"
                UNMERGED_BRANCHES="${UNMERGED_BRANCHES}${branch}\n"
              fi
            else
              echo "OK ${branch}: last commit ${LAST_COMMIT_DATE} (within ${ORPHAN_DAYS}d window)"
            fi
          done

          # Write outputs. grep -c prints "0" and exits 1 on no-match; the
          # trailing `|| true` keeps `set -e` from aborting while still
          # capturing that "0" via the command substitution (the old
          # `|| echo 0 >> $GITHUB_OUTPUT` sent the real count to stdout, never
          # to the heredoc, so active_count rendered blank/0 by luck).
          ORPHAN_COUNT=$(printf '%b' "${ORPHANS}" | grep -c . || true)
          ACTIVE_COUNT=$(printf '%b' "${ACTIVE_BRANCHES}" | grep -c . || true)
          UNMERGED_COUNT=$(printf '%b' "${UNMERGED_BRANCHES}" | grep -c . || true)
          {
            echo "orphans<<EOF"
            printf '%b\n' "${ORPHANS}"
            echo "EOF"
            echo "unmerged<<EOF"
            printf '%b\n' "${UNMERGED_BRANCHES}"
            echo "EOF"
            echo "orphan_count=${ORPHAN_COUNT:-0}"
            echo "active_count=${ACTIVE_COUNT:-0}"
            echo "unmerged_count=${UNMERGED_COUNT:-0}"
          } >> "$GITHUB_OUTPUT"

      - name: Delete orphan branches
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          ORPHANS="${{ steps.orphans.outputs.orphans }}"
          if [ -z "${ORPHANS}" ]; then
            echo "No orphan branches to delete."
            exit 0
          fi

          echo -e "${ORPHANS}" | while read -r branch; do
            [ -z "${branch}" ] && continue
            echo "Deleting orphan branch: ${branch}"
            git push origin --delete "${branch}" || echo "FAILED to delete ${branch}"
          done

      - name: Post orphan report to issue
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          ORPHANS="${{ steps.orphans.outputs.orphans }}"
          UNMERGED="${{ steps.orphans.outputs.unmerged }}"
          ORPHAN_COUNT="${{ steps.orphans.outputs.orphan_count }}"
          ACTIVE_COUNT="${{ steps.orphans.outputs.active_count }}"
          UNMERGED_COUNT="${{ steps.orphans.outputs.unmerged_count }}"
          MODE="DRY RUN"
          [ "${DRY_RUN}" = "false" ] && MODE="LIVE DELETE"

          BODY="## Stale Branch Sweep Report

          - **Mode**: ${MODE}
          - **Landed leftovers (safe-delete)**: ${ORPHAN_COUNT}
          - **Stale + unmerged (protected, NOT deleted)**: ${UNMERGED_COUNT}
          - **Branches saved by CHIT trail activity**: ${ACTIVE_COUNT}
          - **Cutoff**: ${ORPHAN_DAYS} days
          - **Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          "

          if [ -n "${ORPHANS}" ]; then
            BODY+=$'### Landed Leftovers (merged/in-main, no open PR — eligible for delete)\n\n| Branch | Reason |\n|--------|--------|\n'
            # Process substitution (not `echo | while`) so the loop runs in THIS
            # shell — the old pipe spawned a subshell and every BODY+= row was
            # discarded on loop exit, leaving the table permanently empty while
            # the count kept climbing. $'\n' keeps the markdown un-indented.
            while IFS= read -r branch; do
              [ -z "${branch}" ] && continue
              LAST=$(git log -1 --format='%ci (%cr)' "origin/${branch}" 2>/dev/null || echo "unknown")
              BODY+="| \`${branch}\` | Landed (merged PR or in main), no open PR, last commit ${LAST} |"$'\n'
            done < <(printf '%b' "${ORPHANS}")
          else
            BODY+=$'### No landed-leftover branches. Every stale non-main branch is either covered by an open PR, protected by CHIT trail, or unmerged (listed below).'
          fi

          if [ -n "${UNMERGED}" ]; then
            BODY+=$'\n\n### Stale + Unmerged — PROTECTED (human decision required, never auto-deleted)\n\nThese branches are stale and have no open PR, but their work has NOT landed in main. Revive (open a PR) or consciously delete — the sweep will never touch them.\n\n| Branch | Last commit |\n|--------|-------------|\n'
            while IFS= read -r branch; do
              [ -z "${branch}" ] && continue
              LAST=$(git log -1 --format='%ci (%cr)' "origin/${branch}" 2>/dev/null || echo "unknown")
              BODY+="| \`${branch}\` | ${LAST} |"$'\n'
            done < <(printf '%b' "${UNMERGED}")
          fi

          BODY+="
          
          ---
          *Automated by \`.github/workflows/stale-branch-sweep.yml\`*
          "

          # Find or create the orphan tracking issue
          ISSUE_NUM=$(gh issue list --label "branch-hygiene" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "${ISSUE_NUM}" ]; then
            gh issue comment "${ISSUE_NUM}" --body "${BODY}"
          else
            gh issue create \
              --title "Branch Hygiene: Orphan Branch Report" \
              --body "${BODY}" \
              --label "branch-hygiene" \
              --label "automated"
          fi

      - name: Summary
        run: |
          echo "## Sweep Summary"
          echo "- Orphan branches: ${{ steps.orphans.outputs.orphan_count }}"
          echo "- CHIT-saved branches: ${{ steps.orphans.outputs.active_count }}"
          echo "- Mode: ${DRY_RUN}"
