name: UI Tests

on:
  push:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/ui/**'
      - '.github/workflows/ui-tests.yml'
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/ui/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        working-directory: pmoves/ui
        run: npm ci

      - name: Run ESLint
        working-directory: pmoves/ui
        run: npm run lint

  typecheck:
    name: Type Check (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        working-directory: pmoves/ui
        run: npm ci

      - name: Run TypeScript type check
        working-directory: pmoves/ui
        run: npm run typecheck

  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        working-directory: pmoves/ui
        run: npm ci

      - name: Run Jest unit tests
        working-directory: pmoves/ui
        env:
          # Mock Supabase for unit tests
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
        run: npm test -- --ci --coverage --maxWorkers=2

      - name: Upload coverage reports
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        if: always()
        with:
          files: pmoves/ui/coverage/coverage-final.json
          flags: ui-unit
          name: ui-unit-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # E2E is non-blocking: 119/186 tests fail due to missing Supabase mock
    # layer in CI (app pages hit localhost:54321 which doesn't exist).
    # Tests need redesign with MSW/API mocking. Track as E2E-REDESIGN.
    continue-on-error: true
    steps:
      # NOTE: disable-file-monitoring prevents the armour agent from killing
      # Playwright Runner.Worker for reading /proc/*/mem — a normal Playwright
      # operation for browser process management. Egress audit remains active.
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
          disable-file-monitoring: true

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        working-directory: pmoves/ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: pmoves/ui
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        working-directory: pmoves/ui
        env:
          # Configure Playwright to use correct port (4482)
          PLAYWRIGHT_HOST: 127.0.0.1
          PLAYWRIGHT_PORT: 4482
          # Mock Supabase for E2E tests
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: playwright-anon-key
          NEXT_PUBLIC_SUPABASE_BOOT_USER_JWT: playwright-boot-user-jwt
          SUPABASE_SERVICE_ROLE_KEY: playwright-service-role
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: pmoves/ui/playwright-report/
          retention-days: 7

      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-screenshots
          path: pmoves/ui/test-results/
          retention-days: 7

  integration-tests:
    name: Integration Tests (API Clients)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            localhost:4482
            localhost:8086
            localhost:8093
            localhost:8098

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        working-directory: pmoves/ui
        run: npm ci

      - name: Run API client integration tests
        working-directory: pmoves/ui
        run: npm test -- --testPathPattern="lib/api/.*\.test\.ts$" --ci
