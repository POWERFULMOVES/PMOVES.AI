name: UI Tests

on:
  push:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/ui/**'
      # lib/rooms.ts loads ../config/rooms at test time, so a room manifest
      # change must run these tests (#3165 broke rooms.test.ts unobserved).
      - 'pmoves/config/rooms/**'
      - '.github/workflows/ui-tests.yml'
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/ui/**'
      - 'pmoves/config/rooms/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        working-directory: pmoves/ui
        run: npm ci

      - name: Run ESLint
        working-directory: pmoves/ui
        run: npm run lint

      # No tracked AGENTS.md / CLAUDE.md may carry the block `next dev`
      # generates (agentRules); hand-written ones are fine.
      - name: No Next.js generated agent rules committed
        working-directory: pmoves/ui
        run: npm run check:agent-rules

  typecheck:
    name: Type Check (TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        working-directory: pmoves/ui
        run: npm ci

      - name: Run TypeScript type check
        working-directory: pmoves/ui
        run: npm run typecheck

  unit-tests:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        working-directory: pmoves/ui
        run: npm ci

      - name: Run Jest unit tests
        working-directory: pmoves/ui
        env:
          # Mock Supabase for unit tests
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
        run: npm test -- --ci --coverage --maxWorkers=2

      - name: Upload coverage reports
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7
        if: always()
        with:
          files: pmoves/ui/coverage/coverage-final.json
          flags: ui-unit
          name: ui-unit-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # E2E was non-blocking because 120/186 tests failed. Triage (PR #3223,
    # pmoves/ui/e2e/RECONCILE-2026-09-28.md): most failures were stale specs
    # whose selectors (testid strings) never existed, although the features
    # mostly did. Those specs now follow the current UI, with backends mocked
    # by page.route. The remainder are test.fixme with a file:line reason
    # (unwired UI, behaviour mismatch, bugs #3228/#3232, not built); the
    # per-test dispositions are regenerated from the specs by
    # pmoves/ui/scripts/e2e_reconcile_dispositions.py.
    # WHAT THIS JOB DOES NOT COVER: it runs `npm run test:e2e`, which excludes
    # every @backend test, and no CI job runs them. So there is no live backend
    # here: owner-gated API routes (health-all, health/boot-jwt, notebook/*)
    # are checked ONLY for their unauthenticated 401, and their success shapes
    # are verified nowhere in CI. Those live in @backend tests that need a live
    # stack plus E2E_AUTH_TOKEN (they skip without it):
    # `E2E_AUTH_TOKEN=... npm run test:e2e:backend`.
    # The default run is green; drop continue-on-error in a follow-up once CI
    # confirms it.
    continue-on-error: true
    steps:
      # NOTE: disable-file-monitoring prevents the armour agent from killing
      # Playwright Runner.Worker for reading /proc/*/mem — a normal Playwright
      # operation for browser process management. Egress audit remains active.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
          disable-file-monitoring: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        working-directory: pmoves/ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: pmoves/ui
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        working-directory: pmoves/ui
        env:
          # Configure Playwright to use correct port (4482)
          PLAYWRIGHT_HOST: 127.0.0.1
          PLAYWRIGHT_PORT: 4482
          # Mock Supabase for E2E tests
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: playwright-anon-key
          NEXT_PUBLIC_SUPABASE_BOOT_USER_JWT: playwright-boot-user-jwt
          SUPABASE_SERVICE_ROLE_KEY: playwright-service-role
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: pmoves/ui/playwright-report/
          retention-days: 7

      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-screenshots
          path: pmoves/ui/test-results/
          retention-days: 7

  # Fails visibly (no continue-on-error), unlike e2e-tests above; NOT a
  # required check. Add `E2E Launcher Visibility (Playwright, backend-free)` to
  # branch protection to make it gate merges (operator action). The full e2e
  # suite fails for backend reasons (no Supabase in CI) and is
  # continue-on-error, so a real failure in it is invisible. This job runs only
  # the backend-free launcher-visibility
  # spec: the unauthenticated home page must list exactly the rooms whose
  # manifests say access.visibility === 'public' (#3165 listed a private room
  # there until #3218). It needs no service, so a red result means the rule
  # broke. Triggered by pmoves/ui/** and pmoves/config/rooms/** above.
  launcher-visibility-e2e:
    name: E2E Launcher Visibility (Playwright, backend-free)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # disable-file-monitoring: see the e2e-tests job (Playwright reads /proc/*/mem).
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-file-monitoring: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        working-directory: pmoves/ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: pmoves/ui
        run: npx playwright install --with-deps chromium

      - name: Run launcher-visibility spec (real catalog + negative fixture)
        working-directory: pmoves/ui
        run: npm run test:e2e:launcher

      - name: Upload launcher-visibility report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-launcher
          path: |
            pmoves/ui/playwright-report-launcher/
            pmoves/ui/test-results-launcher/
          retention-days: 7

  integration-tests:
    name: Integration Tests (API Clients)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            localhost:4482
            localhost:8086
            localhost:8093
            localhost:8098

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        working-directory: pmoves/ui
        run: npm ci

      - name: Run API client integration tests
        working-directory: pmoves/ui
        run: npm test -- --testPathPattern="lib/api/.*\.test\.ts$" --ci
