name: Validate Agents Config

# Hard gate: the agent registry <-> teams coupling and naming conventions must
# hold on every PR that touches them. Ratchets pre-existing legacy drift
# (baselined in the validator) so it is green today but blocks NEW drift.

on:
  pull_request:
    branches:
      - main
      - PMOVES.AI-Edition-Hardened
      - PMOVES.AI-Edition-Hardened-Integrations
    paths:
      - "pmoves/config/agent_registry.yaml"
      - "pmoves/configs/agent-teams.yaml"
      - "pmoves/config/rooms/**"
      - "pmoves/scripts/validate_agent_registry.py"
      - ".github/workflows/validate-agents-config.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-agents-config:
    name: validate-agents-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install validator deps
        run: python -m pip install --quiet "pydantic>=2" pyyaml

      - name: Registry ↔ teams coupling gate (pydantic)
        run: python pmoves/scripts/validate_agent_registry.py -v
