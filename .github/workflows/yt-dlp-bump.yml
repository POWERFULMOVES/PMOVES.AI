name: Weekly yt-dlp bump

on:
  schedule:
    - cron: "0 8 * * 1"  # Mondays 08:00 UTC
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-yt-dlp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Determine latest yt-dlp version
        id: meta
        run: |
          set -euo pipefail
          # `pip index versions` is an experimental command whose output has shifted
          # across pip releases (it returned empty here). Resolve from the stable
          # PyPI JSON API instead.
          latest=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r '.info.version')
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "failed to resolve yt-dlp latest" >&2
            exit 1
          fi
          echo "version=$latest" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # GHCR requires a lowercase repository path, and github.repository_owner
      # is "POWERFULMOVES". Actions expressions have no toLowerCase, so the env
      # IMAGE_PREFIX built from that expression produced an invalid tag and
      # buildx refused it. Same `tr` idiom as test-app-token.yml. Computed
      # rather than hardcoded so the workflow still works on a fork.
      - name: Compute lowercase image prefix
        id: imgpfx
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"

      - name: Build pmoves-yt with bumped yt-dlp
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./pmoves/services/pmoves-yt
          push: false
          build-args: |
            YTDLP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.imgpfx.outputs.prefix }}/pmoves-yt:tmp-bump
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Open PR with bump
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          # `gh pr create` needs this. Without it the command failed and the
          # trailing `|| true` swallowed it, so the step went green having
          # created nothing — a bump workflow that reported success weekly
          # while never opening a PR.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="chore/bump-yt-dlp-${VERSION}"
          git checkout -b "$branch"
          # Record version in tracker to surface provenance
          sed -i "1i- $(date +%Y-%m-%d): bumped yt-dlp to ${VERSION} (scheduled)" docs/hardening/PMOVES-hardening-tracker.md
          git add docs/hardening/PMOVES-hardening-tracker.md
          git commit -m "chore(pmoves-yt): bump yt-dlp to ${VERSION}"
          git push origin "$branch"
          # No `|| true`: if the PR cannot be opened, this workflow has done
          # nothing useful and must say so. `set -e` is already on.
          gh pr create --title "chore(pmoves-yt): bump yt-dlp to ${VERSION}"             --body "Automated weekly bump to yt-dlp ${VERSION}."

