name: SQL Policy Lint

on:
  push:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/supabase/sql/**'
      - 'pmoves/supabase/migrations/**'
      - '.github/workflows/sql-policy-lint.yml'
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/supabase/sql/**'
      - 'pmoves/supabase/migrations/**'
      - '.github/workflows/sql-policy-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Grep for unsafe policy patterns
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(pmoves/supabase/sql/*.sql pmoves/supabase/migrations/*.sql)
          allowlist=(
            "pmoves/supabase/sql/006_media_analysis.sql"
            "pmoves/supabase/migrations/2025-09-08_geometry_bus_rls.sql"
            "pmoves/supabase/migrations/2025-09-09_pmoves_yt_jobs.sql"
            "pmoves/supabase/migrations/2025-09-10_media_analysis_rls.sql"
            "pmoves/supabase/migrations/2025-10-18_geometry_swarm.sql"
            "pmoves/supabase/migrations/2025-10-18_health_finance.sql"
            "pmoves/supabase/migrations/2025-10-20_persona_avatar.sql"
            "pmoves/supabase/migrations/2025-10-20_geometry_cgp_views.sql"
            "pmoves/supabase/migrations/2025-12-08_archon_work_orders.sql"
            "pmoves/supabase/migrations/2025-12-08_botz_work_items.sql"
            "pmoves/supabase/migrations/2025-12-08_claude_sessions.sql"
            "pmoves/supabase/migrations/2025-12-10_voice_personas.sql"
            "pmoves/supabase/migrations/2025-12-11_work_orders_schema_compatibility.sql"
            "pmoves/supabase/migrations/20251216_social_scheduler.sql"
            "pmoves/supabase/migrations/20251225_agentgym_rl.sql"
            "pmoves/supabase/migrations/20251225_voice_cloning.sql"
            "pmoves/supabase/migrations/20250115000000_service_catalog.sql"
            "pmoves/supabase/migrations/20251230000000_tokenism_simulator.sql"
            "pmoves/supabase/migrations/20260115_model_registry.sql"
            "pmoves/supabase/migrations/20250204000000_channel_monitor_tables.sql"
            "pmoves/supabase/migrations/20260218_model_spotlight.sql"
            "pmoves/supabase/migrations/20260420000000_rls_hardening.sql"
            # Voice catalog (v5_16) — reviewed: service_role bypass uses USING(true)
            # (standard trusted-backend pattern, TO service_role), and anon SELECT on
            # voice_profiles/voice_profile_grants is the intentional RLS-gated public
            # read for is_public profiles. See docs/superpowers/specs/2026-06-26-voice-agents-design.md.
            "pmoves/supabase/migrations/20260628000000_voice_catalog.sql"
            "pmoves/supabase/migrations/20260628000100_fix_yt_oauth_cookies_rls.sql"
            "pmoves/supabase/migrations/20260630000000_voice_catalog_anon_grant.sql"
            # pmoves_kb schema grants — reviewed: `anon` needs schema USAGE for
            # PostgREST public read paths through RLS-gated objects; no blanket
            # USING(true) policies are added here.
            "pmoves/supabase/migrations/20260630000000_pmoves_kb_schema.sql"
            # Worktree-delta migrations promoted from db/v5_*.sql / local dev.
            # These are legacy/existing files; they are intentionally preserved
            # verbatim and are reviewed elsewhere, not hardened here.
            "pmoves/supabase/migrations/20250102000000_geometry_swarm.sql"
            "pmoves/supabase/migrations/20250103000000_persona_enhancements.sql"
            "pmoves/supabase/migrations/20250104000000_pmoves_core_rest_grants.sql"
            "pmoves/supabase/migrations/20250109000000_living_pages.sql"
            "pmoves/supabase/migrations/20250110000000_voice_messages.sql"
            "pmoves/supabase/migrations/20260626000000_wealth_cgp_exports.sql"
          )
          echo "Scanning ${#files[@]} SQL files for 'USING true' or 'to anon'..."
          # Fail on blanket USING true or explicit anon grants outside dev
          bad=0
          for f in "${files[@]}"; do
            skip=false
            for allowed in "${allowlist[@]}"; do
              if [[ "$f" == "$allowed" ]]; then
                skip=true
                break
              fi
            done
            if $skip; then
              echo "Skipping allowlisted policy file: $f"
              continue
            fi
            if grep -Eqi '\bUSING\s*\(?\s*true\s*\)?' "$f"; then
              echo "Unsafe blanket policy in: $f"; bad=1
            fi
            if grep -Eqi 'to\s+anon\b' "$f"; then
              echo "Policy grants to anon found in: $f"; bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Found unsafe policy patterns. See pmoves/docs/SUPABASE_RLS_CHECKLIST.md"; exit 1
          fi
          echo "No unsafe patterns found."
