name: PAT Health Check

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GH_PAT validity
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if gh api user >/dev/null 2>&1; then
            echo "✅ GH_PAT is valid"
            USER=$(gh api user --jq '.login')
            echo "Authenticated as: $USER"
          else
            echo "❌ GH_PAT is EXPIRED or INVALID"
            echo "::error::GH_PAT needs rotation immediately"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const body = [
              "## PAT Health Check Failed",
              "",
              "The GH_PAT secret is expired or invalid.",
              "",
              "### Immediate Action Required",
              "1. Create new fine-grained PAT (7-day expiry) at https://github.com/settings/personal-access-tokens/new",
              "2. Update GH_PAT secret at https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/settings/secrets/actions",
              "3. Update git remote on sidecar: git remote set-url origin https://pmoves-spark:<TOKEN>@github.com/" + context.repo.owner + "/" + context.repo.repo + ".git",
              "4. See: deploy/runbooks/github-app-sitrep-and-pat-runbook.md §3.3",
              "",
              "### Long-Term Fix",
              "Migrate to GitHub App token authentication — see §4 of the runbook.",
              "",
              "---",
              "*Auto-created by PAT Health Check workflow*"
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🔴 GH_PAT Expired — " + new Date().toISOString().split("T")[0],
              body: body,
              labels: ["operations", "security", "urgent"]
            });
