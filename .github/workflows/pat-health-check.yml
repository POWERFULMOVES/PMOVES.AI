name: PAT Health Check

# Checks the GH_PAT secret daily. Instead of opening a NEW issue every day
# (the old behaviour — date in the title, no dedup, no auto-close), this:
#   - opens ONE tracker issue the first time the PAT is invalid,
#   - comments "still failing" on subsequent failing runs (no duplicates),
#   - auto-CLOSES the tracker once the PAT is valid again.
# Title matching is by the "🔴 GH_PAT" prefix so it also adopts/closes the
# legacy dated issues created before this change.

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC
  workflow_dispatch:

permissions:
  issues: write

env:
  ISSUE_TITLE: "🔴 GH_PAT secret expired or invalid"
  TITLE_PREFIX: "🔴 GH_PAT"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GH_PAT validity
        id: pat
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if gh api user >/dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "✅ GH_PAT is valid (authenticated as $(gh api user --jq '.login'))"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GH_PAT is expired or invalid — reconciling tracker issue"
          fi

      - name: Reconcile tracker issue (open/comment on failure, auto-close on success)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const valid = '${{ steps.pat.outputs.valid }}' === 'true';
            const prefix = process.env.TITLE_PREFIX;
            const title = process.env.ISSUE_TITLE;
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;

            // Find existing open tracker(s) — matches the new stable title AND legacy dated ones.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const trackers = open.filter(i => !i.pull_request && i.title.startsWith(prefix));

            if (!valid) {
              const body = [
                "## PAT Health Check Failed",
                "",
                "The `GH_PAT` secret is expired or invalid (401 from `gh api user`).",
                "",
                "### Immediate action (operator)",
                "1. Create a new fine-grained PAT: https://github.com/settings/personal-access-tokens/new",
                `2. Update the \`GH_PAT\` secret: https://github.com/${owner}/${repo}/settings/secrets/actions`,
                "3. Update the sidecar git remote token (see runbook §3.3).",
                "",
                "### Durable fix",
                "Migrate off the PAT to GitHub App installation tokens — see `deploy/runbooks/github-app-sitrep-and-pat-runbook.md` §4.",
                "",
                "_This tracker auto-updates daily and auto-closes when the PAT is valid again._",
              ].join("\n");
              if (trackers.length === 0) {
                // Labels limited to ones that exist in the repo (operations/security/urgent);
                // a non-existent label makes issues.create 422 and no tracker opens. Dedup is by
                // the title prefix, not a label, so no extra label is needed.
                await github.rest.issues.create({
                  owner, repo, title, body,
                  labels: ["operations", "security", "urgent"],
                });
                core.info("Opened new PAT health tracker.");
              } else {
                // Keep the OLDEST tracker canonical (listForRepo is newest-first) and consolidate:
                // comment the recurrence on it, close any other open trackers as duplicates so a
                // single tracker is maintained even during the active incident.
                const canonical = trackers[trackers.length - 1];
                await github.rest.issues.createComment({
                  owner, repo, issue_number: canonical.number,
                  body: `Still failing as of ${today}. Run: ${runUrl}`,
                });
                core.info(`Updated tracker #${canonical.number}.`);
                for (const dup of trackers) {
                  if (dup.number === canonical.number) continue;
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: dup.number,
                    body: `Consolidating PAT-expiry tracking into #${canonical.number}; closing this duplicate.`,
                  });
                  await github.rest.issues.update({ owner, repo, issue_number: dup.number, state: "closed" });
                  core.info(`Closed duplicate tracker #${dup.number}.`);
                }
              }
              core.setFailed("GH_PAT is expired or invalid.");
            } else {
              for (const t of trackers) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: t.number,
                  body: `✅ \`GH_PAT\` is valid again as of ${today} — auto-closing. Run: ${runUrl}`,
                });
                await github.rest.issues.update({ owner, repo, issue_number: t.number, state: "closed" });
                core.info(`Auto-closed resolved tracker #${t.number}.`);
              }
            }
