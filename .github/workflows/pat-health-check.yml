name: PAT Health Check

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    # PRs from forks don't have access to secrets; skip to avoid false negatives.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check GH_PAT validity
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if gh api user >/dev/null 2>&1; then
            echo "✅ GH_PAT is valid"
            USER=$(gh api user --jq '.login')
            echo "Authenticated as: $USER"
          else
            echo "❌ GH_PAT is EXPIRED or INVALID"
            echo "::error::GH_PAT needs rotation immediately"
            exit 1
          fi

      - name: Check GHCR_TOKEN validity
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GHCR_TOKEN is not configured; skipping optional token check"
            exit 0
          fi

          if gh api user >/dev/null 2>&1; then
            echo "✅ GHCR_TOKEN is valid"
          else
            echo "❌ GHCR_TOKEN is EXPIRED or INVALID"
            echo "::warning::GHCR_TOKEN needs rotation"
          fi

      - name: Detect GitHub App credentials
        env:
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          GH_APP_SEC: ${{ secrets.GH_APP_SEC }}
        run: |
          if [ -n "${GH_APP_CLIENT_ID:-}" ] && [ -n "${GH_APP_SEC:-}" ]; then
            echo "HAS_GH_APP=true" >> "$GITHUB_ENV"
          else
            echo "HAS_GH_APP=false" >> "$GITHUB_ENV"
            echo "GitHub App credentials are not configured; skipping optional App token check"
          fi

      - name: Check GitHub App token generation
        if: env.HAS_GH_APP == 'true'
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          permission-contents: read
          permission-packages: write

      - name: Verify App token scopes
        if: env.HAS_GH_APP == 'true' && steps.app_token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          # App tokens are installation tokens; they don't have a /user endpoint.
          # Validate the package permission this workflow requests, not only public API reachability.
          owner_type="$(gh api "/users/${{ github.repository_owner }}" --jq '.type' 2>/dev/null || true)"
          if [ "$owner_type" = "Organization" ]; then
            packages_path="/orgs/${{ github.repository_owner }}/packages?package_type=container&per_page=1"
          else
            packages_path="/users/${{ github.repository_owner }}/packages?package_type=container&per_page=1"
          fi

          if gh api "$packages_path" >/dev/null 2>&1; then
            echo "✅ GitHub App token can access container packages"
          else
            echo "❌ GitHub App token failed container package probe"
            echo "::warning::GitHub App token may lack packages permission or installation may be suspended"
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const body = [
              "## PAT Health Check Failed",
              "",
              "The GH_PAT secret is expired or invalid.",
              "",
              "### Immediate Action Required",
              "1. Create new fine-grained PAT (7-day expiry) at https://github.com/settings/personal-access-tokens/new",
              "2. Update GH_PAT secret at https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/settings/secrets/actions",
              "3. Update git remote on sidecar: git remote set-url origin https://pmoves-spark:<TOKEN>@github.com/" + context.repo.owner + "/" + context.repo.repo + ".git",
              "4. See: deploy/runbooks/github-app-sitrep-and-pat-runbook.md §3.3",
              "",
              "### Long-Term Fix",
              "Migrate to GitHub App token authentication — see §4 of the runbook.",
              "",
              "---",
              "*Auto-created by PAT Health Check workflow*"
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🔴 GH_PAT Expired — " + new Date().toISOString().split("T")[0],
              body: body,
              labels: ["operations", "security", "urgent"]
            });
