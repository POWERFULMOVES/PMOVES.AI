name: GitHub App Health Check

# Checks the PMOVES.AI GitHub App installation daily (replaces the old
# GH_PAT user-context probe). Instead of testing a 30-day-expiring fine-grained
# PAT with `gh api user`, this mints a short-lived App installation token via
# the reusable `_app-token.yml` workflow and probes the installation metadata.
# If the App private key (GH_APP_SEC) is rotated, expired, or the installation
# is suspended, this opens ONE tracker issue, comments on subsequent failures,
# and auto-closes when the App is valid again.
# Title matching is by the "🔴 GitHub App" prefix so it also adopts/closes the
# legacy "🔴 GH_PAT" issues created before this migration.

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC
  workflow_dispatch:

permissions:
  issues: write

env:
  ISSUE_TITLE: "🔴 GitHub App installation invalid or misconfigured"
  TITLE_PREFIX: "🔴 GitHub App"
  LEGACY_PREFIX: "🔴 GH_PAT"  # adopt/close legacy PAT trackers

jobs:
  mint:
    uses: ./.github/workflows/_app-token.yml
    secrets: inherit
    with:
      permission-contents: read

  check:
    needs: mint
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.app.outputs.valid }}
      detail: ${{ steps.app.outputs.detail }}
    steps:
      - name: Probe App installation validity
        id: app
        env:
          GH_TOKEN: ${{ needs.mint.outputs.token }}
        run: |
          set -euo pipefail
          # Installation tokens cannot call GET /installation (that needs JWT-level
          # App auth). The correct installation-scoped probe is GET /installation/repositories,
          # which lists repos the installation can access. A 200 = installation active.
          if gh api /installation/repositories >/dev/null 2>&1; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            COUNT=$(gh api /installation/repositories --jq '.total_count // "unknown"' 2>/dev/null || echo "unknown")
            echo "detail=App installation active (${COUNT} repos accessible)" >> "$GITHUB_OUTPUT"
            echo "✅ GitHub App installation is active (${COUNT} repos)"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "detail=App token minted but installation/repositories probe failed (401/403)" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub App installation is invalid — reconciling tracker issue"
          fi

      - name: Failure diagnostics (mint succeeded but probe failed)
        if: steps.app.outputs.valid == 'false'
        env:
          GH_TOKEN: ${{ needs.mint.outputs.token }}
        run: |
          echo "### Diagnostics"
          echo "- Token minted: yes (reusable workflow succeeded)"
          echo "- Installation probe: FAILED"
          echo "- Likely causes: App suspended, permissions revoked, or installation removed"
          echo "- Token preview (first 12 chars): ${GH_TOKEN:0:12}..."

      - name: Reconcile tracker issue (open/comment on failure, auto-close on success)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const valid = '${{ steps.app.outputs.valid }}' === 'true';
            const detail = '${{ steps.app.outputs.detail }}';
            const prefix = process.env.TITLE_PREFIX;
            const legacyPrefix = process.env.LEGACY_PREFIX;
            const title = process.env.ISSUE_TITLE;
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;

            // Find existing open tracker(s) — match new App prefix AND legacy PAT prefix.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const trackers = open.filter(i =>
              !i.pull_request &&
              (i.title.startsWith(prefix) || i.title.startsWith(legacyPrefix))
            );

            if (!valid) {
              const body = [
                "## GitHub App Health Check Failed",
                "",
                `**Detail:** ${detail}`,
                "",
                "The PMOVES.AI GitHub App installation is invalid — the reusable",
                "`_app-token.yml` workflow minted a token, but the installation probe",
                "(`gh api installation`) returned 401/403.",
                "",
                "### Immediate action (operator)",
                `1. Verify the App installation: https://github.com/organizations/${owner}/settings/apps`,
                "2. Check if `GH_APP_SEC` (private key) was rotated — update the secret:",
                `   https://github.com/${owner}/${repo}/settings/secrets/actions`,
                "3. Confirm the App is not suspended and has the required permissions.",
                "",
                "### Context",
                "This check replaced the old `GH_PAT` user-context probe (30-day expiry",
                "outage). See `deploy/runbooks/github-app-sitrep-and-pat-runbook.md` §4.",
                "",
                "_This tracker auto-updates daily and auto-closes when the App is valid again._",
              ].join("\n");
              if (trackers.length === 0) {
                await github.rest.issues.create({
                  owner, repo, title, body,
                  labels: ["operations", "security", "urgent"],
                });
                core.info("Opened new GitHub App health tracker.");
              } else {
                // Keep the OLDEST tracker canonical and consolidate duplicates.
                const canonical = trackers[trackers.length - 1];
                await github.rest.issues.createComment({
                  owner, repo, issue_number: canonical.number,
                  body: `Still failing as of ${today}. ${detail}. Run: ${runUrl}`,
                });
                core.info(`Updated tracker #${canonical.number}.`);
                for (const dup of trackers) {
                  if (dup.number === canonical.number) continue;
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: dup.number,
                    body: `Consolidating App-health tracking into #${canonical.number}; closing this duplicate.`,
                  });
                  await github.rest.issues.update({ owner, repo, issue_number: dup.number, state: "closed" });
                  core.info(`Closed duplicate tracker #${dup.number}.`);
                }
              }
              core.setFailed("GitHub App installation is invalid.");
            } else {
              for (const t of trackers) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: t.number,
                  body: `✅ GitHub App installation is valid again as of ${today} — ${detail}. Auto-closing. Run: ${runUrl}`,
                });
                await github.rest.issues.update({ owner, repo, issue_number: t.number, state: "closed" });
                core.info(`Auto-closed resolved tracker #${t.number}.`);
              }
            }
