name: Frontend Tests

on:
  push:
    branches: [main, PMOVES.AI-Edition-Hardened, PMOVES.AI-Edition-Hardened-v3-clean]
    paths:
      - 'pmoves/ui/**'
      - 'pmoves/ui/**/*.tsx'
      - 'pmoves/ui/**/*.ts'
      - 'pmoves/ui/package.json'
      - 'pmoves/ui/jest.config.js'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened, PMOVES.AI-Edition-Hardened-v3-clean]
    paths:
      - 'pmoves/ui/**'
      - 'pmoves/ui/**/*.tsx'
      - 'pmoves/ui/**/*.ts'
      - 'pmoves/ui/package.json'
      - 'pmoves/ui/jest.config.js'
      - '.github/workflows/frontend-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmoves/ui

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          large-packages: true
          docker-images: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run Jest tests
        run: npm test -- --ci --coverage --maxWorkers=2

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: pmoves/ui/coverage/coverage-final.json
          flags: frontend
          name: codecov-frontend
          fail_ci_if_error: false

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: pmoves/ui

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pmoves/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost:54321' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-key' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: pmoves/ui/.next
          retention-days: 7
