name: Webhook Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Render-webhook base URL (e.g., http://localhost:8085)"
        required: false
      token:
        description: "Bearer token for Authorization header"
        required: false
      live:
        description: "Set to true to send a real POST"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Dry-run or Live webhook test
        env:
          BASE_URL: ${{ inputs.base_url }}
          TOKEN: ${{ inputs.token }}
        run: |
          cd pmoves
          if [ "${{ inputs.live }}" = "true" ]; then \
            python tools/smoke_webhook.py --live; \
          else \
            python tools/smoke_webhook.py; \
          fi


