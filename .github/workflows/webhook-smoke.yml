name: Webhook Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Render-webhook base URL (e.g., http://localhost:8085)"
        required: false
      token:
        description: "Bearer token for Authorization header"
        required: false
      live:
        description: "Set to true to send a real POST"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'
      - name: Dry-run or Live webhook test
        env:
          BASE_URL: ${{ inputs.base_url }}
          TOKEN: ${{ inputs.token }}
        run: |
          cd pmoves
          if [ "${{ inputs.live }}" = "true" ]; then \
            python tools/smoke_webhook.py --live; \
          else \
            python tools/smoke_webhook.py; \
          fi


