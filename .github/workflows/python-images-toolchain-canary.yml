name: Integration Python images toolchain canary

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      setuptools_version:
        description: "Optional setuptools override (defaults to latest PyPI)"
        required: false
        type: string
      wheel_version:
        description: "Optional wheel override (defaults to latest PyPI)"
        required: false
        type: string
      open_pr:
        description: "Open/update PR when all candidates pass build+Trivy"
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  python-images-toolchain-canary:
    name: Python images toolchain canary
    # Build/scan lane does not require GPU.
    runs-on: [self-hosted, Linux, X64, vps]
    env:
      TRIVY_IMAGE: aquasec/trivy:0.57.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve current and candidate versions
        id: versions
        env:
          INPUT_SETUPTOOLS_VERSION: ${{ github.event.inputs.setuptools_version || '' }}
          INPUT_WHEEL_VERSION: ${{ github.event.inputs.wheel_version || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          import urllib.request

          dockerfile = pathlib.Path("pmoves/services/supaserch/Dockerfile")
          text = dockerfile.read_text(encoding="utf-8")
          m = re.search(r'"setuptools==([^"]+)"\s+"wheel==([^"]+)"', text)
          if not m:
              print("::error::Could not locate pinned setuptools/wheel baseline in SupaSerch Dockerfile.")
              sys.exit(1)

          current_setuptools, current_wheel = m.group(1), m.group(2)

          def latest(package: str) -> str:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json", timeout=30) as resp:
                  payload = json.loads(resp.read().decode("utf-8"))
              return str(payload["info"]["version"])

          candidate_setuptools = os.environ.get("INPUT_SETUPTOOLS_VERSION", "").strip() or latest("setuptools")
          candidate_wheel = os.environ.get("INPUT_WHEEL_VERSION", "").strip() or latest("wheel")

          should_update = (
              candidate_setuptools != current_setuptools
              or candidate_wheel != current_wheel
          )

          summary = (
              f"current: setuptools=={current_setuptools}, wheel=={current_wheel}; "
              f"candidate: setuptools=={candidate_setuptools}, wheel=={candidate_wheel}; "
              f"update={str(should_update).lower()}"
          )
          print(summary)

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write(f"current_setuptools={current_setuptools}\n")
              fh.write(f"current_wheel={current_wheel}\n")
              fh.write(f"candidate_setuptools={candidate_setuptools}\n")
              fh.write(f"candidate_wheel={candidate_wheel}\n")
              fh.write(f"should_update={'true' if should_update else 'false'}\n")
              fh.write(f"summary={summary}\n")
          PY

      - name: No-op summary
        if: ${{ steps.versions.outputs.should_update != 'true' }}
        run: |
          echo "No Python image toolchain update required."
          echo "${{ steps.versions.outputs.summary }}"

      - name: Patch toolchain pins across integration Python images
        if: ${{ steps.versions.outputs.should_update == 'true' }}
        id: patch
        env:
          CANDIDATE_SETUPTOOLS: ${{ steps.versions.outputs.candidate_setuptools }}
          CANDIDATE_WHEEL: ${{ steps.versions.outputs.candidate_wheel }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          targets = [
              pathlib.Path("pmoves/services/supaserch/Dockerfile"),
              pathlib.Path("pmoves/services/deepresearch/Dockerfile"),
              pathlib.Path("pmoves/services/pmoves-yt/Dockerfile"),
              pathlib.Path("pmoves/services/archon/Dockerfile"),
          ]

          pin = (
              f'"setuptools=={os.environ["CANDIDATE_SETUPTOOLS"]}" '
              f'"wheel=={os.environ["CANDIDATE_WHEEL"]}"'
          )

          changed = []

          def apply_patch(text: str) -> tuple[str, int]:
              updated, count = re.subn(
                  r'"setuptools==[^"]+"\s+"wheel==[^"]+"',
                  pin,
                  text,
                  count=1,
              )
              if count:
                  return updated, count

              for pattern in [
                  r'(--upgrade\s+pip)(\s*\\\\)',
                  r'(--upgrade\s+pip)(\s*&&)',
                  r'(--upgrade\s+pip)(\s*$)',
              ]:
                  repl = rf'\1 {pin}\2'
                  updated, count = re.subn(pattern, repl, text, count=1, flags=re.MULTILINE)
                  if count:
                      return updated, count

              return text, 0

          for path in targets:
              original = path.read_text(encoding="utf-8")
              updated, count = apply_patch(original)
              if count == 0:
                  print(f"::error::{path}: could not locate pip upgrade command to pin toolchain")
                  sys.exit(1)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          if not changed:
              print("::error::Expected toolchain updates, but no files changed.")
              sys.exit(1)

          print("Updated Dockerfiles:")
          for item in changed:
              print(f"- {item}")

          out = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as fh:
              fh.write("changed_files<<EOF\n")
              fh.write("\n".join(changed) + "\n")
              fh.write("EOF\n")
          PY
          git diff -- pmoves/services/*/Dockerfile || true

      - name: Build + Trivy gate for each integration Python image
        if: ${{ steps.versions.outputs.should_update == 'true' }}
        run: |
          set -euo pipefail

          targets=(
            "supaserch|pmoves/services|pmoves/services/supaserch/Dockerfile|local/pmoves-supaserch:toolchain-canary"
            "deepresearch|pmoves|pmoves/services/deepresearch/Dockerfile|local/pmoves-deepresearch:toolchain-canary"
            "pmoves-yt|pmoves/services/pmoves-yt|pmoves/services/pmoves-yt/Dockerfile|local/pmoves-yt:toolchain-canary"
            "archon|pmoves|pmoves/services/archon/Dockerfile|local/pmoves-archon:toolchain-canary"
          )

          for entry in "${targets[@]}"; do
            IFS='|' read -r name context dockerfile tag <<<"$entry"
            echo "==> Building ${name} (${dockerfile})"
            docker buildx build --platform linux/amd64 -f "$dockerfile" -t "$tag" "$context" --load

            echo "==> Trivy gate ${name} (${tag})"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format table \
              --exit-code 1 \
              "$tag"
          done

      - name: Create PR for pinned bump (all integration Python images)
        if: ${{ steps.versions.outputs.should_update == 'true' && github.event.inputs.open_pr != 'false' }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/python-images-toolchain-canary
          delete-branch: true
          title: >-
            chore(images): bump pinned python toolchain to
            setuptools==${{ steps.versions.outputs.candidate_setuptools }},
            wheel==${{ steps.versions.outputs.candidate_wheel }}
          body: |
            Automated Python image toolchain canary bump.

            Candidate pins:
            - `setuptools==${{ steps.versions.outputs.candidate_setuptools }}`
            - `wheel==${{ steps.versions.outputs.candidate_wheel }}`

            Validated images in this repo:
            - `supaserch`
            - `deepresearch`
            - `pmoves-yt`
            - `archon`

            Validation performed in this run:
            - Docker builds (`linux/amd64`) for each image
            - Trivy gate (`HIGH,CRITICAL`, `ignore-unfixed=true`) for each image

            If approved, merge through normal production promotion flow.
          commit-message: >-
            chore(images): bump pinned python toolchain to
            setuptools==${{ steps.versions.outputs.candidate_setuptools }},
            wheel==${{ steps.versions.outputs.candidate_wheel }}
          add-paths: |
            pmoves/services/supaserch/Dockerfile
            pmoves/services/deepresearch/Dockerfile
            pmoves/services/pmoves-yt/Dockerfile
            pmoves/services/archon/Dockerfile
