name: Validate TAC Ratchet

# Hard gate: every TAC tree must use only the action.type values the
# runner implements (file_exists, grep, command, http, manual) OR
# an operator-acknowledged baseline entry. New unknown action.type
# values fail the PR; existing unknowns in
# `pmoves/configs/tac_trees/_known_unknowns.yaml` are acknowledged
# and tracked (so the ratchet count only goes DOWN over time).
#
# Closes the 141-inert-assertion gap that PR #2373 + #2371 surfaced
# but could only fix by hand. This ratchet is the durable answer:
# new inert assertions fail the PR before they're merged.

on:
  pull_request:
    branches:
      - main
      - PMOVES.AI-Edition-Hardened
      - PMOVES.AI-Edition-Hardened-Integrations
    paths:
      - "pmoves/configs/tac_trees/**"
      - "pmoves/tools/validate_tac.py"
      - "pmoves/tools/tests/test_validate_tac.py"
      - ".github/workflows/validate-tac-ratchet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-tac-ratchet:
    name: validate-tac-ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run ratchet (read-only, no network)
        run: |
          # pmoves/conftest.py is shared across the tools/tests suite and
          # imports pytest_asyncio + pyyaml; the ratchet test file inherits
          # both requirements even though the ratchet tests are sync +
          # json-only — conftest import chain still resolves.
          python -m pip install --quiet pyyaml
          python pmoves/tools/validate_tac.py

      - name: Pytest the ratchet (regression net for the ratchet itself)
        run: |
          python -m pip install --quiet pytest pytest-asyncio pyyaml
          python -m pytest pmoves/tools/tests/test_validate_tac.py -v
