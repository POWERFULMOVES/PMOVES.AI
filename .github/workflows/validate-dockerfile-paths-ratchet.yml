name: Validate Dockerfile Paths Ratchet

# Hard gate: every `pmoves/docker-compose*.yml` overlay's `build:`
# stanza must point at a Dockerfile that actually exists in the
# repo, and every Dockerfile in `pmoves/{services,images,integrations,
# docker,compose,ui}/` must be either referenced by a compose
# `build:` or listed in `pmoves/configs/dockerfiles/_known_orphans.yaml`.
#
# Closes the third operator-trust pattern from the #2358 meta-callout:
# "the file the developer touched ≠ the file the runner builds".
# Same shape as the validate-composes + validate-tac ratchets:
# no-network, ~100ms scan, baseline file committed and reviewable
# in PR diffs, count only goes DOWN over time.
#
# This ratchet surfaces two failure modes:
#   1. BROKEN_BUILD: a compose `build:` stanza points at a Dockerfile
#      that doesn't exist on disk. (Example: the 5 real broken
#      builds fixed in this PR — agent-zero in vps.override.yml,
#      github-branch-naming / github-crossrepo-sync in docker-compose.yml
#      + docker-compose.workers.yml.)
#   2. ORPHAN_DOCKERFILE: a Dockerfile in the repo that no compose
#      references AND isn't in the operator-acknowledged baseline.
#      The initial baseline has 26 entries (variant Dockerfiles,
#      base images, services run as side-channel processes, etc.).

on:
  pull_request:
    branches:
      - main
      - PMOVES.AI-Edition-Hardened
      - PMOVES.AI-Edition-Hardened-Integrations
    paths:
      - "pmoves/docker-compose*.yml"
      - "pmoves/**/Dockerfile*"
      - "pmoves/tools/validate_dockerfile_paths.py"
      - "pmoves/tools/tests/test_validate_dockerfile_paths.py"
      - "pmoves/configs/dockerfiles/_known_orphans.yaml"
      - ".github/workflows/validate-dockerfile-paths-ratchet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-dockerfile-paths-ratchet:
    name: validate-dockerfile-paths-ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run ratchet (read-only, no network)
        run: |
          # pmoves/conftest.py is shared across the tools/tests suite and
          # imports pytest_asyncio + pyyaml; the ratchet test file inherits
          # both requirements even though the ratchet tests are sync +
          # json-only — conftest import chain still resolves.
          python -m pip install --quiet pyyaml
          python pmoves/tools/validate_dockerfile_paths.py

      - name: Pytest the ratchet (regression net for the ratchet itself)
        run: |
          python -m pip install --quiet pytest pytest-asyncio pyyaml
          python -m pytest pmoves/tools/tests/test_validate_dockerfile_paths.py -v
