name: CLM Eval on Spark

on:
  workflow_dispatch:

jobs:
  clm-eval:
    runs-on: spark
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install contrastive-lm vllm

      - name: Start encoder
        run: |
          nohup vllm serve Qwen/Qwen3-8B --served-model-name qwen3-8b --runner pooling --max-model-len 2048 --port 8090 > /tmp/vllm.log 2>&1 &
          for i in $(seq 1 24); do
            sleep 5
            curl -sf http://localhost:8090/health >/dev/null 2>&1 && break
          done

      - name: Start CLM server
        run: |
          nohup clm-serve > /tmp/clm.log 2>&1 &
          sleep 10

      - name: Run eval
        run: python3 scripts/eval_clm.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clm-eval-results
          path: results.json
          retention-days: 7
