name: CLM Eval on Spark

on:
  workflow_dispatch:

jobs:
  clm-eval:
    runs-on: spark
    timeout-minutes: 60
    steps:
      - name: Setup venv and install deps
        run: |
          python3 -m venv /tmp/clmvenv
          /tmp/clmvenv/bin/pip install --upgrade pip -q
          /tmp/clmvenv/bin/pip install contrastive-lm vllm 2>&1 | tail -3

      - name: Clone repo (eval script)
        run: |
          git clone --depth 1 https://x-access-token:${{ github.token }}@github.com/POWERFULMOVES/PMOVES.AI.git /tmp/repo
          ls -la /tmp/repo/scripts/eval_clm.py

      - name: Start encoder (Qwen3-8B pooling)
        run: |
          nohup /tmp/clmvenv/bin/vllm serve Qwen/Qwen3-8B --served-model-name qwen3-8b --runner pooling --max-model-len 2048 --port 8090 > /tmp/vllm.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 10
            curl -sf http://localhost:8090/health >/dev/null 2>&1 && { echo ENCODER-UP; break; }
            [ $i -eq 60 ] && { echo ENCODER-TIMEOUT; tail -5 /tmp/vllm.log; }
          done

      - name: Start CLM server
        run: |
          nohup /tmp/clmvenv/bin/clm-serve > /tmp/clm.log 2>&1 &
          for i in $(seq 1 12); do
            sleep 5
            curl -sf -o /dev/null http://localhost:8700/ 2>/dev/null && { echo CLM-UP; break; }
          done

      - name: Run eval
        run: /tmp/clmvenv/bin/python /tmp/repo/scripts/eval_clm.py 2>&1 | tee eval_output.txt

      - name: Show results
        if: always()
        run: cat eval_output.txt 2>/dev/null || echo 'no output file'
