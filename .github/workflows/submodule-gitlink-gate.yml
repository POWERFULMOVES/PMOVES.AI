name: Submodule Gitlink Gate

# PR-time gate enforcing the .gitmodules branch strategy on submodule gitlinks.
# Catches pointers that are "dangling" (not on the declared tracked branch) or
# "left/right" (rolled back / sideways) BEFORE they land on main — the class of
# drift a stale local submodule checkout silently introduces.
#
# Tracked branches + fork slugs are derived from .gitmodules (no hardcoded list),
# so every submodule — incl. PMOVES.YT, which the scheduled submodule-update-
# check.yml does not watch — is covered. See .github/scripts/validate_submodule_gitlinks.sh.
#
# Runner choice: GitHub-hosted ubuntu-latest, deliberately. The gate is API-based
# (gh compare, no submodule clone, shallow superproject fetch) so it's tiny — and
# the self-hosted ai-lab runners hit "No space left on device" doing a full-history
# checkout (disk-constrained dockerized runners). A required gate must not depend
# on self-hosted disk/availability; GitHub-hosted gives a clean disk every run and
# the submodule forks are PUBLIC so the repo-scoped GITHUB_TOKEN is sufficient.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  # Merge queue: main requires `submodule-gitlink-gate`, and under a queue the
  # required checks run on a `gh-readonly-queue/main/...` ref with the
  # `merge_group` event. Without this trigger the context never reports there
  # and the queue stalls. The pull_request-only expressions below (concurrency
  # group, base sha) are given merge_group equivalents.
  merge_group:
    types: [checks_requested]

concurrency:
  # `github.event.pull_request.number` is EMPTY under merge_group, so every queue
  # entry would share one group ("Submodule Gitlink Gate-") and, with
  # cancel-in-progress, each new entry would cancel the previous entry's gate --
  # a cancelled required check ejects that PR from the queue. `github.ref` is
  # unique per queue entry (refs/heads/gh-readonly-queue/main/pr-N-<sha>).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitlink-gate:
    name: submodule-gitlink-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Checkout (shallow — only HEAD; base fetched next)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      # `github.event.pull_request.base.sha` does not exist under merge_group; the
      # validator's `${1:?}` would then abort the gate with a usage error (a
      # FAILED required check, which ejects every PR from the queue). The queue
      # equivalent is `merge_group.base_sha` -- the commit the queue entry is
      # built on. Its diff to HEAD also covers any PRs queued ahead of this one;
      # re-validating their gitlinks is redundant, never wrong.
      - name: Fetch base commit (for the gitlink diff)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: git fetch --depth=1 origin "$BASE_SHA"

      - name: Validate submodule gitlinks against .gitmodules branch strategy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          chmod +x .github/scripts/validate_submodule_gitlinks.sh
          .github/scripts/validate_submodule_gitlinks.sh "$BASE_SHA"
