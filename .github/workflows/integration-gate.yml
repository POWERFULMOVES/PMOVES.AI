name: Integration Gate

on:
  pull_request:
    branches: [PMOVES.AI-Edition-Hardened-Integrations, PMOVES.AI-Edition-Hardened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  integration-gate:
    name: integration-gate
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml "pydantic>=2"

      # Review P1 on #2778: the blocking half of the identity gate
      # (pmoves/tests/test_identity_coupling_gate.py) rides the required
      # `python-tests` context, which merge-gate.yml only enforces for main.
      # On THIS branch (and Integrations) a config-only PR touching the
      # registry/vocabulary/teams files ran neither python-tests (path filter)
      # nor any required check — validate-agents-config reported but did not
      # block. integration-gate is required on both protected branches and has
      # no path filter, so the validator runs here as the blocking half.
      - name: Identity coupling gate (registry ↔ teams ↔ vocabulary)
        run: python pmoves/scripts/validate_agent_registry.py -v

      - name: Static audit layers
        run: |
          echo "=== Running static certification audit ==="

          # Check submodule references (no clone required — reads gitlinks from index)
          echo "Checking submodule references..."
          git submodule status | while read -r line; do
            hash=$(echo "$line" | awk '{print $1}')
            path=$(echo "$line" | awk '{print $2}')
            if [[ "$hash" == -* ]]; then
              echo "OK: $path (registered, hash ${hash#-})"
            elif [[ "$hash" == +* ]]; then
              echo "INFO: Modified submodule: $path (local changes)"
            else
              echo "OK: $path"
            fi
          done

          # Validate .gitmodules consistency
          echo ""
          echo "Checking .gitmodules branch tracking..."
          if [ -f .gitmodules ]; then
            grep -c '\[submodule' .gitmodules | xargs -I{} echo "Total submodules: {}"
            grep 'branch = ' .gitmodules | while read -r line; do
              branch=$(echo "$line" | awk -F= '{print $2}' | tr -d ' ')
              if [[ "$branch" != "PMOVES.AI-Edition-Hardened" && "$branch" != "main" ]]; then
                echo "WARN: Non-standard branch tracking: $line"
              fi
            done
          fi

      - name: Validate workflow YAML
        run: |
          echo "=== Validating workflow files ==="
          errors=0
          for f in .github/workflows/*.yml; do
            python -c "import yaml; yaml.safe_load(open('$f'))" 2>/dev/null && \
              echo "OK: $f" || \
              { echo "FAIL: $f"; errors=$((errors + 1)); }
          done
          if [ "$errors" -gt 0 ]; then
            echo "FAIL: $errors workflow files have invalid YAML"
            exit 1
          fi

      - name: Check CI hardening (no soft failures)
        run: |
          echo "=== Checking for soft failure patterns ==="
          errors=0

          # Check for || true in test/audit commands (allow in report generation)
          for f in .github/workflows/python-tests.yml .github/workflows/integration-contract.yml; do
            if [ -f "$f" ] && grep -n '|| true' "$f" | grep -iv 'report\|grep\|count\|bench'; then
              echo "WARN: Soft failure pattern in $f"
              errors=$((errors + 1))
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo "WARN: $errors soft failure patterns found (review required)"
          else
            echo "OK: No soft failure patterns in critical workflows"
          fi

      - name: Integration contract check
        run: |
          echo "=== Integration contract validation ==="
          if [ -f pmoves/tools/integration_contract_check.py ]; then
            python pmoves/tools/integration_contract_check.py || echo "WARN: Contract check had issues"
          else
            echo "SKIP: integration_contract_check.py not found"
          fi
