# Suit Update Release Policy Gate (§6.4)
#
# Enforces the standing rule from PMOVES-hardening-tracker.md:
#   Suit updates (Agent Zero hardened overlay, ClaWz profile normalization,
#   persona/voice bindings, model routing changes) are RELEASE CONCERNS,
#   not background chores.
#
# Any PR that touches suit-related paths MUST include a release-notes entry
# in the PR body (keyword: "release-note") or add/modify a file matching
# docs/RELEASE_NOTES_*.md.

name: Suit Release Policy Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check-suit-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Detect suit-related changes
        id: detect
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          SUIT_PATHS=(
            "pmoves/config/profiles/"
            "pmoves/config/agent_signatures.yaml"
          )

          TOUCHED=false
          TOUCHED_FILES=""

          for p in "${SUIT_PATHS[@]}"; do
            MATCHES=$(git diff --name-only "$BASE" "$HEAD" -- "$p" 2>/dev/null)
            if [ -n "$MATCHES" ]; then
              TOUCHED=true
              TOUCHED_FILES="$TOUCHED_FILES"$'\n'"$MATCHES"
            fi
          done

          # Also check Makefile for suit-related target changes
          MAKE_DIFF=$(git diff "$BASE" "$HEAD" -- Makefile 2>/dev/null)
          if echo "$MAKE_DIFF" | grep -qiE '(suit|profile|signature|clawz|persona|voice.bind|model.route)'; then
            TOUCHED=true
            TOUCHED_FILES="$TOUCHED_FILES"$'\n'"Makefile (suit-related target)"
          fi

          echo "touched=$TOUCHED" >> "$GITHUB_OUTPUT"
          {
            echo "files<<PMOVES_SUIT_EOF"
            echo "$TOUCHED_FILES"
            echo "PMOVES_SUIT_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$TOUCHED" = "true" ]; then
            echo "::notice::Suit-related files changed:$TOUCHED_FILES"
          else
            echo "No suit-related changes detected — gate passes trivially."
          fi

      - name: Verify release-notes entry
        if: steps.detect.outputs.touched == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Suit files were modified. Checking for release-notes evidence..."
          PASS=false

          # Check 1: PR body contains release-note keyword
          if echo "$PR_BODY" | grep -qiE '(release.note|release-note|RELEASE NOTE)'; then
            echo "✓ PR body contains release-note reference."
            PASS=true
          fi

          # Check 2: New or modified RELEASE_NOTES file in docs/
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          RN_CHANGES=$(git diff --name-only "$BASE" "$HEAD" -- "docs/RELEASE_NOTES_*" 2>/dev/null)
          if [ -n "$RN_CHANGES" ]; then
            echo "✓ Release notes file modified: $RN_CHANGES"
            PASS=true
          fi

          # Check 3: New RELEASE_NOTES file added (untracked)
          RN_NEW=$(git ls-files --others --exclude-standard -- "docs/RELEASE_NOTES_*" 2>/dev/null)
          if [ -n "$RN_NEW" ]; then
            echo "✓ New release notes file added: $RN_NEW"
            PASS=true
          fi

          if [ "$PASS" = "false" ]; then
            echo ""
            echo "::error::SUIT RELEASE POLICY VIOLATION (§6.4)"
            echo "::error::The following suit-related files were changed:"
            echo "::error::${{ steps.detect.outputs.files }}"
            echo "::error::"
            echo "::error::Suit updates are release concerns (see docs/hardening/PMOVES-hardening-tracker.md §6.4)."
            echo "::error::You MUST include a release-notes entry. Either:"
            echo "::error::  1. Add 'Release Note: ...' to your PR body, or"
            echo "::error::  2. Add/modify a docs/RELEASE_NOTES_*.md file."
            exit 1
          fi

          echo "Suit release policy gate PASSED."

      - name: Skip (no suit changes)
        if: steps.detect.outputs.touched != 'true'
        run: echo "Gate skipped — no suit-related files in this PR."
