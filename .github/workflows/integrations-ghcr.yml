name: Build and publish integration images to GHCR

on:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Integration to build (all runs the full matrix)'
        required: true
        default: all
        type: choice
        options:
          - all
          - agent-zero
          - archon
          - archon-ui
          - open-notebook
          - wger
          - firefly-iii
          - jellyfin
          - pmoves-yt
          - deepresearch
          - supaserch
      push_to_dockerhub:
        description: 'Set to true to push to Docker Hub when secrets are present'
        required: true
        default: false
        type: boolean
  push:
    branches: [main, PMOVES.AI-Edition-Hardened]
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'PMOVES-Open-Notebook'
      - 'PMOVES-Agent-Zero'
      - 'PMOVES-Archon'
      - 'PMOVES.YT'
      - 'PMOVES-Jellyfin'
      - 'PMOVES-Supaserch'
      - '.github/workflows/integrations-ghcr.yml'
  # schedule:
  #   - cron: '17 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  # Prefer PAT first for package ownership/ACL edge-cases.
  # GHCR_USERNAME is optional; if unset, workflow attempts PAT auth with repository owner.
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || '' }}
  GHCR_PAT: ${{ secrets.GHCR_TOKEN || secrets.GH_PAT_PUBLISH || '' }}
  # Used for cloning other integration repos (private repos require a PAT with repo read).
  # If unset, clones fall back to unauthenticated https (works for public repos only).
  CI_GIT_CLONE_TOKEN: ${{ secrets.CI_GIT_CLONE_TOKEN || secrets.GH_PAT_PUBLISH || '' }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.CI_DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PAT || secrets.CI_DOCKERHUB_TOKEN }}

jobs:
  resolve-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.resolve.outputs.names }}
    steps:
      - name: Resolve selected integrations
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          selected="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            selected="${{ github.event.inputs.integration }}"
          fi

          cat > matrix-names.json <<'JSON'
          [
            "agent-zero",
            "archon",
            "archon-ui",
            "open-notebook",
            "wger",
            "firefly-iii",
            "jellyfin",
            "pmoves-yt",
            "deepresearch",
            "supaserch"
          ]
          JSON

          if [ "$selected" = "all" ]; then
            cp matrix-names.json selected-names.json
          else
            jq --arg selected "$selected" \
              '[ .[] | select(. == $selected) ]' \
              matrix-names.json > selected-names.json
          fi

          selected_count="$(jq 'length' selected-names.json)"
          if [ "$selected_count" -eq 0 ]; then
            echo "::error::No integration matched selector: $selected"
            exit 1
          fi

          echo "Selected integration input: $selected"
          echo "Selected jobs: $selected_count"
          echo "names=$(jq -c . selected-names.json)" >> "$GITHUB_OUTPUT"

  build-publish:
    name: Build ${{ matrix.name }}
    needs: resolve-matrix
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJson(needs.resolve-matrix.outputs.names) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443

      - name: Checkout (stub)
        uses: actions/checkout@v4

      - name: Resolve integration metadata
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            agent-zero)
              cat <<'EOF' | sed 's/^ *//' >> "$GITHUB_ENV"
          INTEGRATION_SOURCE_MODE=workspace
          INTEGRATION_REPO=PMOVES.AI
          INTEGRATION_REF=main
          INTEGRATION_CONTEXT=pmoves
          INTEGRATION_DOCKERFILE=pmoves/services/agent-zero/Dockerfile.multiarch
          INTEGRATION_IMAGE_NAME=pmoves-agent-zero
          INTEGRATION_BUILD_ARGS=
          INTEGRATION_PLATFORMS=linux/amd64,linux/arm64
          INTEGRATION_GENERATE_SBOM=true
          INTEGRATION_TRIVY_IGNOREFILE=.github/trivy/agent-zero.trivyignore
          EOF
              ;;
            archon)
              cat <<'EOF' | sed 's/^ *//' >> "$GITHUB_ENV"
          INTEGRATION_SOURCE_MODE=workspace
          INTEGRATION_REPO=PMOVES.AI
          INTEGRATION_REF=main
          INTEGRATION_CONTEXT=pmoves
          INTEGRATION_DOCKERFILE=pmoves/services/archon/Dockerfile
          INTEGRATION_IMAGE_NAME=pmoves-archon
          INTEGRATION_BUILD_ARGS=
          INTEGRATION_PLATFORMS=linux/amd64,linux/arm64
          INTEGRATION_GENERATE_SBOM=false
          INTEGRATION_TRIVY_IGNOREFILE=
          EOF
              ;;
            archon-ui)
              cat <<'EOF' | sed 's/^ *//' >> "$GITHUB_ENV"
          INTEGRATION_SOURCE_MODE=clone
          INTEGRATION_REPO=PMOVES-Archon
          INTEGRATION_REF=PMOVES.AI-Edition-Hardened
          INTEGRATION_CONTEXT=archon-ui-main
          INTEGRATION_DOCKERFILE=archon-ui-main/Dockerfile
          INTEGRATION_IMAGE_NAME=pmoves-archon-ui
          INTEGRATION_BUILD_ARGS=
          INTEGRATION_PLATFORMS=linux/amd64,linux/arm64
          INTEGRATION_GENERATE_SBOM=true
          INTEGRATION_TRIVY_IGNOREFILE=.github/trivy/archon-ui.trivyignore
          EOF
              ;;
            open-notebook)
              cat <<'EOF' | sed 's/^ *//' >> "$GITHUB_ENV"
          INTEGRATION_SOURCE_MODE=clone
          INTEGRATION_REPO=PMOVES-Open-Notebook
          INTEGRATION_REF=PMOVES.AI-Edition-Hardened
          INTEGRATION_CONTEXT=.
          INTEGRATION_DOCKERFILE=Dockerfile
          INTEGRATION_IMAGE_NAME=pmoves-open-notebook
          INTEGRATION_BUILD_ARGS=
          INTEGRATION_PLATFORMS=linux/amd64,linux/arm64
          INTEGRATION_GENERATE_SBOM=true
          INTEGRATION_TRIVY_IGNOREFILE=.github/trivy/open-notebook.trivyignore
          EOF
              ;;
            wger)
              cat <<'EOF' | sed 's/^ *//' >> "$GITHUB_ENV"
          INTEGRATION_SOURCE_MODE=clone
          INTEGRATION_REPO=Pmoves-Health-wger
          INTEGRATION_REF=PMOVES.AI-Edition-Hardened
          INTEGRATION_CONTEXT=.
          INTEGRATION_DOCKERFILE=extras/docker/production/Dockerfile
          INTEGRATION_IMAGE_NAME=pmoves-health-wger
          INTEGRATION_BUILD_ARGS=
          INTEGRATION_PLATFORMS=linux/amd64,linux/arm64
          INTEGRATION_GENERATE_SBOM=true
          INTEGRATION_TRIVY_IGNOREFILE=
          EOF
              ;;
            firefly-iii)
              cat <<'EOF' | sed 's/^ *//' >> "$GITHUB_ENV"
          INTEGRATION_SOURCE_MODE=workspace
          INTEGRATION_REPO=PMOVES.AI
          INTEGRATION_REF=main
          INTEGRATION_CONTEXT=pmoves/images/firefly-iii
          INTEGRATION_DOCKERFILE=pmoves/images/firefly-iii/Dockerfile
          INTEGRATION_IMAGE_NAME=pmoves-firefly-iii
          INTEGRATION_BUILD_ARGS=
          INTEGRATION_PLATFORMS=linux/amd64,linux/arm64
          INTEGRATION_GENERATE_SBOM=true
          INTEGRATION_TRIVY_IGNOREFILE=
          EOF
              ;;
            jellyfin)
              cat <<'EOF' | sed 's/^ *//' >> "$GITHUB_ENV"
          INTEGRATION_SOURCE_MODE=workspace
          INTEGRATION_REPO=PMOVES.AI
          INTEGRATION_REF=main
          INTEGRATION_CONTEXT=pmoves/images/jellyfin
          INTEGRATION_DOCKERFILE=pmoves/images/jellyfin/Dockerfile
          INTEGRATION_IMAGE_NAME=pmoves-jellyfin
          INTEGRATION_BUILD_ARGS=
          INTEGRATION_PLATFORMS=linux/amd64,linux/arm64
          INTEGRATION_GENERATE_SBOM=true
          INTEGRATION_TRIVY_IGNOREFILE=.github/trivy/jellyfin.trivyignore
          EOF
              ;;
            pmoves-yt)
              cat <<'EOF' | sed 's/^ *//' >> "$GITHUB_ENV"
          INTEGRATION_SOURCE_MODE=workspace
          INTEGRATION_REPO=PMOVES.AI
          INTEGRATION_REF=main
          INTEGRATION_CONTEXT=pmoves/services/pmoves-yt
          INTEGRATION_DOCKERFILE=pmoves/services/pmoves-yt/Dockerfile
          INTEGRATION_IMAGE_NAME=pmoves-yt
          INTEGRATION_BUILD_ARGS=
          INTEGRATION_PLATFORMS=linux/amd64,linux/arm64
          INTEGRATION_GENERATE_SBOM=true
          INTEGRATION_TRIVY_IGNOREFILE=
          EOF
              ;;
            deepresearch)
              cat <<'EOF' | sed 's/^ *//' >> "$GITHUB_ENV"
          INTEGRATION_SOURCE_MODE=workspace
          INTEGRATION_REPO=PMOVES.AI
          INTEGRATION_REF=main
          INTEGRATION_CONTEXT=pmoves
          INTEGRATION_DOCKERFILE=pmoves/services/deepresearch/Dockerfile
          INTEGRATION_IMAGE_NAME=pmoves-deepresearch
          INTEGRATION_BUILD_ARGS=
          INTEGRATION_PLATFORMS=linux/amd64
          INTEGRATION_GENERATE_SBOM=false
          INTEGRATION_TRIVY_IGNOREFILE=
          EOF
              ;;
            supaserch)
              cat <<'EOF' | sed 's/^ *//' >> "$GITHUB_ENV"
          INTEGRATION_SOURCE_MODE=workspace
          INTEGRATION_REPO=PMOVES.AI
          INTEGRATION_REF=main
          INTEGRATION_CONTEXT=pmoves/services
          INTEGRATION_DOCKERFILE=pmoves/services/supaserch/Dockerfile
          INTEGRATION_IMAGE_NAME=pmoves-supaserch
          INTEGRATION_BUILD_ARGS=
          INTEGRATION_PLATFORMS=linux/amd64,linux/arm64
          INTEGRATION_GENERATE_SBOM=true
          INTEGRATION_TRIVY_IGNOREFILE=
          EOF
              ;;
            *)
              echo "::error::Unsupported integration selector: ${{ matrix.name }}"
              exit 1
              ;;
          esac

      - name: Prepare integration source
        run: |
          set -euo pipefail
          if [ "${INTEGRATION_SOURCE_MODE}" = "workspace" ]; then
            echo "Using checked-out PMOVES.AI workspace as integration source"
            rm -rf integration-src
            mkdir -p integration-src
            git archive --format=tar HEAD | tar -x -C integration-src
          else
            url="https://github.com/${{ github.repository_owner }}/${INTEGRATION_REPO}.git"
            if [ -n "${CI_GIT_CLONE_TOKEN:-}" ]; then
              url="${url/https:\/\/github.com\//https:\/\/x-access-token:${CI_GIT_CLONE_TOKEN}@github.com/}"
            fi
            if ! git clone --depth=1 --branch "${INTEGRATION_REF}" "$url" integration-src; then
              echo "::error::Failed to clone ${url} (ref=${INTEGRATION_REF}). If this is a private integration repo, set secrets.CI_GIT_CLONE_TOKEN (PAT with repo read) or reuse GH_PAT_PUBLISH with repo access."
              exit 1
            fi
          fi

      - name: Free disk space (runner)
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Log in to GHCR (PAT using GHCR_USERNAME)
        id: login_ghcr_pat_named
        if: ${{ env.GHCR_PAT != '' && env.GHCR_USERNAME != '' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PAT }}

      - name: Log in to GHCR (PAT using repository owner)
        id: login_ghcr_pat_owner
        if: ${{ env.GHCR_PAT != '' && steps.login_ghcr_pat_named.outcome != 'success' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ env.GHCR_PAT }}

      - name: Require valid GHCR PAT when provided
        if: ${{ env.GHCR_PAT != '' && steps.login_ghcr_pat_named.outcome != 'success' && steps.login_ghcr_pat_owner.outcome != 'success' }}
        run: |
          echo "::error::GHCR PAT authentication failed. Check GHCR_TOKEN/GH_PAT_PUBLISH scopes (packages:write) and GHCR_USERNAME (if set)."
          exit 1

      - name: Log in to GHCR (workflow token fallback)
        id: login_ghcr_actions
        if: ${{ env.GHCR_PAT == '' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Require GHCR authentication
        if: ${{ steps.login_ghcr_actions.outcome != 'success' && steps.login_ghcr_pat_named.outcome != 'success' && steps.login_ghcr_pat_owner.outcome != 'success' }}
        run: |
          echo "::error::Unable to authenticate to GHCR. Ensure repo Actions has packages:write and/or set GHCR_USERNAME + GHCR_TOKEN (or GH_PAT_PUBLISH)."
          exit 1

      - name: Optional login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME && env.DOCKERHUB_PASSWORD }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Compute tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ secrets.CI_DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_NAMESPACE }}
          INCLUDE_DOCKERHUB: ${{ env.DOCKERHUB_USERNAME && env.DOCKERHUB_PASSWORD }}
          USE_GHCR: ${{ steps.login_ghcr_actions.outcome == 'success' || steps.login_ghcr_pat_named.outcome == 'success' || steps.login_ghcr_pat_owner.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "use_ghcr=false" >> $GITHUB_OUTPUT
            echo "has_tags=false" >> $GITHUB_OUTPUT
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "::notice::Pull request build detected; registry publish/sign/scan steps are skipped."
            exit 0
          fi

          DATE_TAG=$(date +%Y%m%d)
          SHA_SHORT=${GITHUB_SHA::7}
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          GHCR_NS_RAW="${{ secrets.CI_GHCR_NAMESPACE }}"
          if [ -z "$GHCR_NS_RAW" ]; then GHCR_NS_RAW="${{ secrets.GHCR_NAMESPACE }}"; fi
          if [ -z "$GHCR_NS_RAW" ]; then GHCR_NS_RAW="${{ github.repository_owner }}"; fi
          # Docker tag validation requires the repository namespace be lowercase.
          GHCR_NS="${GHCR_NS_RAW,,}"
          echo "ghcr_ns=${GHCR_NS}" >> $GITHUB_OUTPUT
          echo "use_ghcr=${USE_GHCR}" >> $GITHUB_OUTPUT

          TAGS=""
          PRIMARY_TAG=""

          # Only add GHCR tags if login succeeded.
          if [ "$USE_GHCR" = "true" ]; then
            GHCR_LATEST="${{ env.REGISTRY }}/$GHCR_NS/${INTEGRATION_IMAGE_NAME}:pmoves-latest"
            GHCR_SHA="${{ env.REGISTRY }}/$GHCR_NS/${INTEGRATION_IMAGE_NAME}:${DATE_TAG}-${SHA_SHORT}"
            TAGS="${GHCR_LATEST}\n${GHCR_SHA}"
            PRIMARY_TAG="${GHCR_LATEST}"
          fi

          if [ "$INCLUDE_DOCKERHUB" = "true" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            DH_NS=${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}
            DH_LATEST="docker.io/$DH_NS/${INTEGRATION_IMAGE_NAME}:pmoves-latest"
            DH_SHA="docker.io/$DH_NS/${INTEGRATION_IMAGE_NAME}:${DATE_TAG}-${SHA_SHORT}"
            if [ -n "$TAGS" ]; then
              TAGS="$TAGS\n${DH_LATEST}\n${DH_SHA}"
            else
              TAGS="${DH_LATEST}\n${DH_SHA}"
              PRIMARY_TAG="${DH_LATEST}"
            fi
          fi

          if [ -z "$PRIMARY_TAG" ]; then
            echo "::warning::No tags generated; GHCR login failed and Docker Hub credentials are absent. Build/push, scan, and sign steps will be skipped."
            echo "has_tags=false" >> $GITHUB_OUTPUT
          else
            echo "has_tags=true" >> $GITHUB_OUTPUT
            echo "primary_tag=${PRIMARY_TAG}" >> $GITHUB_OUTPUT
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # PRs validate Dockerfile/build correctness without publishing artifacts.
      - name: Build (PR validation, no push)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: integration-src/${{ env.INTEGRATION_CONTEXT }}
          file: integration-src/${{ env.INTEGRATION_DOCKERFILE }}
          push: false
          build-args: |
            PIP_CONSTRAINT=requirements.lock
            ${{ env.INTEGRATION_BUILD_ARGS }}
          platforms: ${{ env.INTEGRATION_PLATFORMS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (multi-arch)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: integration-src/${{ env.INTEGRATION_CONTEXT }}
          file: integration-src/${{ env.INTEGRATION_DOCKERFILE }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            PIP_CONSTRAINT=requirements.lock
            ${{ env.INTEGRATION_BUILD_ARGS }}
          platforms: ${{ env.INTEGRATION_PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cosign sign GHCR digest (keyless)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' && steps.meta.outputs.use_ghcr == 'true' }}
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.meta.outputs.ghcr_ns }}/${{ env.INTEGRATION_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_DIGEST_REF"

      - name: Install Syft (SBOM)
        if: ${{ github.event_name != 'pull_request' && env.INTEGRATION_GENERATE_SBOM == 'true' && steps.meta.outputs.has_tags == 'true' }}
        uses: anchore/sbom-action/download-syft@v0.22.2

      - name: Generate SBOMs (CycloneDX)
        id: sbom
        if: ${{ github.event_name != 'pull_request' && env.INTEGRATION_GENERATE_SBOM == 'true' && steps.meta.outputs.has_tags == 'true' }}
        run: |
          set -euo pipefail
          syft packages "${{ steps.meta.outputs.primary_tag }}" -o cyclonedx-json > sbom.cdx.json
          echo "sbom_path=sbom.cdx.json" >> $GITHUB_OUTPUT

      - name: Upload SBOM artifact
        if: ${{ github.event_name != 'pull_request' && env.INTEGRATION_GENERATE_SBOM == 'true' && steps.meta.outputs.has_tags == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-sbom
          path: ${{ steps.sbom.outputs.sbom_path }}

      - name: Free disk space (docker prune)
        run: |
          set -euxo pipefail
          docker system df || true
          docker buildx prune -af || true
          docker builder prune -af || true
          docker system prune -af --volumes || true
          df -h

      - name: Pull image for Trivy (private GHCR)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        run: |
          set -euo pipefail
          docker pull "${{ steps.meta.outputs.primary_tag }}"

      - name: Trivy vulnerability scan (HIGH/CRITICAL)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        uses: aquasecurity/trivy-action@0.34.0
        with:
          # Gate on HIGH/CRITICAL with fixes available (vendor/unfixed CVEs are still surfaced by the next step).
          # This avoids blocking nightly builds on upstream issues we can't remediate immediately, while keeping
          # fixable regressions as hard failures.
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: table
          trivyignores: ${{ env.INTEGRATION_TRIVY_IGNOREFILE }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'

      - name: Trivy vulnerability scan report (includes unfixed)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        uses: aquasecurity/trivy-action@0.34.0
        with:
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: table
          output: trivy-${{ matrix.name }}.txt
          # Always include full findings (even if the gate uses trivyignore to unblock a build).
          trivyignores: ''
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'

      - name: Upload Trivy report artifact
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-trivy
          path: trivy-${{ matrix.name }}.txt

      - name: Cosign verify GHCR digest (keyless)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' && steps.meta.outputs.use_ghcr == 'true' }}
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.meta.outputs.ghcr_ns }}/${{ env.INTEGRATION_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          cosign verify --certificate-oidc-issuer "$issuer" --certificate-identity "$identity" "$IMAGE_DIGEST_REF"

