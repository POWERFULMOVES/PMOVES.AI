name: Build and publish integration images to GHCR

on:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Integration to build (all runs the full matrix)'
        required: true
        default: all
        type: choice
        options:
          - all
          - agent-zero
          - archon
          - archon-ui
          - open-notebook
          - wger
          - firefly-iii
          - jellyfin
          - pmoves-yt
          - deepresearch
          - supaserch
      push_to_dockerhub:
        description: 'Set to true to push to Docker Hub when secrets are present'
        required: true
        default: false
        type: boolean
      ghcr_namespace:
        description: 'Optional GHCR namespace override (for org transitions, e.g. cataclysmstudios-inc)'
        required: false
        default: ''
        type: string
  push:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/services/agent-zero/**'
      - 'pmoves/services/archon/**'
      - 'pmoves/services/pmoves-yt/**'
      - 'pmoves/services/deepresearch/**'
      - 'pmoves/services/supaserch/**'
      - 'pmoves/images/firefly-iii/**'
      - 'pmoves/images/jellyfin/**'
      - 'PMOVES-Open-Notebook'
      - 'PMOVES-Agent-Zero'
      - 'PMOVES-Archon'
      - 'PMOVES.YT'
      - 'PMOVES-Jellyfin'
      - 'PMOVES-Supaserch'
      # Priority 1: production services
      - 'PMOVES-HiRAG'
      - 'PMOVES-BoTZ'
      - 'PMOVES-tensorzero'
      - 'PMOVES-Neo4j'
      - 'Pmoves-cipher'
      # Priority 2: agent infrastructure
      - 'PMOVES-E2B-Danger-Room'
      - 'PMOVES-Pipecat'
      - 'PMOVES-ClawZ'
      # Priority 3: media/content
      - 'PMOVES-transcribe-and-fetch'
      - 'PMOVES-autoresearch'
      - '.github/workflows/integrations-ghcr.yml'
      - '.github/workflows/integrations-ghcr.matrix.json'
      - '.github/trivy/**'
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/services/agent-zero/**'
      - 'pmoves/services/archon/**'
      - 'pmoves/services/pmoves-yt/**'
      - 'pmoves/services/deepresearch/**'
      - 'pmoves/services/supaserch/**'
      - 'pmoves/images/firefly-iii/**'
      - 'pmoves/images/jellyfin/**'
      - 'PMOVES-Open-Notebook'
      - 'PMOVES-Agent-Zero'
      - 'PMOVES-Archon'
      - 'PMOVES.YT'
      - 'PMOVES-Jellyfin'
      - 'PMOVES-Supaserch'
      # Priority 1: production services
      - 'PMOVES-HiRAG'
      - 'PMOVES-BoTZ'
      - 'PMOVES-tensorzero'
      - 'PMOVES-Neo4j'
      - 'Pmoves-cipher'
      # Priority 2: agent infrastructure
      - 'PMOVES-E2B-Danger-Room'
      - 'PMOVES-Pipecat'
      - 'PMOVES-ClawZ'
      # Priority 3: media/content
      - 'PMOVES-transcribe-and-fetch'
      - 'PMOVES-autoresearch'
      - '.github/workflows/integrations-ghcr.yml'
      - '.github/workflows/integrations-ghcr.matrix.json'
      - '.github/trivy/**'
  # schedule:
  #   - cron: '17 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep manual reruns intact, but cancel stale push/PR runs on the same ref.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  REGISTRY: ghcr.io
  # Prefer PAT when supplied (package ownership/ACL edge cases), fallback to workflow token.
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || '' }}
  GHCR_PAT: ${{ secrets.GHCR_TOKEN || secrets.GH_PAT_PUBLISH || '' }}
  # Used for cloning other integration repos (private repos require a PAT with repo read).
  # If unset, clones fall back to unauthenticated https (works for public repos only).
  CI_GIT_CLONE_TOKEN: ${{ secrets.CI_GIT_CLONE_TOKEN || secrets.GH_PAT_PUBLISH || '' }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.CI_DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PAT || secrets.CI_DOCKERHUB_TOKEN }}

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      names: ${{ steps.resolve.outputs.names }}
    steps:
      - name: Checkout (matrix config)
        uses: actions/checkout@v4

      - name: Resolve integration matrix
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INTEGRATION: ${{ github.event.inputs.integration || 'all' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import uuid

          matrix_path = pathlib.Path(".github/workflows/integrations-ghcr.matrix.json")
          entries = json.loads(matrix_path.read_text(encoding="utf-8"))
          event_name = os.environ.get("EVENT_NAME", "")
          target = os.environ.get("INTEGRATION", "all")

          names = [entry["name"] for entry in entries]
          if event_name == "workflow_dispatch" and target != "all":
              if target not in names:
                  print(f"::error::Unsupported integration target: {target}", file=sys.stderr)
                  sys.exit(1)
              names = [target]

          payload = json.dumps(names, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"names={payload}\n")

          print(f"Resolved {len(names)} integration lane(s) (target={target})")
          PY

  build-publish:
    name: Build ${{ matrix.name }}
    needs: resolve-matrix
    # Distribute across all available self-hosted Linux runners for parallel builds.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      # Allow all self-hosted runners (ai-lab, vps, hotfix) to build in parallel.
      max-parallel: 4
      matrix:
        name: ${{ fromJSON(needs.resolve-matrix.outputs.names) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443

      - name: Checkout (stub)
        uses: actions/checkout@v4

      - name: Load integration config
        id: cfg
        run: |
          set -euo pipefail
          pybin="$(command -v python3 || command -v python || true)"
          if [ -z "$pybin" ]; then
            echo "::error::python3/python is required on runner for matrix config resolution."
            exit 1
          fi
          "$pybin" - <<'PY'
          import json
          import os
          import pathlib
          import sys

          name = os.environ["MATRIX_NAME"]
          matrix_path = pathlib.Path(".github/workflows/integrations-ghcr.matrix.json")
          entries = json.loads(matrix_path.read_text(encoding="utf-8"))
          match = next((entry for entry in entries if entry.get("name") == name), None)
          if not match:
              print(f"::error::No config found for integration '{name}'", file=sys.stderr)
              sys.exit(1)

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as fh:
              for key, value in match.items():
                  if value is None:
                      value = ""
                  if isinstance(value, bool):
                      fh.write(f"{key}={'true' if value else 'false'}\n")
                  else:
                      text = str(value)
                      if "\n" in text:
                          delim = f"EOF_{key}_{uuid.uuid4().hex}"
                          fh.write(f"{key}<<{delim}\n{text}\n{delim}\n")
                      else:
                          fh.write(f"{key}={text}\n")
          PY
        env:
          MATRIX_NAME: ${{ matrix.name }}

      - name: Generate GitHub App token (for clone + GHCR)
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          # Explicit token scopes required for clone + GHCR push
          permission-contents: read
          permission-packages: write

      - name: Prepare integration source
        run: |
          set -euo pipefail
          cfg_url='${{ steps.cfg.outputs.git_url }}'
          cfg_ref='${{ steps.cfg.outputs.ref }}'
          case "$cfg_url" in
            https://github.com/*) ;;
            *)
              echo "::error::Unsupported git_url '$cfg_url' (only https://github.com/* is allowed)."
              exit 1
              ;;
          esac
          if ! printf '%s' "$cfg_ref" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Unsupported git ref '$cfg_ref'."
            exit 1
          fi

          if [ "$cfg_url" = "https://github.com/POWERFULMOVES/PMOVES.AI.git" ]; then
            echo "Using checked-out PMOVES.AI workspace as integration source"
            rm -rf integration-src
            mkdir -p integration-src
            git archive --format=tar HEAD | tar -x -C integration-src
          else
            url="$cfg_url"
            # Prefer App token over PAT for clone authentication
            clone_token="${APP_TOKEN:-${CI_GIT_CLONE_TOKEN:-}}"
            if [ -n "${clone_token}" ]; then
              trimmed="${url#https://github.com/}"
              url="https://x-access-token:${clone_token}@github.com/${trimmed}"
            fi
            if ! git clone --depth=1 --branch "$cfg_ref" "$url" integration-src; then
              echo "::error::Failed to clone ${cfg_url} (ref=${cfg_ref}). If this is a private integration repo, ensure GH_APP_ID/GH_APP_SEC secrets are set, or set CI_GIT_CLONE_TOKEN (PAT with repo read)."
              exit 1
            fi
          fi
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Free disk space (runner)
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.1

      - name: Log in to GHCR (App token preferred)
        id: login_ghcr_app
        if: ${{ steps.app_token.outputs.token != '' }}
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: x-access-token
          password: ${{ steps.app_token.outputs.token }}

      - name: Log in to GHCR (PAT fallback)
        id: login_ghcr_pat
        if: ${{ steps.login_ghcr_app.outcome != 'success' && env.GHCR_USERNAME != '' && env.GHCR_PAT != '' }}
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PAT }}

      - name: Log in to GHCR (workflow token fallback)
        id: login_ghcr_actions
        if: ${{ steps.login_ghcr_app.outcome != 'success' && steps.login_ghcr_pat.outcome != 'success' }}
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Require GHCR authentication
        if: ${{ steps.login_ghcr_app.outcome != 'success' && steps.login_ghcr_pat.outcome != 'success' && steps.login_ghcr_actions.outcome != 'success' }}
        run: |
          echo "::error::Unable to authenticate to GHCR. Check GH_APP_ID/GH_APP_SEC, or GHCR_USERNAME/GHCR_TOKEN."
          exit 1

      - name: Optional login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME && env.DOCKERHUB_PASSWORD }}
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Compute tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ secrets.CI_DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_NAMESPACE }}
          INCLUDE_DOCKERHUB: ${{ env.DOCKERHUB_USERNAME && env.DOCKERHUB_PASSWORD }}
          USE_GHCR: ${{ steps.login_ghcr_app.outcome == 'success' || steps.login_ghcr_pat.outcome == 'success' || steps.login_ghcr_actions.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "use_ghcr=false" >> $GITHUB_OUTPUT
            echo "has_tags=false" >> $GITHUB_OUTPUT
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "::notice::Pull request build detected; registry publish/sign/scan steps are skipped."
            exit 0
          fi

          DATE_TAG=$(date +%Y%m%d)
          SHA_SHORT=${GITHUB_SHA::7}
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          GHCR_NS_RAW="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ghcr_namespace || '' }}"
          if [ -z "$GHCR_NS_RAW" ]; then GHCR_NS_RAW="${{ secrets.CI_GHCR_NAMESPACE }}"; fi
          if [ -z "$GHCR_NS_RAW" ]; then GHCR_NS_RAW="${{ secrets.GHCR_NAMESPACE }}"; fi
          if [ -z "$GHCR_NS_RAW" ]; then GHCR_NS_RAW="${{ github.repository_owner }}"; fi
          # Docker tag validation requires the repository namespace be lowercase.
          GHCR_NS="${GHCR_NS_RAW,,}"
          echo "ghcr_ns=${GHCR_NS}" >> $GITHUB_OUTPUT
          echo "use_ghcr=${USE_GHCR}" >> $GITHUB_OUTPUT

          TAGS=""
          PRIMARY_TAG=""

          # Only add GHCR tags if login succeeded.
          if [ "$USE_GHCR" = "true" ]; then
            GHCR_LATEST="${{ env.REGISTRY }}/$GHCR_NS/${{ steps.cfg.outputs.image_name }}:pmoves-latest"
            GHCR_SHA="${{ env.REGISTRY }}/$GHCR_NS/${{ steps.cfg.outputs.image_name }}:${DATE_TAG}-${SHA_SHORT}"
            TAGS="${GHCR_LATEST}\n${GHCR_SHA}"
            PRIMARY_TAG="${GHCR_LATEST}"
          fi

          if [ "$INCLUDE_DOCKERHUB" = "true" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            DH_NS=${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}
            DH_LATEST="docker.io/$DH_NS/${{ steps.cfg.outputs.image_name }}:pmoves-latest"
            DH_SHA="docker.io/$DH_NS/${{ steps.cfg.outputs.image_name }}:${DATE_TAG}-${SHA_SHORT}"
            if [ -n "$TAGS" ]; then
              TAGS="$TAGS\n${DH_LATEST}\n${DH_SHA}"
            else
              TAGS="${DH_LATEST}\n${DH_SHA}"
              PRIMARY_TAG="${DH_LATEST}"
            fi
          fi

          if [ -z "$PRIMARY_TAG" ]; then
            echo "::warning::No tags generated; GHCR login failed and Docker Hub credentials are absent. Build/push, scan, and sign steps will be skipped."
            echo "has_tags=false" >> $GITHUB_OUTPUT
          else
            echo "has_tags=true" >> $GITHUB_OUTPUT
            echo "primary_tag=${PRIMARY_TAG}" >> $GITHUB_OUTPUT
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # PRs validate Dockerfile/build correctness without publishing artifacts.
      # Build native amd64 only — skip arm64 QEMU emulation to cut PR time ~50%.
      - name: Build (PR validation, no push)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v7
        with:
          context: integration-src/${{ steps.cfg.outputs.context }}
          file: integration-src/${{ steps.cfg.outputs.dockerfile }}
          push: false
          build-args: |
            PIP_CONSTRAINT=requirements.lock
            ${{ steps.cfg.outputs.build_args }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (multi-arch)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: integration-src/${{ steps.cfg.outputs.context }}
          file: integration-src/${{ steps.cfg.outputs.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            PIP_CONSTRAINT=requirements.lock
            ${{ steps.cfg.outputs.build_args }}
          platforms: ${{ steps.cfg.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cosign sign GHCR digest (keyless)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' && steps.meta.outputs.use_ghcr == 'true' }}
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.meta.outputs.ghcr_ns }}/${{ steps.cfg.outputs.image_name }}@${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_DIGEST_REF"

      - name: Install Syft (SBOM)
        if: ${{ github.event_name != 'pull_request' && steps.cfg.outputs.generate_sbom == 'true' && steps.meta.outputs.has_tags == 'true' }}
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Generate SBOMs (CycloneDX)
        id: sbom
        if: ${{ github.event_name != 'pull_request' && steps.cfg.outputs.generate_sbom == 'true' && steps.meta.outputs.has_tags == 'true' }}
        run: |
          set -euo pipefail
          syft packages "${{ steps.meta.outputs.primary_tag }}" -o cyclonedx-json > sbom.cdx.json
          echo "sbom_path=sbom.cdx.json" >> $GITHUB_OUTPUT

      - name: Upload SBOM artifact
        if: ${{ github.event_name != 'pull_request' && steps.cfg.outputs.generate_sbom == 'true' && steps.meta.outputs.has_tags == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-sbom
          path: ${{ steps.sbom.outputs.sbom_path }}

      - name: Free disk space (keep BuildKit cache)
        run: |
          set -euxo pipefail
          docker system df || true
          # Remove dangling images and stopped containers but preserve BuildKit
          # layer cache and volumes for faster subsequent builds.
          docker image prune -f || true
          docker container prune -f || true
          df -h

      - name: Pull image for Trivy (private GHCR)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        run: |
          set -euo pipefail
          docker pull "${{ steps.meta.outputs.primary_tag }}"

      - name: Trivy vulnerability scan (HIGH/CRITICAL)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        uses: aquasecurity/trivy-action@0.35.0
        with:
          # Gate on HIGH/CRITICAL with fixes available (vendor/unfixed CVEs are still surfaced by the next step).
          # This avoids blocking nightly builds on upstream issues we can't remediate immediately, while keeping
          # fixable regressions as hard failures.
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: table
          trivyignores: ${{ steps.cfg.outputs.trivy_ignorefile }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'
          timeout: '10m0s'

      - name: Trivy vulnerability scan report (includes unfixed)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: table
          output: trivy-${{ matrix.name }}.txt
          # Always include full findings (even if the gate uses trivyignore to unblock a build).
          trivyignores: ''
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'
          timeout: '10m0s'

      - name: Upload Trivy report artifact
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-trivy
          path: trivy-${{ matrix.name }}.txt

      - name: Cosign verify GHCR digest (keyless)
        if: ${{ github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' && steps.meta.outputs.use_ghcr == 'true' }}
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.meta.outputs.ghcr_ns }}/${{ steps.cfg.outputs.image_name }}@${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          cosign verify --certificate-oidc-issuer "$issuer" --certificate-identity "$identity" "$IMAGE_DIGEST_REF"
