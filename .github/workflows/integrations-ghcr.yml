name: Build and publish integration images to GHCR

on:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Integration to build (all runs the full matrix)'
        required: true
        default: all
        type: choice
        options:
          - all
          - agent-zero
          - archon
          - archon-ui
          - open-notebook
          - wger
          - firefly-iii
          - jellyfin
          - pmoves-yt
          - deepresearch
          - supaserch
      push_to_dockerhub:
        description: 'Set to true to push to Docker Hub when secrets are present'
        required: true
        default: false
        type: boolean
      ghcr_namespace:
        description: 'Optional GHCR namespace override (for org transitions, e.g. cataclysmstudios-inc)'
        required: false
        default: ''
        type: string
  push:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/services/agent-zero/**'
      - 'pmoves/services/archon/**'
      - 'pmoves/services/pmoves-yt/**'
      - 'pmoves/services/deepresearch/**'
      - 'pmoves/services/supaserch/**'
      - 'pmoves/images/firefly-iii/**'
      - 'pmoves/images/jellyfin/**'
      - 'PMOVES-Open-Notebook'
      - 'PMOVES-Agent-Zero'
      - 'PMOVES-Archon'
      - 'PMOVES.YT'
      - 'PMOVES-Jellyfin'
      - 'PMOVES-Supaserch'
      # Priority 1: production services
      - 'PMOVES-HiRAG'
      - 'PMOVES-BoTZ'
      - 'PMOVES-tensorzero'
      - 'PMOVES-Neo4j'
      - 'Pmoves-cipher'
      # Priority 2: agent infrastructure
      - 'PMOVES-E2B-Danger-Room'
      - 'PMOVES-Pipecat'
      - 'PMOVES-ClawZ'
      # Priority 3: media/content
      - 'PMOVES-transcribe-and-fetch'
      - 'PMOVES-autoresearch'
      - '.github/workflows/integrations-ghcr.yml'
      - '.github/workflows/integrations-ghcr.matrix.json'
      - '.github/trivy/**'
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/services/agent-zero/**'
      - 'pmoves/services/archon/**'
      - 'pmoves/services/pmoves-yt/**'
      - 'pmoves/services/deepresearch/**'
      - 'pmoves/services/supaserch/**'
      - 'pmoves/images/firefly-iii/**'
      - 'pmoves/images/jellyfin/**'
      - 'PMOVES-Open-Notebook'
      - 'PMOVES-Agent-Zero'
      - 'PMOVES-Archon'
      - 'PMOVES.YT'
      - 'PMOVES-Jellyfin'
      - 'PMOVES-Supaserch'
      # Priority 1: production services
      - 'PMOVES-HiRAG'
      - 'PMOVES-BoTZ'
      - 'PMOVES-tensorzero'
      - 'PMOVES-Neo4j'
      - 'Pmoves-cipher'
      # Priority 2: agent infrastructure
      - 'PMOVES-E2B-Danger-Room'
      - 'PMOVES-Pipecat'
      - 'PMOVES-ClawZ'
      # Priority 3: media/content
      - 'PMOVES-transcribe-and-fetch'
      - 'PMOVES-autoresearch'
      - '.github/workflows/integrations-ghcr.yml'
      - '.github/workflows/integrations-ghcr.matrix.json'
      - '.github/trivy/**'
  # schedule:
  #   - cron: '17 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep manual reruns intact, but cancel stale push/PR runs on the same ref.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  REGISTRY: ghcr.io
  # Prefer PAT when supplied (package ownership/ACL edge cases), fallback to workflow token.
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || '' }}
  GHCR_PAT: ${{ secrets.GHCR_TOKEN || secrets.GH_PAT_PUBLISH || '' }}
  GH_APP_ID: ${{ secrets.GH_APP_ID || '' }}
  GH_APP_SEC: ${{ secrets.GH_APP_SEC || '' }}
  # Used for cloning other integration repos (private repos require a PAT with repo read).
  # If unset, clones fall back to unauthenticated https (works for public repos only).
  CI_GIT_CLONE_TOKEN: ${{ secrets.CI_GIT_CLONE_TOKEN || secrets.GH_PAT_PUBLISH || '' }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.CI_DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PAT || secrets.CI_DOCKERHUB_TOKEN }}

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      names: ${{ steps.resolve.outputs.names }}
    steps:
      - name: Checkout (matrix config)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Resolve integration matrix
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INTEGRATION: ${{ github.event.inputs.integration || 'all' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import uuid

          matrix_path = pathlib.Path(".github/workflows/integrations-ghcr.matrix.json")
          entries = json.loads(matrix_path.read_text(encoding="utf-8"))
          event_name = os.environ.get("EVENT_NAME", "")
          target = os.environ.get("INTEGRATION", "all")

          names = [entry["name"] for entry in entries]
          if event_name == "workflow_dispatch" and target != "all":
              if target not in names:
                  print(f"::error::Unsupported integration target: {target}", file=sys.stderr)
                  sys.exit(1)
              names = [target]

          payload = json.dumps(names, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"names={payload}\n")

          print(f"Resolved {len(names)} integration lane(s) (target={target})")
          PY

  build-validate-pr:
    name: Validate ${{ matrix.name }} (PR)
    needs: resolve-matrix
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        name: ${{ fromJSON(needs.resolve-matrix.outputs.names) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df
        with:
          egress-policy: audit

      - name: Checkout (stub)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Load integration config
        id: cfg
        run: |
          set -euo pipefail
          pybin="$(command -v python3 || command -v python || true)"
          if [ -z "$pybin" ]; then
            echo "::error::python3/python is required on runner for matrix config resolution."
            exit 1
          fi
          "$pybin" - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import uuid

          name = os.environ["MATRIX_NAME"]
          matrix_path = pathlib.Path(".github/workflows/integrations-ghcr.matrix.json")
          entries = json.loads(matrix_path.read_text(encoding="utf-8"))
          match = next((entry for entry in entries if entry.get("name") == name), None)
          if not match:
              print(f"::error::No config found for integration '{name}'", file=sys.stderr)
              sys.exit(1)

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as fh:
              for key, value in match.items():
                  if value is None:
                      value = ""
                  if isinstance(value, bool):
                      fh.write(f"{key}={'true' if value else 'false'}\n")
                  else:
                      text = str(value)
                      if "\n" in text:
                          delim = f"EOF_{key}_{uuid.uuid4().hex}"
                          fh.write(f"{key}<<{delim}\n{text}\n{delim}\n")
                      else:
                          fh.write(f"{key}={text}\n")
          PY
        env:
          MATRIX_NAME: ${{ matrix.name }}

      - name: Prepare integration source
        run: |
          set -euo pipefail
          cfg_url='${{ steps.cfg.outputs.git_url }}'
          cfg_ref='${{ steps.cfg.outputs.ref }}'
          case "$cfg_url" in
            https://github.com/*) ;;
            *)
              echo "::error::Unsupported git_url '$cfg_url' (only https://github.com/* is allowed)."
              exit 1
              ;;
          esac
          if ! printf '%s' "$cfg_ref" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Unsupported git ref '$cfg_ref'."
            exit 1
          fi

          if [ "$cfg_url" = "https://github.com/POWERFULMOVES/PMOVES.AI.git" ]; then
            echo "Using checked-out PMOVES.AI workspace as integration source"
            # Init pmoves/integrations/* submodules so build contexts under those
            # paths get materialized. `git archive HEAD` (the prior approach)
            # only includes gitlink mode 160000 entries — submodule contents
            # would be missing. Use `git ls-files --recurse-submodules` instead.
            if [ -f .gitmodules ]; then
              git config --file .gitmodules --get-regexp '^submodule\..+\.path$' \
                | awk '{print $2}' \
                | grep '^pmoves/integrations/' \
                | while IFS= read -r submod_path; do
                    echo "→ Initializing submodule ${submod_path}"
                    git submodule update --init --depth=1 "${submod_path}" 2>&1 \
                      || echo "  (init failed — continuing without submodule content)"
                  done
            fi
            rm -rf integration-src
            mkdir -p integration-src
            git ls-files --recurse-submodules -z | tar --null -T - -cf - | tar -xf - -C integration-src
          else
            git clone --depth=1 --branch "$cfg_ref" "$cfg_url" integration-src
          fi

      - name: Free disk space (runner)
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build (PR validation, no push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: integration-src/${{ steps.cfg.outputs.context }}
          file: integration-src/${{ steps.cfg.outputs.dockerfile }}
          push: false
          pull: true
          build-args: |
            PIP_CONSTRAINT=requirements.lock
            ${{ steps.cfg.outputs.build_args }}
          platforms: linux/amd64

  cleanup-self-hosted-runners:
    name: Cleanup ${{ matrix.runner_label }} runner disk
    needs: resolve-matrix
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: [self-hosted, Linux, X64, "${{ matrix.runner_label }}"]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both VPS runners (pmoves-kvm4-1-runner, pmoves-kvm4-2-runner) carry the
        # `kvm4` label; there is NO runner labelled `kvm2`. A `kvm2` matrix leg can
        # never be scheduled, and because build-publish `needs` this job, that
        # orphaned leg deadlocks the entire publish (GHCR run 27020807888 hung
        # queued on "Cleanup kvm2 runner disk", 2026-06-05).
        runner_label: [kvm4]
    steps:
      - name: Free disk before image matrix
        shell: bash
        run: |
          set -euxo pipefail
          echo "Disk before cleanup:"
          df -h
          docker system df || true

          # The publish matrix can leave recent BuildKit cache behind on shared
          # self-hosted nodes. Clear all unused Docker state before the next
          # image wave so heavy arm64 lanes do not inherit a nearly-full root.
          docker system prune -af --volumes || true
          docker builder prune -af || true

          # Work directories differ by node (for example kvm4-1/kvm4-2).
          # Keep the current checkout area, but remove stale sibling workspaces.
          for workdir in "${GITHUB_WORKSPACE}/.." /opt/actions-runner*/_work; do
            [ -d "$workdir" ] || continue
            find "$workdir" -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} \; || true
          done

          for diagdir in /opt/actions-runner*/_diag/pages; do
            [ -d "$diagdir" ] || continue
            find "$diagdir" -type f -mtime +1 -delete || true
          done

          # Syft/stereoscope SBOM image extractions + anchore sbom-action scratch can
          # be 20G+ each and live under /tmp — the docker prune above does NOT reclaim
          # them. Orphaned when a job is cancelled mid-scan, they were the ACTUAL cause
          # of the 2026-06-05 KVM4-1 disk-full incident (126G across ten /tmp/stereoscope-*
          # dirs). Sweep entries older than a day; active scans are minutes old and untouched.
          for pat in 'stereoscope-*' 'sbom-action-*' 'codeql-packaging*' 'codeql.*'; do
            find /tmp -maxdepth 1 -name "$pat" -mtime +0 -exec rm -rf {} + 2>/dev/null || true
          done

          echo "Disk after cleanup:"
          df -h
          docker system df || true

  build-publish:
    name: Build ${{ matrix.name }}
    needs: [resolve-matrix, cleanup-self-hosted-runners]
    if: ${{ github.event_name != 'pull_request' }}
    # Distribute across all available self-hosted Linux runners for parallel builds.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      # The multi-arch publish lanes share Docker roots on self-hosted runners.
      # Serialize them to keep heavyweight arm64 builds from compounding disk use.
      max-parallel: 1
      matrix:
        name: ${{ fromJSON(needs.resolve-matrix.outputs.names) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443

      - name: Free build-host /tmp scratch
        shell: bash
        run: |
          set -euxo pipefail
          # cleanup-self-hosted-runners is pinned to a kvm4 node, but build-publish
          # runs on ANY [self-hosted, Linux, X64] runner — which may be a different
          # host whose /tmp SBOM scratch was never swept (Codex P1 on PR #1717).
          # Runs FIRST (after Harden Runner, before checkout/config): if this host is
          # already out of root from stale /tmp/stereoscope-* (the 2026-06-05 incident:
          # 126G on KVM4-1), checkout and $GITHUB_OUTPUT writes would fail before any
          # later cleanup could recover. This step needs no repo contents, so it leads.
          # Mirrors the sweep in cleanup-self-hosted-runners; active scans (minutes
          # old) are untouched by the -mtime +0 (>~24h) age gate.
          echo "Build-host disk before /tmp sweep:"; df -h /tmp 2>/dev/null || df -h
          for pat in 'stereoscope-*' 'sbom-action-*' 'codeql-packaging*' 'codeql.*'; do
            find /tmp -maxdepth 1 -name "$pat" -mtime +0 -exec rm -rf {} + 2>/dev/null || true
          done
          echo "Build-host disk after /tmp sweep:"; df -h /tmp 2>/dev/null || df -h

      - name: Checkout (stub)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Load integration config
        id: cfg
        run: |
          set -euo pipefail
          pybin="$(command -v python3 || command -v python || true)"
          if [ -z "$pybin" ]; then
            echo "::error::python3/python is required on runner for matrix config resolution."
            exit 1
          fi
          "$pybin" - <<'PY'
          import json
          import os
          import pathlib
          import sys

          name = os.environ["MATRIX_NAME"]
          matrix_path = pathlib.Path(".github/workflows/integrations-ghcr.matrix.json")
          entries = json.loads(matrix_path.read_text(encoding="utf-8"))
          match = next((entry for entry in entries if entry.get("name") == name), None)
          if not match:
              print(f"::error::No config found for integration '{name}'", file=sys.stderr)
              sys.exit(1)

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as fh:
              for key, value in match.items():
                  if value is None:
                      value = ""
                  if isinstance(value, bool):
                      fh.write(f"{key}={'true' if value else 'false'}\n")
                  else:
                      text = str(value)
                      if "\n" in text:
                          delim = f"EOF_{key}_{uuid.uuid4().hex}"
                          fh.write(f"{key}<<{delim}\n{text}\n{delim}\n")
                      else:
                          fh.write(f"{key}={text}\n")
          PY
        env:
          MATRIX_NAME: ${{ matrix.name }}

      - name: Validate secrets presence
        id: secrets_check
        run: |
          set -euo pipefail
          missing=()
          has_value() { [ -n "$(printenv "$1" || true)" ]; }

          echo "::group::Auth secret audit"
          if has_value GHCR_USERNAME && has_value GHCR_PAT; then
            echo "✅ GHCR PAT auth available (GHCR_USERNAME + GHCR_TOKEN/GH_PAT_PUBLISH)"
          else
            echo "⚠️ GHCR PAT auth unavailable — will fallback to App token or workflow token"
            [ -z "$(printenv GHCR_USERNAME || true)" ] && missing+=("GHCR_USERNAME")
            [ -z "$(printenv GHCR_PAT || true)" ]      && missing+=("GHCR_TOKEN/GH_PAT_PUBLISH")
          fi

          if has_value GH_APP_ID && has_value GH_APP_SEC; then
            echo "✅ GitHub App token generation available"
          else
            echo "⚠️ GitHub App token unavailable"
            [ -z "$(printenv GH_APP_ID || true)" ]  && missing+=("GH_APP_ID")
            [ -z "$(printenv GH_APP_SEC || true)" ] && missing+=("GH_APP_SEC")
          fi
          echo "::endgroup::"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Missing secrets: ${missing[*]} — GHCR push may fail if no valid auth method remains"
          fi
        env:
          GHCR_USERNAME: ${{ env.GHCR_USERNAME }}
          GHCR_PAT: ${{ env.GHCR_PAT }}
          GH_APP_ID: ${{ env.GH_APP_ID }}
          GH_APP_SEC: ${{ env.GH_APP_SEC }}

      - name: Generate GitHub App token (for clone + GHCR)
        id: app_token
        if: ${{ env.GH_APP_ID != '' && env.GH_APP_SEC != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_SEC }}
          # Explicit token scopes required for clone + GHCR push
          permission-contents: read
          permission-packages: write

      - name: Prepare integration source
        run: |
          set -euo pipefail
          cfg_url='${{ steps.cfg.outputs.git_url }}'
          cfg_ref='${{ steps.cfg.outputs.ref }}'
          case "$cfg_url" in
            https://github.com/*) ;;
            *)
              echo "::error::Unsupported git_url '$cfg_url' (only https://github.com/* is allowed)."
              exit 1
              ;;
          esac
          if ! printf '%s' "$cfg_ref" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Unsupported git ref '$cfg_ref'."
            exit 1
          fi

          if [ "$cfg_url" = "https://github.com/POWERFULMOVES/PMOVES.AI.git" ]; then
            echo "Using checked-out PMOVES.AI workspace as integration source"
            # Init pmoves/integrations/* submodules so build contexts under those
            # paths get materialized. `git archive HEAD` (the prior approach)
            # only includes gitlink mode 160000 entries — submodule contents
            # would be missing. Use `git ls-files --recurse-submodules` instead.
            if [ -f .gitmodules ]; then
              git config --file .gitmodules --get-regexp '^submodule\..+\.path$' \
                | awk '{print $2}' \
                | grep '^pmoves/integrations/' \
                | while IFS= read -r submod_path; do
                    echo "→ Initializing submodule ${submod_path}"
                    git submodule update --init --depth=1 "${submod_path}" 2>&1 \
                      || echo "  (init failed — continuing without submodule content)"
                  done
            fi
            rm -rf integration-src
            mkdir -p integration-src
            git ls-files --recurse-submodules -z | tar --null -T - -cf - | tar -xf - -C integration-src
          else
            url="$cfg_url"
            # Prefer App token over PAT for clone authentication
            clone_token="${APP_TOKEN:-${CI_GIT_CLONE_TOKEN:-}}"
            if [ -n "${clone_token}" ]; then
              trimmed="${url#https://github.com/}"
              url="https://x-access-token:${clone_token}@github.com/${trimmed}"
            fi
            if ! git clone --depth=1 --branch "$cfg_ref" "$url" integration-src; then
              echo "::error::Failed to clone ${cfg_url} (ref=${cfg_ref}). If this is a private integration repo, ensure GH_APP_ID/GH_APP_SEC secrets are set, or set CI_GIT_CLONE_TOKEN (PAT with repo read)."
              exit 1
            fi
          fi
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Free disk space (runner)
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          docker system df || true
          docker system prune -af --volumes || true
          docker builder prune -af || true
          docker system df || true
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      # Auth precedence: PAT > App > workflow token.
      # PAT is preferred because the GitHub App installation lacks org-level
      # `write:packages` (verified 2026-05-24 — App login succeeds but blob
      # PUT returns 403 "installation not allowed to Write organization
      # package"). Since docker/login-action only validates auth-server
      # acceptance and not push permission, App login was preempting PAT
      # fallback in the previous order. Swapping the order ensures the
      # org-scoped PAT (when configured) is tried first.
      - name: Log in to GHCR (PAT preferred)
        id: login_ghcr_pat
        if: ${{ env.GHCR_USERNAME != '' && env.GHCR_PAT != '' }}
        continue-on-error: true
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PAT }}

      - name: Log in to GHCR (App token fallback)
        id: login_ghcr_app
        if: ${{ steps.login_ghcr_pat.outcome != 'success' && steps.app_token.outputs.token != '' }}
        continue-on-error: true
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: x-access-token
          password: ${{ steps.app_token.outputs.token }}

      - name: Log in to GHCR (workflow token fallback)
        id: login_ghcr_actions
        if: ${{ steps.login_ghcr_pat.outcome != 'success' && steps.login_ghcr_app.outcome != 'success' }}
        continue-on-error: true
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Require GHCR authentication
        if: ${{ steps.login_ghcr_pat.outcome != 'success' && steps.login_ghcr_app.outcome != 'success' && steps.login_ghcr_actions.outcome != 'success' }}
        run: |
          echo "::error::Unable to authenticate to GHCR. Check GHCR_USERNAME/GHCR_TOKEN, GH_APP_ID/GH_APP_SEC, or the default workflow token."
          exit 1

      - name: Optional login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME && env.DOCKERHUB_PASSWORD }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Compute tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ secrets.CI_DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_NAMESPACE }}
          INCLUDE_DOCKERHUB: ${{ env.DOCKERHUB_USERNAME && env.DOCKERHUB_PASSWORD }}
          USE_GHCR: ${{ steps.login_ghcr_app.outcome == 'success' || steps.login_ghcr_pat.outcome == 'success' || steps.login_ghcr_actions.outcome == 'success' }}
        run: |
          set -euo pipefail
          # Compute lowercased namespace for cache refs (needed by all event types)
          OWNER_LC="${{ github.repository_owner }}"
          OWNER_LC="${OWNER_LC,,}"
          echo "ghcr_ns=${OWNER_LC}" >> $GITHUB_OUTPUT

          DATE_TAG=$(date +%Y%m%d)
          SHA_SHORT=${GITHUB_SHA::7}
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          GHCR_NS_RAW="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ghcr_namespace || '' }}"
          if [ -z "$GHCR_NS_RAW" ]; then GHCR_NS_RAW="${{ secrets.CI_GHCR_NAMESPACE }}"; fi
          if [ -z "$GHCR_NS_RAW" ]; then GHCR_NS_RAW="${{ secrets.GHCR_NAMESPACE }}"; fi
          if [ -z "$GHCR_NS_RAW" ]; then GHCR_NS_RAW="${{ github.repository_owner }}"; fi
          # Docker tag validation requires the repository namespace be lowercase.
          GHCR_NS="${GHCR_NS_RAW,,}"
          echo "ghcr_ns=${GHCR_NS}" >> $GITHUB_OUTPUT
          echo "use_ghcr=${USE_GHCR}" >> $GITHUB_OUTPUT

          TAGS=""
          PRIMARY_TAG=""

          # Only add GHCR tags if login succeeded.
          if [ "$USE_GHCR" = "true" ]; then
            GHCR_LATEST="${{ env.REGISTRY }}/$GHCR_NS/${{ steps.cfg.outputs.image_name }}:pmoves-latest"
            GHCR_SHA="${{ env.REGISTRY }}/$GHCR_NS/${{ steps.cfg.outputs.image_name }}:${DATE_TAG}-${SHA_SHORT}"
            TAGS="${GHCR_LATEST}\n${GHCR_SHA}"
            PRIMARY_TAG="${GHCR_LATEST}"
          fi

          if [ "$INCLUDE_DOCKERHUB" = "true" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            DH_NS=${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}
            DH_LATEST="docker.io/$DH_NS/${{ steps.cfg.outputs.image_name }}:pmoves-latest"
            DH_SHA="docker.io/$DH_NS/${{ steps.cfg.outputs.image_name }}:${DATE_TAG}-${SHA_SHORT}"
            if [ -n "$TAGS" ]; then
              TAGS="$TAGS\n${DH_LATEST}\n${DH_SHA}"
            else
              TAGS="${DH_LATEST}\n${DH_SHA}"
              PRIMARY_TAG="${DH_LATEST}"
            fi
          fi

          if [ -z "$PRIMARY_TAG" ]; then
            echo "::warning::No tags generated; GHCR login failed and Docker Hub credentials are absent. Build/push, scan, and sign steps will be skipped."
            echo "has_tags=false" >> $GITHUB_OUTPUT
          else
            echo "has_tags=true" >> $GITHUB_OUTPUT
            echo "primary_tag=${PRIMARY_TAG}" >> $GITHUB_OUTPUT
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push (multi-arch)
        if: ${{ steps.meta.outputs.has_tags == 'true' }}
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: integration-src/${{ steps.cfg.outputs.context }}
          file: integration-src/${{ steps.cfg.outputs.dockerfile }}
          push: true
          pull: true
          build-args: |
            PIP_CONSTRAINT=requirements.lock
            ${{ steps.cfg.outputs.build_args }}
          platforms: ${{ steps.cfg.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.ghcr_ns }}/${{ steps.cfg.outputs.image_name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.ghcr_ns }}/${{ steps.cfg.outputs.image_name }}:buildcache,mode=max

      - name: Attest build provenance (SLSA L3)
        if: steps.build.outputs.digest != '' && steps.meta.outputs.has_tags == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.meta.outputs.ghcr_ns }}/${{ steps.cfg.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Cosign sign GHCR digest (keyless)
        if: ${{ steps.meta.outputs.has_tags == 'true' && steps.meta.outputs.use_ghcr == 'true' }}
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.meta.outputs.ghcr_ns }}/${{ steps.cfg.outputs.image_name }}@${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_DIGEST_REF"

      - name: Install Syft (SBOM)
        if: ${{ steps.cfg.outputs.generate_sbom == 'true' && steps.meta.outputs.has_tags == 'true' }}
        env:
          SYFT_VERSION: v1.45.0
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/syft-bin"
          mkdir -p "$install_dir"
          curl -sSfL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" -o "${RUNNER_TEMP}/syft.tar.gz"
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "$install_dir" syft
          sudo install -m 0755 "${install_dir}/syft" /usr/local/bin/syft
          syft version

      - name: Free disk space before SBOM
        if: ${{ steps.cfg.outputs.generate_sbom == 'true' && steps.meta.outputs.has_tags == 'true' }}
        run: |
          set -euxo pipefail
          docker system df || true
          docker builder prune -af || true
          docker image prune -f || true
          docker container prune -f || true
          rm -rf "${RUNNER_TEMP:-/tmp}/syft-cache"
          df -h

      - name: Generate SBOMs (CycloneDX)
        id: sbom
        if: ${{ steps.cfg.outputs.generate_sbom == 'true' && steps.meta.outputs.has_tags == 'true' }}
        env:
          SYFT_REGISTRY_AUTH_AUTHORITY: ghcr.io
          SYFT_CACHE_DIR: ${{ runner.temp }}/syft-cache
          PAT_AUTH_OK: ${{ steps.login_ghcr_pat.outcome == 'success' }}
          APP_AUTH_OK: ${{ steps.login_ghcr_app.outcome == 'success' }}
          GHCR_USERNAME: ${{ env.GHCR_USERNAME }}
          GHCR_PAT: ${{ env.GHCR_PAT }}
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          ACTIONS_ACTOR: ${{ github.actor }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${PAT_AUTH_OK}" = "true" ]; then
            export SYFT_REGISTRY_AUTH_USERNAME="${GHCR_USERNAME}"
            export SYFT_REGISTRY_AUTH_PASSWORD="${GHCR_PAT}"
          elif [ "${APP_AUTH_OK}" = "true" ]; then
            export SYFT_REGISTRY_AUTH_USERNAME="x-access-token"
            export SYFT_REGISTRY_AUTH_PASSWORD="${APP_TOKEN}"
          else
            export SYFT_REGISTRY_AUTH_USERNAME="${ACTIONS_ACTOR}"
            export SYFT_REGISTRY_AUTH_PASSWORD="${ACTIONS_TOKEN}"
          fi

          rm -rf "$SYFT_CACHE_DIR"
          mkdir -p "$SYFT_CACHE_DIR"
          syft scan --from registry "${{ steps.meta.outputs.primary_tag }}" -o cyclonedx-json > sbom.cdx.json &
          syft_pid=$!
          while kill -0 "$syft_pid" 2>/dev/null; do
            echo "Syft SBOM generation still running for ${{ matrix.name }}..."
            sleep 60
          done
          wait "$syft_pid"
          echo "sbom_path=sbom.cdx.json" >> $GITHUB_OUTPUT

      - name: Upload SBOM artifact
        if: ${{ steps.cfg.outputs.generate_sbom == 'true' && steps.meta.outputs.has_tags == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.name }}-sbom
          path: ${{ steps.sbom.outputs.sbom_path }}

      - name: Free disk space before Trivy
        run: |
          set -euxo pipefail
          echo "Disk BEFORE reclaim:"; df -h / || true
          docker system df || true
          # Trivy must download its ~95MB vuln DB into .cache/trivy and pull the
          # image; on the chronically-tight kvm4 runners that write fails with
          # "no space left on device" (GHCR run 27042677318). The image is RE-PULLED
          # in the next step, so a full prune here is safe — reclaim aggressively.
          docker builder prune -af || true
          docker image prune -af || true        # all unused (image re-pulled next step)
          docker container prune -f || true
          # NOTE: deliberately NOT 'docker volume prune' — these self-hosted runners
          # may co-host fleet data-store volumes (neo4j/supabase-db/etc.); pruning
          # volumes could destroy a temporarily-stopped service's data. Image-layer
          # reclaim above frees GBs; the Trivy DB needs only ~95MB.
          # Stale Trivy DB cache can be corrupt/partial after a prior no-space abort;
          # drop it so the next download starts clean (path per trivy-action cache-dir).
          rm -rf "${GITHUB_WORKSPACE}/.cache/trivy/db" "${GITHUB_WORKSPACE}/.cache/trivy/fanal" 2>/dev/null || true
          # Sweep the SBOM/scan scratch that the docker prune does NOT reclaim
          # (same class as the build-host sweep in #1719) — frees the root volume.
          for pat in 'stereoscope-*' 'sbom-action-*' 'trivy-*' 'codeql-packaging*' 'codeql.*'; do
            find /tmp -maxdepth 1 -name "$pat" -mtime +0 -exec rm -rf {} + 2>/dev/null || true
          done
          echo "Disk AFTER reclaim:"; df -h / || true

      - name: Pull image for Trivy (private GHCR)
        if: ${{ steps.meta.outputs.has_tags == 'true' }}
        run: |
          set -euo pipefail
          docker pull "${{ steps.meta.outputs.primary_tag }}"

      - name: Trivy vulnerability scan (HIGH/CRITICAL)
        if: ${{ steps.meta.outputs.has_tags == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          # Gate on HIGH/CRITICAL with fixes available (vendor/unfixed CVEs are still surfaced by the next step).
          # This avoids blocking nightly builds on upstream issues we can't remediate immediately, while keeping
          # fixable regressions as hard failures.
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: table
          trivyignores: ${{ steps.cfg.outputs.trivy_ignorefile }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'
          timeout: '10m0s'

      - name: Trivy vulnerability scan report (includes unfixed)
        if: ${{ steps.meta.outputs.has_tags == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: table
          output: trivy-${{ matrix.name }}.txt
          # Always include full findings (even if the gate uses trivyignore to unblock a build).
          trivyignores: ''
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'
          timeout: '10m0s'

      - name: Upload Trivy report artifact
        if: ${{ steps.meta.outputs.has_tags == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.name }}-trivy
          path: trivy-${{ matrix.name }}.txt

      - name: Clean up pulled image and dangling layers
        if: ${{ steps.meta.outputs.has_tags == 'true' && always() }}
        run: |
          set -euxo pipefail
          # Remove the image we pulled for Trivy to prevent accumulation on self-hosted runners
          docker rmi "${{ steps.meta.outputs.primary_tag }}" || true
          # Aggressive prune: prevent failed heavy builds from leaving the
          # shared self-hosted Docker root near capacity for the next lane.
          docker image prune -a -f || true
          docker builder prune -af || true
          # Clean old runner work directories (>7 days) to prevent checkout artifact bloat
          for workdir in "${GITHUB_WORKSPACE}/.." /opt/actions-runner*/_work; do
            [ -d "$workdir" ] || continue
            find "$workdir" -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \; || true
          done
          df -h

      - name: Cosign verify GHCR digest (keyless)
        if: ${{ steps.meta.outputs.has_tags == 'true' && steps.meta.outputs.use_ghcr == 'true' }}
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.meta.outputs.ghcr_ns }}/${{ steps.cfg.outputs.image_name }}@${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          cosign verify --certificate-oidc-issuer "$issuer" --certificate-identity "$identity" "$IMAGE_DIGEST_REF"
