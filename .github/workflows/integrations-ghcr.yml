name: Build and publish integration images to GHCR

on:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Integration to build (all runs the full matrix)'
        required: true
        default: all
        type: choice
        options:
          - all
          - agent-zero
          - archon
          - archon-ui
          - open-notebook
          - wger
          - firefly-iii
          - jellyfin
          - pmoves-yt
          - deepresearch
          - supaserch
      push_to_dockerhub:
        description: 'Set to true to push to Docker Hub when secrets are present'
        required: true
        default: false
        type: boolean
  push:
    branches: [main, PMOVES.AI-Edition-Hardened]
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'PMOVES-Open-Notebook'
      - 'PMOVES-Agent-Zero'
      - 'PMOVES-Archon'
      - 'PMOVES.YT'
      - 'PMOVES-Jellyfin'
      - 'PMOVES-Supaserch'
      - '.github/workflows/integrations-ghcr.yml'
  # schedule:
  #   - cron: '17 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  # Prefer workflow token first; optional PAT fallback uses GHCR_USERNAME + GHCR_PAT.
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || '' }}
  GHCR_PAT: ${{ secrets.GHCR_TOKEN || secrets.GH_PAT_PUBLISH || '' }}
  # Used for cloning other integration repos (private repos require a PAT with repo read).
  # If unset, clones fall back to unauthenticated https (works for public repos only).
  CI_GIT_CLONE_TOKEN: ${{ secrets.CI_GIT_CLONE_TOKEN || secrets.GH_PAT_PUBLISH || '' }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || secrets.CI_DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PAT || secrets.CI_DOCKERHUB_TOKEN }}

jobs:
  build-publish:
    name: Build ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-zero
            git_url: https://github.com/POWERFULMOVES/PMOVES.AI.git
            ref: main
            context: pmoves
            dockerfile: pmoves/services/agent-zero/Dockerfile.multiarch
            image_name: pmoves-agent-zero
            build_args: ''
            platforms: linux/amd64,linux/arm64
            generate_sbom: true
            trivy_ignorefile: .github/trivy/agent-zero.trivyignore
          - name: archon
            git_url: https://github.com/POWERFULMOVES/PMOVES.AI.git
            ref: main
            context: pmoves
            dockerfile: pmoves/services/archon/Dockerfile
            image_name: pmoves-archon
            build_args: ''
            platforms: linux/amd64,linux/arm64
            generate_sbom: false
            trivy_ignorefile: ''
          - name: archon-ui
            git_url: https://github.com/POWERFULMOVES/PMOVES-Archon.git
            ref: PMOVES.AI-Edition-Hardened
            context: archon-ui-main
            dockerfile: archon-ui-main/Dockerfile
            image_name: pmoves-archon-ui
            build_args: ''
            platforms: linux/amd64,linux/arm64
            generate_sbom: true
            trivy_ignorefile: .github/trivy/archon-ui.trivyignore
          - name: open-notebook
            git_url: https://github.com/POWERFULMOVES/PMOVES-Open-Notebook.git
            ref: PMOVES.AI-Edition-Hardened
            context: .
            dockerfile: Dockerfile
            image_name: pmoves-open-notebook
            build_args: ''
            platforms: linux/amd64,linux/arm64
            generate_sbom: true
            trivy_ignorefile: .github/trivy/open-notebook.trivyignore
          - name: wger
            git_url: https://github.com/POWERFULMOVES/Pmoves-Health-wger.git
            ref: PMOVES.AI-Edition-Hardened
            context: .
            dockerfile: extras/docker/production/Dockerfile
            image_name: pmoves-health-wger
            build_args: ''
            platforms: linux/amd64,linux/arm64
            generate_sbom: true
            trivy_ignorefile: ''
          - name: firefly-iii
            git_url: https://github.com/POWERFULMOVES/PMOVES.AI.git
            ref: main
            context: pmoves/images/firefly-iii
            dockerfile: pmoves/images/firefly-iii/Dockerfile
            image_name: pmoves-firefly-iii
            build_args: ''
            platforms: linux/amd64,linux/arm64
            generate_sbom: true
            trivy_ignorefile: ''
          - name: jellyfin
            git_url: https://github.com/POWERFULMOVES/PMOVES.AI.git
            ref: main
            context: pmoves/images/jellyfin
            dockerfile: pmoves/images/jellyfin/Dockerfile
            image_name: pmoves-jellyfin
            build_args: ''
            platforms: linux/amd64,linux/arm64
            generate_sbom: true
            trivy_ignorefile: .github/trivy/jellyfin.trivyignore
          - name: pmoves-yt
            git_url: https://github.com/POWERFULMOVES/PMOVES.AI.git
            ref: main
            context: pmoves/services/pmoves-yt
            dockerfile: pmoves/services/pmoves-yt/Dockerfile
            image_name: pmoves-yt
            build_args: ''
            platforms: linux/amd64,linux/arm64
            generate_sbom: true
            trivy_ignorefile: ''
          - name: deepresearch
            git_url: https://github.com/POWERFULMOVES/PMOVES.AI.git
            ref: main
            context: pmoves
            dockerfile: pmoves/services/deepresearch/Dockerfile
            image_name: pmoves-deepresearch
            build_args: ''
            platforms: linux/amd64
            generate_sbom: false
            trivy_ignorefile: ''
          - name: supaserch
            git_url: https://github.com/POWERFULMOVES/PMOVES.AI.git
            ref: main
            context: pmoves/services
            dockerfile: pmoves/services/supaserch/Dockerfile
            image_name: pmoves-supaserch
            build_args: ''
            platforms: linux/amd64,linux/arm64
            generate_sbom: true
            trivy_ignorefile: ''

    steps:
      - name: Select integration lane
        id: select
        run: |
          set -euo pipefail
          target="${{ github.event.inputs.integration || 'all' }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "$target" = "all" ] || [ "$target" = "${{ matrix.name }}" ]; then
            echo "run_selected=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Running matrix lane '${{ matrix.name }}' (target=$target)"
          else
            echo "run_selected=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping matrix lane '${{ matrix.name }}' (target=$target)"
          fi

      - name: Harden Runner
        if: &run_selected ${{ steps.select.outputs.run_selected == 'true' }}
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443

      - name: Checkout (stub)
        if: *run_selected
        uses: actions/checkout@v4

      - name: Prepare integration source
        if: *run_selected
        run: |
          set -euo pipefail
          if [ "${{ matrix.git_url }}" = "https://github.com/POWERFULMOVES/PMOVES.AI.git" ]; then
            echo "Using checked-out PMOVES.AI workspace as integration source"
            rm -rf integration-src
            mkdir -p integration-src
            git archive --format=tar HEAD | tar -x -C integration-src
          else
            url="${{ matrix.git_url }}"
            if [ -n "${CI_GIT_CLONE_TOKEN:-}" ]; then
              url="${url/https:\/\/github.com\//https:\/\/x-access-token:${CI_GIT_CLONE_TOKEN}@github.com/}"
            fi
            if ! git clone --depth=1 --branch "${{ matrix.ref }}" "$url" integration-src; then
              echo "::error::Failed to clone ${url} (ref=${{ matrix.ref }}). If this is a private integration repo, set secrets.CI_GIT_CLONE_TOKEN (PAT with repo read) or reuse GH_PAT_PUBLISH with repo access."
              exit 1
            fi
          fi

      - name: Free disk space (runner)
        if: *run_selected
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo rm -rf /usr/local/share/boost || true
          df -h

      - name: Set up QEMU
        if: *run_selected
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: *run_selected
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        if: *run_selected
        uses: sigstore/cosign-installer@v4.0.0

      - name: Log in to GHCR (workflow token)
        if: *run_selected
        id: login_ghcr_actions
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to GHCR (PAT fallback)
        id: login_ghcr_pat
        if: ${{ steps.select.outputs.run_selected == 'true' && steps.login_ghcr_actions.outcome != 'success' && env.GHCR_USERNAME != '' && env.GHCR_PAT != '' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_PAT }}

      - name: Require GHCR authentication
        if: ${{ steps.select.outputs.run_selected == 'true' && steps.login_ghcr_actions.outcome != 'success' && steps.login_ghcr_pat.outcome != 'success' }}
        run: |
          echo "::error::Unable to authenticate to GHCR. Ensure repo Actions has packages:write and/or set GHCR_USERNAME + GHCR_TOKEN (or GH_PAT_PUBLISH)."
          exit 1

      - name: Optional login to Docker Hub
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME && env.DOCKERHUB_PASSWORD }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Compute tags
        if: *run_selected
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKERHUB_NAMESPACE: ${{ secrets.CI_DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_NAMESPACE }}
          INCLUDE_DOCKERHUB: ${{ env.DOCKERHUB_USERNAME && env.DOCKERHUB_PASSWORD }}
          USE_GHCR: ${{ steps.login_ghcr_actions.outcome == 'success' || steps.login_ghcr_pat.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "use_ghcr=false" >> $GITHUB_OUTPUT
            echo "has_tags=false" >> $GITHUB_OUTPUT
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "::notice::Pull request build detected; registry publish/sign/scan steps are skipped."
            exit 0
          fi

          DATE_TAG=$(date +%Y%m%d)
          SHA_SHORT=${GITHUB_SHA::7}
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          GHCR_NS_RAW="${{ secrets.CI_GHCR_NAMESPACE }}"
          if [ -z "$GHCR_NS_RAW" ]; then GHCR_NS_RAW="${{ secrets.GHCR_NAMESPACE }}"; fi
          if [ -z "$GHCR_NS_RAW" ]; then GHCR_NS_RAW="${{ github.repository_owner }}"; fi
          # Docker tag validation requires the repository namespace be lowercase.
          GHCR_NS="${GHCR_NS_RAW,,}"
          echo "ghcr_ns=${GHCR_NS}" >> $GITHUB_OUTPUT
          echo "use_ghcr=${USE_GHCR}" >> $GITHUB_OUTPUT

          TAGS=""
          PRIMARY_TAG=""

          # Only add GHCR tags if login succeeded.
          if [ "$USE_GHCR" = "true" ]; then
            GHCR_LATEST="${{ env.REGISTRY }}/$GHCR_NS/${{ matrix.image_name }}:pmoves-latest"
            GHCR_SHA="${{ env.REGISTRY }}/$GHCR_NS/${{ matrix.image_name }}:${DATE_TAG}-${SHA_SHORT}"
            TAGS="${GHCR_LATEST}\n${GHCR_SHA}"
            PRIMARY_TAG="${GHCR_LATEST}"
          fi

          if [ "$INCLUDE_DOCKERHUB" = "true" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            DH_NS=${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}
            DH_LATEST="docker.io/$DH_NS/${{ matrix.image_name }}:pmoves-latest"
            DH_SHA="docker.io/$DH_NS/${{ matrix.image_name }}:${DATE_TAG}-${SHA_SHORT}"
            if [ -n "$TAGS" ]; then
              TAGS="$TAGS\n${DH_LATEST}\n${DH_SHA}"
            else
              TAGS="${DH_LATEST}\n${DH_SHA}"
              PRIMARY_TAG="${DH_LATEST}"
            fi
          fi

          if [ -z "$PRIMARY_TAG" ]; then
            echo "::warning::No tags generated; GHCR login failed and Docker Hub credentials are absent. Build/push, scan, and sign steps will be skipped."
            echo "has_tags=false" >> $GITHUB_OUTPUT
          else
            echo "has_tags=true" >> $GITHUB_OUTPUT
            echo "primary_tag=${PRIMARY_TAG}" >> $GITHUB_OUTPUT
          fi

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # PRs validate Dockerfile/build correctness without publishing artifacts.
      - name: Build (PR validation, no push)
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          context: integration-src/${{ matrix.context }}
          file: integration-src/${{ matrix.dockerfile }}
          push: false
          build-args: |
            PIP_CONSTRAINT=requirements.lock
            ${{ matrix.build_args }}
          platforms: ${{ matrix.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (multi-arch)
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: integration-src/${{ matrix.context }}
          file: integration-src/${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            PIP_CONSTRAINT=requirements.lock
            ${{ matrix.build_args }}
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cosign sign GHCR digest (keyless)
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' && steps.meta.outputs.use_ghcr == 'true' }}
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.meta.outputs.ghcr_ns }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_DIGEST_REF"

      - name: Install Syft (SBOM)
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name != 'pull_request' && matrix.generate_sbom && steps.meta.outputs.has_tags == 'true' }}
        uses: anchore/sbom-action/download-syft@v0.22.2

      - name: Generate SBOMs (CycloneDX)
        id: sbom
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name != 'pull_request' && matrix.generate_sbom && steps.meta.outputs.has_tags == 'true' }}
        run: |
          set -euo pipefail
          syft packages "${{ steps.meta.outputs.primary_tag }}" -o cyclonedx-json > sbom.cdx.json
          echo "sbom_path=sbom.cdx.json" >> $GITHUB_OUTPUT

      - name: Upload SBOM artifact
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name != 'pull_request' && matrix.generate_sbom && steps.meta.outputs.has_tags == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-sbom
          path: ${{ steps.sbom.outputs.sbom_path }}

      - name: Free disk space (docker prune)
        if: *run_selected
        run: |
          set -euxo pipefail
          docker system df || true
          docker buildx prune -af || true
          docker builder prune -af || true
          docker system prune -af --volumes || true
          df -h

      - name: Pull image for Trivy (private GHCR)
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        run: |
          set -euo pipefail
          docker pull "${{ steps.meta.outputs.primary_tag }}"

      - name: Trivy vulnerability scan (HIGH/CRITICAL)
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        uses: aquasecurity/trivy-action@0.34.0
        with:
          # Gate on HIGH/CRITICAL with fixes available (vendor/unfixed CVEs are still surfaced by the next step).
          # This avoids blocking nightly builds on upstream issues we can't remediate immediately, while keeping
          # fixable regressions as hard failures.
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: table
          trivyignores: ${{ matrix.trivy_ignorefile }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'

      - name: Trivy vulnerability scan report (includes unfixed)
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        uses: aquasecurity/trivy-action@0.34.0
        with:
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: table
          output: trivy-${{ matrix.name }}.txt
          # Always include full findings (even if the gate uses trivyignore to unblock a build).
          trivyignores: ''
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln'

      - name: Upload Trivy report artifact
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-trivy
          path: trivy-${{ matrix.name }}.txt

      - name: Cosign verify GHCR digest (keyless)
        if: ${{ steps.select.outputs.run_selected == 'true' && github.event_name != 'pull_request' && steps.meta.outputs.has_tags == 'true' && steps.meta.outputs.use_ghcr == 'true' }}
        env:
          IMAGE_DIGEST_REF: ${{ env.REGISTRY }}/${{ steps.meta.outputs.ghcr_ns }}/${{ matrix.image_name }}@${{ steps.build.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          cosign verify --certificate-oidc-issuer "$issuer" --certificate-identity "$identity" "$IMAGE_DIGEST_REF"
