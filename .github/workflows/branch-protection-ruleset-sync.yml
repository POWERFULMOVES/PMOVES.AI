name: Branch Protection Ruleset Sync

# The ruleset side of branch protection (per the PR #2490 ownership
# split: this workflow owns RULESETS, .github/workflows/branch-
# protection-sync.yml owns CLASSIC). The two writers layer additively
# per GitHub's "About rulesets" docs: "the most restrictive version of
# the rule applies".
#
# This workflow is the ruleset auto-enroller. Three trigger modes:
#
#   1. workflow_dispatch: operator runs `apply --no-dry-run` against
#      the named repo OR against every repo in per_repo_overrides.
#      Use this for the periodic "re-apply on drift" pattern.
#
#   2. schedule (weekly Sun 04:00 UTC): safety net that catches any
#      repo that drifted since the last manual run. Catches the case
#      where the operator added a per_repo_overrides entry on `main`
#      and forgot to dispatch the workflow.
#
#   3. (Future, requires org-level GitHub App) repository.created
#      events for new POWERFULMOVES/* repos. The org-level Apps
#      `repository.created` event is the natural hook for true
#      auto-enroll on fork creation. The org App must have
#      Administration: Read & Write (same grant as branch-protection-
#      sync.yml) for the auto-enroll write to land. Not wired here
#      because GitHub org-level Apps require a separate App config
#      slice. For now: this workflow covers the manual + scheduled
#      modes, and the operator adds a per_repo_overrides entry to
#      enroll a new repo (then dispatches).
#
# Exit codes:
#   0 = every target apply succeeded (or dry-run)
#   1 = spec load / publisher failure
#   non-zero per-target failures are recorded in the step summary

on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly Sun 04:00 UTC (safety net)
  workflow_dispatch:
    inputs:
      repo:
        description: 'Single repo to apply (org/repo); empty = every per_repo_overrides entry'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry-run only — print the would-be API calls, do not write'
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  sync:
    name: branch-protection-ruleset-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # Derive the repo set to apply to. If a single --repo is passed,
      # use that; otherwise apply to every per_repo_overrides entry in
      # the spec. The spec is the source of truth — no hardcoded list.
      #
      # The `repos` step output is the heredoc the App-token step reads
      # for the `repositories` input. Per actions/create-github-app-token
      # docs, an empty `repositories` with `owner` set scopes the token
      # to EVERY accessible repository (privilege escalation + slow) —
      # so the heredoc is load-bearing for the least-privilege goal.
      - name: Resolve apply target set
        id: targets
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          spec = json.loads(Path("pmoves/configs/branch_protection/pmoves_standard.json").read_text(encoding="utf-8"))
          repo = "${{ inputs.repo }}".strip()
          if repo:
              repos = [repo]
          else:
              repos = sorted(spec.get("per_repo_overrides", {}).keys())
          # Write a TSV the apply step reads (one repo per line).
          Path("repos.tsv").write_text("\n".join(repos) + "\n", encoding="utf-8")
          print(f"Applying to {len(repos)} repo(s):")
          for r in repos:
              print(f"  {r}")
          with open("repos_count", "w") as f:
              f.write(str(len(repos)))
          PY
          # Export the resolved repo set as a step output so the App-token
          # step can scope the token. Empty output = "every repo" per the
          # action's contract; the heredoc is the protection.
          {
            echo "repos<<__EOF__"
            sort -u repos.tsv
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # Mint the GitHub App token with the Administration grant
      # (required to PUT rulesets). The token scope is the resolved
      # repo set so the App installation only gets access to the
      # targets it needs. If the App lacks the grant, this step
      # fails with "the app does not have permission to request
      # 'administration'" — the intended live validation.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.repos }}
          permission-administration: write
          permission-contents: read

      # Apply. Default is dry-run. The operator flips dry_run to false
      # via the workflow_dispatch input when ready to write. The
      # per-repo loop is best-effort: failures are collected into the
      # step summary, not raised as a single hard error.
      - name: Apply rulesets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The `inputs` context "contains the inputs of a reusable or manually
          # triggered workflow" -- workflow_dispatch and workflow_call only --
          # and "if you attempt to dereference a nonexistent property, it will
          # evaluate to an empty string" (Actions contexts reference).
          #
          # So on the weekly `schedule` this was "", the guard below
          # (`[ "$DRY_RUN" = "false" ]`) never matched, --no-dry-run was never
          # added, and the tool's dry-run default stood. The header calls the
          # schedule "a safety net that catches any repo that drifted since the
          # last manual run" -- it could not, because it never wrote. Run
          # history bears that out: scheduled runs on 2026-08-23 and 2026-08-30
          # both report success while `merge-decision` stayed declared in
          # pmoves_standard.json and absent from live protection.
          #
          # Made explicit rather than quietly flipped. The schedule stays
          # READ-ONLY -- an unattended weekly job that rewrites branch
          # protection across every per_repo_overrides entry is a different and
          # much larger decision than fixing an accident. What changes is that
          # the posture is now stated, and the summary says which one ran.
          #
          # The decision is made in SHELL, not in an expression. The obvious
          # `github.event_name == 'workflow_dispatch' && inputs.dry_run ||
          # 'true'` is wrong in the one case that matters: the docs say
          # "falsy values (false, 0, -0, \"\", '', null) are coerced to false",
          # so dispatching with dry_run=false makes the left side falsy and the
          # whole expression falls through to 'true' -- leaving the manual
          # apply path permanently read-only, the same defect one trigger over.
          # The idiom's return semantics are not documented either. Two plain
          # string comparisons are.
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          TRIGGER: ${{ github.event_name }}
        run: |
          # `set +e` here is intentional — we want to count failures
          # across repos, not fail the step on the first one. The per-repo
          # apply has its own try/collect.
          #
          # NB on the pipefail-style trap: `python | tee` returns `tee`'s
          # exit code (always 0) by default, so a plain `if pipeline; then`
          # would never increment FAILED. We capture the python exit via
          # `${PIPESTATUS[0]}` so failures are actually counted.
          set +e
          APPLIED=0; SKIPPED=0; FAILED=0
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            echo "--- $repo ---"
            # Tool CLI: `apply --repo REPO [--no-dry-run]`. The dry-run
            # default is true, so we ONLY add --no-dry-run when the input
            # says dry_run=false. Passing the nonexistent --dry-run flag
            # would make arg-parse fail and silently no-op every repo.
            args=("--repo" "$repo")
            if [ "$TRIGGER" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "false" ]; then
              args+=("--no-dry-run")
            fi
            python -m pmoves.tools.branch_protection apply "${args[@]}" 2>&1 | tee -a "apply.${repo//\//_}.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              APPLIED=$((APPLIED+1))
            else
              FAILED=$((FAILED+1))
            fi
          done < repos.tsv

          echo "## Apply summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- applied: $APPLIED" >> "$GITHUB_STEP_SUMMARY"
          echo "- failed: $FAILED" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TRIGGER" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "false" ]; then
            WROTE=yes
          else
            WROTE=no
          fi
          echo "- trigger: $TRIGGER, dry_run input: '${DRY_RUN_INPUT:-<unset>}', wrote: $WROTE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$WROTE" != "yes" ]; then
            echo "- **NOTHING WAS WRITTEN.** This run audited only. To apply, dispatch" >> "$GITHUB_STEP_SUMMARY"
            echo "  this workflow with \`dry_run: false\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- per-repo logs: apply.*.log" >> "$GITHUB_STEP_SUMMARY"

          # The per-repo loop deliberately continues past a failure so one bad
          # repo cannot hide the other twenty-four. But the STEP used to end
          # there, so the job reported success with FAILED>0 — the first run
          # that ever completed (2026-08-20) carried an unhandled KeyError on
          # PMOVES-hermes-agent and still went green. Counting failures and then
          # not acting on the count is not error handling.
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::branch-protection apply failed for $FAILED repo(s) — see apply.*.log"
            exit 1
          fi

      - name: Upload apply logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-protection-apply-${{ github.run_id }}
          path: apply.*.log
          if-no-files-found: ignore
