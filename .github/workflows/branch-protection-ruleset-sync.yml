name: Branch Protection Ruleset Sync

# The ruleset side of branch protection (per the PR #2490 ownership
# split: this workflow owns RULESETS, .github/workflows/branch-
# protection-sync.yml owns CLASSIC). The two writers layer additively
# per GitHub's "About rulesets" docs: "the most restrictive version of
# the rule applies".
#
# This workflow is the ruleset auto-enroller. Three trigger modes:
#
#   1. workflow_dispatch: operator runs `apply --no-dry-run` against
#      the named repo OR against every repo in per_repo_overrides.
#      Use this for the periodic "re-apply on drift" pattern.
#
#   2. schedule (weekly Sun 04:00 UTC): safety net that catches any
#      repo that drifted since the last manual run. Catches the case
#      where the operator added a per_repo_overrides entry on `main`
#      and forgot to dispatch the workflow.
#
#   3. (Future, requires org-level GitHub App) repository.created
#      events for new POWERFULMOVES/* repos. The org-level Apps
#      `repository.created` event is the natural hook for true
#      auto-enroll on fork creation. The org App must have
#      Administration: Read & Write (same grant as branch-protection-
#      sync.yml) for the auto-enroll write to land. Not wired here
#      because GitHub org-level Apps require a separate App config
#      slice. For now: this workflow covers the manual + scheduled
#      modes, and the operator adds a per_repo_overrides entry to
#      enroll a new repo (then dispatches).
#
# Exit codes:
#   0 = every target apply succeeded (or dry-run)
#   1 = spec load / publisher failure
#   non-zero per-target failures are recorded in the step summary

on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly Sun 04:00 UTC (safety net)
  workflow_dispatch:
    inputs:
      repo:
        description: 'Single repo to apply (org/repo); empty = every per_repo_overrides entry'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry-run only — print the would-be API calls, do not write'
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  sync:
    name: branch-protection-ruleset-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # Derive the repo set to apply to. If a single --repo is passed,
      # use that; otherwise apply to every per_repo_overrides entry in
      # the spec. The spec is the source of truth — no hardcoded list.
      - name: Resolve apply target set
        id: targets
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          spec = json.loads(Path("pmoves/configs/branch_protection/pmoves_standard.json").read_text(encoding="utf-8"))
          repo = "${{ inputs.repo }}".strip()
          if repo:
              repos = [repo]
          else:
              repos = sorted(spec.get("per_repo_overrides", {}).keys())
          # Write a TSV the apply step reads (one repo per line).
          Path("repos.tsv").write_text("\n".join(repos) + "\n", encoding="utf-8")
          print(f"Applying to {len(repos)} repo(s):")
          for r in repos:
              print(f"  {r}")
          with open("repos_count", "w") as f:
              f.write(str(len(repos)))
          PY

      # Mint the GitHub App token with the Administration grant
      # (required to PUT rulesets). The token scope is the resolved
      # repo set so the App installation only gets access to the
      # targets it needs. If the App lacks the grant, this step
      # fails with "the app does not have permission to request
      # 'administration'" — the intended live validation.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.targets.outputs.repos }}
          permission-administration: write
          permission-contents: read

      # Apply. Default is dry-run. The operator flips dry_run to false
      # via the workflow_dispatch input when ready to write. The
      # per-repo loop is best-effort: failures are collected into the
      # step summary, not raised as a single hard error.
      - name: Apply rulesets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e
          APPLIED=0; SKIPPED=0; FAILED=0
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            echo "--- $repo ---"
            args=("$repo")
            if [ "$DRY_RUN" = "true" ]; then args+=("--dry-run"); fi
            if python -m pmoves.tools.branch_protection apply "${args[@]}" 2>&1 | tee -a "apply.${repo//\//_}.log"; then
              APPLIED=$((APPLIED+1))
            else
              FAILED=$((FAILED+1))
            fi
          done < repos.tsv

          echo "## Apply summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- applied: $APPLIED" >> "$GITHUB_STEP_SUMMARY"
          echo "- failed: $FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "- dry-run: $DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "- per-repo logs: apply.*.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload apply logs
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee13c689e4253b0aa2 # v8.0.0
        with:
          name: branch-protection-apply-${{ github.run_id }}
          path: apply.*.log
          if-no-files-found: ignore
