name: Gap-Fill Validate

# Re-runs Tier-1 (static) and Tier-2 (smoke) validation from the Wave 0
# gap-fill roadmap on every PR that touches the scaffolded surface.
# Tier-3 (live integration) is NOT in CI — runners cannot reach the on-prem
# PMOVES mesh. That tier runs locally / on self-hosted runners only.

on:
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '.claude/commands/archon/**'
      - '.claude/hooks/governance/**'
      - '.claude/hooks/posttool-format/**'
      - '.claude/hooks/session-env-check.sh'
      - '.claude/hooks/test/**'
      - 'pmoves-nats-mcp/**'
      - 'docs/superpowers/plans/2026-05-15-pmoves-gap-fill-roadmap.md'
      - '.github/workflows/gap-fill-validate.yml'
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '.claude/commands/archon/**'
      - '.claude/hooks/governance/**'
      - '.claude/hooks/posttool-format/**'
      - 'pmoves-nats-mcp/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  static:
    name: Tier 1 — Static (frontmatter + syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Install uv
        run: python3 -m pip install --quiet uv
      - name: Sync NATS MCP project
        run: uv sync --project pmoves-nats-mcp
      - name: Run static validator
        run: bash .claude/hooks/test/run_static.sh

  smoke:
    name: Tier 2 — Smoke (hooks + skill scripts)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Run smoke validator
        run: bash .claude/hooks/test/run_smoke.sh
