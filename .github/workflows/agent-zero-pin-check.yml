name: Agent Zero Pin Check

# The agent-zero image installs dependencies TWICE into the same virtualenv:
# the fork's requirements first, then ours as a `--constraint`. Ours wins.
#
# So every package our lock names is a version we impose on top of what the
# fork already resolved - including packages the fork pins for stated security
# reasons. That went wrong silently: the fork pinned a package to a fixed
# version for a published advisory, and our lock carried an older one because a
# package we declared capped it. The fork's pin was intact in the fork's file
# the whole time; the image ran something else.
#
# Nothing compared the two files, so nothing noticed. This does.
#
# Runs on any change that can move either side of that comparison: our
# requirements, our lock, the gitlink, the Dockerfile that wires the two
# installs together, or the tool itself.

on:
  push:
    branches: [main]
    paths:
      - 'pmoves/services/agent-zero/requirements.txt'
      - 'pmoves/services/agent-zero/requirements.lock'
      - 'pmoves/services/agent-zero/Dockerfile.multiarch'
      - 'pmoves/tools/agent_zero_pin_check.py'
      - 'PMOVES-Agent-Zero'
      - '.github/workflows/agent-zero-pin-check.yml'
  pull_request:
    paths:
      - 'pmoves/services/agent-zero/requirements.txt'
      - 'pmoves/services/agent-zero/requirements.lock'
      - 'pmoves/services/agent-zero/Dockerfile.multiarch'
      - 'pmoves/tools/agent_zero_pin_check.py'
      - 'PMOVES-Agent-Zero'
      - '.github/workflows/agent-zero-pin-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  pin-check:
    name: agent-zero-pin-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Deliberately NOT recursive. The tool prefers a checked-out submodule
        # and otherwise fetches the fork's requirements.txt at the gitlink SHA,
        # which is public. Comparing against the gitlink rather than the branch
        # head keeps the result deterministic; gitlink-vs-branch drift is
        # submodule-freshness.yml's job, not this one.

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # Installed via the official script rather than a marketplace action:
      # no other workflow in this repo uses setup-uv, so adding it would mean a
      # new entry in the Actions allowlist and a new SHA to keep pinned, for one
      # binary. The make target below shells out to `uv run`, and running the
      # SAME target locally and in CI is the point - a CI-only invocation drifts.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # No `| tee`: a pipeline would report tee's exit status, and this check
      # exists precisely because a green result that measured nothing is the
      # failure mode being guarded against.
      - name: Run pin check
        run: make -C pmoves agent-zero-pin-check
