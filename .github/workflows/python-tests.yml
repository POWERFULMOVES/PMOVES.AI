name: Python Tests

on:
  push:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/__init__.py'
      - 'pmoves/services/**/*.py'
      - 'pmoves/services/**/tests/**'
      - 'pmoves/libs/**'
      - 'pmoves/tests/**'
      - 'pytest.ini'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/__init__.py'
      - 'pmoves/services/**/*.py'
      - 'pmoves/services/**/tests/**'
      - 'pmoves/libs/**'
      - 'pmoves/tests/**'
      - 'pytest.ini'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    env:
      PYTHONPATH: .:pmoves:pmoves/services/gateway
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch PMOVES.YT submodule for shim tests
        shell: bash
        run: |
          git submodule sync -- PMOVES.YT
          git -c protocol.version=2 submodule update --init --depth=1 PMOVES.YT
      - name: Free disk space (ubuntu-latest)
        # Inline rather than jlumbroso/free-disk-space: that action is not on
        # this repo's Actions allowlist, which made the WHOLE workflow
        # uncompilable — `startup_failure`, 0 jobs, on 100 of its last 100
        # runs. A required merge check that cannot launch is worse than a slow
        # one. Reclaiming inline needs no allowlist entry and adds no
        # third-party supply-chain surface.
        #
        # Mirrors what the action removed for us (android/dotnet/haskell/
        # large-packages, tool-cache and swap left alone). Safe here ONLY
        # because runs-on is ubuntu-latest — an ephemeral hosted VM. Do not
        # copy this onto a self-hosted fleet runner: `docker image prune`
        # there would delete live fleet images.
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "before: $(df -h --output=avail / | tail -1 | tr -d ' ') avail"
          for d in /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                   /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell; do
            [ -e "$d" ] && sudo rm -rf -- "$d" || true
          done
          sudo apt-get purge -y -qq '^llvm-.*' '^mongodb-.*' '^mysql-.*' azure-cli 2>/dev/null || true
          sudo apt-get autoremove -y -qq 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          echo "after:  $(df -h --output=avail / | tail -1 | tr -d ' ') avail"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          # Collect requirements from all services with tests
          services_with_tests = [
              "publisher", "pmoves-yt", "publisher-discord",
              "agent-zero", "channel-monitor", "chat-relay",
              "common", "gateway", "flute-gateway",
              "hi-rag-gateway", "hi-rag-gateway-v2",
              "jellyfin-bridge", "media-audio", "media-video",
              "deepresearch", "evo-controller"
          ]

          requirements = []
          for service in services_with_tests:
              req_path = pathlib.Path(f"pmoves/services/{service}/requirements.txt")
              if req_path.exists():
                  requirements.append(req_path)

          # Skip heavy/problematic packages for CI (GPU deps, large ML models)
          skip = {"supabase", "torch", "torchaudio", "torchvision", "whisperx",
                  "pyannote.audio", "faster-whisper", "ultralytics", "timm",
                  "accelerate", "sentence-transformers", "transformers",
                  "FlagEmbedding", "openai-whisper", "onnxruntime",
                  "langchain-unstructured", "unstructured", "unstructured-client",
                  "browser-use", "playwright", "faiss-cpu", "faiss-gpu",
                  "librosa", "numba", "kokoro", "newspaper3k", "boto3",
                  "langchain", "langchain-community", "langchain-core",
                  "litellm", "pymupdf", "qdrant-client"}
          skip_normalized = {s.lower().replace('-', '_') for s in skip}

          # Keep resolver guardrails for packages with known bad upstream releases.
          preserve_specs = {"pyreqwest-impersonate"}
          preserve_normalized = {s.lower().replace('-', '_') for s in preserve_specs}

          # Collect unique package specs. Most entries strip versions to let pip resolve;
          # preserved specs keep explicit guardrails for packages with bad releases.
          packages = set()
          # Test-only dependencies. These are NOT collected from any service
          # requirements.txt because the services do not need them at runtime —
          # only the tests do. `common` in particular ships no requirements.txt
          # at all, so anything its tests import has to be declared here.
          #
          # ruamel.yaml: pmoves/services/common/tests/test_topology_networks_wiring.py
          # imports it, and its own docstring pins the version it expects
          # (`uv run --with ruamel.yaml==0.19.1`). Matching that pin here keeps
          # the CI run and the documented standalone invocation on one version.
          #
          # pydantic-settings: pmoves/services/common/config.py and four other
          # services import it. SIX service requirements.txt files declare it -
          # github-runner-ctl, gpu-orchestrator, graph-linker, model-registry,
          # p7-room-orchestrator, semantic-cache - but NONE of those six are in
          # services_with_tests, so CI never installed it from a declaration. It
          # arrived transitively from agent-zero's requirements.txt, which listed
          # 56 packages, 42 of them copies of the fork's own list. #2672 cut that
          # file to the 8 packages PMOVES actually adds, and the accidental
          # transitive went with it. Declaring it here makes the dependency real
          # instead of a side effect of a file being too big.
          base_packages = ["pytest", "pytest-asyncio", "pytest-cov", "ruamel.yaml==0.19.1",
                           "pydantic-settings"]

          import re
          for path in requirements:
              with path.open() as handle:
                  for raw in handle:
                      # Strip inline comments BEFORE anything else. pip treats
                      # " #" as a comment separator, and a requirements.txt is
                      # entitled to use it. This loop used to strip it only on
                      # the preserve_specs path; every other package relied on
                      # re.split() on a version operator to shed the comment as
                      # a side effect. A bare name with an inline comment --
                      # "nats-py  # NATS bus integration" -- has no operator to
                      # split on, so the whole line, comment and all, was handed
                      # to `pip install` as one requirement. That took every
                      # branch's python-tests down until it was noticed.
                      line = raw.split(" #", 1)[0].strip()
                      if not line or line.startswith("#") or line.startswith("-"):
                          continue  # Skip comments, empty lines, and pip options
                      # Extract just the package name
                      name = re.split(r'[>=<\[!~]', line)[0].strip()
                      normalized = name.lower().replace('-', '_')
                      if normalized in skip_normalized:
                          continue
                      if normalized in preserve_normalized:
                          packages.add(line)  # already comment-stripped above
                      else:
                          packages.add(name)

          # Install base packages + deduplicated requirements.
          to_install = base_packages + sorted(packages)
          subprocess.check_call([sys.executable, "-m", "pip", "install", *to_install])
          PY
      - name: Run all service tests
        run: |
          # Isolate hyphenated service test directories so each conftest
          # resolves in its own context.
          PYTHONPATH=".:pmoves/services/agent-zero:pmoves" pytest -q --tb=short --rootdir=. --import-mode=importlib \
            pmoves/services/agent-zero/tests

          PYTHONPATH=".:pmoves/services/chat-relay:pmoves" pytest -q --tb=short --rootdir=. --import-mode=importlib \
            pmoves/services/chat-relay/tests

          pytest -q --tb=short --rootdir=. --import-mode=importlib \
            pmoves/services/publisher/tests \
            pmoves/services/pmoves-yt/tests \
            pmoves/services/publisher-discord/tests \
            pmoves/services/channel-monitor/tests \
            pmoves/services/common/tests \
            pmoves/services/gateway/tests \
            pmoves/services/flute-gateway/tests \
            pmoves/services/hi-rag-gateway/tests \
            pmoves/services/hi-rag-gateway-v2/tests \
            pmoves/services/jellyfin-bridge/tests \
            --ignore=pmoves/services/media-audio/tests \
            --ignore=pmoves/services/media-video/tests
