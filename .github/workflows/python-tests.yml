name: Python Tests

on:
  push:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/__init__.py'
      - 'pmoves/services/**/*.py'
      - 'pmoves/services/**/tests/**'
      - 'pmoves/libs/**'
      - 'pmoves/tests/**'
      - 'pytest.ini'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [main, PMOVES.AI-Edition-Hardened]
    paths:
      - 'pmoves/__init__.py'
      - 'pmoves/services/**/*.py'
      - 'pmoves/services/**/tests/**'
      - 'pmoves/libs/**'
      - 'pmoves/tests/**'
      - 'pytest.ini'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    env:
      PYTHONPATH: .:pmoves:pmoves/services/gateway
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch PMOVES.YT submodule for shim tests
        shell: bash
        run: |
          git submodule sync -- PMOVES.YT
          git -c protocol.version=2 submodule update --init --depth=1 PMOVES.YT
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        continue-on-error: true          # Self-hosted runner: bash arithmetic fails on large disks (scientific notation)
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          # Collect requirements from all services with tests
          services_with_tests = [
              "publisher", "pmoves-yt", "publisher-discord",
              "agent-zero", "channel-monitor", "chat-relay",
              "common", "gateway", "flute-gateway",
              "hi-rag-gateway", "hi-rag-gateway-v2",
              "jellyfin-bridge", "media-audio", "media-video",
              "deepresearch", "evo-controller"
          ]

          requirements = []
          for service in services_with_tests:
              req_path = pathlib.Path(f"pmoves/services/{service}/requirements.txt")
              if req_path.exists():
                  requirements.append(req_path)

          # Skip heavy/problematic packages for CI (GPU deps, large ML models)
          skip = {"supabase", "torch", "torchaudio", "torchvision", "whisperx",
                  "pyannote.audio", "faster-whisper", "ultralytics", "timm",
                  "accelerate", "sentence-transformers", "transformers",
                  "FlagEmbedding", "openai-whisper", "onnxruntime",
                  "langchain-unstructured", "unstructured", "unstructured-client",
                  "browser-use", "playwright", "faiss-cpu", "faiss-gpu",
                  "librosa", "numba", "kokoro", "newspaper3k", "boto3",
                  "langchain", "langchain-community", "langchain-core",
                  "litellm", "pymupdf", "qdrant-client"}
          skip_normalized = {s.lower().replace('-', '_') for s in skip}

          # Keep resolver guardrails for packages with known bad upstream releases.
          preserve_specs = {"pyreqwest-impersonate"}
          preserve_normalized = {s.lower().replace('-', '_') for s in preserve_specs}

          # Collect unique package specs. Most entries strip versions to let pip resolve;
          # preserved specs keep explicit guardrails for packages with bad releases.
          packages = set()
          base_packages = ["pytest", "pytest-asyncio", "pytest-cov"]

          import re
          for path in requirements:
              with path.open() as handle:
                  for raw in handle:
                      line = raw.strip()
                      if not line or line.startswith("#") or line.startswith("-"):
                          continue  # Skip comments, empty lines, and pip options
                      # Extract just the package name
                      name = re.split(r'[>=<\[!~]', line)[0].strip()
                      normalized = name.lower().replace('-', '_')
                      if normalized in skip_normalized:
                          continue
                      if normalized in preserve_normalized:
                          packages.add(line.split(" #", 1)[0].strip())
                      else:
                          packages.add(name)

          # Install base packages + deduplicated requirements.
          to_install = base_packages + sorted(packages)
          subprocess.check_call([sys.executable, "-m", "pip", "install", *to_install])
          PY
      - name: Run all service tests
        run: |
          # Isolate hyphenated service test directories so each conftest
          # resolves in its own context.
          PYTHONPATH=".:pmoves/services/agent-zero:pmoves" pytest -q --tb=short --rootdir=. --import-mode=importlib \
            pmoves/services/agent-zero/tests

          PYTHONPATH=".:pmoves/services/chat-relay:pmoves" pytest -q --tb=short --rootdir=. --import-mode=importlib \
            pmoves/services/chat-relay/tests

          pytest -q --tb=short --rootdir=. --import-mode=importlib \
            pmoves/services/publisher/tests \
            pmoves/services/pmoves-yt/tests \
            pmoves/services/publisher-discord/tests \
            pmoves/services/channel-monitor/tests \
            pmoves/services/common/tests \
            pmoves/services/gateway/tests \
            pmoves/services/flute-gateway/tests \
            pmoves/services/hi-rag-gateway/tests \
            pmoves/services/hi-rag-gateway-v2/tests \
            pmoves/services/jellyfin-bridge/tests \
            --ignore=pmoves/services/media-audio/tests \
            --ignore=pmoves/services/media-video/tests
