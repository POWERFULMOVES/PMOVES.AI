name: Branch Protection Drift

# Daily drift check on the PMOVES org's branch protection rulesets.
# Runs pmoves/tools/branch_protection_publisher.py drift-check on the
# POWERFULMOVES org, publishes the per-repo drift to
# pmoves.branch_protection.drift.v1 (NATS) so the Mavis orchestrator
# can dispatch a remediation session, and writes the report to the
# step summary + a JSONL artifact for offline inspection.
#
# The publisher is the ruleset-only side (per the PR #2490 ownership
# split: this workflow owns RULESETS, .github/workflows/branch-
# protection-sync.yml owns CLASSIC). Drift here means the ruleset
# differs from the spec; classic drift is the existing workflow's
# concern and is NOT audited here.
#
# Schedule: daily 06:00 UTC (matches fork-sync.yml + branch-protection-
# sync.yml). workflow_dispatch for manual runs.
#
# Exit codes:
#   0 = drift check ran (compliant or non-compliant — both are OK)
#   1 = spec / publisher failure (the script's CLI returns 2 for
#       publish failure, which becomes workflow run: failure)

on:
  schedule:
    - cron: '0 6 * * *'  # Daily 06:00 UTC
  workflow_dispatch:
    inputs:
      org:
        description: 'GitHub org to audit'
        required: false
        type: string
        default: 'POWERFULMOVES'
      sink:
        description: 'Publisher sink (file = JSONL to artifact; nats = pmoves-nats-mcp live)'
        required: false
        type: choice
        options: [file, nats]
        default: 'file'

permissions: {}

jobs:
  drift:
    name: branch-protection-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # Run the drift check + publish. The default sink is `file`
      # (JSONL to stdout + the per-run artifact). Operators flip to
      # `nats` when pmoves-nats-mcp is wired on the runner.
      - name: Run drift check + publish
        id: drift
        env:
          ORG: ${{ inputs.org || 'POWERFULMOVES' }}
          SINK: ${{ inputs.sink || 'file' }}
        run: |
          set -e
          mkdir -p .drift
          # Default to file sink writing to the artifact path. The publisher
          # is a stdlib-only Python tool; the workflow does not need
          # network for the file sink.
          python -m pmoves.tools.branch_protection_publisher \
            --org "$ORG" \
            --spec pmoves/configs/branch_protection/pmoves_standard.json \
            --sink "$SINK" \
            --out .drift/drift.jsonl \
            | tee .drift/summary.json

      - name: Surface drift summary
        if: always()
        run: |
          if [ -f .drift/summary.json ]; then
            echo "## Drift summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat .drift/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload drift artifact
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee13c689e4253b0aa2 # v8.0.0
        with:
          name: branch-protection-drift-${{ github.run_id }}
          path: .drift/
          if-no-files-found: ignore
