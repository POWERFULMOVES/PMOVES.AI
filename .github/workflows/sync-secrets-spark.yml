# DEPRECATED: Superseded by sync-secrets-local.yml which covers the spark runner
# via matrix targeting [self-hosted, ai-lab, "spark"]. Kept as reference only.
# To re-enable: remove this header. Do NOT use alongside sync-secrets-local.
name: "[DEPRECATED] Sync Secrets to SPARK Runner"

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: 'Output format'
        required: false
        default: 'env'
        type: choice
        options:
          - env

permissions:
  contents: read

jobs:
  sync-secrets:
    name: Sync Secrets to SPARK
    runs-on: [self-hosted, spark]
    environment: prod
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Write all secrets base64-encoded
        run: |
          SECRETS_DIR="$XDG_CONFIG_HOME/pmoves/secrets"
          mkdir -p "$SECRETS_DIR"
          OUT="$SECRETS_DIR/local.env"
          > "$OUT"

          encode() {
            printf '%s=b64:%s\n' "$1" "$(printf '%s' "$2" | base64 -w0)"
          }

          encode HOSTINGER_API_KEY "${{ secrets.HOSTINGER_API_KEY }}" >> "$OUT"
          encode HOSTINGER_SSH_HOST "${{ secrets.HOSTINGER_SSH_HOST }}" >> "$OUT"
          encode HOSTINGER_SSH_USER "${{ secrets.HOSTINGER_SSH_USER }}" >> "$OUT"
          encode HOSTINGER_SSH_PRIVATE_KEY "${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}" >> "$OUT"
          encode HOSTINGER_KVM2_IP "${{ secrets.HOSTINGER_KVM2_IP }}" >> "$OUT"
          encode HOSTINGER_KVM2_USER "${{ secrets.HOSTINGER_KVM2_USER }}" >> "$OUT"
          encode HOSTINGER_KVM4_1_IP "${{ secrets.HOSTINGER_KVM4_1_IP }}" >> "$OUT"
          encode HOSTINGER_KVM4_1_USER "${{ secrets.HOSTINGER_KVM4_1_USER }}" >> "$OUT"
          encode HOSTINGER_KVM4_2_IP "${{ secrets.HOSTINGER_KVM4_2_IP }}" >> "$OUT"
          encode HOSTINGER_KVM4_2_USER "${{ secrets.HOSTINGER_KVM4_2_USER }}" >> "$OUT"
          encode TAILSCALE_APIKEY "${{ secrets.TAILSCALE_APIKEY }}" >> "$OUT"
          encode TAILSCALE_AUTHKEY "${{ secrets.TAILSCALE_AUTHKEY }}" >> "$OUT"
          encode TAILSCALE_TAILNET "${{ secrets.TAILSCALE_TAILNET }}" >> "$OUT"
          encode GH_PAT "${{ secrets.GH_PAT }}" >> "$OUT"
          encode CHIT_PASSPHRASE "${{ secrets.CHIT_PASSPHRASE }}" >> "$OUT"

          count=$(grep -cv '^$' "$OUT")
          echo "Done: $count secrets written (all base64-encoded) to $OUT"

      - name: Verify
        run: |
          SECRETS_DIR="$XDG_CONFIG_HOME/pmoves/secrets"
          if [ -f "$SECRETS_DIR/local.env" ]; then
            count=$(grep -cv '^$' "$SECRETS_DIR/local.env" 2>/dev/null || echo 0)
            echo "Done: $count secrets written"
          else
            echo "ERROR: local.env not found"
            exit 1
          fi

      # Note: Intentionally NOT cleaning up local.env here.
      # The purpose of this workflow is to persist secrets on the self-hosted
      # SPARK runner for later use by other workflows and local tools.
      # A separate scheduled cleanup job can prune stale files if needed.
