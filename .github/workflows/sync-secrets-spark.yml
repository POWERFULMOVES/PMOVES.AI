name: Sync Secrets to SPARK Runner

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: 'Output format'
        required: false
        default: 'env'
        type: choice
        options:
          - env

permissions:
  contents: read

jobs:
  sync-secrets:
    name: Sync Secrets to SPARK
    runs-on: [self-hosted, spark]
    environment: prod
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write secrets with base64 encoding
        env:
          _SECRETS: |
            HOSTINGER_API_KEY=${{ secrets.HOSTINGER_API_KEY }}
            HOSTINGER_SSH_HOST=${{ secrets.HOSTINGER_SSH_HOST }}
            HOSTINGER_SSH_USER=${{ secrets.HOSTINGER_SSH_USER }}
            HOSTINGER_SSH_PRIVATE_KEY=${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
            HOSTINGER_KVM2_IP=${{ secrets.HOSTINGER_KVM2_IP }}
            HOSTINGER_KVM2_USER=${{ secrets.HOSTINGER_KVM2_USER }}
            HOSTINGER_KVM4_1_IP=${{ secrets.HOSTINGER_KVM4_1_IP }}
            HOSTINGER_KVM4_1_USER=${{ secrets.HOSTINGER_KVM4_1_USER }}
            HOSTINGER_KVM4_2_IP=${{ secrets.HOSTINGER_KVM4_2_IP }}
            HOSTINGER_KVM4_2_USER=${{ secrets.HOSTINGER_KVM4_2_USER }}
            TAILSCALE_APIKEY=${{ secrets.TAILSCALE_APIKEY }}
            TAILSCALE_AUTHKEY=${{ secrets.TAILSCALE_AUTHKEY }}
            TAILSCALE_TAILNET=${{ secrets.TAILSCALE_TAILNET }}
            GH_PAT=${{ secrets.GH_PAT }}
            CHIT_PASSPHRASE=${{ secrets.CHIT_PASSPHRASE }}
        run: |
          python3 << 'PYENCODE'
          import base64, os, sys
          from pathlib import Path

          raw = os.environ.get('_SECRETS', '')
          secrets_dir = Path(os.environ.get('XDG_CONFIG_HOME', os.path.expanduser('~/.config'))) / 'pmoves' / 'secrets'
          secrets_dir.mkdir(parents=True, exist_ok=True)
          out_path = secrets_dir / 'local.env'

          b64_count = 0
          total = 0
          lines = []
          for line in raw.splitlines():
              line = line.strip()
              if not line or '=' not in line:
                  continue
              key, val = line.split('=', 1)
              key = key.strip()
              total += 1
              if '\n' in val:
                  encoded = base64.b64encode(val.encode('utf-8')).decode('ascii')
                  lines.append(f'{key}=b64:{encoded}')
                  b64_count += 1
              else:
                  lines.append(f'{key}={val}')

          out_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Done: {total} secrets written ({b64_count} base64-encoded) to {out_path}')
          PYENCODE

      - name: Verify
        run: |
          SECRETS_DIR="$XDG_CONFIG_HOME/pmoves/secrets"
          if [ -f "$SECRETS_DIR/local.env" ]; then
            count=$(grep -cv '^$' "$SECRETS_DIR/local.env" 2>/dev/null || echo 0)
            b64_count=$(grep -c '^.*=b64:' "$SECRETS_DIR/local.env" 2>/dev/null || echo 0)
            echo "✅ $count secrets written ($b64_count base64-encoded)"
          else
            echo "❌ local.env not found"
            exit 1
          fi
