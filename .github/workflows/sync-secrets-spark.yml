name: Sync Secrets to SPARK Runner

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: 'Output format'
        required: false
        default: 'env'
        type: choice
        options:
          - env

permissions:
  contents: read

jobs:
  sync-secrets:
    name: Sync Secrets to SPARK
    runs-on: [self-hosted, spark]
    environment: prod
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write secrets to local.env
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_KVM2_IP: ${{ secrets.HOSTINGER_KVM2_IP }}
          HOSTINGER_KVM2_USER: ${{ secrets.HOSTINGER_KVM2_USER }}
          HOSTINGER_KVM4_1_IP: ${{ secrets.HOSTINGER_KVM4_1_IP }}
          HOSTINGER_KVM4_1_USER: ${{ secrets.HOSTINGER_KVM4_1_USER }}
          HOSTINGER_KVM4_2_IP: ${{ secrets.HOSTINGER_KVM4_2_IP }}
          HOSTINGER_KVM4_2_USER: ${{ secrets.HOSTINGER_KVM4_2_USER }}
          TAILSCALE_APIKEY: ${{ secrets.TAILSCALE_APIKEY }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TAILSCALE_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CHIT_PASSPHRASE: ${{ secrets.CHIT_PASSPHRASE }}
        run: |
          SECRETS_DIR="$XDG_CONFIG_HOME/pmoves/secrets"
          mkdir -p "$SECRETS_DIR"
          OUT="$SECRETS_DIR/local.env"
          {
            printf 'HOSTINGER_API_KEY=%s\n' "$HOSTINGER_API_KEY"
            printf 'HOSTINGER_SSH_HOST=%s\n' "$HOSTINGER_SSH_HOST"
            printf 'HOSTINGER_SSH_USER=%s\n' "$HOSTINGER_SSH_USER"
            printf 'HOSTINGER_SSH_PRIVATE_KEY=%s\n' "$HOSTINGER_SSH_PRIVATE_KEY"
            printf 'HOSTINGER_KVM2_IP=%s\n' "$HOSTINGER_KVM2_IP"
            printf 'HOSTINGER_KVM2_USER=%s\n' "$HOSTINGER_KVM2_USER"
            printf 'HOSTINGER_KVM4_1_IP=%s\n' "$HOSTINGER_KVM4_1_IP"
            printf 'HOSTINGER_KVM4_1_USER=%s\n' "$HOSTINGER_KVM4_1_USER"
            printf 'HOSTINGER_KVM4_2_IP=%s\n' "$HOSTINGER_KVM4_2_IP"
            printf 'HOSTINGER_KVM4_2_USER=%s\n' "$HOSTINGER_KVM4_2_USER"
            printf 'TAILSCALE_APIKEY=%s\n' "$TAILSCALE_APIKEY"
            printf 'TAILSCALE_AUTHKEY=%s\n' "$TAILSCALE_AUTHKEY"
            printf 'TAILSCALE_TAILNET=%s\n' "$TAILSCALE_TAILNET"
            printf 'GH_PAT=%s\n' "$GH_PAT"
            printf 'CHIT_PASSPHRASE=%s\n' "$CHIT_PASSPHRASE"
          } > "$OUT"
          echo "Done: $(wc -l < "$OUT") lines written to $OUT"

      - name: Verify
        run: |
          SECRETS_DIR="$XDG_CONFIG_HOME/pmoves/secrets"
          if [ -f "$SECRETS_DIR/local.env" ]; then
            count=$(grep -cv '^$' "$SECRETS_DIR/local.env" 2>/dev/null || echo 0)
            echo "✅ $count secrets written to $SECRETS_DIR/local.env"
          else
            echo "❌ local.env not found"
            exit 1
          fi
