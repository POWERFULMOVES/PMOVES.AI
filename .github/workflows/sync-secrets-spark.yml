name: Sync Secrets to SPARK Runner

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: 'Output format'
        required: false
        default: 'env'
        type: choice
        options:
          - env

permissions:
  contents: read

jobs:
  sync-secrets:
    name: Sync Secrets to SPARK
    runs-on: [self-hosted, spark]
    environment: prod
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write secrets via github-script (preserves multiline)
        uses: actions/github-script@v7
        env:
          SECRETS_DIR: "${{ github.env }}SECRETS_DIR"
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const os = require('os');

            const xdg = process.env.XDG_CONFIG_HOME || path.join(os.homedir(), '.config');
            const secretsDir = path.join(xdg, 'pmoves', 'secrets');
            fs.mkdirSync(secretsDir, { recursive: true });

            const secretNames = [
              'HOSTINGER_API_KEY', 'HOSTINGER_SSH_HOST', 'HOSTINGER_SSH_USER',
              'HOSTINGER_SSH_PRIVATE_KEY',
              'HOSTINGER_KVM2_IP', 'HOSTINGER_KVM2_USER',
              'HOSTINGER_KVM4_1_IP', 'HOSTINGER_KVM4_1_USER',
              'HOSTINGER_KVM4_2_IP', 'HOSTINGER_KVM4_2_USER',
              'TAILSCALE_APIKEY', 'TAILSCALE_AUTHKEY', 'TAILSCALE_TAILNET',
              'GH_PAT', 'CHIT_PASSPHRASE'
            ];

            const lines = [];
            let b64Count = 0;
            let total = 0;

            for (const name of secretNames) {
              const val = process.env[name] || '';
              total++;
              if (val.includes('\n')) {
                const encoded = Buffer.from(val).toString('base64');
                lines.push(name + '=b64:' + encoded);
                b64Count++;
              } else {
                lines.push(name + '=' + val);
              }
            }

            const outPath = path.join(secretsDir, 'local.env');
            fs.writeFileSync(outPath, lines.join('\n') + '\n');
            console.log(`Done: ${total} secrets written (${b64Count} base64-encoded) to ${outPath}`);
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_KVM2_IP: ${{ secrets.HOSTINGER_KVM2_IP }}
          HOSTINGER_KVM2_USER: ${{ secrets.HOSTINGER_KVM2_USER }}
          HOSTINGER_KVM4_1_IP: ${{ secrets.HOSTINGER_KVM4_1_IP }}
          HOSTINGER_KVM4_1_USER: ${{ secrets.HOSTINGER_KVM4_1_USER }}
          HOSTINGER_KVM4_2_IP: ${{ secrets.HOSTINGER_KVM4_2_IP }}
          HOSTINGER_KVM4_2_USER: ${{ secrets.HOSTINGER_KVM4_2_USER }}
          TAILSCALE_APIKEY: ${{ secrets.TAILSCALE_APIKEY }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TAILSCALE_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CHIT_PASSPHRASE: ${{ secrets.CHIT_PASSPHRASE }}

      - name: Verify
        run: |
          SECRETS_DIR="$XDG_CONFIG_HOME/pmoves/secrets"
          if [ -f "$SECRETS_DIR/local.env" ]; then
            count=$(grep -cv '^$' "$SECRETS_DIR/local.env" 2>/dev/null || echo 0)
            b64_count=$(grep -c '=b64:' "$SECRETS_DIR/local.env" 2>/dev/null || echo 0)
            echo "✅ $count secrets written ($b64_count base64-encoded)"
          else
            echo "❌ local.env not found"
            exit 1
          fi
