name: Sync Secrets to SPARK Runner

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: 'Output format'
        required: false
        default: 'env'
        type: choice
        options:
          - env

permissions:
  contents: read

jobs:
  sync-secrets:
    name: Sync Secrets to SPARK
    runs-on: [self-hosted, spark]
    environment: prod
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write secrets with base64 for multiline values
        run: |
          SECRETS_DIR="$XDG_CONFIG_HOME/pmoves/secrets"
          mkdir -p "$SECRETS_DIR"
          OUT="$SECRETS_DIR/local.env"
          b64_count=0
          total=0

          write_secret() {
            local key="$1" val="$2"
            total=$((total + 1))
            if printf '%s' "$val" | grep -qc $'\n'; then
              local encoded
              encoded=$(printf '%s' "$val" | base64 -w0)
              printf '%s=b64:%s\n' "$key" "$encoded" >> "$OUT"
              b64_count=$((b64_count + 1))
            else
              printf '%s=%s\n' "$key" "$val" >> "$OUT"
            fi
          }

          # Plain single-line secrets (via env var is fine)
          write_secret HOSTINGER_API_KEY "$HOSTINGER_API_KEY"
          write_secret HOSTINGER_SSH_HOST "$HOSTINGER_SSH_HOST"
          write_secret HOSTINGER_SSH_USER "$HOSTINGER_SSH_USER"
          write_secret HOSTINGER_KVM2_IP "$HOSTINGER_KVM2_IP"
          write_secret HOSTINGER_KVM2_USER "$HOSTINGER_KVM2_USER"
          write_secret HOSTINGER_KVM4_1_IP "$HOSTINGER_KVM4_1_IP"
          write_secret HOSTINGER_KVM4_1_USER "$HOSTINGER_KVM4_1_USER"
          write_secret HOSTINGER_KVM4_2_IP "$HOSTINGER_KVM4_2_IP"
          write_secret HOSTINGER_KVM4_2_USER "$HOSTINGER_KVM4_2_USER"
          write_secret TAILSCALE_TAILNET "$TAILSCALE_TAILNET"
          write_secret GH_PAT "$GH_PAT"
          write_secret CHIT_PASSPHRASE "$CHIT_PASSPHRASE"

          # Multiline secrets via ${{ }} (preserves newlines)
          SSH_KEY_B64=$(printf '%s' "${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}" | base64 -w0)
          printf 'HOSTINGER_SSH_PRIVATE_KEY=b64:%s\n' "$SSH_KEY_B64" >> "$OUT"
          b64_count=$((b64_count + 1))
          total=$((total + 1))

          TS_API_B64=$(printf '%s' "${{ secrets.TAILSCALE_APIKEY }}" | base64 -w0)
          printf 'TAILSCALE_APIKEY=b64:%s\n' "$TS_API_B64" >> "$OUT"
          b64_count=$((b64_count + 1))
          total=$((total + 1))

          TS_AUTH_B64=$(printf '%s' "${{ secrets.TAILSCALE_AUTHKEY }}" | base64 -w0)
          printf 'TAILSCALE_AUTHKEY=b64:%s\n' "$TS_AUTH_B64" >> "$OUT"
          b64_count=$((b64_count + 1))
          total=$((total + 1))

          echo "Done: $total secrets written ($b64_count base64-encoded) to $OUT"
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_KVM2_IP: ${{ secrets.HOSTINGER_KVM2_IP }}
          HOSTINGER_KVM2_USER: ${{ secrets.HOSTINGER_KVM2_USER }}
          HOSTINGER_KVM4_1_IP: ${{ secrets.HOSTINGER_KVM4_1_IP }}
          HOSTINGER_KVM4_1_USER: ${{ secrets.HOSTINGER_KVM4_1_USER }}
          HOSTINGER_KVM4_2_IP: ${{ secrets.HOSTINGER_KVM4_2_IP }}
          HOSTINGER_KVM4_2_USER: ${{ secrets.HOSTINGER_KVM4_2_USER }}
          TAILSCALE_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CHIT_PASSPHRASE: ${{ secrets.CHIT_PASSPHRASE }}

      - name: Verify
        run: |
          SECRETS_DIR="$XDG_CONFIG_HOME/pmoves/secrets"
          if [ -f "$SECRETS_DIR/local.env" ]; then
            count=$(grep -cv '^$' "$SECRETS_DIR/local.env" 2>/dev/null || echo 0)
            b64_count=$(grep -c '=b64:' "$SECRETS_DIR/local.env" 2>/dev/null || echo 0)
            echo "✅ $count secrets written ($b64_count base64-encoded)"
          else
            echo "❌ local.env not found"
            exit 1
          fi
