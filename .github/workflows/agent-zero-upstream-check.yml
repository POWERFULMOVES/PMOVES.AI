name: Agent Zero Upstream Check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Upstream version tag (e.g. v1.14)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: agent0ai/agent-zero
  # The fork the Dockerfile actually clones, and the branch carrying the PMOVES
  # overlays. Needed to MEASURE the sync size instead of reprinting a literal.
  FORK_REPO: POWERFULMOVES/PMOVES-Agent-Zero
  FORK_BRANCH: PMOVES.AI-Edition-Hardened
  DOCKERFILE: pmoves/services/agent-zero/Dockerfile.multiarch

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      upstream_current: ${{ steps.compare.outputs.UPSTREAM_CURRENT }}
      new_tag: ${{ steps.compare.outputs.NEW_TAG }}
      new_version: ${{ steps.compare.outputs.NEW_VERSION }}
      pr_exists: ${{ steps.check_pr.outputs.PR_EXISTS }}
      current_tag: ${{ steps.read_version.outputs.CURRENT_TAG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Detect latest upstream release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.upstream_version }}" ]; then
            echo "tag=${{ inputs.upstream_version }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(gh api repos/${{ env.UPSTREAM_REPO }}/releases/latest --jq '.tag_name')
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Read current pinned version
        id: read_version
        run: |
          # Derive the current pin from the Dockerfile ARG — it's committed to
          # git, unlike the old .a0-upstream-version state file (gitignored, so
          # it's always absent on a fresh Actions checkout and `git add -A` in
          # the create-pr job silently drops any write to it too).
          # AGENT_ZERO_REF is normally a PMOVES fork branch name in the form
          # PMOVES.AI-Edition-<version>; extract <version> when present,
          # otherwise treat the ref itself as the version (covers the
          # transitional state mid-bump-PR where AGENT_ZERO_REF holds a raw
          # upstream tag pending fork sync).
          CURRENT_REF=$(grep -oP '^ARG AGENT_ZERO_REF=\K.*' "${{ env.DOCKERFILE }}")
          # Prefer an explicit committed version marker when present. The fork's
          # hardened branch (e.g. PMOVES.AI-Edition-Hardened) is a rolling branch
          # whose name carries no version, so deriving the version from the ref
          # alone would capture a non-version token ("Hardened") and never match a
          # real upstream tag — opening a bump PR on every run.
          PINNED_VER=$(grep -oP '^ARG AGENT_ZERO_UPSTREAM_VERSION=\K.*' "${{ env.DOCKERFILE }}" || true)
          if [[ "${CURRENT_REF}" =~ ^PMOVES\.AI-Edition-(.+)$ ]]; then
            CURRENT_TAG="${BASH_REMATCH[1]}"
          else
            CURRENT_TAG="${CURRENT_REF}"
          fi
          # If the ref-derived tag isn't version-shaped, fall back to the marker.
          if [[ ! "${CURRENT_TAG}" =~ ^v?[0-9] ]] && [[ -n "${PINNED_VER}" ]]; then
            CURRENT_TAG="${PINNED_VER}"
          fi
          echo "CURRENT_TAG=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          # Whether we have a real version to compare against at all.
          if [[ "${CURRENT_TAG}" =~ ^v?[0-9] ]]; then
            echo "CURRENT_IS_VERSION=true" >> "$GITHUB_OUTPUT"
          else
            echo "CURRENT_IS_VERSION=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare versions
        id: compare
        run: |
          CURRENT_NO_V="${{ steps.read_version.outputs.CURRENT_TAG }}"
          CURRENT_NO_V="${CURRENT_NO_V#v}"
          NEW_TAG="${{ steps.detect.outputs.tag }}"
          NEW_NO_V="${NEW_TAG#v}"

          if [ "${{ steps.read_version.outputs.CURRENT_IS_VERSION }}" != "true" ]; then
            # No comparable version pin (rolling branch ref, no AGENT_ZERO_UPSTREAM_VERSION
            # marker). Don't spam bump PRs — report current and tell the operator how
            # to opt into auto-bump.
            echo "UPSTREAM_CURRENT=true" >> "$GITHUB_OUTPUT"
            echo "::notice::AGENT_ZERO_REF pins a non-version ref ('${CURRENT_NO_V}'); add 'ARG AGENT_ZERO_UPSTREAM_VERSION=<tag>' to ${{ env.DOCKERFILE }} to enable auto-bump comparison."
          elif [ "${CURRENT_NO_V}" = "${NEW_NO_V}" ]; then
            echo "UPSTREAM_CURRENT=true" >> "$GITHUB_OUTPUT"
            echo "Versions match: ${CURRENT_NO_V}"
          else
            echo "UPSTREAM_CURRENT=false" >> "$GITHUB_OUTPUT"
            echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_OUTPUT"
            echo "NEW_VERSION=${NEW_NO_V}" >> "$GITHUB_OUTPUT"
            echo "Version change: ${CURRENT_NO_V} -> ${NEW_NO_V}"
          fi

      - name: Check for existing PR
        id: check_pr
        if: steps.compare.outputs.UPSTREAM_CURRENT == 'false'
        # GH_TOKEN is required for `gh pr list`. Its absence here was invisible
        # for months because this step is gated on the pin being STALE: on every
        # run where the pin was current the step was skipped, so the workflow
        # went green without ever executing it. The first run after upstream
        # v2.9 was tagged (2026-08-12 14:51) is the first time it ever ran, and
        # it failed instantly — taking `create-pr` (which `needs` this job) with
        # it. The bump PR this workflow exists to open has therefore never been
        # openable. Every other `gh` step in this file already sets the token.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/agent-zero-upstream-${{ steps.compare.outputs.NEW_TAG }}"
          PR_NUM=$(gh pr list --head "${BRANCH}" --json number --jq '.[0].number')
          if [ -n "${PR_NUM}" ]; then
            echo "PR_EXISTS=true" >> "$GITHUB_OUTPUT"
            echo "Existing PR found: #${PR_NUM}"
          else
            echo "PR_EXISTS=false" >> "$GITHUB_OUTPUT"
            echo "No existing PR for branch ${BRANCH}"
          fi

  create-pr:
    needs: check-upstream
    if: needs.check-upstream.outputs.upstream_current == 'false' && needs.check-upstream.outputs.pr_exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_number: ${{ steps.create_pr.outputs.PR_NUMBER }}
      branch_name: ${{ steps.create_pr.outputs.BRANCH_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure git
        run: |
          git config user.name "pmoves-bot[bot]"
          git config user.email "pmoves-bot[bot]@users.noreply.github.com"

      - name: Fetch upstream requirements for constraint analysis
        run: |
          curl -sL "https://raw.githubusercontent.com/${{ env.UPSTREAM_REPO }}/${{ needs.check-upstream.outputs.new_tag }}/requirements.txt" -o /tmp/upstream-requirements.txt
          echo "Fetched upstream requirements.txt"
          if grep -q "pyreqwest-impersonate" /tmp/upstream-requirements.txt; then
            echo "PYREQWEST_PRESENT=true" >> "$GITHUB_ENV"
            echo "WARNING: pyreqwest-impersonate found in upstream requirements"
          else
            echo "PYREQWEST_PRESENT=false" >> "$GITHUB_ENV"
          fi

      - name: Update Dockerfile upstream pins
        run: |
          sed -i 's/^ARG AGENT_ZERO_REF=.*/ARG AGENT_ZERO_REF=${{ needs.check-upstream.outputs.new_tag }}/' "${{ env.DOCKERFILE }}"
          if grep -q '^ARG AGENT_ZERO_UPSTREAM_VERSION=' "${{ env.DOCKERFILE }}"; then
            sed -i 's/^ARG AGENT_ZERO_UPSTREAM_VERSION=.*/ARG AGENT_ZERO_UPSTREAM_VERSION=${{ needs.check-upstream.outputs.new_tag }}/' "${{ env.DOCKERFILE }}"
          fi

      - name: Update upstream-constraints.txt if needed
        run: |
          CONSTRAINTS_FILE="pmoves/services/agent-zero/upstream-constraints.txt"
          if [ "${PYREQWEST_PRESENT}" = "true" ]; then
            if [ ! -f "${CONSTRAINTS_FILE}" ]; then
              echo "# upstream-constraints.txt" > "${CONSTRAINTS_FILE}"
              echo "# Transitive dependency pins for agent-zero upstream Stage 1 install" >> "${CONSTRAINTS_FILE}"
              echo "" >> "${CONSTRAINTS_FILE}"
            fi
            if ! grep -q "pyreqwest-impersonate" "${CONSTRAINTS_FILE}"; then
              echo "pyreqwest-impersonate<0.5.5" >> "${CONSTRAINTS_FILE}"
              echo "Added pyreqwest-impersonate<0.5.5 to constraints"
            else
              echo "pyreqwest-impersonate pin already present in constraints"
            fi
          else
            echo "No constraint update needed"
          fi

      - name: Commit and push
        run: |
          BRANCH="chore/agent-zero-upstream-${{ needs.check-upstream.outputs.new_tag }}"
          git checkout -b "${BRANCH}"
          git add -A
          git commit -m "chore(agent-zero): bump upstream to ${{ needs.check-upstream.outputs.new_tag }}"
          # IDEMPOTENCY. This job only runs when check_pr found NO open PR for
          # this branch (see the `if:` on create-pr). So if the branch exists
          # remotely, it is debris from an earlier run that pushed it and then
          # died before opening the PR -- which is exactly what happened here
          # for months while create-pr could not run at all. Without this, the
          # workflow is permanently wedged by its own leftovers: every rerun
          # fails non-fast-forward at push.
          #
          # Deleted rather than force-pushed so the intent is explicit, and
          # narrowed to a branch with no open PR so a maintainer's in-progress
          # work on a real bump PR is never touched.
          git push origin --delete "${BRANCH}" 2>/dev/null || true
          git push origin "${BRANCH}"

      - name: Measure the fork's divergence from the new tag
        id: divergence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The review checklist used to carry two HARDCODED numbers -- "24
          # overlay commits" and "6 conflicting files" -- in a template where
          # every other field was interpolated. They were true once and were
          # reprinted unchanged on every bump after. Measured 2026-08-30, the
          # real figures for v2.11 were 51 commits (30 non-merge) and 37 files.
          #
          # An unreachable API must NOT fall back to a plausible-looking number:
          # that is how the literals survived. It emits "unmeasured", and the
          # checklist says so.
          FORK_OWNER="${FORK_REPO%%/*}"
          FORK_NAME="${FORK_REPO##*/}"
          if CMP=$(gh api                 "repos/${UPSTREAM_REPO}/compare/${{ needs.check-upstream.outputs.new_tag }}...${FORK_OWNER}:${FORK_NAME}:${FORK_BRANCH}"                 2>/dev/null); then
            AHEAD=$(jq -r '.ahead_by' <<<"$CMP")
            BEHIND=$(jq -r '.behind_by' <<<"$CMP")
            FILES=$(jq -r '.files | length' <<<"$CMP")
            MERGES=$(jq -r '[.commits[] | select(.parents | length > 1)] | length' <<<"$CMP")
            SUBSTANTIVE=$(( AHEAD - MERGES ))
            {
              echo "OVERLAY_COMMITS=**${AHEAD}** overlay commits (${SUBSTANTIVE} non-merge)"
              echo "DIVERGED_FILES=the **${FILES}** files that differ from upstream"
              echo "UPSTREAM_BEHIND=${BEHIND}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "OVERLAY_COMMITS=overlay commits (count UNMEASURED -- compare API unreachable)"
              echo "DIVERGED_FILES=the diverged files (count UNMEASURED -- compare API unreachable)"
              echo "UPSTREAM_BEHIND=unmeasured"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft PR
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/agent-zero-upstream-${{ needs.check-upstream.outputs.new_tag }}"
          TAG="${{ needs.check-upstream.outputs.new_tag }}"
          TAG_NO_V="${TAG#v}"
          CURRENT_TAG="${{ needs.check-upstream.outputs.current_tag }}"

          cat > /tmp/pr_body.md << 'PRBODY'
          ## Upstream Version Bump

          **Upstream:** agent0ai/agent-zero `${{ needs.check-upstream.outputs.new_tag }}`
          **Previous:** `${{ needs.check-upstream.outputs.current_tag }}`

          ### What this PR does
          - Bumps `AGENT_ZERO_REF` in `Dockerfile.multiarch` to `${{ needs.check-upstream.outputs.new_tag }}`
          - Updates `upstream-constraints.txt` if transitive dep pins needed

          ### ⚠️ Fork Sync Required
          This PR bumps the Dockerfile to clone from upstream tag `${{ needs.check-upstream.outputs.new_tag }}`, but the PMOVES fork branch has not been synced yet.

          **Before this PR can pass CI, a maintainer must:**
          1. Sync `POWERFULMOVES/PMOVES-Agent-Zero` to upstream `${{ needs.check-upstream.outputs.new_tag }}`
          2. Create fork branch `PMOVES.AI-Edition-${{ needs.check-upstream.outputs.new_version }}` with PMOVES overlays applied
          3. Update this PR to use the fork branch instead of upstream tag:
             - Change `AGENT_ZERO_REF=${{ needs.check-upstream.outputs.new_tag }}` → `AGENT_ZERO_REF=PMOVES.AI-Edition-${{ needs.check-upstream.outputs.new_version }}`
             - Change `AGENT_ZERO_REPO` if needed

          ### Review Checklist
          - [ ] Fork sync completed with all ${{ steps.divergence.outputs.OVERLAY_COMMITS }}
          - [ ] ${{ steps.divergence.outputs.DIVERGED_FILES }} re-implemented on the new upstream architecture
          - [ ] Fork is **${{ steps.divergence.outputs.UPSTREAM_BEHIND }}** upstream commits behind `${{ needs.check-upstream.outputs.new_tag }}`
          - [ ] NATS compatibility verified
          - [ ] API schema changes reviewed
          - [ ] Healthcheck endpoint confirmed
          - [ ] Config format changes documented
          - [ ] `upstream-constraints.txt` pins verified against new transitive deps
          - [ ] CVE check: `pip-audit -r requirements.txt`

          ---
          _Auto-generated by agent-zero-upstream-check workflow_
          PRBODY

          # `gh pr create` prints the PR URL on stdout. It has no --json, so
          # it has no --jq either: passing one makes gh dump its usage and
          # exit 1. The PR number is the last path segment of the URL.
          PR_URL=$(gh pr create --draft \
            --title "chore(agent-zero): bump upstream to ${TAG}" \
            --body-file /tmp/pr_body.md \
            --label "upstream-update,dependencies")
          PR_NUM="${PR_URL##*/}"

          echo "PR_NUMBER=${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "BRANCH_NAME=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Created draft PR #${PR_NUM}"

  post-ci:
    needs: create-pr
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Skip if no PR was created
        if: needs.create-pr.result != 'success'
        run: |
          echo "create-pr job did not succeed (result: ${{ needs.create-pr.result }}), skipping post-CI"
          exit 0

      - name: Checkout repository
        if: needs.create-pr.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 SHA-pinned to match integrations-ghcr.yml convention
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Wait for CI checks to complete
        if: needs.create-pr.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.create-pr.outputs.pr_number }}
          BRANCH_NAME: ${{ needs.create-pr.outputs.branch_name }}
        run: |
          echo "Waiting for CI on PR #${PR_NUMBER} (branch: ${BRANCH_NAME})..."
          TIMEOUT=1800
          INTERVAL=60
          ELAPSED=0

          while [ "${ELAPSED}" -lt "${TIMEOUT}" ]; do
            RUN_INFO=$(gh run list --branch "${BRANCH_NAME}" --limit 1 --json databaseId,status,conclusion --jq '.[0]')
            STATUS=$(echo "${RUN_INFO}" | jq -r '.status')
            CONCLUSION=$(echo "${RUN_INFO}" | jq -r '.conclusion')

            echo "  [${ELAPSED}s] Status: ${STATUS}, Conclusion: ${CONCLUSION}"

            if [ "${STATUS}" = "completed" ]; then
              echo "CI_RUN_CONCLUSION=${CONCLUSION}" >> "$GITHUB_ENV"
              echo "CI completed with conclusion: ${CONCLUSION}"
              break
            fi

            sleep "${INTERVAL}"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ "${ELAPSED}" -ge "${TIMEOUT}" ]; then
            echo "CI_RUN_CONCLUSION=timed_out" >> "$GITHUB_ENV"
            echo "Timed out waiting for CI after ${TIMEOUT}s"
          fi

      - name: Handle CI result
        if: needs.create-pr.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.create-pr.outputs.pr_number }}
        run: |
          if [ "${CI_RUN_CONCLUSION}" = "success" ]; then
            gh pr edit "${PR_NUMBER}" --add-label "ready-for-review"
            gh pr comment "${PR_NUMBER}" --body "✅ All CI checks passed. Ready for maintainer review."
          else
            BRANCH="${{ needs.create-pr.outputs.branch_name }}"
            RUN_ID=$(gh run list --branch "${BRANCH}" --limit 1 --json databaseId --jq '.[0].databaseId')

            FAILED_JOBS=""
            if [ -n "${RUN_ID}" ] && [ "${RUN_ID}" != "null" ]; then
              FAILED_JOBS=$(gh run view "${RUN_ID}" --json jobs --jq '[.jobs[] | select(.conclusion == "failure") | "- `\(.name)`: \(.conclusion)"] | join("\n")')
            fi

            # Built with a brace group instead of a heredoc. The heredoc here
            # used `<< 'COMMENT'` with an INDENTED terminator, so bash never
            # found it and swallowed the rest of the script:
            #     line 31: syntax error: unexpected end of file
            # `<<` requires the delimiter at column 0; `<<-` strips only TABS,
            # not the spaces this file is indented with. The placeholder+sed
            # dance it needed also nested double quotes inside a double-quoted
            # sed expression. A brace group has neither problem.
            [ -n "${FAILED_JOBS}" ] || FAILED_JOBS="- CI did not complete or timed out"
            {
              echo "## CI Failure Analysis"
              echo
              echo "The following checks failed:"
              echo "${FAILED_JOBS}"
              echo
              echo "### Likely Cause"
              echo "The Dockerfile is currently pointed at the upstream tag, but the PMOVES fork has not been synced yet. This is expected behaviour."
              echo
              echo "### Next Steps"
              echo "1. Complete the fork sync process (see PR description)"
              echo "2. Update \`AGENT_ZERO_REF\` to point to the synced fork branch"
              echo "3. Push the update — CI will re-run automatically"
            } > /tmp/failure_comment.md
            gh pr comment "${PR_NUMBER}" --body-file /tmp/failure_comment.md
          fi
