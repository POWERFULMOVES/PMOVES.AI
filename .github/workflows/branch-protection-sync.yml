name: Branch Protection Sync

# Applies a STANDARD branch-protection policy to every PMOVES fork's consumable
# (gitlink-tracked) branch — closing the audit gap where "hardened" branches had
# NO protection (force-push / deletion / direct-push all allowed). See
# deploy/runbooks/github-app-permission-matrix.md and
# pmoves/docs/operations/GITHUB_APP.md § Branch protection.
#
# WHY this exists: a 2026-06-09 audit found 8/11 hardened fork branches were
# unprotected or had zero required checks — a "hardened" branch with no gate is
# aspirational. fork-sync pushes upstream merges through sync/* PRs; without
# protection nothing stops a force-push from silently stripping the hardening
# overlay.
#
# PREREQUISITE (operator, one-time): the PMOVES.AI GitHub App installation must
# have **Administration: Read & Write** granted (App settings → Permissions tab;
# checklist in github-app-permission-matrix.md §8). If it is NOT granted, the
# token-mint step below FAILS — so this workflow doubles as a live validation of
# the grant (something the in-repo docs disagreed on as of 2026-06-09).
#
# SAFETY: default is dry_run=true (audit only, no writes). The policy is designed
# NOT to deadlock automation — required_approving_review_count=0 means a PR is
# REQUIRED (no direct pushes) but the App / dependabot can still self-merge.

# TRIGGERS: coverage is derived from .gitmodules, so it must follow .gitmodules.
# Before this workflow had a push/schedule trigger it was dispatch-only and had
# run three times ever (last: 2026-06-10). Every submodule added or re-pointed
# since silently fell out of coverage — 15 consumed branches ended up with no
# protection at all, none of them because the workflow got anything wrong. See
# pmoves/docs/audit/FLEET_RULESET_EXPOSURE_2026-08-10.md.
#
#   push (.gitmodules)  — the primary vector. A submodule added or re-pointed
#                         is exactly the event that drops it from coverage, so
#                         the check runs on the commit that causes it.
#   schedule (weekly)   — backstop for drift that does NOT touch .gitmodules:
#                         a fork's branch renamed or deleted, protection removed
#                         by hand, a new fork created outside a superproject
#                         commit. Weekly, not daily, because push already covers
#                         the frequent vector and a daily audit that nobody reads
#                         is noise rather than signal.
#
# SAFETY — automated runs are AUDIT-ONLY and cannot write.
# `inputs.*` is empty on any trigger other than workflow_dispatch, and the script
# tests `[ "$DRY_RUN" = "true" ]`. An unguarded schedule/push trigger would
# therefore evaluate DRY_RUN="" as "not dry run" and issue live PUTs across every
# derived fork, with ONLY_UNPROTECTED="" also disabling the gap-only filter — a
# fleet-wide write on the first tick. The env block below pins both to "true" for
# non-dispatch events. Writing stays a deliberate human act: workflow_dispatch
# with dry_run=false. See the env block for how to arm it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Audit only — report current protection, write nothing.'
        required: false
        type: boolean
        default: true
      only_unprotected:
        description: 'Skip branches that already have ANY protection (only fix the gaps).'
        required: false
        type: boolean
        default: false
      required_reviews:
        description: 'Required approving reviews (0 = require PR but allow automation self-merge).'
        required: false
        default: '0'
  push:
    branches: [main]
    paths:
      - '.gitmodules'
  schedule:
    # Mondays 06:00 UTC — audit-only, see SAFETY above.
    - cron: '0 6 * * 1'

permissions: {}

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Derive (fork, branch) from .gitmodules — self-maintaining (new submodules
      # auto-covered) and the SINGLE source for both the token scope and the apply
      # loop, so they can never drift (a hardcoded list would 403 the forks it
      # missed). Only POWERFULMOVES-owned forks.
      - name: Derive fork list from .gitmodules
        id: forks
        run: |
          : > forks.tsv
          while read key url; do
            name="${key#submodule.}"; name="${name%.url}"
            case "$url" in *github.com[:/]POWERFULMOVES/*) : ;; *) continue ;; esac
            repo="${url##*/}"; repo="${repo%.git}"
            branch=$(git config -f .gitmodules --get "submodule.${name}.branch")
            [ -z "$branch" ] && branch="main"
            printf '%s\t%s\n' "$repo" "$branch" >> forks.tsv
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.url$')
          sort -u forks.tsv -o forks.tsv
          echo "Derived $(wc -l < forks.tsv) fork/branch pair(s):"
          sed 's/^/  /' forks.tsv
          # Token scope = the exact, deduped repo set (least privilege).
          {
            echo "repos<<__EOF__"
            cut -f1 forks.tsv | sort -u
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # PRE-MINT RESOLUTION. The scoped mint below takes ONE repository list and
      # fails the whole job if ANY name is not an installation repo, with an error
      # that names none of them ("at least one repository that does not exist or
      # is not accessible to the parent installation"). That is how a single
      # rename (PMOVES-N8N-Auto -> PMOVES-N8N) took this audit dark for all 80
      # forks from 2026-09-20 on (runs 35503913554, 35599311111).
      #
      # So first mint an installation-wide token that can only READ METADATA, and
      # resolve every derived name through REST. REST follows renames/transfers,
      # so `.full_name` reveals the canonical name the scoped mint needs.
      #
      # POLICY: FAIL and NAME every renamed / missing repo. Do NOT substitute the
      # redirect target. Reasons:
      #   1. .gitmodules is the single source for this workflow AND for every
      #      `git submodule update` clone; substituting here would hide a stale url
      #      that is still broken (or silently redirected) everywhere else.
      #   2. A redirect is not a stable identity. GitHub names are
      #      case-insensitive and a vacated name can be re-claimed: PMOVES-n8n now
      #      resolves to the fork formerly called PMOVES-N8N-Auto, not the flows
      #      repo it named before (#3115). Following redirects would have pointed
      #      branch-protection writes at a repo .gitmodules never named.
      #   3. This job has admin:write downstream; its target set should be exactly
      #      what a reviewed .gitmodules says, never what a redirect implies.
      # Case-only differences are reported as notices, not failures (names are
      # case-insensitive, so the scoped mint accepts them).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: probe-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read

      - name: Resolve derived repos to canonical names (fail naming any drift)
        env:
          GH_TOKEN: ${{ steps.probe-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          bad=0; ok=0
          {
            echo "### Repo resolution (.gitmodules -> GitHub canonical name)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # ZERO-INPUT GUARD. A missing or empty forks.tsv makes the loop below
          # run zero times with bad=0, and the step would pass VACUOUSLY -- the
          # silent dark-out this step exists to prevent. Count the input first
          # (outside process substitution, whose failure `-e` cannot see) and
          # require every row to resolve.
          if [ ! -s forks.tsv ]; then
            echo "::error title=branch-protection-sync: no input::forks.tsv is missing or empty; nothing was resolved (input=0 resolved=0). The derive step produced no repos."
            echo "- NO INPUT: forks.tsv missing or empty (input=0 resolved=0)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          repos=$(cut -f1 forks.tsv | sort -u | sed '/^[[:space:]]*$/d')
          n=$(printf '%s\n' "$repos" | sed '/^$/d' | wc -l)
          while read -r repo; do
            [ -z "$repo" ] && continue
            want="${OWNER}/${repo}"
            # `if !` form: Actions runs `bash -e`, so a bare failing assignment
            # would abort here before the repo could be named.
            if ! full=$(gh api "repos/${want}" --jq .full_name 2>/tmp/resolve_err) || [ -z "$full" ]; then
              # Single line, capped at 160 (parity with the main loop): an
              # annotation must not be split or flooded by an error body.
              msg=$(head -1 /tmp/resolve_err | tr -d '\r' | tr '\n' ' ' | cut -c1-160)
              echo "::error title=branch-protection-sync: unresolvable repo::${want} (from .gitmodules) does not exist or is not in the App installation: ${msg}"
              echo "- MISSING: \`${want}\` — ${msg}" >> "$GITHUB_STEP_SUMMARY"
              bad=$((bad+1)); continue
            fi
            if [ "$full" = "$want" ]; then
              ok=$((ok+1))
            elif [ "${full,,}" = "${want,,}" ]; then
              echo "::notice title=branch-protection-sync: case-only difference::${want} is canonically ${full}"
              ok=$((ok+1))
            else
              echo "::error title=branch-protection-sync: renamed repo::${want} (from .gitmodules) now resolves to ${full}. Repoint the submodule url in .gitmodules and the fork_registry.json key."
              echo "- RENAMED: \`${want}\` -> \`${full}\`" >> "$GITHUB_STEP_SUMMARY"
              bad=$((bad+1))
            fi
          done <<< "$repos"
          echo "input=${n} resolved=${ok} drifted=${bad}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "input=${n} resolved=${ok} drifted=${bad}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bad" -gt 0 ]; then
            echo "::error::${bad} repo name(s) derived from .gitmodules do not resolve to themselves; the scoped token mint would fail opaquely. Fix .gitmodules (see errors above)."
            exit 1
          fi
          # Positive proof, not absence of errors: every input row resolved.
          if [ "$n" -eq 0 ] || [ "$ok" -ne "$n" ]; then
            echo "::error title=branch-protection-sync: incomplete resolution::input=${n} resolved=${ok}; refusing to mint on a partial or empty repo set."
            exit 1
          fi

      # Mint INLINE in this job (not via _app-token.yml) on purpose: the token is
      # consumed in the SAME job as the API calls, sidestepping the cross-job
      # output-token auto-revoke nuance of the reusable (branch-protection-sync
      # would be its first real consumer). _app-token.yml gains the matching
      # permission-administration knob in this PR for future / Pages use.
      #
      # If the App lacks the Administration grant, THIS step fails with
      # "the app does not have permission to request 'administration'" — that is
      # the intended live validation of the operator grant.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.forks.outputs.repos }}
          permission-administration: write
          permission-contents: read

      - name: Apply standard branch protection
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Non-dispatch events carry no inputs, and the script treats an empty
          # DRY_RUN as "write". Pin both flags for schedule/push so an automated
          # run can only ever audit, and can only ever look at gaps.
          #
          # To ARM live writes, the operator runs the workflow manually:
          #   Actions -> Branch Protection Sync -> Run workflow
          #     dry_run: false            (issues the PUTs)
          #     only_unprotected: true    (add protection where there is none;
          #                                leave already-protected branches alone)
          # only_unprotected=false rewrites every derived branch from the policy
          # below, which LOWERS any branch currently stricter than it — see the
          # downgrade table in the PR that added these triggers.
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.dry_run }}
          ONLY_UNPROTECTED: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.only_unprotected }}
          REQUIRED_REVIEWS: ${{ inputs.required_reviews || '0' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set +e  # best-effort per-fork loop; we summarize at the end

          # Standard policy for a consumable/hardened mirror branch:
          #   - require a PR before merging (blocks direct pushes to the branch)
          #     with REQUIRED_REVIEWS approvals (default 0 => automation can still
          #     self-merge sync/* + dependabot PRs; the real gates are CodeRabbit
          #     on the fork + the parent gitlink-promote checks)
          #   - NO force pushes (prevents history rewrite that strips hardening)
          #   - NO deletions (prevents accidental branch loss)
          #   - require conversation resolution
          #   - enforce_admins=false (operator/admin can break-glass; matches the
          #     sanctioned --admin merge path for self-authored fleet PRs)
          #   - required_status_checks: PRESERVE whatever the branch already has
          #     (passed in as $1). We never null-out a fork that already gates on
          #     CI (e.g. Agent-Zero/Archon/DoX) — that would be a downgrade. Naked
          #     branches get null (operators add per-fork contexts deliberately;
          #     requiring an un-greenable fork-secret check would permanently block).
          # Built with jq (not a heredoc) so the body is always valid JSON and
          # $rsc is injected as real JSON, not interpolated text.
          policy() {
            jq -cn --argjson rsc "${1:-null}" --argjson rev "${REQUIRED_REVIEWS:-0}" '{
              required_status_checks: $rsc,
              enforce_admins: false,
              required_pull_request_reviews: {required_approving_review_count: $rev, dismiss_stale_reviews: true},
              restrictions: null,
              allow_force_pushes: false,
              allow_deletions: false,
              required_conversation_resolution: true,
              required_linear_history: false
            }'
          }

          # Normalize a GET .../protection response into the SAME shape policy()
          # emits, so current vs intended can be diffed field by field. A PUT
          # replaces the whole object, so fields policy() omits (code-owner
          # reviews, last-push approval, lock/block) are reset to false — they are
          # included here so a would-be downgrade shows up as a change.
          normalize() {
            jq -c '{
              required_status_checks: (if .required_status_checks then {strict: .required_status_checks.strict, contexts: .required_status_checks.contexts} else null end),
              enforce_admins: (.enforce_admins.enabled // false),
              required_pull_request_reviews: (if .required_pull_request_reviews then {
                required_approving_review_count: (.required_pull_request_reviews.required_approving_review_count // 0),
                dismiss_stale_reviews: (.required_pull_request_reviews.dismiss_stale_reviews // false),
                require_code_owner_reviews: (.required_pull_request_reviews.require_code_owner_reviews // false),
                require_last_push_approval: (.required_pull_request_reviews.require_last_push_approval // false)
              } else null end),
              restrictions: (if .restrictions then "set" else null end),
              allow_force_pushes: (.allow_force_pushes.enabled // false),
              allow_deletions: (.allow_deletions.enabled // false),
              required_conversation_resolution: (.required_conversation_resolution.enabled // false),
              required_linear_history: (.required_linear_history.enabled // false),
              lock_branch: (.lock_branch.enabled // false),
              block_creations: (.block_creations.enabled // false)
            }'
          }
          # Intended state in normalized shape (policy() + the reset defaults).
          intended() {
            policy "$1" | jq -c '. + {
              required_pull_request_reviews: (.required_pull_request_reviews + {require_code_owner_reviews: false, require_last_push_approval: false}),
              lock_branch: false, block_creations: false
            }'
          }

          # Field-level diff over the UNION of keys in current and intended,
          # so a field present on only one side is still reported. Review
          # sub-fields are named individually (count and last-push approval are
          # separate operator decisions). -e: jq exits non-zero on bad input.
          fielddiff() {
            jq -ern --argjson a "$1" --argjson b "$2" '
              def ks($x; $y): (($x // {}) | keys) + (($y // {}) | keys) | unique;
              [ ks($a; $b)[] as $k |
                if $k == "required_pull_request_reviews"
                   and ($a[$k] | type) == "object" and ($b[$k] | type) == "object" then
                  (ks($a[$k]; $b[$k])[] as $j | select($a[$k][$j] != $b[$k][$j]) | "reviews." + $j)
                else select($a[$k] != $b[$k]) | $k end
              ] | join(",")'
          }

          # Markdown-table cell: a literal | would split the column.
          md() { printf '%s' "$1" | tr '\n' ' ' | sed 's/|/\\|/g'; }

          # COULD-NOT-MEASURE is never silent. A branch whose state we could not
          # read or parse is annotated (warning in a dry run, error in a live
          # run), logged, tabled and counted, and is NEVER written: a PUT built
          # from an unparsed response would null out its existing required
          # checks. A live run with any unreadable branch exits 3.
          unreadable() {
            local rb="$1" why="$2"
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning title=branch-protection-sync: UNREADABLE::${rb}: ${why}"
            else
              echo "::error title=branch-protection-sync: UNREADABLE::${rb}: ${why} (not written)"
            fi
            echo "  ? ${rb}: UNREADABLE — ${why}"
            echo "| $(md "$rb") | UNREADABLE: $(md "$why") | ? | ${REQUIRED_REVIEWS:-0} | unknown |" >> "$GITHUB_STEP_SUMMARY"
            UNREADABLE=$((UNREADABLE+1))
          }

          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "### Dry run — current vs intended (required_reviews=${REQUIRED_REVIEWS:-0})"
            else
              echo "### Live run (required_reviews=${REQUIRED_REVIEWS:-0})"
            fi
            echo ""
            echo "| repo@branch | state | reviews current | reviews intended | would change |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          APPLIED=0; SKIPPED=0; FAILED=0; WOULD=0; NOOP=0; UNREADABLE=0
          while IFS="$(printf '\t')" read -r repo branch; do
            [ -z "$repo" ] && continue
            rb="${repo}@${branch}"

            # State detection via EXIT CODE — gh api prints the 404/403 error JSON
            # to stdout, so testing output-emptiness mis-reads every branch as
            # "protected". Branch on the actual HTTP result instead.
            cur=$(gh api "repos/${OWNER}/${repo}/branches/${branch}/protection" 2>/tmp/bp_err)
            rc=$?
            rsc="null"
            reviews_now="none"
            if [ "$rc" -eq 0 ]; then
              # Parse everything up front; any failure -> UNREADABLE, never a
              # (rsc deliberately has no jq -e: null is its VALID answer for a
              # branch without required checks, and -e treats null as failure)
              # silent empty value (set +e above means jq failures do not abort).
              if ! printf '%s' "$cur" | jq -e 'type == "object"' >/dev/null 2>&1 \
                 || ! parsed=$(printf '%s' "$cur" | jq -er '[
                      (.required_status_checks.contexts // [] | length | tostring),
                      (.allow_force_pushes.enabled | tostring),
                      (.allow_deletions.enabled | tostring),
                      (if .required_pull_request_reviews then (.required_pull_request_reviews.required_approving_review_count // 0 | tostring) else "none" end)
                    ] | join("\t")' 2>/dev/null) \
                 || ! rsc=$(printf '%s' "$cur" | jq -c 'if .required_status_checks then {strict: .required_status_checks.strict, contexts: .required_status_checks.contexts} else null end' 2>/dev/null) \
                 || [ -z "$rsc" ] \
                 || ! now=$(printf '%s' "$cur" | normalize 2>/dev/null) || [ -z "$now" ]; then
                unreadable "$rb" "HTTP 200 but the protection response did not parse as expected"
                continue
              fi
              IFS="$(printf '\t')" read -r checks force del reviews_now <<< "$parsed"
              state="protected[checks=${checks} force=${force} del=${del} reviews=${reviews_now}]"
            elif grep -qiE 'Upgrade to GitHub Pro|make this repository public' /tmp/bp_err; then
              echo "  s ${rb}: SKIP — needs GitHub Pro (private repo) or public visibility"
              echo "| $(md "$rb") | needs-pro (skip) | – | – | no |" >> "$GITHUB_STEP_SUMMARY"
              SKIPPED=$((SKIPPED+1)); continue
            elif grep -qi 'Branch not protected' /tmp/bp_err; then
              state="UNPROTECTED"
            else
              # 404 branch-missing, 403, 5xx: we could NOT read the state. Do not
              # report it as UNPROTECTED — that is a claim we have no evidence for.
              unreadable "$rb" "$(tr '\n' ' ' < /tmp/bp_err | cut -c1-160)"
              continue
            fi

            if [ "$ONLY_UNPROTECTED" = "true" ] && [ "$state" != "UNPROTECTED" ]; then
              echo "  = ${rb}: ${state} (skip, already protected)"
              echo "| $(md "$rb") | $(md "$state") (skip) | ${reviews_now} | – | no |" >> "$GITHUB_STEP_SUMMARY"
              SKIPPED=$((SKIPPED+1)); continue
            fi

            if ! want=$(intended "$rsc" 2>/dev/null) || [ -z "$want" ]; then
              unreadable "$rb" "could not build the intended policy from preserved checks=${rsc}"
              continue
            fi
            if [ "$state" = "UNPROTECTED" ]; then
              changed="(all — unprotected)"
            elif ! changed=$(fielddiff "$now" "$want" 2>/dev/null); then
              unreadable "$rb" "field diff failed (current vs intended did not compare)"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              if [ -z "$changed" ]; then
                echo "  . ${rb}: ${state} -> no change"
                NOOP=$((NOOP+1)); verdict="no"
              else
                echo "  ~ ${rb}: ${state} -> WOULD change [${changed}] reviews ${reviews_now}->${REQUIRED_REVIEWS:-0} (preserve checks=${rsc})"
                WOULD=$((WOULD+1)); verdict="yes: ${changed}"
              fi
              echo "| $(md "$rb") | $(md "$state") | ${reviews_now} | ${REQUIRED_REVIEWS:-0} | $(md "$verdict") |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            out=$(policy "$rsc" | gh api -X PUT "repos/${OWNER}/${repo}/branches/${branch}/protection" --input - 2>&1)
            if [ $? -eq 0 ]; then
              echo "  + ${rb}: applied (checks preserved=${rsc})"
              echo "| $(md "$rb") | $(md "$state") | ${reviews_now} | ${REQUIRED_REVIEWS:-0} | applied: $(md "${changed:-no field change}") |" >> "$GITHUB_STEP_SUMMARY"
              APPLIED=$((APPLIED+1))
            else
              echo "  ! ${rb}: FAILED"; FAILED=$((FAILED+1))
              echo "$out" | head -3 | sed 's/^/      /'
              echo "::error title=branch-protection-sync: PUT failed::${rb}: $(printf '%s' "$out" | head -1 | cut -c1-160)"
              echo "| $(md "$rb") | $(md "$state") | ${reviews_now} | ${REQUIRED_REVIEWS:-0} | FAILED: $(md "$(printf '%s' "$out" | head -1 | cut -c1-120)") |" >> "$GITHUB_STEP_SUMMARY"
              case "$out" in
                *"Upgrade to GitHub Pro"*|*"make this repository public"*)
                  echo "      -> needs GitHub Pro (private repo) or public visibility." ;;
                *403*|*"Resource not accessible"*)
                  echo "      -> 403: App may lack Administration:write, or fork outside minted scope (matrix §8)." ;;
                *404*|*"Branch not found"*)
                  echo "      -> 404: tracked branch '${branch}' missing on ${repo} (fix .gitmodules)." ;;
              esac
            fi
          done < forks.tsv

          echo ""
          echo "Done. dry_run=${DRY_RUN} only_unprotected=${ONLY_UNPROTECTED} reviews=${REQUIRED_REVIEWS}"
          if [ "$DRY_RUN" = "true" ]; then
            totals="would_change=${WOULD} no_change=${NOOP} skipped=${SKIPPED} unreadable=${UNREADABLE}"
          else
            totals="applied=${APPLIED} skipped=${SKIPPED} failed=${FAILED} unreadable=${UNREADABLE}"
          fi
          echo "$totals"
          { echo ""; echo "$totals"; } >> "$GITHUB_STEP_SUMMARY"
          echo "Legend: ~ would-change  . no-change  + applied  = skipped(protected)  s skipped(needs-pro)  ? unreadable(could not read/parse — NOT written)  ! failed"
          if [ "$UNREADABLE" -gt 0 ]; then
            echo "::warning title=branch-protection-sync::${UNREADABLE} branch(es) could not be measured; see the UNREADABLE rows."
          fi
          # Exit-code doctrine (0 clean / 1 findings / 3 could-not-measure).
          # Dry runs always exit 0: they write nothing, and the push/schedule
          # audit keeps its annotations without going red on a transient 5xx.
          # Live runs, by precedence:
          #   any FAILED PUT            -> 1  (a write was attempted and did not
          #                                    land: branches left unprotected)
          #   else any UNREADABLE       -> 3  (could not see the target; not written)
          #   else                      -> 0
          # FAILED outranks UNREADABLE because it is a measured failure, not an
          # unmeasured one.
          if [ "$DRY_RUN" != "true" ]; then
            if [ "$FAILED" -gt 0 ]; then
              echo "::error title=branch-protection-sync::${FAILED} PUT(s) failed (unreadable=${UNREADABLE}); exiting 1."
              exit 1
            fi
            if [ "$UNREADABLE" -gt 0 ]; then exit 3; fi
          fi
          exit 0
