name: Branch Protection Sync

# Applies a STANDARD branch-protection policy to every PMOVES fork's consumable
# (gitlink-tracked) branch — closing the audit gap where "hardened" branches had
# NO protection (force-push / deletion / direct-push all allowed). See
# deploy/runbooks/github-app-permission-matrix.md and
# pmoves/docs/operations/GITHUB_APP.md § Branch protection.
#
# WHY this exists: a 2026-06-09 audit found 8/11 hardened fork branches were
# unprotected or had zero required checks — a "hardened" branch with no gate is
# aspirational. fork-sync pushes upstream merges through sync/* PRs; without
# protection nothing stops a force-push from silently stripping the hardening
# overlay.
#
# PREREQUISITE (operator, one-time): the PMOVES.AI GitHub App installation must
# have **Administration: Read & Write** granted (App settings → Permissions tab;
# checklist in github-app-permission-matrix.md §8). If it is NOT granted, the
# token-mint step below FAILS — so this workflow doubles as a live validation of
# the grant (something the in-repo docs disagreed on as of 2026-06-09).
#
# SAFETY: default is dry_run=true (audit only, no writes). The policy is designed
# NOT to deadlock automation — required_approving_review_count=0 means a PR is
# REQUIRED (no direct pushes) but the App / dependabot can still self-merge.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Audit only — report current protection, write nothing.'
        required: false
        type: boolean
        default: true
      only_unprotected:
        description: 'Skip branches that already have ANY protection (only fix the gaps).'
        required: false
        type: boolean
        default: false
      required_reviews:
        description: 'Required approving reviews (0 = require PR but allow automation self-merge).'
        required: false
        default: '0'

permissions: {}

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Derive (fork, branch) from .gitmodules — self-maintaining (new submodules
      # auto-covered) and the SINGLE source for both the token scope and the apply
      # loop, so they can never drift (a hardcoded list would 403 the forks it
      # missed). Only POWERFULMOVES-owned forks.
      - name: Derive fork list from .gitmodules
        id: forks
        run: |
          : > forks.tsv
          while read key url; do
            name="${key#submodule.}"; name="${name%.url}"
            case "$url" in *github.com[:/]POWERFULMOVES/*) : ;; *) continue ;; esac
            repo="${url##*/}"; repo="${repo%.git}"
            branch=$(git config -f .gitmodules --get "submodule.${name}.branch")
            [ -z "$branch" ] && branch="main"
            printf '%s\t%s\n' "$repo" "$branch" >> forks.tsv
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.url$')
          sort -u forks.tsv -o forks.tsv
          echo "Derived $(wc -l < forks.tsv) fork/branch pair(s):"
          sed 's/^/  /' forks.tsv
          # Token scope = the exact, deduped repo set (least privilege).
          {
            echo "repos<<__EOF__"
            cut -f1 forks.tsv | sort -u
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # Mint INLINE in this job (not via _app-token.yml) on purpose: the token is
      # consumed in the SAME job as the API calls, sidestepping the cross-job
      # output-token auto-revoke nuance of the reusable (branch-protection-sync
      # would be its first real consumer). _app-token.yml gains the matching
      # permission-administration knob in this PR for future / Pages use.
      #
      # If the App lacks the Administration grant, THIS step fails with
      # "the app does not have permission to request 'administration'" — that is
      # the intended live validation of the operator grant.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_SEC }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.forks.outputs.repos }}
          permission-administration: write
          permission-contents: read

      - name: Apply standard branch protection
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY_UNPROTECTED: ${{ inputs.only_unprotected }}
          REQUIRED_REVIEWS: ${{ inputs.required_reviews || '0' }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set +e  # best-effort per-fork loop; we summarize at the end

          # Standard policy for a consumable/hardened mirror branch:
          #   - require a PR before merging (blocks direct pushes to the branch)
          #     with REQUIRED_REVIEWS approvals (default 0 => automation can still
          #     self-merge sync/* + dependabot PRs; the real gates are CodeRabbit
          #     on the fork + Trivy on the parent gitlink-promote)
          #   - NO force pushes (prevents history rewrite that strips hardening)
          #   - NO deletions (prevents accidental branch loss)
          #   - require conversation resolution
          #   - enforce_admins=false (operator/admin can break-glass; matches the
          #     sanctioned --admin merge path for self-authored fleet PRs)
          #   - required_status_checks=null by default: fork CI contexts vary and
          #     many need fork-only secrets (E2E/Docker) — requiring one that can
          #     never go green would PERMANENTLY block the branch. Operators add
          #     per-fork required contexts later, deliberately.
          policy() {
            cat <<JSON
          {
            "required_status_checks": null,
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "required_approving_review_count": ${REQUIRED_REVIEWS},
              "dismiss_stale_reviews": true
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_conversation_resolution": true,
            "required_linear_history": false
          }
          JSON
          }

          while IFS="$(printf '\t')" read repo branch; do
            [ -z "$repo" ] && continue

            cur=$(gh api "repos/${OWNER}/${repo}/branches/${branch}/protection" \
                    --jq '"checks=\(.required_status_checks.contexts|length) force=\(.allow_force_pushes.enabled) del=\(.allow_deletions.enabled)"' 2>/dev/null)
            if [ -n "$cur" ]; then state="protected[$cur]"; else state="UNPROTECTED"; fi

            if [ "$ONLY_UNPROTECTED" = "true" ] && [ "$state" != "UNPROTECTED" ]; then
              echo "  = ${repo}@${branch}: ${state} (skip, already protected)"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "  ~ ${repo}@${branch}: ${state} -> WOULD apply standard policy"
              continue
            fi

            out=$(policy | gh api -X PUT "repos/${OWNER}/${repo}/branches/${branch}/protection" --input - 2>&1)
            if [ $? -eq 0 ]; then
              echo "  + ${repo}@${branch}: applied"
            else
              echo "  ! ${repo}@${branch}: FAILED"
              echo "$out" | head -3 | sed 's/^/      /'
              case "$out" in
                *403*|*"Resource not accessible"*)
                  echo "      -> 403: App may lack Administration:write, or the fork" \
                       "is outside the minted scope. See github-app-permission-matrix.md §8." ;;
                *404*|*"Branch not found"*)
                  echo "      -> 404: tracked branch '${branch}' does not exist on ${repo}" \
                       "(fix .gitmodules)." ;;
              esac
            fi
          done < forks.tsv

          echo ""
          echo "Done. dry_run=${DRY_RUN} only_unprotected=${ONLY_UNPROTECTED} reviews=${REQUIRED_REVIEWS}"
          echo "Legend: ~ would-apply  + applied  = skipped(protected)  ! failed"
