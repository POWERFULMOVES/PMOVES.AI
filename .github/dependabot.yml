version: 2
updates:
  # Docker base images in service Dockerfiles
  - package-ecosystem: "docker"
    directory: "/pmoves/services"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Docker base images in shared docker assets
  - package-ecosystem: "docker"
    directory: "/pmoves/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions workflows — staggered to Wednesday to avoid Monday spike
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependencies for Agent Zero — staggered to Friday
  - package-ecosystem: "pip"
    directory: "/pmoves/services/agent-zero"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependencies for Archon — staggered to Friday
  - package-ecosystem: "pip"
    directory: "/pmoves/services/archon"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependencies for DeepResearch — staggered to Friday
  - package-ecosystem: "pip"
    directory: "/pmoves/services/deepresearch"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
