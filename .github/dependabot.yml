version: 2
# Grouping + auto-merge rationale (root-cause fix for stale-PR conflicts):
#   - Each ecosystem groups minor+patch updates into ONE PR per run, so a week's
#     bumps land as a single reviewable/mergeable unit instead of N PRs that go
#     stale against each other and against main (the #1764 17-file conflict).
#   - MAJOR updates are intentionally NOT grouped — they get individual PRs for
#     human review (and are excluded from auto-merge in dependabot-auto-merge.yml).
updates:
  # Docker base images in service Dockerfiles
  - package-ecosystem: "docker"
    directory: "/pmoves/services"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      docker-services-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Docker base images in shared docker assets
  - package-ecosystem: "docker"
    directory: "/pmoves/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      docker-shared-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions workflows — staggered to Wednesday to avoid Monday spike
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependencies for Agent Zero — staggered to Friday
  - package-ecosystem: "pip"
    directory: "/pmoves/services/agent-zero"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      agent-zero-pip-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # Runtime compatibility pin. See services/agent-zero/requirements.txt
      # (the comment block above `scipy<1.15`), and keep the two in sync — a
      # future editor who relaxes one should find the other.
      #
      # The base image (agent0ai/agent-zero-base) ships numpy 1.26.x. scipy
      # >=1.15 registers ufuncs (sph_legendre_p) that only exist under numpy
      # 2.x, and run_ui.py dies at import with "All ufuncs must have type
      # numpy.ufunc".
      #
      # Crucially, package METADATA does not express this: scipy 1.15 declares
      # numpy>=1.23.5,<2.5, so pip resolves it cleanly against numpy 1.26 and
      # the container breaks at runtime instead of at resolve time. That is
      # why a manual pin exists and why dependabot cannot be trusted to
      # respect it — #2804 proposed scipy<1.19, which admits both that silent
      # break (1.15-1.17) and a hard conflict (1.18 requires numpy>=2.0.0).
      #
      # Revisit only when the base image moves to numpy 2.x.
      - dependency-name: "scipy"
        versions: [">=1.15"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependencies for Archon — staggered to Friday
  - package-ecosystem: "pip"
    directory: "/pmoves/services/archon"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      archon-pip-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependencies for DeepResearch — staggered to Friday
  - package-ecosystem: "pip"
    directory: "/pmoves/services/deepresearch"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      deepresearch-pip-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
