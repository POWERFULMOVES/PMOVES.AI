version: 2
# Grouping + auto-merge rationale (root-cause fix for stale-PR conflicts):
#   - Each ecosystem groups minor+patch updates into ONE PR per run, so a week's
#     bumps land as a single reviewable/mergeable unit instead of N PRs that go
#     stale against each other and against main (the #1764 17-file conflict).
#   - MAJOR updates are intentionally NOT grouped — they get individual PRs for
#     human review (and are excluded from auto-merge in dependabot-auto-merge.yml).
updates:
  # Docker base images in service Dockerfiles
  - package-ecosystem: "docker"
    directory: "/pmoves/services"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      docker-services-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Docker base images in shared docker assets
  - package-ecosystem: "docker"
    directory: "/pmoves/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      docker-shared-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions workflows — staggered to Wednesday to avoid Monday spike
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependencies for Agent Zero — staggered to Friday
  - package-ecosystem: "pip"
    directory: "/pmoves/services/agent-zero"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      agent-zero-pip-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependencies for Archon — staggered to Friday
  - package-ecosystem: "pip"
    directory: "/pmoves/services/archon"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      archon-pip-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependencies for DeepResearch — staggered to Friday
  - package-ecosystem: "pip"
    directory: "/pmoves/services/deepresearch"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    open-pull-requests-limit: 10
    groups:
      deepresearch-pip-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
