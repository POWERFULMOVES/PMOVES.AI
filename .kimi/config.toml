# Kimi Code CLI configuration for PMOVES.AI operators.
# Launch with the project context:
#   make -C pmoves kimi
# Or manually:
#   kimi --config-file .kimi/config.toml --mcp-config-file .kimi/mcp.json

# Prefer the remote Kimi coding model when a Moonshot key is available;
# fall back to the local Ollama PMOVES default for offline work.
default_model = "pmoves/qwen3.5-35b"

default_thinking = false
default_yolo = false
default_plan_mode = false
show_thinking_stream = true

# Merge skills from .kimi/skills/ only (explicit allowlist).
# Do NOT auto-import from ~/.config/agents/skills/ or .claude/skills/ —
# those may contain stale or unvetted skills for other agent runtimes.
merge_all_available_skills = false

# PMOVES tasks (compose-split, image builds, long tests) can run for a while.
[loop_control]
max_steps_per_turn = 1000
max_retries_per_step = 3
max_ralph_iterations = 0
reserved_context_size = 50000
compaction_trigger_ratio = 0.85

[mcp.client]
tool_call_timeout_ms = 120000

# ---------------------------------------------------------------------------
# Remote provider: Moonshot / Kimi Code platform
# Set MOONSHOT_API_KEY in pmoves/env.shared (already expected by PMOVES.AI).
# Uncomment and adjust the model block once the key is in your environment.
# ---------------------------------------------------------------------------
# [providers.moonshot]
# type = "kimi"
# base_url = "https://api.kimi.com/coding/v1"
# api_key = "${MOONSHOT_API_KEY}"
#
# [models."kimi-k2.7-code"]
# provider = "moonshot"
# model = "kimi-k2.7-code"
# max_context_size = 262144
# capabilities = ["thinking"]
# display_name = "Kimi K2.7 Code"
#
# [models."kimi-for-coding"]
# provider = "moonshot"
# model = "kimi-for-coding"
# max_context_size = 262144
# capabilities = ["thinking"]
# display_name = "Kimi for Coding"

# ---------------------------------------------------------------------------
# Local provider: Ollama on the PMOVES node (SPARK, 4090, 5090, Z890, etc.)
# ---------------------------------------------------------------------------
[providers.ollama]
type = "openai_legacy"
base_url = "http://localhost:11434/v1"
api_key = "ollama"

# Hermes V4 8B — general reasoning / agent subordinate
[models."pmoves/hermes-v4-8b"]
provider = "ollama"
model = "hermes3:8b"
max_context_size = 131072
capabilities = ["thinking"]
display_name = "PMOVES Hermes V4 8B"

# Hermes V4 70B — deep reasoning, Spark-only
[models."pmoves/hermes-v4-70b"]
provider = "ollama"
model = "hermes3:70b"
max_context_size = 131072
capabilities = ["thinking"]
display_name = "PMOVES Hermes V4 70B (Spark)"

# Qwen 3.5 35B A3B — current local default / utility champion
[models."pmoves/qwen3.5-35b"]
provider = "ollama"
model = "qwen3.5:35b-a3b-q8_0"
max_context_size = 131072
capabilities = ["thinking"]
display_name = "PMOVES Qwen 3.5 35B"

# Nemotron 3 Super 120B — NVIDIA agent model, Spark-only
[models."pmoves/nemotron-super-120b"]
provider = "ollama"
model = "nemotron-3-super:120b"
max_context_size = 131072
capabilities = ["thinking"]
display_name = "PMOVES Nemotron 3 Super 120B"

# Gemma 4 31B — throughput champion
[models."pmoves/gemma4-31b"]
provider = "ollama"
model = "gemma4:31b"
max_context_size = 131072
capabilities = ["thinking"]
display_name = "PMOVES Gemma 4 31B"

# llama3.2 3B — fast test/edge model
[models."pmoves/llama3.2-3b"]
provider = "ollama"
model = "llama3.2:3b"
max_context_size = 131072
capabilities = []
display_name = "PMOVES Llama 3.2 3B"
