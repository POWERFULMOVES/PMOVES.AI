[project]
name = "pmoves-hirag-mcp"
version = "0.1.0"
description = "MCP bridge connecting Claude (Cowork/Code) to PMOVES.AI knowledge retrieval — Hi-RAG v2, Open Notebook, service health"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hirag_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
