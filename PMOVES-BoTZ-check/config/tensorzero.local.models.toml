# =============================================================================
# PMOVES-BoTZ TensorZero Gateway Configuration - Local Model Stack
# Schema: TensorZero 2026.1.1+
#
# This configuration integrates with the Hugging Face model catalog,
# supporting local models via Ollama and vLLM backends.
#
# Hardware Tiers:
#   - small: 3B-8B parameters, CPU/Edge
#   - medium: 7B-14B parameters, Single GPU
#   - large: 30B-70B parameters, Multi-GPU (TP)
# =============================================================================

[gateway]
bind_address = "0.0.0.0:3000"

# =============================================================================
# Ollama Provider (Local GGUF models)
# =============================================================================

[providers.ollama_local]
type = "openai"
api_base = "http://pmoves-ollama:11434/v1"
api_key_location = "none"

# For docked mode (when running inside same Docker network as parent PMOVES.AI)
[providers.ollama_docked]
type = "openai"
api_base = "http://ollama:11434/v1"
api_key_location = "none"

# For standalone mode (when running separately)
[providers.ollama_standalone]
type = "openai"
api_base = "http://host.docker.internal:11434/v1"
api_key_location = "none"

# =============================================================================
# vLLM Providers (Full precision models with TP)
# =============================================================================

# vLLM for Qwen 2.5 7B
[providers.vllm_qwen_7b]
type = "openai"
api_base = "http://vllm-qwen-7b:8000/v1"
api_key_location = "none"

# vLLM for Qwen 2.5 14B
[providers.vllm_qwen_14b]
type = "openai"
api_base = "http://vllm-qwen-14b:8000/v1"
api_key_location = "none"

# vLLM for Qwen 2.5 32B (TP=2)
[providers.vllm_qwen_32b]
type = "openai"
api_base = "http://vllm-qwen-32b:8000/v1"
api_key_location = "none"

# vLLM for Qwen 2.5 Coder 7B
[providers.vllm_coder_7b]
type = "openai"
api_base = "http://vllm-coder-7b:8000/v1"
api_key_location = "none"

# vLLM for Qwen 3 VL 8B
[providers.vllm_vl_8b]
type = "openai"
api_base = "http://vllm-vl-8b:8000/v1"
api_key_location = "none"

# =============================================================================
# Models - Small Tier (3B-8B, CPU/Edge)
# =============================================================================

# Phi 3 Mini - Fast, efficient, 128K context
[models.phi3_mini_local]
routing = ["ollama_local"]

[models.phi3_mini_local.providers.ollama_local]
type = "openai"
model_name = "phi3:3.8b-mini-128k-instruct"
api_base = "http://pmoves-ollama:11434/v1"
