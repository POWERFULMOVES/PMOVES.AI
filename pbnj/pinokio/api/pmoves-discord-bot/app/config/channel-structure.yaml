# CATACLYSM STUDIOS INC — Discord Server Structure
# This file drives idempotent server setup via setup.js
# Categories, channels, roles, and NATS event routing

roles:
  - name: DARKXSIDE
    color: "#E11D48"
    permissions: ["Administrator"]
    hoist: true
    position: 5
  - name: Faculty
    color: "#7C3AED"
    permissions: ["ManageChannels", "ManageMessages", "MoveMembers", "MuteMembers"]
    hoist: true
    position: 4
  - name: Builder
    color: "#2563EB"
    permissions: ["SendMessages", "ReadMessageHistory", "Connect", "Speak", "AttachFiles"]
    hoist: true
    position: 3
  - name: Contributor
    color: "#059669"
    permissions: ["SendMessages", "ReadMessageHistory", "Connect", "Speak", "AttachFiles"]
    hoist: true
    position: 2
  - name: Student
    color: "#6B7280"
    permissions: ["SendMessages", "ReadMessageHistory"]
    hoist: false
    position: 1

categories:
  - name: WELCOME
    min_role: null  # public
    channels:
      - name: welcome
        topic: "Welcome to CATACLYSM STUDIOS INC — agent card gallery + onboarding"
        type: text
      - name: waitlist
        topic: "Join the waitlist — email capture for gated access"
        type: text
      - name: announcements
        topic: "Automated feed from PMOVES.AI services"
        type: text
        webhook: true
        nats_subjects:
          - "content.published.v1"
          - "ingest.summary.ready.v1"
          - "ingest.transcript.ready.v1"

  - name: AGENTS
    min_role: Student
    channels:
      - name: agent-trails
        topic: "Graphiti signed trails — agent attribution + provenance"
        type: text
        webhook: true
        nats_subjects:
          - "agent.graphiti.signed.v1"
      - name: agent-cards
        topic: "ComfyUI-rendered agent identity cards"
        type: text
      - name: agent-chat
        topic: "Interactive agent — MCP-routed via BoTZ Gateway"
        type: text
      - name: agent-status
        topic: "Service health feed"
        type: text
        webhook: true
        nats_subjects:
          - "ops.health.check.v1"

  - name: CREATIVE
    min_role: Contributor
    channels:
      - name: beats-lab
        topic: "Upload beats for CHIT analysis + visualization"
        type: text
      - name: render-lab
        topic: "ComfyUI render requests + results"
        type: text
        webhook: true
        nats_subjects:
          - "render.complete.v1"
      - name: voice-lab
        topic: "TTS demos — 14 engines via Flute-Gateway"
        type: text
      - name: song-lab
        topic: "Music generation — ACE-Step + SongGeneration-Studio"
        type: text

  - name: RESEARCH
    min_role: Contributor
    channels:
      - name: deep-research
        topic: "DeepResearch results + video content reviews"
        type: text
        webhook: true
        nats_subjects:
          - "research.deepresearch.result.v1"
      - name: knowledge-base
        topic: "Hi-RAG query bot — !ask your question"
        type: text
      - name: cipher-memory
        topic: "Agent memory queries + knowledge graph exploration"
        type: text
      - name: tokenism-lab
        topic: "Tokenism simulation results + validated ideas"
        type: text
        webhook: true
        nats_subjects:
          - "tokenism.simulation.result.v1"
          - "tokenism.cgp.ready.v1"

  - name: BUILDERS
    min_role: Builder
    channels:
      - name: dev-updates
        topic: "CI/CD notifications + PR status"
        type: text
        webhook: true
        nats_subjects:
          - "ops.pr.monitor.completed.v1"
      - name: pinokio-apps
        topic: "Launcher links + Pinokio app discovery"
        type: text
      - name: docker-status
        topic: "Container health + deployment status"
        type: text
      - name: pr-review
        topic: "PR monitor + CodeRabbit review threads"
        type: text

  - name: VOICE
    min_role: Contributor
    channels:
      - name: agent-voice
        topic: "Live agent TTS/STT — voice interaction"
        type: voice
      - name: beats-room
        topic: "Audio playback + beat analysis"
        type: voice
      - name: research-lab
        topic: "Voice-driven research queries"
        type: voice
