[project]
name = "pmoves-nats-mcp"
version = "0.1.0"
description = "MCP bridge connecting Claude Code CLI to the PMOVES.AI NATS event bus"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "nats-py>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nats_mcp"]
