---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-tier-policy
  namespace: pmoves
  labels:
    tier: api
    app.kubernetes.io/part-of: pmoves
spec:
  podSelector:
    matchLabels:
      tier: api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow external traffic from ingress controller / load balancer
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx  # Adjust for your ingress
    ports:
    - protocol: TCP
      port: 8080  # Agent Zero
    - protocol: TCP
      port: 8091  # Archon
    - protocol: TCP
      port: 8077  # PMOVES.YT
    - protocol: TCP
      port: 8099  # SupaSerch
    - protocol: TCP
      port: 3030  # TensorZero Gateway
    - protocol: TCP
      port: 8092  # PMOVES-DoX
  # Allow from monitoring tier
  - from:
    - namespaceSelector:
        matchLabels:
          name: pmoves
      podSelector:
        matchLabels:
          tier: monitoring
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8091
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow connections to app-tier services
  - to:
    - namespaceSelector:
        matchLabels:
          name: pmoves
      podSelector:
        matchLabels:
          tier: app
    ports:
    - protocol: TCP
      port: 8086  # Hi-RAG Gateway v2
    - protocol: TCP
      port: 8083  # Extract Worker
    - protocol: TCP
      port: 8084  # LangExtract
  # Allow connections to bus-tier (NATS)
  - to:
    - namespaceSelector:
        matchLabels:
          name: pmoves
      podSelector:
        matchLabels:
          tier: bus
    ports:
    - protocol: TCP
      port: 4222  # NATS
  # Allow connections to data-tier services
  - to:
    - namespaceSelector:
        matchLabels:
          name: pmoves
      podSelector:
        matchLabels:
          tier: data
    ports:
    - protocol: TCP
      port: 6333  # Qdrant
    - protocol: TCP
      port: 7474  # Neo4j HTTP
    - protocol: TCP
      port: 7687  # Neo4j Bolt
    - protocol: TCP
      port: 7700  # Meilisearch
  # Allow external API calls (LLM providers, etc.)
  # HYBRID APPROACH: Explicit allow-list for external APIs
  # Intra-cluster communication handled separately via namespaceSelector below
  - to:
    - ipBlock:
        cidr: api.openai.com/32
    ports:
    - protocol: TCP
      port: 443   # HTTPS only
  - to:
    - ipBlock:
        cidr: api.anthropic.com/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - ipBlock:
        cidr: api.venice.ai/32
    ports:
    - protocol: TCP
      port: 443
  # Add more external APIs here as needed:
  # - ipBlock: api.cohere.com/32
  # - ipBlock: api.googleapis.com/32
  # - ipBlock: github.com/32
  # Allow intra-cluster communication (for services within same namespace)
  - to:
    - namespaceSelector: {}
      podSelector: {}
    ports:
    - protocol: TCP
      port: 443   # HTTPS
    - protocol: TCP
      port: 80    # HTTP
