<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beats Constellation — DARKXSIDE catalog star-chart</title>
<style>
  :root {
    --ground:#070912; --surface:#0c1120; --panel:#0e1526; --ink:#eaeefb; --ink-dim:#99a3bd;
    --ink-mute:#5f6b88; --hairline:#1b2540; --hover:#ffffff;
    --allegro-bright:#c98500; --moderato-bright:#3987e5; --allegro-deep:#d55181; --star-glow:0.9;
    --live-bar:#c98500; --live-glow:0.95;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground:#eef1f8; --surface:#ffffff; --panel:#f7f9fe; --ink:#0c1122; --ink-dim:#55607a;
      --ink-mute:#8b94ab; --hairline:#dde3f0; --hover:#0c1122;
      --allegro-bright:#b57500; --moderato-bright:#2a78d6; --allegro-deep:#c53c74; --star-glow:0.55;
      --live-bar:#b57500; --live-glow:0.7;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 90% at 80% 8%, color-mix(in oklab, var(--allegro-bright) 9%, transparent), transparent 60%),
      radial-gradient(120% 90% at 10% 92%, color-mix(in oklab, var(--moderato-bright) 10%, transparent), transparent 60%),
      var(--ground);
  }
  canvas { display: block; width: 100%; height: 100%; }

  .title {
    position: absolute; top: 12px; right: 14px; text-align: right; pointer-events: none;
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }
  .title .k { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--moderato-bright); font-weight: 600; }
  .title .n { font-size: 13px; color: var(--ink); font-weight: 600; margin-top: 2px; }
  .title .s { font-size: 11px; color: var(--ink-mute); }

  .legend {
    position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px;
    background: color-mix(in oklab, var(--panel) 80%, transparent);
    border: 1px solid var(--hairline); border-radius: 10px; padding: 9px 11px;
    backdrop-filter: blur(7px); font-size: 12px; max-width: 190px;
  }
  .legend .lg-title { font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-mute); }
  .lg-row { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 1px 2px; border-radius: 5px; }
  .lg-row:hover { background: color-mix(in oklab, var(--ink) 8%, transparent); }
  .lg-row.off { opacity: 0.36; }
  .lg-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 8px 1px currentColor; }
  .lg-label { color: var(--ink); flex: 1; }
  .lg-count { color: var(--ink-mute); font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }

  .readout {
    position: absolute; bottom: 12px; left: 12px; right: 12px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: color-mix(in oklab, var(--panel) 84%, transparent);
    border: 1px solid var(--hairline); border-radius: 10px; padding: 8px 12px;
    backdrop-filter: blur(7px); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
    min-height: 40px; transition: border-color .2s;
  }
  .readout.live { border-color: color-mix(in oklab, var(--focus-col, var(--ink)) 55%, var(--hairline)); }
  .ro-name { color: var(--ink); font-weight: 600; font-family: system-ui, sans-serif; font-size: 13px; }
  .ro-hint { color: var(--ink-mute); }
  .ro-field { color: var(--ink-dim); white-space: nowrap; }
  .ro-field b { color: var(--ink); font-weight: 600; }
  .ro-chip { color: var(--ground); background: var(--focus-col, var(--ink)); border-radius: 5px; padding: 1px 7px; font-size: 10.5px; font-weight: 600; }
  .ro-play { color: var(--focus-col, var(--moderato-bright)); font-size: 11px; cursor: pointer; text-decoration: underline; }

  .tip {
    position: fixed; pointer-events: none; z-index: 40; opacity: 0; transform: translateY(4px);
    transition: opacity .12s; background: var(--panel); border: 1px solid var(--hairline);
    border-radius: 9px; padding: 7px 10px; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px; max-width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .tip.on { opacity: 1; transform: translateY(0); }
  .tip .t-name { font-family: system-ui, sans-serif; font-weight: 600; color: var(--ink); font-size: 13px; display:block; margin-bottom: 3px; }
  .tip .t-row { color: var(--ink-dim); }
  .tip .t-row b { color: var(--ink); }
  .tip .t-play { display:block; margin-top:4px; color: var(--moderato-bright); font-size:11px; }

  /* Live FFT spectrum bar overlay */
  .fft-overlay {
    position: absolute; bottom: 60px; left: 12px; right: 12px; height: 36px;
    display: flex; align-items: flex-end; gap: 1px; pointer-events: none;
    opacity: 0; transition: opacity .3s;
  }
  .fft-overlay.on { opacity: 0.7; }
  .fft-bar { flex: 1; background: var(--live-bar); border-radius: 1px; min-height: 1px; box-shadow: 0 0 4px var(--live-glow); }

  .now-playing {
    position: absolute; top: 70px; right: 14px;
    background: color-mix(in oklab, var(--panel) 85%, transparent);
    border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 10px;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    display: none; align-items: center; gap: 8px;
  }
  .now-playing.on { display: flex; }
  .now-playing .np-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--allegro-deep); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  @media (max-width: 560px) { .legend { display: none; } .title { left: 12px; right: auto; text-align: left; } }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="sky" aria-label="Star chart of DARKXSIDE tracks positioned by tempo, grouped into constellations"></canvas>
    <div class="title">
      <div class="k">DARKXSIDE · beats-to-cgp</div>
      <div class="n">Catalog Star-Chart</div>
      <div class="s" id="subtitle">Loading...</div>
    </div>
    <div class="now-playing" id="nowPlaying"><span class="np-dot"></span><span id="npText"></span></div>
    <div class="legend" id="legend"><div class="lg-title">Families</div></div>
    <div class="fft-overlay" id="fftOverlay"></div>
    <div class="readout" id="readout"><span class="ro-hint">Hover a star - tempo, family, key. Click to play.</span></div>
  </div>
  <audio id="player" crossorigin="anonymous"></audio>
  <div class="tip" id="tip"></div>

<script type="module">
import Meyda from 'https://esm.sh/meyda@0.7.3';

let TRACKS = [];
try {
  const resp = await fetch('tracks.json');
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  TRACKS = await resp.json();
} catch (e) {
  console.error('Failed to load tracks.json:', e);
  document.getElementById('readout').innerHTML =
    '<span class="ro-hint">No track data. Run: beats_to_cgp.py export-hyperdim</span>';
}

if (TRACKS.length === 0) throw new Error('No track data loaded');

const FAMILY_COLORS = [
  {varname:"--allegro-bright"}, {varname:"--moderato-bright"}, {varname:"--allegro-deep"},
  {varname:"--star-glow"},
];
const FAMILIES = [...new Set(TRACKS.map(t=>t.family))].map((fid,i) => ({
  id: fid, label: fid.replace(/-/g,' · '), varname: FAMILY_COLORS[i % FAMILY_COLORS.length].varname,
}));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const famColor = (fid) => { const f=FAMILIES.find(f=>f.id===fid); return f?css(f.varname):css("--star-glow"); };
function h01(str, salt){ let h=2166136261^salt; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);} h=(h>>>0); return (h%100000)/100000; }
const bpms=TRACKS.map(t=>t.bpm);
const BPM_MIN=Math.floor(Math.min(...bpms)-2), BPM_MAX=Math.ceil(Math.max(...bpms)+2);
const bpmToNx=(b)=>0.075+0.85*(b-BPM_MIN)/(BPM_MAX-BPM_MIN);
const GROUP_ORDER=[...new Set(TRACKS.map(t=>t.group))];
const gm={};
GROUP_ORDER.forEach(g=>{ const gt=TRACKS.filter(t=>t.group===g); gm[g]={family:gt[0].family,count:gt.length,meanBpm:gt.reduce((s,t)=>s+t.bpm,0)/gt.length}; });
const ordered=[...GROUP_ORDER].sort((a,b)=>{ const fa=FAMILIES.findIndex(f=>f.id===gm[a].family), fb=FAMILIES.findIndex(f=>f.id===gm[b].family); return fa-fb || gm[a].meanBpm-gm[b].meanBpm; });
ordered.forEach((g,i)=>{ const t=ordered.length>1?i/(ordered.length-1):0.5; gm[g].ny=0.13+0.74*t+(i%2?0.03:-0.03); });
const stars=TRACKS.map(t=>{ const m=gm[t.group]; const jx=(h01(t.name,7)-0.5)*0.05, jy=(h01(t.name,19)-0.5)*0.14;
  return {...t, nx:Math.min(0.96,Math.max(0.04,bpmToNx(t.bpm)+jx)), ny:Math.min(0.94,Math.max(0.06,m.ny+jy)), phase:h01(t.name,31)*Math.PI*2, twk:0.6+h01(t.name,5)*0.4}; });
const edges=[];
GROUP_ORDER.forEach(g=>{ const gs=stars.filter(s=>s.group===g);
  gs.forEach(s=>{ gs.filter(o=>o!==s).map(o=>({o,d:(o.nx-s.nx)**2+(o.ny-s.ny)**2})).sort((a,b)=>a.d-b.d).slice(0,2)
    .forEach(({o})=>{ if(!edges.some(e=>e.a===o&&e.b===s)) edges.push({a:s,b:o,group:g}); }); }); });

document.getElementById('subtitle').textContent =
  `${TRACKS.length} tracks · ${GROUP_ORDER.length} constellations · click to play`;

const canvas=document.getElementById("sky"), ctx=canvas.getContext("2d");
const tip=document.getElementById("tip"), readout=document.getElementById("readout");
const fftOverlay=document.getElementById("fftOverlay");
const nowPlaying=document.getElementById("nowPlaying");
const npText=document.getElementById("npText");
const player=document.getElementById("player");
let W=0,Hh=0,DPR=1,hovered=null; const disabled=new Set();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc=(s)=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

// Build FFT overlay bars
const FFT_BARS = 64;
const fftBars = [];
for (let i=0; i<FFT_BARS; i++) {
  const bar = document.createElement("div");
  bar.className = "fft-bar";
  fftOverlay.appendChild(bar);
  fftBars.push(bar);
}
let fftData = new Float32Array(FFT_BARS);
let meydaAnalyzer = null;
let audioCtx = null;
let mediaSource = null;
let playingGroup = null;

function resize(){ const r=canvas.getBoundingClientRect(); DPR=Math.min(window.devicePixelRatio||1,2); W=r.width; Hh=r.height;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(Hh*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); }
const X=(s)=>s.nx*W, Y=(s)=>s.ny*Hh;

async function playTrack(star) {
  if (!star.audio_url) { console.warn("No audio_url for", star.name); return; }
  playingGroup = star.group;
  // Stop current analyzer
  if (meydaAnalyzer) { try { meydaAnalyzer.stop(); } catch(e){} meydaAnalyzer = null; }
  player.pause();
  player.src = star.audio_url;
  try {
    await player.play();
    // Set up Web Audio + Meyda
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    // Reuse the MediaElementSource across tracks (can only create one per element)
    if (!mediaSource) {
      mediaSource = audioCtx.createMediaElementSource(player);
    }
    mediaSource.connect(audioCtx.destination);
    meydaAnalyzer = Meyda.createMeydaAnalyzer({
      audioContext: audioCtx,
      source: mediaSource,
      bufferSize: 512,
      featureExtractors: ["amplitudeSpectrum"],
      callback: (features) => {
        if (!features || !features.amplitudeSpectrum) return;
        const spectrum = features.amplitudeSpectrum;
        // Map raw spectrum bins to our FFT_BARS display bars
        const binSize = Math.floor(spectrum.length / FFT_BARS);
        for (let i=0; i<FFT_BARS; i++) {
          let sum = 0;
          for (let j=0; j<binSize; j++) {
            sum += spectrum[i * binSize + j] || 0;
          }
          const target = sum / binSize;
          fftData[i] = fftData[i] * 0.6 + target * 0.4;
        }
        // Update overlay
        for (let i=0; i<FFT_BARS; i++) {
          fftBars[i].style.height = `${Math.min(100, fftData[i] * 300)}%`;
        }
        fftOverlay.classList.add("on");
        nowPlaying.classList.add("on");
        const rms = fftData.reduce((s,v)=>s+v,0) / FFT_BARS;
        const centroidBin = fftData.indexOf(Math.max(...fftData));
        const centroidHz = Math.round(centroidBin * 22050 / (FFT_BARS * 2));
        npText.textContent = `${star.name} · ${centroidHz}Hz · RMS ${rms.toFixed(3)}`;
      },
    });
    meydaAnalyzer.start();
  } catch(e) {
    console.error("Playback/Meyda error:", e);
    nowPlaying.classList.add("on");
    npText.textContent = `${star.name} (no FFT)`;
  }
}

player.addEventListener("ended", () => {
  if (meydaAnalyzer) { try { meydaAnalyzer.stop(); } catch(e){} meydaAnalyzer = null; }
  playingGroup = null;
  fftOverlay.classList.remove("on");
  nowPlaying.classList.remove("on");
});

function draw(t){
  ctx.clearRect(0,0,W,Hh);
  ctx.strokeStyle=css("--hairline"); ctx.fillStyle=css("--ink-mute"); ctx.font="11px ui-monospace, monospace"; ctx.textAlign="center"; ctx.lineWidth=1;
  const bpmLo=Math.ceil(BPM_MIN/5)*5, bpmHi=Math.floor(BPM_MAX/5)*5;
  for(let b=bpmLo;b<=bpmHi;b+=5){ const x=bpmToNx(b)*W; ctx.globalAlpha=0.5; ctx.beginPath(); ctx.moveTo(x,Hh-28); ctx.lineTo(x,Hh-22); ctx.stroke(); ctx.globalAlpha=0.7; ctx.fillText(b,x,Hh-10); }
  ctx.globalAlpha=0.55; ctx.textAlign="left"; ctx.fillText("LARGO",8,Hh-10); ctx.textAlign="right"; ctx.fillText("PRESTO ->",W-8,Hh-10); ctx.globalAlpha=1; ctx.textAlign="start";
  edges.forEach(e=>{ if(disabled.has(e.a.family)||disabled.has(e.b.family)) return; const lit=hovered&&(hovered.group===e.group);
    ctx.strokeStyle=famColor(e.a.family); ctx.globalAlpha=lit?0.5:0.16; ctx.lineWidth=lit?1.3:0.8; ctx.beginPath(); ctx.moveTo(X(e.a),Y(e.a)); ctx.lineTo(X(e.b),Y(e.b)); ctx.stroke(); });
  ctx.globalAlpha=1;
  const glow=parseFloat(css("--star-glow"))||0.8;
  // Live audio reactivity: pulse stars in the playing group
  const playingRms = fftData.reduce((s,v)=>s+v,0) / FFT_BARS;
  stars.forEach(s=>{ if(disabled.has(s.family)) return; const c=famColor(s.family); const isH=hovered===s;
    const groupPulse = playingRms > 0.01 ? 1 + playingRms * 2 * (s.group === playingGroup ? 1 : 0.3) : 1;
    const tw=reduce?1:(0.82+0.18*Math.sin(t/900+s.phase)*s.twk); const r=(isH?4.6:2.4)*(0.9+0.2*tw)*groupPulse;
    ctx.shadowColor=c; ctx.shadowBlur=(isH?18:9)*glow*groupPulse; ctx.fillStyle=c; ctx.globalAlpha=isH?1:0.55+0.4*tw;
    ctx.beginPath(); ctx.arc(X(s),Y(s),r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    ctx.globalAlpha=1; ctx.fillStyle=css("--hover"); ctx.beginPath(); ctx.arc(X(s),Y(s),isH?1.8:0.9,0,Math.PI*2); ctx.fill();
    if(isH){ ctx.strokeStyle=css("--hover"); ctx.globalAlpha=0.85; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(X(s),Y(s),r+5,0,Math.PI*2); ctx.stroke(); } });
  ctx.globalAlpha=1; requestAnimationFrame(draw);
}
function pick(mx,my){ let best=null,bd=15*15; for(const s of stars){ if(disabled.has(s.family)) continue; const dx=X(s)-mx,dy=Y(s)-my,d=dx*dx+dy*dy; if(d<bd){bd=d;best=s;} } return best; }

canvas.addEventListener("mousemove",(e)=>{ const r=canvas.getBoundingClientRect(); const s=pick(e.clientX-r.left,e.clientY-r.top); hovered=s;
  if(s){ canvas.style.cursor="pointer"; const c=famColor(s.family);
    const timbre=s.timbre?` · ${s.timbre}`:"";
    const onset=s.onset_rate?` · onset ${s.onset_rate.toFixed(1)}/s`:"";
    const keyInfo=s.key?` · ${s.key} ${s.scale}`:"";
    const playHint = s.audio_url ? '<span class="t-play">Click to play -></span>' : '';
    tip.innerHTML=`<span class="t-name">${esc(s.name)}</span><span class="t-row">${s.family.replace("-"," · ")}${keyInfo}</span><br><span class="t-row"><b>${s.bpm.toFixed(1)}</b> BPM · δ <b>${s.delta.toFixed(3)}</b></span><br><span class="t-row">Hz <b>${s.hz.toFixed(2)}</b> · A <b>${s.A.toFixed(2)}</b>${timbre}${onset}</span>${playHint}`;
    tip.style.borderColor=c; tip.classList.add("on");
    const tw=tip.getBoundingClientRect(); let x=e.clientX+14,y=e.clientY+14;
    if(x+tw.width>innerWidth-8) x=e.clientX-tw.width-14; if(y+tw.height>innerHeight-8) y=e.clientY-tw.height-14;
    tip.style.left=x+"px"; tip.style.top=y+"px";
    readout.style.setProperty("--focus-col",c); readout.classList.add("live");
    const playCtl = s.audio_url ? '<span class="ro-play" id="playBtn">PLAY</span>' : '';
    readout.innerHTML=`<span class="ro-chip">STAR</span><span class="ro-name">${esc(s.name)}</span><span class="ro-field"><b>${s.family.replace("-"," · ")}</b></span><span class="ro-field tnum">${s.key||""} ${s.scale||""}</span><span class="ro-field tnum">tempo <b>${s.bpm.toFixed(1)}</b> BPM</span><span class="ro-field tnum">δ <b>${s.delta.toFixed(3)}</b> · Hz <b>${s.hz.toFixed(2)}</b></span>${playCtl}`;
    const pb=document.getElementById("playBtn"); if(pb) pb.onclick=()=>playTrack(s);
  } else { canvas.style.cursor="default"; tip.classList.remove("on"); readout.classList.remove("live"); readout.innerHTML=`<span class="ro-hint">Hover a star - tempo, family, key. Click to play.</span>`; }
});

canvas.addEventListener("click",(e)=>{ const r=canvas.getBoundingClientRect(); const s=pick(e.clientX-r.left,e.clientY-r.top); if(s) playTrack(s); });

canvas.addEventListener("mouseleave",()=>{ hovered=null; tip.classList.remove("on"); readout.classList.remove("live"); readout.innerHTML=`<span class="ro-hint">Hover a star - tempo, family, key. Click to play.</span>`; });
const legend=document.getElementById("legend");
FAMILIES.forEach(f=>{ const n=TRACKS.filter(t=>t.family===f.id).length; const row=document.createElement("div");
  row.className="lg-row"; row.setAttribute("role","button"); row.tabIndex=0;
  row.innerHTML=`<span class="lg-dot" style="color:var(${f.varname})"></span><span class="lg-label">${f.label}</span><span class="lg-count tnum">${n}</span>`;
  const tg=()=>{ if(disabled.has(f.id)) disabled.delete(f.id); else disabled.add(f.id); row.classList.toggle("off",disabled.has(f.id)); };
  row.addEventListener("click",tg); row.addEventListener("keydown",(e)=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();tg();} });
  legend.appendChild(row); });
new ResizeObserver(resize).observe(canvas);
resize(); requestAnimationFrame(draw);
</script>
</body>
</html>
