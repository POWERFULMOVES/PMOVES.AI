# CodeRabbit Configuration for PMOVES.AI
# Settings for automated code reviews on the hardened (production) branch

reviews:
  # Enable reviews on the default hardened branch
  review_status: true

  # Branches to review
  branches:
    - "PMOVES.AI-Edition-Hardened"
    - "feat/hardened-*"
    - "fix/hardened-*"

  # Disable reviews on these branches
  excluded_branches:
    - "main"
    - "origin/main"

# Documentation comment requirements
documentation:
  # Require docstrings for Python functions/classes
  coverage:
    minimum: 80
    patch: 80

# Language-specific settings
language: "python"

# Review depth settings
review:
  # Number of commits to review in a PR
  num_commits: 10

  # Include summary of PR
  summary: true

  # Enable line-by-line reviews
  line_comments: true
