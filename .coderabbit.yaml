# CodeRabbit configuration for PMOVES.AI
# Goal: actionable review on hardened branches with PMOVES-specific security focus.

language: "en-US"

reviews:
  review_status: true

  # ON DEMAND, not automatic -- because automatic is not available here.
  #
  # Measured 2026-08-29: CodeRabbit posts the same skip notice on every PR
  # regardless of branch --
  #
  #     "This repository does not receive automatic reviews because it has
  #      fewer than 10 stars."
  #
  # Checked across docs/, feat/ and chore/ branches (#2811, #2807, #2812,
  # #2818): identical notice on each, and ZERO inline review comments on any of
  # them. Every review in that window came from Codex alone.
  #
  # `enabled: true` therefore claimed a capability the account does not have,
  # and the branch list below read as coverage that was never delivered. That
  # is worse than no config: a reader checking "is this branch reviewed?" got
  # yes.
  #
  # Set false to match reality. Review is still available and is TRIGGERED PER
  # PR, from the checkbox in CodeRabbit's own comment:
  #
  #     - [ ] 🔍 Trigger review
  #
  # Use it when a diff warrants it -- like any other resource, in scope rather
  # than always-on. The `path_instructions` below are NOT wasted by this: they
  # apply whenever a review actually runs, however it was started.
  auto_review:
    enabled: false
    drafts: false

  # Kept for when auto-review becomes available (10+ stars, or a paid plan).
  # Inert today -- see the note above -- and left in place rather than deleted
  # so the intended scope is not lost, but it does NOT describe what happens now.
  branches:
    - "PMOVES.AI-Edition-Hardened"
    - "PMOVES.AI-Edition-Hardened-Integrations"
    - "PMOVES.AI-Edition-Hardened-v3-clean"
    - "pr/hirag-legacy-decoders-v3-clean"
    - "pr/*"
    - "feat/hardened-*"
    - "fix/hardened-*"
    - "feat/*"
    - "fix/*"
    - "gpu-*"
    - "remove-*"
    - "revert-*"

  excluded_branches:
    - "main"
    - "origin/main"

  # PMOVES hardening-aware review hints.
  path_instructions:
    - path: ".github/workflows/**"
      instructions: |
        Review for production hardening regressions:
        - Keep CodeQL + Trivy HIGH/CRITICAL gates intact.
        - Do not weaken StepSecurity or secret-handling paths.
        - Ensure token/registry logic still works for GHCR and PR workflows.

    - path: "pmoves/docker-compose*.yml"
      instructions: |
        Validate runtime security and operability:
        - Containers with published ports must bind to 0.0.0.0 in-container.
        - Flag hardcoded credentials/default secrets in environment blocks.
        - Preserve cross-platform bring-up behavior (Windows/WSL/Linux, amd64/arm64).

    - path: "pmoves/services/**"
      instructions: |
        Focus on PMOVES secret hardening conventions:
        - Prefer central env helpers and *_FILE secret loading paths.
        - Flag direct critical-secret reads and plaintext fallbacks.
        - Prioritize auth/bootstrap regressions affecting first-run onboarding.

    - path: "pmoves/chit/**"
      instructions: |
        Treat CHIT as security-sensitive:
        - Flag mismatches between documented crypto guarantees and implementation.
        - Prioritize key-derivation, nonce handling, and backward-compatibility risk.

    - path: "pmoves-cipher-mcp/**"
      instructions: |
        Review MCP bridge robustness:
        - Ensure tool handlers return valid MCP payload types.
        - Validate connection defaults against compose service endpoints.
        - Flag exception handling that can hide operational failures.

    - path: "pmoves/docs/**"
      instructions: |
        Check docs for operational accuracy:
        - Keep status claims aligned with evidence in runbooks and smokes.
        - Flag command drift across Windows/WSL/Linux instructions.
