# CodeRabbit Configuration for PMOVES.AI
# Settings for automated code reviews

reviews:
  # Enable reviews on the default hardened branch
  review_status: true

  # Branches to review
  branches:
    - "PMOVES.AI-Edition-Hardened"
    - "PMOVES.AI-Edition-Hardened-v3-clean"
    - "pr/hirag-legacy-decoders-v3-clean"
    - "pr/*"          # PR branches
    - "feat/hardened-*"
    - "fix/hardened-*"
    - "feat/*"          # Feature branches
    - "fix/*"           # Fix branches
    - "gpu-*"           # GPU orchestrator fixes
    - "remove-*"        # Submodule removals
    - "revert-*"        # Revert PRs

  # Disable reviews on these branches
  excluded_branches:
    - "main"
    - "origin/main"

# Language setting (locale for reviews)
language: "en-US"

# Documentation comment requirements
documentation:
  # Require docstrings for Python functions/classes
  coverage:
    minimum: 80
    patch: 80

# Review depth settings
review:
  # Number of commits to review in a PR
  num_commits: 10

  # Include summary of PR
  summary: true

  # Enable line-by-line reviews
  line_comments: true
