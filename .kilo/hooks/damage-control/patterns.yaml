# ---------------------------------------------------------------------------
# BASH DELETE ALLOWLIST
# ---------------------------------------------------------------------------
bashDeleteAllowlist:
  - pattern: '^[ \t]*rm[ \t]+((\./)?\.git/(config|index)\.lock[ \t]*)+$'
    reason: "Clear orphaned git internal lockfile(s) .git/config.lock|.git/index.lock"

# ---------------------------------------------------------------------------
# READ-ONLY PATHS
# ---------------------------------------------------------------------------
readOnlyPaths:
  # System directories
  - /etc/
  - /usr/
  - /bin/
  - /sbin/
  - /boot/
  - /root/

  # Shell history and config
  - ~/.bash_history
  - ~/.zsh_history
  - ~/.node_repl_history
  - ~/.bashrc
  - ~/.zshrc
  - ~/.profile
  - ~/.bash_profile

  # Lock files
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "Gemfile.lock"
  - "poetry.lock"
  - "Pipfile.lock"
  - "composer.lock"
  - "Cargo.lock"
  - "go.sum"
  - "flake.lock"
  - "bun.lockb"
  - "uv.lock"
  - "npm-shrinkwrap.json"
  - "*.lock"
  - "*.lockb"

  # Known Roads file-grant
  - "*.known-road-active"

  # Minified/compiled files
  - "*.min.js"
  - "*.min.css"
  - "*.bundle.js"
  - "*.chunk.js"

  # Build artifacts
  - dist/
  - build/
  - out/
  - .next/
  - .nuxt/
  - .output/
  - node_modules/
  - __pycache__/
  - .venv/
  - venv/
  - target/

  # PMOVES.AI - READ-ONLY
  - "pmoves/contracts/schemas/"
  - "pmoves/docs/PMOVESCHIT/contracts/"
  - "pmoves/supabase/migrations/"
  - "pmoves/db/migrations/"
  - "pmoves/services/*/config/"
  - "pmoves/docker-compose*.yml"
  - "pmoves/*/docker-compose*.yml"
  - ".claude/context/"
  - ".claude/learnings/"

# ---------------------------------------------------------------------------
# NO-DELETE PATHS
# ---------------------------------------------------------------------------
noDeletePaths:
  # KiloCode configuration
  - ~/.kilo/
  - .kilo/
  - kilo.json
  - .kilocode/
  - .kilocodemodes

  # License and legal
  - "LICENSE"
  - "LICENSE.*"
  - "COPYING"
  - "COPYING.*"
  - "NOTICE"
  - "PATENTS"

  # Project documentation
  - "README.md"
  - "README.*"
