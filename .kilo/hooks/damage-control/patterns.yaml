  - '^\s*rm\s+\S*\.git[/\\]worktrees[/\\][^/\\\s]+[/\\](AUTO_MERGE|MERGE_HEAD|MERGE_MSG)\s*$'
  - '^\s*rm\s+\S*\.git[/\\]\.MERGE_MSG\.swp\s*$'
  - 'env\.cgp\.json'
  - 'decode_secret_map'
