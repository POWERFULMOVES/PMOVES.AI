  - .gitattributes
  - .gitmodules

  # CI/CD configuration
  - .github/
  - .gitlab-ci.yml
  - .circleci/
  - Jenkinsfile
  - .travis.yml
  - azure-pipelines.yml

  # Docker configuration
  - Dockerfile
  - "Dockerfile.*"
