  - '^\s*(rmdir|rm)\s+\S*\.git[/\\](rebase-merge|rebase-apply)\s*$'
  - '^\s*(rmdir|rm)\s+\S*\.git[/\\]worktrees[/\\][^/\\\s]+[/\\](rebase-merge|rebase-apply)\s*$'
