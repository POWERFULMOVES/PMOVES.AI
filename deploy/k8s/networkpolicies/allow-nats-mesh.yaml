apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nats-mesh
  namespace: pmoves
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 8222
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 8222
