apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress
  namespace: pmoves
spec:
  podSelector:
    matchLabels:
      role: gateway
  policyTypes:
    - Ingress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 443
