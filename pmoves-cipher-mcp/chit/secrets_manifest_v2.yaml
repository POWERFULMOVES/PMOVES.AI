# PMOVES.AI Cipher MCP Bridge CHIT Secrets Manifest
# CHIT Vault configuration for the Cipher MCP bridge service

api_version: "2.0"
environment: ${CHIT_ENVIRONMENT:-production}

# Secrets sources in order of precedence
sources:
  - type: env
    precedence: 50
  - type: chit_vault
    precedence: 100
    endpoint: ${CHIT_VAULT_ENDPOINT:-http://chit-vault:8050}

# Secrets required by the Cipher MCP bridge
variables:
  # === Service Identity ===
  - SERVICE_NAME
  - SERVICE_SLUG

  # === Cipher Memory Backend ===
  - CIPHER_URL

  # === Optional: NATS for service discovery ===
  # - NATS_URL

# Secret groups for different environments
groups:
  development:
    required:
      - SERVICE_NAME
      - CIPHER_URL
    optional:
      - LOG_LEVEL

  production:
    required:
      - SERVICE_NAME
      - SERVICE_SLUG
      - CIPHER_URL
    optional:
      - LOG_LEVEL

# Validation rules
validation:
  strict: false
  fail_on_missing_required: true
