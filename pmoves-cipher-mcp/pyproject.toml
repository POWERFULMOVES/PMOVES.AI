[project]
name = "pmoves-cipher-mcp"
version = "0.1.0"
description = "MCP bridge connecting Claude Code CLI to Cipher Memory"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "nats-py>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
